[language]
name = Română

[strings]
plugin.resources = Resources
plugin.resources.description = Gestionează resursele, proprietățile și prețurile personalizate opționale.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Resurse proprii cu Resources Plus: aceeași listă ca în original, în plugins\resources_plus.ini, fără blocarea jocului la ieșire.
resources_plus.save_warning = Modificările sunt scrise în plugins\resources_plus.ini când salvezi. Eliminarea unei resurse deja folosite într-o partidă salvată poate deteriora acea salvare.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Nevoi proprii ale cetățenilor cu Needs Plus: aceeași listă ca în original, în fișierul needs_plus.ini din dosarul plugins, preluată din needs.ini la prima pornire.
needs_plus.save_warning = Modificările sunt scrise în needs_plus.ini din dosarul plugins numai când salvezi. Fiecare nevoie adaugă un spațiu de depozitare magazinelor afectate, iar acesta face parte din salvarea jocului. Testează mai întâi pe o copie.
tab.resources.editor = Resurse
group.resource_definitions = Definiții ale resurselor
detail.transport = Clasa de transport
detail.transport.description = Stabilește ce vehicule și depozite pot transporta și păstra resursa. Este suficient să alegi un nume; pluginul adaugă valorile jocului de bază pentru acea clasă.
detail.kind = Categoria de preț
detail.kind.description = 0 materii prime, 1 produse fabricate, 2 alimente/îmbrăcăminte, 3 materiale avansate, 4 electronice.
detail.record_price = Prețul inițial din înregistrare
detail.record_price.description = Valori inițiale opționale în RUB și USD în înregistrarea resursei.
detail.record_base_price = Prețul de bază inițial din înregistrare
detail.record_base_price.description = Valori de bază opționale în RUB și USD în înregistrarea resursei.
detail.trade_mult = Multiplicatori comerciali
detail.trade_mult.description = Multiplicatori de vânzare și cumpărare, în mod normal 0.95 și 1.05.
detail.market_rub = Blocul de piață RUB
detail.market_usd = Blocul de piață USD
detail.market.description = Două valori de piață și un coeficient opțional.\n(Vezi descrierea din fișierul INI)
detail.packed = Marfă ambalată
detail.packed.description = Reprezentare automată a mărfii, marfă neambalată sau ambalată.
detail.family = Familia materialului
detail.family.description = Stabilește aspectul materialului adunat în grămezi pe șantier și, cel mai probabil, tipul de deșeu în care se transformă. Fiecare familie conține o resursă de deșeuri. Numerele de la 10 la 19 din INI sunt afișate prin nume.
detail.cargo = Geometria mărfii
detail.cargo.description = Selectarea geometriei folosite pentru vizualizarea mărfii.
detail.pinned_base_price = Preț de bază fix
detail.pinned_base_price.description = Valoare opțională în RUB și USD în [base_price]. Un câmp gol înseamnă că nu există o intrare personalizată.
detail.forced_price = Preț final impus
detail.forced_price.description = Valoare opțională în RUB și USD în [price]. Dacă este gol, jocul calculează prețul.

; --- Scheme locale pentru pluginurile originale instalate (din 0.13.0) ---
daynight.description = Un răsărit și un apus în fiecare zi calendaristică. În jocul de bază, trecerea de la zi la noapte și înapoi durează 13 zile calendaristice, aproape două săptămâni. Cu acest plugin, încape într-o singură zi.
daynight.group.cycle = Zi și noapte
daynight.group.cycle.description = Durata ciclului zi-noapte și momentul în care vine noaptea.
daynight.group.pace = Ritm
daynight.group.pace.description = Două reglaje separate: unul pentru vehicule și unul pentru tot restul. Se aplică întotdeauna, indiferent de setările de mai sus.
daynight.group.diagnostics = Depanare
daynight.enabled.label = Plugin activat
daynight.enabled.description = ON activează ciclul zi-noapte configurat.
daynight.cycle_days.label = Zile calendaristice pe ciclu zi-noapte
daynight.cycle_days.description = Numărul de zile calendaristice de la un răsărit la următorul.\n1 = un răsărit și un apus în fiecare zi\nDe la 2 la 12 = un ciclu proporțional mai lung\n13 = ciclul jocului de bază
daynight.day_scale.label = Durata zilei (factorul de încetinire a calendarului)
daynight.day_scale.description = De câte ori durează mai mult o zi calendaristică față de jocul de bază.\nauto = încetinește automat calendarul pentru a se potrivi ciclului de lumină; recomandat\n1 = nu încetinește calendarul; ziua și noaptea alternează atunci de 13 ori mai repede\nDe la 2 la 100 = încetinește calendarul cu acest factor\nAlege ce părți ale jocului încetinesc la „Ce se încetinește”.
daynight.slow.label = Ce se încetinește
daynight.slow.description = Stabilește ce părți ale jocului încetinesc.\ncalendar = încetinește doar calendarul; recomandat\nworld = încetinește totul, inclusiv cetățenii și vehiculele; valorile mari dau un efect de mișcare lentă\nnone = nu încetinește nimic\nCu calendar, cetățenii, vehiculele, construcțiile și producția își păstrează viteza normală. Procesele zilnice, precum poluarea, împrumuturile și mesajele, își păstrează intervalul obișnuit.
daynight.offset.label = Când vine noaptea
daynight.offset.description = Deplasează noaptea în cadrul zilei calendaristice.\n0 = întunericul începe puțin după mijlocul zilei\n0.5 = întunericul începe la schimbarea datei\nLa orice valoare diferită de 0, un ciclu de 13 zile nu mai corespunde exact jocului de bază.
daynight.fade.label = Adaptează tranzițiile de lumină
daynight.fade.description = ON scurtează tranzițiile dintre dimineață, zi, seară și noapte pentru a se potrivi ciclului configurat.\nOFF folosește tranzițiile lente ale jocului de bază. La cicluri scurte, acestea se pot suprapune și pot face iluminarea să pară ștearsă.
daynight.vehicle_scale.label = Viteza vehiculelor
daynight.vehicle_scale.description = Viteza camioanelor, trenurilor, navelor și aeronavelor. Funcționează independent de celelalte setări.\n1 = viteza jocului de bază\n2 = jumătate din viteză\n0.5 = viteză dublă\nValoare mai mare = vehicule mai lente
daynight.sim_scale.label = Viteza tuturor celorlalte elemente
daynight.sim_scale.description = Viteza cetățenilor, construcțiilor, producției, uzurii și animațiilor.\n1 = viteza jocului de bază\n2 = jumătate din viteză\n0.5 = viteză dublă\nValoare mai mare = simulare mai lentă
daynight.probe.label = Scrie durata zilelor în jurnal
daynight.probe.description = ON scrie durata reală a fiecărei zile calendaristice și tranziții de lumină în tesmioloader.log. Folosește doar pentru depanare și verificări după o actualizare a jocului.
walking.description = Cât de departe merg cetățenii pe jos și cât de departe conduc proprietarii de mașini între casă, locul de muncă și parcare.
walking.group.distances = Distanțe
walking.group.distances.description = Măsurate de-a lungul drumurilor și aleilor pietonale, nu în linie dreaptă. O clădire aflată la 400 m pe celălalt mal al râului poate însemna un drum de 1200 m pe jos.
walking.group.diagnostics = Depanare
walking.enabled.label = Plugin activat
walking.enabled.description = ON activează distanțele configurate pentru mersul pe jos și cu mașina.
walking.distance.label = Distanța de mers pe jos (m)
walking.distance.description = Cel mai lung traseu pe care îl parcurge un cetățean pe jos. Jocul de bază folosește 480 m.\nValoare mai mare = mai multe clădiri accesibile pe jos și mai multe conexiuni create la construire\n0 = fără limită; construirea într-un oraș mare poate dura atunci câteva secunde\n20000 = cea mai mare valoare acceptată
walking.car_distance.label = Distanța de deplasare a proprietarilor de mașini (m)
walking.car_distance.description = Cel mai lung drum permis între casă, locul de muncă și parcare. Jocul de bază folosește 2500 m.\nValoare mai mare = proprietarii de mașini conduc mai departe\nSetează o valoare peste distanța de mers pe jos. La valori egale, mașina nu oferă un avantaj de distanță.
walking.regen_on_load.label = Reface conexiunile la încărcarea unei salvări
walking.regen_on_load.description = Conexiunile pietonale și de parcare sunt stocate în salvarea jocului.\nON reface toate conexiunile la încărcare, astfel încât distanțele configurate să afecteze și orașele existente.\nOFF aplică distanțele configurate numai clădirilor nou construite.
walking.probe.label = Scrie valorile de verificare în jurnal
walking.probe.description = ON scrie în tesmioloader.log valorile găsite în joc înainte ca pluginul să le schimbe. Folosește doar pentru depanare și verificări după o actualizare a jocului.
accumulator.description = Baterii pentru rețeaua electrică. O clădire cu un rezervor mare de energie se încarcă atunci când există surplus de electricitate și o restituie când lipsește.
accumulator.group.battery = Baterie
accumulator.group.battery.description = Ce clădiri sunt considerate baterii și cât de repede se încarcă și se descarcă.
accumulator.group.window = Fereastra clădirii
accumulator.group.grid = Rețea electrică
accumulator.group.diagnostics = Depanare
accumulator.enabled.label = Plugin activat
accumulator.enabled.description = ON activează încărcarea și descărcarea clădirilor-baterie.\nOFF oprește descărcarea. Clădirile rămân și se pot încărca în continuare.
accumulator.building_types.label = Tipuri de clădiri
accumulator.building_types.description = Tipuri de clădiri care pot funcționa ca baterii. Separă mai multe numere prin virgule.\n19 = transformator\n18 = substație\nNu folosi 17: o centrală nu poate primi electricitate și nu s-ar încărca niciodată.
accumulator.min_capacity.label = Capacitatea minimă pentru a fi considerată baterie
accumulator.min_capacity.description = Capacitatea minimă de stocare pentru ca o clădire să fie considerată baterie. Exclude micile rezerve ale substațiilor obișnuite.\nValoare mai mare = mai puține clădiri considerate baterii\nValoare mai mică = mai multe clădiri considerate baterii\nClădirea „Stationary Accumulator” inclusă are capacitatea 5000.
accumulator.charge_rate.label = Viteza de încărcare (putere pe secundă)
accumulator.charge_rate.description = Cantitatea maximă de electricitate primită de o baterie pe secundă. Limita împiedică o baterie goală să ia electricitatea unui oraș întreg.\nValoare mai mare = încărcare mai rapidă și sarcină mai mare asupra rețelei\nValoare mai mică = încărcare mai lentă și sarcină mai mică\nPentru comparație, o centrală pe cărbune furnizează 70, iar o turbină eoliană 15.
accumulator.discharge_rate.label = Viteza de descărcare (putere pe secundă)
accumulator.discharge_rate.description = Cantitatea maximă de electricitate furnizată de o baterie pe secundă. Furnizează numai când rețeaua are un deficit.\nValoare mai mare = acoperă deficite mai mari de putere\nValoare mai mică = energia stocată durează mai mult\nExemplu: la 60, o baterie plină cu capacitatea 5000 înlocuiește o centrală pentru puțin peste 80 de secunde.
accumulator.panel.label = Rândul de încărcare din fereastra bateriei
accumulator.panel.description = ON adaugă nivelul de încărcare în fereastra bateriei, de exemplu „Incarcare: 4210.5 / 5000 (84.2 %)”.
accumulator.panel_caption.label = Eticheta acestui rând
accumulator.panel_caption.description = Cuvântul dinaintea nivelului de încărcare. Doar litere, fără diacritice sau caractere speciale, altfel jocul afișează caractere ilizibile.
accumulator.gauges.label = Calculează indicatoarele ferestrei pe baza bateriei
accumulator.gauges.description = ON înlocuiește afișajul incorect al jocului cu fluxul real de intrare și ieșire al bateriei.\nOFF folosește afișajul normal al jocului. Acesta poate arăta putere 0 și „fără alimentare electrică” în timp ce bateria se încarcă.
accumulator.spread_voltage.label = Experiment: transmite tensiunea vecinilor (lasă dezactivat)
accumulator.spread_voltage.description = ON nu are efect. Această funcție veche a fost înlocuită tehnic. Lasă pe OFF.
accumulator.trace.label = Înregistrează vecinii primei baterii
accumulator.trace.description = ON scrie în jurnal câtă electricitate primesc clădirile de lângă prima baterie. Doar pentru depanare; poate reduce performanța.
accumulator.log_seconds.label = Secunde între înregistrările bateriei
accumulator.log_seconds.description = Intervalul dintre mesajele despre starea bateriei din tesmioloader.log. Fiecare mesaj include încărcarea, intrarea și ieșirea.\n0 = fără mesaje de stare\nValoare mai mare = înregistrări mai rare
accumulator.probe.label = Secunde între listele de clădiri din jurnal
accumulator.probe.description = Intervalul dintre listele tuturor clădirilor cu stocare electrică din tesmioloader.log. Folosește doar când o baterie nu este recunoscută sau după o actualizare a jocului.\n0 = nu scrie aceste liste\nValoare mai mare = înregistrări mai rare
cities.description = Dimensiunea și forma fiecărui oraș. În jocul de bază, fiecare oraș este un cerc cu raza de 1000 m. Cu acest plugin setezi raza fiecărui oraș separat, opțional și forma pătrată, direct în fereastra orașului. Valorile sunt stocate în salvarea jocului.
cities.group.cities = Orașe
cities.group.slider = Glisorul razei
cities.group.slider.description = Intervalul glisorului din fereastra orașului și cât modifică un clic pe + sau -.
cities.group.layout = Dispunere în fereastra orașului
cities.group.layout.description = Poziția celor două rânduri noi în fereastra orașului. Numerele sunt poziții în unitatea proprie a ferestrei jocului; fereastra are aproximativ 500 lățime.
cities.group.overlay = Grilă de puncte pe sol
cities.group.diagnostics = Depanare
cities.enabled.label = Plugin activat
cities.enabled.description = ON activează dimensiuni și forme personalizate pentru orașe.
cities.window.label = Glisorul razei și caseta formei în fereastra orașului
cities.window.description = ON afișează glisorul razei și caseta pentru forma pătrată în fereastra orașului.\nOFF le ascunde pe ambele; valorile setate rămân, dar nu le mai poți modifica.
cities.adopt.label = Creează un oraș propriu pentru clădirile fără oraș
cities.adopt.description = Când micșorezi un oraș, unele clădiri pot rămâne în afară și nu mai aparțin niciunui oraș.\nON întemeiază pentru ele un oraș nou cu nume aleatoriu și data de azi, așa cum face jocul însuși.\nOFF le lasă fără oraș; comportamentul jocului în acest caz nu a fost testat.
cities.radius.label = Raza implicită (m)
cities.radius.description = Raza implicită a orașelor pe care nu le-ai configurat individual. Valoarea se aplică pe orice hartă.\n1000 = raza jocului de bază\nValoare mai mare = orașe mai mari\nValoare mai mică = orașe mai mici
cities.square.label = Formă pătrată implicită
cities.square.description = ON face pătrate orașele fără configurare individuală.\nOFF folosește un cerc, ca în jocul de bază.
cities.radius_min.label = Cea mai mică rază a glisorului (m)
cities.radius_min.description = Valoarea de la capătul stâng al glisorului.
cities.radius_max.label = Cea mai mare rază a glisorului (m)
cities.radius_max.description = Valoarea de la capătul drept al glisorului. Glisorul are 100 de pași; de la 200 la 5000, un pas reprezintă 48 m.
cities.step.label = Procent la fiecare clic pe buton
cities.step.description = Procentul din intervalul glisorului modificat printr-un clic pe + sau -. Nu se aplică la tragerea glisorului.\nValoare mai mare = modificare mai mare la fiecare clic\nValoare mai mică = modificare mai fină la fiecare clic
cities.label_x.label = Poziția etichetei
cities.label_x.description = Distanța etichetei față de marginea stângă a ferestrei.
cities.widget_x.label = Poziția comenzilor
cities.widget_x.description = Distanța glisorului și a casetei față de marginea stângă a ferestrei. Glisorul necesită aproximativ 225.
cities.checkbox_dy.label = Mută rândul casetei în sus sau în jos
cities.checkbox_dy.description = Mută caseta în sus sau în jos ca să nu se suprapună peste glisor.\nValoare mai mare = caseta mai jos\nValoare mai mică = caseta mai sus
cities.overlay.label = Adaptează suprapunerea la rază și formă
cities.overlay.description = Cât timp este deschisă o fereastră de oraș, jocul afișează o grilă de puncte albastre pe sol, dar numai pentru un cerc cu raza de 1000 m.\nON adaptează grila la raza și forma alese.\nOFF o lasă ca în jocul de bază.
cities.overlay_step.label = Distanța dintre punctele grilei suprapuse (m)
cities.overlay_step.description = Distanța dintre punctele care afișează limita orașului.\n0 = folosește automat o douăzecime din rază, cel puțin 50 m\nValoare mai mică = afișare mai densă și cost de performanță mai mare
cities.probe.label = Scrie orașele în jurnal
cities.probe.description = ON scrie raza, forma și numărul de clădiri al fiecărui oraș în tesmioloader.log după încărcare. Alte mesaje sunt scrise cât timp este deschisă o fereastră de oraș. Doar pentru depanare; jurnalul poate crește rapid.
depletion.description = Zăcămintele se epuizează. O mină în funcțiune extrage vizibil zăcământul de pe hartă și, cu cât rămâne mai puțin, cu atât produce mai puțin. Extracția este stocată în salvarea jocului; dacă dezactivezi pluginul ulterior, resursele extrase nu revin. Testează mai întâi pe o copie a salvării.
depletion.group.depletion = Extracție
depletion.group.window = Fereastra minei
depletion.group.diagnostics = Depanare
depletion.enabled.label = Plugin activat
depletion.enabled.description = ON permite epuizarea zăcămintelor selectate prin extracție.\nOFF oprește epuizarea suplimentară. Resursele deja eliminate nu sunt restabilite.
depletion.tonnes_per_texel.label = Tone pe punct de hartă
depletion.tonnes_per_texel.description = Tonele pe care o mină le poate extrage dintr-un punct complet plin al hărții resurselor. Punctele mai sărace oferă proporțional mai puțin.\nValoare mai mare = zăcămintele durează mai mult\nValoare mai mică = zăcămintele se epuizează mai repede\nPentru comparație, o mină cu raza de căutare de 210 m acoperă câteva mii de puncte de hartă.
depletion.vanilla.label = Zăcăminte epuizabile din jocul de bază
depletion.vanilla.description = Zăcăminte din jocul de bază care se pot epuiza. Separă mai multe valori prin virgule.\noil, iron, coal, uranium, bauxite, gravel = doar zăcămintele numite\nall = toate zăcămintele\nnone = niciun zăcământ din jocul de bază\nname:value = tone personalizate pe punct de hartă, de exemplu iron:3000\nZăcămintele din deposits.ini sunt întotdeauna incluse.\ngravel îndepărtează permanent textura vizibilă a solului și necesită o valoare mult mai mare din cauza zonei mici de căutare. Omite gravel pentru a-l păstra ca în jocul de bază.
depletion.flush_seconds.label = Secunde între salvările extracției
depletion.flush_seconds.description = Secunde între actualizările hărții resurselor. Producția și calitatea se schimbă imediat; doar minimapa și salvarea jocului urmează acest interval.\nValoare mai mică = actualizări mai dese și cost de performanță mai mare\nNu actualiza mai des de patru ori pe secundă.
depletion.panel.label = Rândul zăcământului rămas în fereastra minei
depletion.panel.description = ON afișează rezerva rămasă în fereastra minei și mărește puțin înălțimea ferestrei, de exemplu „Ramas: 251.4 kt / 259.3 kt (96.9 %)”.
depletion.panel_caption.label = Eticheta acestui rând
depletion.panel_caption.description = Cuvântul dinaintea cantității rămase. Doar litere, fără diacritice sau caractere speciale, altfel jocul afișează caractere ilizibile.
depletion.log_seconds.label = Intervalul înregistrărilor de progres (secunde)
depletion.log_seconds.description = Secunde între mesajele despre starea minelor din tesmioloader.log. Fiecare mesaj include cantitatea rămasă, cantitatea totală și calitatea.\n0 = fără mesaje de stare\nValoare mai mare = înregistrări mai rare\nUrmărește câteva zile de joc pentru a găsi o valoare potrivită de tone pe punct de hartă.
easystart.description = Nevoile cetățenilor apar treptat de-a lungul anilor. O nevoie încă nedeblocată nu influențează fericirea și sănătatea; cetățenii continuă să viziteze locurile respective și să cumpere, dar consecințele apar abia din anul stabilit.
easystart.group.general = Ce se amână
easystart.group.unlock = Ani de deblocare
easystart.group.unlock.description = Anul în care cerința începe să se aplice de la 1 ianuarie. Calendarul este conceput pentru o republică fondată în 1920. La un început în 1960, anii prestabiliți au trecut deja.\noff = nu amâna; comportamentul jocului de bază\nalways = aplică din prima zi de joc\nUn an = deblochează în acel an
easystart.group.diagnostics = Depanare
easystart.enabled.label = Plugin activat
easystart.enabled.description = ON deblochează nevoile și cerințele de utilități conform calendarului configurat.
easystart.demands.label = Amână cele nouă nevoi ale cetățenilor
easystart.demands.description = ON amână alimentele, carnea, îmbrăcămintea, electronicele, alcoolul, religia, cultura, sportul și sănătatea până la anii de deblocare configurați.
easystart.utilities.label = Amână cele trei utilități cerute de clădiri
easystart.utilities.description = ON amână cerințele de electricitate, apă și încălzire până la anii de deblocare configurați.
easystart.warnings.label = Amână avertismentele din fereastra clădirii
easystart.warnings.description = ON ascunde avertismentele asociate până la anul de deblocare, de exemplu „clădire fără alimentare electrică”.
easystart.pin_status.label = Menține satisfacția nevoilor blocate
easystart.pin_status.description = ON menține satisfacția unei nevoi blocate la valoarea de mai jos.\nOFF permite scăderea în continuare; satisfacția poate fi deja foarte mică la deblocarea nevoii.
easystart.locked_status.label = Satisfacția în timpul blocării
easystart.locked_status.description = Satisfacția cât timp nevoia este blocată. Pentru alimente, valoarea reprezintă sațietatea.\n1.0 = complet satisfăcut sau sătul\n0.5 = valoare medie, cu o îmbunătățire vizibilă după deblocare
easystart.clear_unsatisfied.label = Elimină nevoile blocate din lista celor nesatisfăcute
easystart.clear_unsatisfied.description = ON împiedică nevoile blocate să genereze mesajul „N cetățeni nu au putut obține X”.
easystart.probe.label = Scrie deblocările în jurnal
easystart.probe.description = ON scrie în tesmioloader.log nevoile care rămân blocate la fiecare schimbare de an. Înregistrează și primul cetățean afectat o singură dată. Doar pentru depanare.
easystart.food.label = Alimente
easystart.religion.label = Religie
easystart.meat.label = Carne
easystart.clothes.label = Îmbrăcăminte
easystart.alcohol.label = Alcool
easystart.sport.label = Sport
easystart.culture.label = Cultură
easystart.health.label = Sănătate
easystart.electricity.label = Electricitate
easystart.water.label = Apă (include canalizarea)
easystart.heating.label = Încălzire
easystart.electronics.label = Electronice
easystart.school.label = Școală
easystart.school.description = Înainte de acest an, copiii învață fără școală, ca în setarea de educație „Simplă” a jocului, iar mesajul „N copii nu pot merge la școală” nu apare.
easystart.kindergarten.label = Grădiniță
easystart.kindergarten.description = Înainte de acest an, niciun părinte nu trebuie să stea acasă pentru un copil sub șase ani, iar mesajul „N muncitori nu pot lucra deoarece toate grădinițele …” nu apare.
plugin.needs = Needs
plugin.needs.description = Gestionează nevoile suplimentare ale cetățenilor și opțiunile pluginului fără a edita fișierul original.
tab.needs.editor = Nevoi
group.needs = Nevoile cetățenilor
group.needs.plugin = Setările pluginului
group.needs.plugin.description = Opțiuni care se aplică tuturor nevoilor.
needs.list = Lista nevoilor
needs.add = Adaugă nevoie
needs.select_help = Selectează o nevoie în stânga sau folosește + pentru a adăuga o resursă înregistrată de Resources.
needs.resource = Resursă
needs.resource.help = Resursa pe care cetățenii vor trebui să o dorească. Trebuie să fie înregistrată în lista pluginului Resources.
needs.donor = Nevoie de referință
needs.donor.description = Nevoie existentă folosită ca model.\nfood sau meat = pentru magazine alimentare\nclothes sau eletronics = pentru magazine universale\nalcohol = pentru magazine de alcool\neletronics este forma folosită de joc.
needs.factor = Factor de cantitate
needs.factor.description = Cantitatea de mărfuri în raport cu nevoia de referință.\n1.0 = aceeași cantitate ca referința\nValoare mai mare = cetățenii au nevoie de mai mult\nValoare mai mică = cetățenii au nevoie de mai puțin
needs.category = Categoria magazinelor
needs.category.description = Magazinele care stochează mărfurile.\nauto = aceleași magazine ca pentru nevoia de referință\nnone = fără spațiu automat; o clădire trebuie să furnizeze singură mărfurile\nbasic = doar magazine de bază\nmedium = doar magazine medii\nadvanced = doar magazine mari\nmediumadvanced = doar magazine medii și mari\nhotel = doar hoteluri\nUn număr = scrie direct această valoare de magazin; doar pentru utilizatorii familiarizați cu fișierele jocului
needs.chance = Probabilitate
needs.chance.description = Probabilitatea de la 0 la 1 ca un cetățean să primească această nevoie. Sub 1, ea este distribuită independent de nevoia de referință.\n0 = niciun cetățean nu o primește\n1 = fiecare cetățean eligibil o primește
needs.unhappy = Nemulțumire
needs.unhappy.description = Satisfacția pierdută când un cetățean nu poate obține mărfurile.\n0 = fără pierdere; nevoia este doar afișată\nDe la 0.005 la 0.02 = interval tipic pentru un bun de confort\nInterval permis: de la 0 la 1
needs.enabled = Plugin activat
needs.enabled.description = ON activează pluginul.\nOFF îl dezactivează complet la următoarea pornire a jocului.
needs.demand = Atribuie nevoi
needs.demand.description = ON le atribuie cetățenilor noua nevoie.\nOFF nu distribuie nevoia, dar poate adăuga în continuare mărfurile în magazine.
needs.storage = Aprovizionează magazinele
needs.storage.description = ON adaugă mărfurile în magazinele selectate.\nOFF nu adaugă spații de depozitare; cetățenii pot găsi atunci mărfurile doar în clădiri care le furnizează singure.
needs.max_demands = Nevoi pe cetățean
needs.max_demands.description = Numărul maxim de nevoi suplimentare pe care un cetățean le poate avea simultan.\n1 = cel mult o nevoie suplimentară\n7 = numărul maxim permis
needs.when_full = Când limita de nevoi este atinsă
needs.when_full.description = Ce se întâmplă când un cetățean are deja numărul maxim de nevoi suplimentare.\nskip = așteaptă până se eliberează un loc\nreplace = înlocuiește de această dată nevoia de referință
needs.probe = Jurnal detaliat
needs.probe.description = ON scrie listele de nevoi ale cetățenilor și informațiile despre fiecare magazin în jurnalul detaliat al pluginului.\nOFF scrie doar avertismente. Activează temporar când verifici magazine noi.
needs.log_seconds = Intervalul mesajelor de progres (secunde)
needs.log_seconds.description = Secunde între mesajele care raportează câte nevoi au fost atribuite.\n0 = dezactivează aceste mesaje\nValoare mai mare = înregistrări mai rare
tab.needs.general = General
plugin.deposits = Deposits
plugin.deposits.description = Gestionează tipurile de zăcăminte absente din jocul de bază și opțiunile pluginului fără a edita fișierul original.
tab.deposits.general = General
tab.deposits.editor = Zăcăminte
group.deposits = Zăcăminte
group.deposits.description = Zăcămintele originale sunt protejate și pot fi ascunse; cele personalizate sunt stocate separat și îmbinate în fișierul deposits.ini folosit efectiv. Fiecare secțiune, cu excepția [deposits], reprezintă un zăcământ.
group.deposits.plugin = Setările pluginului
group.deposits.plugin.description = Cele trei subsisteme din secțiunea [deposits]. Fiecare este dezactivat pentru toate zăcămintele dacă opțiunea sa de aici este dezactivată.
deposits.notice = Numărul de tip al unui zăcământ, canalul său de hartă și tokenul din building.ini devin parte din salvarea jocului când o mină le folosește. Eliminarea sau renumerotarea unui zăcământ folosit de o salvare o poate face inutilizabilă; testează mai întâi pe o copie.
deposits.list = Lista zăcămintelor
deposits.add = Adaugă zăcământ
deposits.select_help = Selectează un zăcământ în stânga sau folosește + pentru a adăuga unul pentru o resursă înregistrată de Resources.
deposits.name = Zăcământ
deposits.name.help = Numele secțiunii din deposits.ini. Identifică zăcământul în jurnal și la pensula editorului; nu poate fi redenumit ulterior.
deposits.new_name = Numele zăcământului
deposits.new_hint = Aici sunt cerute doar setările standard. Restul (componentă, tip de clădire, epuizare) se găsește în setările din dreapta după adăugare.
deposits.code_patch = Modificarea codului
deposits.code_patch.description = ON introduce în joc tipurile de zăcăminte $TYPE_MINE_ configurate, astfel încât minele să le poată găsi prin building.ini. Dacă datele așteptate ale jocului nu mai corespund după o actualizare, pluginul nu modifică nimic.
deposits.minimap_all = Straturi ale minimapei
deposits.minimap_all.description = ON afișează un buton sub cele cinci butoane de minimapă ale jocului pentru fiecare zăcământ al pluginului activat individual.\nOFF ascunde toate butoanele zăcămintelor pluginului.
deposits.editor_all = Pensule ale editorului de teren
deposits.editor_all.description = ON afișează o pensulă de pictare și una de ștergere în fila Resurse a editorului de teren pentru fiecare zăcământ cu nume de pensulă.\nOFF ascunde toate pensulele zăcămintelor pluginului.
deposits.token = Tokenul clădirii
deposits.token.description = Tokenul folosit de o mină în building.ini pentru acest zăcământ, de exemplu $TYPE_MINE_COPPER. Introdu-l ca pe $TYPE_MINE_GRAVEL. Nu folosi niciodată două tokenuri de zăcământ în același building.ini.
deposits.type = Numărul de tip
deposits.type.description = Numărul de tip unic al zăcământului. Două zăcăminte nu pot folosi același număr.\nDe la 10 la 127 = interval permis\nDe la 0 la 9 = rezervate jocului de bază\nDialogul propune automat următorul număr liber.
deposits.map = Hartă
deposits.map.description = Harta pe care este stocat zăcământul.\nauto = alege automat un loc liber pe o hartă a pluginului; recomandat\nresourcemap sau resourcemap2 = folosește hărțile jocului de bază\nDe la resourcemap3 la resourcemap10 = folosește hărțile suplimentare ale pluginului\nterrain = folosește direct terenul pictat, de exemplu pentru pietriș; pensula apare sub ROCKS
deposits.component = Componentă
deposits.component.description = Fiecare hartă are patru locuri, de la 0 la 3. Fiecare loc poate conține un zăcământ.\nCu auto = lasă câmpul gol; pluginul alege un loc liber\nCu terrain: 2 = strat de pietriș\nCu terrain: 3 = strat de oază
deposits.building_type = Tipul clădirii
deposits.building_type.description = Tipul de clădire care poate extrage acest zăcământ.\n7 = mină; potrivit pentru aproape orice zăcământ\n92 = puț de apă\nCâmp gol = 7
deposits.radius = Raza de căutare
deposits.radius.description = Cât de departe caută o mină zăcământul.\noil, ore, bauxite, gravel, wood, water, watersurface = folosește constanta corespunzătoare din joc\nUn număr = folosește direct această distanță\nCâmp gol = folosește ore\nFără o rază, mina nu găsește niciun zăcământ.
deposits.icon = Pictograma minimapei
deposits.icon.description = Resursa a cărei pictogramă apare pe butonul minimapei. Pluginul folosește pictograma deja încărcată de joc; nu este necesară o imagine separată.\nResursele din pluginul Resources trebuie înregistrate acolo.\nCâmp gol = fără pictogramă
deposits.minimap = Buton pe minimapă
deposits.minimap.description = ON adaugă un buton pe minimapă și un strat suprapus pentru acest zăcământ.
deposits.editor = Numele pensulei editorului
deposits.editor.description = Numele pensulelor de pictare și ștergere din editorul de teren. Același nume este folosit pentru tool_paint_<name>.png și tool_erase_<name>.png în vfs\media_soviet\editor.\nCâmp gol = nu crea pensulă\nPermis: până la 31 de litere, cifre, _ și -
deposits.deplete = Epuizare pe texel
deposits.deplete.description = Această setare este citită de pluginul Depletion. Stabilește tonele pe care o mină le poate extrage dintr-un punct complet plin al hărții resurselor. Punctele mai sărace oferă proporțional mai puțin.\nValoarea înlocuiește tonnes_per_texel din plugins\depletion.ini.\n0 = acest zăcământ rămâne infinit\nCâmp gol = folosește valoarea globală
deposits.save_warning = Modificările sunt scrise în deposits.ini folosit efectiv numai la salvare. Numerele de tip, canalele hărții și tokenurile zăcămintelor deja folosite într-o salvare nu trebuie schimbate; testează mai întâi pe o copie.
depletion.tab.general = General
depletion.tab.mining = Extracție
needs.save_warning = Modificările sunt scrise în needs.ini folosit efectiv numai când salvezi. Fiecare nevoie adaugă un spațiu de depozitare magazinelor afectate, iar acesta face parte din salvarea jocului. Testează mai întâi pe o copie.
bp.name = Buildings Plus
bp.description = Clădiri noi dintr-o definiție: o clădire de referință din joc și liniile building.ini care diferă. Sunt scrise ca elemente Workshop complete la fiecare pornire a jocului.
bp.notice = Fiecare clădire devine un dosar în media_soviet\workshop_wip cu propriul ID Workshop. Lasă ID-ul gol, iar pluginul atribuie următorul număr liber începând de la 9300000000 la pornirea jocului și îl păstrează în plugins\buildings_plus.ids.ini. Jocul citește dosarul ca pe un element Workshop nepublicat. Modificările necesită o repornire completă. O salvare care conține o astfel de clădire are nevoie de dosar la încărcare.
bp.tab.general = General
bp.tab.buildings = Clădiri
bp.tab.generated = Clădiri generate
bp.wip = Clădiri generate în dosarul jocului
bp.wip.description = Afișează clădirile generate de Buildings Plus sau de pluginul buildings original în media_soviet\workshop_wip. Datele afișate aici sunt citite din dosare.
bp.wip.empty = Nu există încă nicio clădire generată aici. Clădirile sunt generate la pornirea jocului când cel puțin una este activată.
bp.group = Clădiri
bp.group.notice = O clădire de aici este o copie a unei clădiri din joc cu alte linii: același model, aceleași conexiuni, propria rețetă. Alege o referință de același fel (mină pentru mină, fabrică pentru fabrică).
bp.list = Clădiri
bp.add = Adaugă
bp.select_help = Selectează o clădire în stânga sau folosește + pentru a adăuga una. Mai întâi este cerută referința, ID-ul Workshop poate rămâne gol; numele și liniile se stabilesc apoi în dreapta.
bp.id = Numele obiectului
bp.id.help = Denumește dosarul și obiectul clădirii generate și apare în jurnal. Doar litere, cifre, _ și -, cel mult 64 de caractere; nu poate fi schimbat ulterior.
bp.save_warning = Modificările sunt scrise în buildings_plus.ini folosit efectiv numai la salvare și se aplică după o repornire completă a jocului. Pluginul scrie atunci dosarul în media_soviet\workshop_wip; o secțiune cu eroare este omisă și numită în jurnal.
bp.list.note = Cel mult 256 de clădiri.
bp.new_name = Numele obiectului
bp.new_hint = Spațiile devin liniuțe de subliniere, iar majusculele devin minuscule.
bp.card.folders = Dosare generate
bp.card.log = Depanare
bp.card.new = Clădire nouă
bp.links = Ghiduri
bp.link.readme = README (ghid)
bp.prune = Curăță dosarele
bp.prune.description = ON elimină la următoarea pornire a jocului dosarul generat al unei clădiri șterse sau dezactivate (doar dosarele create de acest plugin).\nOFF păstrează aceste dosare; jocul continuă să încarce clădirile.
bp.always = Rescrie întotdeauna
bp.always.description = ON scrie toate dosarele clădirilor la fiecare pornire a jocului.\nOFF scrie un dosar numai dacă secțiunea sa, pluginul sau un fișier de referință s-a schimbat. Lasă pe OFF.
bp.verbose = Jurnal detaliat
bp.verbose.description = ON scrie fiecare fișier copiat și fiecare linie eliminată din referință în logs\tesmioloader.buildings_plus.log.\nOFF scrie doar rezultatele, avertismentele și erorile.
bp.repair_owner_ids = Completează ID-ul proprietarului
bp.repair_owner_ids.description = ON completează ID-ul tău Steam în clădirile generate care nu au unul, inclusiv în cele ale altui generator. Fără el, jocul întreabă despre elemente Workshop lipsă la fiecare încărcare a unei salvări care folosește o astfel de clădire.\nOFF lasă nemodificate dosarele altor generatoare.
bp.card.saves = Salvări de joc
bp.card.saves.description = O salvare reține spațiile de depozitare ale fiecărei clădiri deja construite. Această opțiune permite aplicarea unei linii noi de depozitare a unei clădiri proprii și asupra exemplarelor existente.
bp.retrofit = Actualizează depozitarea clădirilor deja construite
bp.retrofit.description = ON: la încărcarea unei salvări, fiecare clădire generată finalizată primește, goale, spațiile pentru o singură resursă adăugate în secțiunea sa. Dacă schimbi capacitatea într-o linie de depozitare, se schimbă și spațiul; micșorarea așteaptă până când stocul încape. Un spațiu a cărui linie ai eliminat-o dispare din clădiri imediat ce se golește.\nOFF: depozitarea clădirilor deja construite rămâne neschimbată; liniile noi și modificate se aplică numai clădirilor construite ulterior.
bp.enabled = Clădire activată
bp.enabled.description = ON generează această clădire la următoarea pornire a jocului.\nOFF nu o generează. Dacă „Curăță dosarele” este activat, dosarul existent este eliminat la următoarea pornire.
bp.item_id = ID Workshop
bp.item_id.description = Se poate folosi un număr propriu: de la 9000000000 la 9999999999, cu excepția intervalului de la 9100000000 la 9199999999 (rezervat altor generatoare)\nDenumește dosarul din workshop_wip în dosarul jocului și nu trebuie schimbat ulterior.
bp.donor = Clădire de referință
bp.donor.description = Clădirea de la care pornește copia; pentru o clădire din Workshop trebuie să fii abonat la aceasta.\nFolosește „Alege referința...” pentru a căuta în clădirile disponibile. Potrivește tipul: mină pentru mină, fabrică pentru fabrică, magazin pentru magazin.
bp.item_name = Numele în joc
bp.item_name.description = Numele afișat în joc.\nO valoare cu puncte este considerată cheie de traducere și rezolvată prin pluginul Localization, de exemplu: localization.lang.salt_mine
bp.desc = Descriere
bp.desc.description = Descrierea elementului Workshop, câte o linie pe rândul câmpului. Fără ghilimele.
bp.line = Linii building.ini
bp.line.description = O linie building.ini pe rândul câmpului, de exemplu $PRODUCTION raw_salt 1.0. Folosește „Alege linia…” pentru a prelua o linie din clădirea de referință și a o ajusta. Liniile tale preced liniile referinței și înlocuiesc: același token; toate $TYPE_*; toate $STORAGE* împreună cu $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION și $CONSUMPTION_PER_SECOND ca o singură rețetă. Tot restul referinței rămâne.\nPentru resurse proprii folosește întotdeauna $STORAGE_IMPORT_SPECIAL sau $STORAGE_EXPORT_SPECIAL cu resursa numită, altfel depozitul listează toate resursele clasei de transport.
bp.strip = Elimină linii din referință
bp.cmd_add = Adaugă la sfârșit
bp.cmd_add.description = O comandă pe rând: o linie nouă introdusă înainte de închiderea finală a fișierului de referință. Un bloc cu mai multe linii se scrie cu | între ele.
bp.cmd_replace = Înlocuiește
bp.cmd_replace.description = O comandă pe rând: linie veche | linie nouă. Linia veche trebuie să apară exact o dată în fișierul de referință.
bp.cmd_remove = Elimină
bp.cmd_remove.description = O comandă pe rând: linia din fișierul de referință care trebuie eliminată. Liniile asociate (puncte, poziție) sunt eliminate împreună cu ea.
bp.cmd_insert = Inserează
bp.cmd_insert.description = O comandă pe rând: 0 sau 1 | linie de reper | linie nouă. 0 pune linia nouă înaintea reperului, 1 după el.
bp.strip.description = Un $TOKEN pe rând, de exemplu $WORKERS_NEEDED. Fiecare linie a referinței cu acel token este eliminată fără înlocuire.
bp.life = Rezistență
bp.life.description = Gol = 3000\nLIFE în renderconfig.ini: cât poate suporta clădirea înainte de a se prăbuși. Ca majoritatea clădirilor din joc.
bp.card.lines = Linii
bp.item_id.empty = pluginul atribuie următorul număr liber începând de la 9300000000 la pornirea jocului.
bp.item_name.empty = numele obiectului; nerecomandat.
needs_plus.card.log = Depanare
resources_plus.card.log = Depanare
resources_plus.card.plugin = Plugin
resources_plus.custom_report = Înregistrează clonele
resources_plus.custom_report.description = ON scrie pentru fiecare resursă cu o referință ce a moștenit efectiv clona (clasa de transport, factorii, indicatorii). Resursele fără referință sunt întotdeauna listate.\nOFF listează doar resursele fără referință.
resources_plus.customs_hook = Actualizează punctele vamale
resources_plus.customs_hook.description = ON adaugă resursele noi la lista comercială a punctelor vamale deja existente.\nOFF păstrează comportamentul jocului de bază: un punct vamal comercializează doar ce cunoștea când a fost construit; atunci ajută doar demolarea și reconstruirea.
resources_plus.customs_probe = Înregistrează intrările punctelor vamale
resources_plus.customs_probe.description = ON scrie în tesmioloader.log câte o linie pentru fiecare resursă adăugată unui punct vamal. Treci pe OFF când punctele vamale afișează resursele așteptate.
resources_plus.price_hook = Aplică prețurile din INI
resources_plus.price_hook.description = ON activează [base_price] și [price]: prețurile de bază sunt stabilite înainte de calculul prețurilor jocului, iar cele fixe după.\nOFF lasă prețurile în seama jocului.
resources_plus.price_report = Înregistrează tabelul prețurilor
resources_plus.price_report.description = ON scrie prețul, prețul de bază și categoria de preț a fiecărei resurse din listă în tesmioloader.log după fiecare calcul al prețurilor jocului. Un preț de 0.00 înseamnă că nicio clădire nu o produce.\nOFF nu scrie nimic.
tab.resources_plus.general = General
resources.heading.basics = Transport și categorie de preț
resources.heading.cargo = Marfă și material
resources.heading.fixed = Prețuri fixe
resources.heading.market = Valori de piață
resources.heading.prices = Prețuri în înregistrare

resources_plus.heading.names = Nume după limba jocului
detail.name_language.description = Numele acestei resurse când jocul rulează în această limbă. Gol: se afișează numele de mai sus. Engleza nu necesită câmp; numele afișat este numele în engleză.
detail.name_german = Germană
detail.name_bulgarian = Bulgară
detail.name_chinese = Chineză (simplificată)
detail.name_chinesetraditional = Chineză (tradițională)
detail.name_czech = Cehă
detail.name_french = Franceză
detail.name_hungarian = Maghiară
detail.name_italian = Italiană
detail.name_japanese = Japoneză
detail.name_korean = Coreeană
detail.name_polish = Poloneză
detail.name_portuguesebrazil = Portugheză (Brazilia)
detail.name_romanian = Română
detail.name_russian = Rusă
detail.name_serbian = Sârbă
detail.name_slovak = Slovacă
detail.name_spanish = Spaniolă
detail.name_turkish = Turcă
detail.name_ukrainian = Ucraineană
