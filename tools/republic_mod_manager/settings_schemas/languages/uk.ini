[language]
name = Українська

[strings]
plugin.resources = Resources
plugin.resources.description = Керуйте ресурсами, властивостями та необов'язковим перевизначенням цін.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Власні ресурси з Resources Plus: той самий список, що й в оригіналі, у plugins\resources_plus.ini, без аварійного завершення під час виходу.
resources_plus.save_warning = Зміни записуються в plugins\resources_plus.ini під час збереження. Видалення ресурсу, який уже використовується у збереженій грі, може пошкодити її.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Власні потреби громадян із Needs Plus: той самий список, що й в оригіналі, у файлі needs_plus.ini в папці plugins, перенесений із needs.ini під час першого запуску.
needs_plus.save_warning = Зміни записуються в needs_plus.ini в папці plugins лише під час збереження. Кожна потреба додає комірку зберігання відповідним магазинам, і ця комірка є частиною збереженої гри — спочатку перевірте на копії.
tab.resources.editor = Ресурси
group.resource_definitions = Визначення ресурсів
detail.transport = Клас перевезення
detail.transport.description = Які транспортні засоби й склади перевозять і зберігають ресурс. Достатньо вибрати назву; плагін додає значення цього класу з базової гри.
detail.kind = Тип ціни
detail.kind.description = 0 сировина, 1 промисловий виріб, 2 їжа/одяг, 3 передовий матеріал, 4 електроніка.
detail.record_price = Початкова ціна в записі
detail.record_price.description = Необов'язкові початкові значення в RUB і USD у записі ресурсу.
detail.record_base_price = Початкова базова ціна в записі
detail.record_base_price.description = Необов'язкові базові значення в RUB і USD у записі ресурсу.
detail.trade_mult = Торговельні множники
detail.trade_mult.description = Множники продажу й купівлі, зазвичай 0.95, 1.05.
detail.market_rub = Ринковий блок RUB
detail.market_usd = Ринковий блок USD
detail.market.description = Два ринкові значення й необов'язковий коефіцієнт.\n(Див. опис у файлі INI)
detail.packed = Упакований вантаж
detail.packed.description = Автоматичне відображення вантажу, неупакований або упакований вантаж.
detail.family = Група матеріалів
detail.family.description = Як матеріал виглядає в купі на будівельному майданчику і, найімовірніше, на які відходи перетворюється. Кожна група містить один ресурс відходів. Числа від 10 до 19 у файлі INI показуються назвами.
detail.cargo = Геометрія вантажу
detail.cargo.description = Вибір геометрії для візуалізації вантажу.
detail.pinned_base_price = Зафіксована базова ціна
detail.pinned_base_price.description = Необов'язкове значення в RUB і USD у [base_price]. Порожнє поле означає відсутність власного запису.
detail.forced_price = Примусова кінцева ціна
detail.forced_price.description = Необов'язкове значення в RUB і USD у [price]. Порожнє поле означає, що ціну обчислює гра.

; --- Локальні схеми встановлених оригінальних плагінів (від 0.13.0) ---
daynight.description = Один схід і один захід сонця за календарний день. У базовій грі зміна дня на ніч і назад триває 13 календарних днів, майже два тижні. Із цим плагіном усе вкладається в один день.
daynight.group.cycle = День і ніч
daynight.group.cycle.description = Скільки триває цикл дня й ночі та коли настає ніч.
daynight.group.pace = Темп
daynight.group.pace.description = Два окремі регулятори: один для транспорту, інший для всього решти. Вони діють завжди, незалежно від налаштувань вище.
daynight.group.diagnostics = Усунення несправностей
daynight.enabled.label = Плагін увімкнено
daynight.enabled.description = ON вмикає налаштований цикл дня й ночі.
daynight.cycle_days.label = Календарні дні на цикл дня й ночі
daynight.cycle_days.description = Календарні дні від одного сходу сонця до наступного.\n1 = один схід і один захід сонця щодня\n2 до 12 = відповідно довший цикл\n13 = цикл базової гри
daynight.day_scale.label = Тривалість дня (наскільки повільніше йде календар)
daynight.day_scale.description = Наскільки довше триває календарний день порівняно з базовою грою.\nauto = автоматично сповільнювати календар відповідно до циклу освітлення; рекомендовано\n1 = не сповільнювати календар; тоді день і ніч змінюються в 13 разів швидше\n2 до 100 = сповільнювати календар у стільки разів\nВиберіть частини гри, які сповільнюються, у розділі «Що сповільнюється».
daynight.slow.label = Що сповільнюється
daynight.slow.description = Які частини гри сповільнюються.\ncalendar = сповільнювати лише календар; рекомендовано\nworld = сповільнювати все, зокрема громадян і транспорт; високі значення виглядають як сповільнене відео\nnone = нічого не сповільнювати\nЗ calendar громадяни, транспорт, будівництво й виробництво зберігають звичайну швидкість. Щоденні процеси, як-от забруднення, позики й повідомлення, зберігають звичний інтервал.
daynight.offset.label = Коли настає ніч
daynight.offset.description = Зсуває ніч у межах календарного дня.\n0 = темрява починається невдовзі після середини дня\n0.5 = темрява починається зі зміною дати\nЗа будь-якого значення, крім 0, цикл тривалістю 13 днів уже не відповідає базовій грі точно.
daynight.fade.label = Масштабувати переходи освітлення
daynight.fade.description = ON скорочує переходи між ранком, днем, вечором і ніччю відповідно до налаштованого циклу.\nOFF використовує повільні переходи базової гри. За коротких циклів вони можуть накладатися й робити освітлення блідим.
daynight.vehicle_scale.label = Швидкість транспорту
daynight.vehicle_scale.description = Швидкість вантажівок, поїздів, суден і літаків. Працює незалежно від інших налаштувань.\n1 = швидкість базової гри\n2 = половина швидкості\n0.5 = подвійна швидкість\nВище значення = повільніший транспорт
daynight.sim_scale.label = Швидкість усього іншого
daynight.sim_scale.description = Швидкість громадян, будівництва, виробництва, зношування й анімацій.\n1 = швидкість базової гри\n2 = половина швидкості\n0.5 = подвійна швидкість\nВище значення = повільніша симуляція
daynight.probe.label = Записувати тривалість днів у журнал
daynight.probe.description = ON записує фактичну тривалість кожного календарного дня й переходу освітлення в tesmioloader.log. Використовуйте лише для усунення несправностей і перевірок після оновлення гри.
walking.description = Як далеко громадяни ходять пішки та як далеко власники авто їздять між домом, роботою і стоянкою.
walking.group.distances = Відстані
walking.group.distances.description = Вимірюються вздовж доріг і пішохідних доріжок, а не по прямій. Будівля за річкою на відстані 400 m може вимагати 1200 m ходьби.
walking.group.diagnostics = Усунення несправностей
walking.enabled.label = Плагін увімкнено
walking.enabled.description = ON вмикає налаштовані відстані ходьби та їзди.
walking.distance.label = Відстань ходьби (m)
walking.distance.description = Найдовший маршрут, який громадянин пройде пішки. Базова гра використовує 480 m.\nВище значення = більше будівель у пішій доступності, а будівництво створює більше з'єднань\n0 = без обмежень; тоді будівництво у великому місті може тривати кілька секунд\n20000 = найбільше допустиме значення
walking.car_distance.label = Відстань їзди для власників авто (m)
walking.car_distance.description = Найдовша дозволена поїздка між домом, роботою і стоянкою. Базова гра використовує 2500 m.\nВище значення = власники авто їздять далі\nУстановіть більше за відстань ходьби. За однакових значень авто не дає переваги у відстані.
walking.regen_on_load.label = Перебудовувати з'єднання під час завантаження гри
walking.regen_on_load.description = Пішохідні та паркувальні з'єднання зберігаються у збереженій грі.\nON перебудовує всі з'єднання під час завантаження, тому налаштовані відстані впливають і на наявні міста.\nOFF застосовує налаштовані відстані лише до новозбудованих будівель.
walking.probe.label = Записувати контрольні значення в журнал
walking.probe.description = ON записує значення, знайдені у грі до їх зміни плагіном, у tesmioloader.log. Використовуйте лише для усунення несправностей і перевірок після оновлення гри.
accumulator.description = Акумулятори для вашої електромережі. Будівля з великим запасом енергії заряджається, коли електрики вдосталь, і повертає її, коли електрики бракує.
accumulator.group.battery = Акумулятор
accumulator.group.battery.description = Які будівлі вважаються акумуляторами та як швидко вони заряджаються й розряджаються.
accumulator.group.window = Вікно будівлі
accumulator.group.grid = Електромережа
accumulator.group.diagnostics = Усунення несправностей
accumulator.enabled.label = Плагін увімкнено
accumulator.enabled.description = ON вмикає заряджання й розряджання будівель-акумуляторів.\nOFF зупиняє розряджання. Будівлі залишаються й надалі можуть заряджатися.
accumulator.building_types.label = Типи будівель
accumulator.building_types.description = Типи будівель, що можуть працювати акумуляторами. Кілька чисел розділяйте комами.\n19 = трансформатор\n18 = підстанція\nНе використовуйте 17: електростанція не може приймати електрику й ніколи не зарядиться.
accumulator.min_capacity.label = Мінімальна місткість для роботи акумулятором
accumulator.min_capacity.description = Мінімальна місткість сховища, за якої будівля вважається акумулятором. Це виключає малі сховища звичайних підстанцій.\nВище значення = менше будівель вважаються акумуляторами\nНижче значення = більше будівель вважаються акумуляторами\nДоданий «Stationary Accumulator» має 5000.
accumulator.charge_rate.label = Швидкість заряджання (потужність за секунду)
accumulator.charge_rate.description = Максимальна потужність, яку акумулятор приймає за секунду. Обмеження не дає порожньому акумулятору забрати електрику в цілого міста.\nВище значення = швидше заряджання й більше навантаження на мережу\nНижче значення = повільніше заряджання й менше навантаження\nДля порівняння: вугільна електростанція дає 70, а вітряна турбіна 15.
accumulator.discharge_rate.label = Швидкість розряджання (потужність за секунду)
accumulator.discharge_rate.description = Максимальна потужність, яку акумулятор віддає за секунду. Він віддає електрику лише за її нестачі в мережі.\nВище значення = покриття більшого дефіциту потужності\nНижче значення = запасеної енергії вистачає довше\nПриклад: за 60 повний акумулятор місткістю 5000 замінює електростанцію трохи довше ніж на 80 секунд.
accumulator.panel.label = Рядок заряду у вікні акумулятора
accumulator.panel.description = ON додає рівень заряду у вікно акумулятора, наприклад «Zariad: 4210.5 / 5000 (84.2 %)».
accumulator.panel_caption.label = Підпис цього рядка
accumulator.panel_caption.description = Слово перед рівнем заряду. Лише латинські літери без діакритики й спеціальних символів, інакше гра показуватиме некоректні символи.
accumulator.gauges.label = Обчислювати показники вікна за акумулятором
accumulator.gauges.description = ON замінює хибні показники гри фактичним потоком енергії до акумулятора й від нього.\nOFF використовує звичайні показники гри. Під час заряджання акумулятора вони можуть показувати потужність 0 і «без електропостачання».
accumulator.spread_voltage.label = Експеримент: передавати напругу сусідам (залишити вимкненим)
accumulator.spread_voltage.description = ON не має ефекту. Цю стару функцію технічно замінено. Залиште OFF.
accumulator.trace.label = Записувати сусідів першого акумулятора в журнал
accumulator.trace.description = ON записує в журнал, скільки електрики отримують будівлі біля першого акумулятора. Лише для усунення несправностей; може знижувати продуктивність.
accumulator.log_seconds.label = Секунди між рядками журналу акумулятора
accumulator.log_seconds.description = Інтервал між повідомленнями про стан акумулятора в tesmioloader.log. Кожне повідомлення містить заряд, вхідний і вихідний потоки.\n0 = без повідомлень про стан\nВище значення = рідші записи в журналі
accumulator.probe.label = Секунди між списками будівель у журналі
accumulator.probe.description = Інтервал між списками всіх будівель зі сховищем електрики в tesmioloader.log. Використовуйте лише коли акумулятор не розпізнається або після оновлення гри.\n0 = не записувати ці списки\nВище значення = рідші записи в журналі
cities.description = Розмір і форма кожного міста. У базовій грі кожне місто є колом радіусом 1000 m. Із цим плагіном ви задаєте радіус кожного міста окремо, за бажанням у формі квадрата, прямо у вікні міста. Значення зберігаються у збереженій грі.
cities.group.cities = Міста
cities.group.slider = Повзунок радіуса
cities.group.slider.description = Межі повзунка у вікні міста й величина зміни за одне натискання + або -.
cities.group.layout = Розташування у вікні міста
cities.group.layout.description = Розташування двох нових рядків у вікні міста. Числа — це позиції у власних одиницях вікна гри; ширина вікна становить приблизно 500.
cities.group.overlay = Сітка точок на землі
cities.group.diagnostics = Усунення несправностей
cities.enabled.label = Плагін увімкнено
cities.enabled.description = ON вмикає власні розміри й форми міст.
cities.window.label = Повзунок радіуса й прапорець квадратної форми у вікні міста
cities.window.description = ON показує повзунок радіуса й прапорець квадратної форми у вікні міста.\nOFF приховує обидва; задані значення залишаються, але їх більше не можна змінювати.
cities.adopt.label = Надавати окреме місто будівлям без міста
cities.adopt.description = Коли ви зменшуєте місто, будівлі можуть опинитися поза ним і більше не належати жодному місту.\nON засновує для них нове місто з випадковою назвою й сьогоднішньою датою, як це робить сама гра.\nOFF залишає їх без міста; поведінку гри в такому разі не перевірено.
cities.radius.label = Типовий радіус (m)
cities.radius.description = Типовий радіус міст, які ви не налаштували окремо. Значення діє на кожній мапі.\n1000 = радіус базової гри\nВище значення = більші міста\nНижче значення = менші міста
cities.square.label = Типова форма — квадрат
cities.square.description = ON робить квадратними міста, які не налаштовано окремо.\nOFF використовує коло, як у базовій грі.
cities.radius_min.label = Найменший радіус на повзунку (m)
cities.radius_min.description = Значення в крайньому лівому положенні повзунка.
cities.radius_max.label = Найбільший радіус на повзунку (m)
cities.radius_max.description = Значення в крайньому правому положенні повзунка. Повзунок має 100 кроків; за діапазону від 200 до 5000 один крок становить 48 m.
cities.step.label = Відсоток за натискання кнопки
cities.step.description = Відсоток діапазону повзунка, що змінюється одним натисканням + або -. Не діє під час перетягування повзунка.\nВище значення = більша зміна за натискання\nНижче значення = точніша зміна за натискання
cities.label_x.label = Позиція підпису
cities.label_x.description = Відстань підпису від лівого краю вікна.
cities.widget_x.label = Позиція елемента керування
cities.widget_x.description = Відстань повзунка й прапорця від лівого краю вікна. Повзунку потрібно приблизно 225.
cities.checkbox_dy.label = Зсунути рядок прапорця вгору або вниз
cities.checkbox_dy.description = Зсуває прапорець угору або вниз, щоб він не перекривав повзунок.\nВище значення = прапорець нижче\nНижче значення = прапорець вище
cities.overlay.label = Відображення межі відповідає радіусу й формі
cities.overlay.description = Поки відкрите вікно міста, гра показує на землі синю сітку точок, але завжди лише для кола радіусом 1000 m.\nON пристосовує сітку до вашого радіуса й форми.\nOFF залишає її як у базовій грі.
cities.overlay_step.label = Крок сітки межі (m)
cities.overlay_step.description = Відстань між точками відображення межі міста.\n0 = автоматично використовувати двадцяту частину радіуса, щонайменше 50 m\nНижче значення = густіше відображення й більше навантаження
cities.probe.label = Записувати міста в журнал
cities.probe.description = ON записує радіус, форму й кількість будівель кожного міста в tesmioloader.log після завантаження. Додаткові повідомлення записуються, поки відкрите вікно міста. Лише для усунення несправностей; журнал може швидко зростати.
depletion.description = Родовища вичерпуються. Працююча шахта помітно видобуває родовище з мапи, і що менше залишається, то менше вона виробляє. Видобуток зберігається у збереженій грі; якщо пізніше вимкнути плагін, видобуте не повернеться. Спочатку перевірте на копії збереженої гри.
depletion.group.depletion = Видобуток
depletion.group.window = Вікно шахти
depletion.group.diagnostics = Усунення несправностей
depletion.enabled.label = Плагін увімкнено
depletion.enabled.description = ON дозволяє вибраним родовищам вичерпуватися під час видобутку.\nOFF зупиняє подальше вичерпання. Уже вилучені ресурси не відновлюються.
depletion.tonnes_per_texel.label = Тонни на точку мапи
depletion.tonnes_per_texel.description = Тонни, які шахта може видобути з повністю заповненої точки мапи ресурсів. Бідніші точки дають пропорційно менше.\nВище значення = родовища служать довше\nНижче значення = родовища вичерпуються швидше\nДля порівняння: шахта з радіусом пошуку 210 m охоплює кілька тисяч точок мапи.
depletion.vanilla.label = Родовища базової гри, що вичерпуються
depletion.vanilla.description = Родовища базової гри, які можуть вичерпуватися. Кілька значень розділяйте комами.\noil, iron, coal, uranium, bauxite, gravel = лише вказані родовища\nall = кожне родовище\nnone = жодне родовище базової гри\nname:value = власні тонни на точку мапи, наприклад iron:3000\nРодовища з deposits.ini включаються завжди.\ngravel назавжди стирає видиму текстуру землі й потребує значно більшого значення через малу область пошуку. Не вказуйте gravel, щоб залишити поведінку базової гри.
depletion.flush_seconds.label = Секунди до збереження видобутку
depletion.flush_seconds.description = Секунди між оновленнями мапи ресурсів. Обсяг виробництва й якість змінюються одразу; лише мінімапа та збережена гра оновлюються з цим інтервалом.\nНижче значення = частіші оновлення й більше навантаження\nНе оновлюйте частіше ніж чотири рази на секунду.
depletion.panel.label = Рядок залишку родовища у вікні шахти
depletion.panel.description = ON показує залишок запасів у вікні шахти й трохи збільшує висоту вікна, наприклад «Zalyshok: 251.4 kt / 259.3 kt (96.9 %)».
depletion.panel_caption.label = Підпис цього рядка
depletion.panel_caption.description = Слово перед залишком. Лише латинські літери без діакритики й спеціальних символів, інакше гра показуватиме некоректні символи.
depletion.log_seconds.label = Інтервал рядків перебігу (секунди)
depletion.log_seconds.description = Секунди між повідомленнями про стан шахт у tesmioloader.log. Кожне повідомлення містить залишок, загальну кількість і якість.\n0 = без повідомлень про стан\nВище значення = рідші записи в журналі\nСпостерігайте кілька ігрових днів, щоб знайти відповідне значення тонн на точку мапи.
easystart.description = Потреби громадян з'являються поступово з роками. Потреба, яку ще не розблоковано, не впливає на щастя та здоров'я; громадяни все одно ходять туди й купують, але наслідки не застосовуються до її року.
easystart.group.general = Що відкладається
easystart.group.unlock = Роки розблокування
easystart.group.unlock.description = Рік, у якому вимога починає діяти з 1 січня. Розклад розраховано на республіку, засновану в 1920 році. Якщо почати в 1960 році, попередньо задані роки вже минули.\noff = не відкладати; поведінка базової гри\nalways = застосовувати з першого ігрового дня\nРік = розблокувати в цьому році
easystart.group.diagnostics = Усунення несправностей
easystart.enabled.label = Плагін увімкнено
easystart.enabled.description = ON розблоковує потреби й вимоги до комунальних послуг за налаштованим розкладом.
easystart.demands.label = Відкладати дев'ять потреб громадян
easystart.demands.description = ON відкладає їжу, м'ясо, одяг, електроніку, алкоголь, релігію, культуру, спорт і здоров'я до налаштованих років розблокування.
easystart.utilities.label = Відкладати три комунальні вимоги будівель
easystart.utilities.description = ON відкладає вимоги до електрики, води й опалення до налаштованих років розблокування.
easystart.warnings.label = Відкладати попередження у вікні будівлі
easystart.warnings.description = ON приховує пов'язані попередження до року розблокування, наприклад «будівля без електропостачання».
easystart.pin_status.label = Утримувати задоволеність заблокованих потреб
easystart.pin_status.description = ON утримує задоволеність заблокованої потреби на значенні нижче.\nOFF дозволяє задоволеності й далі падати; до розблокування вона вже може бути дуже низькою.
easystart.locked_status.label = Задоволеність під час блокування
easystart.locked_status.description = Задоволеність, поки потреба заблокована. Для їжі значення означає ситість.\n1.0 = повністю задоволений або ситий\n0.5 = середнє значення з помітним поліпшенням після розблокування
easystart.clear_unsatisfied.label = Виключати заблоковані потреби зі списку незадоволених
easystart.clear_unsatisfied.description = ON не дозволяє заблокованим потребам створювати повідомлення «N громадян не змогли отримати X».
easystart.probe.label = Записувати розблокування в журнал
easystart.probe.description = ON за кожної зміни року записує потреби, які залишаються заблокованими, у tesmioloader.log. Також один раз записує першого громадянина, на якого це вплинуло. Лише для усунення несправностей.
easystart.food.label = Їжа
easystart.religion.label = Релігія
easystart.meat.label = М'ясо
easystart.clothes.label = Одяг
easystart.alcohol.label = Алкоголь
easystart.sport.label = Спорт
easystart.culture.label = Культура
easystart.health.label = Здоров'я
easystart.electricity.label = Електрика
easystart.water.label = Вода (охоплює каналізацію)
easystart.heating.label = Опалення
easystart.electronics.label = Електроніка
easystart.school.label = Школа
easystart.school.description = До цього року діти навчаються без школи, як за налаштування освіти «Просте» у грі, а повідомлення «N дітей не можуть ходити до школи» не з'являється.
easystart.kindergarten.label = Дитячий садок
easystart.kindergarten.description = До цього року жодному з батьків не потрібно залишатися вдома через дитину до шести років, а повідомлення «N працівників не можуть працювати, тому що всі дитячі садки …» не з'являється.
plugin.needs = Needs
plugin.needs.description = Керуйте додатковими потребами громадян і перемикачами плагіна без редагування оригінального файлу.
tab.needs.editor = Потреби
group.needs = Потреби громадян
group.needs.plugin = Налаштування плагіна
group.needs.plugin.description = Перемикачі, що застосовуються до всіх потреб.
needs.list = Список потреб
needs.add = Додати потребу
needs.select_help = Виберіть потребу ліворуч або скористайтеся +, щоб додати ресурс, зареєстрований у Resources.
needs.resource = Ресурс
needs.resource.help = Ресурс, який мають потребувати громадяни. Його потрібно зареєструвати в списку плагіна Resources.
needs.donor = Потреба-зразок
needs.donor.description = Наявна потреба, що використовується як шаблон.\nfood або meat = для продовольчих магазинів\nclothes або eletronics = для універмагів\nalcohol = для алкогольних магазинів\neletronics — це написання, яке використовує гра.
needs.factor = Множник кількості
needs.factor.description = Кількість товарів відносно потреби-зразка.\n1.0 = така сама кількість, як у зразка\nВище значення = громадянам потрібно більше\nНижче значення = громадянам потрібно менше
needs.category = Категорія магазину
needs.category.description = Магазини, що зберігають товари.\nauto = ті самі магазини, що й для потреби-зразка\nnone = без автоматичної полиці; будівля має сама надавати товари\nbasic = лише базові магазини\nmedium = лише середні магазини\nadvanced = лише великі магазини\nmediumadvanced = лише середні й великі магазини\nhotel = лише готелі\nЧисло = записати це значення магазину безпосередньо; лише для користувачів, знайомих із файлами гри
needs.chance = Імовірність
needs.chance.description = Імовірність від 0 до 1, що громадянин отримає цю потребу. За значення нижче 1 вона розподіляється незалежно від зразка.\n0 = жоден громадянин її не отримує\n1 = кожен відповідний громадянин її отримує
needs.unhappy = Незадоволеність
needs.unhappy.description = Втрата задоволеності, коли громадянин не може отримати товари.\n0 = без втрати; потреба лише показується\n0.005 до 0.02 = типовий діапазон для товару, що підвищує комфорт\nДозволений діапазон: 0 до 1
needs.enabled = Плагін увімкнено
needs.enabled.description = ON вмикає плагін.\nOFF повністю вимикає його під час наступного запуску гри.
needs.demand = Додавати потреби
needs.demand.description = ON надає громадянам нову потребу.\nOFF не розподіляє потребу, але все ще може додавати товари до магазинів.
needs.storage = Постачати товари магазинам
needs.storage.description = ON додає товари до вибраних магазинів.\nOFF не додає комірок зберігання; тоді громадяни зможуть знайти товари лише в будівлях, що надають їх самостійно.
needs.max_demands = Потреби на громадянина
needs.max_demands.description = Максимальна кількість додаткових потреб, які громадянин може мати одночасно.\n1 = щонайбільше одна додаткова потреба\n7 = найбільша дозволена кількість
needs.when_full = Коли громадянин досяг межі потреб
needs.when_full.description = Що відбувається, коли громадянин уже має максимальну кількість додаткових потреб.\nskip = чекати на вільну комірку\nreplace = цього разу замінити потребу-зразок
needs.probe = Докладний журнал
needs.probe.description = ON записує списки потреб громадян та інформацію про кожен магазин у докладний журнал плагіна.\nOFF записує лише попередження. Увімкніть тимчасово під час перевірки нових магазинів.
needs.log_seconds = Інтервал рядків перебігу (секунди)
needs.log_seconds.description = Секунди між повідомленнями про кількість призначених потреб.\n0 = вимкнути ці повідомлення\nВище значення = рідші записи в журналі
tab.needs.general = Загальне
plugin.deposits = Deposits
plugin.deposits.description = Керуйте типами родовищ, яких немає в базовій грі, і перемикачами плагіна без редагування оригінального файлу.
tab.deposits.general = Загальне
tab.deposits.editor = Родовища
group.deposits = Родовища
group.deposits.description = Оригінальні родовища захищено, їх можна приховувати; власні родовища зберігаються окремо й об'єднуються в чинний deposits.ini. Кожен розділ, крім [deposits], є одним родовищем.
group.deposits.plugin = Налаштування плагіна
group.deposits.plugin.description = Три підсистеми в розділі [deposits]. Кожна вимкнена для всіх родовищ, коли її перемикач тут вимкнено.
deposits.notice = Номер типу родовища, його канал мапи й токен у building.ini стають частиною збереженої гри, щойно їх використовує шахта. Видалення чи перенумерація родовища, яке використовує збережена гра, може зробити її непридатною; спочатку перевірте на копії.
deposits.list = Список родовищ
deposits.add = Додати родовище
deposits.select_help = Виберіть родовище ліворуч або скористайтеся +, щоб додати його для ресурсу, зареєстрованого в Resources.
deposits.name = Родовище
deposits.name.help = Назва розділу в deposits.ini. Вона позначає родовище в журналі й пензлі редактора; пізніше її не можна перейменувати.
deposits.new_name = Назва родовища
deposits.new_hint = Тут запитуються лише стандартні налаштування. Решта (компонент, тип будівлі, вичерпання) після додавання знаходиться праворуч у налаштуваннях.
deposits.code_patch = Патч коду
deposits.code_patch.description = ON додає налаштовані типи родовищ $TYPE_MINE_ до гри, щоб шахти могли знаходити їх через building.ini. Якщо після оновлення очікувані дані гри більше не збігаються, плагін нічого не змінює.
deposits.minimap_all = Шари мінімапи
deposits.minimap_all.description = ON показує кнопку під п'ятьма кнопками мінімапи гри для кожного окремо ввімкненого родовища плагіна.\nOFF приховує всі кнопки родовищ плагіна.
deposits.editor_all = Пензлі редактора ландшафту
deposits.editor_all.description = ON показує пензлі малювання й стирання на вкладці ресурсів редактора ландшафту для кожного родовища з назвою пензля.\nOFF приховує всі пензлі родовищ плагіна.
deposits.token = Токен будівлі
deposits.token.description = Токен, який шахта використовує в building.ini для цього родовища, наприклад $TYPE_MINE_COPPER. Введіть його як $TYPE_MINE_GRAVEL. Ніколи не використовуйте два токени родовищ в одному building.ini.
deposits.type = Номер типу
deposits.type.description = Унікальний номер типу родовища. Два родовища не можуть використовувати однаковий номер.\n10 до 127 = дозволений діапазон\n0 до 9 = зарезервовано для базової гри\nДіалог автоматично пропонує наступний вільний номер.
deposits.map = Мапа
deposits.map.description = Мапа, на якій зберігається родовище.\nauto = автоматично вибрати вільну комірку на мапі плагіна; рекомендовано\nresourcemap або resourcemap2 = використовувати мапи базової гри\nresourcemap3 до resourcemap10 = використовувати додаткові мапи плагіна\nterrain = безпосередньо використовувати намальовану землю, наприклад для гравію; його пензель з'являється під ROCKS
deposits.component = Компонент
deposits.component.description = Кожна мапа має чотири комірки від 0 до 3. Кожна комірка може містити одне родовище.\nЗ auto = залиште поле порожнім; плагін вибере вільну комірку\nЗ terrain: 2 = шар гравію\nЗ terrain: 3 = шар оази
deposits.building_type = Тип будівлі
deposits.building_type.description = Тип будівлі, яка може видобувати це родовище.\n7 = шахта; правильно майже для кожного родовища\n92 = водяна свердловина\nПорожнє поле = 7
deposits.radius = Радіус пошуку
deposits.radius.description = Як далеко шахта шукає своє родовище.\noil, ore, bauxite, gravel, wood, water, watersurface = використовувати відповідну константу гри\nЧисло = використовувати цю відстань безпосередньо\nПорожнє поле = використовувати ore\nБез радіуса шахта не знайде родовища.
deposits.icon = Значок мінімапи
deposits.icon.description = Ресурс, значок якого показується на кнопці мінімапи. Плагін використовує значок, уже завантажений грою; окреме зображення не потрібне.\nРесурси з плагіна Resources потрібно зареєструвати в ньому.\nПорожнє поле = без значка
deposits.minimap = Кнопка мінімапи
deposits.minimap.description = ON додає кнопку мінімапи й шар відображення цього родовища.
deposits.editor = Назва пензля редактора
deposits.editor.description = Назва пензлів малювання й стирання в редакторі ландшафту. Ця сама назва використовується для tool_paint_<name>.png і tool_erase_<name>.png у vfs\media_soviet\editor.\nПорожнє поле = не створювати пензель\nДозволено: до 31 символу — літери, цифри, _ і -
deposits.deplete = Вичерпання на тексель
deposits.deplete.description = Це налаштування читає плагін Depletion. Воно задає тонни, які шахта може видобути з повністю заповненої точки мапи ресурсів. Бідніші точки дають пропорційно менше.\nЗначення перевизначає tonnes_per_texel у plugins\depletion.ini.\n0 = це родовище залишається нескінченним\nПорожнє поле = використовувати загальне значення
deposits.save_warning = Зміни записуються в чинний deposits.ini лише під час збереження. Номери типів, канали мапи й токени родовищ, які вже використовує збережена гра, не можна змінювати; спочатку перевірте на копії.
depletion.tab.general = Загальне
depletion.tab.mining = Видобуток
needs.save_warning = Зміни записуються в чинний needs.ini лише під час збереження. Кожна потреба додає комірку зберігання відповідним магазинам, і ця комірка є частиною збереженої гри — спочатку перевірте на копії.
bp.name = Buildings Plus
bp.description = Нові будівлі з декларації: будівля-зразок із гри та відмінні рядки building.ini. Записуються як повні елементи Майстерні під час кожного запуску гри.
bp.notice = Кожна будівля стає папкою в media_soviet\workshop_wip із власним ідентифікатором Майстерні. Залиште ідентифікатор порожнім, і під час запуску гри плагін призначить наступний вільний номер від 9300000000 та збереже його в plugins\buildings_plus.ids.ini. Гра читає папку як неопублікований елемент Майстерні. Зміни потребують повного перезапуску. Збереженій грі з такою будівлею потрібна ця папка під час завантаження.
bp.tab.general = Загальне
bp.tab.buildings = Будівлі
bp.tab.generated = Згенеровані будівлі
bp.wip = Згенеровані будівлі в папці гри
bp.wip.description = Показує будівлі, які Buildings Plus або оригінальний плагін buildings згенерував у media_soviet\workshop_wip. Показані тут дані читаються з папок.
bp.wip.empty = Тут ще немає згенерованих будівель. Будівлі генеруються під час запуску гри, якщо якусь увімкнено.
bp.group = Будівлі
bp.group.notice = Будівля тут — це копія будівлі гри з іншими рядками: та сама модель, ті самі з'єднання, ваш виробничий рецепт. Виберіть зразок того самого виду (шахту для шахти, завод для заводу).
bp.list = Будівлі
bp.add = Додати
bp.select_help = Виберіть будівлю ліворуч або скористайтеся +, щоб додати нову. Спочатку запитується зразок, ідентифікатор Майстерні можна залишити порожнім; назва й рядки вводяться праворуч.
bp.id = Назва об'єкта
bp.id.help = Задає назву папки й об'єкта згенерованої будівлі та з'являється в журналі. Лише літери, цифри, _ і -, щонайбільше 64 символи; пізніше змінити не можна.
bp.save_warning = Зміни записуються в чинний buildings_plus.ini лише під час збереження й набувають чинності після повного перезапуску гри. Тоді плагін записує папку в media_soviet\workshop_wip; розділ із помилкою пропускається та зазначається в журналі.
bp.list.note = Щонайбільше 256 будівель.
bp.new_name = Назва об'єкта
bp.new_hint = Пробіли перетворюються на підкреслення, великі літери — на малі.
bp.card.folders = Згенеровані папки
bp.card.log = Усунення несправностей
bp.card.new = Нова будівля
bp.links = Посібники
bp.link.readme = README (посібник)
bp.prune = Очищати папки
bp.prune.description = ON під час наступного запуску гри видаляє згенеровану папку будівлі, яку ви видалили чи вимкнули (лише папки, створені цим плагіном).\nOFF залишає такі папки на місці; гра продовжує завантажувати ці будівлі.
bp.always = Завжди перезаписувати
bp.always.description = ON записує кожну папку будівлі під час кожного запуску гри.\nOFF записує папку лише коли змінилися її розділ, плагін або файл зразка. Залиште OFF.
bp.verbose = Докладний журнал
bp.verbose.description = ON записує кожен скопійований файл і кожен видалений рядок зразка в logs\tesmioloader.buildings_plus.log.\nOFF записує лише результати, попередження й помилки.
bp.repair_owner_ids = Заповнювати ідентифікатор власника
bp.repair_owner_ids.description = ON додає ваш ідентифікатор Steam у згенеровані будівлі, де його немає, зокрема створені іншими генераторами. Без нього гра запитує про відсутні елементи Майстерні щоразу, коли ви завантажуєте збережену гру з такою будівлею.\nOFF не змінює папки інших генераторів.
bp.card.saves = Збережені ігри
bp.card.saves.description = Збережена гра пам'ятає сховища кожної наявної будівлі. Так новий рядок сховища однієї з ваших будівель потрапляє і до цих будівель.
bp.retrofit = Оновлювати сховища вже збудованих будівель
bp.retrofit.description = ON: під час завантаження збереженої гри кожна завершена згенерована будівля отримує порожні сховища для окремих ресурсів, додані до її розділу. Коли ви змінюєте розмір у рядку сховища, сховище також змінюється; зменшення чекає, доки запаси вмістяться. Сховище, рядок якого ви видалили, зникає з будівель, щойно спорожніє.\nOFF: сховища вже збудованих будівель залишаються незмінними; нові й змінені рядки впливають лише на будівлі, зведені пізніше.
bp.enabled = Будівлю ввімкнено
bp.enabled.description = ON генерує цю будівлю під час наступного запуску гри.\nOFF не генерує її. Якщо ввімкнено «Очищати папки», її наявну папку буде видалено під час наступного запуску.
bp.item_id = Ідентифікатор Майстерні
bp.item_id.description = Можливий власний номер: 9000000000 до 9999999999, крім 9100000000 до 9199999999 (залишено для інших генераторів)\nВін задає назву папки в workshop_wip у папці гри, і його не слід змінювати згодом.
bp.donor = Будівля-зразок
bp.donor.description = Будівля, з якої починається копія; на будівлю з Майстерні потрібно підписатися.\nСкористайтеся «Вибрати зразок...», щоб переглянути наявні. Вибирайте однаковий вид: шахту для шахти, завод для заводу, магазин для магазину.
bp.item_name = Назва в грі
bp.item_name.description = Назва, показана в грі.\nЗначення з крапками вважається ключем перекладу й обробляється плагіном Localization, наприклад: localization.lang.salt_mine
bp.desc = Опис
bp.desc.description = Опис елемента Майстерні, один рядок на рядок. Без лапок.
bp.line = Рядки building.ini
bp.line.description = Один рядок building.ini на рядок, наприклад $PRODUCTION raw_salt 1.0. Скористайтеся «Вибрати рядок…», щоб узяти рядок із будівлі-зразка й змінити його. Ваші рядки йдуть перед рядками зразка й замінюють: той самий токен; усі $TYPE_*; усі $STORAGE* разом із $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION і $CONSUMPTION_PER_SECOND як один рецепт. Решта зі зразка зберігається.\nДля власних ресурсів завжди використовуйте $STORAGE_IMPORT_SPECIAL або $STORAGE_EXPORT_SPECIAL із зазначеним ресурсом, інакше сховище перелічує всі ресурси класу перевезення.
bp.strip = Видаляти рядки зразка
bp.cmd_add = Додати в кінець
bp.cmd_add.description = Одна команда на рядок: новий рядок, доданий перед завершенням файлу зразка. Блок із кількох рядків записується з | між рядками.
bp.cmd_replace = Замінити
bp.cmd_replace.description = Одна команда на рядок: старий рядок | новий рядок. Старий рядок має траплятися у файлі зразка рівно один раз.
bp.cmd_remove = Видалити
bp.cmd_remove.description = Одна команда на рядок: рядок файлу зразка, який потрібно прибрати. Пов'язані з ним рядки (точки, позиція) видаляються разом із ним.
bp.cmd_insert = Вставити
bp.cmd_insert.description = Одна команда на рядок: 0 або 1 | опорний рядок | новий рядок. 0 ставить новий рядок перед опорним, 1 — після нього.
bp.strip.description = Один $TOKEN на рядок, наприклад $WORKERS_NEEDED. Кожен рядок зразка з цим токеном видаляється без заміни.
bp.life = Міцність
bp.life.description = Порожньо = 3000\nLIFE у renderconfig.ini: скільки будівля витримає до руйнування. Як у більшості будівель гри.
bp.card.lines = Рядки
bp.item_id.empty = плагін призначає наступний вільний номер від 9300000000 під час запуску гри.
bp.item_name.empty = назва об'єкта — не рекомендовано.
needs_plus.card.log = Усунення несправностей
resources_plus.card.log = Усунення несправностей
resources_plus.card.plugin = Плагін
resources_plus.custom_report = Записувати клоновані записи в журнал
resources_plus.custom_report.description = ON записує для кожного ресурсу із шаблоном, що клон насправді успадкував (клас перевезення, множники, прапорці). Ресурси без шаблону перелічуються завжди.\nOFF перелічує лише ті, що без шаблону.
resources_plus.customs_hook = Оновлювати митниці
resources_plus.customs_hook.description = ON додає нові ресурси до торговельного списку вже наявних митниць.\nOFF відповідає базовій грі: митниця торгує лише тим, що знала на момент побудови; тоді допомагає лише знесення й повторна побудова.
resources_plus.customs_probe = Записувати рядки митниць у журнал
resources_plus.customs_probe.description = ON записує один рядок на кожен ресурс, доданий до митниці, у tesmioloader.log. Перемкніть на OFF, коли ваші митниці показуватимуть очікувані ресурси.
resources_plus.price_hook = Застосовувати ціни з INI
resources_plus.price_hook.description = ON забезпечує роботу [base_price] і [price]: базові ціни задаються перед розрахунком цін гри, фіксовані — після нього.\nOFF залишає ціни на розсуд гри.
resources_plus.price_report = Записувати таблицю цін у журнал
resources_plus.price_report.description = ON записує ціну, базову ціну й тип ціни кожного ресурсу з вашого списку в tesmioloader.log після кожного розрахунку цін гри. Ціна 0.00 означає, що жодна будівля його не виробляє.\nOFF нічого не записує.
tab.resources_plus.general = Загальне
resources.heading.basics = Перевезення й тип ціни
resources.heading.cargo = Вантаж і матеріал
