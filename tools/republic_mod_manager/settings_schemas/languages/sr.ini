[language]
name = Српски

[strings]
plugin.resources = Resources
plugin.resources.description = Управљајте ресурсима, својствима и необавезним заменама цена.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Сопствени ресурси уз Resources Plus: исти списак као у оригиналу, у plugins\resources_plus.ini, без рушења при изласку.
resources_plus.save_warning = Измене се уписују у plugins\resources_plus.ini када сачувате. Уклањање ресурса који снимљена игра већ користи може је оштетити.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Сопствене потребе грађана уз Needs Plus: исти списак као у оригиналу, у датотеци needs_plus.ini у фасцикли plugins, преузет из needs.ini при првом покретању.
needs_plus.save_warning = Измене се уписују у needs_plus.ini у фасцикли plugins тек када сачувате. Свака потреба додаје складишно место одговарајућим продавницама, а оно је део снимљене игре — прво испробајте на копији.
tab.resources.editor = Ресурси
group.resource_definitions = Дефиниције ресурса
detail.transport = Класа транспорта
detail.transport.description = Која возила и складишта превозе и чувају ресурс. Довољно је изабрати назив; додатак додаје вредности те класе из основне игре.
detail.kind = Врста цене
detail.kind.description = 0 сировина, 1 индустријски производ, 2 храна/одећа, 3 напредни материјал, 4 електроника.
detail.record_price = Почетна цена у запису
detail.record_price.description = Необавезне почетне вредности у RUB и USD у запису ресурса.
detail.record_base_price = Почетна основна цена у запису
detail.record_base_price.description = Необавезне основне вредности у RUB и USD у запису ресурса.
detail.trade_mult = Трговински множиоци
detail.trade_mult.description = Множиоци продаје и куповине, обично 0.95, 1.05.
detail.market_rub = Тржишни блок RUB
detail.market_usd = Тржишни блок USD
detail.market.description = Две тржишне вредности и необавезни коефицијент.\n(Погледајте опис у INI датотеци)
detail.packed = Паковани терет
detail.packed.description = Аутоматски приказ терета, непакован или пакован.
detail.family = Група материјала
detail.family.description = Како материјал изгледа када је нагомилан на градилишту и, највероватније, у који отпад се претвара. Свака група садржи један ресурс отпада. Бројеви од 10 до 19 у INI датотеци приказани су по називу.
detail.cargo = Геометрија терета
detail.cargo.description = Избор геометрије за приказ терета.
detail.pinned_base_price = Фиксирана основна цена
detail.pinned_base_price.description = Необавезна вредност у RUB и USD у [base_price]. Празно значи да нема сопственог уноса.
detail.forced_price = Принудна коначна цена
detail.forced_price.description = Необавезна вредност у RUB и USD у [price]. Празно значи да игру треба пустити да израчуна цену.

; --- Локалне шеме за инсталиране изворне додатке (од 0.13.0) ---
daynight.description = Један излазак и један залазак сунца по календарском дану. У основној игри прелазак из дана у ноћ и назад траје 13 календарских дана, скоро две недеље. Уз овај додатак све стаје у један дан.
daynight.group.cycle = Дан и ноћ
daynight.group.cycle.description = Колико траје циклус дана и ноћи и када пада ноћ.
daynight.group.pace = Темпо
daynight.group.pace.description = Две засебне контроле: једна за возила, друга за све остало. Увек важе, без обзира на подешавања изнад.
daynight.group.diagnostics = Отклањање проблема
daynight.enabled.label = Додатак укључен
daynight.enabled.description = ON укључује подешени циклус дана и ноћи.
daynight.cycle_days.label = Календарски дани по циклусу дана и ноћи
daynight.cycle_days.description = Календарски дани од једног изласка сунца до следећег.\n1 = један излазак и један залазак сунца сваког дана\n2 до 12 = сразмерно дужи циклус\n13 = циклус основне игре
daynight.day_scale.label = Дужина дана (колико спорије тече календар)
daynight.day_scale.description = Колико календарски дан траје дуже него у основној игри.\nauto = аутоматски успори календар према циклусу осветљења; препоручено\n1 = не успоравај календар; дан и ноћ се тада смењују 13 пута брже\n2 до 100 = успори календар за овај фактор\nИзаберите делове игре који се успоравају под „Шта се успорава“.
daynight.slow.label = Шта се успорава
daynight.slow.description = Који делови игре се успоравају.\ncalendar = успори само календар; препоручено\nworld = успори све, укључујући грађане и возила; велике вредности изгледају као успорени снимак\nnone = ништа не успоравај\nУз calendar, грађани, возила, изградња и производња задржавају нормалну брзину. Дневни процеси попут загађења, кредита и порука задржавају уобичајене интервале.
daynight.offset.label = Када пада ноћ
daynight.offset.description = Помера ноћ унутар календарског дана.\n0 = мрак почиње убрзо после средине дана\n0.5 = мрак почиње када се промени датум\nСа било којом вредношћу осим 0, циклус од 13 дана више не одговара тачно основној игри.
daynight.fade.label = Прилагоди прелазе осветљења
daynight.fade.description = ON скраћује прелазе између јутра, дана, вечери и ноћи према подешеном циклусу.\nOFF користи споре прелазе основне игре. Код кратких циклуса могу се преклапати и учинити осветљење испраним.
daynight.vehicle_scale.label = Брзина возила
daynight.vehicle_scale.description = Брзина камиона, возова, бродова и авиона. Ради независно од осталих подешавања.\n1 = брзина основне игре\n2 = половина брзине\n0.5 = двострука брзина\nВећа вредност = спорија возила
daynight.sim_scale.label = Брзина свега осталог
daynight.sim_scale.description = Брзина грађана, изградње, производње, хабања и анимација.\n1 = брзина основне игре\n2 = половина брзине\n0.5 = двострука брзина\nВећа вредност = спорија симулација
daynight.probe.label = Уписуј трајање дана у дневник
daynight.probe.description = ON уписује стварно трајање сваког календарског дана и прелаза осветљења у tesmioloader.log. Користите само за отклањање проблема и провере после ажурирања игре.
walking.description = Колико далеко грађани пешаче и колико далеко власници аутомобила возе између куће, посла и паркинга.
walking.group.distances = Растојања
walking.group.distances.description = Мери се дуж путева и пешачких стаза, а не ваздушном линијом. Зграда удаљена 400 m преко реке може захтевати 1200 m пешачења.
walking.group.diagnostics = Отклањање проблема
walking.enabled.label = Додатак укључен
walking.enabled.description = ON укључује подешена растојања пешачења и вожње.
walking.distance.label = Растојање пешачења (m)
walking.distance.description = Најдужа путања коју грађанин прелази пешке. Основна игра користи 480 m.\nВећа вредност = више зграда је доступно пешке и изградња ствара више веза\n0 = без ограничења; изградња тада може трајати неколико секунди у великом граду\n20000 = највећа прихватљива вредност
walking.car_distance.label = Растојање вожње за власнике аутомобила (m)
walking.car_distance.description = Најдужа дозвољена вожња између куће, посла и паркинга. Основна игра користи 2500 m.\nВећа вредност = власници аутомобила возе даље\nПоставите вредност изнад растојања пешачења. Ако су једнаке, аутомобил не доноси предност у растојању.
walking.regen_on_load.label = Обнови везе при учитавању снимљене игре
walking.regen_on_load.description = Пешачке и паркинг везе чувају се у снимљеној игри.\nON обнавља све везе при учитавању, па подешена растојања важе и за постојеће градове.\nOFF примењује подешена растојања само на новоизграђене зграде.
walking.probe.label = Уписуј контролне вредности у дневник
walking.probe.description = ON уписује вредности пронађене у игри пре измена додатка у tesmioloader.log. Користите само за отклањање проблема и провере после ажурирања игре.
accumulator.description = Акумулатори за вашу електромрежу. Зграда са великим складиштем електричне енергије пуни се када има вишка и враћа енергију када је нема довољно.
accumulator.group.battery = Акумулатор
accumulator.group.battery.description = Које зграде се сматрају акумулаторима и колико брзо се пуне и празне.
accumulator.group.window = Прозор зграде
accumulator.group.grid = Електромрежа
accumulator.group.diagnostics = Отклањање проблема
accumulator.enabled.label = Додатак укључен
accumulator.enabled.description = ON укључује пуњење и пражњење акумулаторских зграда.\nOFF зауставља пражњење. Зграде остају и још могу да се пуне.
accumulator.building_types.label = Типови зграда
accumulator.building_types.description = Типови зграда које могу радити као акумулатори. Више бројева раздвојите зарезима.\n19 = трансформатор\n18 = трафостаница\nНе користите 17: електрана не може да прима енергију и никада се не би напунила.
accumulator.min_capacity.label = Најмањи капацитет да би зграда била акумулатор
accumulator.min_capacity.description = Најмањи складишни капацитет да би се зграда сматрала акумулатором. Ово искључује мала складишта обичних трафостаница.\nВећа вредност = мање зграда се сматра акумулаторима\nМања вредност = више зграда се сматра акумулаторима\nПриложени „Stationary Accumulator“ има 5000.
accumulator.charge_rate.label = Брзина пуњења (снага у секунди)
accumulator.charge_rate.description = Највећа снага коју акумулатор прима у секунди. Ограничење спречава празан акумулатор да одузме енергију целом граду.\nВећа вредност = брже пуњење и веће оптерећење мреже\nМања вредност = спорије пуњење и мање оптерећење\nЗа поређење, електрана на угаљ даје 70, а ветротурбина 15.
accumulator.discharge_rate.label = Брзина пражњења (снага у секунди)
accumulator.discharge_rate.description = Највећа снага коју акумулатор испоручује у секунди. Испоручује је само када мрежи недостаје енергија.\nВећа вредност = покрива већи недостатак снаге\nМања вредност = ускладиштена енергија траје дуже\nПример: на 60, пун акумулатор капацитета 5000 замењује електрану нешто више од 80 секунди.
accumulator.panel.label = Ред са стањем напуњености у прозору акумулатора
accumulator.panel.description = ON додаје стање напуњености у прозор акумулатора, на пример „Napunjenost: 4210.5 / 5000 (84.2 %)“.
accumulator.panel_caption.label = Натпис тог реда
accumulator.panel_caption.description = Реч испред стања напуњености. Само латинична слова без дијакритика и посебних знакова, иначе игра приказује погрешне знакове.
accumulator.gauges.label = Израчунавај показиваче прозора из акумулатора
accumulator.gauges.description = ON замењује нетачан приказ игре стварним дотоком и одливом енергије акумулатора.\nOFF користи уобичајени приказ игре. Он може приказати снагу 0 и „без напајања“ док се акумулатор пуни.
accumulator.spread_voltage.label = Експеримент: пренеси напон суседима (оставити искључено)
accumulator.spread_voltage.description = ON нема дејства. Ова стара функција је технички замењена. Оставите OFF.
accumulator.trace.label = Бележи суседе првог акумулатора
accumulator.trace.description = ON уписује у дневник колико енергије примају зграде поред првог акумулатора. Само за отклањање проблема; може смањити перформансе.
accumulator.log_seconds.label = Секунде између редова дневника акумулатора
accumulator.log_seconds.description = Интервал између порука о стању акумулатора у tesmioloader.log. Свака порука садржи напуњеност, доток и одлив.\n0 = без порука о стању\nВећа вредност = ређе бележење
accumulator.probe.label = Секунде између спискова зграда у дневнику
accumulator.probe.description = Интервал између спискова свих зграда са складиштем електричне енергије у tesmioloader.log. Користите само ако акумулатор није препознат или после ажурирања игре.\n0 = не уписуј ове спискове\nВећа вредност = ређе бележење
cities.description = Величина и облик сваког града. У основној игри сваки град је круг полупречника 1000 m. Овим додатком подешавате полупречник за сваки град засебно, по жељи као квадрат, директно у прозору града. Вредности се чувају у снимљеној игри.
cities.group.cities = Градови
cities.group.slider = Клизач полупречника
cities.group.slider.description = Докле сеже клизач у прозору града и колико један клик на + или - мења вредност.
cities.group.layout = Распоред у прозору града
cities.group.layout.description = Положај два нова реда у прозору града. Бројеви су положаји у јединици прозора игре; прозор је широк око 500.
cities.group.overlay = Мрежа тачака на тлу
cities.group.diagnostics = Отклањање проблема
cities.enabled.label = Додатак укључен
cities.enabled.description = ON укључује прилагођене величине и облике градова.
cities.window.label = Клизач полупречника и поље за квадратни облик у прозору града
cities.window.description = ON приказује клизач полупречника и поље за квадратни облик у прозору града.\nOFF скрива оба; постављене вредности остају, али више не можете да их мењате.
cities.adopt.label = Додели засебан град зградама које су остале без града
cities.adopt.description = Када смањите град, зграде могу остати изван њега и више не припадати ниједном граду.\nON за њих оснива нови град са насумичним именом и данашњим датумом, као што то ради сама игра.\nOFF их оставља без града; понашање игре у том случају није испитано.
cities.radius.label = Подразумевани полупречник (m)
cities.radius.description = Подразумевани полупречник за градове које нисте засебно подесили. Вредност важи на свакој мапи.\n1000 = полупречник основне игре\nВећа вредност = већи градови\nМања вредност = мањи градови
cities.square.label = Подразумевани облик је квадрат
cities.square.description = ON чини квадратним градове који нису засебно подешени.\nOFF користи круг као у основној игри.
cities.radius_min.label = Најмањи полупречник на клизачу (m)
cities.radius_min.description = Вредност на крајњем левом положају клизача.
cities.radius_max.label = Највећи полупречник на клизачу (m)
cities.radius_max.description = Вредност на крајњем десном положају клизача. Клизач има 100 корака; уз опсег од 200 до 5000 један корак је 48 m.
cities.step.label = Проценат по клику на дугме
cities.step.description = Проценат опсега клизача који се мења једним кликом на + или -. Не важи при повлачењу клизача.\nВећа вредност = већа промена по клику\nМања вредност = прецизнија промена по клику
cities.label_x.label = Положај натписа
cities.label_x.description = Растојање натписа од леве ивице прозора.
cities.widget_x.label = Положај контроле
cities.widget_x.description = Растојање клизача и поља од леве ивице прозора. Клизачу је потребно око 225.
cities.checkbox_dy.label = Помери ред поља нагоре или надоле
cities.checkbox_dy.description = Помера поље за потврду нагоре или надоле да се не преклапа са клизачем.\nВећа вредност = поље ниже\nМања вредност = поље више
cities.overlay.label = Приказ границе прати полупречник и облик
cities.overlay.description = Док је прозор града отворен, игра приказује плаву мрежу тачака на тлу, али увек само за круг од 1000 m.\nON прилагођава мрежу вашем полупречнику и облику.\nOFF је оставља као у основној игри.
cities.overlay_step.label = Размак тачака приказа границе (m)
cities.overlay_step.description = Растојање између тачака приказа границе града.\n0 = аутоматски користи двадесетину полупречника, најмање 50 m\nМања вредност = гушћи приказ и веће оптерећење
cities.probe.label = Уписуј градове у дневник
cities.probe.description = ON после учитавања уписује полупречник, облик и број зграда сваког града у tesmioloader.log. Додатне поруке се уписују док је прозор града отворен. Само за отклањање проблема; дневник може брзо порасти.
depletion.description = Лежишта се исцрпљују. Активан рудник видљиво уклања руду са мапе и производи све мање како је остаје мање. Ископавање се чува у снимљеној игри; ако касније искључите додатак, ископано се не враћа. Прво испробајте на копији снимљене игре.
depletion.group.depletion = Ископавање
depletion.group.window = Прозор рудника
depletion.group.diagnostics = Отклањање проблема
depletion.enabled.label = Додатак укључен
depletion.enabled.description = ON омогућава исцрпљивање изабраних лежишта током ископавања.\nOFF зауставља даље исцрпљивање. Већ уклоњени ресурси се не враћају.
depletion.tonnes_per_texel.label = Тоне по тачки мапе
depletion.tonnes_per_texel.description = Тоне које рудник може ископати из потпуно попуњене тачке мапе ресурса. Слабије тачке дају сразмерно мање.\nВећа вредност = лежишта трају дуже\nМања вредност = лежишта се брже исцрпљују\nЗа поређење, рудник са полупречником претраге 210 m покрива неколико хиљада тачака мапе.
depletion.vanilla.label = Лежишта основне игре која се исцрпљују
depletion.vanilla.description = Лежишта основне игре која се могу исцрпети. Више вредности раздвојите зарезима.\noil, iron, coal, uranium, bauxite, gravel = само наведена лежишта\nall = свако лежиште\nnone = ниједно лежиште основне игре\nname:value = сопствене тоне по тачки мапе, на пример iron:3000\nЛежишта из deposits.ini су увек обухваћена.\ngravel трајно троши видљиву текстуру тла и захтева много већу вредност због мале области претраге. Изоставите gravel да задржите понашање основне игре.
depletion.flush_seconds.label = Секунде до чувања ископавања
depletion.flush_seconds.description = Секунде између ажурирања мапе ресурса. Производња и квалитет се мењају одмах; само мини-мапа и снимљена игра прате овај интервал.\nМања вредност = чешћа ажурирања и веће оптерећење\nНе ажурирајте више од четири пута у секунди.
depletion.panel.label = Ред са преосталим лежиштем у прозору рудника
depletion.panel.description = ON приказује преосталу количину у прозору рудника и благо повећава висину прозора, на пример „Preostalo: 251.4 kt / 259.3 kt (96.9 %)“.
depletion.panel_caption.label = Натпис тог реда
depletion.panel_caption.description = Реч испред преостале количине. Само латинична слова без дијакритика и посебних знакова, иначе игра приказује погрешне знакове.
depletion.log_seconds.label = Интервал редова о напретку (секунде)
depletion.log_seconds.description = Секунде између порука о стању рудника у tesmioloader.log. Свака порука садржи преосталу количину, укупну количину и квалитет.\n0 = без порука о стању\nВећа вредност = ређе бележење\nПратите неколико дана у игри да бисте нашли одговарајућу вредност тона по тачки мапе.
easystart.description = Потребе грађана уводе се постепено током година. Потреба која још није откључана не утиче на срећу и здравље; грађани и даље одлазе тамо и купују, али последице изостају до задате године.
easystart.group.general = Шта се одлаже
easystart.group.unlock = Године откључавања
easystart.group.unlock.description = Година у којој захтев почиње да важи од 1. јануара. Распоред је намењен републици основаној 1920. Ако почнете 1960, унапред задате године већ су прошле.\noff = не одлажи; понашање основне игре\nalways = примењуј од првог дана игре\nГодина = откључај те године
easystart.group.diagnostics = Отклањање проблема
easystart.enabled.label = Додатак укључен
easystart.enabled.description = ON откључава потребе и захтеве за комуналним услугама према подешеном распореду.
easystart.demands.label = Одложи девет потреба грађана
easystart.demands.description = ON одлаже храну, месо, одећу, електронику, алкохол, религију, културу, спорт и здравље до подешених година откључавања.
easystart.utilities.label = Одложи три комунална захтева зграда
easystart.utilities.description = ON одлаже захтеве за струјом, водом и грејањем до подешених година откључавања.
easystart.warnings.label = Одложи упозорења у прозору зграде
easystart.warnings.description = ON скрива повезана упозорења до године откључавања, на пример „зграда без напајања“.
easystart.pin_status.label = Задржи задовољство закључаних потреба
easystart.pin_status.description = ON задржава задовољеност закључане потребе на вредности испод.\nOFF дозвољава да задовољеност и даље опада; може бити веома ниска када се потреба откључа.
easystart.locked_status.label = Задовољство док је потреба закључана
easystart.locked_status.description = Задовољеност док је потреба закључана. За храну вредност представља ситост.\n1.0 = потпуно задовољан или сит\n0.5 = средња вредност са приметним побољшањем после откључавања
easystart.clear_unsatisfied.label = Уклони закључане потребе са списка незадовољених
easystart.clear_unsatisfied.description = ON спречава закључане потребе да стварају поруку „N грађана није могло да добије X“.
easystart.probe.label = Уписуј откључавања у дневник
easystart.probe.description = ON при свакој промени године уписује потребе које су и даље закључане у tesmioloader.log. Такође једном бележи првог погођеног грађанина. Само за отклањање проблема.
easystart.food.label = Храна
easystart.religion.label = Религија
easystart.meat.label = Месо
easystart.clothes.label = Одећа
easystart.alcohol.label = Алкохол
easystart.sport.label = Спорт
easystart.culture.label = Култура
easystart.health.label = Здравље
easystart.electricity.label = Струја
easystart.water.label = Вода (обухвата канализацију)
easystart.heating.label = Грејање
easystart.electronics.label = Електроника
easystart.school.label = Школа
easystart.school.description = Пре ове године деца уче без школе, као у поставци „Једноставно“ образовање у игри, а порука „N деце не може да иде у школу“ се не појављује.
easystart.kindergarten.label = Вртић
easystart.kindergarten.description = Пре ове године ниједан родитељ не мора остати код куће због детета млађег од шест година, а порука „N радника не може да ради јер су сви вртићи …“ се не појављује.
plugin.needs = Needs
plugin.needs.description = Управљајте додатним потребама грађана и прекидачима додатка без измене изворне датотеке.
tab.needs.editor = Потребе
group.needs = Потребе грађана
group.needs.plugin = Подешавања додатка
group.needs.plugin.description = Прекидачи који важе за све потребе.
needs.list = Списак потреба
needs.add = Додај потребу
needs.select_help = Изаберите потребу лево или користите + да додате ресурс регистрован додатком Resources.
needs.resource = Ресурс
needs.resource.help = Ресурс који грађани треба да траже. Мора бити регистрован на списку додатка Resources.
needs.donor = Полазна потреба
needs.donor.description = Постојећа потреба која се користи као образац.\nfood или meat = за продавнице хране\nclothes или eletronics = за робне куће\nalcohol = за продавнице алкохола\neletronics је облик који игра користи.
needs.factor = Фактор количине
needs.factor.description = Количина робе у односу на полазну потребу.\n1.0 = иста количина као код полазне потребе\nВећа вредност = грађанима треба више\nМања вредност = грађанима треба мање
needs.category = Категорија продавнице
needs.category.description = Продавнице које држе робу.\nauto = исте продавнице као за полазну потребу\nnone = без аутоматске полице; зграда мора сама да обезбеди робу\nbasic = само основне продавнице\nmedium = само средње продавнице\nadvanced = само велике продавнице\nmediumadvanced = само средње и велике продавнице\nhotel = само хотели\nБрој = директно упиши ову вредност продавнице; само за кориснике који познају датотеке игре
needs.chance = Вероватноћа
needs.chance.description = Вероватноћа од 0 до 1 да грађанин добије ову потребу. Испод 1 се додељује независно од полазне потребе.\n0 = ниједан грађанин је не добија\n1 = сваки одговарајући грађанин је добија
needs.unhappy = Незадовољство
needs.unhappy.description = Губитак задовољства када грађанин не може да добије робу.\n0 = без губитка; потреба се само приказује\n0.005 до 0.02 = уобичајени опсег за робу која повећава удобност\nДозвољени опсег: 0 до 1
needs.enabled = Додатак укључен
needs.enabled.description = ON укључује додатак.\nOFF га потпуно искључује при следећем покретању игре.
needs.demand = Додај потребе
needs.demand.description = ON додељује грађанима нову потребу.\nOFF не додељује потребу, али и даље може додати робу продавницама.
needs.storage = Снабдевај продавнице
needs.storage.description = ON додаје робу изабраним продавницама.\nOFF не додаје складишна места; грађани тада робу могу наћи само у зградама које је саме обезбеђују.
needs.max_demands = Потребе по грађанину
needs.max_demands.description = Највећи број додатних потреба које грађанин може имати истовремено.\n1 = највише једна додатна потреба\n7 = највећи дозвољени број
needs.when_full = Када грађанин већ има све потребе
needs.when_full.description = Шта се дешава када грађанин већ има највећи број додатних потреба.\nskip = сачекај слободно место\nreplace = овог пута замени полазну потребу
needs.probe = Детаљан дневник
needs.probe.description = ON уписује спискове потреба грађана и податке о свакој продавници у детаљни дневник додатка.\nOFF уписује само упозорења. Укључите привремено при провери нових продавница.
needs.log_seconds = Интервал редова о напретку (секунде)
needs.log_seconds.description = Секунде између порука о броју додељених потреба.\n0 = искључи ове поруке\nВећа вредност = ређе бележење
tab.needs.general = Опште
plugin.deposits = Deposits
plugin.deposits.description = Управљајте типовима лежишта којих нема у основној игри и прекидачима додатка без измене изворне датотеке.
tab.deposits.general = Опште
tab.deposits.editor = Лежишта
group.deposits = Лежишта
group.deposits.description = Изворна лежишта су заштићена и могу се сакрити; сопствена лежишта чувају се засебно и спајају у важећу deposits.ini. Сваки одељак осим [deposits] представља једно лежиште.
group.deposits.plugin = Подешавања додатка
group.deposits.plugin.description = Три подсистема у одељку [deposits]. Сваки је искључен за сва лежишта када је његов прекидач овде искључен.
deposits.notice = Број типа лежишта, његов канал мапе и ознака у building.ini постају део снимљене игре чим их рудник користи. Уклањање или промена броја лежишта које снимљена игра користи може је учинити неупотребљивом; прво испробајте на копији.
deposits.list = Списак лежишта
deposits.add = Додај лежиште
deposits.select_help = Изаберите лежиште лево или користите + да додате лежиште ресурса регистрованог додатком Resources.
deposits.name = Лежиште
deposits.name.help = Назив одељка у deposits.ini. Именује лежиште у дневнику и четкици уређивача; касније се не може преименовати.
deposits.new_name = Назив лежишта
deposits.new_hint = Овде се траже само стандардна подешавања. Све остало (компонента, тип зграде, исцрпљивање) налази се десно у подешавањима после додавања.
deposits.code_patch = Измена кода
deposits.code_patch.description = ON уноси подешене типове лежишта $TYPE_MINE_ у игру тако да их рудници могу наћи преко building.ini. Ако после ажурирања очекивани подаци игре више не одговарају, додатак ништа не мења.
deposits.minimap_all = Слојеви мини-мапе
deposits.minimap_all.description = ON приказује дугме испод пет дугмади мини-мапе игре за свако засебно укључено лежиште додатка.\nOFF скрива сву дугмад лежишта додатка.
deposits.editor_all = Четкице уређивача терена
deposits.editor_all.description = ON приказује четкицу за цртање и брисање на картици ресурса уређивача терена за свако лежиште са називом четкице.\nOFF скрива све четкице лежишта додатка.
deposits.token = Ознака зграде
deposits.token.description = Ознака коју рудник користи у building.ini за ово лежиште, на пример $TYPE_MINE_COPPER. Унесите је као $TYPE_MINE_GRAVEL. Никада не користите две ознаке лежишта у истој building.ini.
deposits.type = Број типа
deposits.type.description = Јединствени број типа лежишта. Два лежишта не смеју користити исти број.\n10 до 127 = дозвољени опсег\n0 до 9 = резервисано за основну игру\nДијалог аутоматски предлаже следећи слободан број.
deposits.map = Мапа
deposits.map.description = Мапа на којој се чува лежиште.\nauto = аутоматски изабери слободно место на мапи додатка; препоручено\nresourcemap или resourcemap2 = користи мапе основне игре\nresourcemap3 до resourcemap10 = користи додатне мапе додатка\nterrain = директно користи обојено тло, на пример за шљунак; његова четкица се појављује под ROCKS
deposits.component = Компонента
deposits.component.description = Свака мапа има четири места од 0 до 3. Свако може садржати једно лежиште.\nУз auto = оставите поље празно; додатак бира слободно место\nУз terrain: 2 = слој шљунка\nУз terrain: 3 = слој оазе
deposits.building_type = Тип зграде
deposits.building_type.description = Тип зграде која може да ископава ово лежиште.\n7 = рудник; исправно за скоро свако лежиште\n92 = бунар\nПразно поље = 7
deposits.radius = Полупречник претраге
deposits.radius.description = Колико далеко рудник тражи своје лежиште.\noil, ore, bauxite, gravel, wood, water, watersurface = користи одговарајућу константу игре\nБрој = директно користи ово растојање\nПразно поље = користи ore\nБез полупречника рудник не налази лежиште.
deposits.icon = Икона мини-мапе
deposits.icon.description = Ресурс чија се икона приказује на дугмету мини-мапе. Додатак користи икону коју је игра већ учитала; засебна слика није потребна.\nРесурси додатка Resources морају бити регистровани у њему.\nПразно поље = без иконе
deposits.minimap = Дугме мини-мапе
deposits.minimap.description = ON додаје дугме мини-мапе и слој приказа за ово лежиште.
deposits.editor = Назив четкице уређивача
deposits.editor.description = Назив четкица за цртање и брисање у уређивачу терена. Исти назив се користи за tool_paint_<name>.png и tool_erase_<name>.png у vfs\media_soviet\editor.\nПразно поље = не прави четкицу\nДозвољено: до 31 знак — слова, цифре, _ и -
deposits.deplete = Исцрпљивање по текселу
deposits.deplete.description = Ово подешавање чита додатак Depletion. Одређује тоне које рудник може ископати из потпуно попуњене тачке мапе ресурса. Слабије тачке дају сразмерно мање.\nВредност замењује tonnes_per_texel у plugins\depletion.ini.\n0 = ово лежиште остаје бесконачно\nПразно поље = користи општу вредност
deposits.save_warning = Измене се уписују у важећу deposits.ini тек при чувању. Бројеви типова, канали мапе и ознаке лежишта која снимљена игра већ користи не смеју се мењати; прво испробајте на копији.
depletion.tab.general = Опште
depletion.tab.mining = Ископавање
needs.save_warning = Измене се уписују у важећу needs.ini тек када сачувате. Свака потреба додаје складишно место одговарајућим продавницама, а оно је део снимљене игре — прво испробајте на копији.
bp.name = Buildings Plus
bp.description = Нове зграде из декларације: полазна зграда игре и редови building.ini који се разликују. При сваком покретању игре уписују се као потпуне ставке Радионице.
bp.notice = Свака зграда постаје фасцикла у media_soviet\workshop_wip са сопственим ID-јем Радионице. Оставите ID празан и додатак при покретању игре додељује следећи слободан број од 9300000000 и чува га у plugins\buildings_plus.ids.ini. Игра чита фасциклу као необјављену ставку Радионице. Измене захтевају потпуно поновно покретање. Снимљеној игри која садржи такву зграду потребна је та фасцикла при учитавању.
bp.tab.general = Опште
bp.tab.buildings = Зграде
bp.tab.generated = Генерисане зграде
bp.wip = Генерисане зграде у фасцикли игре
bp.wip.description = Приказује зграде које су Buildings Plus или изворни додатак buildings генерисали у media_soviet\workshop_wip. Приказани подаци читају се из фасцикли.
bp.wip.empty = Још нема генерисаних зграда. Зграде се генеришу при покретању игре ако је нека укључена.
bp.group = Зграде
bp.group.notice = Зграда овде представља копију зграде игре са другачијим редовима: исти модел, исте везе, ваш производни рецепт. Изаберите полазну зграду исте врсте (рудник за рудник, фабрику за фабрику).
bp.list = Зграде
bp.add = Додај
bp.select_help = Изаберите зграду лево или користите + да је додате. Прво се бира полазна зграда, ID Радионице може остати празан; назив и редови уносе се десно.
bp.id = Назив објекта
bp.id.help = Одређује назив фасцикле и објекта генерисане зграде и појављује се у дневнику. Само слова, цифре, _ и -, највише 64 знака; касније се не може мењати.
bp.save_warning = Измене се уписују у важећу buildings_plus.ini тек при чувању и ступају на снагу после потпуног поновног покретања игре. Додатак тада уписује фасциклу у media_soviet\workshop_wip; одељак са грешком се прескаче и наводи у дневнику.
bp.list.note = Највише 256 зграда.
bp.new_name = Назив објекта
bp.new_hint = Размаци постају доње црте, велика слова мала.
bp.card.folders = Генерисане фасцикле
bp.card.log = Отклањање проблема
bp.card.new = Нова зграда
bp.links = Упутства
bp.link.readme = README (упутство)
bp.prune = Очисти фасцикле
bp.prune.description = ON при следећем покретању игре уклања генерисану фасциклу зграде коју сте обрисали или искључили (само фасцикле које је овај додатак направио).\nOFF оставља такве фасцикле; игра наставља да учитава те зграде.
bp.always = Увек поново уписуј
bp.always.description = ON уписује сваку фасциклу зграде при сваком покретању игре.\nOFF уписује фасциклу само када се њен одељак, додатак или полазна датотека промени. Оставите OFF.
bp.verbose = Детаљан дневник
bp.verbose.description = ON уписује сваку копирану датотеку и сваки уклоњени полазни ред у logs\tesmioloader.buildings_plus.log.\nOFF уписује само резултате, упозорења и грешке.
bp.repair_owner_ids = Попуни ID власника
bp.repair_owner_ids.description = ON уписује ваш Steam ID у генерисане зграде које га немају, укључујући оне других генератора. Без њега игра пита о недостајућим ставкама Радионице сваки пут када учитате снимљену игру која користи такву зграду.\nOFF не мења фасцикле других генератора.
bp.card.saves = Снимљене игре
bp.card.saves.description = Снимљена игра памти складишта сваке постојеће зграде. Овим нови складишни ред неке од ваших зграда стиже и до тих зграда.
bp.retrofit = Усклађуј складишта већ изграђених зграда
bp.retrofit.description = ON: када учитате снимљену игру, свака завршена генерисана зграда добија празна складишта за појединачне ресурсе која сте додали њеном одељку. Када промените величину у складишном реду, мења се и складиште; смањење чека док залихе не стану. Складиште чији сте ред уклонили нестаје из зграда чим се испразни.\nOFF: складишта већ изграђених зграда остају иста; нови и измењени редови важе само за зграде које касније изградите.
bp.enabled = Зграда укључена
bp.enabled.description = ON генерише ову зграду при следећем покретању игре.\nOFF је не генерише. Уз укључено „Очисти фасцикле“, њена постојећа фасцикла се уклања при следећем покретању.
bp.item_id = ID Радионице
bp.item_id.description = Могућ сопствени број: 9000000000 до 9999999999, осим 9100000000 до 9199999999 (остављено за друге генераторе)\nОдређује назив фасцикле у workshop_wip у фасцикли игре и не треба га касније мењати.
bp.donor = Полазна зграда
bp.donor.description = Зграда од које настаје копија — на зграду из Радионице морате бити претплаћени.\nКористите „Изабери полазну зграду...“ да прегледате доступне зграде. Ускладите врсту: рудник за рудник, фабрику за фабрику, продавницу за продавницу.
bp.item_name = Назив у игри
bp.item_name.description = Назив приказан у игри.\nВредност са тачкама сматра се кључем превода и разрешава се додатком Localization, на пример: localization.lang.salt_mine
bp.desc = Опис
bp.desc.description = Опис ставке Радионице, једна линија по реду. Без наводника.
bp.line = Редови building.ini
bp.line.description = Једна линија building.ini по реду, на пример $PRODUCTION raw_salt 1.0. Користите „Изабери ред…“ да преузмете ред из полазне зграде и прилагодите га. Ваши редови иду испред полазних и замењују: исту ознаку; све $TYPE_*; све $STORAGE* заједно са $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION и $CONSUMPTION_PER_SECOND као један производни рецепт. Све остало из полазне зграде остаје.\nЗа сопствене ресурсе увек користите $STORAGE_IMPORT_SPECIAL или $STORAGE_EXPORT_SPECIAL уз наведен ресурс, иначе складиште наводи све ресурсе класе транспорта.
bp.strip = Уклони полазне редове
bp.cmd_add = Додај на крај
bp.cmd_add.description = Једна наредба по реду: нови ред, уметнут пре завршетка полазне датотеке. Блок са више редова записује се са | између редова.
bp.cmd_replace = Замени
bp.cmd_replace.description = Једна наредба по реду: стари ред | нови ред. Стари ред мора постојати тачно једном у полазној датотеци.
bp.cmd_remove = Уклони
bp.cmd_remove.description = Једна наредба по реду: ред полазне датотеке који треба уклонити. Припадајући редови (тачке, положај) уклањају се са њим.
bp.cmd_insert = Уметни
bp.cmd_insert.description = Једна наредба по реду: 0 или 1 | сидро | нови ред. 0 ставља нови ред испред сидра, 1 иза њега.
bp.strip.description = Један $TOKEN по реду, на пример $WORKERS_NEEDED. Сваки полазни ред са том ознаком се уклања без замене.
bp.life = Издржљивост
bp.life.description = Празно = 3000\nLIFE у renderconfig.ini: колико зграда може поднети пре рушења. Као код већине зграда у игри.
bp.card.lines = Редови
bp.item_id.empty = додатак при покретању игре додељује следећи слободан број од 9300000000.
bp.item_name.empty = назив објекта — није препоручено.
needs_plus.card.log = Отклањање проблема
resources_plus.card.log = Отклањање проблема
resources_plus.card.plugin = Додатак
resources_plus.custom_report = Бележи клониране записе
resources_plus.custom_report.description = ON за сваки ресурс са обрасцем бележи шта је копија заиста наследила (класу транспорта, факторе, заставице). Ресурси без обрасца увек се наводе.\nOFF наводи само оне без обрасца.
resources_plus.customs_hook = Освежи царинарнице
resources_plus.customs_hook.description = ON додаје нове ресурсе на трговински списак већ постојећих царинарница.\nOFF одговара основној игри: царинарница тргује само оним што је познавала при изградњи — тада помажу само рушење и поновна изградња.
resources_plus.customs_probe = Бележи редове царинарница
resources_plus.customs_probe.description = ON уписује један ред за сваки ресурс додат царинарници у tesmioloader.log. Пребаците на OFF када царинарнице приказују очекиване ресурсе.
resources_plus.price_hook = Примени цене из INI датотеке
resources_plus.price_hook.description = ON омогућава дејство [base_price] и [price]: основне цене се постављају пре израчунавања цена у игри, фиксне после њега.\nOFF препушта цене игри.
resources_plus.price_report = Бележи табелу цена
resources_plus.price_report.description = ON уписује цену, основну цену и врсту цене сваког ресурса са вашег списка у tesmioloader.log после сваког израчунавања цена у игри. Цена 0.00 значи да га ниједна зграда не производи.\nOFF ништа не уписује.
tab.resources_plus.general = Опште
