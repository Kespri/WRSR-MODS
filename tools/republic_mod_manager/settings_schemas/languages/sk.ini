[strings]
plugin.resources = Resources
plugin.resources.description = Spravujte suroviny, vlastnosti a voliteľné prepísanie cien.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Vlastné suroviny s Resources Plus: rovnaký zoznam ako v origináli, v plugins\resources_plus.ini, bez pádu pri ukončení.
resources_plus.save_warning = Zmeny sa pri uložení zapíšu do plugins\resources_plus.ini. Odstránenie suroviny, ktorú už uložená hra používa, môže túto hru poškodiť.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Vlastné potreby občanov s Needs Plus: rovnaký zoznam ako v origináli, v súbore needs_plus.ini v priečinku plugins, prevzatý z needs.ini pri prvom spustení.
needs_plus.save_warning = Zmeny sa zapíšu do needs_plus.ini v priečinku plugins až pri uložení. Každá potreba pridá dotknutým obchodom skladové miesto, ktoré je súčasťou uloženej hry — najprv to vyskúšajte na kópii.
tab.resources.editor = Suroviny
group.resource_definitions = Definície surovín
detail.transport = Prepravná trieda
detail.transport.description = Ktoré vozidlá a sklady prepravujú a skladujú surovinu. Stačí vybrať názov; doplnok pridá hodnoty danej triedy zo základnej hry.
detail.kind = Druh ceny
detail.kind.description = 0 surovina, 1 priemyselný výrobok, 2 potraviny/oblečenie, 3 pokročilý materiál, 4 elektronika.
detail.record_price = Počiatočná cena v zázname
detail.record_price.description = Voliteľné počiatočné hodnoty v RUB a USD v zázname suroviny.
detail.record_base_price = Počiatočná základná cena v zázname
detail.record_base_price.description = Voliteľné základné hodnoty v RUB a USD v zázname suroviny.
detail.trade_mult = Obchodné násobitele
detail.trade_mult.description = Násobitele predaja a nákupu, zvyčajne 0.95, 1.05.
detail.market_rub = Trhový blok RUB
detail.market_usd = Trhový blok USD
detail.market.description = Dve trhové hodnoty a voliteľný koeficient.\n(Pozrite si opis v súbore INI)
detail.packed = Balený náklad
detail.packed.description = Automatické zobrazenie nákladu, nebalený alebo balený náklad.
detail.family = Skupina materiálu
detail.family.description = Ako materiál vyzerá na hromade na stavenisku a pravdepodobne aj to, na aký odpad sa zmení. Každá skupina obsahuje jednu odpadovú surovinu. Čísla 10 až 19 v súbore INI sa zobrazujú názvom.
detail.cargo = Geometria nákladu
detail.cargo.description = Výber geometrie na zobrazenie nákladu.
detail.pinned_base_price = Pevná základná cena
detail.pinned_base_price.description = Voliteľná hodnota v RUB a USD v [base_price]. Prázdne pole znamená žiadny vlastný záznam.
detail.forced_price = Vynútená konečná cena
detail.forced_price.description = Voliteľná hodnota v RUB a USD v [price]. Prázdne pole znamená, že cenu vypočíta hra.

; --- Lokálne schémy nainštalovaných pôvodných doplnkov (od 0.13.0) ---
daynight.description = Jeden východ a jeden západ slnka za kalendárny deň. V základnej hre trvá zmena dňa na noc a späť 13 kalendárnych dní, takmer dva týždne. S týmto doplnkom sa zmestí do jedného dňa.
daynight.group.cycle = Deň a noc
daynight.group.cycle.description = Ako dlho trvá cyklus dňa a noci a kedy prichádza noc.
daynight.group.pace = Tempo
daynight.group.pace.description = Dve samostatné nastavenia: jedno pre vozidlá, druhé pre všetko ostatné. Platia vždy, bez ohľadu na nastavenia vyššie.
daynight.group.diagnostics = Riešenie problémov
daynight.enabled.label = Doplnok zapnutý
daynight.enabled.description = ON zapne nastavený cyklus dňa a noci.
daynight.cycle_days.label = Kalendárne dni na cyklus dňa a noci
daynight.cycle_days.description = Kalendárne dni od jedného východu slnka po nasledujúci.\n1 = jeden východ a jeden západ slnka každý deň\n2 až 12 = primerane dlhší cyklus\n13 = cyklus základnej hry
daynight.day_scale.label = Dĺžka dňa (o koľko pomalšie plynie kalendár)
daynight.day_scale.description = O koľko dlhšie trvá kalendárny deň než v základnej hre.\nauto = automaticky spomaľ kalendár podľa svetelného cyklu; odporúčané\n1 = nespomaľuj kalendár; deň a noc sa potom striedajú 13-krát rýchlejšie\n2 až 100 = spomaľ kalendár týmto násobkom\nČasti hry, ktoré sa majú spomaliť, vyberte v časti „Čo sa spomalí“.
daynight.slow.label = Čo sa spomalí
daynight.slow.description = Ktoré časti hry sa spomalia.\ncalendar = spomaľ iba kalendár; odporúčané\nworld = spomaľ všetko vrátane občanov a vozidiel; vysoké hodnoty vyzerajú ako spomalený záber\nnone = nič nespomaľuj\nPri calendar si občania, vozidlá, výstavba a výroba zachovajú bežnú rýchlosť. Denné procesy, ako znečistenie, pôžičky a správy, si zachovajú obvyklý interval.
daynight.offset.label = Kedy prichádza noc
daynight.offset.description = Posúva noc v rámci kalendárneho dňa.\n0 = tma začína krátko po polovici dňa\n0.5 = tma začína pri zmene dátumu\nPri akejkoľvek hodnote okrem 0 už cyklus s dĺžkou 13 dní presne nezodpovedá základnej hre.
daynight.fade.label = Prispôsob prechody osvetlenia
daynight.fade.description = ON skráti prechody medzi ránom, dňom, večerom a nocou podľa nastaveného cyklu.\nOFF používa pomalé prechody základnej hry. Pri krátkych cykloch sa môžu prekrývať a osvetlenie môže pôsobiť vyblednuto.
daynight.vehicle_scale.label = Rýchlosť vozidiel
daynight.vehicle_scale.description = Rýchlosť nákladných áut, vlakov, lodí a lietadiel. Funguje nezávisle od ostatných nastavení.\n1 = rýchlosť základnej hry\n2 = polovičná rýchlosť\n0.5 = dvojnásobná rýchlosť\nVyššia hodnota = pomalšie vozidlá
daynight.sim_scale.label = Rýchlosť všetkého ostatného
daynight.sim_scale.description = Rýchlosť občanov, výstavby, výroby, opotrebovania a animácií.\n1 = rýchlosť základnej hry\n2 = polovičná rýchlosť\n0.5 = dvojnásobná rýchlosť\nVyššia hodnota = pomalšia simulácia
daynight.probe.label = Zapisuj dĺžky dní do protokolu
daynight.probe.description = ON zapisuje skutočné trvanie každého kalendárneho dňa a svetelného prechodu do tesmioloader.log. Používajte iba pri riešení problémov a kontrolách po aktualizácii hry.
walking.description = Ako ďaleko občania chodia pešo a ako ďaleko majitelia áut jazdia medzi domovom, prácou a parkoviskom.
walking.group.distances = Vzdialenosti
walking.group.distances.description = Merané po cestách a chodníkoch, nie vzdušnou čiarou. Budova vzdialená 400 m za riekou môže znamenať 1200 m chôdze.
walking.group.diagnostics = Riešenie problémov
walking.enabled.label = Doplnok zapnutý
walking.enabled.description = ON zapne nastavené vzdialenosti chôdze a jazdy.
walking.distance.label = Pešia vzdialenosť (m)
walking.distance.description = Najdlhšia trasa, ktorú občan prejde pešo. Základná hra používa 480 m.\nVyššia hodnota = viac budov je v pešom dosahu a výstavba vytvára viac spojení\n0 = bez obmedzenia; výstavba potom môže vo veľkom meste trvať niekoľko sekúnd\n20000 = najvyššia prijatá hodnota
walking.car_distance.label = Vzdialenosť jazdy pre majiteľov áut (m)
walking.car_distance.description = Najdlhšia povolená jazda medzi domovom, prácou a parkoviskom. Základná hra používa 2500 m.\nVyššia hodnota = majitelia áut jazdia ďalej\nNastavte viac než pešiu vzdialenosť. Pri rovnakých hodnotách auto neposkytuje výhodu v dosahu.
walking.regen_on_load.label = Obnov spojenia pri načítaní uloženej hry
walking.regen_on_load.description = Pešie a parkovacie spojenia sa uchovávajú v uloženej hre.\nON obnoví všetky spojenia pri načítaní hry, takže nastavené vzdialenosti ovplyvnia aj existujúce mestá.\nOFF uplatní nastavené vzdialenosti iba na novopostavené budovy.
walking.probe.label = Zapisuj kontrolné hodnoty do protokolu
walking.probe.description = ON zapisuje hodnoty nájdené v hre pred ich zmenou doplnkom do tesmioloader.log. Používajte iba pri riešení problémov a kontrolách po aktualizácii hry.
accumulator.description = Akumulátory pre vašu elektrickú sieť. Budova s veľkým úložiskom energie sa nabíja pri prebytku elektriny a vracia ju pri nedostatku.
accumulator.group.battery = Akumulátor
accumulator.group.battery.description = Ktoré budovy sa považujú za akumulátory a ako rýchlo sa nabíjajú a vybíjajú.
accumulator.group.window = Okno budovy
accumulator.group.grid = Elektrická sieť
accumulator.group.diagnostics = Riešenie problémov
accumulator.enabled.label = Doplnok zapnutý
accumulator.enabled.description = ON zapne nabíjanie a vybíjanie akumulátorových budov.\nOFF zastaví vybíjanie. Budovy zostanú a stále sa môžu nabíjať.
accumulator.building_types.label = Typy budov
accumulator.building_types.description = Typy budov, ktoré môžu fungovať ako akumulátory. Viac čísel oddeľte čiarkami.\n19 = transformátor\n18 = rozvodňa\nNepoužívajte 17: elektráreň nemôže prijímať elektrinu a nikdy by sa nenabila.
accumulator.min_capacity.label = Minimálna kapacita na fungovanie ako akumulátor
accumulator.min_capacity.description = Minimálna kapacita úložiska, aby sa budova považovala za akumulátor. Vylučuje malé úložiská bežných rozvodní.\nVyššia hodnota = menej budov sa považuje za akumulátory\nNižšia hodnota = viac budov sa považuje za akumulátory\nPriložený „Stationary Accumulator“ má 5000.
accumulator.charge_rate.label = Rýchlosť nabíjania (výkon za sekundu)
accumulator.charge_rate.description = Maximálny výkon, ktorý akumulátor prijme za sekundu. Limit bráni prázdnemu akumulátoru odobrať elektrinu celému mestu.\nVyššia hodnota = rýchlejšie nabíjanie a väčšia záťaž siete\nNižšia hodnota = pomalšie nabíjanie a menšia záťaž\nNa porovnanie: uhoľná elektráreň dodáva 70 a veterná turbína 15.
accumulator.discharge_rate.label = Rýchlosť vybíjania (výkon za sekundu)
accumulator.discharge_rate.description = Maximálny výkon, ktorý akumulátor dodá za sekundu. Dodáva ho iba pri nedostatku v sieti.\nVyššia hodnota = pokryje väčší nedostatok výkonu\nNižšia hodnota = uložená energia vydrží dlhšie\nPríklad: pri 60 nahradí plný akumulátor s kapacitou 5000 elektráreň na niečo vyše 80 sekúnd.
accumulator.panel.label = Riadok nabitia v okne akumulátora
accumulator.panel.description = ON pridá do okna akumulátora úroveň nabitia, napríklad „Nabitie: 4210.5 / 5000 (84.2 %)“.
accumulator.panel_caption.label = Popis tohto riadka
accumulator.panel_caption.description = Slovo pred úrovňou nabitia. Iba písmená bez diakritiky a špeciálnych znakov, inak hra zobrazí nezmyselné znaky.
accumulator.gauges.label = Vypočítaj ukazovatele okna z akumulátora
accumulator.gauges.description = ON nahradí nesprávne zobrazenie hry skutočným prítokom a odtokom energie akumulátora.\nOFF používa bežné zobrazenie hry. Počas nabíjania môže ukazovať výkon 0 a „bez dodávky elektriny“.
accumulator.spread_voltage.label = Experiment: prenášaj napätie k susedom (nechajte vypnuté)
accumulator.spread_voltage.description = ON nemá účinok. Táto stará funkcia bola technicky nahradená. Nechajte OFF.
accumulator.trace.label = Zaznamenávaj susedov prvého akumulátora
accumulator.trace.description = ON zapisuje do protokolu, koľko elektriny dostávajú budovy vedľa prvého akumulátora. Iba na riešenie problémov; môže znížiť výkon.
accumulator.log_seconds.label = Sekundy medzi riadkami protokolu akumulátora
accumulator.log_seconds.description = Interval medzi správami o stave akumulátora v tesmioloader.log. Každá správa obsahuje nabitie, prítok a odtok.\n0 = bez správ o stave\nVyššia hodnota = menej časté zapisovanie
accumulator.probe.label = Sekundy medzi zoznamami budov v protokole
accumulator.probe.description = Interval medzi zoznamami všetkých budov s úložiskom elektriny v tesmioloader.log. Používajte iba vtedy, keď sa akumulátor nerozpozná, alebo po aktualizácii hry.\n0 = nezapisuj tieto zoznamy\nVyššia hodnota = menej časté zapisovanie
cities.description = Veľkosť a tvar každého mesta. V základnej hre je každé mesto kruh s polomerom 1000 m. S týmto doplnkom nastavíte polomer každého mesta samostatne, prípadne ako štvorec, priamo v okne mesta. Hodnoty sa uchovávajú v uloženej hre.
cities.group.cities = Mestá
cities.group.slider = Posuvník polomeru
cities.group.slider.description = Aký rozsah má posuvník v okne mesta a o koľko sa hodnota zmení jedným kliknutím na + alebo -.
cities.group.layout = Rozloženie v okne mesta
cities.group.layout.description = Poloha dvoch nových riadkov v okne mesta. Čísla sú pozície vo vlastnej jednotke okna hry; okno má šírku približne 500.
cities.group.overlay = Bodová mriežka na zemi
cities.group.diagnostics = Riešenie problémov
cities.enabled.label = Doplnok zapnutý
cities.enabled.description = ON zapne vlastné veľkosti a tvary miest.
cities.window.label = Posuvník polomeru a políčko štvorcového tvaru v okne mesta
cities.window.description = ON zobrazí posuvník polomeru a políčko štvorcového tvaru v okne mesta.\nOFF skryje oboje; nastavené hodnoty zostanú, ale už ich nebudete môcť meniť.
cities.adopt.label = Priraď osirelým budovám vlastné mesto
cities.adopt.description = Pri zmenšení mesta môžu budovy zostať mimo neho a už nepatriť žiadnemu mestu.\nON pre ne založí nové mesto s náhodným názvom a dnešným dátumom, tak ako to robí samotná hra.\nOFF ich ponechá bez mesta; správanie hry vtedy nie je otestované.
cities.radius.label = Predvolený polomer (m)
cities.radius.description = Predvolený polomer miest, ktoré ste nenastavili individuálne. Hodnota platí na každej mape.\n1000 = polomer základnej hry\nVyššia hodnota = väčšie mestá\nNižšia hodnota = menšie mestá
cities.square.label = Predvolený tvar je štvorec
cities.square.description = ON zmení mestá bez individuálneho nastavenia na štvorcové.\nOFF používa kruh ako v základnej hre.
cities.radius_min.label = Najmenší polomer na posuvníku (m)
cities.radius_min.description = Hodnota na ľavom konci posuvníka.
cities.radius_max.label = Najväčší polomer na posuvníku (m)
cities.radius_max.description = Hodnota na pravom konci posuvníka. Posuvník má 100 krokov; pri rozsahu 200 až 5000 má jeden krok 48 m.
cities.step.label = Percentá na kliknutie tlačidla
cities.step.description = Percento rozsahu posuvníka zmenené jedným kliknutím na + alebo -. Neplatí pri ťahaní posuvníka.\nVyššia hodnota = väčšia zmena na kliknutie\nNižšia hodnota = jemnejšia zmena na kliknutie
cities.label_x.label = Poloha popisu
cities.label_x.description = Vzdialenosť popisu od ľavého okraja okna.
cities.widget_x.label = Poloha ovládacieho prvku
cities.widget_x.description = Vzdialenosť posuvníka a políčka od ľavého okraja okna. Posuvník potrebuje približne 225.
cities.checkbox_dy.label = Posuň riadok políčka nahor alebo nadol
cities.checkbox_dy.description = Posunie začiarkavacie políčko nahor alebo nadol, aby neprekrývalo posuvník.\nVyššia hodnota = políčko nižšie\nNižšia hodnota = políčko vyššie
cities.overlay.label = Zobrazenie hranice sleduje polomer a tvar
cities.overlay.description = Kým je otvorené okno mesta, hra zobrazuje na zemi modrú bodovú mriežku, ale vždy iba pre kruh s polomerom 1000 m.\nON prispôsobí mriežku vášmu polomeru a tvaru.\nOFF ju ponechá ako v základnej hre.
cities.overlay_step.label = Rozstup mriežky hranice (m)
cities.overlay_step.description = Vzdialenosť medzi bodmi zobrazenia hranice mesta.\n0 = automaticky použi dvadsatinu polomeru, najmenej 50 m\nNižšia hodnota = hustejšie zobrazenie a vyššia záťaž
cities.probe.label = Zapisuj mestá do protokolu
cities.probe.description = ON po načítaní zapisuje polomer, tvar a počet budov každého mesta do tesmioloader.log. Ďalšie správy sa zapisujú, kým je otvorené okno mesta. Iba na riešenie problémov; protokol môže rýchlo narásť.
depletion.description = Ložiská sa vyčerpávajú. Pracujúca baňa viditeľne odťažuje ložisko z mapy a čím menej ho zostáva, tým menej vyrába. Ťažba sa uchováva v uloženej hre; ak doplnok neskôr vypnete, vyťažené množstvo sa nevráti. Najprv to vyskúšajte na kópii uloženej hry.
depletion.group.depletion = Ťažba
depletion.group.window = Okno bane
depletion.group.diagnostics = Riešenie problémov
depletion.enabled.label = Doplnok zapnutý
depletion.enabled.description = ON umožní vyčerpávanie vybraných ložísk pri ťažbe.\nOFF zastaví ďalšie vyčerpávanie. Už odstránené suroviny sa neobnovia.
depletion.tonnes_per_texel.label = Tony na bod mapy
depletion.tonnes_per_texel.description = Tony, ktoré môže baňa vyťažiť z úplne plného bodu mapy surovín. Slabšie body dávajú úmerne menej.\nVyššia hodnota = ložiská vydržia dlhšie\nNižšia hodnota = ložiská sa vyčerpajú skôr\nNa porovnanie: baňa s polomerom vyhľadávania 210 m pokrýva niekoľko tisíc bodov mapy.
depletion.vanilla.label = Vyčerpateľné ložiská základnej hry
depletion.vanilla.description = Ložiská základnej hry, ktoré sa môžu vyčerpať. Viac hodnôt oddeľte čiarkami.\noil, iron, coal, uranium, bauxite, gravel = iba uvedené ložiská\nall = každé ložisko\nnone = žiadne ložisko základnej hry\nname:value = vlastné tony na bod mapy, napríklad iron:3000\nLožiská z deposits.ini sú zahrnuté vždy.\ngravel trvalo odstraňuje viditeľnú textúru zeme a potrebuje oveľa vyššiu hodnotu pre malú oblasť vyhľadávania. Vynechajte gravel, ak chcete zachovať správanie základnej hry.
depletion.flush_seconds.label = Sekundy do uloženia ťažby
depletion.flush_seconds.description = Sekundy medzi aktualizáciami mapy surovín. Produkcia a kvalita sa menia okamžite; iba minimapa a uložená hra sa menia v tomto intervale.\nNižšia hodnota = častejšie aktualizácie a vyššia záťaž\nNeaktualizujte viac než štyrikrát za sekundu.
depletion.panel.label = Riadok zostávajúceho ložiska v okne bane
depletion.panel.description = ON zobrazí zostávajúcu zásobu v okne bane a mierne zvýši okno, napríklad „Zostava: 251.4 kt / 259.3 kt (96.9 %)“.
depletion.panel_caption.label = Popis tohto riadka
depletion.panel_caption.description = Slovo pred zostávajúcim množstvom. Iba písmená bez diakritiky a špeciálnych znakov, inak hra zobrazí nezmyselné znaky.
depletion.log_seconds.label = Interval riadkov priebehu (sekundy)
depletion.log_seconds.description = Sekundy medzi správami o stave bane v tesmioloader.log. Každá správa obsahuje zostávajúce množstvo, celkové množstvo a kvalitu.\n0 = bez správ o stave\nVyššia hodnota = menej časté zapisovanie\nSledujte niekoľko herných dní, aby ste našli vhodnú hodnotu ton na bod mapy.
easystart.description = Potreby občanov pribúdajú postupne v priebehu rokov. Potreba, ktorá ešte nie je odomknutá, neovplyvňuje šťastie a zdravie; občania tam stále chodia a nakupujú, iba následky sa prejavia až od jej roka.
easystart.group.general = Čo sa odkladá
easystart.group.unlock = Roky odomknutia
easystart.group.unlock.description = Rok, v ktorom požiadavka začne platiť od 1. januára. Harmonogram je určený pre republiku založenú v roku 1920. Pri začiatku v roku 1960 sú prednastavené roky už v minulosti.\noff = neodkladaj; správanie základnej hry\nalways = uplatňuj od prvého herného dňa\nRok = odomkni v danom roku
easystart.group.diagnostics = Riešenie problémov
easystart.enabled.label = Doplnok zapnutý
easystart.enabled.description = ON odomyká potreby a požiadavky na technické siete podľa nastaveného harmonogramu.
easystart.demands.label = Odlož deväť potrieb občanov
easystart.demands.description = ON odloží potraviny, mäso, oblečenie, elektroniku, alkohol, náboženstvo, kultúru, šport a zdravie do nastavených rokov odomknutia.
easystart.utilities.label = Odlož tri požiadavky budov na technické siete
easystart.utilities.description = ON odloží požiadavky na elektrinu, vodu a vykurovanie do nastavených rokov odomknutia.
easystart.warnings.label = Odlož upozornenia v okne budovy
easystart.warnings.description = ON skryje súvisiace upozornenia do roka odomknutia, napríklad „budova bez dodávky elektriny“.
easystart.pin_status.label = Udržuj spokojnosť pri zamknutých potrebách
easystart.pin_status.description = ON udržiava uspokojenie zamknutej potreby na hodnote uvedenej nižšie.\nOFF umožňuje ďalší pokles spokojnosti; pri odomknutí potreby už môže byť veľmi nízka.
easystart.locked_status.label = Spokojnosť počas zamknutia
easystart.locked_status.description = Uspokojenie potreby, kým je zamknutá. Pri potravinách hodnota znamená sýtosť.\n1.0 = úplne spokojný alebo nasýtený\n0.5 = stredná hodnota s citeľným zlepšením po odomknutí
easystart.clear_unsatisfied.label = Vynechaj zamknuté potreby zo zoznamu neuspokojených
easystart.clear_unsatisfied.description = ON zabráni zamknutým potrebám vytvárať správu „N občanov nemohlo získať X“.
easystart.probe.label = Zapisuj odomknutia do protokolu
easystart.probe.description = ON pri každej zmene roka zapisuje potreby, ktoré zostávajú zamknuté, do tesmioloader.log. Raz zaznamená aj prvého dotknutého občana. Iba na riešenie problémov.
easystart.food.label = Potraviny
easystart.religion.label = Náboženstvo
easystart.meat.label = Mäso
easystart.clothes.label = Oblečenie
easystart.alcohol.label = Alkohol
easystart.sport.label = Šport
easystart.culture.label = Kultúra
easystart.health.label = Zdravie
easystart.electricity.label = Elektrina
easystart.water.label = Voda (zahŕňa kanalizáciu)
easystart.heating.label = Vykurovanie
easystart.electronics.label = Elektronika
easystart.school.label = Škola
easystart.school.description = Pred týmto rokom sa deti učia bez školy, ako pri nastavení vzdelávania „Jednoduché“ v hre, a správa „N detí nemôže chodiť do školy“ sa nezobrazuje.
easystart.kindergarten.label = Materská škola
easystart.kindergarten.description = Pred týmto rokom nemusí žiadny rodič zostať doma s dieťaťom mladším ako šesť rokov a správa „N pracovníkov nemôže pracovať, pretože všetky materské školy …“ sa nezobrazuje.
plugin.needs = Needs
plugin.needs.description = Spravujte dodatočné potreby občanov a prepínače doplnku bez úpravy pôvodného súboru.
tab.needs.editor = Potreby
group.needs = Potreby občanov
group.needs.plugin = Nastavenia doplnku
group.needs.plugin.description = Prepínače platné pre všetky potreby.
needs.list = Zoznam potrieb
needs.add = Pridaj potrebu
needs.select_help = Vyberte potrebu vľavo alebo pomocou + pridajte surovinu zaregistrovanú v Resources.
needs.resource = Surovina
needs.resource.help = Surovina, ktorú majú občania požadovať. Musí byť zaregistrovaná v zozname doplnku Resources.
needs.donor = Vzorová potreba
needs.donor.description = Existujúca potreba použitá ako vzor.\nfood alebo meat = pre obchody s potravinami\nclothes alebo eletronics = pre obchodné domy\nalcohol = pre obchody s alkoholom\neletronics je zápis používaný hrou.
needs.factor = Násobiteľ množstva
needs.factor.description = Množstvo tovaru vzhľadom na vzorovú potrebu.\n1.0 = rovnaké množstvo ako pri vzore\nVyššia hodnota = občania potrebujú viac\nNižšia hodnota = občania potrebujú menej
needs.category = Kategória obchodu
needs.category.description = Obchody, ktoré skladujú tovar.\nauto = rovnaké obchody ako pre vzorovú potrebu\nnone = bez automatického regála; budova musí tovar poskytovať sama\nbasic = iba základné obchody\nmedium = iba stredné obchody\nadvanced = iba veľké obchody\nmediumadvanced = iba stredné a veľké obchody\nhotel = iba hotely\nČíslo = zapíš túto hodnotu obchodu priamo; iba pre používateľov oboznámených so súbormi hry
needs.chance = Pravdepodobnosť
needs.chance.description = Pravdepodobnosť od 0 do 1, že občan dostane túto potrebu. Pri hodnote pod 1 sa prideľuje nezávisle od vzoru.\n0 = nedostane ju žiadny občan\n1 = dostane ju každý vhodný občan
needs.unhappy = Nespokojnosť
needs.unhappy.description = Strata spokojnosti, keď občan nemôže získať tovar.\n0 = bez straty; potreba sa iba zobrazuje\n0.005 až 0.02 = bežný rozsah pre tovar zvyšujúci pohodlie\nPovolený rozsah: 0 až 1
needs.enabled = Doplnok zapnutý
needs.enabled.description = ON zapne doplnok.\nOFF ho pri ďalšom spustení hry úplne vypne.
needs.demand = Pridávaj potreby
needs.demand.description = ON pridelí občanom novú potrebu.\nOFF potrebu neprideľuje, ale stále môže pridávať tovar do obchodov.
needs.storage = Zásobuj obchody
needs.storage.description = ON pridá tovar do vybraných obchodov.\nOFF nepridá skladové miesta; občania potom nájdu tovar iba v budovách, ktoré ho poskytujú samy.
needs.max_demands = Potreby na občana
needs.max_demands.description = Maximálny počet dodatočných potrieb, ktoré môže občan mať súčasne.\n1 = najviac jedna dodatočná potreba\n7 = najvyšší povolený počet
needs.when_full = Keď už má občan plný počet potrieb
needs.when_full.description = Čo sa stane, keď už má občan maximálny počet dodatočných potrieb.\nskip = počkaj na voľné miesto\nreplace = tentoraz nahraď vzorovú potrebu
needs.probe = Podrobný protokol
needs.probe.description = ON zapisuje zoznamy potrieb občanov a informácie o každom obchode do podrobného protokolu doplnku.\nOFF zapisuje iba upozornenia. Zapnite dočasne pri kontrole nových obchodov.
needs.log_seconds = Interval riadkov priebehu (sekundy)
needs.log_seconds.description = Sekundy medzi správami o počte pridelených potrieb.\n0 = vypni tieto správy\nVyššia hodnota = menej časté zapisovanie
tab.needs.general = Všeobecné
plugin.deposits = Deposits
plugin.deposits.description = Spravujte typy ložísk, ktoré v základnej hre chýbajú, a prepínače doplnku bez úpravy pôvodného súboru.
tab.deposits.general = Všeobecné
tab.deposits.editor = Ložiská
group.deposits = Ložiská
group.deposits.description = Pôvodné ložiská sú chránené a možno ich skryť; vlastné ložiská sa uchovávajú samostatne a zlúčia sa do platného deposits.ini. Každá sekcia okrem [deposits] predstavuje jedno ložisko.
group.deposits.plugin = Nastavenia doplnku
group.deposits.plugin.description = Tri podsystémy v sekcii [deposits]. Každý je vypnutý pre všetky ložiská, keď je jeho prepínač tu vypnutý.
deposits.notice = Číslo typu ložiska, jeho kanál mapy a token v building.ini sú súčasťou uloženej hry, keď ich začne používať baňa. Odstránenie alebo prečíslovanie ložiska používaného uloženou hrou môže túto hru znefunkčniť; najprv to vyskúšajte na kópii.
deposits.list = Zoznam ložísk
deposits.add = Pridaj ložisko
deposits.select_help = Vyberte ložisko vľavo alebo pomocou + pridajte ložisko pre surovinu zaregistrovanú v Resources.
deposits.name = Ložisko
deposits.name.help = Názov sekcie v deposits.ini. Označuje ložisko v protokole a v štetci editora; neskôr ho nemožno premenovať.
deposits.new_name = Názov ložiska
deposits.new_hint = Tu sa zadávajú iba štandardné nastavenia. Všetko ostatné (komponent, typ budovy, vyčerpávanie) je po pridaní v nastaveniach vpravo.
deposits.code_patch = Úprava kódu
deposits.code_patch.description = ON vloží nastavené typy ložísk $TYPE_MINE_ do hry, aby ich bane mohli nájsť cez building.ini. Ak očakávané údaje hry po aktualizácii už nezodpovedajú, doplnok nič nezmení.
deposits.minimap_all = Vrstvy minimapy
deposits.minimap_all.description = ON zobrazí pod piatimi tlačidlami minimapy hry tlačidlo pre každé samostatne zapnuté ložisko doplnku.\nOFF skryje všetky tlačidlá ložísk doplnku.
deposits.editor_all = Štetce editora terénu
deposits.editor_all.description = ON zobrazí v karte surovín editora terénu štetec na kreslenie a mazanie pre každé ložisko s názvom štetca.\nOFF skryje všetky štetce ložísk doplnku.
deposits.token = Token budovy
deposits.token.description = Token, ktorý baňa používa v building.ini pre toto ložisko, napríklad $TYPE_MINE_COPPER. Zadajte ho ako $TYPE_MINE_GRAVEL. V jednom building.ini nikdy nepoužívajte dva tokeny ložísk.
deposits.type = Číslo typu
deposits.type.description = Jedinečné číslo typu ložiska. Dve ložiská nesmú používať rovnaké číslo.\n10 až 127 = povolený rozsah\n0 až 9 = vyhradené pre základnú hru\nDialóg automaticky navrhne ďalšie voľné číslo.
deposits.map = Mapa
deposits.map.description = Mapa, na ktorej je ložisko uložené.\nauto = automaticky vyber voľné miesto na mape doplnku; odporúčané\nresourcemap alebo resourcemap2 = použi mapy základnej hry\nresourcemap3 až resourcemap10 = použi dodatočné mapy doplnku\nterrain = použi priamo namaľovanú zem, napríklad pre štrk; jeho štetec sa zobrazí pod ROCKS
deposits.component = Komponent
deposits.component.description = Každá mapa má štyri miesta od 0 do 3. Každé môže obsahovať jedno ložisko.\nPri auto = nechajte pole prázdne; doplnok vyberie voľné miesto\nPri terrain: 2 = vrstva štrku\nPri terrain: 3 = vrstva oázy
deposits.building_type = Typ budovy
deposits.building_type.description = Typ budovy, ktorá dokáže ťažiť toto ložisko.\n7 = baňa; správne pre takmer každé ložisko\n92 = studňa\nPrázdne pole = 7
deposits.radius = Polomer vyhľadávania
deposits.radius.description = Ako ďaleko baňa hľadá svoje ložisko.\noil, ore, bauxite, gravel, wood, water, watersurface = použi príslušnú konštantu hry\nČíslo = použi priamo túto vzdialenosť\nPrázdne pole = použi ore\nBez polomeru baňa nenájde žiadne ložisko.
deposits.icon = Ikona minimapy
deposits.icon.description = Surovina, ktorej ikona sa zobrazí na tlačidle minimapy. Doplnok používa ikonu už načítanú hrou; samostatný obrázok nie je potrebný.\nSuroviny doplnku Resources v ňom musia byť zaregistrované.\nPrázdne pole = bez ikony
deposits.minimap = Tlačidlo minimapy
deposits.minimap.description = ON pridá tlačidlo minimapy a zobrazovaciu vrstvu pre toto ložisko.
deposits.editor = Názov štetca editora
deposits.editor.description = Názov štetcov na kreslenie a mazanie v editore terénu. Rovnaký názov sa používa pre tool_paint_<name>.png a tool_erase_<name>.png v vfs\media_soviet\editor.\nPrázdne pole = nevytváraj štetec\nPovolené: najviac 31 znakov — písmená, číslice, _ a -
deposits.deplete = Vyčerpávanie na texel
deposits.deplete.description = Toto nastavenie číta doplnok Depletion. Určuje tony, ktoré môže baňa vyťažiť z úplne plného bodu mapy surovín. Slabšie body dávajú úmerne menej.\nHodnota prepisuje tonnes_per_texel v plugins\depletion.ini.\n0 = toto ložisko zostáva nekonečné\nPrázdne pole = použi všeobecnú hodnotu
deposits.save_warning = Zmeny sa zapíšu do platného deposits.ini až pri uložení. Čísla typov, kanály mapy a tokeny ložísk, ktoré už uložená hra používa, sa nesmú meniť; najprv to vyskúšajte na kópii.
depletion.tab.general = Všeobecné
depletion.tab.mining = Ťažba
needs.save_warning = Zmeny sa zapíšu do platného needs.ini až pri uložení. Každá potreba pridá dotknutým obchodom skladové miesto, ktoré je súčasťou uloženej hry — najprv to vyskúšajte na kópii.
bp.name = Buildings Plus
bp.description = Nové budovy z deklarácie: vzorová budova hry a riadky building.ini, ktoré sa líšia. Pri každom spustení hry sa zapíšu ako úplné položky Workshopu.
bp.notice = Každá budova sa stane priečinkom v media_soviet\workshop_wip s vlastným ID Workshopu. Nechajte ID prázdne a doplnok pri spustení hry pridelí ďalšie voľné číslo od 9300000000 a uchová ho v plugins\buildings_plus.ids.ini. Hra číta priečinok ako nezverejnenú položku Workshopu. Zmeny vyžadujú úplný reštart. Uložená hra obsahujúca takúto budovu potrebuje tento priečinok pri načítaní.
bp.tab.general = Všeobecné
bp.tab.buildings = Budovy
bp.tab.generated = Vygenerované budovy
bp.wip = Vygenerované budovy v priečinku hry
bp.wip.description = Zobrazuje budovy, ktoré Buildings Plus alebo pôvodný doplnok buildings vygenerovali do media_soviet\workshop_wip. Zobrazené údaje sa čítajú z priečinkov.
bp.wip.empty = Zatiaľ tu nie je žiadna vygenerovaná budova. Budovy sa generujú pri spustení hry, keď je niektorá zapnutá.
bp.group = Budovy
bp.group.notice = Budova tu je kópiou budovy hry s inými riadkami: rovnaký model, rovnaké pripojenia, váš výrobný recept. Vyberte vzor rovnakého druhu (baňu pre baňu, továreň pre továreň).
bp.list = Budovy
bp.add = Pridaj
bp.select_help = Vyberte budovu vľavo alebo ju pridajte pomocou +. Najprv sa vyberá vzor, ID Workshopu môže zostať prázdne; názov a riadky sa zadávajú vpravo.
bp.id = Názov objektu
bp.id.help = Určuje názov priečinka a objektu vygenerovanej budovy a zobrazuje sa v protokole. Iba písmená, číslice, _ a -, najviac 64 znakov; neskôr ho nemožno zmeniť.
bp.save_warning = Zmeny sa zapíšu do platného buildings_plus.ini až pri uložení a prejavia sa po úplnom reštarte hry. Doplnok potom zapíše priečinok do media_soviet\workshop_wip; sekcia s chybou sa preskočí a uvedie v protokole.
bp.list.note = Najviac 256 budov.
bp.new_name = Názov objektu
bp.new_hint = Medzery sa zmenia na podčiarkovníky, veľké písmená na malé.
bp.card.folders = Vygenerované priečinky
bp.card.log = Riešenie problémov
bp.card.new = Nová budova
bp.links = Návody
bp.link.readme = README (návod)
bp.prune = Vyčisti priečinky
bp.prune.description = ON pri ďalšom spustení hry odstráni vygenerovaný priečinok budovy, ktorú ste odstránili alebo vypli (iba priečinky vytvorené týmto doplnkom).\nOFF ponechá takéto priečinky; hra bude tieto budovy naďalej načítavať.
bp.always = Vždy prepíš
bp.always.description = ON zapisuje každý priečinok budovy pri každom spustení hry.\nOFF zapisuje priečinok iba pri zmene jeho sekcie, doplnku alebo súboru vzoru. Nechajte OFF.
bp.verbose = Podrobný protokol
bp.verbose.description = ON zapisuje každý skopírovaný súbor a každý odstránený riadok vzoru do logs\tesmioloader.buildings_plus.log.\nOFF zapisuje iba výsledky, upozornenia a chyby.
bp.repair_owner_ids = Doplň ID vlastníka
bp.repair_owner_ids.description = ON doplní vaše Steam ID do vygenerovaných budov, ktoré ho nemajú, vrátane budov iných generátorov. Bez neho sa hra pýta na chýbajúce položky Workshopu pri každom načítaní uloženej hry používajúcej takúto budovu.\nOFF nemení priečinky iných generátorov.
bp.card.saves = Uložené hry
bp.card.saves.description = Uložená hra si pamätá sklady každej stojacej budovy. Takto sa nový skladový riadok jednej z vašich budov dostane aj do týchto budov.
bp.retrofit = Udržuj sklady už stojacich budov aktuálne
bp.retrofit.description = ON: pri načítaní uloženej hry dostane každá dokončená vygenerovaná budova prázdne sklady pre jednotlivé suroviny, ktoré ste pridali do jej sekcie. Pri zmene veľkosti v skladovom riadku sa zmení aj sklad; zmenšenie počká, kým sa doň zásoby zmestia. Sklad, ktorého riadok ste odstránili, zmizne z budov, len čo sa vyprázdni.\nOFF: sklady už stojacich budov zostanú nezmenené; nové a zmenené riadky ovplyvnia iba budovy postavené neskôr.
bp.enabled = Budova zapnutá
bp.enabled.description = ON vygeneruje túto budovu pri ďalšom spustení hry.\nOFF ju nevygeneruje. Pri zapnutom „Vyčisti priečinky“ sa jej existujúci priečinok pri ďalšom spustení odstráni.
bp.item_id = ID Workshopu
bp.item_id.description = Možné vlastné číslo: 9000000000 až 9999999999, okrem 9100000000 až 9199999999 (vyhradené pre iné generátory)\nUrčuje názov priečinka v workshop_wip v priečinku hry a neskôr by sa nemalo meniť.
bp.donor = Vzorová budova
bp.donor.description = Budova, z ktorej vzniká kópia — budovu z Workshopu musíte odoberať.\nPoužite „Vyber vzor...“ na prehliadanie dostupných budov. Zvoľte rovnaký druh: baňu pre baňu, továreň pre továreň, obchod pre obchod.
bp.item_name = Názov v hre
bp.item_name.description = Názov zobrazený v hre.\nHodnota s bodkami sa považuje za prekladový kľúč a vyhodnotí sa cez doplnok Localization, napríklad: localization.lang.salt_mine
bp.desc = Opis
bp.desc.description = Opis položky Workshopu, jeden riadok na riadok. Bez úvodzoviek.
bp.line = Riadky building.ini
bp.line.description = Jeden riadok building.ini na riadok, napríklad $PRODUCTION raw_salt 1.0. Pomocou „Vyber riadok…“ prevezmite riadok zo vzorovej budovy a upravte ho. Vaše riadky sa vložia pred riadky vzoru a nahradia: rovnaký token; všetky $TYPE_*; všetky $STORAGE* spolu s $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION a $CONSUMPTION_PER_SECOND ako jeden výrobný recept. Všetko ostatné zo vzoru zostane.\nPre vlastné suroviny vždy použite $STORAGE_IMPORT_SPECIAL alebo $STORAGE_EXPORT_SPECIAL s uvedenou surovinou, inak sklad uvádza všetky suroviny prepravnej triedy.
bp.strip = Odstráň riadky vzoru
bp.cmd_add = Pripoj
bp.cmd_add.description = Jeden príkaz na riadok: nový riadok vložený pred uzatvárací koniec súboru vzoru. Blok viacerých riadkov sa zapisuje s | medzi riadkami.
bp.cmd_replace = Nahraď
bp.cmd_replace.description = Jeden príkaz na riadok: starý riadok | nový riadok. Starý riadok sa musí v súbore vzoru nachádzať presne raz.
bp.cmd_remove = Odstráň
bp.cmd_remove.description = Jeden príkaz na riadok: riadok súboru vzoru, ktorý sa má odstrániť. Príslušné riadky (body, poloha) sa odstránia s ním.
bp.cmd_insert = Vlož
bp.cmd_insert.description = Jeden príkaz na riadok: 0 alebo 1 | kotva | nový riadok. 0 vloží nový riadok pred kotvu, 1 za ňu.
bp.strip.description = Jeden $TOKEN na riadok, napríklad $WORKERS_NEEDED. Každý riadok vzoru s daným tokenom sa odstráni bez náhrady.
bp.life = Odolnosť
bp.life.description = Prázdne = 3000\nLIFE v renderconfig.ini: koľko budova vydrží, kým sa zrúti. Ako väčšina budov v hre.
bp.card.lines = Riadky
bp.item_id.empty = doplnok pri spustení hry pridelí ďalšie voľné číslo od 9300000000.
bp.item_name.empty = názov objektu — neodporúča sa.
needs_plus.card.log = Riešenie problémov
resources_plus.card.log = Riešenie problémov
resources_plus.card.plugin = Doplnok
resources_plus.custom_report = Zaznamenávaj klonované záznamy
resources_plus.custom_report.description = ON pre každú surovinu so vzorom zapisuje, čo klon skutočne zdedil (prepravnú triedu, násobitele, príznaky). Suroviny bez vzoru sa uvádzajú vždy.\nOFF uvádza iba tie bez vzoru.
resources_plus.customs_hook = Obnov colnice
resources_plus.customs_hook.description = ON pridá nové suroviny do obchodného zoznamu už existujúcich colníc.\nOFF zodpovedá základnej hre: colnica obchoduje iba s tým, čo poznala pri výstavbe — potom pomôže iba zbúranie a opätovná výstavba.
resources_plus.customs_probe = Zaznamenávaj riadky colníc
resources_plus.customs_probe.description = ON zapisuje do tesmioloader.log jeden riadok za každú surovinu pridanú do colnice. Prepnite na OFF, keď colnice zobrazujú očakávané suroviny.
resources_plus.price_hook = Použi ceny z INI
