[language]
name = Español

[strings]
plugin.resources = Resources
plugin.resources.description = Gestiona recursos, propiedades y sustituciones opcionales de precios.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Recursos propios con Resources Plus: la misma lista que el original, en plugins\resources_plus.ini, sin el cierre inesperado al salir.
resources_plus.save_warning = Los cambios se escriben en plugins\resources_plus.ini al guardar. Eliminar un recurso que ya utiliza una partida guardada puede dañarla.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Necesidades ciudadanas propias con Needs Plus: la misma lista que el original, en el archivo needs_plus.ini de la carpeta plugins, importada de needs.ini en el primer inicio.
needs_plus.save_warning = Los cambios se escriben en needs_plus.ini de la carpeta plugins solo al guardar. Cada necesidad añade un espacio de almacenamiento a las tiendas afectadas, y ese espacio forma parte de la partida guardada; prueba primero en una copia.
tab.resources.editor = Recursos
group.resource_definitions = Definiciones de recursos
detail.transport = Clase de transporte
detail.transport.description = Qué vehículos y almacenes transportan y almacenan el recurso. Basta con elegir un nombre; el complemento añade los valores del juego base para esa clase.
detail.kind = Tipo de precio
detail.kind.description = 0 materia prima, 1 producto manufacturado, 2 alimentos/ropa, 3 material avanzado, 4 electrónica.
detail.record_price = Precio inicial del registro
detail.record_price.description = Valores iniciales opcionales en RUB y USD dentro del registro del recurso.
detail.record_base_price = Precio base inicial del registro
detail.record_base_price.description = Valores base opcionales en RUB y USD dentro del registro del recurso.
detail.trade_mult = Multiplicadores comerciales
detail.trade_mult.description = Multiplicadores de venta y compra, normalmente 0.95, 1.05.
detail.market_rub = Bloque de mercado RUB
detail.market_usd = Bloque de mercado USD
detail.market.description = Dos valores de mercado y un coeficiente opcional.\n(Consulta la descripción del INI)
detail.packed = Carga embalada
detail.packed.description = Representación de la carga automática, sin embalar o embalada.
detail.family = Familia de materiales
detail.family.description = Qué aspecto tiene el material apilado en una obra y, probablemente, en qué residuo se convierte. Cada familia contiene un recurso de residuos. Los números del 10 al 19 del INI se muestran por su nombre.
detail.cargo = Geometría de la carga
detail.cargo.description = Selección de geometría para visualizar la carga.
detail.pinned_base_price = Precio base fijo
detail.pinned_base_price.description = Valor opcional en RUB y USD en [base_price]. Vacío significa que no hay entrada propia.
detail.forced_price = Precio final forzado
detail.forced_price.description = Valor opcional en RUB y USD en [price]. Vacío significa que el juego calcula el precio.

; --- Esquemas locales de complementos originales instalados (desde 0.13.0) ---
daynight.description = Un amanecer y un atardecer por día del calendario. En el juego base, pasar del día a la noche y volver tarda 13 días del calendario, casi dos semanas. Con este complemento cabe en un día.
daynight.group.cycle = Día y noche
daynight.group.cycle.description = Cuánto dura un ciclo de día y noche y cuándo llega la noche.
daynight.group.pace = Ritmo
daynight.group.pace.description = Dos controles independientes: uno para los vehículos y otro para todo lo demás. Siempre se aplican, sea cual sea la configuración anterior.
daynight.group.diagnostics = Resolución de problemas
daynight.enabled.label = Complemento activado
daynight.enabled.description = ON activa el ciclo de día y noche configurado.
daynight.cycle_days.label = Días del calendario por ciclo de día y noche
daynight.cycle_days.description = Días del calendario desde un amanecer hasta el siguiente.\n1 = un amanecer y un atardecer cada día\n2 a 12 = un ciclo proporcionalmente más largo\n13 = el ciclo del juego base
daynight.day_scale.label = Duración del día (cuánto se ralentiza el calendario)
daynight.day_scale.description = Cuánto más dura un día del calendario respecto al juego base.\nauto = ralentiza automáticamente el calendario para adaptarlo al ciclo de luz; recomendado\n1 = no ralentices el calendario; el día y la noche se alternan entonces 13 veces más rápido\n2 a 100 = ralentiza el calendario por este factor\nElige qué partes del juego se ralentizan en «Qué se ralentiza».
daynight.slow.label = Qué se ralentiza
daynight.slow.description = Qué partes del juego se ralentizan.\ncalendar = ralentiza solo el calendario; recomendado\nworld = ralentiza todo, incluidos ciudadanos y vehículos; los valores altos parecen cámara lenta\nnone = no ralentices nada\nCon calendar, los ciudadanos, los vehículos, la construcción y la producción mantienen su velocidad normal. Los procesos diarios, como contaminación, préstamos y mensajes, mantienen su intervalo habitual.
daynight.offset.label = Cuándo llega la noche
daynight.offset.description = Desplaza la noche dentro del día del calendario.\n0 = la oscuridad comienza poco después de la mitad del día\n0.5 = la oscuridad comienza al cambiar la fecha\nCon cualquier valor distinto de 0, un ciclo de 13 días ya no coincide exactamente con el juego base.
daynight.fade.label = Ajusta las transiciones de iluminación
daynight.fade.description = ON acorta las transiciones entre mañana, día, tarde y noche para adaptarlas al ciclo configurado.\nOFF usa las transiciones lentas del juego base. Con ciclos cortos pueden superponerse y dar un aspecto descolorido a la iluminación.
daynight.vehicle_scale.label = Velocidad de los vehículos
daynight.vehicle_scale.description = Velocidad de camiones, trenes, barcos y aeronaves. Funciona independientemente de los demás ajustes.\n1 = velocidad del juego base\n2 = mitad de velocidad\n0.5 = doble de velocidad\nMayor valor = vehículos más lentos
daynight.sim_scale.label = Velocidad de todo lo demás
daynight.sim_scale.description = Velocidad de ciudadanos, construcción, producción, desgaste y animaciones.\n1 = velocidad del juego base\n2 = mitad de velocidad\n0.5 = doble de velocidad\nMayor valor = simulación más lenta
daynight.probe.label = Registra la duración de los días
daynight.probe.description = ON escribe la duración real de cada día del calendario y transición de luz en tesmioloader.log. Úsalo solo para resolver problemas y realizar comprobaciones tras una actualización del juego.
walking.description = Qué distancia recorren los ciudadanos a pie y los propietarios de coches al conducir entre casa, trabajo y aparcamiento.
walking.group.distances = Distancias
walking.group.distances.description = Se miden por carreteras y caminos peatonales, no en línea recta. Un edificio a 400 m al otro lado del río puede suponer 1200 m a pie.
walking.group.diagnostics = Resolución de problemas
walking.enabled.label = Complemento activado
walking.enabled.description = ON activa las distancias a pie y en coche configuradas.
walking.distance.label = Distancia a pie (m)
walking.distance.description = El recorrido más largo que un ciudadano hará a pie. El juego base usa 480 m.\nMayor valor = más edificios quedan a distancia de paseo y la construcción crea más conexiones\n0 = sin límite; la construcción puede tardar entonces varios segundos en una ciudad grande\n20000 = valor máximo aceptado
walking.car_distance.label = Distancia de conducción para propietarios de coches (m)
walking.car_distance.description = El recorrido en coche más largo permitido entre casa, trabajo y aparcamiento. El juego base usa 2500 m.\nMayor valor = los propietarios de coches conducen más lejos\nEstablece un valor superior a la distancia a pie. Con valores iguales, el coche no ofrece ventaja de alcance.
walking.regen_on_load.label = Reconstruye las conexiones al cargar una partida
walking.regen_on_load.description = Las conexiones peatonales y de aparcamiento se almacenan en la partida guardada.\nON reconstruye todas las conexiones al cargar la partida, para que las distancias configuradas también afecten a las ciudades existentes.\nOFF aplica las distancias configuradas solo a los edificios de nueva construcción.
walking.probe.label = Registra los valores de comprobación
walking.probe.description = ON escribe en tesmioloader.log los valores encontrados en el juego antes de que el complemento los cambie. Úsalo solo para resolver problemas y realizar comprobaciones tras una actualización del juego.
accumulator.description = Baterías para tu red eléctrica. Un edificio con una gran reserva de energía se carga cuando sobra electricidad y la devuelve cuando falta.
accumulator.group.battery = Batería
accumulator.group.battery.description = Qué edificios cuentan como baterías y con qué rapidez se cargan y descargan.
accumulator.group.window = Ventana del edificio
accumulator.group.grid = Red eléctrica
accumulator.group.diagnostics = Resolución de problemas
accumulator.enabled.label = Complemento activado
accumulator.enabled.description = ON activa la carga y descarga de los edificios batería.\nOFF detiene la descarga. Los edificios permanecen y aún pueden cargarse.
accumulator.building_types.label = Tipos de edificio
accumulator.building_types.description = Tipos de edificio que pueden funcionar como baterías. Separa varios números con comas.\n19 = transformador\n18 = subestación\nNo uses 17: una central eléctrica no puede recibir electricidad y nunca se cargaría.
accumulator.min_capacity.label = Capacidad mínima para contar como batería
accumulator.min_capacity.description = Capacidad mínima de almacenamiento para que un edificio cuente como batería. Excluye las pequeñas reservas de las subestaciones normales.\nMayor valor = menos edificios cuentan como baterías\nMenor valor = más edificios cuentan como baterías\nEl «Stationary Accumulator» incluido tiene 5000.
accumulator.charge_rate.label = Velocidad de carga (potencia por segundo)
accumulator.charge_rate.description = Potencia máxima que una batería recibe por segundo. El límite evita que una batería vacía le quite la electricidad a toda una ciudad.\nMayor valor = carga más rápida y mayor carga en la red\nMenor valor = carga más lenta y menor carga en la red\nComo referencia, una central de carbón suministra 70 y una turbina eólica 15.
accumulator.discharge_rate.label = Velocidad de descarga (potencia por segundo)
accumulator.discharge_rate.description = Potencia máxima que una batería suministra por segundo. Solo suministra electricidad cuando falta en la red.\nMayor valor = cubre déficits de potencia mayores\nMenor valor = la energía almacenada dura más\nEjemplo: a 60, una batería llena con capacidad de 5000 sustituye a una central durante algo más de 80 segundos.
accumulator.panel.label = Fila de carga en la ventana de la batería
accumulator.panel.description = ON añade el nivel de carga a la ventana de la batería, por ejemplo «Carga: 4210.5 / 5000 (84.2 %)».
accumulator.panel_caption.label = Título de esa fila
accumulator.panel_caption.description = La palabra que aparece antes del nivel de carga. Solo letras, sin acentos ni caracteres especiales, o el juego mostrará caracteres incorrectos.
accumulator.gauges.label = Calcula los indicadores de la ventana a partir de la batería
accumulator.gauges.description = ON sustituye la visualización incorrecta del juego por el flujo real de entrada y salida de la batería.\nOFF usa la visualización normal del juego. Puede mostrar potencia 0 y «sin suministro eléctrico» mientras la batería se carga.
accumulator.spread_voltage.label = Experimento: transmite tensión a los vecinos (dejar desactivado)
accumulator.spread_voltage.description = ON no tiene efecto. Esta función antigua se ha sustituido técnicamente. Déjala en OFF.
accumulator.trace.label = Registra los vecinos de la primera batería
accumulator.trace.description = ON escribe en el registro cuánta electricidad reciben los edificios junto a la primera batería. Solo para resolver problemas; puede reducir el rendimiento.
accumulator.log_seconds.label = Segundos entre líneas de registro de la batería
accumulator.log_seconds.description = Intervalo entre los mensajes de estado de la batería en tesmioloader.log. Cada mensaje incluye carga, entrada y salida.\n0 = sin mensajes de estado\nMayor valor = registros menos frecuentes
accumulator.probe.label = Segundos entre listas de edificios en el registro
accumulator.probe.description = Intervalo entre las listas de todos los edificios con almacenamiento eléctrico en tesmioloader.log. Úsalo solo si una batería no se reconoce o tras una actualización del juego.\n0 = no escribas estas listas\nMayor valor = registros menos frecuentes
cities.description = Tamaño y forma de cada ciudad. En el juego base, cada ciudad es un círculo de 1000 m de radio. Con este complemento ajustas el radio de cada ciudad por separado, opcionalmente como un cuadrado, directamente en la ventana de la ciudad. Los valores se almacenan en la partida guardada.
cities.group.cities = Ciudades
cities.group.slider = Deslizador del radio
cities.group.slider.description = Hasta dónde llega el deslizador de la ventana de la ciudad y cuánto cambia cada clic en + o -.
cities.group.layout = Distribución en la ventana de la ciudad
cities.group.layout.description = Dónde se sitúan las dos filas nuevas en la ventana de la ciudad. Los números son posiciones en la unidad propia de la ventana del juego; la ventana tiene unos 500 de ancho.
cities.group.overlay = Cuadrícula de puntos en el suelo
cities.group.diagnostics = Resolución de problemas
cities.enabled.label = Complemento activado
cities.enabled.description = ON activa tamaños y formas personalizados para las ciudades.
cities.window.label = Deslizador del radio y casilla de forma cuadrada en la ventana de la ciudad
cities.window.description = ON muestra el deslizador del radio y la casilla de forma cuadrada en la ventana de la ciudad.\nOFF oculta ambos; los valores establecidos permanecen, pero ya no puedes cambiarlos.
cities.adopt.label = Asigna una ciudad propia a los edificios sin ciudad
cities.adopt.description = Al reducir una ciudad, algunos edificios pueden quedar fuera y dejar de pertenecer a una ciudad.\nON funda una ciudad nueva para ellos con un nombre aleatorio y la fecha actual, igual que hace el propio juego.\nOFF los deja sin ciudad; no se ha probado cómo se comporta el juego en ese caso.
cities.radius.label = Radio predeterminado (m)
cities.radius.description = Radio predeterminado para las ciudades que no has configurado individualmente. El valor se aplica en todos los mapas.\n1000 = radio del juego base\nMayor valor = ciudades más grandes\nMenor valor = ciudades más pequeñas
cities.square.label = Forma cuadrada predeterminada
cities.square.description = ON hace cuadradas las ciudades que no se han configurado individualmente.\nOFF usa un círculo como en el juego base.
cities.radius_min.label = Radio mínimo del deslizador (m)
cities.radius_min.description = El valor en el extremo izquierdo del deslizador.
cities.radius_max.label = Radio máximo del deslizador (m)
cities.radius_max.description = El valor en el extremo derecho del deslizador. El deslizador tiene 100 pasos; con un rango de 200 a 5000, un paso equivale a 48 m.
cities.step.label = Porcentaje por clic en el botón
cities.step.description = Porcentaje del rango del deslizador que cambia con un clic en + o -. No se aplica al arrastrar el deslizador.\nMayor valor = mayor cambio por clic\nMenor valor = cambio más preciso por clic
cities.label_x.label = Posición de la etiqueta
cities.label_x.description = Distancia de la etiqueta al borde izquierdo de la ventana.
cities.widget_x.label = Posición del control
cities.widget_x.description = Distancia del deslizador y la casilla al borde izquierdo de la ventana. El deslizador necesita unos 225.
cities.checkbox_dy.label = Desplaza la fila de la casilla hacia arriba o abajo
cities.checkbox_dy.description = Mueve la casilla hacia arriba o abajo para que no se superponga al deslizador.\nMayor valor = casilla más abajo\nMenor valor = casilla más arriba
cities.overlay.label = La superposición sigue el radio y la forma
cities.overlay.description = Mientras está abierta la ventana de una ciudad, el juego muestra una cuadrícula de puntos azules en el suelo, pero siempre para un círculo de 1000 m.\nON adapta la cuadrícula a tu radio y forma.\nOFF la deja como en el juego base.
cities.overlay_step.label = Separación de la cuadrícula superpuesta (m)
cities.overlay_step.description = Distancia entre los puntos que muestran el límite de la ciudad.\n0 = usa automáticamente una vigésima parte del radio, como mínimo 50 m\nMenor valor = visualización más densa y mayor coste de rendimiento
cities.probe.label = Registra las ciudades
cities.probe.description = ON escribe el radio, la forma y el número de edificios de cada ciudad en tesmioloader.log tras cargar. Se escriben más mensajes mientras está abierta la ventana de una ciudad. Solo para resolver problemas; el registro puede crecer rápidamente.
depletion.description = Los yacimientos se agotan. Una mina activa extrae visiblemente el yacimiento del mapa y produce menos cuanto menos queda. La extracción se almacena en la partida guardada; si desactivas el complemento después, lo extraído no vuelve. Pruébalo primero en una copia de tu partida guardada.
depletion.group.depletion = Extracción
depletion.group.window = Ventana de la mina
depletion.group.diagnostics = Resolución de problemas
depletion.enabled.label = Complemento activado
depletion.enabled.description = ON permite que los yacimientos seleccionados se agoten al explotarlos.\nOFF detiene el agotamiento adicional. Los recursos ya eliminados no se restauran.
depletion.tonnes_per_texel.label = Toneladas por punto del mapa
depletion.tonnes_per_texel.description = Toneladas que una mina puede extraer de un punto completamente lleno del mapa de recursos. Los puntos menos ricos rinden proporcionalmente menos.\nMayor valor = los yacimientos duran más\nMenor valor = los yacimientos se agotan antes\nComo referencia, una mina con un radio de búsqueda de 210 m cubre varios miles de puntos del mapa.
depletion.vanilla.label = Yacimientos del juego base que se agotan
depletion.vanilla.description = Yacimientos del juego base que pueden agotarse. Separa varios valores con comas.\noil, iron, coal, uranium, bauxite, gravel = solo los yacimientos indicados\nall = todos los yacimientos\nnone = ningún yacimiento del juego base\nname:value = toneladas personalizadas por punto del mapa, por ejemplo iron:3000\nLos yacimientos de deposits.ini siempre se incluyen.\ngravel desgasta permanentemente la textura visible del suelo y necesita un valor mucho mayor por su pequeña área de búsqueda. Omite gravel para mantener el comportamiento del juego base.
depletion.flush_seconds.label = Segundos hasta guardar la extracción
depletion.flush_seconds.description = Segundos entre actualizaciones del mapa de recursos. La producción y la calidad cambian inmediatamente; solo el minimapa y la partida guardada siguen este intervalo.\nMenor valor = actualizaciones más frecuentes y mayor coste de rendimiento\nNo actualices más de cuatro veces por segundo.
depletion.panel.label = Fila de yacimiento restante en la ventana de la mina
depletion.panel.description = ON muestra las reservas restantes en la ventana de la mina y aumenta ligeramente su altura, por ejemplo «Restante: 251.4 kt / 259.3 kt (96.9 %)».
depletion.panel_caption.label = Título de esa fila
depletion.panel_caption.description = La palabra que aparece antes de la cantidad restante. Solo letras, sin acentos ni caracteres especiales, o el juego mostrará caracteres incorrectos.
depletion.log_seconds.label = Intervalo de las líneas de progreso (segundos)
depletion.log_seconds.description = Segundos entre los mensajes de estado de las minas en tesmioloader.log. Cada mensaje incluye cantidad restante, cantidad total y calidad.\n0 = sin mensajes de estado\nMayor valor = registros menos frecuentes\nObserva varios días del juego para encontrar un valor adecuado de toneladas por punto del mapa.
easystart.description = Las necesidades de los ciudadanos aparecen poco a poco con los años. Una necesidad aún no desbloqueada no afecta a la felicidad ni a la salud; los ciudadanos siguen acudiendo y comprando, pero las consecuencias no se aplican hasta su año.
easystart.group.general = Qué se retrasa
easystart.group.unlock = Años de desbloqueo
easystart.group.unlock.description = Año en el que la exigencia empieza a aplicarse el 1 de enero. El calendario está diseñado para una república fundada en 1920. Si comienzas en 1960, los años predefinidos ya habrán pasado.\noff = no lo retrases; comportamiento del juego base\nalways = aplícalo desde el primer día del juego\nUn año = desbloquéalo en ese año
easystart.group.diagnostics = Resolución de problemas
easystart.enabled.label = Complemento activado
easystart.enabled.description = ON desbloquea necesidades y exigencias de servicios según el calendario configurado.
easystart.demands.label = Retrasa las nueve necesidades ciudadanas
easystart.demands.description = ON retrasa alimentos, carne, ropa, electrónica, alcohol, religión, cultura, deporte y salud hasta sus años de desbloqueo configurados.
easystart.utilities.label = Retrasa los tres servicios de los edificios
easystart.utilities.description = ON retrasa las exigencias de electricidad, agua y calefacción hasta sus años de desbloqueo configurados.
easystart.warnings.label = Retrasa las advertencias de la ventana del edificio
easystart.warnings.description = ON oculta las advertencias relacionadas hasta el año de desbloqueo, por ejemplo «edificio sin suministro eléctrico».
easystart.pin_status.label = Mantén la satisfacción de las necesidades bloqueadas
easystart.pin_status.description = ON mantiene la satisfacción de una necesidad bloqueada en el valor indicado abajo.\nOFF permite que la satisfacción siga cayendo; puede ser ya muy baja cuando se desbloquee la necesidad.
easystart.locked_status.label = Satisfacción durante el bloqueo
easystart.locked_status.description = Satisfacción mientras una necesidad está bloqueada. Para los alimentos, el valor indica saciedad.\n1.0 = completamente satisfecho o alimentado\n0.5 = valor intermedio con una mejora perceptible tras el desbloqueo
easystart.clear_unsatisfied.label = Excluye las necesidades bloqueadas de la lista de insatisfechas
easystart.clear_unsatisfied.description = ON impide que las necesidades bloqueadas generen el mensaje «N ciudadanos no pudieron obtener X».
easystart.probe.label = Registra los desbloqueos
easystart.probe.description = ON escribe en tesmioloader.log las necesidades que siguen bloqueadas en cada cambio de año. También registra una vez al primer ciudadano afectado. Solo para resolver problemas.
easystart.food.label = Alimentos
easystart.religion.label = Religión
easystart.meat.label = Carne
easystart.clothes.label = Ropa
easystart.alcohol.label = Alcohol
easystart.sport.label = Deporte
easystart.culture.label = Cultura
easystart.health.label = Salud
easystart.electricity.label = Electricidad
easystart.water.label = Agua (incluye aguas residuales)
easystart.heating.label = Calefacción
easystart.electronics.label = Electrónica
easystart.school.label = Escuela
easystart.school.description = Antes de este año los niños aprenden sin escuela, como con el ajuste de educación «Simple» del juego, y no aparece el mensaje «N niños no pueden ir a la escuela».
easystart.kindergarten.label = Guardería
easystart.kindergarten.description = Antes de este año ningún progenitor tiene que quedarse en casa por un niño menor de seis años, y no aparece el mensaje «N trabajadores no pueden trabajar porque todas las guarderías …».
plugin.needs = Needs
plugin.needs.description = Gestiona las necesidades ciudadanas adicionales y los interruptores del complemento sin editar el archivo original.
tab.needs.editor = Necesidades
group.needs = Necesidades ciudadanas
group.needs.plugin = Ajustes del complemento
group.needs.plugin.description = Interruptores que se aplican a todas las necesidades.
needs.list = Lista de necesidades
needs.add = Añadir necesidad
needs.select_help = Selecciona una necesidad a la izquierda o usa + para añadir un recurso registrado por Resources.
needs.resource = Recurso
needs.resource.help = El recurso que deben demandar los ciudadanos. Debe estar registrado en la lista del complemento Resources.
needs.donor = Necesidad de referencia
needs.donor.description = Necesidad existente que se usa como plantilla.\nfood o meat = para tiendas de alimentos\nclothes o eletronics = para grandes almacenes\nalcohol = para tiendas de alcohol\neletronics es la grafía que usa el juego.
needs.factor = Factor de cantidad
needs.factor.description = Cantidad de bienes respecto a la necesidad de referencia.\n1.0 = la misma cantidad que la referencia\nMayor valor = los ciudadanos necesitan más\nMenor valor = los ciudadanos necesitan menos
needs.category = Categoría de tienda
needs.category.description = Tiendas que almacenan los bienes.\nauto = las mismas tiendas que la necesidad de referencia\nnone = sin estante automático; el edificio debe proporcionar los bienes por sí mismo\nbasic = solo tiendas básicas\nmedium = solo tiendas medianas\nadvanced = solo tiendas grandes\nmediumadvanced = solo tiendas medianas y grandes\nhotel = solo hoteles\nUn número = escribe directamente este valor de tienda; solo para usuarios familiarizados con los archivos del juego
needs.chance = Probabilidad
needs.chance.description = Probabilidad de 0 a 1 de que un ciudadano reciba esta necesidad. Por debajo de 1 se distribuye independientemente de la referencia.\n0 = ningún ciudadano la recibe\n1 = todos los ciudadanos adecuados la reciben
needs.unhappy = Insatisfacción
needs.unhappy.description = Satisfacción perdida cuando un ciudadano no puede conseguir los bienes.\n0 = sin pérdida; la necesidad solo se muestra\n0.005 a 0.02 = rango habitual para un bien de comodidad\nRango permitido: 0 a 1
needs.enabled = Complemento activado
needs.enabled.description = ON activa el complemento.\nOFF lo desactiva por completo en el siguiente inicio del juego.
needs.demand = Añade necesidades
needs.demand.description = ON asigna la nueva necesidad a los ciudadanos.\nOFF no distribuye la necesidad, pero aún puede añadir los bienes a las tiendas.
needs.storage = Abastece las tiendas
needs.storage.description = ON añade los bienes a las tiendas seleccionadas.\nOFF no añade espacios de almacenamiento; los ciudadanos solo podrán encontrar los bienes en edificios que los proporcionen por sí mismos.
needs.max_demands = Necesidades por ciudadano
needs.max_demands.description = Número máximo de necesidades adicionales que un ciudadano puede tener al mismo tiempo.\n1 = como máximo una necesidad adicional\n7 = número máximo permitido
needs.when_full = Cuando el ciudadano alcanza el límite
needs.when_full.description = Qué ocurre cuando un ciudadano ya tiene el número máximo de necesidades adicionales.\nskip = espera a que quede un espacio libre\nreplace = sustituye esta vez la necesidad de referencia
needs.probe = Registro detallado
needs.probe.description = ON escribe las listas de necesidades ciudadanas e información sobre cada tienda en el registro detallado del complemento.\nOFF escribe solo advertencias. Actívalo temporalmente al comprobar tiendas nuevas.
needs.log_seconds = Intervalo de las líneas de progreso (segundos)
needs.log_seconds.description = Segundos entre los mensajes que indican cuántas necesidades se han asignado.\n0 = desactiva estos mensajes\nMayor valor = registros menos frecuentes
tab.needs.general = General
plugin.deposits = Deposits
plugin.deposits.description = Gestiona los tipos de yacimiento que no existen en el juego base y los interruptores del complemento sin editar el archivo original.
tab.deposits.general = General
tab.deposits.editor = Yacimientos
group.deposits = Yacimientos
group.deposits.description = Los yacimientos originales están protegidos y se pueden ocultar; los propios se almacenan por separado y se combinan en el deposits.ini efectivo. Cada sección, excepto [deposits], es un yacimiento.
group.deposits.plugin = Ajustes del complemento
group.deposits.plugin.description = Los tres subsistemas de la sección [deposits]. Cada uno queda desactivado para todos los yacimientos cuando su interruptor está desactivado aquí.
deposits.notice = El número de tipo de un yacimiento, su canal de mapa y el token de building.ini forman parte de una partida guardada en cuanto una mina los utiliza. Eliminar o renumerar un yacimiento usado por una partida guardada puede dejarla inutilizable; prueba primero en una copia.
deposits.list = Lista de yacimientos
deposits.add = Añadir yacimiento
deposits.select_help = Selecciona un yacimiento a la izquierda o usa + para añadir uno para un recurso registrado por Resources.
deposits.name = Yacimiento
deposits.name.help = El nombre de sección en deposits.ini. Identifica el yacimiento en el registro y en el pincel del editor; no se puede cambiar después.
deposits.new_name = Nombre del yacimiento
deposits.new_hint = Aquí solo se solicitan los ajustes estándar. Todo lo demás (componente, tipo de edificio, agotamiento) está a la derecha en los ajustes tras añadirlo.
deposits.code_patch = Parche de código
deposits.code_patch.description = ON introduce en el juego los tipos de yacimiento $TYPE_MINE_ configurados para que las minas puedan encontrarlos mediante building.ini. Si los datos esperados del juego ya no coinciden tras una actualización, el complemento no cambia nada.
deposits.minimap_all = Capas del minimapa
deposits.minimap_all.description = ON muestra un botón debajo de los cinco botones del minimapa del juego para cada yacimiento del complemento activado individualmente.\nOFF oculta todos los botones de yacimientos del complemento.
deposits.editor_all = Pinceles del editor de terreno
deposits.editor_all.description = ON muestra un pincel de pintura y otro de borrado en la pestaña de recursos del editor de terreno para cada yacimiento con nombre de pincel.\nOFF oculta todos los pinceles de yacimientos del complemento.
deposits.token = Token del edificio
deposits.token.description = Token que una mina usa en building.ini para este yacimiento, por ejemplo $TYPE_MINE_COPPER. Introdúcelo como $TYPE_MINE_GRAVEL. Nunca uses dos tokens de yacimiento en el mismo building.ini.
deposits.type = Número de tipo
deposits.type.description = Número de tipo único del yacimiento. Dos yacimientos no deben usar el mismo número.\n10 a 127 = rango permitido\n0 a 9 = reservados para el juego base\nEl diálogo propone automáticamente el siguiente número libre.
deposits.map = Mapa
deposits.map.description = Mapa en el que se almacena el yacimiento.\nauto = elige automáticamente un espacio libre en un mapa del complemento; recomendado\nresourcemap o resourcemap2 = usa los mapas del juego base\nresourcemap3 a resourcemap10 = usa mapas adicionales del complemento\nterrain = usa directamente el suelo pintado, por ejemplo para grava; su pincel aparece bajo ROCKS
deposits.component = Componente
deposits.component.description = Cada mapa tiene cuatro espacios del 0 al 3. Cada espacio puede contener un yacimiento.\nCon auto = deja el campo vacío; el complemento elige un espacio libre\nCon terrain: 2 = capa de grava\nCon terrain: 3 = capa de oasis
deposits.building_type = Tipo de edificio
deposits.building_type.description = Tipo de edificio que puede extraer este yacimiento.\n7 = mina; correcto para casi todos los yacimientos\n92 = pozo de agua\nCampo vacío = 7
deposits.radius = Radio de búsqueda
deposits.radius.description = Hasta dónde busca una mina su yacimiento.\noil, ore, bauxite, gravel, wood, water, watersurface = usa la constante correspondiente del juego\nUn número = usa directamente esta distancia\nCampo vacío = usa ore\nSin un radio, la mina no encuentra ningún yacimiento.
deposits.icon = Icono del minimapa
deposits.icon.description = Recurso cuyo icono aparece en el botón del minimapa. El complemento usa el icono ya cargado por el juego; no hace falta una imagen aparte.\nLos recursos del complemento Resources deben estar registrados allí.\nCampo vacío = sin icono
deposits.minimap = Botón del minimapa
deposits.minimap.description = ON añade un botón del minimapa y una capa superpuesta para este yacimiento.
deposits.editor = Nombre del pincel del editor
deposits.editor.description = Nombre de los pinceles de pintura y borrado del editor de terreno. El mismo nombre se usa para tool_paint_<name>.png y tool_erase_<name>.png en vfs\media_soviet\editor.\nCampo vacío = no crees un pincel\nPermitido: hasta 31 caracteres entre letras, dígitos, _ y -
deposits.deplete = Agotamiento por texel
deposits.deplete.description = Este ajuste lo lee el complemento Depletion. Define las toneladas que una mina puede extraer de un punto completamente lleno del mapa de recursos. Los puntos menos ricos rinden proporcionalmente menos.\nEl valor sustituye a tonnes_per_texel en plugins\depletion.ini.\n0 = este yacimiento sigue siendo infinito\nCampo vacío = usa el valor global
deposits.save_warning = Los cambios se escriben en el deposits.ini efectivo solo al guardar. No deben cambiar los números de tipo, canales de mapa ni tokens de yacimientos que ya usa una partida guardada; prueba primero en una copia.
depletion.tab.general = General
depletion.tab.mining = Extracción
needs.save_warning = Los cambios se escriben en el needs.ini efectivo solo al guardar. Cada necesidad añade un espacio de almacenamiento a las tiendas afectadas, y ese espacio forma parte de la partida guardada; prueba primero en una copia.
bp.name = Buildings Plus
bp.description = Nuevos edificios a partir de una declaración: un edificio de referencia del juego más las líneas de building.ini que difieren. Se escriben como elementos completos del Workshop en cada inicio del juego.
bp.notice = Cada edificio se convierte en una carpeta en media_soviet\workshop_wip con su propio ID del Workshop. Deja el ID vacío y el complemento asignará el siguiente número libre a partir de 9300000000 al iniciar el juego y lo guardará en plugins\buildings_plus.ids.ini. El juego lee la carpeta como un elemento del Workshop sin publicar. Los cambios requieren un reinicio completo. Una partida guardada que contiene uno de estos edificios necesita la carpeta al cargar.
bp.tab.general = General
bp.tab.buildings = Edificios
bp.tab.generated = Edificios generados
bp.wip = Edificios generados en la carpeta del juego
bp.wip.description = Muestra los edificios que Buildings Plus o el complemento buildings original han generado en media_soviet\workshop_wip. Lo que ves aquí se lee de las carpetas.
bp.wip.empty = Aún no hay edificios generados aquí. Los edificios se generan al iniciar el juego cuando alguno está activado.
bp.group = Edificios
bp.group.notice = Un edificio aquí es una copia de un edificio del juego con otras líneas: mismo modelo, mismas conexiones, tu receta de producción. Elige una referencia del mismo tipo (mina para mina, fábrica para fábrica).
bp.list = Edificios
bp.add = Añadir
bp.select_help = Selecciona un edificio a la izquierda o usa + para añadir uno. Primero se solicita la referencia; el ID del Workshop puede quedar vacío. El nombre y las líneas se introducen a la derecha.
bp.id = Nombre del objeto
bp.id.help = Da nombre a la carpeta y al objeto del edificio generado, y aparece en el registro. Solo letras, dígitos, _ y -, hasta 64 caracteres; no se puede cambiar después.
bp.save_warning = Los cambios se escriben en el buildings_plus.ini efectivo solo al guardar y se aplican tras reiniciar completamente el juego. El complemento escribe entonces la carpeta en media_soviet\workshop_wip; las secciones con errores se omiten y se identifican en el registro.
bp.list.note = Máximo de 256 edificios.
bp.new_name = Nombre del objeto
bp.new_hint = Los espacios se convierten en guiones bajos y las mayúsculas en minúsculas.
bp.card.folders = Carpetas generadas
bp.card.log = Resolución de problemas
bp.card.new = Nuevo edificio
bp.links = Guías
bp.link.readme = README (guía)
bp.prune = Limpia las carpetas
bp.prune.description = ON elimina en el siguiente inicio del juego la carpeta generada de un edificio que hayas eliminado o desactivado (solo carpetas creadas por este complemento).\nOFF deja esas carpetas; el juego sigue cargando esos edificios.
bp.always = Reescribe siempre
bp.always.description = ON escribe cada carpeta de edificio en cada inicio del juego.\nOFF escribe una carpeta solo si ha cambiado su sección, el complemento o un archivo de referencia. Déjalo en OFF.
bp.verbose = Registro detallado
bp.verbose.description = ON escribe cada archivo copiado y cada línea de referencia eliminada en logs\tesmioloader.buildings_plus.log.\nOFF escribe solo resultados, advertencias y errores.
bp.repair_owner_ids = Completa el ID del propietario
bp.repair_owner_ids.description = ON introduce tu ID de Steam en los edificios generados que no lo tengan, incluidos los de otros generadores. Sin él, el juego pregunta por elementos del Workshop ausentes cada vez que cargas una partida que usa uno de estos edificios.\nOFF no modifica las carpetas de otros generadores.
bp.card.saves = Partidas guardadas
bp.card.saves.description = Una partida guardada recuerda los almacenes de cada edificio construido. Así puede llegar una nueva línea de almacenamiento de uno de tus edificios a los que ya existen.
bp.retrofit = Mantén actualizados los almacenes de edificios existentes
bp.retrofit.description = ON: al cargar una partida, cada edificio generado y terminado recibe vacíos los almacenes de un solo recurso que hayas añadido a su sección. Al cambiar el tamaño en una línea de almacenamiento, el almacén también cambia; una reducción espera hasta que quepan las existencias. Un almacén cuya línea hayas eliminado desaparece de los edificios en cuanto queda vacío.\nOFF: los almacenes de los edificios existentes se mantienen; las líneas nuevas y modificadas solo afectan a los edificios que construyas después.
bp.enabled = Edificio activado
bp.enabled.description = ON genera este edificio en el siguiente inicio del juego.\nOFF no lo genera. Con «Limpia las carpetas» activado, su carpeta existente se elimina en el siguiente inicio.
bp.item_id = ID del Workshop
bp.item_id.description = Número propio permitido: 9000000000 a 9999999999, excepto 9100000000 a 9199999999 (reservados para otros generadores)\nDa nombre a la carpeta dentro de workshop_wip en la carpeta del juego y no debería cambiarse después.
bp.donor = Edificio de referencia
bp.donor.description = El edificio del que parte la copia; debes estar suscrito si es un edificio del Workshop.\nUsa «Elegir referencia...» para explorar los disponibles. Haz coincidir el tipo: mina para mina, fábrica para fábrica, tienda para tienda.
bp.item_name = Nombre en el juego
bp.item_name.description = El nombre que se muestra en el juego.\nUn valor con puntos se considera una clave de traducción y se resuelve mediante el complemento Localization, por ejemplo: localization.lang.salt_mine
bp.desc = Descripción
bp.desc.description = La descripción de la entrada del Workshop, una línea por fila. Sin comillas.
bp.line = Líneas de building.ini
bp.line.description = Una línea de building.ini por fila, por ejemplo $PRODUCTION raw_salt 1.0. Usa «Elegir línea…» para tomar una línea del edificio de referencia y ajustarla. Tus líneas se colocan antes de las de referencia y sustituyen: el mismo token; todos los $TYPE_*; todos los $STORAGE* junto con $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION y $CONSUMPTION_PER_SECOND como una sola receta. Todo lo demás de la referencia se conserva.\nPara tus propios recursos usa siempre $STORAGE_IMPORT_SPECIAL o $STORAGE_EXPORT_SPECIAL con el recurso indicado; de lo contrario, el almacén enumera todos los recursos de la clase de transporte.
bp.strip = Elimina líneas de referencia
bp.cmd_add = Añadir al final
bp.cmd_add.description = Un comando por fila: una línea nueva que se coloca antes del cierre del archivo de referencia. Un bloque de varias líneas se escribe con | entre sus líneas.
bp.cmd_replace = Sustituir
bp.cmd_replace.description = Un comando por fila: línea anterior | línea nueva. La línea anterior debe aparecer exactamente una vez en el archivo de referencia.
bp.cmd_remove = Eliminar
bp.cmd_remove.description = Un comando por fila: la línea del archivo de referencia que se debe quitar. Las líneas asociadas (puntos, posición) se eliminan con ella.
bp.cmd_insert = Insertar
bp.cmd_insert.description = Un comando por fila: 0 o 1 | ancla | línea nueva. 0 coloca la línea nueva delante del ancla y 1 detrás.
bp.strip.description = Un $TOKEN por fila, por ejemplo $WORKERS_NEEDED. Cada línea de referencia con ese token se elimina sin sustitución.
bp.life = Resistencia
bp.life.description = Vacío = 3000\nLIFE en renderconfig.ini: cuánto resiste el edificio antes de derrumbarse. Como la mayoría de los edificios del juego.
bp.card.lines = Líneas
bp.item_id.empty = el complemento asigna el siguiente número libre a partir de 9300000000 al iniciar el juego.
bp.item_name.empty = el nombre del objeto; no se recomienda.
needs_plus.card.log = Resolución de problemas
resources_plus.card.log = Resolución de problemas
resources_plus.card.plugin = Complemento
resources_plus.custom_report = Registra los registros clonados
resources_plus.custom_report.description = ON escribe para cada recurso con plantilla lo que realmente ha heredado el clon (clase de transporte, factores, indicadores). Los recursos sin plantilla siempre se enumeran.\nOFF enumera solo los que no tienen plantilla.
resources_plus.customs_hook = Actualiza las aduanas
resources_plus.customs_hook.description = ON añade los nuevos recursos a la lista comercial de las aduanas existentes.\nOFF es el comportamiento del juego base: una aduana solo comercia con lo que conocía cuando se construyó; en ese caso, solo ayuda demolerla y reconstruirla.
resources_plus.customs_probe = Registra las líneas de las aduanas
resources_plus.customs_probe.description = ON escribe en tesmioloader.log una línea por cada recurso añadido a una aduana. Cámbialo a OFF cuando tus aduanas muestren lo esperado.
resources_plus.price_hook = Aplica los precios del INI
resources_plus.price_hook.description = ON permite que funcionen [base_price] y [price]: los precios base se establecen antes del cálculo de precios del juego y los precios fijos después.\nOFF deja los precios en manos del juego.
resources_plus.price_report = Registra la tabla de precios
resources_plus.price_report.description = ON escribe el precio, el precio base y el tipo de precio de cada recurso de tu lista en tesmioloader.log tras cada cálculo de precios del juego. Un precio de 0.00 significa que ningún edificio lo produce.\nOFF no escribe nada.
tab.resources_plus.general = General
resources.heading.basics = Transporte y tipo de precio
resources.heading.cargo = Carga y material
resources.heading.fixed = Precios fijos
resources.heading.market = Valores de mercado
resources.heading.prices = Precios del registro

resources_plus.heading.names = Nombres por idioma del juego
detail.name_language.description = El nombre de este recurso cuando el juego se ejecuta en este idioma. Vacío: se muestra el nombre de visualización de arriba. El inglés no necesita campo; el nombre de visualización es el nombre en inglés.
detail.name_german = Alemán
detail.name_bulgarian = Búlgaro
detail.name_chinese = Chino (simplificado)
detail.name_chinesetraditional = Chino (tradicional)
detail.name_czech = Checo
detail.name_french = Francés
detail.name_hungarian = Húngaro
detail.name_italian = Italiano
detail.name_japanese = Japonés
detail.name_korean = Coreano
detail.name_polish = Polaco
detail.name_portuguesebrazil = Portugués (Brasil)
detail.name_romanian = Rumano
detail.name_russian = Ruso
detail.name_serbian = Serbio
detail.name_slovak = Eslovaco
detail.name_spanish = Español
detail.name_turkish = Turco
detail.name_ukrainian = Ucraniano
