[language]
name = Português (Brasil)

[strings]
plugin.resources = Resources
plugin.resources.description = Gerencie recursos, propriedades e substituições opcionais de preços.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Recursos próprios com Resources Plus: a mesma lista do original, em plugins\resources_plus.ini, sem o travamento ao sair.
resources_plus.save_warning = As alterações são gravadas em plugins\resources_plus.ini quando você salva. Remover um recurso que uma partida salva já utiliza pode danificá-la.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Necessidades próprias dos cidadãos com Needs Plus: a mesma lista do original, no arquivo needs_plus.ini da pasta plugins, importada de needs.ini na primeira inicialização.
needs_plus.save_warning = As alterações são gravadas em needs_plus.ini, na pasta plugins, somente quando você salva. Cada necessidade adiciona um espaço de armazenamento às lojas afetadas, e esse espaço faz parte da partida salva. Teste primeiro em uma cópia.
tab.resources.editor = Recursos
group.resource_definitions = Definições de recursos
detail.transport = Classe de transporte
detail.transport.description = Define quais veículos e depósitos podem transportar e armazenar o recurso. Basta escolher um nome; o plugin adiciona os valores do jogo base para essa classe.
detail.kind = Categoria de preço
detail.kind.description = 0 matérias-primas, 1 produtos manufaturados, 2 alimentos/roupas, 3 materiais avançados, 4 eletrônicos.
detail.record_price = Preço inicial no registro
detail.record_price.description = Valores iniciais opcionais em RUB e USD no registro do recurso.
detail.record_base_price = Preço-base inicial no registro
detail.record_base_price.description = Valores-base opcionais em RUB e USD no registro do recurso.
detail.trade_mult = Multiplicadores comerciais
detail.trade_mult.description = Multiplicadores de venda e compra, normalmente 0.95 e 1.05.
detail.market_rub = Bloco de mercado RUB
detail.market_usd = Bloco de mercado USD
detail.market.description = Dois valores de mercado e um coeficiente opcional.\n(Veja a descrição no arquivo INI)
detail.packed = Carga embalada
detail.packed.description = Representação da carga automática, sem embalagem ou embalada.
detail.family = Família de materiais
detail.family.description = Define a aparência do material empilhado em um canteiro de obras e, muito provavelmente, em qual resíduo ele se transforma. Cada família contém um recurso de resíduo. Os números de 10 a 19 no INI são exibidos pelo nome.
detail.cargo = Geometria da carga
detail.cargo.description = Seleção da geometria usada para visualizar a carga.
detail.pinned_base_price = Preço-base fixo
detail.pinned_base_price.description = Valor opcional em RUB e USD em [base_price]. Vazio significa que não há uma entrada personalizada.
detail.forced_price = Preço final imposto
detail.forced_price.description = Valor opcional em RUB e USD em [price]. Se estiver vazio, o jogo calcula o preço.

; --- Esquemas locais para plugins originais instalados (desde 0.13.0) ---
daynight.description = Um nascer e um pôr do sol por dia do calendário. No jogo base, a passagem do dia para a noite e de volta leva 13 dias do calendário, quase duas semanas. Com este plugin, tudo acontece em um dia.
daynight.group.cycle = Dia e noite
daynight.group.cycle.description = Duração do ciclo de dia e noite e momento em que a noite chega.
daynight.group.pace = Ritmo
daynight.group.pace.description = Dois controles separados: um para veículos e outro para todo o restante. Eles sempre se aplicam, independentemente das configurações acima.
daynight.group.diagnostics = Solução de problemas
daynight.enabled.label = Plugin ativado
daynight.enabled.description = ON ativa o ciclo de dia e noite configurado.
daynight.cycle_days.label = Dias do calendário por ciclo de dia e noite
daynight.cycle_days.description = Dias do calendário entre um nascer do sol e o seguinte.\n1 = um nascer e um pôr do sol todos os dias\nDe 2 a 12 = um ciclo proporcionalmente mais longo\n13 = o ciclo do jogo base
daynight.day_scale.label = Duração do dia (fator de desaceleração do calendário)
daynight.day_scale.description = Quantas vezes um dia do calendário dura mais do que no jogo base.\nauto = desacelera o calendário automaticamente para acompanhar o ciclo de luz; recomendado\n1 = não desacelera o calendário; dia e noite passam a alternar 13 vezes mais rápido\nDe 2 a 100 = desacelera o calendário por este fator\nEscolha quais partes do jogo desacelerar em “O que desacelerar”.
daynight.slow.label = O que desacelerar
daynight.slow.description = Quais partes do jogo desacelerar.\ncalendar = desacelera apenas o calendário; recomendado\nworld = desacelera tudo, inclusive cidadãos e veículos; valores altos parecem câmera lenta\nnone = não desacelera nada\nCom calendar, cidadãos, veículos, construção e produção mantêm a velocidade normal. Processos diários, como poluição, empréstimos e mensagens, mantêm o intervalo habitual.
daynight.offset.label = Quando a noite chega
daynight.offset.description = Desloca a noite dentro do dia do calendário.\n0 = a escuridão começa pouco depois da metade do dia\n0.5 = a escuridão começa na mudança de data\nCom qualquer valor diferente de 0, um ciclo de 13 dias deixa de corresponder exatamente ao jogo base.
daynight.fade.label = Ajustar as transições de iluminação
daynight.fade.description = ON encurta as transições entre manhã, dia, entardecer e noite para acompanhar o ciclo configurado.\nOFF usa as transições lentas do jogo base. Em ciclos curtos, elas podem se sobrepor e deixar a iluminação desbotada.
daynight.vehicle_scale.label = Velocidade dos veículos
daynight.vehicle_scale.description = Velocidade de caminhões, trens, navios e aeronaves. Funciona independentemente das outras configurações.\n1 = velocidade do jogo base\n2 = metade da velocidade\n0.5 = dobro da velocidade\nValor maior = veículos mais lentos
daynight.sim_scale.label = Velocidade de todo o restante
daynight.sim_scale.description = Velocidade de cidadãos, construção, produção, desgaste e animações.\n1 = velocidade do jogo base\n2 = metade da velocidade\n0.5 = dobro da velocidade\nValor maior = simulação mais lenta
daynight.probe.label = Registrar a duração dos dias no log
daynight.probe.description = ON grava a duração real de cada dia do calendário e transição de luz em tesmioloader.log. Use apenas para solucionar problemas e verificar o funcionamento após uma atualização do jogo.
walking.description = Distâncias que os cidadãos percorrem a pé e que os proprietários de carros dirigem entre casa, trabalho e estacionamento.
walking.group.distances = Distâncias
walking.group.distances.description = Medidas ao longo de ruas e caminhos de pedestres, não em linha reta. Um prédio a 400 m do outro lado do rio pode exigir uma caminhada de 1200 m.
walking.group.diagnostics = Solução de problemas
walking.enabled.label = Plugin ativado
walking.enabled.description = ON ativa as distâncias configuradas para caminhar e dirigir.
walking.distance.label = Distância a pé (m)
walking.distance.description = O trajeto mais longo que um cidadão percorre a pé. O jogo base usa 480 m.\nValor maior = mais prédios ao alcance a pé e mais conexões criadas durante a construção\n0 = sem limite; a construção em uma cidade grande pode então levar vários segundos\n20000 = maior valor aceito
walking.car_distance.label = Distância de deslocamento dos proprietários de carros (m)
walking.car_distance.description = O trajeto mais longo permitido entre casa, trabalho e estacionamento. O jogo base usa 2500 m.\nValor maior = os proprietários de carros dirigem mais longe\nDefina um valor acima da distância a pé. Com valores iguais, o carro não oferece vantagem de alcance.
walking.regen_on_load.label = Recriar conexões ao carregar uma partida salva
walking.regen_on_load.description = As conexões de pedestres e estacionamento são armazenadas na partida salva.\nON recria todas as conexões ao carregar, para que as distâncias configuradas também afetem cidades existentes.\nOFF aplica as distâncias configuradas apenas a prédios recém-construídos.
walking.probe.label = Registrar valores de verificação no log
walking.probe.description = ON grava em tesmioloader.log os valores encontrados no jogo antes de o plugin alterá-los. Use apenas para solucionar problemas e verificar o funcionamento após uma atualização do jogo.
accumulator.description = Baterias para sua rede elétrica. Um prédio com grande armazenamento de energia carrega quando há eletricidade sobrando e a devolve quando falta.
accumulator.group.battery = Bateria
accumulator.group.battery.description = Quais prédios contam como baterias e com que rapidez carregam e descarregam.
accumulator.group.window = Janela do prédio
accumulator.group.grid = Rede elétrica
accumulator.group.diagnostics = Solução de problemas
accumulator.enabled.label = Plugin ativado
accumulator.enabled.description = ON ativa a carga e a descarga dos prédios que funcionam como baterias.\nOFF interrompe a descarga. Os prédios permanecem e ainda podem carregar.
accumulator.building_types.label = Tipos de prédio
accumulator.building_types.description = Tipos de prédio que podem funcionar como baterias. Separe vários números por vírgulas.\n19 = transformador\n18 = subestação\nNão use 17: uma usina não pode receber eletricidade e nunca carregaria.
accumulator.min_capacity.label = Capacidade mínima para contar como bateria
accumulator.min_capacity.description = Capacidade mínima de armazenamento para que um prédio conte como bateria. Isso exclui os pequenos armazenamentos das subestações comuns.\nValor maior = menos prédios contam como baterias\nValor menor = mais prédios contam como baterias\nO “Stationary Accumulator” incluído tem capacidade de 5000.
accumulator.charge_rate.label = Velocidade de carga (potência por segundo)
accumulator.charge_rate.description = Quantidade máxima de eletricidade que uma bateria recebe por segundo. O limite impede uma bateria vazia de tirar a eletricidade de uma cidade inteira.\nValor maior = carregamento mais rápido e maior carga sobre a rede\nValor menor = carregamento mais lento e menor carga sobre a rede\nPara comparação, uma usina a carvão fornece 70 e uma turbina eólica 15.
accumulator.discharge_rate.label = Velocidade de descarga (potência por segundo)
accumulator.discharge_rate.description = Quantidade máxima de eletricidade que uma bateria fornece por segundo. Ela só fornece quando falta eletricidade na rede.\nValor maior = cobre déficits de potência maiores\nValor menor = a energia armazenada dura mais\nExemplo: em 60, uma bateria cheia com capacidade de 5000 substitui uma usina por pouco mais de 80 segundos.
accumulator.panel.label = Linha de carga na janela da bateria
accumulator.panel.description = ON adiciona o nível de carga à janela da bateria, por exemplo “Carga: 4210.5 / 5000 (84.2 %)”.
accumulator.panel_caption.label = Rótulo dessa linha
accumulator.panel_caption.description = A palavra antes do nível de carga. Apenas letras, sem acentos nem caracteres especiais, caso contrário o jogo exibe caracteres ilegíveis.
accumulator.gauges.label = Calcular os indicadores da janela com base na bateria
accumulator.gauges.description = ON substitui a exibição incorreta do jogo pelo fluxo real de entrada e saída da bateria.\nOFF usa a exibição normal do jogo. Ela pode mostrar potência 0 e “sem fornecimento de energia” enquanto a bateria carrega.
accumulator.spread_voltage.label = Experimento: transmitir tensão aos vizinhos (deixe desativado)
accumulator.spread_voltage.description = ON não tem efeito. Esta função antiga foi substituída tecnicamente. Deixe em OFF.
accumulator.trace.label = Registrar os vizinhos da primeira bateria
accumulator.trace.description = ON grava no log quanta eletricidade os prédios ao lado da primeira bateria recebem. Apenas para solucionar problemas; pode reduzir o desempenho.
accumulator.log_seconds.label = Segundos entre registros da bateria
accumulator.log_seconds.description = Intervalo entre mensagens de estado da bateria em tesmioloader.log. Cada mensagem inclui carga, entrada e saída.\n0 = sem mensagens de estado\nValor maior = registros menos frequentes
accumulator.probe.label = Segundos entre listas de prédios no log
accumulator.probe.description = Intervalo entre listas de todos os prédios com armazenamento de energia em tesmioloader.log. Use apenas quando uma bateria não for reconhecida ou após uma atualização do jogo.\n0 = não gravar essas listas\nValor maior = registros menos frequentes
cities.description = Tamanho e formato de cada cidade. No jogo base, toda cidade é um círculo com raio de 1000 m. Com este plugin, você define o raio de cada cidade separadamente, opcionalmente com formato quadrado, diretamente na janela da cidade. Os valores são armazenados na partida salva.
cities.group.cities = Cidades
cities.group.slider = Controle deslizante do raio
cities.group.slider.description = Alcance do controle deslizante na janela da cidade e quanto um clique em + ou - altera o valor.
cities.group.layout = Disposição na janela da cidade
cities.group.layout.description = Posição das duas novas linhas na janela da cidade. Os números são posições na unidade própria da janela do jogo; a janela tem cerca de 500 de largura.
cities.group.overlay = Grade de pontos no chão
cities.group.diagnostics = Solução de problemas
cities.enabled.label = Plugin ativado
cities.enabled.description = ON ativa tamanhos e formatos personalizados para as cidades.
cities.window.label = Controle de raio e caixa de formato na janela da cidade
cities.window.description = ON mostra o controle deslizante do raio e a caixa de formato quadrado na janela da cidade.\nOFF oculta ambos; os valores definidos permanecem, mas você não pode mais alterá-los.
cities.adopt.label = Criar uma cidade própria para prédios sem cidade
cities.adopt.description = Ao diminuir uma cidade, prédios podem ficar de fora e deixar de pertencer a qualquer cidade.\nON funda uma nova cidade para eles com nome aleatório e a data de hoje, como o próprio jogo faz.\nOFF os deixa sem cidade; o comportamento do jogo nesse caso não foi testado.
cities.radius.label = Raio padrão (m)
cities.radius.description = Raio padrão das cidades que você não configurou individualmente. O valor se aplica a todos os mapas.\n1000 = raio do jogo base\nValor maior = cidades maiores\nValor menor = cidades menores
cities.square.label = Formato quadrado por padrão
cities.square.description = ON torna quadradas as cidades sem configuração individual.\nOFF usa um círculo, como no jogo base.
cities.radius_min.label = Menor raio no controle deslizante (m)
cities.radius_min.description = O valor na extremidade esquerda do controle deslizante.
cities.radius_max.label = Maior raio no controle deslizante (m)
cities.radius_max.description = O valor na extremidade direita do controle deslizante. O controle tem 100 passos; de 200 a 5000, um passo corresponde a 48 m.
cities.step.label = Porcentagem por clique no botão
cities.step.description = Porcentagem do intervalo do controle deslizante alterada por um clique em + ou -. Não se aplica ao arrastar o controle.\nValor maior = mudança maior por clique\nValor menor = mudança mais precisa por clique
cities.label_x.label = Posição do rótulo
cities.label_x.description = Distância do rótulo até a borda esquerda da janela.
cities.widget_x.label = Posição dos controles
cities.widget_x.description = Distância do controle deslizante e da caixa até a borda esquerda da janela. O controle precisa de cerca de 225.
cities.checkbox_dy.label = Mover a linha da caixa para cima ou para baixo
cities.checkbox_dy.description = Move a caixa para cima ou para baixo para que não se sobreponha ao controle deslizante.\nValor maior = caixa mais abaixo\nValor menor = caixa mais acima
cities.overlay.label = Adaptar a sobreposição ao raio e ao formato
cities.overlay.description = Enquanto uma janela de cidade está aberta, o jogo mostra uma grade de pontos azuis no chão, mas sempre para um círculo com raio de 1000 m.\nON adapta a grade ao seu raio e formato.\nOFF a mantém como no jogo base.
cities.overlay_step.label = Espaçamento da grade sobreposta (m)
cities.overlay_step.description = Distância entre os pontos que mostram os limites da cidade.\n0 = usa automaticamente um vigésimo do raio, no mínimo 50 m\nValor menor = exibição mais densa e maior impacto no desempenho
cities.probe.label = Registrar cidades no log
cities.probe.description = ON grava raio, formato e quantidade de prédios de cada cidade em tesmioloader.log após o carregamento. Mais mensagens são gravadas enquanto uma janela de cidade está aberta. Apenas para solucionar problemas; o log pode crescer rapidamente.
depletion.description = As jazidas se esgotam. Uma mina em funcionamento remove visivelmente a jazida do mapa e, quanto menos resta, menos ela produz. A extração é armazenada na partida salva; se você desativar o plugin depois, o que foi extraído não volta. Teste primeiro em uma cópia da partida salva.
depletion.group.depletion = Mineração
depletion.group.window = Janela da mina
depletion.group.diagnostics = Solução de problemas
depletion.enabled.label = Plugin ativado
depletion.enabled.description = ON permite que as jazidas selecionadas se esgotem com a extração.\nOFF interrompe o esgotamento adicional. Recursos já removidos não são restaurados.
depletion.tonnes_per_texel.label = Toneladas por ponto do mapa
depletion.tonnes_per_texel.description = Toneladas que uma mina pode extrair de um ponto completamente cheio do mapa de recursos. Pontos menos ricos rendem proporcionalmente menos.\nValor maior = as jazidas duram mais\nValor menor = as jazidas se esgotam mais cedo\nPara comparação, uma mina com raio de busca de 210 m cobre vários milhares de pontos do mapa.
depletion.vanilla.label = Jazidas esgotáveis do jogo base
depletion.vanilla.description = Jazidas do jogo base que podem se esgotar. Separe vários valores por vírgulas.\noil, iron, coal, uranium, bauxite, gravel = apenas as jazidas indicadas\nall = todas as jazidas\nnone = nenhuma jazida do jogo base\nname:value = toneladas personalizadas por ponto do mapa, por exemplo iron:3000\nAs jazidas de deposits.ini são sempre incluídas.\ngravel remove permanentemente a textura visível do solo e precisa de um valor muito maior devido à pequena área de busca. Omita gravel para mantê-lo como no jogo base.
depletion.flush_seconds.label = Segundos entre os registros da extração
depletion.flush_seconds.description = Segundos entre atualizações do mapa de recursos. Produção e qualidade mudam imediatamente; apenas o minimapa e a partida salva seguem este intervalo.\nValor menor = atualizações mais frequentes e maior impacto no desempenho\nNão atualize mais de quatro vezes por segundo.
depletion.panel.label = Linha da jazida restante na janela da mina
depletion.panel.description = ON mostra a reserva restante na janela da mina e aumenta um pouco sua altura, por exemplo “Restante: 251.4 kt / 259.3 kt (96.9 %)”.
depletion.panel_caption.label = Rótulo dessa linha
depletion.panel_caption.description = A palavra antes da quantidade restante. Apenas letras, sem acentos nem caracteres especiais, caso contrário o jogo exibe caracteres ilegíveis.
depletion.log_seconds.label = Intervalo dos registros de progresso (segundos)
depletion.log_seconds.description = Segundos entre mensagens de estado das minas em tesmioloader.log. Cada mensagem inclui quantidade restante, quantidade total e qualidade.\n0 = sem mensagens de estado\nValor maior = registros menos frequentes\nObserve vários dias do jogo para encontrar um valor adequado de toneladas por ponto do mapa.
easystart.description = As necessidades dos cidadãos aparecem aos poucos ao longo dos anos. Uma necessidade ainda não desbloqueada não afeta a felicidade nem a saúde; os cidadãos continuam visitando os locais e comprando, mas as consequências só aparecem a partir do ano definido.
easystart.group.general = O que adiar
easystart.group.unlock = Anos de desbloqueio
easystart.group.unlock.description = Ano em que o requisito começa a valer, em 1 de janeiro. O cronograma foi feito para uma república fundada em 1920. Com início em 1960, os anos predefinidos já ficaram no passado.\noff = não adiar; comportamento do jogo base\nalways = aplicar desde o primeiro dia do jogo\nUm ano = desbloquear naquele ano
easystart.group.diagnostics = Solução de problemas
easystart.enabled.label = Plugin ativado
easystart.enabled.description = ON desbloqueia necessidades e requisitos de serviços conforme o cronograma configurado.
easystart.demands.label = Adiar as nove necessidades dos cidadãos
easystart.demands.description = ON adia alimentos, carne, roupas, eletrônicos, álcool, religião, cultura, esporte e saúde até os anos de desbloqueio configurados.
easystart.utilities.label = Adiar os três serviços exigidos pelos prédios
easystart.utilities.description = ON adia os requisitos de eletricidade, água e aquecimento até os anos de desbloqueio configurados.
easystart.warnings.label = Adiar os avisos na janela do prédio
easystart.warnings.description = ON oculta os avisos relacionados até o ano de desbloqueio, por exemplo “prédio sem fornecimento de energia”.
easystart.pin_status.label = Manter a satisfação das necessidades bloqueadas
easystart.pin_status.description = ON mantém a satisfação de uma necessidade bloqueada no valor abaixo.\nOFF permite que a satisfação continue caindo; ela já pode estar muito baixa quando a necessidade for desbloqueada.
easystart.locked_status.label = Satisfação durante o bloqueio
easystart.locked_status.description = Satisfação enquanto uma necessidade está bloqueada. Para alimentos, o valor representa saciedade.\n1.0 = totalmente satisfeito ou alimentado\n0.5 = valor médio com melhora perceptível após o desbloqueio
easystart.clear_unsatisfied.label = Remover necessidades bloqueadas da lista de não atendidas
easystart.clear_unsatisfied.description = ON impede que necessidades bloqueadas gerem a mensagem “N cidadãos não conseguiram obter X”.
easystart.probe.label = Registrar desbloqueios no log
easystart.probe.description = ON grava em tesmioloader.log as necessidades que continuam bloqueadas a cada mudança de ano. Também registra uma vez o primeiro cidadão afetado. Apenas para solucionar problemas.
easystart.food.label = Alimentos
easystart.religion.label = Religião
easystart.meat.label = Carne
easystart.clothes.label = Roupas
easystart.alcohol.label = Álcool
easystart.sport.label = Esporte
easystart.culture.label = Cultura
easystart.health.label = Saúde
easystart.electricity.label = Eletricidade
easystart.water.label = Água (inclui esgoto)
easystart.heating.label = Aquecimento
easystart.electronics.label = Eletrônicos
easystart.school.label = Escola
easystart.school.description = Antes deste ano, as crianças aprendem sem escola, como na configuração de educação “Simples” do jogo, e a mensagem “N crianças não podem ir à escola” não aparece.
easystart.kindergarten.label = Jardim de infância
easystart.kindergarten.description = Antes deste ano, nenhum responsável precisa ficar em casa por causa de uma criança menor de seis anos, e a mensagem “N trabalhadores não podem trabalhar porque todos os jardins de infância …” não aparece.
plugin.needs = Needs
plugin.needs.description = Gerencie as necessidades adicionais dos cidadãos e as opções do plugin sem editar o arquivo original.
tab.needs.editor = Necessidades
group.needs = Necessidades dos cidadãos
group.needs.plugin = Configurações do plugin
group.needs.plugin.description = Opções que se aplicam a todas as necessidades.
needs.list = Lista de necessidades
needs.add = Adicionar necessidade
needs.select_help = Selecione uma necessidade à esquerda ou use + para adicionar um recurso registrado pelo Resources.
needs.resource = Recurso
needs.resource.help = O recurso que os cidadãos deverão desejar. Ele precisa estar registrado na lista do plugin Resources.
needs.donor = Necessidade de referência
needs.donor.description = Necessidade existente usada como modelo.\nfood ou meat = para lojas de alimentos\nclothes ou eletronics = para lojas de departamentos\nalcohol = para lojas de bebidas alcoólicas\neletronics é a grafia usada pelo jogo.
needs.factor = Fator de quantidade
needs.factor.description = Quantidade de mercadorias em relação à necessidade de referência.\n1.0 = mesma quantidade da referência\nValor maior = os cidadãos precisam de mais\nValor menor = os cidadãos precisam de menos
needs.category = Categoria de lojas
needs.category.description = Lojas que mantêm as mercadorias em estoque.\nauto = as mesmas lojas da necessidade de referência\nnone = sem espaço automático; o prédio deve fornecer as mercadorias por conta própria\nbasic = apenas lojas básicas\nmedium = apenas lojas médias\nadvanced = apenas lojas grandes\nmediumadvanced = apenas lojas médias e grandes\nhotel = apenas hotéis\nUm número = gravar diretamente este valor de loja; apenas para usuários que conhecem os arquivos do jogo
needs.chance = Probabilidade
needs.chance.description = Probabilidade de 0 a 1 de um cidadão receber esta necessidade. Abaixo de 1, ela é distribuída independentemente da necessidade de referência.\n0 = nenhum cidadão a recebe\n1 = todo cidadão adequado a recebe
needs.unhappy = Insatisfação
needs.unhappy.description = Satisfação perdida quando um cidadão não consegue obter as mercadorias.\n0 = sem perda; a necessidade é apenas exibida\nDe 0.005 a 0.02 = faixa típica de um bem de conforto\nFaixa permitida: de 0 a 1
needs.enabled = Plugin ativado
needs.enabled.description = ON ativa o plugin.\nOFF o desativa completamente na próxima inicialização do jogo.
needs.demand = Atribuir necessidades
needs.demand.description = ON atribui a nova necessidade aos cidadãos.\nOFF não distribui a necessidade, mas ainda pode adicionar as mercadorias às lojas.
needs.storage = Abastecer lojas
needs.storage.description = ON adiciona as mercadorias às lojas selecionadas.\nOFF não adiciona espaços de armazenamento; os cidadãos só poderão encontrar as mercadorias em prédios que as forneçam por conta própria.
needs.max_demands = Necessidades por cidadão
needs.max_demands.description = Número máximo de necessidades adicionais que um cidadão pode ter ao mesmo tempo.\n1 = no máximo uma necessidade adicional\n7 = maior número permitido
needs.when_full = Ao atingir o limite de necessidades
needs.when_full.description = O que acontece quando um cidadão já tem o número máximo de necessidades adicionais.\nskip = esperar até haver um espaço livre\nreplace = substituir a necessidade de referência desta vez
needs.probe = Log detalhado
needs.probe.description = ON grava listas de necessidades dos cidadãos e informações sobre cada loja no log detalhado do plugin.\nOFF grava apenas avisos. Ative temporariamente ao verificar novas lojas.
needs.log_seconds = Intervalo das mensagens de progresso (segundos)
needs.log_seconds.description = Segundos entre mensagens que informam quantas necessidades foram atribuídas.\n0 = desativar essas mensagens\nValor maior = registros menos frequentes
tab.needs.general = Geral
plugin.deposits = Deposits
plugin.deposits.description = Gerencie os tipos de jazidas que não existem no jogo base e as opções do plugin sem editar o arquivo original.
tab.deposits.general = Geral
tab.deposits.editor = Jazidas
group.deposits = Jazidas
group.deposits.description = As jazidas originais são protegidas e podem ser ocultadas; as personalizadas são armazenadas separadamente e mescladas no deposits.ini efetivamente usado. Cada seção, exceto [deposits], representa uma jazida.
group.deposits.plugin = Configurações do plugin
group.deposits.plugin.description = Os três subsistemas da seção [deposits]. Cada um fica desativado para todas as jazidas quando sua opção aqui está desativada.
deposits.notice = O número de tipo de uma jazida, seu canal no mapa e o token em building.ini passam a fazer parte da partida salva assim que uma mina os utiliza. Remover ou renumerar uma jazida usada por uma partida salva pode torná-la inutilizável; teste primeiro em uma cópia.
deposits.list = Lista de jazidas
deposits.add = Adicionar jazida
deposits.select_help = Selecione uma jazida à esquerda ou use + para adicionar uma para um recurso registrado pelo Resources.
deposits.name = Jazida
deposits.name.help = O nome da seção em deposits.ini. Identifica a jazida no log e no pincel do editor; não pode ser renomeado depois.
deposits.new_name = Nome da jazida
deposits.new_hint = Aqui são solicitadas apenas as configurações padrão. Todo o restante (componente, tipo de prédio, esgotamento) fica nas configurações à direita após a adição.
deposits.code_patch = Alteração de código
deposits.code_patch.description = ON insere os tipos de jazida $TYPE_MINE_ configurados no jogo para que as minas possam encontrá-los por meio de building.ini. Se os dados esperados do jogo deixarem de corresponder após uma atualização, o plugin não altera nada.
deposits.minimap_all = Camadas do minimapa
deposits.minimap_all.description = ON mostra um botão abaixo dos cinco botões de minimapa do jogo para cada jazida do plugin ativada individualmente.\nOFF oculta todos os botões de jazidas do plugin.
deposits.editor_all = Pincéis do editor de terreno
deposits.editor_all.description = ON mostra pincéis de pintura e apagamento na aba Recursos do editor de terreno para cada jazida com um nome de pincel.\nOFF oculta todos os pincéis de jazidas do plugin.
deposits.token = Token do prédio
deposits.token.description = Token usado por uma mina em building.ini para esta jazida, por exemplo $TYPE_MINE_COPPER. Digite no mesmo formato de $TYPE_MINE_GRAVEL. Nunca use dois tokens de jazida no mesmo building.ini.
deposits.type = Número de tipo
deposits.type.description = Número de tipo exclusivo da jazida. Duas jazidas não podem usar o mesmo número.\nDe 10 a 127 = faixa permitida\nDe 0 a 9 = reservados ao jogo base\nA caixa de diálogo sugere automaticamente o próximo número livre.
deposits.map = Mapa
deposits.map.description = Mapa em que a jazida é armazenada.\nauto = escolher automaticamente um espaço livre em um mapa do plugin; recomendado\nresourcemap ou resourcemap2 = usar mapas do jogo base\nDe resourcemap3 a resourcemap10 = usar os mapas adicionais do plugin\nterrain = usar diretamente o solo pintado, por exemplo para cascalho; seu pincel aparece em ROCKS
deposits.component = Componente
deposits.component.description = Cada mapa tem quatro espaços, de 0 a 3. Cada espaço pode conter uma jazida.\nCom auto = deixe o campo vazio; o plugin escolhe um espaço livre\nCom terrain: 2 = camada de cascalho\nCom terrain: 3 = camada de oásis
deposits.building_type = Tipo de prédio
deposits.building_type.description = Tipo de prédio que pode extrair esta jazida.\n7 = mina; correto para quase toda jazida\n92 = poço de água\nCampo vazio = 7
deposits.radius = Raio de busca
deposits.radius.description = Até onde uma mina procura sua jazida.\noil, ore, bauxite, gravel, wood, water, watersurface = usar a constante correspondente do jogo\nUm número = usar diretamente esta distância\nCampo vazio = usar ore\nSem um raio, a mina não encontra nenhuma jazida.
deposits.icon = Ícone do minimapa
deposits.icon.description = Recurso cujo ícone aparece no botão do minimapa. O plugin usa o ícone já carregado pelo jogo; nenhuma imagem separada é necessária.\nRecursos do plugin Resources precisam estar registrados nele.\nCampo vazio = sem ícone
deposits.minimap = Botão do minimapa
deposits.minimap.description = ON adiciona um botão do minimapa e uma camada de sobreposição para esta jazida.
deposits.editor = Nome do pincel do editor
deposits.editor.description = Nome dos pincéis de pintura e apagamento no editor de terreno. O mesmo nome é usado em tool_paint_<name>.png e tool_erase_<name>.png em vfs\media_soviet\editor.\nCampo vazio = não criar pincel\nPermitido: até 31 letras, dígitos, _ e -
deposits.deplete = Esgotamento por texel
deposits.deplete.description = Esta configuração é lida pelo plugin Depletion. Define as toneladas que uma mina pode extrair de um ponto completamente cheio do mapa de recursos. Pontos menos ricos rendem proporcionalmente menos.\nO valor substitui tonnes_per_texel em plugins\depletion.ini.\n0 = esta jazida permanece infinita\nCampo vazio = usar o valor global
deposits.save_warning = As alterações são gravadas no deposits.ini efetivamente usado somente ao salvar. Números de tipo, canais do mapa e tokens de jazidas que uma partida salva já utiliza não podem mudar; teste primeiro em uma cópia.
depletion.tab.general = Geral
depletion.tab.mining = Mineração
needs.save_warning = As alterações são gravadas no needs.ini efetivamente usado somente quando você salva. Cada necessidade adiciona um espaço de armazenamento às lojas afetadas, e esse espaço faz parte da partida salva. Teste primeiro em uma cópia.
bp.name = Buildings Plus
bp.description = Novos prédios a partir de uma definição: um prédio de referência do jogo e as linhas de building.ini que diferem. São gravados como itens completos do Workshop a cada inicialização do jogo.
bp.notice = Cada prédio se torna uma pasta em media_soviet\workshop_wip com seu próprio ID do Workshop. Deixe o ID vazio e o plugin atribuirá o próximo número livre a partir de 9300000000 ao iniciar o jogo, mantendo-o em plugins\buildings_plus.ids.ini. O jogo lê a pasta como um item não publicado do Workshop. As alterações exigem uma reinicialização completa. Uma partida salva com esse prédio precisa da pasta ao ser carregada.
bp.tab.general = Geral
bp.tab.buildings = Prédios
bp.tab.generated = Prédios gerados
bp.wip = Prédios gerados na pasta do jogo
bp.wip.description = Mostra os prédios que o Buildings Plus ou o plugin buildings original gerou em media_soviet\workshop_wip. O que aparece aqui é lido das pastas.
bp.wip.empty = Ainda não há prédios gerados aqui. Os prédios são gerados ao iniciar o jogo quando algum está ativado.
bp.group = Prédios
bp.group.notice = Um prédio aqui é uma cópia de um prédio do jogo com linhas diferentes: mesmo modelo, mesmas conexões, sua receita. Escolha uma referência do mesmo tipo (mina para mina, fábrica para fábrica).
bp.list = Prédios
bp.add = Adicionar
bp.select_help = Selecione um prédio à esquerda ou use + para adicionar um. Primeiro é solicitada a referência; o ID do Workshop pode ficar vazio. Nome e linhas são definidos à direita depois.
bp.id = Nome do objeto
bp.id.help = Define o nome da pasta e do objeto do prédio gerado e aparece no log. Apenas letras, dígitos, _ e -, no máximo 64 caracteres; não pode ser alterado depois.
bp.save_warning = As alterações são gravadas no buildings_plus.ini efetivamente usado somente ao salvar e entram em vigor após uma reinicialização completa do jogo. O plugin então grava a pasta em media_soviet\workshop_wip; uma seção com erro é ignorada e identificada no log.
bp.list.note = No máximo 256 prédios.
bp.new_name = Nome do objeto
bp.new_hint = Espaços viram sublinhados, e maiúsculas viram minúsculas.
bp.card.folders = Pastas geradas
bp.card.log = Solução de problemas
bp.card.new = Novo prédio
bp.links = Guias
bp.link.readme = README (guia)
bp.prune = Limpar pastas
bp.prune.description = ON remove, na próxima inicialização do jogo, a pasta gerada de um prédio que você excluiu ou desativou (somente pastas criadas por este plugin).\nOFF mantém essas pastas; o jogo continua carregando os prédios.
bp.always = Sempre regravar
bp.always.description = ON grava todas as pastas de prédios a cada inicialização do jogo.\nOFF grava uma pasta somente quando sua seção, o plugin ou um arquivo de referência muda. Deixe em OFF.
bp.verbose = Log detalhado
bp.verbose.description = ON grava cada arquivo copiado e cada linha removida da referência em logs\tesmioloader.buildings_plus.log.\nOFF grava apenas resultados, avisos e erros.
bp.repair_owner_ids = Preencher o ID do proprietário
bp.repair_owner_ids.description = ON preenche seu ID do Steam nos prédios gerados que não têm um, incluindo os de outros geradores. Sem ele, o jogo pergunta sobre itens ausentes do Workshop sempre que você carrega uma partida salva que usa um desses prédios.\nOFF não altera as pastas de outros geradores.
bp.card.saves = Partidas salvas
bp.card.saves.description = Uma partida salva memoriza os armazenamentos de cada prédio já construído. Esta opção permite aplicar uma nova linha de armazenamento de um dos seus prédios também aos exemplares existentes.
bp.retrofit = Atualizar os armazenamentos dos prédios já construídos
bp.retrofit.description = ON: ao carregar uma partida salva, cada prédio gerado concluído recebe, vazios, os armazenamentos de recurso único adicionados à sua seção. Ao mudar a capacidade em uma linha de armazenamento, o armazenamento também muda; uma redução espera até o estoque caber. Um armazenamento cuja linha foi removida desaparece dos prédios assim que fica vazio.\nOFF: os armazenamentos dos prédios já construídos permanecem como estão; linhas novas e alteradas só se aplicam a prédios construídos depois.
bp.enabled = Prédio ativado
bp.enabled.description = ON gera este prédio na próxima inicialização do jogo.\nOFF não o gera. Com “Limpar pastas” ativado, sua pasta existente é removida na próxima inicialização.
bp.item_id = ID do Workshop
bp.item_id.description = É possível usar um número próprio: de 9000000000 a 9999999999, exceto de 9100000000 a 9199999999 (reservados a outros geradores)\nEle define o nome da pasta em workshop_wip na pasta do jogo e não deve ser alterado depois.
bp.donor = Prédio de referência
bp.donor.description = O prédio que serve de base para a cópia; se for do Workshop, você precisa estar inscrito nele.\nUse “Escolher referência...” para procurar entre os prédios disponíveis. Combine o tipo: mina para mina, fábrica para fábrica, loja para loja.
bp.item_name = Nome no jogo
bp.item_name.description = O nome exibido no jogo.\nUm valor com pontos é tratado como chave de tradução e resolvido pelo plugin Localization, por exemplo: localization.lang.salt_mine
bp.desc = Descrição
bp.desc.description = A descrição do item do Workshop, uma linha por linha do campo. Sem aspas.
bp.line = Linhas de building.ini
bp.line.description = Uma linha de building.ini por linha do campo, por exemplo $PRODUCTION raw_salt 1.0. Use “Escolher linha…” para pegar uma linha do prédio de referência e ajustá-la. Suas linhas vêm antes das linhas da referência e substituem: o mesmo token; todos os $TYPE_*; todos os $STORAGE* junto com $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION e $CONSUMPTION_PER_SECOND como uma única receita. Todo o restante da referência permanece.\nPara recursos próprios, sempre use $STORAGE_IMPORT_SPECIAL ou $STORAGE_EXPORT_SPECIAL indicando o recurso; caso contrário, o armazenamento lista todos os recursos da classe de transporte.
bp.strip = Remover linhas da referência
bp.cmd_add = Acrescentar ao final
bp.cmd_add.description = Um comando por linha: uma nova linha inserida antes do encerramento final do arquivo de referência. Um bloco de várias linhas é escrito com | entre elas.
bp.cmd_replace = Substituir
bp.cmd_replace.description = Um comando por linha: linha antiga | linha nova. A linha antiga precisa aparecer exatamente uma vez no arquivo de referência.
bp.cmd_remove = Remover
bp.cmd_remove.description = Um comando por linha: a linha do arquivo de referência a remover. As linhas associadas (pontos, posição) também são removidas.
bp.cmd_insert = Inserir
bp.cmd_insert.description = Um comando por linha: 0 ou 1 | linha de referência | linha nova. 0 coloca a nova linha antes da referência, 1 depois.
bp.strip.description = Um $TOKEN por linha, por exemplo $WORKERS_NEEDED. Toda linha da referência com esse token é removida sem substituição.
bp.life = Resistência
bp.life.description = Vazio = 3000\nLIFE em renderconfig.ini: quanto o prédio pode suportar antes de desabar. Como a maioria dos prédios do jogo.
bp.card.lines = Linhas
bp.item_id.empty = o plugin atribui o próximo número livre a partir de 9300000000 ao iniciar o jogo.
bp.item_name.empty = o nome do objeto; não recomendado.
needs_plus.card.log = Solução de problemas
resources_plus.card.log = Solução de problemas
resources_plus.card.plugin = Plugin
resources_plus.custom_report = Registrar detalhes dos clones
resources_plus.custom_report.description = ON grava, para cada recurso com uma referência, o que o clone realmente herdou (classe de transporte, fatores, flags). Recursos sem referência são sempre listados.\nOFF lista apenas os que não têm referência.
resources_plus.customs_hook = Atualizar alfândegas
resources_plus.customs_hook.description = ON adiciona os novos recursos à lista de comércio das alfândegas já existentes.\nOFF corresponde ao jogo base: uma alfândega só negocia o que conhecia quando foi construída; nesse caso, só demolir e reconstruir resolve.
resources_plus.customs_probe = Registrar entradas das alfândegas
resources_plus.customs_probe.description = ON grava uma linha em tesmioloader.log para cada recurso adicionado a uma alfândega. Desative com OFF quando suas alfândegas mostrarem o que você espera.
resources_plus.price_hook = Aplicar preços do INI
resources_plus.price_hook.description = ON ativa [base_price] e [price]: os preços-base são definidos antes do cálculo de preços do jogo, e os preços fixos depois.\nOFF deixa os preços a cargo do jogo.
resources_plus.price_report = Registrar a tabela de preços
resources_plus.price_report.description = ON grava preço, preço-base e categoria de preço de cada recurso da sua lista em tesmioloader.log após cada cálculo de preços do jogo. Um preço de 0.00 significa que nenhum prédio o produz.\nOFF não grava nada.
tab.resources_plus.general = Geral
resources.heading.basics = Transporte e categoria de preço
resources.heading.cargo = Carga e material
resources.heading.fixed = Preços fixos
resources.heading.market = Valores de mercado
resources.heading.prices = Preços no registro

resources_plus.heading.names = Nomes por idioma do jogo
detail.name_language.description = Nome deste recurso quando o jogo usa este idioma. Vazio: usa o nome de exibição acima. O inglês não precisa de um campo: o nome de exibição é o nome em inglês.
detail.name_german = Alemão
detail.name_bulgarian = Búlgaro
detail.name_chinese = Chinês (simplificado)
detail.name_chinesetraditional = Chinês (tradicional)
detail.name_czech = Tcheco
detail.name_french = Francês
detail.name_hungarian = Húngaro
detail.name_italian = Italiano
detail.name_japanese = Japonês
detail.name_korean = Coreano
detail.name_polish = Polonês
detail.name_portuguesebrazil = Português (Brasil)
detail.name_romanian = Romeno
detail.name_russian = Russo
detail.name_serbian = Sérvio
detail.name_slovak = Eslovaco
detail.name_spanish = Espanhol
detail.name_turkish = Turco
detail.name_ukrainian = Ucraniano
