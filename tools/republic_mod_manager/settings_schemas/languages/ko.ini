[language]
name = 한국어

[strings]
plugin.resources = Resources
plugin.resources.description = 자원, 속성, 선택적인 사용자 지정 가격을 관리합니다.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Resources Plus로 사용자 지정 자원을 관리합니다. 원본과 같은 목록을 plugins\resources_plus.ini에 저장하며, 종료 시 충돌이 발생하지 않습니다.
resources_plus.save_warning = 변경 사항은 저장할 때 plugins\resources_plus.ini에 기록됩니다. 저장된 게임에서 이미 사용 중인 자원을 삭제하면 해당 저장 파일이 손상될 수 있습니다.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Needs Plus로 시민의 사용자 지정 욕구를 관리합니다. 원본과 같은 목록을 plugins 폴더의 needs_plus.ini 파일에 저장하며, 처음 실행할 때 needs.ini에서 가져옵니다.
needs_plus.save_warning = 변경 사항은 저장할 때만 plugins 폴더의 needs_plus.ini에 기록됩니다. 각 욕구는 해당 상점에 저장 슬롯을 추가하며, 이 슬롯은 저장된 게임의 일부가 됩니다. 먼저 복사본에서 시험하세요.
tab.resources.editor = 자원
group.resource_definitions = 자원 정의
detail.transport = 운송 분류
detail.transport.description = 자원을 운송하고 보관할 수 있는 차량과 저장 시설을 지정합니다. 이름만 선택하면 플러그인이 해당 분류의 기본 게임 수치를 추가합니다.
detail.kind = 가격 분류
detail.kind.description = 0 원자재, 1 제조품, 2 식품/의류, 3 고급 소재, 4 전자제품.
detail.record_price = 자원 레코드의 초기 가격
detail.record_price.description = 자원 레코드 안에 초기 RUB 및 USD 값을 지정합니다. 생략할 수 있습니다.
detail.record_base_price = 자원 레코드의 초기 기준 가격
detail.record_base_price.description = 자원 레코드 안에 기준 RUB 및 USD 값을 지정합니다. 생략할 수 있습니다.
detail.trade_mult = 거래 배율
detail.trade_mult.description = 판매 및 구매 배율로, 보통 0.95와 1.05입니다.
detail.market_rub = RUB 시장 블록
detail.market_usd = USD 시장 블록
detail.market.description = 시장 수치 두 개와 선택적인 계수입니다.\n(INI 파일의 설명 참조)
detail.packed = 포장 화물
detail.packed.description = 화물 표현 방식을 자동, 비포장, 포장 중에서 선택합니다.
detail.family = 재료 그룹
detail.family.description = 건설 현장에 쌓인 재료의 외형과, 아마도 어떤 폐기물이 되는지도 결정합니다. 각 그룹에는 폐기물 자원 하나가 연결됩니다. INI의 10부터 19까지 번호는 이름으로 표시됩니다.
detail.cargo = 화물 형상
detail.cargo.description = 화물을 시각화할 때 사용할 형상을 선택합니다.
detail.pinned_base_price = 고정 기준 가격
detail.pinned_base_price.description = [base_price]에 선택적으로 RUB 및 USD 값을 지정합니다. 비워 두면 사용자 지정 항목이 없습니다.
detail.forced_price = 강제 적용할 최종 가격
detail.forced_price.description = [price]에 선택적으로 RUB 및 USD 값을 지정합니다. 비워 두면 게임이 가격을 계산합니다.

; --- 설치된 원본 플러그인용 로컬 스키마 (0.13.0부터) ---
daynight.description = 달력상 하루마다 일출과 일몰이 한 번씩 발생합니다. 기본 게임에서는 낮에서 밤을 거쳐 다시 낮이 되기까지 달력상 13일, 거의 두 주가 걸립니다. 이 플러그인을 사용하면 하루에 이루어집니다.
daynight.group.cycle = 낮과 밤
daynight.group.cycle.description = 낮과 밤의 주기 길이와 밤이 시작되는 시점을 설정합니다.
daynight.group.pace = 진행 속도
daynight.group.pace.description = 차량용과 나머지 요소용으로 나뉜 두 개의 독립적인 설정입니다. 위의 설정과 관계없이 항상 적용됩니다.
daynight.group.diagnostics = 문제 해결
daynight.enabled.label = 플러그인 활성화
daynight.enabled.description = ON이면 설정한 낮과 밤의 주기를 활성화합니다.
daynight.cycle_days.label = 낮과 밤의 주기당 달력 일수
daynight.cycle_days.description = 한 일출에서 다음 일출까지의 달력 일수입니다.\n1 = 매일 일출과 일몰이 한 번씩 발생\n2~12 = 그에 비례하여 긴 주기\n13 = 기본 게임의 주기
daynight.day_scale.label = 하루 길이 (달력을 느리게 하는 배율)
daynight.day_scale.description = 달력상 하루가 기본 게임보다 몇 배 더 오래 걸리는지 지정합니다.\nauto = 조명 주기에 맞춰 달력을 자동으로 느리게 진행 (권장)\n1 = 달력을 늦추지 않음. 이 경우 낮과 밤이 13배 빠르게 바뀜\n2~100 = 이 배율만큼 달력을 느리게 진행\n'느리게 할 대상'에서 게임의 어떤 요소를 느리게 할지 선택하세요.
daynight.slow.label = 느리게 할 대상
daynight.slow.description = 게임의 어떤 요소를 느리게 할지 지정합니다.\ncalendar = 달력만 느리게 진행 (권장)\nworld = 시민과 차량을 포함한 모든 요소를 느리게 진행. 값이 높으면 슬로 모션처럼 보임\nnone = 아무것도 늦추지 않음\ncalendar에서는 시민, 차량, 건설, 생산이 정상 속도를 유지합니다. 오염, 대출, 메시지와 같은 일일 처리도 평소 간격을 유지합니다.
daynight.offset.label = 밤이 시작되는 시점
daynight.offset.description = 달력상 하루 안에서 밤의 위치를 옮깁니다.\n0 = 하루의 중간을 조금 지나면 어두워짐\n0.5 = 날짜가 바뀔 때 어두워짐\n0 이외의 값에서는 13일 주기가 기본 게임과 정확하게 일치하지 않습니다.
daynight.fade.label = 조명 전환 시간 조정
daynight.fade.description = ON이면 아침, 낮, 저녁, 밤 사이의 전환을 설정한 주기에 맞춰 짧게 합니다.\nOFF이면 기본 게임의 느린 전환을 사용합니다. 주기가 짧으면 전환이 겹쳐 조명이 흐릿하게 보일 수 있습니다.
daynight.vehicle_scale.label = 차량 속도
daynight.vehicle_scale.description = 트럭, 기차, 선박, 항공기의 속도입니다. 다른 설정과 독립적으로 작동합니다.\n1 = 기본 게임 속도\n2 = 절반 속도\n0.5 = 두 배 속도\n값이 높을수록 차량이 느려집니다.
daynight.sim_scale.label = 나머지 요소의 속도
daynight.sim_scale.description = 시민, 건설, 생산, 마모, 애니메이션의 속도입니다.\n1 = 기본 게임 속도\n2 = 절반 속도\n0.5 = 두 배 속도\n값이 높을수록 시뮬레이션이 느려집니다.
daynight.probe.label = 하루 길이를 로그에 기록
daynight.probe.description = ON이면 각 달력 날짜와 조명 전환의 실제 소요 시간을 tesmioloader.log에 기록합니다. 문제 해결과 게임 업데이트 후 확인에만 사용하세요.
walking.description = 시민이 걷는 거리와 자동차 소유자가 집, 직장, 주차장 사이를 운전하는 거리를 설정합니다.
walking.group.distances = 거리
walking.group.distances.description = 직선거리가 아니라 도로와 보행로를 따라 측정합니다. 강 건너 400 m 떨어진 건물까지 걸어서 1200 m를 가야 할 수도 있습니다.
walking.group.diagnostics = 문제 해결
walking.enabled.label = 플러그인 활성화
walking.enabled.description = ON이면 설정한 도보 및 자동차 이동 거리를 활성화합니다.
walking.distance.label = 도보 거리 (m)
walking.distance.description = 시민이 걸어서 이동할 수 있는 최장 경로입니다. 기본 게임은 480 m입니다.\n값이 높을수록 걸어서 갈 수 있는 건물과 건설 시 생성되는 연결이 늘어남\n0 = 제한 없음. 대도시에서는 건설 처리에 몇 초가 걸릴 수 있음\n20000 = 허용되는 최댓값
walking.car_distance.label = 자동차 소유자의 운전 거리 (m)
walking.car_distance.description = 집, 직장, 주차장 사이에서 허용되는 최장 운전 거리입니다. 기본 게임은 2500 m입니다.\n값이 높을수록 자동차 소유자가 더 멀리 운전함\n도보 거리보다 높게 설정하세요. 같으면 자동차를 이용해도 이동 범위가 늘어나지 않습니다.
walking.regen_on_load.label = 저장된 게임을 불러올 때 연결 재구성
walking.regen_on_load.description = 보행 및 주차 연결은 저장된 게임에 보관됩니다.\nON이면 불러올 때 모든 연결을 재구성하여 기존 도시에도 설정한 거리가 적용됨\nOFF이면 새로 지은 건물에만 설정한 거리가 적용됨
walking.probe.label = 확인용 값을 로그에 기록
walking.probe.description = ON이면 플러그인이 값을 변경하기 전에 게임에서 찾은 값을 tesmioloader.log에 기록합니다. 문제 해결과 게임 업데이트 후 확인에만 사용하세요.
accumulator.description = 전력망용 배터리입니다. 큰 전력 저장 장치가 있는 건물은 전력이 남을 때 충전하고 부족할 때 다시 공급합니다.
accumulator.group.battery = 배터리
accumulator.group.battery.description = 어떤 건물을 배터리로 취급하고 얼마나 빠르게 충전 및 방전할지 설정합니다.
accumulator.group.window = 건물 창
accumulator.group.grid = 전력망
accumulator.group.diagnostics = 문제 해결
accumulator.enabled.label = 플러그인 활성화
accumulator.enabled.description = ON이면 배터리 건물의 충전과 방전을 활성화합니다.\nOFF이면 방전을 중단합니다. 건물은 남아 있으며 계속 충전할 수 있습니다.
accumulator.building_types.label = 건물 유형
accumulator.building_types.description = 배터리로 작동할 수 있는 건물 유형입니다. 여러 번호는 쉼표로 구분하세요.\n19 = 변압기\n18 = 변전소\n17은 사용하지 마세요. 발전소는 전력을 받을 수 없어 충전되지 않습니다.
accumulator.min_capacity.label = 배터리로 취급할 최소 저장 용량
accumulator.min_capacity.description = 건물을 배터리로 취급하기 위한 최소 저장 용량입니다. 일반 변전소의 작은 저장 장치를 제외합니다.\n값이 높을수록 배터리로 취급되는 건물이 줄어듦\n값이 낮을수록 배터리로 취급되는 건물이 늘어남\n포함된 'Stationary Accumulator'의 용량은 5000입니다.
accumulator.charge_rate.label = 충전 속도 (초당 전력)
accumulator.charge_rate.description = 배터리가 초당 받는 최대 전력입니다. 빈 배터리가 도시 전체의 전력을 빼앗는 것을 방지합니다.\n값이 높을수록 충전이 빨라지고 전력망 부하가 커짐\n값이 낮을수록 충전이 느려지고 부하가 작아짐\n비교하면 석탄 발전소는 70, 풍력 터빈은 15를 공급합니다.
accumulator.discharge_rate.label = 방전 속도 (초당 전력)
accumulator.discharge_rate.description = 배터리가 초당 공급하는 최대 전력입니다. 전력망에 전력이 부족할 때만 공급합니다.\n값이 높을수록 더 큰 전력 부족을 보완함\n값이 낮을수록 저장된 에너지가 오래감\n예: 60으로 설정하면 용량 5000의 완충 배터리가 발전소를 80초 남짓 대신합니다.
accumulator.panel.label = 배터리 창의 충전량 표시 행
accumulator.panel.description = ON이면 배터리 창에 충전량을 추가합니다. 예: 'Charge: 4210.5 / 5000 (84.2 %)'.
accumulator.panel_caption.label = 이 행의 제목
accumulator.panel_caption.description = 충전량 앞에 표시할 단어입니다. 악센트나 특수 문자가 없는 영문자만 사용하세요. 그렇지 않으면 게임에서 글자가 깨집니다.
accumulator.gauges.label = 배터리 상태로 창의 계기 계산
accumulator.gauges.description = ON이면 게임의 잘못된 표시를 배터리의 실제 유입 및 유출 전력으로 바꿉니다.\nOFF이면 게임의 일반 표시를 사용합니다. 충전 중에도 전력 0과 '전력 공급 없음'이 표시될 수 있습니다.
accumulator.spread_voltage.label = 실험: 이웃 건물에 전압 전달 (꺼 두세요)
accumulator.spread_voltage.description = ON으로 설정해도 효과가 없습니다. 이 오래된 기능은 기술적으로 다른 방식으로 대체되었습니다. OFF로 두세요.
accumulator.trace.label = 첫 번째 배터리의 이웃 건물 기록
accumulator.trace.description = ON이면 첫 번째 배터리 옆 건물들이 받는 전력을 로그에 기록합니다. 문제 해결용이며 성능이 저하될 수 있습니다.
accumulator.log_seconds.label = 배터리 로그 기록 간격 (초)
accumulator.log_seconds.description = tesmioloader.log에 배터리 상태 메시지를 기록하는 간격입니다. 각 메시지에는 충전량, 유입량, 유출량이 포함됩니다.\n0 = 상태 메시지 없음\n값이 높을수록 기록 빈도가 낮아집니다.
accumulator.probe.label = 로그의 건물 목록 기록 간격 (초)
accumulator.probe.description = 전력 저장 장치가 있는 모든 건물 목록을 tesmioloader.log에 기록하는 간격입니다. 배터리가 인식되지 않거나 게임이 업데이트된 뒤에만 사용하세요.\n0 = 목록을 기록하지 않음\n값이 높을수록 기록 빈도가 낮아집니다.
cities.description = 각 도시의 크기와 모양을 설정합니다. 기본 게임의 도시는 모두 반경 1000 m의 원입니다. 이 플러그인으로 도시 창에서 각 도시의 반경을 개별적으로 설정하고 정사각형으로 바꿀 수도 있습니다. 값은 저장된 게임에 보관됩니다.
cities.group.cities = 도시
cities.group.slider = 반경 슬라이더
cities.group.slider.description = 도시 창 슬라이더의 범위와 + 또는 -를 한 번 누를 때의 변경량입니다.
cities.group.layout = 도시 창 배치
cities.group.layout.description = 도시 창에 추가되는 두 행의 위치입니다. 숫자는 게임 창 자체 단위로 표시한 위치이며, 창 너비는 약 500입니다.
cities.group.overlay = 지면의 점 격자
cities.group.diagnostics = 문제 해결
cities.enabled.label = 플러그인 활성화
cities.enabled.description = ON이면 도시의 사용자 지정 크기와 모양을 활성화합니다.
cities.window.label = 도시 창의 반경 슬라이더와 모양 체크 상자
cities.window.description = ON이면 도시 창에 반경 슬라이더와 정사각형 체크 상자를 표시합니다.\nOFF이면 둘 다 숨깁니다. 설정값은 유지되지만 더 이상 변경할 수 없습니다.
cities.adopt.label = 소속을 잃은 건물을 위한 새 도시 생성
cities.adopt.description = 도시를 줄이면 일부 건물이 경계 밖으로 나가 어느 도시에도 속하지 않게 될 수 있습니다.\nON이면 게임 자체 동작과 같이 임의의 이름과 오늘 날짜로 새 도시를 설립함\nOFF이면 도시 없이 둠. 이 경우 게임의 동작은 검증되지 않았습니다.
cities.radius.label = 기본 반경 (m)
cities.radius.description = 개별 설정이 없는 도시의 기본 반경입니다. 모든 맵에 적용됩니다.\n1000 = 기본 게임 반경\n값이 높을수록 도시가 커짐\n값이 낮을수록 도시가 작아짐
cities.square.label = 기본 모양을 정사각형으로 설정
cities.square.description = ON이면 개별 설정이 없는 도시를 정사각형으로 만듭니다.\nOFF이면 기본 게임처럼 원을 사용합니다.
cities.radius_min.label = 슬라이더의 최소 반경 (m)
cities.radius_min.description = 슬라이더 맨 왼쪽 값입니다.
cities.radius_max.label = 슬라이더의 최대 반경 (m)
cities.radius_max.description = 슬라이더 맨 오른쪽 값입니다. 슬라이더는 100단계이며, 범위가 200~5000이면 한 단계는 48 m입니다.
cities.step.label = 버튼 클릭당 비율
cities.step.description = + 또는 -를 한 번 누를 때 변경할 슬라이더 범위의 비율입니다. 슬라이더를 끌 때는 적용되지 않습니다.\n값이 높을수록 클릭당 변경량이 커짐\n값이 낮을수록 더 세밀하게 변경 가능
cities.label_x.label = 레이블 위치
cities.label_x.description = 창 왼쪽 가장자리에서 레이블까지의 거리입니다.
cities.widget_x.label = 조작 요소 위치
cities.widget_x.description = 창 왼쪽 가장자리에서 슬라이더와 체크 상자까지의 거리입니다. 슬라이더에는 약 225가 필요합니다.
cities.checkbox_dy.label = 체크 상자 행을 위아래로 이동
cities.checkbox_dy.description = 슬라이더와 겹치지 않도록 체크 상자를 위아래로 옮깁니다.\n값이 높을수록 체크 상자가 아래로 이동\n값이 낮을수록 체크 상자가 위로 이동
cities.overlay.label = 오버레이를 반경과 모양에 맞춤
cities.overlay.description = 도시 창이 열려 있으면 게임이 지면에 파란 점 격자를 표시하지만, 항상 반경 1000 m의 원으로 표시합니다.\nON이면 설정한 반경과 모양에 맞춤\nOFF이면 기본 게임 상태를 유지
cities.overlay_step.label = 오버레이 격자 간격 (m)
cities.overlay_step.description = 도시 경계를 표시하는 점 사이의 거리입니다.\n0 = 반경의 이십 분의 일을 자동 사용하되 최소 50 m\n값이 낮을수록 표시가 촘촘해지고 성능 부담이 커집니다.
cities.probe.label = 도시를 로그에 기록
cities.probe.description = ON이면 불러온 뒤 각 도시의 반경, 모양, 건물 수를 tesmioloader.log에 기록합니다. 도시 창이 열려 있는 동안 추가 메시지도 기록합니다. 문제 해결용이며 로그가 빠르게 커질 수 있습니다.
depletion.description = 광상이 고갈됩니다. 가동 중인 광산이 맵의 광상을 눈에 보이게 캐내며, 남은 양이 적을수록 생산량도 줄어듭니다. 채굴 내역은 저장된 게임에 보관되므로 나중에 플러그인을 꺼도 채굴한 자원은 돌아오지 않습니다. 먼저 저장된 게임의 복사본에서 시험하세요.
depletion.group.depletion = 채굴
depletion.group.window = 광산 창
depletion.group.diagnostics = 문제 해결
depletion.enabled.label = 플러그인 활성화
depletion.enabled.description = ON이면 선택한 광상이 채굴에 따라 고갈됩니다.\nOFF이면 추가 고갈을 중단합니다. 이미 제거된 자원은 복원되지 않습니다.
depletion.tonnes_per_texel.label = 맵 지점당 톤 수
depletion.tonnes_per_texel.description = 자원 맵의 완전히 찬 한 지점에서 광산이 채굴할 수 있는 톤 수입니다. 자원이 적은 지점은 그에 비례하여 적게 나옵니다.\n값이 높을수록 광상이 오래감\n값이 낮을수록 광상이 빨리 고갈됨\n비교하면 탐색 반경이 210 m인 광산은 수천 개의 맵 지점을 포함합니다.
depletion.vanilla.label = 고갈되는 기본 게임 광상
depletion.vanilla.description = 고갈될 수 있는 기본 게임 광상입니다. 여러 값은 쉼표로 구분하세요.\noil, iron, coal, uranium, bauxite, gravel = 지정한 광상만\nall = 모든 광상\nnone = 기본 게임 광상 제외\nname:value = 사용자 지정 맵 지점당 톤 수. 예: iron:3000\ndeposits.ini의 광상은 항상 포함됩니다.\ngravel은 보이는 지면 텍스처를 영구적으로 제거하며, 탐색 범위가 작아 훨씬 높은 값이 필요합니다. 기본 게임 동작을 유지하려면 gravel을 빼세요.
depletion.flush_seconds.label = 채굴 내역 저장 간격 (초)
depletion.flush_seconds.description = 자원 맵을 갱신하는 간격을 초로 지정합니다. 생산량과 품질은 즉시 바뀌며, 미니맵과 저장된 게임만 이 간격으로 갱신됩니다.\n값이 낮을수록 갱신 빈도와 성능 부담이 커짐\n초당 네 번보다 자주 갱신하지 마세요.
depletion.panel.label = 광산 창의 광상 잔량 표시 행
depletion.panel.description = ON이면 광산 창에 남은 매장량을 표시하고 창 높이를 조금 늘립니다. 예: 'Remaining: 251.4 kt / 259.3 kt (96.9 %)'.
depletion.panel_caption.label = 이 행의 제목
depletion.panel_caption.description = 잔량 앞에 표시할 단어입니다. 악센트나 특수 문자가 없는 영문자만 사용하세요. 그렇지 않으면 게임에서 글자가 깨집니다.
depletion.log_seconds.label = 진행 상황 기록 간격 (초)
depletion.log_seconds.description = tesmioloader.log에 광산 상태 메시지를 기록하는 간격을 초로 지정합니다. 각 메시지에는 잔량, 총량, 품질이 포함됩니다.\n0 = 상태 메시지 없음\n값이 높을수록 기록 빈도가 낮아짐\n게임 내 며칠 동안 관찰하여 적절한 맵 지점당 톤 수를 찾으세요.
easystart.description = 시민의 욕구가 시간이 흐르면서 조금씩 생깁니다. 아직 해제되지 않은 욕구는 행복과 건강에 영향을 주지 않습니다. 시민은 계속 해당 시설을 방문하고 구매하지만, 그에 따른 결과는 지정한 연도부터 나타납니다.
easystart.group.general = 적용을 늦출 대상
easystart.group.unlock = 해제 연도
easystart.group.unlock.description = 요구 사항이 적용되기 시작하는 연도입니다. 해당 연도의 1월 1일부터 적용됩니다. 일정은 1920년에 설립한 공화국을 기준으로 합니다. 1960년에 시작하면 기본 설정 연도는 이미 지난 상태입니다.\noff = 늦추지 않음. 기본 게임 동작\nalways = 게임 첫날부터 적용\n연도 = 해당 연도에 해제
easystart.group.diagnostics = 문제 해결
easystart.enabled.label = 플러그인 활성화
easystart.enabled.description = ON이면 설정한 일정에 따라 욕구와 기반 시설 요구를 해제합니다.
easystart.demands.label = 시민의 아홉 가지 욕구 적용 지연
easystart.demands.description = ON이면 식품, 육류, 의류, 전자제품, 주류, 종교, 문화, 스포츠, 건강 욕구를 각각 설정한 해제 연도까지 늦춥니다.
easystart.utilities.label = 건물의 세 가지 기반 시설 요구 지연
easystart.utilities.description = ON이면 전기, 수도, 난방 요구를 각각 설정한 해제 연도까지 늦춥니다.
easystart.warnings.label = 건물 창의 경고 표시 지연
easystart.warnings.description = ON이면 '건물에 전력 공급 없음'과 같은 관련 경고를 해제 연도까지 숨깁니다.
easystart.pin_status.label = 미해제 욕구의 충족도 유지
easystart.pin_status.description = ON이면 미해제 욕구의 충족도를 아래 값으로 유지합니다.\nOFF이면 충족도가 계속 떨어지므로 욕구가 해제될 때 이미 매우 낮을 수 있습니다.
easystart.locked_status.label = 미해제 상태의 충족도
easystart.locked_status.description = 욕구가 해제되기 전의 충족도입니다. 식품에서는 포만도를 뜻합니다.\n1.0 = 완전히 만족하거나 배부름\n0.5 = 해제 후 눈에 띄는 개선을 볼 수 있는 중간값
easystart.clear_unsatisfied.label = 미충족 목록에서 미해제 욕구 제외
easystart.clear_unsatisfied.description = ON이면 미해제 욕구로 인해 'N명의 시민이 X를 얻지 못했습니다' 메시지가 나오지 않게 합니다.
easystart.probe.label = 해제 상태를 로그에 기록
easystart.probe.description = ON이면 연도가 바뀔 때마다 아직 해제되지 않은 욕구를 tesmioloader.log에 기록합니다. 처음 영향을 받은 시민도 한 번 기록합니다. 문제 해결용입니다.
easystart.food.label = 식품
easystart.religion.label = 종교
easystart.meat.label = 육류
easystart.clothes.label = 의류
easystart.alcohol.label = 주류
easystart.sport.label = 스포츠
easystart.culture.label = 문화
easystart.health.label = 건강
easystart.electricity.label = 전기
easystart.water.label = 수도 (하수 포함)
easystart.heating.label = 난방
easystart.electronics.label = 전자제품
easystart.school.label = 학교
easystart.school.description = 이 연도 전에는 게임의 교육 설정 '간단'과 같이 아이들이 학교 없이 배우며, 'N명의 아이가 학교에 갈 수 없습니다' 메시지가 나오지 않습니다.
easystart.kindergarten.label = 유치원
easystart.kindergarten.description = 이 연도 전에는 여섯 살 미만 아이 때문에 부모가 집에 머물 필요가 없으며, '모든 유치원이 … 상태여서 N명의 노동자가 일할 수 없습니다' 메시지가 나오지 않습니다.
plugin.needs = Needs
plugin.needs.description = 원본 파일을 편집하지 않고 시민의 추가 욕구와 플러그인 설정을 관리합니다.
tab.needs.editor = 욕구
group.needs = 시민의 욕구
group.needs.plugin = 플러그인 설정
group.needs.plugin.description = 모든 욕구에 적용되는 설정입니다.
needs.list = 욕구 목록
needs.add = 욕구 추가
needs.select_help = 왼쪽에서 욕구를 선택하거나 +로 Resources에 등록된 자원을 추가하세요.
needs.resource = 자원
needs.resource.help = 시민이 필요로 하게 될 자원입니다. Resources 플러그인의 목록에 등록되어 있어야 합니다.
needs.donor = 원형 욕구
needs.donor.description = 원형으로 사용할 기존 욕구입니다.\nfood 또는 meat = 식료품점용\nclothes 또는 eletronics = 백화점용\nalcohol = 주류 판매점용\neletronics는 게임에서 사용하는 철자입니다.
needs.factor = 수량 배율
needs.factor.description = 원형 욕구에 대한 상품 수량입니다.\n1.0 = 원형과 같은 수량\n값이 높을수록 시민이 더 많이 필요로 함\n값이 낮을수록 시민이 더 적게 필요로 함
needs.category = 상점 분류
needs.category.description = 상품을 비축할 상점입니다.\nauto = 원형 욕구와 같은 상점\nnone = 자동 저장 슬롯 없음. 건물이 자체적으로 상품을 제공해야 함\nbasic = 기본 상점만\nmedium = 중형 상점만\nadvanced = 대형 상점만\nmediumadvanced = 중형 및 대형 상점만\nhotel = 호텔만\n숫자 = 상점 값을 직접 기록. 게임 파일에 익숙한 사용자용
needs.chance = 확률
needs.chance.description = 시민에게 이 욕구가 부여될 확률로, 0~1 사이입니다. 1 미만이면 원형 욕구와 독립적으로 부여됩니다.\n0 = 누구에게도 부여하지 않음\n1 = 조건에 맞는 모든 시민에게 부여
needs.unhappy = 불만족
needs.unhappy.description = 시민이 상품을 얻지 못했을 때 잃는 만족도입니다.\n0 = 감소 없음. 욕구만 표시\n0.005~0.02 = 편의 상품에 일반적으로 쓰이는 범위\n허용 범위: 0~1
needs.enabled = 플러그인 활성화
needs.enabled.description = ON이면 플러그인을 활성화합니다.\nOFF이면 다음 게임 실행 시 완전히 비활성화합니다.
needs.demand = 욕구 부여
needs.demand.description = ON이면 시민에게 새로운 욕구를 부여합니다.\nOFF이면 욕구를 부여하지 않지만 상점에는 상품을 추가할 수 있습니다.
needs.storage = 상점에 상품 추가
needs.storage.description = ON이면 선택한 상점에 상품을 추가합니다.\nOFF이면 저장 슬롯을 추가하지 않으므로 시민은 자체적으로 상품을 제공하는 건물에서만 구할 수 있습니다.
needs.max_demands = 시민당 욕구 수
needs.max_demands.description = 시민이 동시에 가질 수 있는 추가 욕구의 최대 개수입니다.\n1 = 추가 욕구가 최대 하나\n7 = 허용되는 최대 개수
needs.when_full = 욕구 수가 한도에 도달한 경우
needs.when_full.description = 시민이 이미 최대 개수의 추가 욕구를 가진 경우의 처리 방식입니다.\nskip = 빈자리가 생길 때까지 대기\nreplace = 이번에는 원형 욕구를 대체
needs.probe = 상세 로그
needs.probe.description = ON이면 시민의 욕구 목록과 모든 상점의 정보를 플러그인 상세 로그에 기록합니다.\nOFF이면 경고만 기록합니다. 새 상점을 확인할 때 일시적으로 켜세요.
needs.log_seconds = 진행 상황 메시지 간격 (초)
needs.log_seconds.description = 부여된 욕구 수를 보고하는 메시지 사이의 초 단위 간격입니다.\n0 = 이 메시지를 비활성화\n값이 높을수록 기록 빈도가 낮아집니다.
tab.needs.general = 일반
plugin.deposits = Deposits
plugin.deposits.description = 원본 파일을 편집하지 않고 기본 게임에 없는 광상 유형과 플러그인 설정을 관리합니다.
tab.deposits.general = 일반
tab.deposits.editor = 광상
group.deposits = 광상
group.deposits.description = 원래 광상은 보호되며 숨길 수 있습니다. 사용자 지정 광상은 별도로 저장한 뒤 실제로 사용되는 deposits.ini에 병합합니다. [deposits]를 제외한 각 섹션이 광상 하나를 나타냅니다.
group.deposits.plugin = 플러그인 설정
group.deposits.plugin.description = [deposits] 섹션의 세 하위 시스템입니다. 여기에서 끈 하위 시스템은 모든 광상에서 비활성화됩니다.
deposits.notice = 광상의 유형 번호, 맵 채널, building.ini의 토큰은 광산에서 사용하는 순간 저장된 게임의 일부가 됩니다. 저장된 게임에서 사용 중인 광상을 삭제하거나 번호를 바꾸면 저장 파일을 사용할 수 없게 될 수 있습니다. 먼저 복사본에서 시험하세요.
deposits.list = 광상 목록
deposits.add = 광상 추가
deposits.select_help = 왼쪽에서 광상을 선택하거나 +로 Resources에 등록된 자원용 광상을 추가하세요.
deposits.name = 광상
deposits.name.help = deposits.ini의 섹션 이름입니다. 로그와 편집기 브러시에서 광상을 식별하는 이름이며, 나중에 바꿀 수 없습니다.
deposits.new_name = 광상 이름
deposits.new_hint = 여기에서는 기본 설정만 입력합니다. 나머지 설정(구성 요소, 건물 유형, 고갈)은 추가 후 오른쪽 설정에서 찾을 수 있습니다.
deposits.code_patch = 코드 패치
deposits.code_patch.description = ON이면 설정한 $TYPE_MINE_ 광상 유형을 게임에 등록하여 광산이 building.ini를 통해 찾을 수 있게 합니다. 업데이트 후 예상한 게임 데이터가 더 이상 일치하지 않으면 플러그인은 아무것도 변경하지 않습니다.
deposits.minimap_all = 미니맵 레이어
deposits.minimap_all.description = ON이면 개별적으로 활성화한 플러그인 광상마다 게임의 다섯 미니맵 버튼 아래에 버튼을 표시합니다.\nOFF이면 플러그인 광상 버튼을 모두 숨깁니다.
deposits.editor_all = 지형 편집기 브러시
deposits.editor_all.description = ON이면 브러시 이름이 있는 광상마다 지형 편집기의 자원 탭에 그리기 및 지우기 브러시를 표시합니다.\nOFF이면 플러그인 광상 브러시를 모두 숨깁니다.
deposits.token = 건물 토큰
deposits.token.description = 이 광상을 위해 광산이 building.ini에서 사용하는 토큰입니다. 예: $TYPE_MINE_COPPER. $TYPE_MINE_GRAVEL과 같은 형식으로 입력하세요. 하나의 building.ini에 광상 토큰 두 개를 사용하지 마세요.
deposits.type = 유형 번호
deposits.type.description = 광상의 고유 유형 번호입니다. 서로 다른 광상에 같은 번호를 사용할 수 없습니다.\n10~127 = 허용 범위\n0~9 = 기본 게임용으로 예약됨\n대화 상자는 다음 빈 번호를 자동으로 제안합니다.
deposits.map = 맵
deposits.map.description = 광상이 저장되는 맵입니다.\nauto = 플러그인 맵의 빈 슬롯을 자동 선택 (권장)\nresourcemap 또는 resourcemap2 = 기본 게임 맵 사용\nresourcemap3~resourcemap10 = 플러그인의 추가 맵 사용\nterrain = 칠해진 지형을 직접 사용. 자갈 등이 해당하며 브러시는 ROCKS 아래에 표시됨
deposits.component = 구성 요소
deposits.component.description = 각 맵에는 0~3의 슬롯 네 개가 있습니다. 각 슬롯에는 광상 하나를 저장할 수 있습니다.\nauto인 경우 = 비워 두면 플러그인이 빈 슬롯을 선택\nterrain인 경우: 2 = 자갈 레이어\nterrain인 경우: 3 = 오아시스 레이어
deposits.building_type = 건물 유형
deposits.building_type.description = 이 광상을 채굴할 수 있는 건물 유형입니다.\n7 = 광산. 거의 모든 광상에 적합\n92 = 우물\n빈칸 = 7
deposits.radius = 탐색 반경
deposits.radius.description = 광산이 광상을 찾는 범위입니다.\noil, ore, bauxite, gravel, wood, water, watersurface = 해당 게임 상수 사용\n숫자 = 해당 거리를 직접 사용\n빈칸 = ore 사용\n반경이 없으면 광산이 광상을 찾지 못합니다.
deposits.icon = 미니맵 아이콘
deposits.icon.description = 미니맵 버튼에 아이콘을 표시할 자원입니다. 게임이 이미 불러온 아이콘을 사용하므로 별도 이미지는 필요 없습니다.\nResources 플러그인의 자원은 해당 플러그인에 등록되어 있어야 합니다.\n빈칸 = 아이콘 없음
deposits.minimap = 미니맵 버튼
deposits.minimap.description = ON이면 이 광상의 미니맵 버튼과 오버레이 레이어를 추가합니다.
deposits.editor = 편집기 브러시 이름
deposits.editor.description = 지형 편집기의 그리기 및 지우기 브러시 이름입니다. vfs\media_soviet\editor 안의 tool_paint_<name>.png 및 tool_erase_<name>.png에도 같은 이름을 사용합니다.\n빈칸 = 브러시를 만들지 않음\n허용 문자: 최대 31자의 영문자, 숫자, _, -
deposits.deplete = 텍셀당 고갈 설정
deposits.deplete.description = Depletion 플러그인이 읽는 설정입니다. 자원 맵의 완전히 찬 한 지점에서 채굴할 수 있는 톤 수를 지정합니다. 자원이 적은 지점은 그에 비례하여 적게 나옵니다.\nplugins\depletion.ini의 tonnes_per_texel보다 우선합니다.\n0 = 이 광상은 무한으로 유지\n빈칸 = 전역 설정값 사용
deposits.save_warning = 변경 사항은 저장할 때만 실제로 사용되는 deposits.ini에 기록됩니다. 저장된 게임에서 이미 사용 중인 광상의 유형 번호, 맵 채널, 토큰은 변경하면 안 됩니다. 먼저 복사본에서 시험하세요.
depletion.tab.general = 일반
depletion.tab.mining = 채굴
needs.save_warning = 변경 사항은 저장할 때만 실제로 사용되는 needs.ini에 기록됩니다. 각 욕구는 해당 상점에 저장 슬롯을 추가하며, 이 슬롯은 저장된 게임의 일부가 됩니다. 먼저 복사본에서 시험하세요.
bp.name = Buildings Plus
bp.description = 정의를 바탕으로 새 건물을 만듭니다. 게임의 원형 건물에 변경할 building.ini 행을 조합하며, 게임을 실행할 때마다 완전한 Workshop 항목으로 기록합니다.
bp.notice = 각 건물은 고유한 Workshop ID를 가진 폴더로 media_soviet\workshop_wip에 생성됩니다. ID를 비워 두면 게임 실행 시 9300000000부터 다음 빈 번호를 할당하고 plugins\buildings_plus.ids.ini에 보관합니다. 게임은 폴더를 게시되지 않은 Workshop 항목으로 읽습니다. 변경 사항을 적용하려면 게임을 완전히 다시 시작해야 합니다. 이 건물이 포함된 저장 파일을 불러오려면 해당 폴더가 필요합니다.
bp.tab.general = 일반
bp.tab.buildings = 건물
bp.tab.generated = 생성된 건물
bp.wip = 게임 폴더의 생성된 건물
bp.wip.description = Buildings Plus 또는 원본 buildings 플러그인이 media_soviet\workshop_wip에 생성한 건물을 표시합니다. 여기에 표시되는 내용은 폴더에서 읽습니다.
bp.wip.empty = 아직 생성된 건물이 없습니다. 건물을 활성화하면 게임 실행 시 생성됩니다.
bp.group = 건물
bp.group.notice = 여기의 건물은 게임 건물의 일부 행을 바꾼 복사본입니다. 모델과 연결은 같고 생산 방식은 직접 정합니다. 같은 종류의 원형을 선택하세요(광산에는 광산, 공장에는 공장).
bp.list = 건물
bp.add = 추가
bp.select_help = 왼쪽에서 건물을 선택하거나 +로 추가하세요. 먼저 원형을 선택하며 Workshop ID는 비워 두어도 됩니다. 이름과 행은 오른쪽에서 설정합니다.
bp.id = 개체 이름
bp.id.help = 생성된 건물의 폴더와 개체 이름이며 로그에도 표시됩니다. 영문자, 숫자, _, -만 사용할 수 있고 최대 64자입니다. 나중에 바꿀 수 없습니다.
bp.save_warning = 변경 사항은 저장할 때만 실제로 사용되는 buildings_plus.ini에 기록되며 게임을 완전히 다시 시작한 뒤 적용됩니다. 그때 플러그인이 media_soviet\workshop_wip에 폴더를 기록합니다. 오류가 있는 섹션은 건너뛰고 이름을 로그에 남깁니다.
bp.list.note = 최대 256개 건물.
bp.new_name = 개체 이름
bp.new_hint = 공백은 밑줄로, 대문자는 소문자로 바뀝니다.
bp.card.folders = 생성된 폴더
bp.card.log = 문제 해결
bp.card.new = 새 건물
bp.links = 안내서
bp.link.readme = README (안내서)
bp.prune = 폴더 정리
bp.prune.description = ON이면 삭제하거나 비활성화한 건물의 생성 폴더를 다음 게임 실행 시 제거합니다. 이 플러그인이 기록한 폴더만 해당됩니다.\nOFF이면 폴더를 남겨 두며 게임은 해당 건물을 계속 불러옵니다.
bp.always = 항상 다시 기록
bp.always.description = ON이면 게임을 실행할 때마다 모든 건물 폴더를 기록합니다.\nOFF이면 해당 섹션, 플러그인 또는 원형 파일이 바뀐 경우에만 기록합니다. OFF로 두세요.
bp.verbose = 상세 로그
bp.verbose.description = ON이면 복사한 모든 파일과 원형에서 제거한 모든 행을 logs\tesmioloader.buildings_plus.log에 기록합니다.\nOFF이면 결과, 경고, 오류만 기록합니다.
bp.repair_owner_ids = 소유자 ID 채우기
bp.repair_owner_ids.description = ON이면 소유자 ID가 없는 생성 건물에 사용자의 Steam ID를 입력합니다. 다른 생성 도구의 건물도 포함합니다. ID가 없으면 해당 건물을 사용하는 저장 파일을 불러올 때마다 누락된 Workshop 항목에 대한 확인이 표시됩니다.\nOFF이면 다른 생성 도구의 폴더를 그대로 둡니다.
bp.card.saves = 저장된 게임
bp.card.saves.description = 저장된 게임은 이미 지어진 각 건물의 저장 공간을 기억합니다. 이 설정으로 사용자 건물에 새로 추가한 저장 행을 기존 건물에도 적용할 수 있습니다.
bp.retrofit = 기존 건물의 저장 공간도 최신 상태로 유지
bp.retrofit.description = ON: 저장된 게임을 불러오면 완공된 모든 생성 건물에 해당 섹션에 추가한 단일 자원용 저장 공간을 빈 상태로 추가합니다. 저장 행의 용량을 변경하면 저장 공간도 바뀝니다. 축소는 재고가 들어갈 수 있을 때까지 기다립니다. 행을 제거한 저장 공간은 비워지면 건물에서 사라집니다.\nOFF: 기존 건물의 저장 공간은 그대로이며, 새 행과 변경한 행은 이후에 짓는 건물에만 적용됩니다.
bp.enabled = 건물 활성화
bp.enabled.description = ON이면 다음 게임 실행 시 이 건물을 생성합니다.\nOFF이면 생성하지 않습니다. '폴더 정리'가 켜져 있으면 다음 실행 시 기존 폴더를 제거합니다.
bp.item_id = Workshop ID
bp.item_id.description = 사용자 지정 번호도 가능합니다. 9000000000~9999999999이며, 9100000000~9199999999는 다른 생성 도구용으로 예약되어 제외됩니다.\n게임 폴더의 workshop_wip 안에 있는 폴더 이름이 되며 나중에 바꾸면 안 됩니다.
bp.donor = 원형 건물
bp.donor.description = 복사본의 바탕이 되는 건물입니다. Workshop 건물은 구독 중이어야 합니다.\n'원형 선택...'으로 사용할 수 있는 건물을 찾아보세요. 광산에는 광산, 공장에는 공장, 상점에는 상점처럼 종류를 맞추세요.
bp.item_name = 게임 내 이름
bp.item_name.description = 게임에서 표시할 이름입니다.\n점이 포함된 값은 번역 키로 간주하여 Localization 플러그인을 통해 해석합니다. 예: localization.lang.salt_mine
bp.desc = 설명
bp.desc.description = Workshop 항목의 설명입니다. 한 행씩 입력하며 따옴표는 사용하지 마세요.
bp.line = building.ini 행
bp.line.description = 입력란 한 행마다 building.ini 행을 하나씩 입력합니다. 예: $PRODUCTION raw_salt 1.0. '행 선택…'으로 원형 건물의 행을 가져와 수정할 수 있습니다. 사용자 행은 원형 행 앞에 놓이며 다음을 대체합니다: 같은 토큰, 모든 $TYPE_*, $RESOURCE_VISUALIZATION과 함께 모든 $STORAGE*, 하나의 생산 방식으로 묶인 $PRODUCTION, $CONSUMPTION, $CONSUMPTION_PER_SECOND. 나머지 원형 내용은 유지됩니다.\n사용자 지정 자원에는 반드시 자원 이름을 지정한 $STORAGE_IMPORT_SPECIAL 또는 $STORAGE_EXPORT_SPECIAL을 사용하세요. 그렇지 않으면 저장 공간에 해당 운송 분류의 모든 자원이 나열됩니다.
bp.strip = 원형 행 제거
bp.cmd_add = 끝에 추가
bp.cmd_add.description = 한 행당 명령 하나입니다. 원형 파일의 마지막 닫는 부분 앞에 새 행을 넣습니다. 여러 행으로 된 블록은 행 사이를 |로 구분하여 기록합니다.
bp.cmd_replace = 바꾸기
bp.cmd_replace.description = 한 행당 명령 하나입니다. 형식: 기존 행 | 새 행. 기존 행은 원형 파일에 정확히 한 번 있어야 합니다.
bp.cmd_remove = 제거
bp.cmd_remove.description = 한 행당 명령 하나입니다. 원형 파일에서 제거할 행을 입력합니다. 연결된 행(점, 위치)도 함께 제거됩니다.
bp.cmd_insert = 삽입
bp.cmd_insert.description = 한 행당 명령 하나입니다. 형식: 0 또는 1 | 기준 행 | 새 행. 0은 기준 행 앞에, 1은 뒤에 새 행을 넣습니다.
bp.strip.description = 한 행당 $TOKEN 하나를 입력합니다. 예: $WORKERS_NEEDED. 해당 토큰을 가진 원형 행을 모두 대체 없이 제거합니다.
bp.life = 내구도
bp.life.description = 빈칸 = 3000\nrenderconfig.ini의 LIFE 값으로, 건물이 무너지기 전까지 견딜 수 있는 정도입니다. 대부분의 게임 건물과 같습니다.
bp.card.lines = 행
bp.item_id.empty = 플러그인이 게임 실행 시 9300000000부터 다음 빈 번호를 할당합니다.
bp.item_name.empty = 개체 이름을 사용합니다. 권장하지 않습니다.
needs_plus.card.log = 문제 해결
resources_plus.card.log = 문제 해결
resources_plus.card.plugin = 플러그인
resources_plus.custom_report = 복제된 레코드 기록
resources_plus.custom_report.description = ON이면 원형이 있는 각 자원에 대해 복제본이 실제로 상속한 내용(운송 분류, 계수, 플래그)을 기록합니다. 원형이 없는 자원은 항상 나열됩니다.\nOFF이면 원형이 없는 자원만 나열합니다.
resources_plus.customs_hook = 세관 갱신
resources_plus.customs_hook.description = ON이면 기존 세관의 거래 목록에 새 자원을 추가합니다.\nOFF이면 기본 게임처럼 세관이 건설 당시 알고 있던 자원만 거래합니다. 이 경우 철거 후 재건설해야 합니다.
resources_plus.customs_probe = 세관 추가 항목 기록
resources_plus.customs_probe.description = ON이면 세관에 추가되는 자원마다 tesmioloader.log에 한 행을 기록합니다. 세관이 예상한 자원을 표시하면 OFF로 바꾸세요.
resources_plus.price_hook = INI의 가격 적용
resources_plus.price_hook.description = ON이면 [base_price]와 [price]를 활성화합니다. 기준 가격은 게임의 가격 계산 전에, 고정 가격은 계산 후에 설정합니다.\nOFF이면 가격을 게임에 맡깁니다.
resources_plus.price_report = 가격표를 로그에 기록
resources_plus.price_report.description = ON이면 게임의 가격 계산 후마다 목록의 모든 자원에 대한 가격, 기준 가격, 가격 분류를 tesmioloader.log에 기록합니다. 가격 0.00은 생산하는 건물이 없다는 뜻입니다.\nOFF이면 아무것도 기록하지 않습니다.
