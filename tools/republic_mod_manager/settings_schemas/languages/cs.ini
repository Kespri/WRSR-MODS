[language]
name = Čeština

[strings]
plugin.resources = Resources
plugin.resources.description = Správa surovin, jejich vlastností a volitelných vlastních cen.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Vlastní suroviny s Resources Plus: stejný seznam jako v původním pluginu, v souboru plugins\resources_plus.ini, bez pádu při ukončení.
resources_plus.save_warning = Změny se do plugins\resources_plus.ini zapíší až při uložení. Odebrání suroviny, kterou už uložená hra používá, může tuto hru poškodit.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Vlastní potřeby občanů s Needs Plus: stejný seznam jako v původním pluginu, v souboru needs_plus.ini ve složce plugins, převzatý při prvním spuštění z needs.ini.
needs_plus.save_warning = Změny se do needs_plus.ini ve složce plugins zapíší až při uložení. Každá potřeba přidává do příslušných obchodů skladovou položku, která je součástí uložené hry. Nejprve vše vyzkoušejte na kopii.
tab.resources.editor = Suroviny
group.resource_definitions = Definice surovin
detail.transport = Přepravní třída
detail.transport.description = Určuje, která vozidla a sklady surovinu přepravují a skladují. Stačí vybrat název; plugin doplní hodnoty základní hry pro danou třídu.
detail.kind = Cenová kategorie
detail.kind.description = 0 suroviny, 1 výrobky, 2 potraviny/oděvy, 3 pokročilé materiály, 4 elektronika.
detail.record_price = Počáteční cena v záznamu
detail.record_price.description = Volitelné počáteční hodnoty v RUB a USD v záznamu suroviny.
detail.record_base_price = Počáteční základní cena v záznamu
detail.record_base_price.description = Volitelné základní hodnoty v RUB a USD v záznamu suroviny.
detail.trade_mult = Obchodní násobitele
detail.trade_mult.description = Násobitele prodeje a nákupu, obvykle 0.95 a 1.05.
detail.market_rub = Tržní blok RUB
detail.market_usd = Tržní blok USD
detail.market.description = Dvě tržní hodnoty a volitelný koeficient.\n(Viz popis v souboru INI)
detail.packed = Balený náklad
detail.packed.description = Automatické zobrazení nákladu, nebalený nebo balený náklad.
detail.family = Skupina materiálu
detail.family.description = Určuje vzhled materiálu na hromadě na staveništi a pravděpodobně také to, jaký odpad z něj vznikne. Každá skupina obsahuje jednu odpadní surovinu. Čísla 10 až 19 ze souboru INI se zobrazují názvem.
detail.cargo = Geometrie nákladu
detail.cargo.description = Výběr geometrie pro zobrazení nákladu.
detail.pinned_base_price = Pevná základní cena
detail.pinned_base_price.description = Volitelná hodnota v RUB a USD v sekci [base_price]. Prázdné pole znamená žádný vlastní záznam.
detail.forced_price = Vynucená výsledná cena
detail.forced_price.description = Volitelná hodnota v RUB a USD v sekci [price]. Prázdné pole znamená, že cenu vypočítá hra.

; --- Místní schémata pro nainstalované původní pluginy (od 0.13.0) ---
daynight.description = Jeden východ a jeden západ slunce za kalendářní den. V základní hře trvá přechod ze dne na noc a zpět 13 kalendářních dnů, tedy téměř dva týdny. S tímto pluginem se vejde do jednoho dne.
daynight.group.cycle = Den a noc
daynight.group.cycle.description = Délka cyklu dne a noci a okamžik příchodu noci.
daynight.group.pace = Rychlost
daynight.group.pace.description = Dvě samostatná nastavení: jedno pro vozidla, druhé pro vše ostatní. Platí vždy bez ohledu na výše uvedená nastavení.
daynight.group.diagnostics = Řešení problémů
daynight.enabled.label = Plugin zapnut
daynight.enabled.description = ON zapne nastavený cyklus dne a noci.
daynight.cycle_days.label = Kalendářních dnů na cyklus dne a noci
daynight.cycle_days.description = Počet kalendářních dnů od jednoho východu slunce k dalšímu.\n1 = jeden východ a jeden západ slunce každý den\n2 až 12 = odpovídajícím způsobem delší cyklus\n13 = cyklus základní hry
daynight.day_scale.label = Délka dne (kolikrát pomaleji běží kalendář)
daynight.day_scale.description = Kolikrát déle trvá kalendářní den oproti základní hře.\nauto = automaticky zpomalit kalendář podle světelného cyklu; doporučeno\n1 = nezpomalovat kalendář; den a noc se pak střídají 13krát rychleji\n2 až 100 = zpomalit kalendář tímto násobkem\nV nastavení „Co zpomalit“ vyberte, které části hry se zpomalí.
daynight.slow.label = Co zpomalit
daynight.slow.description = Určuje, které části hry se zpomalí.\ncalendar = zpomalit pouze kalendář; doporučeno\nworld = zpomalit vše včetně občanů a vozidel; vysoké hodnoty připomínají zpomalený záběr\nnone = nic nezpomalovat\nPři volbě calendar si občané, vozidla, výstavba a výroba zachovají běžnou rychlost. Denní procesy, například znečištění, půjčky a zprávy, si zachovají obvyklý interval.
daynight.offset.label = Kdy přichází noc
daynight.offset.description = Posouvá noc v rámci kalendářního dne.\n0 = tma začíná krátce po polovině dne\n0.5 = tma začíná při změně data\nPři jiné hodnotě než 0 už 13denní cyklus neodpovídá přesně základní hře.
daynight.fade.label = Přizpůsobit světelné přechody
daynight.fade.description = ON zkrátí přechody mezi ránem, dnem, večerem a nocí podle nastaveného cyklu.\nOFF použije pomalé přechody základní hry. Při krátkých cyklech se mohou překrývat a způsobit nevýrazné osvětlení.
daynight.vehicle_scale.label = Rychlost vozidel
daynight.vehicle_scale.description = Rychlost nákladních aut, vlaků, lodí a letadel. Funguje nezávisle na ostatních nastaveních.\n1 = rychlost základní hry\n2 = poloviční rychlost\n0.5 = dvojnásobná rychlost\nVyšší hodnota = pomalejší vozidla
daynight.sim_scale.label = Rychlost všeho ostatního
daynight.sim_scale.description = Rychlost občanů, výstavby, výroby, opotřebení a animací.\n1 = rychlost základní hry\n2 = poloviční rychlost\n0.5 = dvojnásobná rychlost\nVyšší hodnota = pomalejší simulace
daynight.probe.label = Zapisovat délku dnů do protokolu
daynight.probe.description = ON zapisuje skutečné trvání každého kalendářního dne a světelného přechodu do tesmioloader.log. Používejte pouze při řešení problémů a kontrolách po aktualizaci hry.
walking.description = Jak daleko občané chodí pěšky a jak daleko majitelé aut jezdí mezi domovem, prací a parkovištěm.
walking.group.distances = Vzdálenosti
walking.group.distances.description = Měřeno po silnicích a chodnících, nikoli vzdušnou čarou. Budova vzdálená 400 m přes řeku může znamenat pěší cestu dlouhou 1200 m.
walking.group.diagnostics = Řešení problémů
walking.enabled.label = Plugin zapnut
walking.enabled.description = ON zapne nastavené vzdálenosti pro chůzi a jízdu.
walking.distance.label = Docházková vzdálenost (m)
walking.distance.description = Nejdelší trasa, kterou občan ujde pěšky. Základní hra používá 480 m.\nVyšší hodnota = více budov v pěší vzdálenosti a více propojení vytvářených při výstavbě\n0 = bez omezení; výstavba pak může ve velkém městě trvat několik sekund\n20000 = nejvyšší povolená hodnota
walking.car_distance.label = Dojezdová vzdálenost majitelů aut (m)
walking.car_distance.description = Nejdelší povolená jízda mezi domovem, prací a parkovištěm. Základní hra používá 2500 m.\nVyšší hodnota = majitelé aut dojedou dál\nNastavte více než docházkovou vzdálenost. Při stejných hodnotách auto neposkytuje výhodu většího dosahu.
walking.regen_on_load.label = Obnovit propojení při načtení uložené hry
walking.regen_on_load.description = Pěší a parkovací propojení jsou součástí uložené hry.\nON při načtení hry obnoví všechna propojení, takže nastavené vzdálenosti ovlivní i existující města.\nOFF použije nastavené vzdálenosti pouze u nově postavených budov.
walking.probe.label = Zapisovat kontrolní hodnoty do protokolu
walking.probe.description = ON zapisuje hodnoty nalezené ve hře před jejich změnou pluginem do tesmioloader.log. Používejte pouze při řešení problémů a kontrolách po aktualizaci hry.
accumulator.description = Baterie pro vaši elektrickou síť. Budova s velkým zásobníkem energie se nabíjí při přebytku elektřiny a při jejím nedostatku ji vrací do sítě.
accumulator.group.battery = Baterie
accumulator.group.battery.description = Které budovy se považují za baterie a jak rychle se nabíjejí a vybíjejí.
accumulator.group.window = Okno budovy
accumulator.group.grid = Elektrická síť
accumulator.group.diagnostics = Řešení problémů
accumulator.enabled.label = Plugin zapnut
accumulator.enabled.description = ON zapne nabíjení a vybíjení bateriových budov.\nOFF zastaví vybíjení. Budovy zůstanou zachovány a mohou se dál nabíjet.
accumulator.building_types.label = Typy budov
accumulator.building_types.description = Typy budov, které mohou fungovat jako baterie. Více čísel oddělte čárkami.\n19 = transformátor\n18 = rozvodna\nNepoužívejte 17: elektrárna nemůže přijímat elektřinu a nikdy by se nenabila.
accumulator.min_capacity.label = Minimální kapacita pro použití jako baterie
accumulator.min_capacity.description = Minimální kapacita zásobníku, aby byla budova považována za baterii. Vylučuje malé zásobníky běžných rozvoden.\nVyšší hodnota = méně budov se považuje za baterie\nNižší hodnota = více budov se považuje za baterie\nPřiložený „Stationary Accumulator“ má kapacitu 5000.
accumulator.charge_rate.label = Rychlost nabíjení (výkon za sekundu)
accumulator.charge_rate.description = Maximální množství elektřiny, které baterie přijme za sekundu. Limit brání prázdné baterii odebrat elektřinu celému městu.\nVyšší hodnota = rychlejší nabíjení a větší zatížení sítě\nNižší hodnota = pomalejší nabíjení a menší zatížení\nPro srovnání: uhelná elektrárna dodává 70 a větrná turbína 15.
accumulator.discharge_rate.label = Rychlost vybíjení (výkon za sekundu)
accumulator.discharge_rate.description = Maximální množství elektřiny, které baterie dodá za sekundu. Dodává ji pouze při nedostatku v síti.\nVyšší hodnota = pokrytí větších výpadků výkonu\nNižší hodnota = uložená energie vydrží déle\nPříklad: při hodnotě 60 nahradí plná baterie s kapacitou 5000 elektrárnu na něco přes 80 sekund.
accumulator.panel.label = Řádek se stavem nabití v okně baterie
accumulator.panel.description = ON přidá do okna baterie stav nabití, například „Nabiti: 4210.5 / 5000 (84.2 %)“.
accumulator.panel_caption.label = Popisek tohoto řádku
accumulator.panel_caption.description = Slovo před stavem nabití. Pouze písmena bez diakritiky a zvláštních znaků, jinak hra zobrazí nesmyslné znaky.
accumulator.gauges.label = Vypočítávat ukazatele v okně podle baterie
accumulator.gauges.description = ON nahradí nesprávné údaje hry skutečným přítokem a odtokem elektřiny z baterie.\nOFF použije běžné údaje hry. Při nabíjení baterie mohou ukazovat výkon 0 a hlášení „bez dodávky elektřiny“.
accumulator.spread_voltage.label = Experiment: předávat napětí sousedům (ponechte vypnuté)
accumulator.spread_voltage.description = ON nemá žádný účinek. Tato stará funkce byla technicky nahrazena. Ponechte OFF.
accumulator.trace.label = Zapisovat sousedy první baterie
accumulator.trace.description = ON zapisuje do protokolu množství elektřiny přijímané budovami sousedícími s první baterií. Pouze pro řešení problémů; může snižovat výkon.
accumulator.log_seconds.label = Sekund mezi záznamy o baterii
accumulator.log_seconds.description = Interval mezi zprávami o stavu baterie v tesmioloader.log. Každá zpráva obsahuje stav nabití, přítok a odtok.\n0 = žádné zprávy o stavu\nVyšší hodnota = méně častý zápis
accumulator.probe.label = Sekund mezi seznamy budov v protokolu
accumulator.probe.description = Interval mezi seznamy všech budov se zásobníkem elektřiny v tesmioloader.log. Používejte pouze tehdy, když baterie není rozpoznána, nebo po aktualizaci hry.\n0 = tyto seznamy nezapisovat\nVyšší hodnota = méně častý zápis
cities.description = Velikost a tvar každého města. V základní hře je každé město kruh s poloměrem 1000 m. S tímto pluginem nastavíte poloměr každého města zvlášť, případně i čtvercový tvar, přímo v okně města. Hodnoty jsou součástí uložené hry.
cities.group.cities = Města
cities.group.slider = Posuvník poloměru
cities.group.slider.description = Rozsah posuvníku v okně města a velikost změny při jednom kliknutí na + nebo -.
cities.group.layout = Rozložení v okně města
cities.group.layout.description = Umístění dvou nových řádků v okně města. Čísla udávají pozice ve vlastních jednotkách herního okna; okno je široké přibližně 500.
cities.group.overlay = Bodová síť na zemi
cities.group.diagnostics = Řešení problémů
cities.enabled.label = Plugin zapnut
cities.enabled.description = ON zapne vlastní velikosti a tvary měst.
cities.window.label = Posuvník poloměru a volba tvaru v okně města
cities.window.description = ON zobrazí v okně města posuvník poloměru a zaškrtávací políčko pro čtvercový tvar.\nOFF obojí skryje; nastavené hodnoty zůstanou zachovány, ale už je nelze měnit.
cities.adopt.label = Založit vlastní město pro nezařazené budovy
cities.adopt.description = Při zmenšení města mohou některé budovy zůstat mimo jeho hranice a přestat patřit k jakémukoli městu.\nON pro ně založí nové město s náhodným názvem a dnešním datem, stejně jako to dělá samotná hra.\nOFF je ponechá bez města; chování hry v takovém případě nebylo otestováno.
cities.radius.label = Výchozí poloměr (m)
cities.radius.description = Výchozí poloměr měst, která nemají vlastní nastavení. Hodnota platí na každé mapě.\n1000 = poloměr základní hry\nVyšší hodnota = větší města\nNižší hodnota = menší města
cities.square.label = Výchozí čtvercový tvar
cities.square.description = ON dá čtvercový tvar městům, která nemají vlastní nastavení.\nOFF použije kruh jako v základní hře.
cities.radius_min.label = Nejmenší poloměr na posuvníku (m)
cities.radius_min.description = Hodnota na levém konci posuvníku.
cities.radius_max.label = Největší poloměr na posuvníku (m)
cities.radius_max.description = Hodnota na pravém konci posuvníku. Posuvník má 100 kroků; při rozsahu 200 až 5000 odpovídá jeden krok 48 m.
cities.step.label = Procent na kliknutí tlačítkem
cities.step.description = Procento rozsahu posuvníku, o které se hodnota změní jedním kliknutím na + nebo -. Neplatí při tažení posuvníku.\nVyšší hodnota = větší změna na kliknutí\nNižší hodnota = jemnější změna na kliknutí
cities.label_x.label = Pozice popisku
cities.label_x.description = Vzdálenost popisku od levého okraje okna.
cities.widget_x.label = Pozice ovládacích prvků
cities.widget_x.description = Vzdálenost posuvníku a políčka od levého okraje okna. Posuvník potřebuje přibližně 225.
cities.checkbox_dy.label = Posunout řádek s políčkem nahoru nebo dolů
cities.checkbox_dy.description = Posune zaškrtávací políčko nahoru nebo dolů, aby se nepřekrývalo s posuvníkem.\nVyšší hodnota = políčko níže\nNižší hodnota = políčko výše
cities.overlay.label = Přizpůsobit překryv poloměru a tvaru
cities.overlay.description = Při otevřeném okně města hra zobrazuje na zemi modrou bodovou síť, ale vždy jen jako kruh o poloměru 1000 m.\nON přizpůsobí síť vašemu poloměru a tvaru.\nOFF ji ponechá jako v základní hře.
cities.overlay_step.label = Rozestup bodů překryvné sítě (m)
cities.overlay_step.description = Vzdálenost mezi body znázorňujícími hranice města.\n0 = automaticky použít jednu dvacetinu poloměru, nejméně 50 m\nNižší hodnota = hustší zobrazení a vyšší nároky na výkon
cities.probe.label = Zapisovat města do protokolu
cities.probe.description = ON po načtení zapisuje poloměr, tvar a počet budov každého města do tesmioloader.log. Další zprávy se zapisují při otevřeném okně města. Pouze pro řešení problémů; protokol může rychle růst.
depletion.description = Ložiska se vyčerpávají. Pracující důl viditelně odtěžuje ložisko z mapy a čím méně ho zbývá, tím méně produkuje. Vytěžené množství je součástí uložené hry; pokud plugin později vypnete, vytěžené suroviny se nevrátí. Nejprve vše vyzkoušejte na kopii uložené hry.
depletion.group.depletion = Těžba
depletion.group.window = Okno dolu
depletion.group.diagnostics = Řešení problémů
depletion.enabled.label = Plugin zapnut
depletion.enabled.description = ON umožní vyčerpávání vybraných ložisek těžbou.\nOFF zastaví další vyčerpávání. Již odebrané suroviny se neobnoví.
depletion.tonnes_per_texel.label = Tun na bod mapy
depletion.tonnes_per_texel.description = Počet tun, které může důl vytěžit ze zcela plného bodu mapy surovin. Slabší body poskytují úměrně méně.\nVyšší hodnota = ložiska vydrží déle\nNižší hodnota = ložiska se vyčerpají dříve\nPro srovnání: důl s vyhledávacím poloměrem 210 m pokrývá několik tisíc bodů mapy.
depletion.vanilla.label = Vyčerpatelná ložiska základní hry
depletion.vanilla.description = Ložiska základní hry, která se mohou vyčerpat. Více hodnot oddělte čárkami.\noil, iron, coal, uranium, bauxite, gravel = pouze uvedená ložiska\nall = všechna ložiska\nnone = žádné ložisko základní hry\nname:value = vlastní počet tun na bod mapy, například iron:3000\nLožiska z deposits.ini jsou zahrnuta vždy.\ngravel trvale odstraňuje viditelnou texturu terénu a kvůli malé oblasti hledání potřebuje mnohem vyšší hodnotu. Pokud gravel vynecháte, zůstane jako v základní hře.
depletion.flush_seconds.label = Sekund do uložení těžby
depletion.flush_seconds.description = Počet sekund mezi aktualizacemi mapy surovin. Produkce a kvalita se mění okamžitě; pouze minimapa a uložená hra se aktualizují v tomto intervalu.\nNižší hodnota = častější aktualizace a vyšší nároky na výkon\nNeaktualizujte častěji než čtyřikrát za sekundu.
depletion.panel.label = Řádek se zbývajícím ložiskem v okně dolu
depletion.panel.description = ON zobrazí v okně dolu zbývající zásoby a okno mírně zvýší, například „Zbyva: 251.4 kt / 259.3 kt (96.9 %)“.
depletion.panel_caption.label = Popisek tohoto řádku
depletion.panel_caption.description = Slovo před zbývajícím množstvím. Pouze písmena bez diakritiky a zvláštních znaků, jinak hra zobrazí nesmyslné znaky.
depletion.log_seconds.label = Interval průběžných záznamů (sekundy)
depletion.log_seconds.description = Počet sekund mezi zprávami o stavu dolu v tesmioloader.log. Každá zpráva obsahuje zbývající množství, celkové množství a kvalitu.\n0 = žádné zprávy o stavu\nVyšší hodnota = méně častý zápis\nVhodný počet tun na bod mapy určete pozorováním během několika herních dnů.
easystart.description = Potřeby občanů přicházejí postupně v průběhu let. Dosud neodemčená potřeba neovlivňuje spokojenost ani zdraví; občané příslušná místa dál navštěvují a nakupují, pouze následky se projeví až od stanoveného roku.
easystart.group.general = Co odložit
easystart.group.unlock = Roky odemčení
easystart.group.unlock.description = Rok, od jehož 1. ledna začne požadavek platit. Harmonogram je navržen pro republiku založenou v roce 1920. Při začátku v roce 1960 už přednastavené roky uplynuly.\noff = neodkládat; chování základní hry\nalways = uplatňovat od prvního herního dne\nRok = odemknout v daném roce
easystart.group.diagnostics = Řešení problémů
easystart.enabled.label = Plugin zapnut
easystart.enabled.description = ON odemyká potřeby a požadavky na sítě podle nastaveného harmonogramu.
easystart.demands.label = Odložit devět potřeb občanů
easystart.demands.description = ON odloží požadavky na potraviny, maso, oděvy, elektroniku, alkohol, náboženství, kulturu, sport a zdraví do nastavených roků odemčení.
easystart.utilities.label = Odložit tři požadavky budov na sítě
easystart.utilities.description = ON odloží požadavky na elektřinu, vodu a vytápění do nastavených roků odemčení.
easystart.warnings.label = Odložit varování v okně budovy
easystart.warnings.description = ON skryje související varování až do roku odemčení, například „budova bez dodávky elektřiny“.
easystart.pin_status.label = Udržovat spokojenost u uzamčených potřeb
easystart.pin_status.description = ON udržuje uspokojení uzamčené potřeby na níže uvedené hodnotě.\nOFF nechá uspokojení dál klesat; při odemčení potřeby už může být velmi nízké.
easystart.locked_status.label = Spokojenost během uzamčení
easystart.locked_status.description = Uspokojení potřeby během jejího uzamčení. U potravin jde o sytost.\n1.0 = plně uspokojený nebo nasycený\n0.5 = střední hodnota se znatelným zlepšením po odemčení
easystart.clear_unsatisfied.label = Vyřadit uzamčené potřeby ze seznamu neuspokojených
easystart.clear_unsatisfied.description = ON zabrání tomu, aby uzamčené potřeby vyvolávaly zprávu „N občanů nemohlo získat X“.
easystart.probe.label = Zapisovat odemčení do protokolu
easystart.probe.description = ON při každé změně roku zapisuje potřeby, které zůstávají uzamčené, do tesmioloader.log. Jednou také zaznamená prvního dotčeného občana. Pouze pro řešení problémů.
easystart.food.label = Potraviny
easystart.religion.label = Náboženství
easystart.meat.label = Maso
easystart.clothes.label = Oděvy
easystart.alcohol.label = Alkohol
easystart.sport.label = Sport
easystart.culture.label = Kultura
easystart.health.label = Zdraví
easystart.electricity.label = Elektřina
easystart.water.label = Voda (zahrnuje kanalizaci)
easystart.heating.label = Vytápění
easystart.electronics.label = Elektronika
easystart.school.label = Škola
easystart.school.description = Před tímto rokem se děti učí bez školy, stejně jako při nastavení vzdělávání „Jednoduché“, a zpráva „N dětí nemůže chodit do školy“ se nezobrazuje.
easystart.kindergarten.label = Mateřská škola
easystart.kindergarten.description = Před tímto rokem nemusí žádný rodič zůstávat doma s dítětem mladším šesti let a zpráva „N pracovníků nemůže pracovat, protože všechny mateřské školy …“ se nezobrazuje.
plugin.needs = Needs
plugin.needs.description = Správa dodatečných potřeb občanů a přepínačů pluginu bez úprav původního souboru.
tab.needs.editor = Potřeby
group.needs = Potřeby občanů
group.needs.plugin = Nastavení pluginu
group.needs.plugin.description = Přepínače platné pro všechny potřeby.
needs.list = Seznam potřeb
needs.add = Přidat potřebu
needs.select_help = Vyberte potřebu vlevo nebo pomocí + přidejte surovinu registrovanou pluginem Resources.
needs.resource = Surovina
needs.resource.help = Surovina, kterou mají občané požadovat. Musí být registrována v seznamu pluginu Resources.
needs.donor = Vzorová potřeba
needs.donor.description = Existující potřeba použitá jako vzor.\nfood nebo meat = pro prodejny potravin\nclothes nebo eletronics = pro obchodní domy\nalcohol = pro prodejny alkoholu\neletronics je zápis používaný hrou.
needs.factor = Násobitel množství
needs.factor.description = Množství zboží vzhledem ke vzorové potřebě.\n1.0 = stejné množství jako u vzoru\nVyšší hodnota = občané potřebují více\nNižší hodnota = občané potřebují méně
needs.category = Kategorie obchodů
needs.category.description = Obchody, které mají zboží skladovat.\nauto = stejné obchody jako u vzorové potřeby\nnone = žádná automatická skladová položka; budova musí zboží poskytovat sama\nbasic = pouze základní obchody\nmedium = pouze střední obchody\nadvanced = pouze velké obchody\nmediumadvanced = pouze střední a velké obchody\nhotel = pouze hotely\nČíslo = zapsat přímo tuto hodnotu obchodu; pouze pro uživatele obeznámené s herními soubory
needs.chance = Pravděpodobnost
needs.chance.description = Pravděpodobnost od 0 do 1, že občan tuto potřebu získá. Při hodnotě menší než 1 se přiděluje nezávisle na vzorové potřebě.\n0 = nezíská ji žádný občan\n1 = získá ji každý vhodný občan
needs.unhappy = Nespokojenost
needs.unhappy.description = Ztráta spokojenosti, když občan nemůže získat zboží.\n0 = žádná ztráta; potřeba se pouze zobrazuje\n0.005 až 0.02 = obvyklý rozsah pro zboží zvyšující pohodlí\nPovolený rozsah: 0 až 1
needs.enabled = Plugin zapnut
needs.enabled.description = ON zapne plugin.\nOFF jej při příštím spuštění hry zcela vypne.
needs.demand = Přidělovat potřeby
needs.demand.description = ON přidělí občanům novou potřebu.\nOFF potřebu nepřiděluje, ale stále může přidávat zboží do obchodů.
needs.storage = Zásobovat obchody
needs.storage.description = ON přidá zboží do vybraných obchodů.\nOFF nepřidává skladové položky; občané pak zboží najdou pouze v budovách, které je poskytují samy.
needs.max_demands = Potřeb na občana
needs.max_demands.description = Maximální počet dodatečných potřeb, které může mít občan současně.\n1 = nejvýše jedna dodatečná potřeba\n7 = nejvyšší povolený počet
needs.when_full = Při dosažení limitu potřeb
needs.when_full.description = Co se stane, když občan již má maximální počet dodatečných potřeb.\nskip = počkat, až se uvolní místo\nreplace = tentokrát nahradit vzorovou potřebu
needs.probe = Podrobný protokol
needs.probe.description = ON zapisuje seznamy potřeb občanů a informace o každém obchodě do podrobného protokolu pluginu.\nOFF zapisuje pouze varování. Dočasně zapněte při kontrole nových obchodů.
needs.log_seconds = Interval průběžných zpráv (sekundy)
needs.log_seconds.description = Počet sekund mezi zprávami o počtu přidělených potřeb.\n0 = tyto zprávy vypnout\nVyšší hodnota = méně častý zápis
tab.needs.general = Obecné
plugin.deposits = Deposits
plugin.deposits.description = Správa typů ložisek, které základní hra neobsahuje, a přepínačů pluginu bez úprav původního souboru.
tab.deposits.general = Obecné
tab.deposits.editor = Ložiska
group.deposits = Ložiska
group.deposits.description = Původní ložiska jsou chráněna a lze je skrýt; vlastní ložiska se ukládají odděleně a slučují do výsledného deposits.ini. Každá sekce kromě [deposits] představuje jedno ložisko.
group.deposits.plugin = Nastavení pluginu
group.deposits.plugin.description = Tři subsystémy v sekci [deposits]. Pokud je zde příslušný přepínač vypnutý, je daný subsystém vypnutý pro všechna ložiska.
deposits.notice = Číslo typu ložiska, jeho kanál mapy a token v building.ini jsou součástí uložené hry, jakmile je začne používat důl. Odebrání nebo přečíslování používaného ložiska může uloženou hru znepřístupnit; nejprve vše vyzkoušejte na kopii.
deposits.list = Seznam ložisek
deposits.add = Přidat ložisko
deposits.select_help = Vyberte ložisko vlevo nebo pomocí + přidejte ložisko pro surovinu registrovanou pluginem Resources.
deposits.name = Ložisko
deposits.name.help = Název sekce v deposits.ini. Označuje ložisko v protokolu a ve štětci editoru; později jej nelze přejmenovat.
deposits.new_name = Název ložiska
deposits.new_hint = Zde se zadávají pouze základní nastavení. Vše ostatní (složka mapy, typ budovy, vyčerpávání) najdete po přidání v nastavení vpravo.
deposits.code_patch = Úprava kódu
deposits.code_patch.description = ON zavede do hry nastavené typy ložisek $TYPE_MINE_, aby je doly mohly najít prostřednictvím building.ini. Pokud očekávaná herní data po aktualizaci neodpovídají, plugin nic nezmění.
deposits.minimap_all = Vrstvy minimapy
deposits.minimap_all.description = ON zobrazí pod pěti herními tlačítky minimapy tlačítko pro každé jednotlivě zapnuté ložisko pluginu.\nOFF skryje všechna tlačítka ložisek pluginu.
deposits.editor_all = Štětce editoru terénu
deposits.editor_all.description = ON zobrazí na kartě Suroviny v editoru terénu malovací a mazací štětec pro každé ložisko s názvem štětce.\nOFF skryje všechny štětce ložisek pluginu.
deposits.token = Token budovy
deposits.token.description = Token, kterým důl v building.ini používá toto ložisko, například $TYPE_MINE_COPPER. Zadávejte jej stejně jako $TYPE_MINE_GRAVEL. Nikdy nepoužívejte dva tokeny ložisek v jednom building.ini.
deposits.type = Číslo typu
deposits.type.description = Jedinečné číslo typu ložiska. Dvě ložiska nesmějí používat stejné číslo.\n10 až 127 = povolený rozsah\n0 až 9 = vyhrazeno pro základní hru\nDialog automaticky navrhne další volné číslo.
deposits.map = Mapa
deposits.map.description = Mapa, na které je ložisko uloženo.\nauto = automaticky vybrat volnou pozici na mapě pluginu; doporučeno\nresourcemap nebo resourcemap2 = použít mapy základní hry\nresourcemap3 až resourcemap10 = použít dodatečné mapy pluginu\nterrain = přímo použít namalovaný terén, například pro štěrk; štětec se zobrazí pod ROCKS
deposits.component = Složka mapy
deposits.component.description = Každá mapa má čtyři pozice od 0 do 3. Každá může obsahovat jedno ložisko.\nPři auto = ponechte pole prázdné; plugin vybere volnou pozici\nPři terrain: 2 = vrstva štěrku\nPři terrain: 3 = vrstva oázy
deposits.building_type = Typ budovy
deposits.building_type.description = Typ budovy, která může těžit toto ložisko.\n7 = důl; správně pro téměř každé ložisko\n92 = studna\nPrázdné pole = 7
deposits.radius = Vyhledávací poloměr
deposits.radius.description = Jak daleko důl hledá své ložisko.\noil, ore, bauxite, gravel, wood, water, watersurface = použít odpovídající herní konstantu\nČíslo = použít přímo tuto vzdálenost\nPrázdné pole = použít ore\nBez poloměru důl žádné ložisko nenajde.
deposits.icon = Ikona minimapy
deposits.icon.description = Surovina, jejíž ikona se zobrazí na tlačítku minimapy. Plugin použije ikonu již načtenou hrou; samostatný obrázek není potřeba.\nSuroviny z pluginu Resources v něm musí být registrovány.\nPrázdné pole = bez ikony
deposits.minimap = Tlačítko minimapy
deposits.minimap.description = ON přidá pro toto ložisko tlačítko minimapy a překryvnou vrstvu.
deposits.editor = Název štětce editoru
deposits.editor.description = Název malovacího a mazacího štětce v editoru terénu. Stejný název se používá v tool_paint_<name>.png a tool_erase_<name>.png ve vfs\media_soviet\editor.\nPrázdné pole = nevytvářet štětec\nPovoleno: nejvýše 31 písmen, číslic, _ a -
deposits.deplete = Vyčerpávání na texel
deposits.deplete.description = Toto nastavení čte plugin Depletion. Určuje počet tun, které může důl vytěžit ze zcela plného bodu mapy surovin. Slabší body poskytují úměrně méně.\nHodnota má přednost před tonnes_per_texel v plugins\depletion.ini.\n0 = toto ložisko zůstane neomezené\nPrázdné pole = použít globální hodnotu
deposits.save_warning = Změny se do výsledného deposits.ini zapíší až při uložení. Čísla typů, kanály map a tokeny ložisek, která již uložená hra používá, se nesmějí měnit; nejprve vše vyzkoušejte na kopii.
depletion.tab.general = Obecné
depletion.tab.mining = Těžba
needs.save_warning = Změny se do výsledného needs.ini zapíší až při uložení. Každá potřeba přidává do příslušných obchodů skladovou položku, která je součástí uložené hry. Nejprve vše vyzkoušejte na kopii.
bp.name = Buildings Plus
bp.description = Nové budovy podle definice: vzorová budova ze hry a řádky building.ini, které se liší. Při každém spuštění hry se zapisují jako úplné položky Workshopu.
bp.notice = Každá budova se vytvoří jako složka v media_soviet\workshop_wip s vlastním ID Workshopu. Pokud ID ponecháte prázdné, plugin při spuštění hry přidělí další volné číslo od 9300000000 a uloží je do plugins\buildings_plus.ids.ini. Hra načítá složku jako nepublikovanou položku Workshopu. Změny vyžadují úplný restart. Uložená hra obsahující takovou budovu potřebuje při načítání její složku.
bp.tab.general = Obecné
bp.tab.buildings = Budovy
bp.tab.generated = Vygenerované budovy
bp.wip = Vygenerované budovy ve složce hry
bp.wip.description = Zobrazuje budovy, které Buildings Plus nebo původní plugin buildings vygeneroval do media_soviet\workshop_wip. Zobrazené údaje se načítají ze složek.
bp.wip.empty = Zatím zde není žádná vygenerovaná budova. Budovy se generují při spuštění hry, pokud je některá zapnutá.
bp.group = Budovy
bp.group.notice = Zdejší budova je kopií herní budovy s jinými řádky: stejný model, stejná připojení, vaše výrobní receptura. Vyberte vzor stejného druhu (důl pro důl, továrnu pro továrnu).
bp.list = Budovy
bp.add = Přidat
bp.select_help = Vyberte budovu vlevo nebo pomocí + přidejte novou. Nejprve se vybírá vzor, ID Workshopu může zůstat prázdné; název a řádky následují vpravo.
bp.id = Název objektu
bp.id.help = Určuje název složky a objektu vygenerované budovy a zobrazuje se v protokolu. Pouze písmena, číslice, _ a -, nejvýše 64 znaků; později jej nelze změnit.
bp.save_warning = Změny se do výsledného buildings_plus.ini zapíší až při uložení a projeví se po úplném restartu hry. Plugin poté zapíše složku do media_soviet\workshop_wip; sekce s chybou se přeskočí a její název se uvede v protokolu.
bp.list.note = Nejvýše 256 budov.
bp.new_name = Název objektu
bp.new_hint = Mezery se změní na podtržítka a velká písmena na malá.
bp.card.folders = Vygenerované složky
bp.card.log = Řešení problémů
bp.card.new = Nová budova
bp.links = Návody
bp.link.readme = README (návod)
bp.prune = Vyčistit složky
bp.prune.description = ON při příštím spuštění hry odstraní vygenerovanou složku budovy, kterou jste smazali nebo vypnuli (pouze složky vytvořené tímto pluginem).\nOFF tyto složky ponechá; hra bude dané budovy dál načítat.
bp.always = Vždy přepisovat
bp.always.description = ON zapisuje všechny složky budov při každém spuštění hry.\nOFF zapíše složku pouze při změně její sekce, pluginu nebo souboru vzoru. Ponechte OFF.
bp.verbose = Podrobný protokol
bp.verbose.description = ON zapisuje každý zkopírovaný soubor a každý odstraněný řádek vzoru do logs\tesmioloader.buildings_plus.log.\nOFF zapisuje pouze výsledky, varování a chyby.
bp.repair_owner_ids = Doplnit ID vlastníka
bp.repair_owner_ids.description = ON doplní vaše Steam ID do vygenerovaných budov, které je nemají, včetně budov z jiných generátorů. Bez něj se hra při každém načtení uložené hry s takovou budovou ptá na chybějící položky Workshopu.\nOFF ponechá složky ostatních generátorů beze změny.
bp.card.saves = Uložené hry
bp.card.saves.description = Uložená hra si pamatuje sklady každé postavené budovy. Takto se nový řádek skladu u některé z vašich budov může projevit i u již postavených budov.
bp.retrofit = Průběžně aktualizovat sklady již postavených budov
bp.retrofit.description = ON: při načtení uložené hry získá každá dokončená vygenerovaná budova prázdné sklady pro jednotlivé suroviny, které jste přidali do její sekce. Při změně velikosti v řádku skladu se změní i sklad; zmenšení počká, až se zásoby vejdou. Sklad, jehož řádek jste odstranili, z budov opět zmizí, jakmile se vyprázdní.\nOFF: sklady již postavených budov zůstanou stejné; nové a změněné řádky se projeví pouze u budov postavených později.
bp.enabled = Budova zapnuta
bp.enabled.description = ON vygeneruje tuto budovu při příštím spuštění hry.\nOFF ji nevygeneruje. Pokud je zapnuto „Vyčistit složky“, její existující složka se při příštím spuštění odstraní.
bp.item_id = ID Workshopu
bp.item_id.description = Lze zadat vlastní číslo: 9000000000 až 9999999999, kromě 9100000000 až 9199999999 (vyhrazeno pro jiné generátory)\nUrčuje název složky v workshop_wip ve složce hry a později by se nemělo měnit.
bp.donor = Vzorová budova
bp.donor.description = Budova, ze které kopie vychází; budovu z Workshopu musíte mít přihlášenou k odběru.\nPomocí „Vybrat vzor...“ procházejte dostupné budovy. Dodržte druh: důl pro důl, továrnu pro továrnu, obchod pro obchod.
bp.item_name = Název ve hře
bp.item_name.description = Název zobrazovaný ve hře.\nHodnota s tečkami se považuje za překladový klíč a vyhodnocuje se prostřednictvím pluginu Localization, například: localization.lang.salt_mine
bp.desc = Popis
bp.desc.description = Popis položky Workshopu, jeden řádek na řádek pole. Bez uvozovek.
bp.line = Řádky building.ini
bp.line.description = Jeden řádek building.ini na řádek pole, například $PRODUCTION raw_salt 1.0. Pomocí „Vybrat řádek…“ převezměte řádek ze vzorové budovy a upravte jej. Vaše řádky se vloží před řádky vzoru a nahradí: stejný token; všechny $TYPE_*; všechny $STORAGE* společně s $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION a $CONSUMPTION_PER_SECOND jako jednu recepturu. Vše ostatní ze vzoru zůstává.\nU vlastních surovin vždy používejte $STORAGE_IMPORT_SPECIAL nebo $STORAGE_EXPORT_SPECIAL s uvedením suroviny, jinak sklad zobrazí všechny suroviny dané přepravní třídy.
bp.strip = Odstranit řádky vzoru
bp.cmd_add = Připojit
bp.cmd_add.description = Jeden příkaz na řádek: nový řádek vložený před závěrečné ukončení souboru vzoru. Víceřádkový blok zapisujte s | mezi řádky.
bp.cmd_replace = Nahradit
bp.cmd_replace.description = Jeden příkaz na řádek: původní řádek | nový řádek. Původní řádek se musí v souboru vzoru vyskytovat právě jednou.
bp.cmd_remove = Odstranit
bp.cmd_remove.description = Jeden příkaz na řádek: řádek souboru vzoru, který se má odstranit. Související řádky (body, poloha) se odstraní také.
bp.cmd_insert = Vložit
bp.cmd_insert.description = Jeden příkaz na řádek: 0 nebo 1 | kotevní řádek | nový řádek. 0 vloží nový řádek před kotevní řádek, 1 za něj.
bp.strip.description = Jeden $TOKEN na řádek, například $WORKERS_NEEDED. Každý řádek vzoru s tímto tokenem se odstraní bez náhrady.
bp.life = Odolnost
bp.life.description = Prázdné = 3000\nLIFE v renderconfig.ini: kolik budova vydrží, než se zřítí. Stejně jako většina herních budov.
bp.card.lines = Řádky
