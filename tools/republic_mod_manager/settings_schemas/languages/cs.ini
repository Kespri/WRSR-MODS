resources_plus.custom_report = Zapisovat klonované záznamy
resources_plus.custom_report.description = ON u každé suroviny se vzorem zapisuje, co klon skutečně převzal (přepravní třídu, násobitele, příznaky). Suroviny bez vzoru se vypisují vždy.\nOFF vypisuje pouze suroviny bez vzoru.
resources_plus.customs_hook = Aktualizovat celnice
resources_plus.customs_hook.description = ON přidá nové suroviny do obchodního seznamu již existujících celnic.\nOFF odpovídá základní hře: celnice obchoduje pouze s tím, co znala při svém postavení; pak pomůže jen zbourání a opětovné postavení.
resources_plus.customs_probe = Zapisovat položky celnic
resources_plus.customs_probe.description = ON do tesmioloader.log zapíše jeden řádek pro každou surovinu přidanou do celnice. Jakmile celnice zobrazují očekávané položky, přepněte na OFF.
resources_plus.price_hook = Použít ceny z INI
resources_plus.price_hook.description = ON aktivuje [base_price] a [price]: základní ceny se nastaví před výpočtem cen ve hře, pevné ceny po něm.\nOFF ponechá ceny na hře.
resources_plus.price_report = Zapisovat cenovou tabulku
resources_plus.price_report.description = ON po každém výpočtu cen ve hře zapisuje cenu, základní cenu a cenovou kategorii každé suroviny z vašeho seznamu do tesmioloader.log. Cena 0.00 znamená, že ji žádná budova nevyrábí.\nOFF nic nezapisuje.
