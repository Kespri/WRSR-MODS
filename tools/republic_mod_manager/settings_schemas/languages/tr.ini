[language]
name = Türkçe

[strings]
plugin.resources = Resources
plugin.resources.description = Kaynakları, özellikleri ve isteğe bağlı fiyat değişikliklerini yönetin.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Resources Plus ile kendi kaynaklarınız: orijinaliyle aynı liste, plugins\resources_plus.ini içinde, çıkışta çökme sorunu olmadan.
resources_plus.save_warning = Değişiklikler kaydettiğinizde plugins\resources_plus.ini dosyasına yazılır. Bir kayıtlı oyunun kullandığı kaynağı kaldırmak o kaydı bozabilir.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Needs Plus ile kendi vatandaş ihtiyaçlarınız: orijinaliyle aynı liste, plugins klasöründeki needs_plus.ini dosyasında, ilk başlatmada needs.ini dosyasından alınır.
needs_plus.save_warning = Değişiklikler ancak kaydettiğinizde plugins klasöründeki needs_plus.ini dosyasına yazılır. Her ihtiyaç ilgili mağazalara bir depolama yuvası ekler ve bu yuva kayıtlı oyunun parçasıdır; önce bir kopyada deneyin.
tab.resources.editor = Kaynaklar
group.resource_definitions = Kaynak tanımları
detail.transport = Taşıma sınıfı
detail.transport.description = Kaynağı hangi araçların ve depoların taşıyıp sakladığı. Bir ad seçmeniz yeterlidir; eklenti, temel oyunun bu sınıfa ait değerlerini ekler.
detail.kind = Fiyat türü
detail.kind.description = 0 ham madde, 1 mamul, 2 gıda/giyim, 3 gelişmiş malzeme, 4 elektronik.
detail.record_price = Kaydın başlangıç fiyatı
detail.record_price.description = Kaynak kaydı içindeki isteğe bağlı RUB ve USD başlangıç değerleri.
detail.record_base_price = Kaydın başlangıç taban fiyatı
detail.record_base_price.description = Kaynak kaydı içindeki isteğe bağlı RUB ve USD taban değerleri.
detail.trade_mult = Ticaret çarpanları
detail.trade_mult.description = Satış ve alış çarpanları, normalde 0.95, 1.05.
detail.market_rub = RUB piyasa bloğu
detail.market_usd = USD piyasa bloğu
detail.market.description = İki piyasa değeri ve isteğe bağlı bir katsayı.\n(INI dosyasındaki açıklamaya bakın)
detail.packed = Paketlenmiş yük
detail.packed.description = Otomatik, paketsiz veya paketlenmiş yük gösterimi.
detail.family = Malzeme ailesi
detail.family.description = Malzemenin şantiyede yığıldığında nasıl göründüğü ve büyük olasılıkla hangi atığa dönüştüğü. Her aile bir atık kaynağı içerir. INI dosyasındaki 10 ile 19 arasındaki sayılar adlarıyla gösterilir.
detail.cargo = Yük geometrisi
detail.cargo.description = Yükü görselleştirmek için kullanılan geometri seçimi.
detail.pinned_base_price = Sabit taban fiyatı
detail.pinned_base_price.description = [base_price] içindeki isteğe bağlı RUB ve USD değeri. Boş bırakılması, kişisel bir girdi olmadığı anlamına gelir.
detail.forced_price = Zorunlu nihai fiyat
detail.forced_price.description = [price] içindeki isteğe bağlı RUB ve USD değeri. Boş bırakılması, fiyatı oyunun hesaplayacağı anlamına gelir.

; --- Kurulu orijinal eklentiler için yerel şemalar (0.13.0 sürümünden beri) ---
daynight.description = Her takvim gününde bir gün doğumu ve bir gün batımı. Temel oyunda gündüzden geceye ve tekrar gündüze geçiş 13 takvim günü, neredeyse iki hafta sürer. Bu eklentiyle bir güne sığar.
daynight.group.cycle = Gündüz ve gece
daynight.group.cycle.description = Gündüz-gece döngüsünün süresi ve gecenin ne zaman başladığı.
daynight.group.pace = Tempo
daynight.group.pace.description = İki ayrı kontrol: biri araçlar, diğeri geri kalan her şey için. Yukarıdaki ayarlardan bağımsız olarak her zaman uygulanırlar.
daynight.group.diagnostics = Sorun giderme
daynight.enabled.label = Eklenti etkin
daynight.enabled.description = ON, yapılandırılan gündüz-gece döngüsünü etkinleştirir.
daynight.cycle_days.label = Gündüz-gece döngüsü başına takvim günü
daynight.cycle_days.description = Bir gün doğumundan sonrakine kadar geçen takvim günü.\n1 = her gün bir gün doğumu ve bir gün batımı\n2 ile 12 = buna orantılı olarak daha uzun döngü\n13 = temel oyunun döngüsü
daynight.day_scale.label = Gün uzunluğu (takvimin ne kadar yavaşladığı)
daynight.day_scale.description = Bir takvim gününün temel oyuna göre ne kadar uzun sürdüğü.\nauto = takvimi ışık döngüsüne uyacak şekilde otomatik yavaşlat; önerilir\n1 = takvimi yavaşlatma; gündüz ve gece bu durumda 13 kat hızlı değişir\n2 ile 100 = takvimi bu katsayıyla yavaşlat\nOyunun hangi kısımlarının yavaşlayacağını “Neler yavaşlar” altında seçin.
daynight.slow.label = Neler yavaşlar
daynight.slow.description = Oyunun hangi kısımlarının yavaşladığı.\ncalendar = yalnızca takvimi yavaşlat; önerilir\nworld = vatandaşlar ve araçlar dahil her şeyi yavaşlat; yüksek değerler ağır çekim gibi görünür\nnone = hiçbir şeyi yavaşlatma\ncalendar ile vatandaşlar, araçlar, inşaat ve üretim normal hızlarını korur. Kirlilik, krediler ve mesajlar gibi günlük süreçler olağan aralıklarını korur.
daynight.offset.label = Gece ne zaman başlar
daynight.offset.description = Geceyi takvim günü içinde kaydırır.\n0 = karanlık günün ortasından kısa süre sonra başlar\n0.5 = karanlık tarih değiştiğinde başlar\n0 dışındaki herhangi bir değerde, 13 günlük döngü artık temel oyunla tam olarak eşleşmez.
daynight.fade.label = Aydınlatma geçişlerini ölçeklendir
daynight.fade.description = ON, sabah, gündüz, akşam ve gece arasındaki geçişleri yapılandırılan döngüye göre kısaltır.\nOFF, temel oyunun yavaş geçişlerini kullanır. Kısa döngülerde bunlar üst üste binebilir ve aydınlatmanın soluk görünmesine neden olabilir.
daynight.vehicle_scale.label = Araç hızı
daynight.vehicle_scale.description = Kamyonların, trenlerin, gemilerin ve hava araçlarının hızı. Diğer ayarlardan bağımsız çalışır.\n1 = temel oyun hızı\n2 = yarı hız\n0.5 = iki kat hız\nDaha yüksek değer = daha yavaş araçlar
daynight.sim_scale.label = Geri kalan her şeyin hızı
daynight.sim_scale.description = Vatandaşların, inşaatın, üretimin, yıpranmanın ve animasyonların hızı.\n1 = temel oyun hızı\n2 = yarı hız\n0.5 = iki kat hız\nDaha yüksek değer = daha yavaş simülasyon
daynight.probe.label = Gün uzunluklarını günlüğe yaz
daynight.probe.description = ON, her takvim gününün ve ışık geçişinin gerçek süresini tesmioloader.log dosyasına yazar. Yalnızca sorun giderme ve oyun güncellemesi sonrası kontroller için kullanın.
walking.description = Vatandaşların ne kadar uzağa yürüdüğü ve araç sahiplerinin ev, iş ve park yeri arasında ne kadar uzağa sürdüğü.
walking.group.distances = Mesafeler
walking.group.distances.description = Kuş uçuşu değil, yollar ve yaya yolları boyunca ölçülür. Nehrin karşısında 400 m uzaktaki bir bina, 1200 m yürüyüş gerektirebilir.
walking.group.diagnostics = Sorun giderme
walking.enabled.label = Eklenti etkin
walking.enabled.description = ON, yapılandırılan yürüme ve sürüş mesafelerini etkinleştirir.
walking.distance.label = Yürüme mesafesi (m)
walking.distance.description = Bir vatandaşın yürüyeceği en uzun güzergâh. Temel oyun 480 m kullanır.\nDaha yüksek değer = daha fazla bina yürüme mesafesinde olur ve inşaat daha fazla bağlantı oluşturur\n0 = sınır yok; büyük bir şehirde inşaat bu durumda birkaç saniye sürebilir\n20000 = kabul edilen en yüksek değer
walking.car_distance.label = Araç sahipleri için sürüş mesafesi (m)
walking.car_distance.description = Ev, iş ve park yeri arasında izin verilen en uzun sürüş. Temel oyun 2500 m kullanır.\nDaha yüksek değer = araç sahipleri daha uzağa sürer\nBunu yürüme mesafesinden yüksek ayarlayın. Değerler eşitse otomobil mesafe avantajı sağlamaz.
walking.regen_on_load.label = Kayıtlı oyun yüklenirken bağlantıları yeniden oluştur
walking.regen_on_load.description = Yürüme ve park bağlantıları kayıtlı oyunda saklanır.\nON, kayıt yüklenirken tüm bağlantıları yeniden oluşturur; böylece yapılandırılan mesafeler mevcut şehirleri de etkiler.\nOFF, yapılandırılan mesafeleri yalnızca yeni inşa edilen binalara uygular.
walking.probe.label = Kontrol değerlerini günlüğe yaz
walking.probe.description = ON, eklenti değiştirmeden önce oyunda bulunan değerleri tesmioloader.log dosyasına yazar. Yalnızca sorun giderme ve oyun güncellemesi sonrası kontroller için kullanın.
accumulator.description = Elektrik şebekeniz için aküler. Büyük enerji deposuna sahip bir bina, elektrik fazlası varken şarj olur ve elektrik yetersizken geri verir.
accumulator.group.battery = Akü
accumulator.group.battery.description = Hangi binaların akü sayıldığı ve ne kadar hızlı dolup boşaldığı.
accumulator.group.window = Bina penceresi
accumulator.group.grid = Elektrik şebekesi
accumulator.group.diagnostics = Sorun giderme
accumulator.enabled.label = Eklenti etkin
accumulator.enabled.description = ON, akü binalarının şarjını ve deşarjını etkinleştirir.\nOFF, deşarjı durdurur. Binalar kalır ve yine de dolabilir.
accumulator.building_types.label = Bina türleri
accumulator.building_types.description = Akü olarak çalışabilecek bina türleri. Birden fazla sayıyı virgülle ayırın.\n19 = transformatör\n18 = trafo merkezi\n17 kullanmayın: bir elektrik santrali elektrik alamaz ve asla şarj olmaz.
accumulator.min_capacity.label = Akü sayılmak için asgari depolama kapasitesi
accumulator.min_capacity.description = Bir binanın akü sayılması için gereken asgari depolama kapasitesi. Normal trafo merkezlerinin küçük depolarını dışarıda bırakır.\nDaha yüksek değer = daha az bina akü sayılır\nDaha düşük değer = daha fazla bina akü sayılır\nBirlikte gelen “Stationary Accumulator” 5000 kapasiteye sahiptir.
accumulator.charge_rate.label = Şarj hızı (saniye başına güç)
accumulator.charge_rate.description = Bir akünün saniyede aldığı en yüksek güç. Sınır, boş bir akünün tüm şehrin elektriğini çekmesini önler.\nDaha yüksek değer = daha hızlı şarj ve şebekede daha ağır yük\nDaha düşük değer = daha yavaş şarj ve daha hafif yük\nKarşılaştırma için bir kömür santrali 70, bir rüzgâr türbini 15 sağlar.
accumulator.discharge_rate.label = Deşarj hızı (saniye başına güç)
accumulator.discharge_rate.description = Bir akünün saniyede sağladığı en yüksek güç. Yalnızca şebekede eksik varsa elektrik sağlar.\nDaha yüksek değer = daha büyük güç açıklarını karşılar\nDaha düşük değer = depolanan enerji daha uzun dayanır\nÖrnek: 60 değerinde, 5000 kapasiteli dolu bir akü bir santralin yerini 80 saniyeden biraz fazla tutar.
accumulator.panel.label = Akü penceresinde şarj satırı
accumulator.panel.description = ON, akü penceresine şarj seviyesini ekler; örneğin “Sarj: 4210.5 / 5000 (84.2 %)”.
accumulator.panel_caption.label = Bu satırın başlığı
accumulator.panel_caption.description = Şarj seviyesinin önündeki sözcük. Yalnızca ASCII harfleri kullanın; Türkçe veya özel karakter kullanmayın, aksi halde oyun bozuk karakterler gösterir.
accumulator.gauges.label = Pencere göstergelerini aküye göre hesapla
accumulator.gauges.description = ON, oyunun yanlış göstergesini aküye giren ve aküden çıkan gerçek akışla değiştirir.\nOFF, normal oyun göstergesini kullanır. Akü şarj olurken 0 güç ve “elektrik beslemesi yok” gösterebilir.
accumulator.spread_voltage.label = Deney: gerilimi komşulara aktar (kapalı bırakın)
accumulator.spread_voltage.description = ON etkisizdir. Bu eski işlev teknik olarak değiştirilmiştir. OFF olarak bırakın.
accumulator.trace.label = İlk akünün komşularını günlüğe yaz
accumulator.trace.description = ON, ilk akünün yanındaki binaların ne kadar elektrik aldığını günlüğe yazar. Yalnızca sorun giderme içindir; performansı düşürebilir.
accumulator.log_seconds.label = Akü günlüğü satırları arasındaki saniye
accumulator.log_seconds.description = tesmioloader.log dosyasındaki akü durum mesajları arasındaki süre. Her mesaj şarj, giriş ve çıkış içerir.\n0 = durum mesajı yok\nDaha yüksek değer = daha seyrek günlük kaydı
accumulator.probe.label = Günlükteki bina listeleri arasındaki saniye
accumulator.probe.description = tesmioloader.log dosyasında elektrik depolayan tüm binaların listeleri arasındaki süre. Yalnızca akü tanınmadığında veya oyun güncellemesinden sonra kullanın.\n0 = bu listeleri yazma\nDaha yüksek değer = daha seyrek günlük kaydı
cities.description = Her şehrin boyutu ve şekli. Temel oyunda her şehir 1000 m yarıçaplı bir dairedir. Bu eklentiyle her şehrin yarıçapını ayrı ayrı, isterseniz kare olarak, doğrudan şehir penceresinde ayarlarsınız. Değerler kayıtlı oyunda saklanır.
cities.group.cities = Şehirler
cities.group.slider = Yarıçap kaydırıcısı
cities.group.slider.description = Şehir penceresindeki kaydırıcının aralığı ve + veya - düğmesine bir tıklamanın ne kadar değiştirdiği.
cities.group.layout = Şehir penceresindeki yerleşim
cities.group.layout.description = İki yeni satırın şehir penceresindeki konumu. Sayılar, oyun penceresinin kendi birimindeki konumlardır; pencere yaklaşık 500 genişliğindedir.
cities.group.overlay = Zemindeki nokta ızgarası
cities.group.diagnostics = Sorun giderme
cities.enabled.label = Eklenti etkin
cities.enabled.description = ON, özel şehir boyutlarını ve şekillerini etkinleştirir.
cities.window.label = Şehir penceresinde yarıçap kaydırıcısı ve kare şekil kutusu
cities.window.description = ON, şehir penceresinde yarıçap kaydırıcısını ve kare şekil kutusunu gösterir.\nOFF, ikisini de gizler; ayarlanan değerler kalır ancak artık değiştirilemez.
cities.adopt.label = Sahipsiz binalara kendi şehirlerini ver
cities.adopt.description = Bir şehri küçülttüğünüzde bazı binalar dışarıda kalabilir ve artık hiçbir şehre ait olmayabilir.\nON, oyunun kendi yaptığı gibi onlar için rastgele bir ad ve bugünün tarihiyle yeni bir şehir kurar.\nOFF, onları şehirsiz bırakır; oyunun bu durumdaki davranışı test edilmemiştir.
cities.radius.label = Varsayılan yarıçap (m)
cities.radius.description = Ayrı olarak yapılandırmadığınız şehirler için varsayılan yarıçap. Değer her haritada geçerlidir.\n1000 = temel oyun yarıçapı\nDaha yüksek değer = daha büyük şehirler\nDaha düşük değer = daha küçük şehirler
cities.square.label = Varsayılan şekil kare
cities.square.description = ON, ayrı olarak yapılandırılmamış şehirleri kare yapar.\nOFF, temel oyundaki gibi daire kullanır.
cities.radius_min.label = Kaydırıcıdaki en küçük yarıçap (m)
cities.radius_min.description = Kaydırıcının en solundaki değer.
cities.radius_max.label = Kaydırıcıdaki en büyük yarıçap (m)
cities.radius_max.description = Kaydırıcının en sağındaki değer. Kaydırıcının 100 adımı vardır; 200 ile 5000 arasında bir adım 48 m olur.
cities.step.label = Düğme tıklaması başına yüzde
cities.step.description = + veya - düğmesine bir tıklamayla değişen kaydırıcı aralığının yüzdesi. Kaydırıcı sürüklenirken geçerli değildir.\nDaha yüksek değer = tıklama başına daha büyük değişim\nDaha düşük değer = tıklama başına daha hassas değişim
cities.label_x.label = Etiket konumu
cities.label_x.description = Etiketin pencerenin sol kenarından uzaklığı.
cities.widget_x.label = Denetim konumu
cities.widget_x.description = Kaydırıcının ve kutunun pencerenin sol kenarından uzaklığı. Kaydırıcı yaklaşık 225 gerektirir.
cities.checkbox_dy.label = Kutu satırını yukarı veya aşağı taşı
cities.checkbox_dy.description = Kaydırıcıyla örtüşmemesi için onay kutusunu yukarı veya aşağı taşır.\nDaha yüksek değer = kutu daha aşağıda\nDaha düşük değer = kutu daha yukarıda
cities.overlay.label = Sınır gösterimi yarıçapı ve şekli izler
cities.overlay.description = Bir şehir penceresi açıkken oyun zeminde mavi nokta ızgarası gösterir, ancak daima yalnızca 1000 m yarıçaplı bir daire için.\nON, ızgarayı yarıçapınıza ve şeklinize uyarlar.\nOFF, temel oyundaki gibi bırakır.
cities.overlay_step.label = Sınır ızgarası aralığı (m)
cities.overlay_step.description = Şehir sınırı gösterimindeki noktalar arasındaki mesafe.\n0 = otomatik olarak yarıçapın yirmide birini, en az 50 m kullan\nDaha düşük değer = daha yoğun gösterim ve daha yüksek performans maliyeti
cities.probe.label = Şehirleri günlüğe yaz
cities.probe.description = ON, yüklemeden sonra her şehrin yarıçapını, şeklini ve bina sayısını tesmioloader.log dosyasına yazar. Şehir penceresi açıkken ek mesajlar yazılır. Yalnızca sorun giderme içindir; günlük hızla büyüyebilir.
depletion.description = Maden yatakları tükenir. Çalışan bir maden, yatağı haritadan görünür biçimde çıkarır ve kalan miktar azaldıkça üretim de azalır. Çıkarılan miktar kayıtlı oyunda saklanır; eklentiyi daha sonra kapatırsanız çıkarılanlar geri gelmez. Önce kayıtlı oyununuzun bir kopyasında deneyin.
depletion.group.depletion = Madencilik
depletion.group.window = Maden penceresi
depletion.group.diagnostics = Sorun giderme
depletion.enabled.label = Eklenti etkin
depletion.enabled.description = ON, seçilen yatakların çıkarıldıkça tükenmesini sağlar.\nOFF, daha fazla tükenmeyi durdurur. Daha önce kaldırılan kaynaklar geri yüklenmez.
depletion.tonnes_per_texel.label = Harita noktası başına ton
depletion.tonnes_per_texel.description = Bir madenin kaynak haritasındaki tamamen dolu bir noktadan çıkarabileceği ton. Daha zayıf noktalar orantılı olarak daha az verir.\nDaha yüksek değer = yataklar daha uzun dayanır\nDaha düşük değer = yataklar daha erken tükenir\nKarşılaştırma için 210 m arama yarıçaplı bir maden birkaç bin harita noktasını kapsar.
depletion.vanilla.label = Temel oyundaki tükenebilir yataklar
depletion.vanilla.description = Temel oyunda tükenebilecek yataklar. Birden fazla değeri virgülle ayırın.\noil, iron, coal, uranium, bauxite, gravel = yalnızca adı verilen yataklar\nall = her yatak\nnone = temel oyundaki hiçbir yatak\nname:value = harita noktası başına özel ton, örneğin iron:3000\ndeposits.ini içindeki yataklar her zaman dahildir.\ngravel, görünür zemin dokusunu kalıcı olarak aşındırır ve küçük arama alanı nedeniyle çok daha yüksek bir değer gerektirir. Temel oyundaki gibi tutmak için gravel değerini eklemeyin.
depletion.flush_seconds.label = Çıkarılan miktar kaydedilene kadar geçen saniye
depletion.flush_seconds.description = Kaynak haritası güncellemeleri arasındaki saniye. Üretim ve kalite hemen değişir; yalnızca mini harita ve kayıtlı oyun bu aralığı izler.\nDaha düşük değer = daha sık güncelleme ve daha yüksek performans maliyeti\nSaniyede dört kereden fazla güncellemeyin.
depletion.panel.label = Maden penceresinde kalan yatak satırı
depletion.panel.description = ON, maden penceresinde kalan rezervi gösterir ve pencereyi biraz uzatır; örneğin “Kalan: 251.4 kt / 259.3 kt (96.9 %)”.
depletion.panel_caption.label = Bu satırın başlığı
depletion.panel_caption.description = Kalan miktarın önündeki sözcük. Yalnızca ASCII harfleri kullanın; Türkçe veya özel karakter kullanmayın, aksi halde oyun bozuk karakterler gösterir.
depletion.log_seconds.label = İlerleme satırlarının aralığı (saniye)
depletion.log_seconds.description = tesmioloader.log dosyasındaki maden durum mesajları arasındaki saniye. Her mesaj kalan miktarı, toplam miktarı ve kaliteyi içerir.\n0 = durum mesajı yok\nDaha yüksek değer = daha seyrek günlük kaydı\nHarita noktası başına uygun ton değerini bulmak için birkaç oyun günü gözlemleyin.
easystart.description = Vatandaş ihtiyaçları yıllar içinde adım adım ortaya çıkar. Henüz açılmamış bir ihtiyaç mutluluğu ve sağlığı etkilemez; vatandaşlar yine de ilgili yere gider ve alışveriş yapar, ancak sonuçlar belirlenen yıla kadar uygulanmaz.
easystart.group.general = Neler ertelenir
easystart.group.unlock = Açılma yılları
easystart.group.unlock.description = Gereksinimin 1 Ocak itibarıyla uygulanmaya başladığı yıl. Takvim, 1920 yılında kurulmuş bir cumhuriyet için tasarlanmıştır. 1960 yılında başlarsanız önceden ayarlanan yıllar zaten geçmiş olur.\noff = erteleme; temel oyun davranışı\nalways = ilk oyun gününden itibaren uygula\nBir yıl = o yıl aç
easystart.group.diagnostics = Sorun giderme
easystart.enabled.label = Eklenti etkin
easystart.enabled.description = ON, ihtiyaçları ve altyapı gereksinimlerini yapılandırılan takvime göre açar.
easystart.demands.label = Dokuz vatandaş ihtiyacını ertele
easystart.demands.description = ON, gıda, et, giysi, elektronik, alkol, din, kültür, spor ve sağlığı yapılandırılan açılma yıllarına kadar erteler.
easystart.utilities.label = Binaların üç altyapı gereksinimini ertele
easystart.utilities.description = ON, elektrik, su ve ısıtma gereksinimlerini yapılandırılan açılma yıllarına kadar erteler.
easystart.warnings.label = Bina penceresindeki uyarıları ertele
easystart.warnings.description = ON, ilgili uyarıları açılma yılına kadar gizler; örneğin “binanın elektrik beslemesi yok”.
easystart.pin_status.label = Kilitli ihtiyaçların memnuniyetini koru
easystart.pin_status.description = ON, kilitli bir ihtiyacın karşılanma düzeyini aşağıdaki değerde tutar.\nOFF, memnuniyetin düşmeye devam etmesine izin verir; ihtiyaç açıldığında zaten çok düşük olabilir.
easystart.locked_status.label = Kilitliyken memnuniyet
easystart.locked_status.description = Bir ihtiyaç kilitliyken karşılanma düzeyi. Gıda için değer tokluğu belirtir.\n1.0 = tamamen memnun veya tok\n0.5 = açıldıktan sonra belirgin iyileşme sağlayan orta değer
easystart.clear_unsatisfied.label = Kilitli ihtiyaçları karşılanmayanlar listesinden çıkar
easystart.clear_unsatisfied.description = ON, kilitli ihtiyaçların “N vatandaş X elde edemedi” mesajını oluşturmasını önler.
easystart.probe.label = Açılmaları günlüğe yaz
easystart.probe.description = ON, her yıl değişiminde kilitli kalan ihtiyaçları tesmioloader.log dosyasına yazar. Ayrıca etkilenen ilk vatandaşı bir kez kaydeder. Yalnızca sorun giderme içindir.
easystart.food.label = Gıda
easystart.religion.label = Din
easystart.meat.label = Et
easystart.clothes.label = Giysi
easystart.alcohol.label = Alkol
easystart.sport.label = Spor
easystart.culture.label = Kültür
easystart.health.label = Sağlık
easystart.electricity.label = Elektrik
easystart.water.label = Su (kanalizasyonu da kapsar)
easystart.heating.label = Isıtma
easystart.electronics.label = Elektronik
easystart.school.label = Okul
easystart.school.description = Bu yıldan önce çocuklar, oyunun “Basit” eğitim ayarındaki gibi okulsuz öğrenir ve “N çocuk okula gidemiyor” mesajı görünmez.
easystart.kindergarten.label = Anaokulu
easystart.kindergarten.description = Bu yıldan önce hiçbir ebeveyn altı yaşından küçük çocuğu için evde kalmak zorunda değildir ve “N işçi çalışamıyor, çünkü tüm anaokulları …” mesajı görünmez.
plugin.needs = Needs
plugin.needs.description = Ek vatandaş ihtiyaçlarını ve eklenti anahtarlarını orijinal dosyayı düzenlemeden yönetin.
tab.needs.editor = İhtiyaçlar
group.needs = Vatandaş ihtiyaçları
group.needs.plugin = Eklenti ayarları
group.needs.plugin.description = Tüm ihtiyaçlara uygulanan anahtarlar.
needs.list = İhtiyaç listesi
needs.add = İhtiyaç ekle
needs.select_help = Soldan bir ihtiyaç seçin veya Resources tarafından kaydedilmiş bir kaynağı eklemek için + kullanın.
needs.resource = Kaynak
needs.resource.help = Vatandaşların talep etmesi gereken kaynak. Resources eklentisinin listesinde kayıtlı olmalıdır.
needs.donor = Örnek ihtiyaç
needs.donor.description = Şablon olarak kullanılan mevcut ihtiyaç.\nfood veya meat = gıda mağazaları için\nclothes veya eletronics = büyük mağazalar için\nalcohol = alkol mağazaları için\neletronics, oyunun kullandığı yazımdır.
needs.factor = Miktar çarpanı
needs.factor.description = Örnek ihtiyaca göre mal miktarı.\n1.0 = örnekle aynı miktar\nDaha yüksek değer = vatandaşlar daha fazlasına ihtiyaç duyar\nDaha düşük değer = vatandaşlar daha azına ihtiyaç duyar
needs.category = Mağaza kategorisi
needs.category.description = Malları stoklayan mağazalar.\nauto = örnek ihtiyaçla aynı mağazalar\nnone = otomatik raf yok; bina malları kendisi sağlamalıdır\nbasic = yalnızca temel mağazalar\nmedium = yalnızca orta boy mağazalar\nadvanced = yalnızca büyük mağazalar\nmediumadvanced = yalnızca orta ve büyük mağazalar\nhotel = yalnızca oteller\nBir sayı = bu mağaza değerini doğrudan yaz; yalnızca oyun dosyalarını bilen kullanıcılar için
needs.chance = Olasılık
needs.chance.description = Bir vatandaşın bu ihtiyacı alma olasılığı, 0 ile 1 arasında. 1 altında, örnek ihtiyaçtan bağımsız olarak dağıtılır.\n0 = hiçbir vatandaş almaz\n1 = uygun tüm vatandaşlar alır
needs.unhappy = Memnuniyetsizlik
needs.unhappy.description = Bir vatandaş malları elde edemediğinde kaybedilen memnuniyet.\n0 = kayıp yok; ihtiyaç yalnızca gösterilir\n0.005 ile 0.02 = konfor malları için tipik aralık\nİzin verilen aralık: 0 ile 1
needs.enabled = Eklenti etkin
needs.enabled.description = ON, eklentiyi etkinleştirir.\nOFF, bir sonraki oyun başlangıcında tamamen devre dışı bırakır.
needs.demand = İhtiyaç ekle
needs.demand.description = ON, vatandaşlara yeni ihtiyacı verir.\nOFF, ihtiyacı dağıtmaz ancak malları mağazalara yine de ekleyebilir.
needs.storage = Mağazaları stokla
needs.storage.description = ON, malları seçilen mağazalara ekler.\nOFF, depolama yuvası eklemez; vatandaşlar malları yalnızca bunları kendileri sağlayan binalarda bulabilir.
needs.max_demands = Vatandaş başına ihtiyaç
needs.max_demands.description = Bir vatandaşın aynı anda sahip olabileceği en fazla ek ihtiyaç sayısı.\n1 = en fazla bir ek ihtiyaç\n7 = izin verilen en yüksek sayı
needs.when_full = Vatandaş ihtiyaç sınırına ulaştığında
needs.when_full.description = Bir vatandaş zaten en fazla ek ihtiyaç sayısına sahip olduğunda ne olacağı.\nskip = bir yuva boşalana kadar bekle\nreplace = bu sefer örnek ihtiyacı değiştir
needs.probe = Ayrıntılı günlük
needs.probe.description = ON, vatandaş ihtiyaç listelerini ve her mağazayla ilgili bilgileri ayrıntılı eklenti günlüğüne yazar.\nOFF, yalnızca uyarıları yazar. Yeni mağazaları kontrol ederken geçici olarak etkinleştirin.
needs.log_seconds = İlerleme satırı aralığı (saniye)
needs.log_seconds.description = Kaç ihtiyacın atandığını bildiren mesajlar arasındaki saniye.\n0 = bu mesajları devre dışı bırak\nDaha yüksek değer = daha seyrek günlük kaydı
tab.needs.general = Genel
plugin.deposits = Deposits
plugin.deposits.description = Temel oyunda bulunmayan yatak türlerini ve eklenti anahtarlarını orijinal dosyayı düzenlemeden yönetin.
tab.deposits.general = Genel
tab.deposits.editor = Yataklar
group.deposits = Yataklar
group.deposits.description = Orijinal yataklar korunur ve gizlenebilir; kişisel yataklar ayrı saklanır ve kullanılan deposits.ini dosyasında birleştirilir. [deposits] dışındaki her bölüm bir yataktır.
group.deposits.plugin = Eklenti ayarları
group.deposits.plugin.description = [deposits] bölümündeki üç alt sistem. Buradaki anahtarı kapalı olduğunda her biri tüm yataklar için kapalıdır.
deposits.notice = Bir maden bunları kullanmaya başladığında yatağın tür numarası, harita kanalı ve building.ini içindeki token kayıtlı oyunun parçası olur. Kayıtlı oyunun kullandığı bir yatağı kaldırmak veya yeniden numaralandırmak o kaydı kullanılamaz hale getirebilir; önce bir kopyada deneyin.
deposits.list = Yatak listesi
deposits.add = Yatak ekle
deposits.select_help = Soldan bir yatak seçin veya Resources tarafından kaydedilmiş bir kaynak için yatak eklemek üzere + kullanın.
deposits.name = Yatak
deposits.name.help = deposits.ini içindeki bölüm adı. Günlükte ve düzenleyici fırçasında yatağı adlandırır; daha sonra yeniden adlandırılamaz.
deposits.new_name = Yatak adı
deposits.new_hint = Burada yalnızca standart ayarlar sorulur. Diğer her şey (bileşen, bina türü, tükenme) ekledikten sonra sağdaki ayarlardadır.
deposits.code_patch = Kod yaması
deposits.code_patch.description = ON, madenlerin building.ini üzerinden bulabilmesi için yapılandırılan $TYPE_MINE_ yatak türlerini oyuna ekler. Bir güncellemeden sonra beklenen oyun verileri artık eşleşmiyorsa eklenti hiçbir şeyi değiştirmez.
deposits.minimap_all = Mini harita katmanları
deposits.minimap_all.description = ON, tek tek etkinleştirilmiş her eklenti yatağı için oyunun beş mini harita düğmesinin altında bir düğme gösterir.\nOFF, tüm eklenti yatağı düğmelerini gizler.
deposits.editor_all = Arazi düzenleyici fırçaları
deposits.editor_all.description = ON, fırça adı olan her yatak için arazi düzenleyicinin Kaynaklar sekmesinde boyama ve silme fırçası gösterir.\nOFF, tüm eklenti yatağı fırçalarını gizler.
deposits.token = Bina tokeni
deposits.token.description = Bu yatak için bir madenin building.ini içinde kullandığı token; örneğin $TYPE_MINE_COPPER. $TYPE_MINE_GRAVEL gibi girin. Aynı building.ini içinde asla iki yatak tokeni kullanmayın.
deposits.type = Tür numarası
deposits.type.description = Yatağın benzersiz tür numarası. İki yatak aynı numarayı kullanmamalıdır.\n10 ile 127 = izin verilen aralık\n0 ile 9 = temel oyun için ayrılmıştır\nİletişim kutusu bir sonraki boş numarayı otomatik önerir.
deposits.map = Harita
deposits.map.description = Yatağın saklandığı harita.\nauto = eklenti haritasında boş bir yuvayı otomatik seç; önerilir\nresourcemap veya resourcemap2 = temel oyun haritalarını kullan\nresourcemap3 ile resourcemap10 = ek eklenti haritalarını kullan\nterrain = boyalı zemini doğrudan kullan, örneğin çakıl için; fırçası ROCKS altında görünür
deposits.component = Bileşen
deposits.component.description = Her haritada 0 ile 3 arasında dört yuva vardır. Her yuva bir yatak içerebilir.\nauto ile = alanı boş bırakın; eklenti boş bir yuva seçer\nterrain ile: 2 = çakıl katmanı\nterrain ile: 3 = vaha katmanı
deposits.building_type = Bina türü
deposits.building_type.description = Bu yatağı çıkarabilen bina türü.\n7 = maden; hemen her yatak için doğru\n92 = su kuyusu\nBoş alan = 7
deposits.radius = Arama yarıçapı
deposits.radius.description = Bir madenin yatağını ne kadar uzakta aradığı.\noil, ore, bauxite, gravel, wood, water, watersurface = ilgili oyun sabitini kullan\nBir sayı = bu mesafeyi doğrudan kullan\nBoş alan = ore kullan\nYarıçap olmadan maden yatak bulamaz.
deposits.icon = Mini harita simgesi
deposits.icon.description = Mini harita düğmesinde simgesi görünen kaynak. Eklenti, oyunun zaten yüklediği simgeyi kullanır; ayrı bir resim gerekmez.\nResources eklentisindeki kaynaklar orada kayıtlı olmalıdır.\nBoş alan = simge yok
deposits.minimap = Mini harita düğmesi
deposits.minimap.description = ON, bu yatak için mini harita düğmesi ve gösterim katmanı ekler.
deposits.editor = Düzenleyici fırçasının adı
deposits.editor.description = Arazi düzenleyicideki boyama ve silme fırçalarının adı. Aynı ad vfs\media_soviet\editor altındaki tool_paint_<name>.png ve tool_erase_<name>.png için kullanılır.\nBoş alan = fırça oluşturma\nİzin verilen: en fazla 31 karakter; harfler, rakamlar, _ ve -
deposits.deplete = Teksel başına tükenme
deposits.deplete.description = Bu ayar Depletion eklentisi tarafından okunur. Bir madenin kaynak haritasındaki tamamen dolu bir noktadan çıkarabileceği tonu ayarlar. Daha zayıf noktalar orantılı olarak daha az verir.\nDeğer, plugins\depletion.ini içindeki tonnes_per_texel değerini geçersiz kılar.\n0 = bu yatak sonsuz kalır\nBoş alan = genel değeri kullan
deposits.save_warning = Değişiklikler kullanılan deposits.ini dosyasına yalnızca kaydedildiğinde yazılır. Kayıtlı oyunun zaten kullandığı yatakların tür numaraları, harita kanalları ve tokenleri değişmemelidir; önce bir kopyada deneyin.
depletion.tab.general = Genel
depletion.tab.mining = Madencilik
needs.save_warning = Değişiklikler kullanılan needs.ini dosyasına yalnızca kaydettiğinizde yazılır. Her ihtiyaç ilgili mağazalara bir depolama yuvası ekler ve bu yuva kayıtlı oyunun parçasıdır; önce bir kopyada deneyin.
bp.name = Buildings Plus
bp.description = Bir tanımdan yeni binalar: oyundan bir örnek bina ve farklı olan building.ini satırları. Her oyun başlangıcında eksiksiz Workshop öğeleri olarak yazılır.
bp.notice = Her bina media_soviet\workshop_wip altında kendi Workshop kimliğine sahip bir klasör olur. Kimliği boş bırakın; eklenti oyun başlarken 9300000000 değerinden itibaren bir sonraki boş numarayı atar ve plugins\buildings_plus.ids.ini içinde saklar. Oyun klasörü yayımlanmamış bir Workshop öğesi gibi okur. Değişiklikler tam yeniden başlatma gerektirir. Böyle bir bina içeren kayıtlı oyun, yüklenirken klasöre ihtiyaç duyar.
bp.tab.general = Genel
bp.tab.buildings = Binalar
bp.tab.generated = Oluşturulan binalar
bp.wip = Oyun klasöründeki oluşturulan binalar
bp.wip.description = Buildings Plus veya orijinal buildings eklentisinin media_soviet\workshop_wip içine oluşturduğu binaları gösterir. Burada gördükleriniz klasörlerden okunur.
bp.wip.empty = Burada henüz oluşturulan bina yok. Bir bina etkinleştirildiğinde oyun başlangıcında oluşturulur.
bp.group = Binalar
bp.group.notice = Buradaki bina, farklı satırlara sahip bir oyun binası kopyasıdır: aynı model, aynı bağlantılar, sizin üretim tarifiniz. Aynı türden bir örnek seçin (maden için maden, fabrika için fabrika).
bp.list = Binalar
bp.add = Ekle
bp.select_help = Soldan bir bina seçin veya eklemek için + kullanın. Önce örnek sorulur; Workshop kimliği boş kalabilir. Ad ve satırlar sağda girilir.
bp.id = Nesne adı
bp.id.help = Oluşturulan binanın klasörünü ve nesnesini adlandırır, günlükte de görünür. Yalnızca harfler, rakamlar, _ ve -, en fazla 64 karakter; daha sonra değiştirilemez.
bp.save_warning = Değişiklikler kullanılan buildings_plus.ini dosyasına yalnızca kaydedildiğinde yazılır ve oyun tamamen yeniden başlatıldıktan sonra geçerli olur. Eklenti daha sonra media_soviet\workshop_wip altındaki klasörü yazar; hatalı bölüm atlanır ve günlükte adı belirtilir.
bp.list.note = En fazla 256 bina.
bp.new_name = Nesne adı
bp.new_hint = Boşluklar alt çizgiye, büyük harfler küçük harfe dönüşür.
bp.card.folders = Oluşturulan klasörler
bp.card.log = Sorun giderme
bp.card.new = Yeni bina
bp.links = Kılavuzlar
bp.link.readme = README (kılavuz)
bp.prune = Klasörleri temizle
bp.prune.description = ON, sildiğiniz veya kapattığınız binanın oluşturulan klasörünü bir sonraki oyun başlangıcında kaldırır (yalnızca bu eklentinin yazdığı klasörler).\nOFF, bu klasörleri yerinde bırakır; oyun bu binaları yüklemeye devam eder.
bp.always = Her zaman yeniden yaz
bp.always.description = ON, her oyun başlangıcında tüm bina klasörlerini yazar.\nOFF, klasörü yalnızca bölümü, eklenti veya bir örnek dosyası değiştiğinde yazar. OFF olarak bırakın.
bp.verbose = Ayrıntılı günlük
bp.verbose.description = ON, kopyalanan her dosyayı ve kaldırılan her örnek satırını logs\tesmioloader.buildings_plus.log dosyasına yazar.\nOFF, yalnızca sonuçları, uyarıları ve hataları yazar.
bp.repair_owner_ids = Sahip kimliğini doldur
bp.repair_owner_ids.description = ON, başka oluşturucularınkiler dahil, sahip kimliği olmayan oluşturulmuş binalara Steam kimliğinizi ekler. Bu olmadan, böyle bir bina kullanan kayıtlı oyunu her yüklediğinizde oyun eksik Workshop öğelerini sorar.\nOFF, diğer oluşturucuların klasörlerine dokunmaz.
bp.card.saves = Kayıtlı oyunlar
bp.card.saves.description = Kayıtlı oyun, ayakta duran her binanın depolarını hatırlar. Binalarınızdan birine ait yeni bir depolama satırının mevcut binalara da ulaşması bu şekilde sağlanır.
bp.retrofit = Mevcut binaların depolarını güncel tut
bp.retrofit.description = ON: kayıtlı oyun yüklenirken tamamlanmış her oluşturulan bina, bölümüne eklediğiniz tek kaynaklı depoları boş olarak alır. Bir depolama satırındaki boyutu değiştirirseniz depo da değişir; küçültme, stok sığana kadar bekler. Satırını kaldırdığınız depo, boşalır boşalmaz binalardan kaldırılır.\nOFF: mevcut binaların depoları olduğu gibi kalır; yeni ve değiştirilmiş satırlar yalnızca sonradan inşa ettiğiniz binaları etkiler.
bp.enabled = Bina etkin
bp.enabled.description = ON, bu binayı bir sonraki oyun başlangıcında oluşturur.\nOFF, oluşturmaz. “Klasörleri temizle” etkinse mevcut klasörü bir sonraki başlangıçta kaldırılır.
bp.item_id = Workshop kimliği
bp.item_id.description = Kendi numaranız olabilir: 9000000000 ile 9999999999 arasında; 9100000000 ile 9199999999 hariç (diğer oluşturucular için ayrılmıştır)\nOyun klasöründeki workshop_wip altındaki klasörü adlandırır ve daha sonra değiştirilmemelidir.
bp.donor = Örnek bina
bp.donor.description = Kopyanın temel alındığı bina; Workshop binasıysa abone olunmalıdır.\nMevcut binalara göz atmak için “Örnek seç...” kullanın. Türü eşleştirin: maden için maden, fabrika için fabrika, mağaza için mağaza.
bp.item_name = Oyundaki ad
bp.item_name.description = Oyunda gösterilen ad.\nNokta içeren bir değer çeviri anahtarı sayılır ve Localization eklentisi üzerinden çözümlenir; örneğin: localization.lang.salt_mine
bp.desc = Açıklama
bp.desc.description = Workshop girdisinin açıklaması, her satıra bir satır. Tırnak işareti kullanmayın.
bp.line = building.ini satırları
bp.line.description = Her satıra bir building.ini satırı; örneğin $PRODUCTION raw_salt 1.0. Örnek binadan bir satır alıp düzenlemek için “Satır seç…” kullanın. Satırlarınız örnek satırların önüne gelir ve şunların yerini alır: aynı token; tüm $TYPE_*; $RESOURCE_VISUALIZATION ile birlikte tüm $STORAGE*; tek tarif olarak $PRODUCTION, $CONSUMPTION ve $CONSUMPTION_PER_SECOND. Örneğin geri kalan her şeyi korunur.\nKendi kaynaklarınız için her zaman kaynak adıyla birlikte $STORAGE_IMPORT_SPECIAL veya $STORAGE_EXPORT_SPECIAL kullanın; aksi halde depo taşıma sınıfındaki tüm kaynakları listeler.
bp.strip = Örnek satırlarını kaldır
bp.cmd_add = Sona ekle
bp.cmd_add.description = Her satıra bir komut: örnek dosyasının kapanışından önce yerleştirilen yeni bir satır. Birden fazla satırlı blok, satırları arasına | konularak yazılır.
bp.cmd_replace = Değiştir
bp.cmd_replace.description = Her satıra bir komut: eski satır | yeni satır. Eski satır örnek dosyasında tam olarak bir kez bulunmalıdır.
bp.cmd_remove = Kaldır
bp.cmd_remove.description = Her satıra bir komut: örnek dosyasından çıkarılacak satır. Ona ait satırlar (noktalar, konum) da onunla birlikte çıkarılır.
