resources_plus.price_report = Fiyat tablosunu günlüğe yaz
resources_plus.price_report.description = ON, oyunun her fiyat hesaplamasından sonra listenizdeki her kaynağın fiyatını, taban fiyatını ve fiyat türünü tesmioloader.log dosyasına yazar. 0.00 fiyat, hiçbir binanın bunu üretmediği anlamına gelir.\nOFF, hiçbir şey yazmaz.
