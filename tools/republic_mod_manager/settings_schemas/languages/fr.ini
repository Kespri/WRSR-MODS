[language]
name = Français

[strings]
plugin.resources = Resources
plugin.resources.description = Gérez les ressources, leurs propriétés et les éventuels prix personnalisés.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Vos propres ressources avec Resources Plus : la même liste que dans le plugin d'origine, dans plugins\resources_plus.ini, sans plantage à la fermeture.
resources_plus.save_warning = Les modifications sont écrites dans plugins\resources_plus.ini lorsque vous enregistrez. Supprimer une ressource déjà utilisée par une sauvegarde peut endommager cette sauvegarde.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Vos propres besoins pour les citoyens avec Needs Plus : la même liste que dans le plugin d'origine, dans le fichier needs_plus.ini du dossier plugins, reprise de needs.ini au premier démarrage.
needs_plus.save_warning = Les modifications ne sont écrites dans needs_plus.ini, dans le dossier plugins, que lorsque vous enregistrez. Chaque besoin ajoute un emplacement de stockage aux magasins concernés, et cet emplacement fait partie de la sauvegarde. Testez d'abord sur une copie.
tab.resources.editor = Ressources
group.resource_definitions = Définitions des ressources
detail.transport = Classe de transport
detail.transport.description = Détermine quels véhicules et entrepôts peuvent transporter et stocker la ressource. Il suffit de choisir un nom ; le plugin ajoute les valeurs du jeu de base pour cette classe.
detail.kind = Catégorie de prix
detail.kind.description = 0 matières premières, 1 produits manufacturés, 2 nourriture/vêtements, 3 matériaux avancés, 4 électronique.
detail.record_price = Prix initial dans la fiche
detail.record_price.description = Valeurs initiales facultatives en RUB et USD dans la fiche de la ressource.
detail.record_base_price = Prix de base initial dans la fiche
detail.record_base_price.description = Valeurs de base facultatives en RUB et USD dans la fiche de la ressource.
detail.trade_mult = Multiplicateurs commerciaux
detail.trade_mult.description = Multiplicateurs de vente et d'achat, normalement 0.95 et 1.05.
detail.market_rub = Bloc de marché RUB
detail.market_usd = Bloc de marché USD
detail.market.description = Deux valeurs de marché et un coefficient facultatif.\n(Voir la description dans le fichier INI)
detail.packed = Marchandise emballée
detail.packed.description = Représentation automatique de la marchandise, non emballée ou emballée.
detail.family = Famille de matériaux
detail.family.description = Détermine l'apparence du matériau en tas sur un chantier et, très probablement, le déchet qu'il devient. Chaque famille contient une ressource de déchet. Les nombres de 10 à 19 du fichier INI sont affichés par leur nom.
detail.cargo = Géométrie de la marchandise
detail.cargo.description = Choix de la géométrie utilisée pour représenter la marchandise.
detail.pinned_base_price = Prix de base fixe
detail.pinned_base_price.description = Valeur facultative en RUB et USD dans [base_price]. Un champ vide signifie qu'aucune entrée personnalisée n'est définie.
detail.forced_price = Prix final imposé
detail.forced_price.description = Valeur facultative en RUB et USD dans [price]. Si le champ est vide, le jeu calcule le prix.

; --- Schémas locaux pour les plugins d'origine installés (depuis 0.13.0) ---
daynight.description = Un lever et un coucher de soleil par jour calendaire. Dans le jeu de base, le passage du jour à la nuit puis au jour prend 13 jours calendaires, soit presque deux semaines. Avec ce plugin, il tient dans une seule journée.
daynight.group.cycle = Jour et nuit
daynight.group.cycle.description = Durée du cycle jour-nuit et moment où la nuit arrive.
daynight.group.pace = Rythme
daynight.group.pace.description = Deux réglages distincts : un pour les véhicules et un pour tout le reste. Ils s'appliquent toujours, quels que soient les réglages ci-dessus.
daynight.group.diagnostics = Dépannage
daynight.enabled.label = Plugin activé
daynight.enabled.description = ON active le cycle jour-nuit configuré.
daynight.cycle_days.label = Jours calendaires par cycle jour-nuit
daynight.cycle_days.description = Nombre de jours calendaires entre deux levers de soleil.\n1 = un lever et un coucher de soleil chaque jour\n2 à 12 = un cycle proportionnellement plus long\n13 = le cycle du jeu de base
daynight.day_scale.label = Durée du jour (facteur de ralentissement du calendrier)
daynight.day_scale.description = Facteur d'allongement d'un jour calendaire par rapport au jeu de base.\nauto = ralentir automatiquement le calendrier pour l'adapter au cycle lumineux ; recommandé\n1 = ne pas ralentir le calendrier ; le jour et la nuit alternent alors 13 fois plus vite\n2 à 100 = ralentir le calendrier de ce facteur\nChoisissez les éléments du jeu à ralentir dans « Éléments à ralentir ».
daynight.slow.label = Éléments à ralentir
daynight.slow.description = Détermine les éléments du jeu à ralentir.\ncalendar = ralentir uniquement le calendrier ; recommandé\nworld = tout ralentir, y compris les citoyens et les véhicules ; les valeurs élevées donnent un effet de ralenti\nnone = ne rien ralentir\nAvec calendar, les citoyens, les véhicules, la construction et la production conservent leur vitesse normale. Les processus quotidiens tels que la pollution, les prêts et les messages gardent leur intervalle habituel.
daynight.offset.label = Moment où la nuit arrive
daynight.offset.description = Décale la nuit au sein du jour calendaire.\n0 = l'obscurité commence peu après le milieu de la journée\n0.5 = l'obscurité commence au changement de date\nAvec une valeur autre que 0, un cycle de 13 jours ne correspond plus exactement au jeu de base.
daynight.fade.label = Adapter les transitions lumineuses
daynight.fade.description = ON raccourcit les transitions entre le matin, le jour, le soir et la nuit pour les adapter au cycle configuré.\nOFF utilise les transitions lentes du jeu de base. Avec des cycles courts, elles peuvent se chevaucher et rendre l'éclairage délavé.
daynight.vehicle_scale.label = Vitesse des véhicules
daynight.vehicle_scale.description = Vitesse des camions, trains, navires et avions. Fonctionne indépendamment des autres réglages.\n1 = vitesse du jeu de base\n2 = vitesse divisée par deux\n0.5 = vitesse doublée\nValeur plus élevée = véhicules plus lents
daynight.sim_scale.label = Vitesse de tout le reste
daynight.sim_scale.description = Vitesse des citoyens, de la construction, de la production, de l'usure et des animations.\n1 = vitesse du jeu de base\n2 = vitesse divisée par deux\n0.5 = vitesse doublée\nValeur plus élevée = simulation plus lente
daynight.probe.label = Consigner la durée des jours dans le journal
daynight.probe.description = ON consigne la durée réelle de chaque jour calendaire et de chaque transition lumineuse dans tesmioloader.log. À utiliser uniquement pour le dépannage et les vérifications après une mise à jour du jeu.
walking.description = Distances parcourues à pied par les citoyens et en voiture par les automobilistes entre le domicile, le travail et le parking.
walking.group.distances = Distances
walking.group.distances.description = Mesurées le long des routes et des chemins piétonniers, et non à vol d'oiseau. Un bâtiment à 400 m de l'autre côté de la rivière peut nécessiter 1200 m de marche.
walking.group.diagnostics = Dépannage
walking.enabled.label = Plugin activé
walking.enabled.description = ON active les distances de marche et de conduite configurées.
walking.distance.label = Distance de marche (m)
walking.distance.description = Plus long trajet qu'un citoyen acceptera de parcourir à pied. Le jeu de base utilise 480 m.\nValeur plus élevée = davantage de bâtiments accessibles à pied et davantage de liaisons créées lors de la construction\n0 = aucune limite ; la construction peut alors prendre plusieurs secondes dans une grande ville\n20000 = valeur maximale acceptée
walking.car_distance.label = Distance de conduite des automobilistes (m)
walking.car_distance.description = Plus long trajet autorisé entre le domicile, le travail et le parking. Le jeu de base utilise 2500 m.\nValeur plus élevée = les automobilistes vont plus loin\nDéfinissez une valeur supérieure à la distance de marche. À valeurs égales, la voiture n'offre aucun avantage de portée.
walking.regen_on_load.label = Reconstruire les liaisons au chargement d'une sauvegarde
walking.regen_on_load.description = Les liaisons piétonnes et de stationnement sont stockées dans la sauvegarde.\nON reconstruit toutes les liaisons au chargement, afin que les distances configurées s'appliquent aussi aux villes existantes.\nOFF applique les distances configurées uniquement aux bâtiments nouvellement construits.
walking.probe.label = Consigner les valeurs de contrôle dans le journal
walking.probe.description = ON consigne dans tesmioloader.log les valeurs trouvées dans le jeu avant leur modification par le plugin. À utiliser uniquement pour le dépannage et les vérifications après une mise à jour du jeu.
accumulator.description = Des batteries pour votre réseau électrique. Un bâtiment doté d'une grande réserve d'énergie se charge lorsque l'électricité est excédentaire et la restitue lorsqu'elle manque.
accumulator.group.battery = Batterie
accumulator.group.battery.description = Bâtiments considérés comme des batteries et vitesse à laquelle ils se chargent et se déchargent.
accumulator.group.window = Fenêtre du bâtiment
accumulator.group.grid = Réseau électrique
accumulator.group.diagnostics = Dépannage
accumulator.enabled.label = Plugin activé
accumulator.enabled.description = ON active la charge et la décharge des bâtiments servant de batteries.\nOFF arrête la décharge. Les bâtiments restent en place et peuvent continuer à se charger.
accumulator.building_types.label = Types de bâtiments
accumulator.building_types.description = Types de bâtiments pouvant servir de batteries. Séparez plusieurs nombres par des virgules.\n19 = transformateur\n18 = sous-station\nN'utilisez pas 17 : une centrale ne peut pas recevoir d'électricité et ne se chargerait jamais.
accumulator.min_capacity.label = Capacité minimale pour être considéré comme une batterie
accumulator.min_capacity.description = Capacité de stockage minimale pour qu'un bâtiment soit considéré comme une batterie. Cela exclut les petites réserves des sous-stations ordinaires.\nValeur plus élevée = moins de bâtiments considérés comme des batteries\nValeur plus faible = davantage de bâtiments considérés comme des batteries\nLe « Stationary Accumulator » fourni a une capacité de 5000.
accumulator.charge_rate.label = Vitesse de charge (puissance par seconde)
accumulator.charge_rate.description = Quantité maximale d'électricité qu'une batterie absorbe par seconde. Cette limite empêche une batterie vide de priver toute une ville d'électricité.\nValeur plus élevée = charge plus rapide et sollicitation accrue du réseau\nValeur plus faible = charge plus lente et sollicitation réduite du réseau\nÀ titre de comparaison, une centrale à charbon fournit 70 et une éolienne 15.
accumulator.discharge_rate.label = Vitesse de décharge (puissance par seconde)
accumulator.discharge_rate.description = Quantité maximale d'électricité qu'une batterie fournit par seconde. Elle n'en fournit que lorsque le réseau en manque.\nValeur plus élevée = compense des déficits de puissance plus importants\nValeur plus faible = l'énergie stockée dure plus longtemps\nExemple : à 60, une batterie pleine d'une capacité de 5000 remplace une centrale pendant un peu plus de 80 secondes.
accumulator.panel.label = Ligne de charge dans la fenêtre de la batterie
accumulator.panel.description = ON ajoute le niveau de charge à la fenêtre de la batterie, par exemple « Charge: 4210.5 / 5000 (84.2 %) ».
accumulator.panel_caption.label = Libellé de cette ligne
accumulator.panel_caption.description = Mot placé devant le niveau de charge. Lettres uniquement, sans accents ni caractères spéciaux, sinon le jeu affiche des caractères illisibles.
accumulator.gauges.label = Calculer les indicateurs de la fenêtre à partir de la batterie
accumulator.gauges.description = ON remplace l'affichage incorrect du jeu par les flux réels entrant et sortant de la batterie.\nOFF utilise l'affichage normal du jeu. Il peut indiquer une puissance de 0 et « sans alimentation électrique » pendant la charge de la batterie.
accumulator.spread_voltage.label = Expérience : transmettre la tension aux voisins (laisser désactivé)
accumulator.spread_voltage.description = ON n'a aucun effet. Cette ancienne fonction a été remplacée sur le plan technique. Laissez sur OFF.
accumulator.trace.label = Consigner les voisins de la première batterie
accumulator.trace.description = ON consigne la quantité d'électricité reçue par les bâtiments voisins de la première batterie. Dépannage uniquement ; peut réduire les performances.
accumulator.log_seconds.label = Secondes entre les lignes du journal de batterie
accumulator.log_seconds.description = Intervalle entre les messages d'état de la batterie dans tesmioloader.log. Chaque message comprend la charge, le flux entrant et le flux sortant.\n0 = aucun message d'état\nValeur plus élevée = consignation moins fréquente
accumulator.probe.label = Secondes entre les listes de bâtiments dans le journal
accumulator.probe.description = Intervalle entre les listes de tous les bâtiments stockant de l'électricité dans tesmioloader.log. À utiliser uniquement lorsqu'une batterie n'est pas reconnue ou après une mise à jour du jeu.\n0 = ne pas écrire ces listes\nValeur plus élevée = consignation moins fréquente
cities.description = Taille et forme de chaque ville. Dans le jeu de base, chaque ville est un cercle de 1000 m de rayon. Avec ce plugin, vous réglez le rayon de chaque ville séparément, éventuellement avec une forme carrée, directement dans sa fenêtre. Les valeurs sont stockées dans la sauvegarde.
cities.group.cities = Villes
cities.group.slider = Curseur de rayon
cities.group.slider.description = Étendue du curseur dans la fenêtre de la ville et variation produite par un clic sur + ou -.
cities.group.layout = Disposition dans la fenêtre de la ville
cities.group.layout.description = Position des deux nouvelles lignes dans la fenêtre de la ville. Les nombres sont des positions dans l'unité propre à la fenêtre du jeu ; la fenêtre fait environ 500 de large.
cities.group.overlay = Grille de points au sol
cities.group.diagnostics = Dépannage
cities.enabled.label = Plugin activé
cities.enabled.description = ON active les tailles et formes de ville personnalisées.
cities.window.label = Curseur de rayon et case de forme dans la fenêtre de la ville
cities.window.description = ON affiche le curseur de rayon et la case de forme carrée dans la fenêtre de la ville.\nOFF masque les deux ; les valeurs définies sont conservées, mais vous ne pouvez plus les modifier.
cities.adopt.label = Créer une ville pour les bâtiments sans rattachement
cities.adopt.description = Lorsque vous réduisez une ville, des bâtiments peuvent se retrouver à l'extérieur et ne plus appartenir à aucune ville.\nON fonde pour eux une nouvelle ville avec un nom aléatoire et la date du jour, comme le fait le jeu lui-même.\nOFF les laisse sans ville ; le comportement du jeu dans ce cas n'a pas été testé.
cities.radius.label = Rayon par défaut (m)
cities.radius.description = Rayon par défaut des villes que vous n'avez pas configurées individuellement. La valeur s'applique à toutes les cartes.\n1000 = rayon du jeu de base\nValeur plus élevée = villes plus grandes\nValeur plus faible = villes plus petites
cities.square.label = Forme carrée par défaut
cities.square.description = ON donne une forme carrée aux villes sans configuration individuelle.\nOFF utilise un cercle comme dans le jeu de base.
cities.radius_min.label = Rayon minimal du curseur (m)
cities.radius_min.description = Valeur à l'extrémité gauche du curseur.
cities.radius_max.label = Rayon maximal du curseur (m)
cities.radius_max.description = Valeur à l'extrémité droite du curseur. Le curseur comporte 100 pas ; de 200 à 5000, un pas correspond à 48 m.
cities.step.label = Pourcentage par clic sur un bouton
cities.step.description = Pourcentage de la plage du curseur modifié par un clic sur + ou -. Ne s'applique pas lorsque vous faites glisser le curseur.\nValeur plus élevée = variation plus importante par clic\nValeur plus faible = variation plus fine par clic
cities.label_x.label = Position du libellé
cities.label_x.description = Distance entre le libellé et le bord gauche de la fenêtre.
cities.widget_x.label = Position des commandes
cities.widget_x.description = Distance du curseur et de la case par rapport au bord gauche de la fenêtre. Le curseur nécessite environ 225.
cities.checkbox_dy.label = Déplacer la ligne de la case vers le haut ou le bas
cities.checkbox_dy.description = Déplace la case vers le haut ou le bas pour qu'elle ne chevauche pas le curseur.\nValeur plus élevée = case plus basse\nValeur plus faible = case plus haute
cities.overlay.label = Adapter la superposition au rayon et à la forme
cities.overlay.description = Lorsqu'une fenêtre de ville est ouverte, le jeu affiche une grille de points bleus au sol, mais toujours pour un cercle de 1000 m de rayon.\nON adapte la grille à votre rayon et à votre forme.\nOFF la laisse comme dans le jeu de base.
cities.overlay_step.label = Espacement des points de la superposition (m)
cities.overlay_step.description = Distance entre les points représentant la limite de la ville.\n0 = utiliser automatiquement un vingtième du rayon, avec un minimum de 50 m\nValeur plus faible = affichage plus dense et coût en performances plus élevé
cities.probe.label = Consigner les villes dans le journal
cities.probe.description = ON consigne le rayon, la forme et le nombre de bâtiments de chaque ville dans tesmioloader.log après le chargement. D'autres messages sont écrits tant qu'une fenêtre de ville est ouverte. Dépannage uniquement ; le journal peut grossir rapidement.
depletion.description = Les gisements s'épuisent. Une mine en activité retire visiblement le gisement de la carte, et moins il en reste, moins elle produit. L'extraction est stockée dans la sauvegarde ; si vous désactivez le plugin plus tard, les ressources extraites ne reviennent pas. Testez d'abord sur une copie de votre sauvegarde.
depletion.group.depletion = Extraction
depletion.group.window = Fenêtre de la mine
depletion.group.diagnostics = Dépannage
depletion.enabled.label = Plugin activé
depletion.enabled.description = ON permet aux gisements sélectionnés de s'épuiser au fil de l'extraction.\nOFF arrête l'épuisement supplémentaire. Les ressources déjà retirées ne sont pas restaurées.
depletion.tonnes_per_texel.label = Tonnes par point de carte
depletion.tonnes_per_texel.description = Tonnes qu'une mine peut extraire d'un point entièrement rempli de la carte des ressources. Les points moins riches fournissent proportionnellement moins.\nValeur plus élevée = les gisements durent plus longtemps\nValeur plus faible = les gisements s'épuisent plus vite\nÀ titre de comparaison, une mine avec un rayon de recherche de 210 m couvre plusieurs milliers de points de carte.
depletion.vanilla.label = Gisements épuisables du jeu de base
depletion.vanilla.description = Gisements du jeu de base pouvant s'épuiser. Séparez plusieurs valeurs par des virgules.\noil, iron, coal, uranium, bauxite, gravel = uniquement les gisements indiqués\nall = tous les gisements\nnone = aucun gisement du jeu de base\nname:value = tonnes personnalisées par point de carte, par exemple iron:3000\nLes gisements de deposits.ini sont toujours inclus.\ngravel efface définitivement la texture visible du sol et nécessite une valeur beaucoup plus élevée en raison de sa petite zone de recherche. Omettez gravel pour conserver le comportement du jeu de base.
depletion.flush_seconds.label = Secondes entre les enregistrements de l'extraction
depletion.flush_seconds.description = Secondes entre les mises à jour de la carte des ressources. La production et la qualité changent immédiatement ; seules la minicarte et la sauvegarde suivent cet intervalle.\nValeur plus faible = mises à jour plus fréquentes et coût en performances plus élevé\nNe mettez pas à jour plus de quatre fois par seconde.
depletion.panel.label = Ligne du gisement restant dans la fenêtre de la mine
depletion.panel.description = ON affiche le stock restant dans la fenêtre de la mine et augmente légèrement sa hauteur, par exemple « Restant: 251.4 kt / 259.3 kt (96.9 %) ».
depletion.panel_caption.label = Libellé de cette ligne
depletion.panel_caption.description = Mot placé devant la quantité restante. Lettres uniquement, sans accents ni caractères spéciaux, sinon le jeu affiche des caractères illisibles.
depletion.log_seconds.label = Intervalle des lignes de progression (secondes)
depletion.log_seconds.description = Secondes entre les messages d'état des mines dans tesmioloader.log. Chaque message comprend la quantité restante, la quantité totale et la qualité.\n0 = aucun message d'état\nValeur plus élevée = consignation moins fréquente\nObservez plusieurs jours de jeu pour trouver une valeur adaptée de tonnes par point de carte.
easystart.description = Les besoins des citoyens apparaissent progressivement au fil des années. Un besoin pas encore débloqué ne compte pas pour le bonheur et la santé ; les citoyens continuent à fréquenter les lieux concernés et à y faire leurs achats, mais les conséquences n'apparaissent qu'à partir de l'année prévue.
easystart.group.general = Éléments à différer
easystart.group.unlock = Années de déblocage
easystart.group.unlock.description = Année à partir de laquelle l'exigence s'applique, dès le 1er janvier. Le calendrier est conçu pour une république fondée en 1920. Avec un départ en 1960, les années prédéfinies sont déjà passées.\noff = ne pas différer ; comportement du jeu de base\nalways = appliquer dès le premier jour de jeu\nUne année = débloquer cette année-là
easystart.group.diagnostics = Dépannage
easystart.enabled.label = Plugin activé
easystart.enabled.description = ON débloque les besoins et les exigences en services essentiels selon le calendrier configuré.
easystart.demands.label = Différer les neuf besoins des citoyens
easystart.demands.description = ON diffère la nourriture, la viande, les vêtements, l'électronique, l'alcool, la religion, la culture, le sport et la santé jusqu'à leurs années de déblocage configurées.
easystart.utilities.label = Différer les trois services essentiels des bâtiments
easystart.utilities.description = ON diffère les exigences en électricité, en eau et en chauffage jusqu'à leurs années de déblocage configurées.
easystart.warnings.label = Différer les avertissements dans la fenêtre du bâtiment
easystart.warnings.description = ON masque les avertissements associés jusqu'à l'année de déblocage, par exemple « bâtiment sans alimentation électrique ».
easystart.pin_status.label = Maintenir la satisfaction des besoins bloqués
easystart.pin_status.description = ON maintient la satisfaction d'un besoin bloqué à la valeur ci-dessous.\nOFF laisse la satisfaction continuer à baisser ; elle peut déjà être très basse au déblocage du besoin.
easystart.locked_status.label = Satisfaction pendant le blocage
easystart.locked_status.description = Satisfaction tant qu'un besoin est bloqué. Pour la nourriture, la valeur représente la satiété.\n1.0 = pleinement satisfait ou nourri\n0.5 = valeur moyenne avec une amélioration sensible après le déblocage
easystart.clear_unsatisfied.label = Retirer les besoins bloqués de la liste des besoins non satisfaits
easystart.clear_unsatisfied.description = ON empêche les besoins bloqués de produire le message « N citoyens n'ont pas pu obtenir X ».
easystart.probe.label = Consigner les déblocages dans le journal
easystart.probe.description = ON consigne les besoins qui restent bloqués à chaque changement d'année dans tesmioloader.log. Le premier citoyen concerné est également consigné une fois. Dépannage uniquement.
easystart.food.label = Nourriture
easystart.religion.label = Religion
easystart.meat.label = Viande
easystart.clothes.label = Vêtements
easystart.alcohol.label = Alcool
easystart.sport.label = Sport
easystart.culture.label = Culture
easystart.health.label = Santé
easystart.electricity.label = Électricité
easystart.water.label = Eau (comprend les eaux usées)
easystart.heating.label = Chauffage
easystart.electronics.label = Électronique
easystart.school.label = École
easystart.school.description = Avant cette année, les enfants apprennent sans école, comme avec le réglage d'éducation « Simple » du jeu, et le message « N enfants ne peuvent pas aller à l'école » n'apparaît pas.
easystart.kindergarten.label = École maternelle
easystart.kindergarten.description = Avant cette année, aucun parent ne doit rester à la maison pour un enfant de moins de six ans, et le message « N travailleurs ne peuvent pas travailler car toutes les écoles maternelles … » n'apparaît pas.
plugin.needs = Needs
plugin.needs.description = Gérez les besoins supplémentaires des citoyens et les options du plugin sans modifier le fichier d'origine.
tab.needs.editor = Besoins
group.needs = Besoins des citoyens
group.needs.plugin = Paramètres du plugin
group.needs.plugin.description = Options qui s'appliquent à tous les besoins.
needs.list = Liste des besoins
needs.add = Ajouter un besoin
needs.select_help = Sélectionnez un besoin à gauche ou utilisez + pour ajouter une ressource enregistrée par Resources.
needs.resource = Ressource
needs.resource.help = Ressource que les citoyens doivent demander. Elle doit être enregistrée dans la liste du plugin Resources.
needs.donor = Besoin modèle
needs.donor.description = Besoin existant utilisé comme modèle.\nfood ou meat = pour les magasins alimentaires\nclothes ou eletronics = pour les grands magasins\nalcohol = pour les magasins d'alcool\neletronics est l'orthographe utilisée par le jeu.
needs.factor = Facteur de quantité
needs.factor.description = Quantité de marchandises par rapport au besoin modèle.\n1.0 = même quantité que le modèle\nValeur plus élevée = les citoyens ont besoin de davantage\nValeur plus faible = les citoyens ont besoin de moins
needs.category = Catégorie de magasins
needs.category.description = Magasins qui stockent les marchandises.\nauto = mêmes magasins que pour le besoin modèle\nnone = aucun emplacement automatique ; un bâtiment doit fournir lui-même les marchandises\nbasic = magasins de base uniquement\nmedium = magasins moyens uniquement\nadvanced = grands magasins uniquement\nmediumadvanced = magasins moyens et grands uniquement\nhotel = hôtels uniquement\nUn nombre = écrire directement cette valeur de magasin ; réservé aux utilisateurs connaissant les fichiers du jeu
needs.chance = Probabilité
needs.chance.description = Probabilité de 0 à 1 qu'un citoyen reçoive ce besoin. En dessous de 1, il est attribué indépendamment du besoin modèle.\n0 = aucun citoyen ne le reçoit\n1 = chaque citoyen admissible le reçoit
needs.unhappy = Insatisfaction
needs.unhappy.description = Satisfaction perdue lorsqu'un citoyen ne peut pas obtenir les marchandises.\n0 = aucune perte ; le besoin est seulement affiché\n0.005 à 0.02 = plage habituelle pour un bien de confort\nPlage autorisée : 0 à 1
needs.enabled = Plugin activé
needs.enabled.description = ON active le plugin.\nOFF le désactive complètement au prochain démarrage du jeu.
needs.demand = Ajouter les besoins
needs.demand.description = ON attribue le nouveau besoin aux citoyens.\nOFF n'attribue pas le besoin, mais peut quand même ajouter les marchandises aux magasins.
needs.storage = Approvisionner les magasins
needs.storage.description = ON ajoute les marchandises aux magasins sélectionnés.\nOFF n'ajoute aucun emplacement de stockage ; les citoyens ne peuvent alors trouver les marchandises que dans les bâtiments qui les fournissent eux-mêmes.
needs.max_demands = Besoins par citoyen
needs.max_demands.description = Nombre maximal de besoins supplémentaires qu'un citoyen peut avoir simultanément.\n1 = au plus un besoin supplémentaire\n7 = nombre maximal autorisé
needs.when_full = Lorsque la limite de besoins est atteinte
needs.when_full.description = Comportement lorsqu'un citoyen a déjà le nombre maximal de besoins supplémentaires.\nskip = attendre qu'un emplacement se libère\nreplace = remplacer le besoin modèle cette fois-ci
needs.probe = Journal détaillé
needs.probe.description = ON écrit les listes de besoins des citoyens et les informations sur chaque magasin dans le journal détaillé du plugin.\nOFF écrit uniquement les avertissements. Activez temporairement cette option pour vérifier de nouveaux magasins.
needs.log_seconds = Intervalle des messages de progression (secondes)
needs.log_seconds.description = Secondes entre les messages indiquant le nombre de besoins attribués.\n0 = désactiver ces messages\nValeur plus élevée = consignation moins fréquente
tab.needs.general = Général
plugin.deposits = Deposits
plugin.deposits.description = Gérez les types de gisements absents du jeu de base et les options du plugin sans modifier le fichier d'origine.
tab.deposits.general = Général
tab.deposits.editor = Gisements
group.deposits = Gisements
group.deposits.description = Les gisements d'origine sont protégés et peuvent être masqués ; les gisements personnalisés sont stockés séparément puis fusionnés dans le fichier deposits.ini utilisé par le jeu. Chaque section sauf [deposits] représente un gisement.
group.deposits.plugin = Paramètres du plugin
group.deposits.plugin.description = Les trois sous-systèmes de la section [deposits]. Chacun est désactivé pour tous les gisements lorsque son option est désactivée ici.
deposits.notice = Le numéro de type d'un gisement, son canal de carte et le jeton dans building.ini font partie de la sauvegarde dès qu'une mine les utilise. Supprimer ou renuméroter un gisement utilisé par une sauvegarde peut la rendre inutilisable ; testez d'abord sur une copie.
deposits.list = Liste des gisements
deposits.add = Ajouter un gisement
deposits.select_help = Sélectionnez un gisement à gauche ou utilisez + pour en ajouter un pour une ressource enregistrée par Resources.
deposits.name = Gisement
deposits.name.help = Nom de la section dans deposits.ini. Il désigne le gisement dans le journal et dans le pinceau de l'éditeur ; il ne peut pas être renommé ensuite.
deposits.new_name = Nom du gisement
deposits.new_hint = Seuls les paramètres standard sont demandés ici. Tout le reste (composante, type de bâtiment, épuisement) se trouve dans les paramètres à droite après l'ajout.
deposits.code_patch = Modification du code
deposits.code_patch.description = ON introduit les types de gisements $TYPE_MINE_ configurés dans le jeu pour que les mines puissent les trouver via building.ini. Si les données attendues du jeu ne correspondent plus après une mise à jour, le plugin ne modifie rien.
deposits.minimap_all = Couches de la minicarte
deposits.minimap_all.description = ON affiche un bouton sous les cinq boutons de minicarte du jeu pour chaque gisement du plugin activé individuellement.\nOFF masque tous les boutons des gisements du plugin.
deposits.editor_all = Pinceaux de l'éditeur de terrain
deposits.editor_all.description = ON affiche un pinceau de peinture et un pinceau d'effacement dans l'onglet Ressources de l'éditeur de terrain pour chaque gisement ayant un nom de pinceau.\nOFF masque tous les pinceaux des gisements du plugin.
deposits.token = Jeton du bâtiment
deposits.token.description = Jeton utilisé par une mine dans building.ini pour ce gisement, par exemple $TYPE_MINE_COPPER. Saisissez-le comme $TYPE_MINE_GRAVEL. N'utilisez jamais deux jetons de gisement dans le même building.ini.
deposits.type = Numéro de type
deposits.type.description = Numéro de type unique du gisement. Deux gisements ne doivent pas utiliser le même numéro.\n10 à 127 = plage autorisée\n0 à 9 = réservés au jeu de base\nLa boîte de dialogue propose automatiquement le prochain numéro libre.
deposits.map = Carte
deposits.map.description = Carte sur laquelle le gisement est stocké.\nauto = choisir automatiquement un emplacement libre sur une carte du plugin ; recommandé\nresourcemap ou resourcemap2 = utiliser les cartes du jeu de base\nresourcemap3 à resourcemap10 = utiliser les cartes supplémentaires du plugin\nterrain = utiliser directement le terrain peint, par exemple pour le gravier ; son pinceau apparaît sous ROCKS
deposits.component = Composante
deposits.component.description = Chaque carte possède quatre emplacements, de 0 à 3. Chaque emplacement peut contenir un gisement.\nAvec auto = laisser le champ vide ; le plugin choisit un emplacement libre\nAvec terrain : 2 = couche de gravier\nAvec terrain : 3 = couche d'oasis
deposits.building_type = Type de bâtiment
deposits.building_type.description = Type de bâtiment pouvant exploiter ce gisement.\n7 = mine ; convient à presque tous les gisements\n92 = puits d'eau\nChamp vide = 7
deposits.radius = Rayon de recherche
deposits.radius.description = Distance à laquelle une mine recherche son gisement.\noil, ore, bauxite, gravel, wood, water, watersurface = utiliser la constante correspondante du jeu\nUn nombre = utiliser directement cette distance\nChamp vide = utiliser ore\nSans rayon, la mine ne trouve aucun gisement.
deposits.icon = Icône de minicarte
deposits.icon.description = Ressource dont l'icône apparaît sur le bouton de minicarte. Le plugin utilise l'icône déjà chargée par le jeu ; aucune image séparée n'est nécessaire.\nLes ressources du plugin Resources doivent y être enregistrées.\nChamp vide = aucune icône
deposits.minimap = Bouton de minicarte
deposits.minimap.description = ON ajoute un bouton de minicarte et une couche de superposition pour ce gisement.
deposits.editor = Nom du pinceau de l'éditeur
deposits.editor.description = Nom des pinceaux de peinture et d'effacement dans l'éditeur de terrain. Le même nom est utilisé pour tool_paint_<name>.png et tool_erase_<name>.png dans vfs\media_soviet\editor.\nChamp vide = ne pas créer de pinceau\nAutorisé : jusqu'à 31 lettres, chiffres, _ et -
deposits.deplete = Épuisement par texel
deposits.deplete.description = Ce paramètre est lu par le plugin Depletion. Il définit les tonnes qu'une mine peut extraire d'un point entièrement rempli de la carte des ressources. Les points moins riches fournissent proportionnellement moins.\nLa valeur remplace tonnes_per_texel dans plugins\depletion.ini.\n0 = ce gisement reste infini\nChamp vide = utiliser la valeur globale
deposits.save_warning = Les modifications ne sont écrites dans le fichier deposits.ini utilisé par le jeu que lors de l'enregistrement. Les numéros de type, canaux de carte et jetons des gisements déjà utilisés par une sauvegarde ne doivent pas changer ; testez d'abord sur une copie.
depletion.tab.general = Général
depletion.tab.mining = Extraction
needs.save_warning = Les modifications ne sont écrites dans le fichier needs.ini utilisé par le jeu que lorsque vous enregistrez. Chaque besoin ajoute un emplacement de stockage aux magasins concernés, et cet emplacement fait partie de la sauvegarde. Testez d'abord sur une copie.
bp.name = Buildings Plus
bp.description = De nouveaux bâtiments à partir d'une définition : un bâtiment modèle du jeu et les lignes de building.ini qui diffèrent. Ils sont écrits sous forme d'éléments Workshop complets à chaque démarrage du jeu.
bp.notice = Chaque bâtiment devient un dossier dans media_soviet\workshop_wip avec son propre identifiant Workshop. Laissez l'identifiant vide : au démarrage du jeu, le plugin attribue le prochain numéro libre à partir de 9300000000 et le conserve dans plugins\buildings_plus.ids.ini. Le jeu lit le dossier comme un élément Workshop non publié. Les modifications nécessitent un redémarrage complet. Une sauvegarde contenant un tel bâtiment a besoin du dossier lors du chargement.
bp.tab.general = Général
bp.tab.buildings = Bâtiments
bp.tab.generated = Bâtiments générés
bp.wip = Bâtiments générés dans le dossier du jeu
bp.wip.description = Affiche les bâtiments générés par Buildings Plus ou le plugin buildings d'origine dans media_soviet\workshop_wip. Les informations affichées ici sont lues dans les dossiers.
bp.wip.empty = Aucun bâtiment généré ici pour le moment. Les bâtiments sont générés au démarrage du jeu lorsqu'un bâtiment est activé.
bp.group = Bâtiments
bp.group.notice = Un bâtiment ici est une copie d'un bâtiment du jeu avec d'autres lignes : même modèle visuel, mêmes connexions, votre recette. Choisissez un bâtiment modèle du même type (mine pour mine, usine pour usine).
bp.list = Bâtiments
bp.add = Ajouter
bp.select_help = Sélectionnez un bâtiment à gauche ou utilisez + pour en ajouter un. Le bâtiment modèle est demandé en premier, l'identifiant Workshop peut rester vide ; le nom et les lignes se règlent ensuite à droite.
bp.id = Nom de l'objet
bp.id.help = Nomme le dossier et l'objet du bâtiment généré et apparaît dans le journal. Lettres, chiffres, _ et - uniquement, 64 caractères au maximum ; il ne peut pas être modifié ensuite.
bp.save_warning = Les modifications ne sont écrites dans le fichier buildings_plus.ini utilisé par le jeu que lors de l'enregistrement et prennent effet après un redémarrage complet du jeu. Le plugin écrit alors le dossier dans media_soviet\workshop_wip ; une section contenant une erreur est ignorée et son nom est indiqué dans le journal.
bp.list.note = 256 bâtiments au maximum.
bp.new_name = Nom de l'objet
bp.new_hint = Les espaces deviennent des traits de soulignement et les majuscules deviennent des minuscules.
bp.card.folders = Dossiers générés
bp.card.log = Dépannage
bp.card.new = Nouveau bâtiment
bp.links = Guides
bp.link.readme = README (guide)
bp.prune = Nettoyer les dossiers
bp.prune.description = ON supprime au prochain démarrage du jeu le dossier généré d'un bâtiment que vous avez supprimé ou désactivé (uniquement les dossiers créés par ce plugin).\nOFF conserve ces dossiers ; le jeu continue à charger ces bâtiments.
bp.always = Toujours réécrire
bp.always.description = ON écrit chaque dossier de bâtiment à chaque démarrage du jeu.\nOFF n'écrit un dossier que si sa section, le plugin ou un fichier du bâtiment modèle a changé. Laissez sur OFF.
bp.verbose = Journal détaillé
bp.verbose.description = ON consigne chaque fichier copié et chaque ligne retirée du bâtiment modèle dans logs\tesmioloader.buildings_plus.log.\nOFF écrit uniquement les résultats, avertissements et erreurs.
bp.repair_owner_ids = Compléter l'identifiant du propriétaire
bp.repair_owner_ids.description = ON renseigne votre identifiant Steam dans les bâtiments générés qui n'en ont pas, y compris ceux d'un autre générateur. Sans lui, le jeu signale des éléments Workshop manquants chaque fois que vous chargez une sauvegarde utilisant un tel bâtiment.\nOFF laisse intacts les dossiers des autres générateurs.
bp.card.saves = Sauvegardes
bp.card.saves.description = Une sauvegarde mémorise les stockages de chaque bâtiment en place. Ce réglage permet qu'une nouvelle ligne de stockage d'un de vos bâtiments s'applique aussi à ceux déjà construits.
bp.retrofit = Actualiser les stockages des bâtiments déjà construits
bp.retrofit.description = ON : au chargement d'une sauvegarde, chaque bâtiment généré achevé reçoit, vides, les stockages à ressource unique que vous avez ajoutés à sa section. Si vous modifiez la capacité dans une ligne de stockage, le stockage change aussi ; une réduction attend que le stock puisse y tenir. Un stockage dont vous avez retiré la ligne disparaît des bâtiments dès qu'il est vide.\nOFF : les stockages des bâtiments déjà construits restent inchangés ; les lignes nouvelles et modifiées ne s'appliquent qu'aux bâtiments construits ensuite.
bp.enabled = Bâtiment activé
bp.enabled.description = ON génère ce bâtiment au prochain démarrage du jeu.\nOFF ne le génère pas. Si « Nettoyer les dossiers » est activé, son dossier existant est supprimé au prochain démarrage.
bp.item_id = Identifiant Workshop
bp.item_id.description = Numéro personnalisé possible : de 9000000000 à 9999999999, sauf de 9100000000 à 9199999999 (réservés aux autres générateurs)\nIl nomme le dossier dans workshop_wip, dans le dossier du jeu, et ne doit pas être modifié ensuite.
bp.donor = Bâtiment modèle
bp.donor.description = Bâtiment servant de base à la copie ; pour un bâtiment Workshop, vous devez y être abonné.\nUtilisez « Choisir un modèle... » pour parcourir vos bâtiments. Respectez le type : une mine pour une mine, une usine pour une usine, un magasin pour un magasin.
bp.item_name = Nom dans le jeu
bp.item_name.description = Nom affiché dans le jeu.\nUne valeur contenant des points est considérée comme une clé de traduction et résolue par le plugin Localization, par exemple : localization.lang.salt_mine
bp.desc = Description
bp.desc.description = Description de l'élément Workshop, une ligne par ligne du champ. Sans guillemets.
bp.line = Lignes de building.ini
bp.line.description = Une ligne de building.ini par ligne du champ, par exemple $PRODUCTION raw_salt 1.0. Utilisez « Choisir une ligne… » pour reprendre une ligne du bâtiment modèle et l'adapter. Vos lignes sont placées avant celles du modèle et remplacent : le même jeton ; tous les $TYPE_* ; tous les $STORAGE* avec $RESOURCE_VISUALIZATION ; $PRODUCTION, $CONSUMPTION et $CONSUMPTION_PER_SECOND comme une seule recette. Tout le reste du modèle est conservé.\nPour vos propres ressources, utilisez toujours $STORAGE_IMPORT_SPECIAL ou $STORAGE_EXPORT_SPECIAL en nommant la ressource, sinon le stockage répertorie toutes les ressources de la classe de transport.
bp.strip = Retirer des lignes du modèle
bp.cmd_add = Ajouter à la fin
bp.cmd_add.description = Une commande par ligne : une nouvelle ligne placée avant la fin qui clôt le fichier du modèle. Un bloc de plusieurs lignes s'écrit avec | entre les lignes.
bp.cmd_replace = Remplacer
bp.cmd_replace.description = Une commande par ligne : ancienne ligne | nouvelle ligne. L'ancienne ligne doit apparaître exactement une fois dans le fichier du modèle.
bp.cmd_remove = Retirer
bp.cmd_remove.description = Une commande par ligne : la ligne du fichier du modèle à retirer. Les lignes qui lui appartiennent (points, position) sont retirées avec elle.
bp.cmd_insert = Insérer
bp.cmd_insert.description = Une commande par ligne : 0 ou 1 | ligne repère | nouvelle ligne. 0 place la nouvelle ligne avant la ligne repère, 1 après.
bp.strip.description = Un $TOKEN par ligne, par exemple $WORKERS_NEEDED. Chaque ligne du modèle portant ce jeton est retirée sans remplacement.
bp.life = Résistance
bp.life.description = Vide = 3000\nLIFE dans renderconfig.ini : ce que le bâtiment peut supporter avant de s'effondrer. Comme la plupart des bâtiments du jeu.
bp.card.lines = Lignes
bp.item_id.empty = le plugin attribue le prochain numéro libre à partir de 9300000000 au démarrage du jeu.
bp.item_name.empty = le nom de l'objet ; déconseillé.
needs_plus.card.log = Dépannage
resources_plus.card.log = Dépannage
resources_plus.card.plugin = Plugin
resources_plus.custom_report = Consigner les fiches clonées
resources_plus.custom_report.description = ON consigne, pour chaque ressource ayant un modèle, ce que le clone a réellement hérité (classe de transport, facteurs, indicateurs). Les ressources sans modèle sont toujours répertoriées.\nOFF répertorie uniquement celles sans modèle.
resources_plus.customs_hook = Actualiser les postes de douane
resources_plus.customs_hook.description = ON ajoute les nouvelles ressources à la liste commerciale des postes de douane déjà existants.\nOFF correspond au jeu de base : un poste de douane ne commerce que les ressources connues lors de sa construction ; seules sa démolition et sa reconstruction permettent alors de l'actualiser.
resources_plus.customs_probe = Consigner les entrées des postes de douane
resources_plus.customs_probe.description = ON écrit dans tesmioloader.log une ligne par ressource ajoutée à un poste de douane. Passez sur OFF lorsque vos postes de douane affichent les ressources attendues.
resources_plus.price_hook = Appliquer les prix du fichier INI
resources_plus.price_hook.description = ON active [base_price] et [price] : les prix de base sont définis avant le calcul des prix du jeu, les prix fixes après.\nOFF laisse le jeu déterminer les prix.
resources_plus.price_report = Consigner le tableau des prix
resources_plus.price_report.description = ON consigne le prix, le prix de base et la catégorie de prix de chaque ressource de votre liste dans tesmioloader.log après chaque calcul des prix du jeu. Un prix de 0.00 signifie qu'aucun bâtiment ne la produit.\nOFF n'écrit rien.
tab.resources_plus.general = Général
resources.heading.basics = Transport et catégorie de prix
resources.heading.cargo = Marchandise et matériau
resources.heading.fixed = Prix fixes
resources.heading.market = Valeurs de marché
resources.heading.prices = Prix dans la fiche

resources_plus.heading.names = Noms selon la langue du jeu
detail.name_language.description = Nom de cette ressource lorsque le jeu utilise cette langue. Vide : le nom d'affichage ci-dessus est utilisé. L'anglais n'a pas besoin de champ : le nom d'affichage est le nom anglais.
detail.name_german = Allemand
detail.name_bulgarian = Bulgare
detail.name_chinese = Chinois (simplifié)
detail.name_chinesetraditional = Chinois (traditionnel)
detail.name_czech = Tchèque
detail.name_french = Français
detail.name_hungarian = Hongrois
detail.name_italian = Italien
detail.name_japanese = Japonais
detail.name_korean = Coréen
detail.name_polish = Polonais
detail.name_portuguesebrazil = Portugais (Brésil)
detail.name_romanian = Roumain
detail.name_russian = Russe
detail.name_serbian = Serbe
detail.name_slovak = Slovaque
detail.name_spanish = Espagnol
detail.name_turkish = Turc
detail.name_ukrainian = Ukrainien
