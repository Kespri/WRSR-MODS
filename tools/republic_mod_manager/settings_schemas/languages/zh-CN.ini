[language]
name = 简体中文

[strings]
plugin.resources = Resources
plugin.resources.description = 管理资源、属性以及可选的价格覆盖设置。
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = 使用 Resources Plus 添加自定义资源：与原版相同的列表，保存在 plugins\resources_plus.ini 中，并修复退出时崩溃的问题。
resources_plus.save_warning = 点击保存后，修改才会写入 plugins\resources_plus.ini。删除存档已经使用的资源可能损坏该存档。
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = 使用 Needs Plus 添加自定义市民需求：与原版相同的列表，保存在 plugins 文件夹中的 needs_plus.ini 文件内，首次启动时从 needs.ini 导入。
needs_plus.save_warning = 点击保存后，修改才会写入 plugins 文件夹中的 needs_plus.ini。每项需求都会向相关商店添加一个存储槽，而该槽会成为存档的一部分；请先在存档副本上测试。
tab.resources.editor = 资源
group.resource_definitions = 资源定义
detail.transport = 运输类别
detail.transport.description = 决定哪些车辆和仓库能够运输或存储该资源。只需选择名称；插件会补充基础游戏中该类别的数值。
detail.kind = 价格类型
detail.kind.description = 0 原材料，1 制成品，2 食品/服装，3 高级材料，4 电子产品。
detail.record_price = 资源记录的初始价格
detail.record_price.description = 资源记录内可选的 RUB 和 USD 初始值。
detail.record_base_price = 资源记录的初始基础价格
detail.record_base_price.description = 资源记录内可选的 RUB 和 USD 基础值。
detail.trade_mult = 贸易乘数
detail.trade_mult.description = 出售和购买乘数，通常为 0.95、1.05。
detail.market_rub = RUB 市场数据块
detail.market_usd = USD 市场数据块
detail.market.description = 两个市场数值和一个可选系数。\n（参见 INI 文件中的说明）
detail.packed = 包装货物
detail.packed.description = 货物显示方式：自动、散装或包装。
detail.family = 材料族
detail.family.description = 决定材料堆放在建筑工地时的外观，并很可能决定它会变成哪种废物。每个材料族包含一种废物资源。INI 文件中 10 至 19 的编号会以名称显示。
detail.cargo = 货物几何模型
detail.cargo.description = 选择用于货物可视化的几何模型。
detail.pinned_base_price = 固定基础价格
detail.pinned_base_price.description = [base_price] 中可选的 RUB 和 USD 数值。留空表示没有自定义条目。
detail.forced_price = 强制最终价格
detail.forced_price.description = [price] 中可选的 RUB 和 USD 数值。留空表示由游戏计算价格。

; --- 已安装上游插件的本地配置架构（自 0.13.0 起）---
daynight.description = 每个日历日各有一次日出和日落。在基础游戏中，从白天到夜晚再回到白天需要 13 个日历日，接近两周。使用此插件可将整个周期缩短到一天。
daynight.group.cycle = 昼夜
daynight.group.cycle.description = 昼夜周期的时长，以及夜晚何时到来。
daynight.group.pace = 运行速度
daynight.group.pace.description = 两项独立控制：一项用于车辆，另一项用于其他所有内容。不论上面的设置如何，它们始终生效。
daynight.group.diagnostics = 故障排查
daynight.enabled.label = 启用插件
daynight.enabled.description = ON 启用所配置的昼夜周期。
daynight.cycle_days.label = 每个昼夜周期的日历天数
daynight.cycle_days.description = 从一次日出到下一次日出的日历天数。\n1 = 每天各有一次日出和日落\n2 至 12 = 按比例延长周期\n13 = 基础游戏的周期
daynight.day_scale.label = 一天的时长（日历减速程度）
daynight.day_scale.description = 一个日历日相对于基础游戏延长多少。\nauto = 自动减慢日历以匹配光照周期；推荐\n1 = 不减慢日历；昼夜此时会加快 13 倍\n2 至 100 = 按此倍数减慢日历\n在“减慢哪些部分”中选择游戏中需要减速的部分。
daynight.slow.label = 减慢哪些部分
daynight.slow.description = 游戏中需要减速的部分。\ncalendar = 只减慢日历；推荐\nworld = 减慢一切，包括市民和车辆；较高数值看起来像慢动作\nnone = 不减慢任何内容\n使用 calendar 时，市民、车辆、建设和生产保持正常速度。污染、贷款和消息等每日流程保持通常的间隔。
daynight.offset.label = 夜晚到来的时间
daynight.offset.description = 在日历日内移动夜晚的位置。\n0 = 在一天的中点稍后开始天黑\n0.5 = 日期变化时开始天黑\n使用任何非 0 的数值时，13 天的周期将不再与基础游戏完全一致。
daynight.fade.label = 缩放光照过渡时间
daynight.fade.description = ON 缩短早晨、白天、傍晚和夜晚之间的过渡，以匹配所配置的周期。\nOFF 使用基础游戏中缓慢的过渡。周期较短时，过渡可能重叠，使光照显得灰白。
daynight.vehicle_scale.label = 车辆速度
daynight.vehicle_scale.description = 卡车、火车、船舶和飞机的速度。独立于其他设置生效。\n1 = 基础游戏速度\n2 = 一半速度\n0.5 = 两倍速度\n数值越高 = 车辆越慢
daynight.sim_scale.label = 其他所有内容的速度
daynight.sim_scale.description = 市民、建设、生产、磨损和动画的速度。\n1 = 基础游戏速度\n2 = 一半速度\n0.5 = 两倍速度\n数值越高 = 模拟越慢
daynight.probe.label = 将每天的时长写入日志
daynight.probe.description = ON 将每个日历日和光照过渡的实际时长写入 tesmioloader.log。仅用于故障排查及游戏更新后的检查。
walking.description = 市民的步行距离，以及汽车拥有者在住宅、工作地点和停车场之间的驾车距离。
walking.group.distances = 距离
walking.group.distances.description = 沿道路和人行道测量，而非直线距离。河对岸直线距离为 400 m 的建筑可能需要步行 1200 m 才能到达。
walking.group.diagnostics = 故障排查
walking.enabled.label = 启用插件
walking.enabled.description = ON 启用所配置的步行和驾车距离。
walking.distance.label = 步行距离 (m)
walking.distance.description = 市民愿意步行的最长路线。基础游戏使用 480 m。\n数值越高 = 更多建筑处于步行范围内，建设时会创建更多连接\n0 = 无限制；在大城市中，建设此时可能需要几秒钟\n20000 = 可接受的最大值
walking.car_distance.label = 汽车拥有者的驾车距离 (m)
walking.car_distance.description = 住宅、工作地点和停车场之间允许的最长驾车路线。基础游戏使用 2500 m。\n数值越高 = 汽车拥有者可开得更远\n请将其设为高于步行距离。数值相同时，汽车不会提供距离优势。
walking.regen_on_load.label = 加载存档时重建连接
walking.regen_on_load.description = 步行和停车连接保存在存档中。\nON 在加载存档时重建所有连接，使所配置的距离也能影响现有城市。\nOFF 仅对新建建筑应用所配置的距离。
walking.probe.label = 将检查数值写入日志
walking.probe.description = ON 将插件修改前在游戏中找到的数值写入 tesmioloader.log。仅用于故障排查及游戏更新后的检查。
accumulator.description = 为电网提供蓄电池。拥有大型电力储存空间的建筑会在电力有余时充电，并在电力不足时放电。
accumulator.group.battery = 蓄电池
accumulator.group.battery.description = 哪些建筑被视为蓄电池，以及它们充放电的速度。
accumulator.group.window = 建筑窗口
accumulator.group.grid = 电网
accumulator.group.diagnostics = 故障排查
accumulator.enabled.label = 启用插件
accumulator.enabled.description = ON 启用蓄电池建筑的充放电。\nOFF 停止放电。建筑会保留，并仍可充电。
accumulator.building_types.label = 建筑类型
accumulator.building_types.description = 可以用作蓄电池的建筑类型。多个编号用逗号分隔。\n19 = 变压器\n18 = 变电站\n不要使用 17：发电厂无法接收电力，永远不会充电。
accumulator.min_capacity.label = 被视为蓄电池的最低储存容量
accumulator.min_capacity.description = 建筑被视为蓄电池所需的最低储存容量。用于排除普通变电站的小型储存空间。\n数值越高 = 被视为蓄电池的建筑越少\n数值越低 = 被视为蓄电池的建筑越多\n附带的“Stationary Accumulator”容量为 5000。
accumulator.charge_rate.label = 充电速度（每秒功率）
accumulator.charge_rate.description = 蓄电池每秒接收的最大功率。此限制可防止空蓄电池抢走整座城市的电力。\n数值越高 = 充电越快，电网负载越大\n数值越低 = 充电越慢，负载越小\n作为参考，燃煤电厂提供 70，风力涡轮机提供 15。
accumulator.discharge_rate.label = 放电速度（每秒功率）
accumulator.discharge_rate.description = 蓄电池每秒提供的最大功率。仅在电网电力不足时供电。\n数值越高 = 可补足更大的功率缺口\n数值越低 = 储存的能量可用更久\n示例：设为 60 时，容量 5000 的满电蓄电池可代替发电厂工作略多于 80 秒。
accumulator.panel.label = 在蓄电池窗口显示电量行
accumulator.panel.description = ON 在蓄电池窗口中添加电量，例如“Dianliang: 4210.5 / 5000 (84.2 %)”。
accumulator.panel_caption.label = 该行的标题
accumulator.panel_caption.description = 电量数值前的单词。只能使用不带变音符号的拉丁字母，不能使用汉字或特殊字符，否则游戏会显示乱码。
accumulator.gauges.label = 根据蓄电池计算窗口仪表
accumulator.gauges.description = ON 将游戏中错误的显示替换为蓄电池实际的输入和输出流量。\nOFF 使用正常游戏显示。蓄电池充电时，它可能显示功率为 0 和“无电力供应”。
accumulator.spread_voltage.label = 实验：向相邻建筑传递电压（保持关闭）
accumulator.spread_voltage.description = ON 没有效果。此旧功能在技术上已被替代。请保持 OFF。
accumulator.trace.label = 记录首个蓄电池的相邻建筑
accumulator.trace.description = ON 将首个蓄电池相邻建筑收到的电量写入日志。仅用于故障排查；可能影响性能。
accumulator.log_seconds.label = 蓄电池日志行之间的秒数
accumulator.log_seconds.description = tesmioloader.log 中蓄电池状态消息的间隔。每条消息包含电量、输入和输出。\n0 = 不记录状态消息\n数值越高 = 日志记录越少
accumulator.probe.label = 日志中建筑列表之间的秒数
accumulator.probe.description = tesmioloader.log 中所有电力储存建筑列表的记录间隔。仅在蓄电池无法识别或游戏更新后使用。\n0 = 不记录这些列表\n数值越高 = 日志记录越少
cities.description = 设置每座城市的大小和形状。基础游戏中每座城市都是半径 1000 m 的圆。此插件可让你直接在城市窗口中分别设置每座城市的半径，也可选择方形。数值保存在存档中。
cities.group.cities = 城市
cities.group.slider = 半径滑块
cities.group.slider.description = 城市窗口中滑块的范围，以及点击一次 + 或 - 会改变多少。
cities.group.layout = 城市窗口布局
cities.group.layout.description = 两个新增行在城市窗口中的位置。数值使用游戏窗口自身的单位；窗口宽度约为 500。
cities.group.overlay = 地面点阵
cities.group.diagnostics = 故障排查
cities.enabled.label = 启用插件
cities.enabled.description = ON 启用自定义城市大小和形状。
cities.window.label = 城市窗口中的半径滑块和方形复选框
cities.window.description = ON 在城市窗口显示半径滑块和方形复选框。\nOFF 隐藏两者；已设置的数值会保留，但无法再修改。
cities.adopt.label = 为无归属建筑建立独立城市
cities.adopt.description = 缩小城市时，建筑可能落在城市之外，不再属于任何城市。\nON 会像游戏本身一样，用随机名称和今天的日期为它们建立新城市。\nOFF 使它们保持无城市归属；游戏此时的行为尚未测试。
cities.radius.label = 默认半径 (m)
cities.radius.description = 未单独配置的城市所用的默认半径。此数值适用于每张地图。\n1000 = 基础游戏半径\n数值越高 = 城市越大\n数值越低 = 城市越小
cities.square.label = 默认使用方形
cities.square.description = ON 将未单独配置的城市设为方形。\nOFF 使用基础游戏中的圆形。
cities.radius_min.label = 滑块最小半径 (m)
cities.radius_min.description = 滑块最左端的数值。
cities.radius_max.label = 滑块最大半径 (m)
cities.radius_max.description = 滑块最右端的数值。滑块有 100 步；范围为 200 至 5000 时，每步为 48 m。
cities.step.label = 每次点击按钮的百分比
cities.step.description = 点击一次 + 或 - 时改变的滑块范围百分比。拖动滑块时不适用。\n数值越高 = 每次点击改变越大\n数值越低 = 每次点击调整越精细
cities.label_x.label = 标签位置
cities.label_x.description = 标签距窗口左边缘的距离。
cities.widget_x.label = 控件位置
cities.widget_x.description = 滑块和复选框距窗口左边缘的距离。滑块需要约 225。
cities.checkbox_dy.label = 上下移动复选框所在行
cities.checkbox_dy.description = 上下移动复选框，避免与滑块重叠。\n数值越高 = 复选框越靠下\n数值越低 = 复选框越靠上
cities.overlay.label = 边界显示跟随半径和形状
cities.overlay.description = 城市窗口打开时，游戏会在地面显示蓝色点阵，但始终只对应半径 1000 m 的圆。\nON 使点阵适应你的半径和形状。\nOFF 保持基础游戏的显示。
cities.overlay_step.label = 边界点阵间距 (m)
cities.overlay_step.description = 城市边界显示中各点之间的距离。\n0 = 自动使用半径的二十分之一，至少为 50 m\n数值越低 = 显示越密集，性能开销越大
cities.probe.label = 将城市写入日志
cities.probe.description = ON 在加载后将每座城市的半径、形状和建筑数量写入 tesmioloader.log。城市窗口打开时会记录更多消息。仅用于故障排查；日志可能迅速增大。
depletion.description = 矿藏会耗尽。工作中的矿井会明显地从地图上采走矿藏，剩余越少，产量越低。开采情况保存在存档中；以后关闭插件也不会恢复已开采的部分。请先在存档副本上测试。
depletion.group.depletion = 开采
depletion.group.window = 矿井窗口
depletion.group.diagnostics = 故障排查
depletion.enabled.label = 启用插件
depletion.enabled.description = ON 使所选矿藏随着开采而耗尽。\nOFF 停止进一步消耗。已移除的资源不会恢复。
depletion.tonnes_per_texel.label = 每个地图点的吨数
depletion.tonnes_per_texel.description = 矿井可从资源地图中一个完全充满的点开采的吨数。较贫瘠的点按比例减少。\n数值越高 = 矿藏可用越久\n数值越低 = 矿藏更快耗尽\n作为参考，搜索半径为 210 m 的矿井覆盖数千个地图点。
depletion.vanilla.label = 会耗尽的基础游戏矿藏
depletion.vanilla.description = 允许耗尽的基础游戏矿藏。多个值用逗号分隔。\noil, iron, coal, uranium, bauxite, gravel = 仅指定矿藏\nall = 所有矿藏\nnone = 不消耗任何基础游戏矿藏\nname:value = 自定义每个地图点的吨数，例如 iron:3000\ndeposits.ini 中的矿藏始终包含在内。\ngravel 会永久磨掉可见的地面纹理，并且由于搜索区域较小，需要高得多的数值。不填写 gravel 可保持基础游戏行为。
depletion.flush_seconds.label = 保存开采情况的间隔秒数
depletion.flush_seconds.description = 资源地图更新之间的秒数。产量和品质会立即变化；只有小地图和存档按此间隔更新。\n数值越低 = 更新越频繁，性能开销越大\n每秒更新不要超过四次。
depletion.panel.label = 在矿井窗口显示矿藏余量行
depletion.panel.description = ON 在矿井窗口显示剩余储量，并略微增加窗口高度，例如“Shengyu: 251.4 kt / 259.3 kt (96.9 %)”。
depletion.panel_caption.label = 该行的标题
depletion.panel_caption.description = 余量前的单词。只能使用不带变音符号的拉丁字母，不能使用汉字或特殊字符，否则游戏会显示乱码。
depletion.log_seconds.label = 进度日志行间隔（秒）
depletion.log_seconds.description = tesmioloader.log 中矿井状态消息之间的秒数。每条消息包含剩余量、总量和品质。\n0 = 不记录状态消息\n数值越高 = 日志记录越少\n观察几个游戏日，以找到合适的每个地图点吨数。
easystart.description = 市民需求会随着年份逐步出现。尚未解锁的需求不影响幸福度和健康；市民仍会前往相关地点并购物，只是在指定年份之前不会产生后果。
easystart.group.general = 推迟哪些要求
easystart.group.unlock = 解锁年份
easystart.group.unlock.description = 要求自该年元旦（1 月首日）起生效。此时间表面向 1920 年建立的共和国。如果从 1960 年开始，预设年份就都已过去。\noff = 不推迟；使用基础游戏行为\nalways = 从第一个游戏日起生效\n年份 = 在该年解锁
easystart.group.diagnostics = 故障排查
easystart.enabled.label = 启用插件
easystart.enabled.description = ON 按所配置的时间表解锁需求和公用设施要求。
easystart.demands.label = 推迟九项市民需求
easystart.demands.description = ON 将食品、肉类、服装、电子产品、酒类、宗教、文化、体育和健康需求推迟到各自设定的解锁年份。
easystart.utilities.label = 推迟三项建筑公用设施要求
easystart.utilities.description = ON 将供电、供水和供暖要求推迟到各自设定的解锁年份。
easystart.warnings.label = 推迟建筑窗口中的警告
easystart.warnings.description = ON 在解锁年份之前隐藏相关警告，例如“建筑没有电力供应”。
easystart.pin_status.label = 保持锁定需求的满足度
easystart.pin_status.description = ON 将锁定需求的满足度保持在下方数值。\nOFF 允许满足度继续下降；解锁时可能已经很低。
easystart.locked_status.label = 锁定期间的满足度
easystart.locked_status.description = 需求锁定时的满足度。对于食品，此值表示饱腹度。\n1.0 = 完全满足或吃饱\n0.5 = 中等水平，解锁后可明显改善
easystart.clear_unsatisfied.label = 从未满足列表中排除锁定需求
easystart.clear_unsatisfied.description = ON 防止锁定需求产生“N 名市民无法获得 X”的消息。
easystart.probe.label = 将解锁情况写入日志
easystart.probe.description = ON 在每次年份变化时，将仍然锁定的需求写入 tesmioloader.log。也会记录一次首位受影响的市民。仅用于故障排查。
easystart.food.label = 食品
easystart.religion.label = 宗教
easystart.meat.label = 肉类
easystart.clothes.label = 服装
easystart.alcohol.label = 酒类
easystart.sport.label = 体育
easystart.culture.label = 文化
easystart.health.label = 健康
easystart.electricity.label = 电力
easystart.water.label = 供水（包含污水处理）
easystart.heating.label = 供暖
easystart.electronics.label = 电子产品
easystart.school.label = 学校
easystart.school.description = 在该年之前，儿童可像游戏中“简单”教育设置那样不去学校也能学习，且不会出现“N 名儿童无法上学”的消息。
easystart.kindergarten.label = 幼儿园
easystart.kindergarten.description = 在该年之前，家长不必为照顾六岁以下儿童而留在家中，且不会出现“N 名工人无法工作，因为所有幼儿园……”的消息。
plugin.needs = Needs
plugin.needs.description = 无需编辑上游文件，即可管理额外的市民需求和插件开关。
tab.needs.editor = 需求
group.needs = 市民需求
group.needs.plugin = 插件设置
group.needs.plugin.description = 适用于所有需求的开关。
needs.list = 需求列表
needs.add = 添加需求
needs.select_help = 在左侧选择需求，或使用 + 添加已由 Resources 注册的资源。
needs.resource = 资源
needs.resource.help = 市民将会需要的资源。必须已在 Resources 插件的列表中注册。
needs.donor = 模板需求
needs.donor.description = 用作模板的现有需求。\nfood 或 meat = 用于食品商店\nclothes 或 eletronics = 用于百货商店\nalcohol = 用于酒类商店\neletronics 是游戏使用的拼写。
needs.factor = 数量系数
needs.factor.description = 相对于模板需求的商品数量。\n1.0 = 与模板相同的数量\n数值越高 = 市民需要越多\n数值越低 = 市民需要越少
needs.category = 商店类别
needs.category.description = 储存这些商品的商店。\nauto = 与模板需求相同的商店\nnone = 不自动添加货架；建筑必须自行提供商品\nbasic = 仅基础商店\nmedium = 仅中型商店\nadvanced = 仅大型商店\nmediumadvanced = 仅中型和大型商店\nhotel = 仅酒店\n数字 = 直接写入此商店数值；仅供熟悉游戏文件的用户使用
needs.chance = 概率
needs.chance.description = 市民获得此需求的概率，范围为 0 至 1。低于 1 时，需求的分配独立于模板需求。\n0 = 没有市民获得此需求\n1 = 每位符合条件的市民都获得此需求
needs.unhappy = 不满度
needs.unhappy.description = 市民无法获得商品时损失的满足度。\n0 = 不损失；只显示该需求\n0.005 至 0.02 = 舒适类商品的典型范围\n允许范围：0 至 1
needs.enabled = 启用插件
needs.enabled.description = ON 启用插件。\nOFF 在下次启动游戏时完全停用插件。
needs.demand = 添加市民需求
needs.demand.description = ON 为市民分配新需求。\nOFF 不分配需求，但仍可能向商店添加商品。
needs.storage = 为商店供货
needs.storage.description = ON 向所选商店添加商品。\nOFF 不添加存储槽；市民只能在自行提供这些商品的建筑中找到它们。
needs.max_demands = 每位市民的需求数
needs.max_demands.description = 一位市民同时可以拥有的额外需求上限。\n1 = 最多一项额外需求\n7 = 允许的最大数量
needs.when_full = 市民需求已满时
needs.when_full.description = 当市民已经达到额外需求上限时的处理方式。\nskip = 等待空位\nreplace = 本次替换模板需求
needs.probe = 详细日志
needs.probe.description = ON 将市民需求列表和每家商店的信息写入插件的详细日志。\nOFF 仅记录警告。检查新商店时可临时启用。
needs.log_seconds = 进度日志行间隔（秒）
needs.log_seconds.description = 报告已分配需求数量的消息之间的秒数。\n0 = 禁用这些消息\n数值越高 = 日志记录越少
tab.needs.general = 常规
plugin.deposits = Deposits
plugin.deposits.description = 无需编辑上游文件，即可管理基础游戏没有的矿藏类型和插件开关。
tab.deposits.general = 常规
tab.deposits.editor = 矿藏
group.deposits = 矿藏
group.deposits.description = 原有矿藏受到保护，可以隐藏；自定义矿藏单独保存，并合并到实际生效的 deposits.ini 中。除 [deposits] 外，每个节代表一处矿藏。
group.deposits.plugin = 插件设置
group.deposits.plugin.description = [deposits] 节中的三个子系统。此处关闭某个开关时，对应子系统会对所有矿藏关闭。
deposits.notice = 一旦矿井使用某处矿藏，其类型编号、地图通道和 building.ini 中的标记就成为存档的一部分。删除或重新编号存档使用的矿藏可能使该存档无法使用；请先在副本上测试。
deposits.list = 矿藏列表
deposits.add = 添加矿藏
deposits.select_help = 在左侧选择矿藏，或使用 + 为已由 Resources 注册的资源添加矿藏。
deposits.name = 矿藏
deposits.name.help = deposits.ini 中的节名称。用于在日志和编辑器画笔中标识矿藏；以后无法改名。
deposits.new_name = 矿藏名称
deposits.new_hint = 此处只询问标准设置。其他设置（分量、建筑类型、耗尽量）在添加后位于右侧。
deposits.code_patch = 代码补丁
deposits.code_patch.description = ON 将所配置的 $TYPE_MINE_ 矿藏类型加入游戏，让矿井可以通过 building.ini 找到它们。如果更新后预期的游戏数据不再匹配，插件不会做任何修改。
deposits.minimap_all = 小地图图层
deposits.minimap_all.description = ON 为每处单独启用的插件矿藏，在游戏的五个小地图按钮下方显示一个按钮。\nOFF 隐藏所有插件矿藏按钮。
deposits.editor_all = 地形编辑器画笔
deposits.editor_all.description = ON 为每处设置了画笔名称的矿藏，在地形编辑器的资源选项卡中显示绘制和擦除画笔。\nOFF 隐藏所有插件矿藏画笔。
deposits.token = 建筑标记
deposits.token.description = 矿井在 building.ini 中用于此矿藏的标记，例如 $TYPE_MINE_COPPER。请按 $TYPE_MINE_GRAVEL 的形式输入。切勿在同一个 building.ini 中使用两个矿藏标记。
deposits.type = 类型编号
deposits.type.description = 矿藏的唯一类型编号。两处矿藏不能使用相同编号。\n10 至 127 = 允许范围\n0 至 9 = 为基础游戏保留\n对话框会自动建议下一个可用编号。
deposits.map = 地图
deposits.map.description = 保存矿藏的地图。\nauto = 自动在插件地图中选择空槽；推荐\nresourcemap 或 resourcemap2 = 使用基础游戏地图\nresourcemap3 至 resourcemap10 = 使用额外插件地图\nterrain = 直接使用绘制的地面，例如砾石；其画笔出现在 ROCKS 下
deposits.component = 分量
deposits.component.description = 每张地图有四个槽，编号为 0 至 3。每个槽可包含一种矿藏。\n使用 auto 时 = 留空；插件选择空槽\n使用 terrain 时：2 = 砾石层\n使用 terrain 时：3 = 绿洲层
deposits.building_type = 建筑类型
deposits.building_type.description = 可以开采此矿藏的建筑类型。\n7 = 矿井；几乎适用于所有矿藏\n92 = 水井\n留空 = 7
deposits.radius = 搜索半径
deposits.radius.description = 矿井搜索矿藏的距离。\noil, ore, bauxite, gravel, wood, water, watersurface = 使用对应的游戏常量\n数字 = 直接使用此距离\n留空 = 使用 ore\n没有半径时，矿井找不到矿藏。
deposits.icon = 小地图图标
deposits.icon.description = 小地图按钮上显示其图标的资源。插件使用游戏已经加载的图标；无需单独提供图片。\nResources 插件中的资源必须先在其中注册。\n留空 = 无图标
deposits.minimap = 小地图按钮
deposits.minimap.description = ON 为此矿藏添加小地图按钮和叠加图层。
deposits.editor = 编辑器画笔名称
deposits.editor.description = 地形编辑器中绘制和擦除画笔的名称。同一名称也用于 vfs\media_soviet\editor 下的 tool_paint_<name>.png 和 tool_erase_<name>.png。\n留空 = 不创建画笔\n允许：最多 31 个字符，可用字母、数字、_ 和 -
deposits.deplete = 每个纹素的耗尽量
deposits.deplete.description = 此设置由 Depletion 插件读取。它决定矿井能从资源地图中一个完全充满的点开采的吨数。较贫瘠的点按比例减少。\n此值覆盖 plugins\depletion.ini 中的 tonnes_per_texel。\n0 = 此矿藏保持无限\n留空 = 使用全局值
deposits.save_warning = 只有保存时，修改才会写入实际生效的 deposits.ini。存档已经使用的矿藏类型编号、地图通道和标记不得更改；请先在副本上测试。
depletion.tab.general = 常规
depletion.tab.mining = 开采
needs.save_warning = 只有点击保存后，修改才会写入实际生效的 needs.ini。每项需求都会向相关商店添加一个存储槽，而该槽会成为存档的一部分；请先在存档副本上测试。
bp.name = Buildings Plus
bp.description = 根据声明创建新建筑：使用游戏中的模板建筑，加上与模板不同的 building.ini 行。每次启动游戏时，都会写成完整的创意工坊物品。
bp.notice = 每座建筑都会成为 media_soviet\workshop_wip 下带独立创意工坊 ID 的文件夹。将 ID 留空，插件就会在游戏启动时从 9300000000 开始分配下一个可用编号，并保存在 plugins\buildings_plus.ids.ini 中。游戏会将此文件夹作为未发布的创意工坊物品读取。修改需要完全重启游戏。包含这类建筑的存档在加载时需要相应文件夹。
bp.tab.general = 常规
bp.tab.buildings = 建筑
bp.tab.generated = 已生成建筑
bp.wip = 游戏文件夹中已生成的建筑
bp.wip.description = 显示由 Buildings Plus 或原版 buildings 插件生成到 media_soviet\workshop_wip 中的建筑。此处内容从文件夹读取。
bp.wip.empty = 此处尚无已生成建筑。启用某座建筑后，会在游戏启动时生成。
bp.group = 建筑
bp.group.notice = 此处的建筑是游戏建筑的副本，仅修改部分行：模型相同、连接相同，使用你的生产配方。请选择同类模板（矿井对应矿井，工厂对应工厂）。
bp.list = 建筑
bp.add = 添加
bp.select_help = 在左侧选择建筑，或使用 + 添加。首先选择模板，创意工坊 ID 可以留空；名称和行内容随后在右侧填写。
bp.id = 对象名称
bp.id.help = 为生成建筑的文件夹和对象命名，并显示在日志中。仅限字母、数字、_ 和 -，最多 64 个字符；以后不能更改。
bp.save_warning = 修改仅在保存时写入实际生效的 buildings_plus.ini，并在完全重启游戏后生效。随后插件会写入 media_soviet\workshop_wip 下的文件夹；存在错误的节会被跳过，并在日志中列出名称。
bp.list.note = 最多 256 座建筑。
bp.new_name = 对象名称
bp.new_hint = 空格转换为下划线，大写字母转换为小写。
bp.card.folders = 已生成文件夹
bp.card.log = 故障排查
bp.card.new = 新建筑
bp.links = 指南
bp.link.readme = README（指南）
bp.prune = 清理文件夹
bp.prune.description = ON 在下次启动游戏时，删除已被你移除或关闭的建筑所生成的文件夹（仅限此插件创建的文件夹）。\nOFF 保留这些文件夹；游戏会继续加载相应建筑。
bp.always = 始终重写
bp.always.description = ON 在每次启动游戏时写入所有建筑文件夹。\nOFF 仅在对应节、插件或模板文件发生变化时写入文件夹。请保持 OFF。
bp.verbose = 详细日志
bp.verbose.description = ON 将每个复制的文件和每个移除的模板行写入 logs\tesmioloader.buildings_plus.log。\nOFF 仅记录结果、警告和错误。
bp.repair_owner_ids = 补全所有者 ID
bp.repair_owner_ids.description = ON 为缺少所有者 ID 的已生成建筑填入你的 Steam ID，也包括其他生成器创建的建筑。没有此 ID 时，每次加载使用这类建筑的存档，游戏都会询问缺失的创意工坊物品。\nOFF 不修改其他生成器的文件夹。
bp.card.saves = 存档
bp.card.saves.description = 存档会记住每座现有建筑的存储空间。此功能让你为某座建筑新增的存储行也能应用到已经建成的建筑。
bp.retrofit = 同步更新现有建筑的存储空间
bp.retrofit.description = ON：加载存档时，每座已完工的生成建筑都会获得你在其配置节中新增的单资源存储空间，初始为空。修改存储行的容量时，存储空间也会变化；缩小容量会等到现有库存能够容纳后再执行。被你删除配置行的存储空间会在清空后从建筑中移除。\nOFF：现有建筑的存储空间保持不变；新增和修改的行仅应用于以后建造的建筑。
bp.enabled = 启用建筑
bp.enabled.description = ON 在下次启动游戏时生成此建筑。\nOFF 不生成此建筑。启用“清理文件夹”时，其现有文件夹会在下次启动时删除。
bp.item_id = 创意工坊 ID
bp.item_id.description = 可使用自定义编号：9000000000 至 9999999999，但不包括 9100000000 至 9199999999（为其他生成器保留）\n它决定游戏文件夹中 workshop_wip 下的文件夹名称，之后不应更改。
bp.donor = 模板建筑
bp.donor.description = 作为复制起点的建筑；如果来自创意工坊，必须先订阅。\n使用“选择模板...”浏览已有建筑。类型必须对应：矿井对应矿井，工厂对应工厂，商店对应商店。
bp.item_name = 游戏内名称
bp.item_name.description = 游戏中显示的名称。\n带点号的值被视为翻译键，并通过 Localization 插件解析，例如：localization.lang.salt_mine
bp.desc = 描述
bp.desc.description = 创意工坊条目的描述，每行填写一行内容。不要加引号。
bp.line = building.ini 行
bp.line.description = 每行填写一条 building.ini 行，例如 $PRODUCTION raw_salt 1.0。使用“选择行…”从模板建筑中提取一行并修改。你的行会放在模板行之前，并替换：相同标记；所有 $TYPE_*；所有 $STORAGE* 及 $RESOURCE_VISUALIZATION；将 $PRODUCTION、$CONSUMPTION 和 $CONSUMPTION_PER_SECOND 作为一个完整配方替换。模板的其他内容全部保留。\n对于自定义资源，务必使用 $STORAGE_IMPORT_SPECIAL 或 $STORAGE_EXPORT_SPECIAL 并指定资源名称，否则存储空间会列出该运输类别的所有资源。
bp.strip = 移除模板行
bp.cmd_add = 追加
bp.cmd_add.description = 每行一条命令：新增行，放在模板文件的结束标记之前。包含多行的块使用 | 分隔各行。
bp.cmd_replace = 替换
bp.cmd_replace.description = 每行一条命令：旧行 | 新行。旧行在模板文件中必须恰好出现一次。
bp.cmd_remove = 移除
bp.cmd_remove.description = 每行一条命令：要从模板文件中移除的行。属于该行的内容（点、位置）也一并移除。
bp.cmd_insert = 插入
bp.cmd_insert.description = 每行一条命令：0 或 1 | 锚点 | 新行。0 将新行放在锚点之前，1 放在之后。
bp.strip.description = 每行一个 $TOKEN，例如 $WORKERS_NEEDED。包含该标记的所有模板行都会被直接删除，不作替换。
bp.life = 耐久度
bp.life.description = 留空 = 3000\nrenderconfig.ini 中的 LIFE：建筑倒塌前能够承受的损伤。与多数游戏建筑相同。
bp.card.lines = 行内容
bp.item_id.empty = 插件在游戏启动时从 9300000000 开始分配下一个可用编号。
bp.item_name.empty = 对象名称；不推荐。
needs_plus.card.log = 故障排查
resources_plus.card.log = 故障排查
resources_plus.card.plugin = 插件
resources_plus.custom_report = 记录克隆的资源记录
resources_plus.custom_report.description = ON 对每个带模板的资源记录克隆实际继承的内容（运输类别、系数、标志）。没有模板的资源始终会列出。\nOFF 仅列出没有模板的资源。
resources_plus.customs_hook = 刷新海关
resources_plus.customs_hook.description = ON 将新资源添加到现有海关的贸易列表。\nOFF 使用基础游戏行为：海关只能交易建成时已知的资源；此时只能拆除并重建才能更新。
resources_plus.customs_probe = 记录海关条目
resources_plus.customs_probe.description = ON 为每种添加到海关的资源在 tesmioloader.log 中记录一行。海关显示符合预期后，请切换为 OFF。
resources_plus.price_hook = 应用 INI 中的价格
resources_plus.price_hook.description = ON 使 [base_price] 和 [price] 生效：基础价格在游戏计算价格之前设置，固定价格在之后设置。\nOFF 将价格交给游戏处理。
resources_plus.price_report = 记录价格表
resources_plus.price_report.description = ON 在游戏每次计算价格后，将列表中每种资源的价格、基础价格和价格类型写入 tesmioloader.log。价格为 0.00 表示没有建筑生产该资源。\nOFF 不记录任何内容。
tab.resources_plus.general = 常规
resources.heading.basics = 运输和价格类型
resources.heading.cargo = 货物和材料
resources.heading.fixed = 固定价格
resources.heading.market = 市场数值
resources.heading.prices = 资源记录中的价格

resources_plus.heading.names = 各游戏语言的名称
