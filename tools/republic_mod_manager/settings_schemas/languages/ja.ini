[language]
name = 日本語

[strings]
plugin.resources = Resources
plugin.resources.description = 資源、各種プロパティ、任意の価格上書きを管理します。
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Resources Plusで独自の資源を管理します。元のプラグインと同じ一覧をplugins\resources_plus.iniに保存し、終了時のクラッシュを回避します。
resources_plus.save_warning = 変更は保存時にplugins\resources_plus.iniへ書き込まれます。セーブデータで使用中の資源を削除すると、そのデータが破損するおそれがあります。
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Needs Plusで市民の独自の需要を管理します。元のプラグインと同じ一覧をpluginsフォルダーのneeds_plus.iniに保存し、初回起動時にneeds.iniから引き継ぎます。
needs_plus.save_warning = 変更は保存時にのみpluginsフォルダーのneeds_plus.iniへ書き込まれます。各需要は対象店舗に保管枠を追加し、この枠はセーブデータの一部になります。まずコピーで試してください。
tab.resources.editor = 資源
group.resource_definitions = 資源の定義
detail.transport = 輸送クラス
detail.transport.description = 資源を扱える車両と保管施設を指定します。名前を選ぶだけで、このクラスに対応する基本ゲームの数値をプラグインが追加します。
detail.kind = 価格区分
detail.kind.description = 0 原材料、1 製造品、2 食料・衣類、3 高度な素材、4 電子機器。
detail.record_price = 資源レコードの初期価格
detail.record_price.description = 資源レコード内の初期値をRUBとUSDで指定します。省略可能です。
detail.record_base_price = 資源レコードの初期基準価格
detail.record_base_price.description = 資源レコード内の基準値をRUBとUSDで指定します。省略可能です。
detail.trade_mult = 売買倍率
detail.trade_mult.description = 売却と購入の倍率です。通常は0.95と1.05です。
detail.market_rub = RUB市場ブロック
detail.market_usd = USD市場ブロック
detail.market.description = 二つの市場値と、任意の係数です。\n（INIファイルの説明を参照）
detail.packed = 梱包済み貨物
detail.packed.description = 貨物の表現を自動、未梱包、梱包済みから選びます。
detail.family = 素材グループ
detail.family.description = 建設現場に積まれた素材の外観と、おそらく発生する廃棄物の種類も決めます。各グループは一種類の廃棄物資源に対応します。INI内の10から19までの番号は名前で表示されます。
detail.cargo = 貨物の形状
detail.cargo.description = 貨物の表示に使う形状を選択します。
detail.pinned_base_price = 固定基準価格
detail.pinned_base_price.description = [base_price]のRUB値とUSD値を指定します。省略可能で、空欄の場合は独自の設定を追加しません。
detail.forced_price = 強制適用する最終価格
detail.forced_price.description = [price]のRUB値とUSD値を指定します。省略可能で、空欄の場合はゲームが価格を計算します。

; --- インストール済みの元プラグイン用ローカルスキーマ（0.13.0以降） ---
daynight.description = 暦上の一日ごとに、日の出と日没が一度ずつ発生します。基本ゲームでは昼から夜を経て再び昼になるまでに13日、ほぼ二週間かかります。このプラグインなら一日に収まります。
daynight.group.cycle = 昼と夜
daynight.group.cycle.description = 昼夜サイクルの長さと夜になる時刻を設定します。
daynight.group.pace = 進行速度
daynight.group.pace.description = 車両用とそれ以外の要素用の二つの独立した設定です。上の設定内容にかかわらず、常に適用されます。
daynight.group.diagnostics = トラブルシューティング
daynight.enabled.label = プラグインを有効化
daynight.enabled.description = ONで設定した昼夜サイクルを有効にします。
daynight.cycle_days.label = 昼夜サイクルあたりの暦日数
daynight.cycle_days.description = 日の出から次の日の出までの暦日数です。\n1 = 毎日、日の出と日没が一度ずつ発生\n2から12 = それに応じて長いサイクル\n13 = 基本ゲームのサイクル
daynight.day_scale.label = 一日の長さ（カレンダーを遅くする倍率）
daynight.day_scale.description = 暦上の一日を基本ゲームの何倍の長さにするかを指定します。\nauto = 光のサイクルに合わせてカレンダーを自動的に遅くする（推奨）\n1 = カレンダーを遅くしない。この場合、昼夜の変化は13倍速くなる\n2から100 = 指定した倍率でカレンダーを遅くする\n「遅くする対象」で、ゲームのどの要素を遅くするかを選んでください。
daynight.slow.label = 遅くする対象
daynight.slow.description = ゲームのどの要素を遅くするかを指定します。\ncalendar = カレンダーだけを遅くする（推奨）\nworld = 市民や車両を含むすべてを遅くする。大きな値ではスローモーションのように見える\nnone = 何も遅くしない\ncalendarでは市民、車両、建設、生産は通常の速度を維持します。汚染、融資、メッセージなどの日次処理も通常の間隔を維持します。
daynight.offset.label = 夜になるタイミング
daynight.offset.description = 暦上の一日の中で夜の位置をずらします。\n0 = 一日の中間を少し過ぎると暗くなる\n0.5 = 日付が変わると暗くなる\n0以外の値では、13日サイクルは基本ゲームと完全には一致しません。
daynight.fade.label = 光の移り変わりを調整
daynight.fade.description = ONで朝、昼、夕方、夜の間の移り変わりを、設定したサイクルに合わせて短くします。\nOFFでは基本ゲームのゆっくりした移り変わりを使います。サイクルが短いと移り変わりが重なり、光がぼやけて見えることがあります。
daynight.vehicle_scale.label = 車両速度
daynight.vehicle_scale.description = トラック、列車、船舶、航空機の速度です。他の設定とは独立して動作します。\n1 = 基本ゲームの速度\n2 = 半分の速度\n0.5 = 倍の速度\n値が大きいほど車両が遅くなります。
daynight.sim_scale.label = その他すべての速度
daynight.sim_scale.description = 市民、建設、生産、摩耗、アニメーションの速度です。\n1 = 基本ゲームの速度\n2 = 半分の速度\n0.5 = 倍の速度\n値が大きいほどシミュレーションが遅くなります。
daynight.probe.label = 一日の長さをログに記録
daynight.probe.description = ONで各暦日と光の移り変わりの実際の所要時間をtesmioloader.logに書き込みます。トラブルシューティングとゲーム更新後の確認時にのみ使用してください。
walking.description = 市民が徒歩で移動する距離と、自動車所有者が自宅、職場、駐車場の間を運転する距離を設定します。
walking.group.distances = 距離
walking.group.distances.description = 直線距離ではなく、道路と歩道に沿って測定します。川の向こうに400 m離れた建物まで、徒歩では1200 mかかる場合があります。
walking.group.diagnostics = トラブルシューティング
walking.enabled.label = プラグインを有効化
walking.enabled.description = ONで設定した徒歩距離と自動車移動距離を有効にします。
walking.distance.label = 徒歩距離（m）
walking.distance.description = 市民が歩く最長経路です。基本ゲームは480 mです。\n値を大きくすると徒歩圏内の建物が増え、建設時に作成される接続も増える\n0 = 無制限。大都市では建設処理に数秒かかる場合がある\n20000 = 設定可能な最大値
walking.car_distance.label = 自動車所有者の移動距離（m）
walking.car_distance.description = 自宅、職場、駐車場の間で許可される最長の自動車移動距離です。基本ゲームは2500 mです。\n値を大きくすると自動車所有者がより遠くまで移動する\n徒歩距離より大きく設定してください。同じ値では、自動車による移動範囲の利点がなくなります。
walking.regen_on_load.label = セーブデータの読み込み時に接続を再構築
walking.regen_on_load.description = 徒歩と駐車場の接続はセーブデータに保存されています。\nONでは読み込み時にすべての接続を再構築し、既存の都市にも設定した距離を適用する\nOFFでは新たに建設した建物にのみ設定した距離を適用する
walking.probe.label = 確認用の値をログに記録
walking.probe.description = ONでプラグインが変更する前にゲーム内で検出した値をtesmioloader.logに書き込みます。トラブルシューティングとゲーム更新後の確認時にのみ使用してください。
accumulator.description = 電力網用の蓄電池です。大容量の電力貯蔵を持つ建物が、電力に余裕のあるときに充電し、不足したときに電力を戻します。
accumulator.group.battery = 蓄電池
accumulator.group.battery.description = 蓄電池として扱う建物と、充放電の速さを設定します。
accumulator.group.window = 建物ウィンドウ
accumulator.group.grid = 電力網
accumulator.group.diagnostics = トラブルシューティング
accumulator.enabled.label = プラグインを有効化
accumulator.enabled.description = ONで蓄電池用建物の充放電を有効にします。\nOFFでは放電を停止します。建物は残り、充電は引き続き可能です。
accumulator.building_types.label = 建物の種類
accumulator.building_types.description = 蓄電池として動作できる建物の種類です。複数の番号はカンマで区切ってください。\n19 = 変圧器\n18 = 変電所\n17は使わないでください。発電所は電力を受け取れないため、充電できません。
accumulator.min_capacity.label = 蓄電池として扱う最小容量
accumulator.min_capacity.description = 建物を蓄電池として扱うための最小蓄電容量です。通常の変電所の小さな貯蔵分を対象から除外します。\n値を大きくすると蓄電池として扱う建物が減る\n値を小さくすると蓄電池として扱う建物が増える\n付属の「Stationary Accumulator」の容量は5000です。
accumulator.charge_rate.label = 充電速度（毎秒の電力）
accumulator.charge_rate.description = 蓄電池が毎秒受け取る電力の上限です。空の蓄電池が都市全体の電力を奪うことを防ぎます。\n値を大きくすると充電が速くなり、電力網の負荷も増える\n値を小さくすると充電が遅くなり、負荷も減る\n比較として、石炭火力発電所の供給は70、風力タービンは15です。
accumulator.discharge_rate.label = 放電速度（毎秒の電力）
accumulator.discharge_rate.description = 蓄電池が毎秒供給する電力の上限です。電力網が不足しているときだけ供給します。\n値を大きくするとより大きな電力不足を補える\n値を小さくすると蓄えたエネルギーが長持ちする\n例：60に設定すると、容量5000の満充電の蓄電池は80秒強にわたり発電所の代わりになります。
accumulator.panel.label = 蓄電池ウィンドウの充電量表示行
accumulator.panel.description = ONで蓄電池ウィンドウに充電量を追加します。表示例：「Charge: 4210.5 / 5000 (84.2 %)」。
accumulator.panel_caption.label = この行の見出し
accumulator.panel_caption.description = 充電量の前に表示する単語です。アクセント記号や特殊文字を含まない半角英字のみを使ってください。それ以外ではゲーム内で文字化けします。
accumulator.gauges.label = 蓄電池の状態からウィンドウの計器を計算
accumulator.gauges.description = ONでゲームの誤った表示を、蓄電池の実際の流入・流出量に置き換えます。\nOFFではゲームの通常表示を使います。充電中でも電力0や「電力供給なし」と表示されることがあります。
accumulator.spread_voltage.label = 実験：隣接建物に電圧を伝える（無効のままにする）
accumulator.spread_voltage.description = ONにしても効果はありません。この古い機能は技術的に別の仕組みに置き換えられました。OFFのままにしてください。
accumulator.trace.label = 最初の蓄電池の隣接建物を記録
accumulator.trace.description = ONで最初の蓄電池に隣接する建物が受け取る電力をログに書き込みます。トラブルシューティング専用で、動作が重くなる場合があります。
accumulator.log_seconds.label = 蓄電池ログの記録間隔（秒）
accumulator.log_seconds.description = tesmioloader.logに蓄電池の状態を書き込む間隔です。各メッセージに充電量、流入量、流出量が含まれます。\n0 = 状態メッセージなし\n値が大きいほど記録頻度が下がります。
accumulator.probe.label = 建物一覧をログに記録する間隔（秒）
accumulator.probe.description = 電力貯蔵を持つすべての建物の一覧をtesmioloader.logに書き込む間隔です。蓄電池が認識されない場合やゲーム更新後にのみ使用してください。\n0 = 一覧を書き込まない\n値が大きいほど記録頻度が下がります。
cities.description = 各都市の大きさと形状を設定します。基本ゲームではすべての都市が半径1000 mの円です。このプラグインでは都市ウィンドウで各都市の半径を個別に設定でき、正方形にもできます。値はセーブデータに保存されます。
cities.group.cities = 都市
cities.group.slider = 半径スライダー
cities.group.slider.description = 都市ウィンドウのスライダーの範囲と、+または-を一回クリックしたときの変更量を設定します。
cities.group.layout = 都市ウィンドウの配置
cities.group.layout.description = 都市ウィンドウに追加する二行の位置です。数値はゲームウィンドウ独自の単位による位置を表し、ウィンドウの幅は約500です。
cities.group.overlay = 地面上の点のグリッド
cities.group.diagnostics = トラブルシューティング
cities.enabled.label = プラグインを有効化
cities.enabled.description = ONで都市の独自の大きさと形状を有効にします。
cities.window.label = 都市ウィンドウの半径スライダーと形状チェックボックス
cities.window.description = ONで都市ウィンドウに半径スライダーと正方形のチェックボックスを表示します。\nOFFでは両方を隠します。設定値は残りますが、変更できなくなります。
cities.adopt.label = 所属を失った建物用に新しい都市を作成
cities.adopt.description = 都市を縮小すると、建物が範囲外になり、どの都市にも所属しなくなることがあります。\nONではゲーム本来の処理と同じく、ランダムな名前と今日の日付で新しい都市を設立する\nOFFでは都市に所属しないままにする。この場合のゲームの動作は未検証です。
cities.radius.label = 既定の半径（m）
cities.radius.description = 個別に設定していない都市の既定の半径です。すべてのマップに適用されます。\n1000 = 基本ゲームの半径\n値が大きいほど都市が大きくなる\n値が小さいほど都市が小さくなる
cities.square.label = 既定の形状を正方形にする
cities.square.description = ONで個別に設定していない都市を正方形にします。\nOFFでは基本ゲームと同じ円を使います。
cities.radius_min.label = スライダーの最小半径（m）
cities.radius_min.description = スライダーの左端の値です。
cities.radius_max.label = スライダーの最大半径（m）
cities.radius_max.description = スライダーの右端の値です。スライダーは100段階で、範囲が200から5000の場合、一段階は48 mです。
cities.step.label = ボタンクリックごとの割合
cities.step.description = +または-の一回のクリックで変更する、スライダー範囲に対する割合です。スライダーをドラッグするときには適用されません。\n値を大きくするとクリックごとの変更量が増える\n値を小さくするとより細かく変更できる
cities.label_x.label = ラベルの位置
cities.label_x.description = ウィンドウ左端からラベルまでの距離です。
cities.widget_x.label = 操作部品の位置
cities.widget_x.description = ウィンドウ左端からスライダーとチェックボックスまでの距離です。スライダーには約225必要です。
cities.checkbox_dy.label = チェックボックスの行を上下に移動
cities.checkbox_dy.description = スライダーと重ならないようにチェックボックスを上下に移動します。\n値を大きくすると下へ移動する\n値を小さくすると上へ移動する
cities.overlay.label = オーバーレイを半径と形状に合わせる
cities.overlay.description = 都市ウィンドウを開くと、ゲームは地面に青い点のグリッドを表示しますが、常に半径1000 mの円になっています。\nONでは設定した半径と形状に合わせる\nOFFでは基本ゲームのままにする
cities.overlay_step.label = オーバーレイの点の間隔（m）
cities.overlay_step.description = 都市境界を表示する点の間隔です。\n0 = 自動的に半径の二十分の一を使う。最小50 m\n値を小さくすると表示が密になり、処理負荷が増えます。
cities.probe.label = 都市をログに記録
cities.probe.description = ONで読み込み後に各都市の半径、形状、建物数をtesmioloader.logに書き込みます。都市ウィンドウを開いている間は追加メッセージも記録します。トラブルシューティング専用で、ログが急速に大きくなることがあります。
depletion.description = 鉱床が枯渇するようになります。稼働中の鉱山がマップ上の鉱床を目に見える形で掘り減らし、残量が少ないほど生産量も減ります。採掘状況はセーブデータに保存され、後からプラグインを無効にしても採掘済みの資源は戻りません。まずセーブデータのコピーで試してください。
depletion.group.depletion = 採掘
depletion.group.window = 鉱山ウィンドウ
depletion.group.diagnostics = トラブルシューティング
depletion.enabled.label = プラグインを有効化
depletion.enabled.description = ONで選択した鉱床が採掘によって枯渇するようにします。\nOFFではそれ以上の枯渇を止めます。すでに除去した資源は復元されません。
depletion.tonnes_per_texel.label = マップの一点あたりのトン数
depletion.tonnes_per_texel.description = 資源マップの完全に満たされた一点から採掘できるトン数です。資源の薄い点では比例して少なくなります。\n値を大きくすると鉱床が長持ちする\n値を小さくすると早く枯渇する\n比較として、探索半径210 mの鉱山は数千のマップ点を対象とします。
depletion.vanilla.label = 枯渇する基本ゲームの鉱床
depletion.vanilla.description = 枯渇を許可する基本ゲームの鉱床です。複数の値はカンマで区切ってください。\noil, iron, coal, uranium, bauxite, gravel = 指定した鉱床のみ\nall = すべての鉱床\nnone = 基本ゲームの鉱床は対象外\nname:value = マップの一点あたりの独自のトン数。例：iron:3000\ndeposits.iniの鉱床は常に対象です。\ngravelは見えている地面のテクスチャを恒久的に削り取ります。探索範囲が狭いため、はるかに大きな値が必要です。基本ゲームのままにするにはgravelを省いてください。
depletion.flush_seconds.label = 採掘状況の保存間隔（秒）
depletion.flush_seconds.description = 資源マップの更新間隔を秒で指定します。生産量と品質は即座に変わり、ミニマップとセーブデータだけがこの間隔で更新されます。\n値を小さくすると更新頻度と処理負荷が増える\n毎秒四回を超える頻度で更新しないでください。
depletion.panel.label = 鉱山ウィンドウの鉱床残量表示行
depletion.panel.description = ONで鉱山ウィンドウに残量を表示し、ウィンドウを少し縦に広げます。表示例：「Remaining: 251.4 kt / 259.3 kt (96.9 %)」。
depletion.panel_caption.label = この行の見出し
depletion.panel_caption.description = 残量の前に表示する単語です。アクセント記号や特殊文字を含まない半角英字のみを使ってください。それ以外ではゲーム内で文字化けします。
depletion.log_seconds.label = 進捗ログの間隔（秒）
depletion.log_seconds.description = tesmioloader.logに鉱山の状態を書き込む間隔を秒で指定します。各メッセージに残量、総量、品質が含まれます。\n0 = 状態メッセージなし\n値が大きいほど記録頻度が下がる\nゲーム内で数日間観察し、マップの一点あたりの適切なトン数を決めてください。
easystart.description = 市民の需要が年月とともに少しずつ現れるようになります。未解禁の需要は幸福度や健康に影響しません。市民は引き続き該当施設を訪れて買い物をしますが、その影響は設定した年まで発生しません。
easystart.group.general = 解禁を遅らせる対象
easystart.group.unlock = 解禁年
easystart.group.unlock.description = 要求が適用され始める年です。その年の1月1日から有効になります。予定は1920年に建国した共和国を想定しています。1960年開始では、既定の年はすでに過ぎています。\noff = 遅らせない。基本ゲームと同じ動作\nalways = ゲーム開始日から適用\n年 = その年に解禁
easystart.group.diagnostics = トラブルシューティング
easystart.enabled.label = プラグインを有効化
easystart.enabled.description = ONで設定した予定に従って需要と公共設備の要求を解禁します。
easystart.demands.label = 市民の九種類の需要の解禁を遅らせる
easystart.demands.description = ONで食料、肉、衣類、電子機器、アルコール、宗教、文化、スポーツ、健康の需要を、それぞれ設定した解禁年まで遅らせます。
easystart.utilities.label = 建物の三種類の公共設備要求を遅らせる
easystart.utilities.description = ONで電力、水道、暖房の要求を、それぞれ設定した解禁年まで遅らせます。
easystart.warnings.label = 建物ウィンドウの警告を遅らせる
easystart.warnings.description = ONで「建物に電力供給がない」などの関連警告を解禁年まで非表示にします。
easystart.pin_status.label = 未解禁の需要の充足度を維持
easystart.pin_status.description = ONで未解禁の需要の充足度を下記の値に維持します。\nOFFでは充足度が下がり続け、解禁時点ですでに非常に低くなっている場合があります。
easystart.locked_status.label = 未解禁の間の充足度
easystart.locked_status.description = 需要が未解禁の間の充足度です。食料の場合は満腹度を表します。\n1.0 = 完全に満足、または満腹\n0.5 = 解禁後に明確な改善が見込める中程度の値
easystart.clear_unsatisfied.label = 未解禁の需要を未充足一覧から除外
easystart.clear_unsatisfied.description = ONで未解禁の需要による「N人の市民がXを入手できませんでした」というメッセージを防ぎます。
easystart.probe.label = 解禁状況をログに記録
easystart.probe.description = ONで年が変わるたびに未解禁の需要をtesmioloader.logに書き込みます。最初に影響を受けた市民も一度だけ記録します。トラブルシューティング専用です。
easystart.food.label = 食料
easystart.religion.label = 宗教
easystart.meat.label = 肉
easystart.clothes.label = 衣類
easystart.alcohol.label = アルコール
easystart.sport.label = スポーツ
easystart.culture.label = 文化
easystart.health.label = 健康
easystart.electricity.label = 電力
easystart.water.label = 水道（下水も含む）
easystart.heating.label = 暖房
easystart.electronics.label = 電子機器
easystart.school.label = 学校
easystart.school.description = この年より前は、ゲームの教育設定「簡易」と同じように、子供が学校なしで学びます。「N人の子供が学校に通えません」というメッセージも表示されません。
easystart.kindergarten.label = 幼稚園
easystart.kindergarten.description = この年より前は、六歳未満の子供のために親が家に残る必要がなく、「すべての幼稚園が…のためN人の労働者が働けません」というメッセージも表示されません。
plugin.needs = Needs
plugin.needs.description = 元のファイルを編集せずに、市民の追加需要とプラグインの設定を管理します。
tab.needs.editor = 需要
group.needs = 市民の需要
group.needs.plugin = プラグイン設定
group.needs.plugin.description = すべての需要に適用される設定です。
needs.list = 需要一覧
needs.add = 需要を追加
needs.select_help = 左側で需要を選択するか、+でResourcesに登録された資源を追加してください。
needs.resource = 資源
needs.resource.help = 市民が求める資源です。Resourcesプラグインの一覧に登録されている必要があります。
needs.donor = ひな型の需要
needs.donor.description = ひな型として使う既存の需要です。\nfoodまたはmeat = 食料品店用\nclothesまたはeletronics = 百貨店用\nalcohol = 酒類販売店用\neletronicsはゲームで使われている綴りです。
needs.factor = 数量倍率
needs.factor.description = ひな型の需要に対する商品の量です。\n1.0 = ひな型と同じ量\n値を大きくすると市民が必要とする量が増える\n値を小さくすると市民が必要とする量が減る
needs.category = 店舗区分
needs.category.description = 商品を取り扱う店舗です。\nauto = ひな型の需要と同じ店舗\nnone = 自動の保管枠なし。建物自体が商品を提供する必要がある\nbasic = 基本店舗のみ\nmedium = 中型店舗のみ\nadvanced = 大型店舗のみ\nmediumadvanced = 中型・大型店舗のみ\nhotel = ホテルのみ\n数値 = 店舗の値を直接指定。ゲームファイルに詳しいユーザー向け
needs.chance = 発生確率
needs.chance.description = 市民にこの需要が割り当てられる確率を0から1で指定します。1未満では、ひな型の需要とは独立して割り当てられます。\n0 = 誰にも割り当てない\n1 = 条件を満たすすべての市民に割り当てる
needs.unhappy = 不満
needs.unhappy.description = 市民が商品を入手できないときに失う満足度です。\n0 = 低下なし。需要を表示するだけ\n0.005から0.02 = 嗜好品の一般的な範囲\n設定可能な範囲：0から1
needs.enabled = プラグインを有効化
needs.enabled.description = ONでプラグインを有効にします。\nOFFでは次回のゲーム起動時に完全に無効にします。
needs.demand = 需要を割り当てる
needs.demand.description = ONで市民に新しい需要を割り当てます。\nOFFでは需要を割り当てませんが、店舗への商品の追加は行う場合があります。
needs.storage = 店舗に商品を追加
needs.storage.description = ONで選択した店舗に商品を追加します。\nOFFでは保管枠を追加しません。市民は商品を独自に提供する建物でのみ入手できます。
needs.max_demands = 市民あたりの需要数
needs.max_demands.description = 市民が同時に持てる追加需要の最大数です。\n1 = 追加需要は最大一つ\n7 = 設定可能な最大数
needs.when_full = 需要数が上限に達している場合
needs.when_full.description = 市民の追加需要がすでに上限に達している場合の処理です。\nskip = 空きができるまで待つ\nreplace = 今回はひな型の需要を置き換える
needs.probe = 詳細ログ
needs.probe.description = ONで市民の需要一覧と各店舗の情報をプラグインの詳細ログに書き込みます。\nOFFでは警告のみを書き込みます。新しい店舗を確認するときに一時的に有効にしてください。
needs.log_seconds = 進捗メッセージの間隔（秒）
needs.log_seconds.description = 割り当て済み需要数を報告するメッセージの間隔を秒で指定します。\n0 = このメッセージを無効にする\n値が大きいほど記録頻度が下がります。
tab.needs.general = 全般
plugin.deposits = Deposits
plugin.deposits.description = 元のファイルを編集せずに、基本ゲームにはない鉱床の種類とプラグインの設定を管理します。
tab.deposits.general = 全般
tab.deposits.editor = 鉱床
group.deposits = 鉱床
group.deposits.description = 元の鉱床は保護されており、非表示にできます。独自の鉱床は別に保存され、実際に使用されるdeposits.iniへ統合されます。[deposits]以外の各セクションが一つの鉱床を表します。
group.deposits.plugin = プラグイン設定
group.deposits.plugin.description = [deposits]セクションの三つのサブシステムです。ここで無効にしたサブシステムは、すべての鉱床で無効になります。
deposits.notice = 鉱床の種類番号、マップのチャンネル、building.iniのトークンは、鉱山が使い始めるとセーブデータの一部になります。使用中の鉱床を削除したり番号を変更したりすると、そのセーブデータを使えなくなるおそれがあります。まずコピーで試してください。
deposits.list = 鉱床一覧
deposits.add = 鉱床を追加
deposits.select_help = 左側で鉱床を選択するか、+でResourcesに登録された資源用の鉱床を追加してください。
deposits.name = 鉱床
deposits.name.help = deposits.ini内のセクション名です。ログとエディターのブラシで鉱床を識別する名前になり、後から変更できません。
deposits.new_name = 鉱床名
deposits.new_hint = ここでは標準的な設定だけを指定します。その他の項目（成分、建物の種類、枯渇）は、追加後に右側の設定で変更できます。
deposits.code_patch = コードパッチ
deposits.code_patch.description = ONで設定した$TYPE_MINE_の鉱床種類をゲームに組み込み、鉱山がbuilding.ini経由で見つけられるようにします。更新後にゲームのデータが想定と一致しなくなった場合、プラグインは何も変更しません。
deposits.minimap_all = ミニマップのレイヤー
deposits.minimap_all.description = ONで個別に有効化したプラグインの鉱床ごとに、ゲームの五つのミニマップボタンの下へボタンを表示します。\nOFFではプラグインの鉱床ボタンをすべて隠します。
deposits.editor_all = 地形エディターのブラシ
deposits.editor_all.description = ONでブラシ名のある鉱床ごとに、地形エディターの資源タブへ描画用と消去用のブラシを表示します。\nOFFではプラグインの鉱床ブラシをすべて隠します。
deposits.token = 建物のトークン
deposits.token.description = 鉱山がこの鉱床に対してbuilding.iniで使うトークンです。例：$TYPE_MINE_COPPER。$TYPE_MINE_GRAVELと同じ形式で入力してください。同じbuilding.ini内に二つの鉱床トークンを使わないでください。
deposits.type = 種類番号
deposits.type.description = 鉱床の一意の種類番号です。異なる鉱床に同じ番号は使えません。\n10から127 = 設定可能な範囲\n0から9 = 基本ゲーム用に予約済み\nダイアログは次の空き番号を自動的に提案します。
deposits.map = マップ
deposits.map.description = 鉱床を保存するマップです。\nauto = プラグインのマップの空き枠を自動選択（推奨）\nresourcemapまたはresourcemap2 = 基本ゲームのマップを使用\nresourcemap3からresourcemap10 = プラグインの追加マップを使用\nterrain = 描画済みの地面を直接使用。砂利などに使用し、ブラシはROCKSの下に表示される
deposits.component = 成分
deposits.component.description = 各マップには0から3までの四つの枠があります。一つの枠に一種類の鉱床を保存できます。\nautoの場合 = 空欄にする。プラグインが空き枠を選ぶ\nterrainの場合：2 = 砂利レイヤー\nterrainの場合：3 = オアシスレイヤー
deposits.building_type = 建物の種類
deposits.building_type.description = この鉱床を採掘できる建物の種類です。\n7 = 鉱山。ほぼすべての鉱床に適している\n92 = 井戸\n空欄 = 7
deposits.radius = 探索半径
deposits.radius.description = 鉱山が鉱床を探す範囲です。\noil, ore, bauxite, gravel, wood, water, watersurface = 対応するゲーム内の定数を使用\n数値 = 指定した距離を直接使用\n空欄 = oreを使用\n半径がないと鉱山は鉱床を見つけられません。
deposits.icon = ミニマップのアイコン
deposits.icon.description = ミニマップボタンに表示するアイコンの資源です。ゲームがすでに読み込んだアイコンを使うため、別画像は不要です。\nResourcesプラグインの資源は、そちらに登録されている必要があります。\n空欄 = アイコンなし
deposits.minimap = ミニマップボタン
deposits.minimap.description = ONでこの鉱床のミニマップボタンとオーバーレイレイヤーを追加します。
deposits.editor = エディターのブラシ名
deposits.editor.description = 地形エディターの描画用・消去用ブラシの名前です。vfs\media_soviet\editor内のtool_paint_<name>.pngとtool_erase_<name>.pngにも同じ名前を使います。\n空欄 = ブラシを作成しない\n使用可能：最大31文字の英字、数字、_、-
deposits.deplete = テクセルあたりの枯渇設定
deposits.deplete.description = Depletionプラグインが読み取る設定です。資源マップの完全に満たされた一点から採掘できるトン数を指定します。資源の薄い点では比例して少なくなります。\nplugins\depletion.iniのtonnes_per_texelより優先されます。\n0 = この鉱床は無限のまま\n空欄 = 全体設定の値を使用
deposits.save_warning = 変更は保存時にのみ、実際に使用されるdeposits.iniへ書き込まれます。セーブデータですでに使用中の鉱床の種類番号、マップチャンネル、トークンは変更しないでください。まずコピーで試してください。
depletion.tab.general = 全般
depletion.tab.mining = 採掘
needs.save_warning = 変更は保存時にのみ、実際に使用されるneeds.iniへ書き込まれます。各需要は対象店舗に保管枠を追加し、この枠はセーブデータの一部になります。まずコピーで試してください。
bp.name = Buildings Plus
bp.description = 定義から新しい建物を作ります。ゲームのひな型建物に、変更するbuilding.iniの行を組み合わせます。ゲーム起動時に完全なWorkshopアイテムとして書き出されます。
bp.notice = 各建物は固有のWorkshop IDを持つフォルダーとしてmedia_soviet\workshop_wip内に作成されます。IDが空欄の場合、ゲーム起動時に9300000000以降の次の空き番号を割り当て、plugins\buildings_plus.ids.iniに保存します。ゲームはこのフォルダーを未公開のWorkshopアイテムとして読み込みます。変更にはゲームの完全な再起動が必要です。この建物を含むセーブデータの読み込みにはフォルダーが必要です。
bp.tab.general = 全般
bp.tab.buildings = 建物
bp.tab.generated = 生成済みの建物
bp.wip = ゲームフォルダー内の生成済み建物
bp.wip.description = Buildings Plusまたは元のbuildingsプラグインがmedia_soviet\workshop_wipに生成した建物を表示します。表示内容はフォルダーから読み取ります。
bp.wip.empty = 生成済みの建物はまだありません。建物を有効にすると、ゲーム起動時に生成されます。
bp.group = 建物
bp.group.notice = ここで作る建物は、ゲーム内の建物の一部の行を変更したコピーです。モデルと接続は同じで、生産レシピを独自に設定できます。同じ種類のひな型を選んでください（鉱山には鉱山、工場には工場）。
bp.list = 建物
bp.add = 追加
bp.select_help = 左側で建物を選択するか、+で追加してください。最初にひな型を選びます。Workshop IDは空欄でもかまいません。名前と行の設定は右側で行います。
bp.id = オブジェクト名
bp.id.help = 生成する建物のフォルダーとオブジェクトの名前になり、ログにも表示されます。英字、数字、_、-のみ、最大64文字です。後から変更できません。
bp.save_warning = 変更は保存時にのみ、実際に使用されるbuildings_plus.iniへ書き込まれ、ゲームの完全な再起動後に反映されます。その際にmedia_soviet\workshop_wip内のフォルダーを書き出します。エラーのあるセクションはスキップされ、ログに名前が記録されます。
bp.list.note = 最大256件の建物。
bp.new_name = オブジェクト名
bp.new_hint = 空白はアンダースコアに、大文字は小文字に変換されます。
bp.card.folders = 生成済みフォルダー
bp.card.log = トラブルシューティング
bp.card.new = 新しい建物
bp.links = ガイド
bp.link.readme = README（ガイド）
bp.prune = フォルダーの整理
bp.prune.description = ONで削除または無効化した建物の生成済みフォルダーを、次回のゲーム起動時に削除します。このプラグインが書き出したフォルダーだけが対象です。\nOFFではフォルダーを残し、ゲームは引き続きその建物を読み込みます。
bp.always = 常に書き直す
bp.always.description = ONでゲーム起動のたびにすべての建物フォルダーを書き出します。\nOFFでは該当セクション、プラグイン、ひな型のファイルが変更された場合にのみ書き出します。OFFのままにしてください。
bp.verbose = 詳細ログ
bp.verbose.description = ONでコピーしたすべてのファイルと、ひな型から削除したすべての行をlogs\tesmioloader.buildings_plus.logに記録します。\nOFFでは結果、警告、エラーのみを書き込みます。
bp.repair_owner_ids = 所有者IDを補完
bp.repair_owner_ids.description = ONで所有者IDのない生成済み建物に、あなたのSteam IDを設定します。他の生成ツールの建物も対象です。IDがないと、その建物を含むセーブデータを読み込むたびにWorkshopアイテムの不足を確認されます。\nOFFでは他の生成ツールのフォルダーに手を加えません。
bp.card.saves = セーブデータ
bp.card.saves.description = セーブデータは建設済みの各建物の保管設備を記憶しています。この設定により、独自の建物に追加した保管用の行を、すでに存在する建物にも反映できます。
bp.retrofit = 建設済み建物の保管設備も更新
bp.retrofit.description = ON：セーブデータの読み込み時に、完成済みの生成建物へ、セクションに追加した単一資源用の保管設備を空の状態で追加します。保管行の容量を変えると設備の容量も変わります。縮小は在庫が収まるまで待機します。行を削除した保管設備は、空になると建物から取り除かれます。\nOFF：建設済み建物の保管設備はそのままです。追加・変更した行は、それ以降に建設する建物にのみ反映されます。
bp.enabled = 建物を有効化
bp.enabled.description = ONで次回のゲーム起動時にこの建物を生成します。\nOFFでは生成しません。「フォルダーの整理」が有効なら、既存フォルダーを次回起動時に削除します。
bp.item_id = Workshop ID
bp.item_id.description = 独自の番号も指定できます。9000000000から9999999999まで。ただし9100000000から9199999999までは他の生成ツール用に予約済みです。\nゲームフォルダーのworkshop_wip内のフォルダー名になります。後から変更しないでください。
bp.donor = ひな型の建物
bp.donor.description = コピーの元となる建物です。Workshopの建物はサブスクライブが必要です。\n「ひな型を選択...」で利用可能な建物を探してください。種類を合わせて、鉱山には鉱山、工場には工場、店舗には店舗を選びます。
bp.item_name = ゲーム内の名前
bp.item_name.description = ゲーム内に表示する名前です。\nドットを含む値は翻訳キーとして扱い、Localizationプラグインを通して解決します。例：localization.lang.salt_mine
bp.desc = 説明
bp.desc.description = Workshopアイテムの説明です。一行ずつ入力してください。引用符は使わないでください。
bp.line = building.iniの行
bp.line.description = 一行ごとにbuilding.iniの行を入力します。例：$PRODUCTION raw_salt 1.0。「行を選択…」でひな型の建物から行を取り込み、変更できます。独自の行はひな型の行より前に置かれ、次を置き換えます：同じトークン、すべての$TYPE_*、$RESOURCE_VISUALIZATIONとともにすべての$STORAGE*、一つのレシピとしての$PRODUCTION・$CONSUMPTION・$CONSUMPTION_PER_SECOND。それ以外のひな型の内容は残ります。\n独自の資源には、必ず資源名を指定した$STORAGE_IMPORT_SPECIALまたは$STORAGE_EXPORT_SPECIALを使ってください。そうしないと保管設備に輸送クラスのすべての資源が表示されます。
bp.strip = ひな型の行を削除
bp.cmd_add = 末尾に追加
bp.cmd_add.description = 一行につき一つのコマンドです。ひな型ファイルの終端の直前に新しい行を挿入します。複数行のブロックは行の間を|で区切って記述します。
bp.cmd_replace = 置換
bp.cmd_replace.description = 一行につき一つのコマンドです。形式：元の行 | 新しい行。元の行はひな型ファイル内にちょうど一回だけ存在する必要があります。
bp.cmd_remove = 削除
bp.cmd_remove.description = 一行につき一つのコマンドです。ひな型ファイルから削除する行を指定します。関連する行（点、位置）も削除されます。
bp.cmd_insert = 挿入
bp.cmd_insert.description = 一行につき一つのコマンドです。形式：0または1 | 基準行 | 新しい行。0では基準行の前に、1では後に挿入します。
bp.strip.description = 一行につき一つの$TOKENを指定します。例：$WORKERS_NEEDED。このトークンを持つひな型の行をすべて、置き換えずに削除します。
bp.life = 耐久度
bp.life.description = 空欄 = 3000\nrenderconfig.iniのLIFEです。倒壊するまでに建物が耐えられる量を表し、多くのゲーム内建物と同様です。
bp.card.lines = 行
bp.item_id.empty = ゲーム起動時に9300000000以降の次の空き番号をプラグインが割り当てます。
bp.item_name.empty = オブジェクト名を使用します。非推奨です。
needs_plus.card.log = トラブルシューティング
resources_plus.card.log = トラブルシューティング
resources_plus.card.plugin = プラグイン
resources_plus.custom_report = 複製したレコードを記録
resources_plus.custom_report.description = ONでひな型を持つ各資源について、複製が実際に引き継いだ内容（輸送クラス、係数、フラグ）を記録します。ひな型のない資源は常に一覧に記録されます。\nOFFではひな型のない資源だけを記録します。
resources_plus.customs_hook = 税関を更新
resources_plus.customs_hook.description = ONで既存の税関の取引一覧に新しい資源を追加します。\nOFFでは基本ゲームと同じく、建設時に認識していた資源しか取引しません。その場合は解体して建て直す必要があります。
resources_plus.customs_probe = 税関への追加項目を記録
resources_plus.customs_probe.description = ONで税関に追加した資源ごとにtesmioloader.logへ一行書き込みます。税関に期待する内容が表示されたらOFFにしてください。
resources_plus.price_hook = INIの価格を適用
resources_plus.price_hook.description = ONで[base_price]と[price]を有効にします。基準価格はゲームの価格計算前に、固定価格は計算後に設定します。\nOFFでは価格をゲームに任せます。
resources_plus.price_report = 価格表をログに記録
resources_plus.price_report.description = ONでゲームが価格計算を行うたびに、一覧の各資源の価格、基準価格、価格区分をtesmioloader.logに書き込みます。価格0.00は生産する建物がないことを意味します。\nOFFでは何も書き込みません。
