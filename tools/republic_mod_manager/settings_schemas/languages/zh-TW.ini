[language]
name = 繁體中文

[strings]
plugin.resources = Resources
plugin.resources.description = 管理資源、屬性以及可選的價格覆蓋設定。
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = 使用 Resources Plus 新增自訂資源：與原版相同的清單，儲存在 plugins\resources_plus.ini 中，並修復退出時崩潰的問題。
resources_plus.save_warning = 點選儲存後，修改才會寫入 plugins\resources_plus.ini。刪除存檔已經使用的資源可能損壞該存檔。
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = 使用 Needs Plus 新增自訂市民需求：與原版相同的清單，儲存在 plugins 資料夾中的 needs_plus.ini 檔案內，首次啟動時從 needs.ini 匯入。
needs_plus.save_warning = 點選儲存後，修改才會寫入 plugins 資料夾中的 needs_plus.ini。每項需求都會向相關商店新增一個儲存槽，而該槽會成為存檔的一部分；請先在存檔副本上測試。
tab.resources.editor = 資源
group.resource_definitions = 資源定義
detail.transport = 運輸類別
detail.transport.description = 決定哪些車輛和倉庫能夠運輸或儲存該資源。只需選擇名稱；外掛會補充基礎遊戲中該類別的數值。
detail.kind = 價格類型
detail.kind.description = 0 原材料，1 製成品，2 食品/服裝，3 高級材料，4 電子產品。
detail.record_price = 資源記錄的初始價格
detail.record_price.description = 資源記錄內可選的 RUB 和 USD 初始值。
detail.record_base_price = 資源記錄的初始基礎價格
detail.record_base_price.description = 資源記錄內可選的 RUB 和 USD 基礎值。
detail.trade_mult = 貿易乘數
detail.trade_mult.description = 出售和購買乘數，通常為 0.95、1.05。
detail.market_rub = RUB 市場資料塊
detail.market_usd = USD 市場資料塊
detail.market.description = 兩個市場數值和一個可選系數。\n（參見 INI 檔案中的說明）
detail.packed = 包裝貨物
detail.packed.description = 貨物顯示方式：自動、散裝或包裝。
detail.family = 材料族
detail.family.description = 決定材料堆放在建築工地時的外觀，並很可能決定它會變成哪種廢物。每個材料族包含一種廢物資源。INI 檔案中 10 至 19 的編號會以名稱顯示。
detail.cargo = 貨物幾何模型
detail.cargo.description = 選擇用於貨物可視化的幾何模型。
detail.pinned_base_price = 固定基礎價格
detail.pinned_base_price.description = [base_price] 中可選的 RUB 和 USD 數值。留空表示沒有自訂條目。
detail.forced_price = 強制最終價格
detail.forced_price.description = [price] 中可選的 RUB 和 USD 數值。留空表示由遊戲計算價格。

; --- 已安裝上游外掛的本地設定結構描述（自 0.13.0 起）---
daynight.description = 每個日歷日各有一次日出和日落。在基礎遊戲中，從白天到夜晚再回到白天需要 13 個日歷日，接近兩周。使用此外掛可將整個週期縮短到一天。
daynight.group.cycle = 晝夜
daynight.group.cycle.description = 晝夜週期的時長，以及夜晚何時到來。
daynight.group.pace = 執行速度
daynight.group.pace.description = 兩項獨立控制：一項用於車輛，另一項用於其他所有內容。不論上面的設定如何，它們始終生效。
daynight.group.diagnostics = 疑難排解
daynight.enabled.label = 啟用外掛
daynight.enabled.description = ON 啟用所設定的晝夜週期。
daynight.cycle_days.label = 每個晝夜週期的日歷天數
daynight.cycle_days.description = 從一次日出到下一次日出的日歷天數。\n1 = 每天各有一次日出和日落\n2 至 12 = 按比例延長週期\n13 = 基礎遊戲的週期
daynight.day_scale.label = 一天的時長（日歷減速程度）
daynight.day_scale.description = 一個日歷日相對於基礎遊戲延長多少。\nauto = 自動減慢日歷以符合光照週期；推薦\n1 = 不減慢日歷；晝夜此時會加快 13 倍\n2 至 100 = 按此倍數減慢日歷\n在“減慢哪些部分”中選擇遊戲中需要減速的部分。
daynight.slow.label = 減慢哪些部分
daynight.slow.description = 遊戲中需要減速的部分。\ncalendar = 只減慢日歷；推薦\nworld = 減慢一切，包括市民和車輛；較高數值看起來像慢動作\nnone = 不減慢任何內容\n使用 calendar 時，市民、車輛、建設和生產保持正常速度。污染、貸款和訊息等每日流程保持通常的間隔。
daynight.offset.label = 夜晚到來的時間
daynight.offset.description = 在日歷日內移動夜晚的位置。\n0 = 在一天的中點稍後開始天黑\n0.5 = 日期變化時開始天黑\n使用任何非 0 的數值時，13 天的週期將不再與基礎遊戲完全一致。
daynight.fade.label = 縮放光照過渡時間
daynight.fade.description = ON 縮短早晨、白天、傍晚和夜晚之間的過渡，以符合所設定的週期。\nOFF 使用基礎遊戲中緩慢的過渡。週期較短時，過渡可能重疊，使光照顯得灰白。
daynight.vehicle_scale.label = 車輛速度
daynight.vehicle_scale.description = 卡車、火車、船舶和飛機的速度。獨立於其他設定生效。\n1 = 基礎遊戲速度\n2 = 一半速度\n0.5 = 兩倍速度\n數值越高 = 車輛越慢
daynight.sim_scale.label = 其他所有內容的速度
daynight.sim_scale.description = 市民、建設、生產、磨損和動畫的速度。\n1 = 基礎遊戲速度\n2 = 一半速度\n0.5 = 兩倍速度\n數值越高 = 模擬越慢
daynight.probe.label = 將每天的時長寫入記錄檔
daynight.probe.description = ON 將每個日歷日和光照過渡的實際時長寫入 tesmioloader.log。僅用於疑難排解及遊戲更新後的檢查。
walking.description = 市民的步行距離，以及汽車持有者在住宅、工作地點和停車場之間的駕車距離。
walking.group.distances = 距離
walking.group.distances.description = 沿道路和人行道測量，而非直線距離。河對岸直線距離為 400 m 的建築可能需要步行 1200 m 才能到達。
walking.group.diagnostics = 疑難排解
walking.enabled.label = 啟用外掛
walking.enabled.description = ON 啟用所設定的步行和駕車距離。
walking.distance.label = 步行距離 (m)
walking.distance.description = 市民願意步行的最長路線。基礎遊戲使用 480 m。\n數值越高 = 更多建築處於步行範圍內，建設時會建立更多連接\n0 = 無限制；在大城市中，建設此時可能需要幾秒鐘\n20000 = 可接受的最大值
walking.car_distance.label = 汽車持有者的駕車距離 (m)
walking.car_distance.description = 住宅、工作地點和停車場之間允許的最長駕車路線。基礎遊戲使用 2500 m。\n數值越高 = 汽車持有者可開得更遠\n請將其設為高於步行距離。數值相同時，汽車不會提供距離優勢。
walking.regen_on_load.label = 載入存檔時重建連接
walking.regen_on_load.description = 步行和停車連接儲存在存檔中。\nON 在載入存檔時重建所有連接，使所設定的距離也能影響現有城市。\nOFF 僅對新建建築應用所設定的距離。
walking.probe.label = 將檢查數值寫入記錄檔
walking.probe.description = ON 將外掛修改前在遊戲中找到的數值寫入 tesmioloader.log。僅用於疑難排解及遊戲更新後的檢查。
accumulator.description = 為電網提供蓄電池。擁有大型電力儲存空間的建築會在電力有餘時充電，並在電力不足時放電。
accumulator.group.battery = 蓄電池
accumulator.group.battery.description = 哪些建築被視為蓄電池，以及它們充放電的速度。
accumulator.group.window = 建築視窗
accumulator.group.grid = 電網
accumulator.group.diagnostics = 疑難排解
accumulator.enabled.label = 啟用外掛
accumulator.enabled.description = ON 啟用蓄電池建築的充放電。\nOFF 停止放電。建築會保留，並仍可充電。
accumulator.building_types.label = 建築類型
accumulator.building_types.description = 可以用作蓄電池的建築類型。多個編號用逗號分隔。\n19 = 變壓器\n18 = 變電站\n不要使用 17：發電廠無法接收電力，永遠不會充電。
accumulator.min_capacity.label = 被視為蓄電池的最低儲存容量
accumulator.min_capacity.description = 建築被視為蓄電池所需的最低儲存容量。用於排除普通變電站的小型儲存空間。\n數值越高 = 被視為蓄電池的建築越少\n數值越低 = 被視為蓄電池的建築越多\n附帶的“Stationary Accumulator”容量為 5000。
accumulator.charge_rate.label = 充電速度（每秒功率）
accumulator.charge_rate.description = 蓄電池每秒接收的最大功率。此限制可防止空蓄電池搶走整座城市的電力。\n數值越高 = 充電越快，電網負載越大\n數值越低 = 充電越慢，負載越小\n作為參考，燃煤電廠提供 70，風力渦輪機提供 15。
accumulator.discharge_rate.label = 放電速度（每秒功率）
accumulator.discharge_rate.description = 蓄電池每秒提供的最大功率。僅在電網電力不足時供電。\n數值越高 = 可補足更大的功率缺口\n數值越低 = 儲存的能量可用更久\n範例：設為 60 時，容量 5000 的滿電蓄電池可代替發電廠工作略多於 80 秒。
accumulator.panel.label = 在蓄電池視窗顯示電量行
accumulator.panel.description = ON 在蓄電池視窗中新增電量，例如“Dianliang: 4210.5 / 5000 (84.2 %)”。
accumulator.panel_caption.label = 該行的標題
accumulator.panel_caption.description = 電量數值前的單字。只能使用不帶變音符號的拉丁字母，不能使用漢字或特殊字元，否則遊戲會顯示亂碼。
accumulator.gauges.label = 根據蓄電池計算視窗儀表
accumulator.gauges.description = ON 將遊戲中錯誤的顯示替換為蓄電池實際的輸入和輸出流量。\nOFF 使用正常遊戲顯示。蓄電池充電時，它可能顯示功率為 0 和“無電力供應”。
accumulator.spread_voltage.label = 實驗：向相鄰建築傳遞電壓（保持關閉）
accumulator.spread_voltage.description = ON 沒有效果。此舊功能在技術上已被替代。請保持 OFF。
accumulator.trace.label = 記錄首個蓄電池的相鄰建築
accumulator.trace.description = ON 將首個蓄電池相鄰建築收到的電量寫入記錄檔。僅用於疑難排解；可能影響效能。
accumulator.log_seconds.label = 蓄電池記錄檔行之間的秒數
accumulator.log_seconds.description = tesmioloader.log 中蓄電池狀態訊息的間隔。每條訊息包含電量、輸入和輸出。\n0 = 不記錄狀態訊息\n數值越高 = 記錄檔記錄越少
accumulator.probe.label = 記錄檔中建築清單之間的秒數
accumulator.probe.description = tesmioloader.log 中所有電力儲存建築清單的記錄間隔。僅在蓄電池無法辨識或遊戲更新後使用。\n0 = 不記錄這些清單\n數值越高 = 記錄檔記錄越少
cities.description = 設定每座城市的大小和形狀。基礎遊戲中每座城市都是半徑 1000 m 的圓。此外掛可讓你直接在城市視窗中分別設定每座城市的半徑，也可選擇方形。數值儲存在存檔中。
cities.group.cities = 城市
cities.group.slider = 半徑滑桿
cities.group.slider.description = 城市視窗中滑桿的範圍，以及點選一次 + 或 - 會改變多少。
cities.group.layout = 城市視窗布局
cities.group.layout.description = 兩個新增行在城市視窗中的位置。數值使用遊戲視窗自身的單位；視窗寬度約為 500。
cities.group.overlay = 地面點陣
cities.group.diagnostics = 疑難排解
cities.enabled.label = 啟用外掛
cities.enabled.description = ON 啟用自訂城市大小和形狀。
cities.window.label = 城市視窗中的半徑滑桿和方形核取方塊
cities.window.description = ON 在城市視窗顯示半徑滑桿和方形核取方塊。\nOFF 隱藏兩者；已設定的數值會保留，但無法再修改。
cities.adopt.label = 為無歸屬建築建立獨立城市
cities.adopt.description = 縮小城市時，建築可能落在城市之外，不再屬於任何城市。\nON 會像遊戲本身一樣，用隨機名稱和今天的日期為它們建立新城市。\nOFF 使它們保持無城市歸屬；遊戲此時的行為尚未測試。
cities.radius.label = 預設半徑 (m)
cities.radius.description = 未單獨設定的城市所用的預設半徑。此數值適用於每張地圖。\n1000 = 基礎遊戲半徑\n數值越高 = 城市越大\n數值越低 = 城市越小
cities.square.label = 預設使用方形
cities.square.description = ON 將未單獨設定的城市設為方形。\nOFF 使用基礎遊戲中的圓形。
cities.radius_min.label = 滑桿最小半徑 (m)
cities.radius_min.description = 滑桿最左端的數值。
cities.radius_max.label = 滑桿最大半徑 (m)
cities.radius_max.description = 滑桿最右端的數值。滑桿有 100 步；範圍為 200 至 5000 時，每步為 48 m。
cities.step.label = 每次點選按鈕的百分比
cities.step.description = 點選一次 + 或 - 時改變的滑桿範圍百分比。拖動滑桿時不適用。\n數值越高 = 每次點選改變越大\n數值越低 = 每次點選調整越精細
cities.label_x.label = 標籤位置
cities.label_x.description = 標籤距視窗左邊緣的距離。
cities.widget_x.label = 控制項位置
cities.widget_x.description = 滑桿和核取方塊距視窗左邊緣的距離。滑桿需要約 225。
cities.checkbox_dy.label = 上下移動核取方塊所在行
cities.checkbox_dy.description = 上下移動核取方塊，避免與滑桿重疊。\n數值越高 = 核取方塊越靠下\n數值越低 = 核取方塊越靠上
cities.overlay.label = 邊界顯示跟隨半徑和形狀
cities.overlay.description = 城市視窗打開時，遊戲會在地面顯示藍色點陣，但始終只對應半徑 1000 m 的圓。\nON 使點陣適應你的半徑和形狀。\nOFF 保持基礎遊戲的顯示。
cities.overlay_step.label = 邊界點陣間距 (m)
cities.overlay_step.description = 城市邊界顯示中各點之間的距離。\n0 = 自動使用半徑的二十分之一，至少為 50 m\n數值越低 = 顯示越密集，效能開銷越大
cities.probe.label = 將城市寫入記錄檔
cities.probe.description = ON 在載入後將每座城市的半徑、形狀和建築數量寫入 tesmioloader.log。城市視窗打開時會記錄更多訊息。僅用於疑難排解；記錄檔可能迅速增大。
depletion.description = 礦藏會耗盡。工作中的礦井會明顯地從地圖上採走礦藏，剩餘越少，產量越低。開採情況儲存在存檔中；以後關閉外掛也不會恢復已開採的部分。請先在存檔副本上測試。
depletion.group.depletion = 開採
depletion.group.window = 礦井視窗
depletion.group.diagnostics = 疑難排解
depletion.enabled.label = 啟用外掛
depletion.enabled.description = ON 使所選礦藏隨著開採而耗盡。\nOFF 停止進一步消耗。已移除的資源不會恢復。
depletion.tonnes_per_texel.label = 每個地圖點的噸數
depletion.tonnes_per_texel.description = 礦井可從資源地圖中一個完全充滿的點開採的噸數。較貧瘠的點按比例減少。\n數值越高 = 礦藏可用越久\n數值越低 = 礦藏更快耗盡\n作為參考，搜尋半徑為 210 m 的礦井覆蓋數千個地圖點。
depletion.vanilla.label = 會耗盡的基礎遊戲礦藏
depletion.vanilla.description = 允許耗盡的基礎遊戲礦藏。多個值用逗號分隔。\noil, iron, coal, uranium, bauxite, gravel = 僅指定礦藏\nall = 所有礦藏\nnone = 不消耗任何基礎遊戲礦藏\nname:value = 自訂每個地圖點的噸數，例如 iron:3000\ndeposits.ini 中的礦藏始終包含在內。\ngravel 會永久磨掉可見的地面材質，並且由於搜尋區域較小，需要高得多的數值。不填寫 gravel 可保持基礎遊戲行為。
depletion.flush_seconds.label = 儲存開採情況的間隔秒數
depletion.flush_seconds.description = 資源地圖更新之間的秒數。產量和品質會立即變化；只有小地圖和存檔按此間隔更新。\n數值越低 = 更新越頻繁，效能開銷越大\n每秒更新不要超過四次。
depletion.panel.label = 在礦井視窗顯示礦藏餘量行
depletion.panel.description = ON 在礦井視窗顯示剩餘儲量，並略微增加視窗高度，例如“Shengyu: 251.4 kt / 259.3 kt (96.9 %)”。
depletion.panel_caption.label = 該行的標題
depletion.panel_caption.description = 餘量前的單字。只能使用不帶變音符號的拉丁字母，不能使用漢字或特殊字元，否則遊戲會顯示亂碼。
depletion.log_seconds.label = 進度記錄檔行間隔（秒）
depletion.log_seconds.description = tesmioloader.log 中礦井狀態訊息之間的秒數。每條訊息包含剩餘量、總量和品質。\n0 = 不記錄狀態訊息\n數值越高 = 記錄檔記錄越少\n觀察幾個遊戲日，以找到合適的每個地圖點噸數。
easystart.description = 市民需求會隨著年份逐步出現。尚未解鎖的需求不影響幸福度和健康；市民仍會前往相關地點並購物，只是在指定年份之前不會產生後果。
easystart.group.general = 推遲哪些要求
easystart.group.unlock = 解鎖年份
easystart.group.unlock.description = 要求自該年元旦（1 月首日）起生效。此時間表面向 1920 年建立的共和國。如果從 1960 年開始，預設年份就都已過去。\noff = 不推遲；使用基礎遊戲行為\nalways = 從第一個遊戲日起生效\n年份 = 在該年解鎖
easystart.group.diagnostics = 疑難排解
easystart.enabled.label = 啟用外掛
easystart.enabled.description = ON 按所設定的時間表解鎖需求和公用設施要求。
easystart.demands.label = 推遲九項市民需求
easystart.demands.description = ON 將食品、肉類、服裝、電子產品、酒類、宗教、文化、體育和健康需求推遲到各自設定的解鎖年份。
easystart.utilities.label = 推遲三項建築公用設施要求
easystart.utilities.description = ON 將供電、供水和供暖要求推遲到各自設定的解鎖年份。
easystart.warnings.label = 推遲建築視窗中的警告
easystart.warnings.description = ON 在解鎖年份之前隱藏相關警告，例如“建築沒有電力供應”。
easystart.pin_status.label = 保持鎖定需求的滿足度
easystart.pin_status.description = ON 將鎖定需求的滿足度保持在下方數值。\nOFF 允許滿足度繼續下降；解鎖時可能已經很低。
easystart.locked_status.label = 鎖定期間的滿足度
easystart.locked_status.description = 需求鎖定時的滿足度。對於食品，此值表示飽腹度。\n1.0 = 完全滿足或吃飽\n0.5 = 中等水平，解鎖後可明顯改善
easystart.clear_unsatisfied.label = 從未滿足清單中排除鎖定需求
easystart.clear_unsatisfied.description = ON 防止鎖定需求產生“N 名市民無法獲得 X”的訊息。
easystart.probe.label = 將解鎖情況寫入記錄檔
easystart.probe.description = ON 在每次年份變化時，將仍然鎖定的需求寫入 tesmioloader.log。也會記錄一次首位受影響的市民。僅用於疑難排解。
easystart.food.label = 食品
easystart.religion.label = 宗教
easystart.meat.label = 肉類
easystart.clothes.label = 服裝
easystart.alcohol.label = 酒類
easystart.sport.label = 體育
easystart.culture.label = 文化
easystart.health.label = 健康
easystart.electricity.label = 電力
easystart.water.label = 供水（包含污水處理）
easystart.heating.label = 供暖
easystart.electronics.label = 電子產品
easystart.school.label = 學校
easystart.school.description = 在該年之前，兒童可像遊戲中“簡單”教育設定那樣不去學校也能學習，且不會出現“N 名兒童無法上學”的訊息。
easystart.kindergarten.label = 幼兒園
easystart.kindergarten.description = 在該年之前，家長不必為照顧六歲以下兒童而留在家中，且不會出現“N 名工人無法工作，因為所有幼兒園……”的訊息。
plugin.needs = Needs
plugin.needs.description = 無需編輯上游檔案，即可管理額外的市民需求和外掛開關。
tab.needs.editor = 需求
group.needs = 市民需求
group.needs.plugin = 外掛設定
group.needs.plugin.description = 適用於所有需求的開關。
needs.list = 需求清單
needs.add = 新增需求
needs.select_help = 在左側選擇需求，或使用 + 新增已由 Resources 註冊的資源。
needs.resource = 資源
needs.resource.help = 市民將會需要的資源。必須已在 Resources 外掛的清單中註冊。
needs.donor = 範本需求
needs.donor.description = 用作範本的現有需求。\nfood 或 meat = 用於食品商店\nclothes 或 eletronics = 用於百貨商店\nalcohol = 用於酒類商店\neletronics 是遊戲使用的拼寫。
needs.factor = 數量系數
needs.factor.description = 相對於範本需求的商品數量。\n1.0 = 與範本相同的數量\n數值越高 = 市民需要越多\n數值越低 = 市民需要越少
needs.category = 商店類別
needs.category.description = 儲存這些商品的商店。\nauto = 與範本需求相同的商店\nnone = 不自動新增貨架；建築必須自行提供商品\nbasic = 僅基礎商店\nmedium = 僅中型商店\nadvanced = 僅大型商店\nmediumadvanced = 僅中型和大型商店\nhotel = 僅酒店\n數字 = 直接寫入此商店數值；僅供熟悉遊戲檔案的使用者使用
needs.chance = 機率
needs.chance.description = 市民獲得此需求的機率，範圍為 0 至 1。低於 1 時，需求的分配獨立於範本需求。\n0 = 沒有市民獲得此需求\n1 = 每位符合條件的市民都獲得此需求
needs.unhappy = 不滿度
needs.unhappy.description = 市民無法獲得商品時損失的滿足度。\n0 = 不損失；只顯示該需求\n0.005 至 0.02 = 舒適類商品的典型範圍\n允許範圍：0 至 1
needs.enabled = 啟用外掛
needs.enabled.description = ON 啟用外掛。\nOFF 在下次啟動遊戲時完全停用外掛。
needs.demand = 新增市民需求
needs.demand.description = ON 為市民分配新需求。\nOFF 不分配需求，但仍可能向商店新增商品。
needs.storage = 為商店供貨
needs.storage.description = ON 向所選商店新增商品。\nOFF 不新增儲存槽；市民只能在自行提供這些商品的建築中找到它們。
needs.max_demands = 每位市民的需求數
needs.max_demands.description = 一位市民同時可以擁有的額外需求上限。\n1 = 最多一項額外需求\n7 = 允許的最大數量
needs.when_full = 市民需求已滿時
needs.when_full.description = 當市民已經達到額外需求上限時的處理方式。\nskip = 等待空位\nreplace = 本次替換範本需求
needs.probe = 詳細記錄檔
needs.probe.description = ON 將市民需求清單和每家商店的資訊寫入外掛的詳細記錄檔。\nOFF 僅記錄警告。檢查新商店時可臨時啟用。
needs.log_seconds = 進度記錄檔行間隔（秒）
needs.log_seconds.description = 報告已分配需求數量的訊息之間的秒數。\n0 = 停用這些訊息\n數值越高 = 記錄檔記錄越少
tab.needs.general = 一般
plugin.deposits = Deposits
plugin.deposits.description = 無需編輯上游檔案，即可管理基礎遊戲沒有的礦藏類型和外掛開關。
tab.deposits.general = 一般
tab.deposits.editor = 礦藏
group.deposits = 礦藏
group.deposits.description = 原有礦藏受到保護，可以隱藏；自訂礦藏單獨儲存，並合併到實際生效的 deposits.ini 中。除 [deposits] 外，每個區段代表一處礦藏。
group.deposits.plugin = 外掛設定
group.deposits.plugin.description = [deposits] 區段中的三個子系統。此處關閉某個開關時，對應子系統會對所有礦藏關閉。
deposits.notice = 一旦礦井使用某處礦藏，其類型編號、地圖通道和 building.ini 中的標記就成為存檔的一部分。刪除或重新編號存檔使用的礦藏可能使該存檔無法使用；請先在副本上測試。
deposits.list = 礦藏清單
deposits.add = 新增礦藏
deposits.select_help = 在左側選擇礦藏，或使用 + 為已由 Resources 註冊的資源新增礦藏。
deposits.name = 礦藏
deposits.name.help = deposits.ini 中的區段名稱。用於在記錄檔和編輯器筆刷中標識礦藏；以後無法改名。
deposits.new_name = 礦藏名稱
deposits.new_hint = 此處只詢問標準設定。其他設定（分量、建築類型、耗盡量）在新增後位於右側。
deposits.code_patch = 程式碼修補程式
deposits.code_patch.description = ON 將所設定的 $TYPE_MINE_ 礦藏類型加入遊戲，讓礦井可以通過 building.ini 找到它們。如果更新後預期的遊戲資料不再符合，外掛不會做任何修改。
deposits.minimap_all = 小地圖圖層
deposits.minimap_all.description = ON 為每處單獨啟用的外掛礦藏，在遊戲的五個小地圖按鈕下方顯示一個按鈕。\nOFF 隱藏所有外掛礦藏按鈕。
deposits.editor_all = 地形編輯器筆刷
deposits.editor_all.description = ON 為每處設定了筆刷名稱的礦藏，在地形編輯器的資源索引標籤中顯示繪製和擦除筆刷。\nOFF 隱藏所有外掛礦藏筆刷。
deposits.token = 建築標記
deposits.token.description = 礦井在 building.ini 中用於此礦藏的標記，例如 $TYPE_MINE_COPPER。請按 $TYPE_MINE_GRAVEL 的形式輸入。切勿在同一個 building.ini 中使用兩個礦藏標記。
deposits.type = 類型編號
deposits.type.description = 礦藏的唯一類型編號。兩處礦藏不能使用相同編號。\n10 至 127 = 允許範圍\n0 至 9 = 為基礎遊戲保留\n對話框會自動建議下一個可用編號。
deposits.map = 地圖
deposits.map.description = 儲存礦藏的地圖。\nauto = 自動在外掛地圖中選擇空槽；推薦\nresourcemap 或 resourcemap2 = 使用基礎遊戲地圖\nresourcemap3 至 resourcemap10 = 使用額外外掛地圖\nterrain = 直接使用繪製的地面，例如礫石；其筆刷出現在 ROCKS 下
deposits.component = 分量
deposits.component.description = 每張地圖有四個槽，編號為 0 至 3。每個槽可包含一種礦藏。\n使用 auto 時 = 留空；外掛選擇空槽\n使用 terrain 時：2 = 礫石層\n使用 terrain 時：3 = 綠洲層
deposits.building_type = 建築類型
deposits.building_type.description = 可以開採此礦藏的建築類型。\n7 = 礦井；幾乎適用於所有礦藏\n92 = 水井\n留空 = 7
deposits.radius = 搜尋半徑
deposits.radius.description = 礦井搜尋礦藏的距離。\noil, ore, bauxite, gravel, wood, water, watersurface = 使用對應的遊戲常數\n數字 = 直接使用此距離\n留空 = 使用 ore\n沒有半徑時，礦井找不到礦藏。
deposits.icon = 小地圖圖示
deposits.icon.description = 小地圖按鈕上顯示其圖示的資源。外掛使用遊戲已經載入的圖示；無需單獨提供圖片。\nResources 外掛中的資源必須先在其中註冊。\n留空 = 無圖示
deposits.minimap = 小地圖按鈕
deposits.minimap.description = ON 為此礦藏新增小地圖按鈕和疊加圖層。
deposits.editor = 編輯器筆刷名稱
deposits.editor.description = 地形編輯器中繪製和擦除筆刷的名稱。同一名稱也用於 vfs\media_soviet\editor 下的 tool_paint_<name>.png 和 tool_erase_<name>.png。\n留空 = 不建立筆刷\n允許：最多 31 個字元，可用字母、數字、_ 和 -
deposits.deplete = 每個紋素的耗盡量
deposits.deplete.description = 此設定由 Depletion 外掛讀取。它決定礦井能從資源地圖中一個完全充滿的點開採的噸數。較貧瘠的點按比例減少。\n此值覆蓋 plugins\depletion.ini 中的 tonnes_per_texel。\n0 = 此礦藏保持無限\n留空 = 使用全域值
deposits.save_warning = 只有儲存時，修改才會寫入實際生效的 deposits.ini。存檔已經使用的礦藏類型編號、地圖通道和標記不得更改；請先在副本上測試。
depletion.tab.general = 一般
depletion.tab.mining = 開採
needs.save_warning = 只有點選儲存後，修改才會寫入實際生效的 needs.ini。每項需求都會向相關商店新增一個儲存槽，而該槽會成為存檔的一部分；請先在存檔副本上測試。
bp.name = Buildings Plus
bp.description = 根據聲明建立新建築：使用遊戲中的範本建築，加上與範本不同的 building.ini 行。每次啟動遊戲時，都會寫成完整的創意工坊物品。
bp.notice = 每座建築都會成為 media_soviet\workshop_wip 下帶獨立創意工坊 ID 的資料夾。將 ID 留空，外掛就會在遊戲啟動時從 9300000000 開始分配下一個可用編號，並儲存在 plugins\buildings_plus.ids.ini 中。遊戲會將此資料夾作為未發布的創意工坊物品讀取。修改需要完全重啟遊戲。包含這類建築的存檔在載入時需要相應資料夾。
bp.tab.general = 一般
bp.tab.buildings = 建築
bp.tab.generated = 已生成建築
bp.wip = 遊戲資料夾中已生成的建築
bp.wip.description = 顯示由 Buildings Plus 或原版 buildings 外掛生成到 media_soviet\workshop_wip 中的建築。此處內容從資料夾讀取。
bp.wip.empty = 此處尚無已生成建築。啟用某座建築後，會在遊戲啟動時生成。
bp.group = 建築
bp.group.notice = 此處的建築是遊戲建築的副本，僅修改部分行：模型相同、連接相同，使用你的生產配方。請選擇同類範本（礦井對應礦井，工廠對應工廠）。
bp.list = 建築
bp.add = 新增
bp.select_help = 在左側選擇建築，或使用 + 新增。首先選擇範本，創意工坊 ID 可以留空；名稱和行內容隨後在右側填寫。
bp.id = 物件名稱
bp.id.help = 為生成建築的資料夾和物件命名，並顯示在記錄檔中。僅限字母、數字、_ 和 -，最多 64 個字元；以後不能更改。
bp.save_warning = 修改僅在儲存時寫入實際生效的 buildings_plus.ini，並在完全重啟遊戲後生效。隨後外掛會寫入 media_soviet\workshop_wip 下的資料夾；存在錯誤的區段會被跳過，並在記錄檔中列出名稱。
bp.list.note = 最多 256 座建築。
bp.new_name = 物件名稱
bp.new_hint = 空格轉換為底線，大寫字母轉換為小寫。
bp.card.folders = 已生成資料夾
bp.card.log = 疑難排解
bp.card.new = 新建築
bp.links = 指南
bp.link.readme = README（指南）
bp.prune = 清理資料夾
bp.prune.description = ON 在下次啟動遊戲時，刪除已被你移除或關閉的建築所生成的資料夾（僅限此外掛建立的資料夾）。\nOFF 保留這些資料夾；遊戲會繼續載入相應建築。
bp.always = 始終重寫
bp.always.description = ON 在每次啟動遊戲時寫入所有建築資料夾。\nOFF 僅在對應區段、外掛或範本檔案發生變化時寫入資料夾。請保持 OFF。
bp.verbose = 詳細記錄檔
bp.verbose.description = ON 將每個複製的檔案和每個移除的範本行寫入 logs\tesmioloader.buildings_plus.log。\nOFF 僅記錄結果、警告和錯誤。
bp.repair_owner_ids = 補齊擁有者 ID
bp.repair_owner_ids.description = ON 為缺少擁有者 ID 的已生成建築填入你的 Steam ID，也包括其他生成器建立的建築。沒有此 ID 時，每次載入使用這類建築的存檔，遊戲都會詢問缺失的創意工坊物品。\nOFF 不修改其他生成器的資料夾。
bp.card.saves = 存檔
bp.card.saves.description = 存檔會記住每座現有建築的儲存空間。此功能讓你為某座建築新增的儲存行也能應用到已經建成的建築。
bp.retrofit = 同步更新現有建築的儲存空間
bp.retrofit.description = ON：載入存檔時，每座已完工的生成建築都會獲得你在其設定區段中新增的單資源儲存空間，初始為空。修改儲存行的容量時，儲存空間也會變化；縮小容量會等到現有庫存能夠容納後再執行。被你刪除設定行的儲存空間會在清空後從建築中移除。\nOFF：現有建築的儲存空間保持不變；新增和修改的行僅應用於以後建造的建築。
bp.enabled = 啟用建築
bp.enabled.description = ON 在下次啟動遊戲時生成此建築。\nOFF 不生成此建築。啟用“清理資料夾”時，其現有資料夾會在下次啟動時刪除。
bp.item_id = 創意工坊 ID
bp.item_id.description = 可使用自訂編號：9000000000 至 9999999999，但不包括 9100000000 至 9199999999（為其他生成器保留）\n它決定遊戲資料夾中 workshop_wip 下的資料夾名稱，之後不應更改。
bp.donor = 範本建築
bp.donor.description = 作為複製起點的建築；如果來自創意工坊，必須先訂閱。\n使用“選擇範本...”瀏覽已有建築。類型必須對應：礦井對應礦井，工廠對應工廠，商店對應商店。
bp.item_name = 遊戲內名稱
bp.item_name.description = 遊戲中顯示的名稱。\n帶點號的值被視為翻譯鍵，並通過 Localization 外掛解析，例如：localization.lang.salt_mine
bp.desc = 描述
bp.desc.description = 創意工坊條目的描述，每行填寫一行內容。不要加引號。
bp.line = building.ini 行
bp.line.description = 每行填寫一條 building.ini 行，例如 $PRODUCTION raw_salt 1.0。使用“選擇行…”從範本建築中提取一行並修改。你的行會放在範本行之前，並替換：相同標記；所有 $TYPE_*；所有 $STORAGE* 及 $RESOURCE_VISUALIZATION；將 $PRODUCTION、$CONSUMPTION 和 $CONSUMPTION_PER_SECOND 作為一個完整配方替換。範本的其他內容全部保留。\n對於自訂資源，務必使用 $STORAGE_IMPORT_SPECIAL 或 $STORAGE_EXPORT_SPECIAL 並指定資源名稱，否則儲存空間會列出該運輸類別的所有資源。
bp.strip = 移除範本行
bp.cmd_add = 追加
bp.cmd_add.description = 每行一條命令：新增行，放在範本檔案的結束標記之前。包含多行的區塊使用 | 分隔各行。
bp.cmd_replace = 替換
bp.cmd_replace.description = 每行一條命令：舊行 | 新行。舊行在範本檔案中必須恰好出現一次。
bp.cmd_remove = 移除
bp.cmd_remove.description = 每行一條命令：要從範本檔案中移除的行。屬於該行的內容（點、位置）也一並移除。
bp.cmd_insert = 插入
bp.cmd_insert.description = 每行一條命令：0 或 1 | 錨點 | 新行。0 將新行放在錨點之前，1 放在之後。
bp.strip.description = 每行一個 $TOKEN，例如 $WORKERS_NEEDED。包含該標記的所有範本行都會被直接刪除，不作替換。
bp.life = 耐久度
bp.life.description = 留空 = 3000\nrenderconfig.ini 中的 LIFE：建築倒塌前能夠承受的損傷。與多數遊戲建築相同。
bp.card.lines = 行內容
bp.item_id.empty = 外掛在遊戲啟動時從 9300000000 開始分配下一個可用編號。
bp.item_name.empty = 物件名稱；不推薦。
needs_plus.card.log = 疑難排解
resources_plus.card.log = 疑難排解
resources_plus.card.plugin = 外掛
resources_plus.custom_report = 記錄複製資源的資料
resources_plus.custom_report.description = ON 為每個使用範本的資源，記錄其複本實際繼承的內容（運輸類別、系數、標誌）。沒有範本的資源始終會列出。\nOFF 僅列出沒有範本的資源。
resources_plus.customs_hook = 重新整理海關
resources_plus.customs_hook.description = ON 將新資源新增到現有海關的貿易清單。\nOFF 使用基礎遊戲行為：海關只能交易建成時已知的資源；此時只能拆除並重建才能更新。
resources_plus.customs_probe = 記錄海關條目
resources_plus.customs_probe.description = ON 為每種新增到海關的資源在 tesmioloader.log 中記錄一行。海關顯示符合預期後，請切換為 OFF。
resources_plus.price_hook = 應用 INI 中的價格
resources_plus.price_hook.description = ON 使 [base_price] 和 [price] 生效：基礎價格在遊戲計算價格之前設定，固定價格在之後設定。\nOFF 將價格交給遊戲處理。
resources_plus.price_report = 記錄價格表
resources_plus.price_report.description = ON 在遊戲每次計算價格後，將清單中每種資源的價格、基礎價格和價格類型寫入 tesmioloader.log。價格為 0.00 表示沒有建築生產該資源。\nOFF 不記錄任何內容。
