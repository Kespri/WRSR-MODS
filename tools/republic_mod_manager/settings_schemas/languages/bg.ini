[language]
name = Български

[strings]
plugin.resources = Resources
plugin.resources.description = Управление на ресурси, свойства и незадължителни собствени цени.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Собствени ресурси с Resources Plus: същият списък като в оригинала, в plugins\resources_plus.ini, без срив при излизане.
resources_plus.save_warning = Промените се записват в plugins\resources_plus.ini при запазване. Премахването на ресурс, който вече се използва в запазена игра, може да я повреди.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Собствени потребности на гражданите с Needs Plus: същият списък като в оригинала, във файла needs_plus.ini в папката plugins, прехвърлен от needs.ini при първото стартиране.
needs_plus.save_warning = Промените се записват в needs_plus.ini в папката plugins едва при запазване. Всяка потребност добавя складова позиция към съответните магазини, а тя е част от запазената игра. Първо тествайте върху копие.
tab.resources.editor = Ресурси
group.resource_definitions = Дефиниции на ресурси
detail.transport = Транспортен клас
detail.transport.description = Определя кои превозни средства и складове могат да превозват и съхраняват ресурса. Достатъчно е да изберете име; плъгинът добавя стойностите на основната игра за този клас.
detail.kind = Ценова категория
detail.kind.description = 0 суровини, 1 произведени стоки, 2 храна/облекло, 3 усъвършенствани материали, 4 електроника.
detail.record_price = Начална цена в записа
detail.record_price.description = Незадължителни начални стойности в RUB и USD в записа на ресурса.
detail.record_base_price = Начална базова цена в записа
detail.record_base_price.description = Незадължителни базови стойности в RUB и USD в записа на ресурса.
detail.trade_mult = Търговски множители
detail.trade_mult.description = Множители за продажба и покупка, обикновено 0.95 и 1.05.
detail.market_rub = Пазарен блок RUB
detail.market_usd = Пазарен блок USD
detail.market.description = Две пазарни стойности и незадължителен коефициент.\n(Вижте описанието в INI файла)
detail.packed = Опакован товар
detail.packed.description = Автоматично представяне на товара, неопакован или опакован товар.
detail.family = Група на материала
detail.family.description = Определя как изглежда материалът на купчина на строителна площадка и най-вероятно в какъв отпадък се превръща. Всяка група съдържа един отпадъчен ресурс. Числата от 10 до 19 в INI файла се показват с имената си.
detail.cargo = Геометрия на товара
detail.cargo.description = Избор на геометрия за визуализиране на товара.
detail.pinned_base_price = Фиксирана базова цена
detail.pinned_base_price.description = Незадължителна стойност в RUB и USD в [base_price]. Празно поле означава липса на собствен запис.
detail.forced_price = Принудително зададена крайна цена
detail.forced_price.description = Незадължителна стойност в RUB и USD в [price]. При празно поле играта изчислява цената.

; --- Локални схеми за инсталирани оригинални плъгини (от 0.13.0) ---
daynight.description = Един изгрев и един залез на календарен ден. В основната игра смяната от ден към нощ и обратно отнема 13 календарни дни, почти две седмици. С този плъгин тя се побира в един ден.
daynight.group.cycle = Ден и нощ
daynight.group.cycle.description = Продължителност на цикъла ден-нощ и момент на настъпване на нощта.
daynight.group.pace = Скорост
daynight.group.pace.description = Две отделни настройки: една за превозните средства и една за всичко останало. Те винаги действат независимо от зададеното по-горе.
daynight.group.diagnostics = Отстраняване на проблеми
daynight.enabled.label = Плъгинът е включен
daynight.enabled.description = ON включва настроения цикъл ден-нощ.
daynight.cycle_days.label = Календарни дни за цикъл ден-нощ
daynight.cycle_days.description = Календарни дни от един изгрев до следващия.\n1 = един изгрев и един залез всеки ден\n2 до 12 = съответно по-дълъг цикъл\n13 = цикълът на основната игра
daynight.day_scale.label = Продължителност на деня (колко пъти по-бавно върви календарът)
daynight.day_scale.description = Колко пъти по-дълго трае календарният ден спрямо основната игра.\nauto = автоматично забавяне на календара според светлинния цикъл; препоръчително\n1 = без забавяне на календара; тогава денят и нощта се сменят 13 пъти по-бързо\n2 до 100 = забавяне на календара с този множител\nИзберете кои части на играта да се забавят в „Какво да се забави“.
daynight.slow.label = Какво да се забави
daynight.slow.description = Кои части на играта да се забавят.\ncalendar = забавя само календара; препоръчително\nworld = забавя всичко, включително гражданите и превозните средства; високите стойности приличат на забавен каданс\nnone = не забавя нищо\nПри calendar гражданите, превозните средства, строителството и производството запазват нормалната си скорост. Ежедневни процеси като замърсяване, заеми и съобщения запазват обичайния си интервал.
daynight.offset.label = Кога настъпва нощта
daynight.offset.description = Измества нощта в рамките на календарния ден.\n0 = стъмва се малко след средата на деня\n0.5 = стъмва се при смяната на датата\nПри всяка стойност, различна от 0, цикълът от 13 дни вече не съвпада точно с основната игра.
daynight.fade.label = Мащабиране на светлинните преходи
daynight.fade.description = ON съкращава преходите между сутрин, ден, вечер и нощ според настроения цикъл.\nOFF използва бавните преходи на основната игра. При кратки цикли те може да се застъпват и да правят осветлението бледо.
daynight.vehicle_scale.label = Скорост на превозните средства
daynight.vehicle_scale.description = Скорост на камиони, влакове, кораби и самолети. Действа независимо от другите настройки.\n1 = скоростта на основната игра\n2 = половин скорост\n0.5 = двойна скорост\nПо-висока стойност = по-бавни превозни средства
daynight.sim_scale.label = Скорост на всичко останало
daynight.sim_scale.description = Скорост на гражданите, строителството, производството, износването и анимациите.\n1 = скоростта на основната игра\n2 = половин скорост\n0.5 = двойна скорост\nПо-висока стойност = по-бавна симулация
daynight.probe.label = Записване на продължителността на дните в дневника
daynight.probe.description = ON записва реалната продължителност на всеки календарен ден и светлинен преход в tesmioloader.log. Използвайте само за отстраняване на проблеми и проверки след обновяване на играта.
walking.description = Колко далеч ходят гражданите пеша и колко далеч пътуват собствениците на автомобили между дома, работата и паркинга.
walking.group.distances = Разстояния
walking.group.distances.description = Измерват се по пътища и пешеходни алеи, а не по права линия. Сграда на 400 m от другата страна на реката може да означава 1200 m пеша.
walking.group.diagnostics = Отстраняване на проблеми
walking.enabled.label = Плъгинът е включен
walking.enabled.description = ON включва настроените разстояния за ходене пеша и пътуване с автомобил.
walking.distance.label = Пешеходно разстояние (m)
walking.distance.description = Най-дългият маршрут, който гражданин ще измине пеша. Основната игра използва 480 m.\nПо-висока стойност = повече сгради са достъпни пеша и при строеж се създават повече връзки\n0 = без ограничение; тогава строежът в голям град може да отнеме няколко секунди\n20000 = най-високата допустима стойност
walking.car_distance.label = Разстояние за пътуване на собствениците на автомобили (m)
walking.car_distance.description = Най-дългото допустимо пътуване между дома, работата и паркинга. Основната игра използва 2500 m.\nПо-висока стойност = собствениците на автомобили пътуват по-далеч\nЗадайте стойност над пешеходното разстояние. При равни стойности автомобилът не дава предимство в обсега.
walking.regen_on_load.label = Пресъздаване на връзките при зареждане на запазена игра
walking.regen_on_load.description = Пешеходните и паркинг връзките се съхраняват в запазената игра.\nON пресъздава всички връзки при зареждане, така че настроените разстояния да засягат и съществуващите градове.\nOFF прилага настроените разстояния само към новопостроени сгради.
walking.probe.label = Записване на контролни стойности в дневника
walking.probe.description = ON записва в tesmioloader.log стойностите, намерени в играта, преди плъгинът да ги промени. Използвайте само за отстраняване на проблеми и проверки след обновяване на играта.
accumulator.description = Батерии за вашата електрическа мрежа. Сграда с голям запас от енергия се зарежда при излишък на електричество и го връща при недостиг.
accumulator.group.battery = Батерия
accumulator.group.battery.description = Кои сгради се считат за батерии и колко бързо се зареждат и разреждат.
accumulator.group.window = Прозорец на сградата
accumulator.group.grid = Електрическа мрежа
accumulator.group.diagnostics = Отстраняване на проблеми
accumulator.enabled.label = Плъгинът е включен
accumulator.enabled.description = ON включва зареждането и разреждането на сградите с батерии.\nOFF спира разреждането. Сградите остават и могат да продължат да се зареждат.
accumulator.building_types.label = Типове сгради
accumulator.building_types.description = Типове сгради, които могат да работят като батерии. Разделяйте няколко числа със запетаи.\n19 = трансформатор\n18 = подстанция\nНе използвайте 17: електроцентралата не може да приема електричество и никога няма да се зареди.
accumulator.min_capacity.label = Минимален капацитет за използване като батерия
accumulator.min_capacity.description = Минимален капацитет за съхранение, при който сградата се счита за батерия. Това изключва малките запаси на обикновените подстанции.\nПо-висока стойност = по-малко сгради се считат за батерии\nПо-ниска стойност = повече сгради се считат за батерии\nВключеният „Stationary Accumulator“ има капацитет 5000.
accumulator.charge_rate.label = Скорост на зареждане (мощност за секунда)
accumulator.charge_rate.description = Максимално количество електричество, което батерията приема за секунда. Ограничението не позволява празна батерия да отнеме електричеството на цял град.\nПо-висока стойност = по-бързо зареждане и по-голямо натоварване на мрежата\nПо-ниска стойност = по-бавно зареждане и по-малко натоварване\nЗа сравнение: въглищна електроцентрала подава 70, а вятърна турбина 15.
accumulator.discharge_rate.label = Скорост на разреждане (мощност за секунда)
accumulator.discharge_rate.description = Максимално количество електричество, което батерията подава за секунда. Тя подава електричество само при недостиг в мрежата.\nПо-висока стойност = покрива по-голям недостиг на мощност\nПо-ниска стойност = съхранената енергия стига за по-дълго\nПример: при 60 пълна батерия с капацитет 5000 замества електроцентрала за малко над 80 секунди.
accumulator.panel.label = Ред със заряда в прозореца на батерията
accumulator.panel.description = ON добавя нивото на заряда в прозореца на батерията, например „Zaryad: 4210.5 / 5000 (84.2 %)“.
accumulator.panel_caption.label = Надпис на този ред
accumulator.panel_caption.description = Думата пред нивото на заряда. Само латински букви без диакритични и специални знаци, иначе играта показва нечетими символи.
accumulator.gauges.label = Изчисляване на показателите в прозореца според батерията
accumulator.gauges.description = ON заменя неправилните показания на играта с действителния входящ и изходящ поток на батерията.\nOFF използва обичайните показания на играта. Те може да показват мощност 0 и „без електрозахранване“, докато батерията се зарежда.
accumulator.spread_voltage.label = Експеримент: предаване на напрежение към съседите (оставете изключено)
accumulator.spread_voltage.description = ON няма ефект. Тази стара функция е заменена технически. Оставете OFF.
accumulator.trace.label = Записване на съседите на първата батерия
accumulator.trace.description = ON записва в дневника колко електричество получават сградите до първата батерия. Само за отстраняване на проблеми; може да намали производителността.
accumulator.log_seconds.label = Секунди между записите за батерията
accumulator.log_seconds.description = Интервал между съобщенията за състоянието на батерията в tesmioloader.log. Всяко съобщение включва заряд, входящ и изходящ поток.\n0 = без съобщения за състоянието\nПо-висока стойност = по-рядко записване
accumulator.probe.label = Секунди между списъците със сгради в дневника
accumulator.probe.description = Интервал между списъците с всички сгради, съхраняващи електричество, в tesmioloader.log. Използвайте само когато батерия не е разпозната или след обновяване на играта.\n0 = без записване на тези списъци\nПо-висока стойност = по-рядко записване
cities.description = Размер и форма на всеки град. В основната игра всеки град е кръг с радиус 1000 m. С този плъгин задавате радиуса на всеки град поотделно, по желание и квадратна форма, направо в прозореца на града. Стойностите се съхраняват в запазената игра.
cities.group.cities = Градове
cities.group.slider = Плъзгач за радиуса
cities.group.slider.description = Обхватът на плъзгача в прозореца на града и размерът на промяната при едно натискане на + или -.
cities.group.layout = Подредба в прозореца на града
cities.group.layout.description = Местоположение на двата нови реда в прозореца на града. Числата са позиции в собствените единици на игровия прозорец; ширината му е около 500.
cities.group.overlay = Точкова мрежа върху терена
cities.group.diagnostics = Отстраняване на проблеми
cities.enabled.label = Плъгинът е включен
cities.enabled.description = ON включва собствени размери и форми на градовете.
cities.window.label = Плъзгач за радиуса и отметка за формата в прозореца на града
cities.window.description = ON показва плъзгача за радиуса и отметката за квадратна форма в прозореца на града.\nOFF скрива и двете; зададените стойности остават, но вече не можете да ги променяте.
cities.adopt.label = Създаване на отделен град за непринадлежащите сгради
cities.adopt.description = Когато намалите град, сгради може да останат извън него и вече да не принадлежат на никой град.\nON създава за тях нов град със случайно име и днешна дата, както прави самата игра.\nOFF ги оставя без град; поведението на играта в този случай не е тествано.
cities.radius.label = Радиус по подразбиране (m)
cities.radius.description = Радиус по подразбиране за градове без индивидуални настройки. Стойността важи за всяка карта.\n1000 = радиусът на основната игра\nПо-висока стойност = по-големи градове\nПо-ниска стойност = по-малки градове
cities.square.label = Квадратна форма по подразбиране
cities.square.description = ON задава квадратна форма на градовете без индивидуални настройки.\nOFF използва кръг като в основната игра.
cities.radius_min.label = Най-малък радиус на плъзгача (m)
cities.radius_min.description = Стойността в най-левия край на плъзгача.
cities.radius_max.label = Най-голям радиус на плъзгача (m)
cities.radius_max.description = Стойността в най-десния край на плъзгача. Плъзгачът има 100 стъпки; при диапазон от 200 до 5000 една стъпка е 48 m.
cities.step.label = Проценти при натискане на бутон
cities.step.description = Процент от обхвата на плъзгача, с който стойността се променя при едно натискане на + или -. Това не важи при влачене на плъзгача.\nПо-висока стойност = по-голяма промяна при натискане\nПо-ниска стойност = по-фина промяна при натискане
cities.label_x.label = Позиция на надписа
cities.label_x.description = Разстояние на надписа от левия край на прозореца.
cities.widget_x.label = Позиция на контролите
cities.widget_x.description = Разстояние на плъзгача и отметката от левия край на прозореца. Плъзгачът се нуждае от около 225.
cities.checkbox_dy.label = Преместване на реда с отметката нагоре или надолу
cities.checkbox_dy.description = Премества отметката нагоре или надолу, за да не се застъпва с плъзгача.\nПо-висока стойност = отметката е по-надолу\nПо-ниска стойност = отметката е по-нагоре
cities.overlay.label = Наслагването следва радиуса и формата
cities.overlay.description = Докато прозорецът на град е отворен, играта показва синя точкова мрежа върху терена, но винаги само за кръг с радиус 1000 m.\nON приспособява мрежата към вашия радиус и форма.\nOFF я оставя като в основната игра.
cities.overlay_step.label = Разстояние между точките на мрежата (m)
cities.overlay_step.description = Разстояние между точките, показващи границата на града.\n0 = автоматично използване на една двадесета от радиуса, поне 50 m\nПо-ниска стойност = по-гъсто изобразяване и по-високо натоварване
cities.probe.label = Записване на градовете в дневника
cities.probe.description = ON след зареждане записва радиуса, формата и броя сгради на всеки град в tesmioloader.log. Докато прозорецът на град е отворен, се записват допълнителни съобщения. Само за отстраняване на проблеми; дневникът може бързо да нарасне.
depletion.description = Находищата се изчерпват. Работеща мина видимо отнема от находището върху картата и колкото по-малко остава, толкова по-малко произвежда. Добивът се съхранява в запазената игра; ако по-късно изключите плъгина, добитото не се връща. Първо тествайте върху копие на запазената си игра.
depletion.group.depletion = Добив
depletion.group.window = Прозорец на мината
depletion.group.diagnostics = Отстраняване на проблеми
depletion.enabled.label = Плъгинът е включен
depletion.enabled.description = ON позволява избраните находища да се изчерпват при добив.\nOFF спира по-нататъшното изчерпване. Вече отнетите ресурси не се възстановяват.
depletion.tonnes_per_texel.label = Тонове на точка от картата
depletion.tonnes_per_texel.description = Тоновете, които мина може да добие от напълно запълнена точка на картата с ресурси. По-бедните точки дават пропорционално по-малко.\nПо-висока стойност = находищата стигат за по-дълго\nПо-ниска стойност = находищата се изчерпват по-рано\nЗа сравнение: мина с радиус на търсене 210 m обхваща няколко хиляди точки от картата.
depletion.vanilla.label = Изчерпаеми находища от основната игра
depletion.vanilla.description = Находища от основната игра, които могат да се изчерпват. Разделяйте няколко стойности със запетаи.\noil, iron, coal, uranium, bauxite, gravel = само посочените находища\nall = всички находища\nnone = нито едно находище от основната игра\nname:value = собствен брой тонове на точка от картата, например iron:3000\nНаходищата от deposits.ini винаги са включени.\ngravel трайно премахва видимата текстура на терена и се нуждае от много по-висока стойност поради малката зона на търсене. Пропуснете gravel, за да остане като в основната игра.
depletion.flush_seconds.label = Секунди до записване на добива
depletion.flush_seconds.description = Секунди между обновяванията на картата с ресурси. Производството и качеството се променят веднага; само миникартата и запазената игра се обновяват през този интервал.\nПо-ниска стойност = по-чести обновявания и по-високо натоварване\nНе обновявайте повече от четири пъти в секунда.
depletion.panel.label = Ред с оставащото находище в прозореца на мината
depletion.panel.description = ON показва оставащия запас в прозореца на мината и леко увеличава височината му, например „Ostavat: 251.4 kt / 259.3 kt (96.9 %)“.
depletion.panel_caption.label = Надпис на този ред
depletion.panel_caption.description = Думата пред оставащото количество. Само латински букви без диакритични и специални знаци, иначе играта показва нечетими символи.
depletion.log_seconds.label = Интервал на записите за напредъка (секунди)
depletion.log_seconds.description = Секунди между съобщенията за състоянието на мината в tesmioloader.log. Всяко съобщение включва оставащо количество, общо количество и качество.\n0 = без съобщения за състоянието\nПо-висока стойност = по-рядко записване\nНаблюдавайте няколко игрови дни, за да намерите подходящ брой тонове на точка от картата.
easystart.description = Потребностите на гражданите се появяват постепенно с годините. Все още неотключена потребност не влияе на щастието и здравето; гражданите продължават да посещават съответните места и да пазаруват, но последствията се появяват едва през определената година.
easystart.group.general = Какво да се отложи
easystart.group.unlock = Години на отключване
easystart.group.unlock.description = Година, през която изискването започва да важи от 1 януари. Графикът е предвиден за република, основана през 1920 г. При начало през 1960 г. предварително зададените години вече са минали.\noff = без отлагане; поведение на основната игра\nalways = прилага се от първия игрови ден\nГодина = отключване през тази година
easystart.group.diagnostics = Отстраняване на проблеми
easystart.enabled.label = Плъгинът е включен
easystart.enabled.description = ON отключва потребностите и изискванията към комуналните услуги според настроения график.
easystart.demands.label = Отлагане на деветте потребности на гражданите
easystart.demands.description = ON отлага храната, месото, облеклото, електрониката, алкохола, религията, културата, спорта и здравето до зададените години на отключване.
easystart.utilities.label = Отлагане на трите комунални изисквания на сградите
easystart.utilities.description = ON отлага изискванията за електричество, вода и отопление до зададените години на отключване.
easystart.warnings.label = Отлагане на предупрежденията в прозореца на сградата
easystart.warnings.description = ON скрива свързаните предупреждения до годината на отключване, например „сграда без електрозахранване“.
easystart.pin_status.label = Задържане на удовлетвореността от заключените потребности
easystart.pin_status.description = ON поддържа удовлетвореността от заключена потребност на стойността по-долу.\nOFF позволява тя да продължи да спада; при отключване на потребността вече може да е много ниска.
easystart.locked_status.label = Удовлетвореност по време на заключване
easystart.locked_status.description = Удовлетвореност, докато потребността е заключена. За храната стойността е ситост.\n1.0 = напълно удовлетворен или нахранен\n0.5 = средна стойност със забележимо подобрение след отключване
easystart.clear_unsatisfied.label = Премахване на заключените потребности от списъка с неудовлетворени
easystart.clear_unsatisfied.description = ON не позволява заключените потребности да предизвикват съобщението „N граждани не успяха да получат X“.
easystart.probe.label = Записване на отключванията в дневника
easystart.probe.description = ON при всяка смяна на годината записва оставащите заключени потребности в tesmioloader.log. Еднократно записва и първия засегнат гражданин. Само за отстраняване на проблеми.
easystart.food.label = Храна
easystart.religion.label = Религия
easystart.meat.label = Месо
easystart.clothes.label = Облекло
easystart.alcohol.label = Алкохол
easystart.sport.label = Спорт
easystart.culture.label = Култура
easystart.health.label = Здраве
easystart.electricity.label = Електричество
easystart.water.label = Вода (включва канализацията)
easystart.heating.label = Отопление
easystart.electronics.label = Електроника
easystart.school.label = Училище
easystart.school.description = Преди тази година децата учат без училище, както при настройката „Опростено“ за образование, и съобщението „N деца не могат да ходят на училище“ не се появява.
easystart.kindergarten.label = Детска градина
easystart.kindergarten.description = Преди тази година никой родител не трябва да остава вкъщи заради дете под шест години и съобщението „N работници не могат да работят, защото всички детски градини …“ не се появява.
plugin.needs = Needs
plugin.needs.description = Управление на допълнителните потребности на гражданите и превключвателите на плъгина без редактиране на оригиналния файл.
tab.needs.editor = Потребности
group.needs = Потребности на гражданите
group.needs.plugin = Настройки на плъгина
group.needs.plugin.description = Превключватели, които важат за всички потребности.
needs.list = Списък с потребности
needs.add = Добавяне на потребност
needs.select_help = Изберете потребност отляво или използвайте +, за да добавите ресурс, регистриран от Resources.
needs.resource = Ресурс
needs.resource.help = Ресурсът, който гражданите да искат. Той трябва да е регистриран в списъка на плъгина Resources.
needs.donor = Потребност за образец
needs.donor.description = Съществуваща потребност, използвана като образец.\nfood или meat = за хранителни магазини\nclothes или eletronics = за универсални магазини\nalcohol = за магазини за алкохол\neletronics е изписването, използвано от играта.
needs.factor = Множител на количеството
needs.factor.description = Количество стоки спрямо потребността за образец.\n1.0 = същото количество като при образеца\nПо-висока стойност = гражданите се нуждаят от повече\nПо-ниска стойност = гражданите се нуждаят от по-малко
needs.category = Категория магазини
needs.category.description = Магазини, които да държат стоката на склад.\nauto = същите магазини като при потребността за образец\nnone = без автоматична складова позиция; сградата трябва сама да предоставя стоката\nbasic = само основни магазини\nmedium = само средни магазини\nadvanced = само големи магазини\nmediumadvanced = само средни и големи магазини\nhotel = само хотели\nЧисло = директно записване на тази стойност за магазин; само за потребители, запознати с файловете на играта
needs.chance = Вероятност
needs.chance.description = Вероятност от 0 до 1 гражданин да получи тази потребност. При стойност под 1 тя се разпределя независимо от образеца.\n0 = никой гражданин не я получава\n1 = всеки подходящ гражданин я получава
needs.unhappy = Неудовлетвореност
needs.unhappy.description = Загуба на удовлетвореност, когато гражданин не може да получи стоката.\n0 = без загуба; потребността само се показва\n0.005 до 0.02 = обичаен диапазон за стока за комфорт\nДопустим диапазон: 0 до 1
needs.enabled = Плъгинът е включен
needs.enabled.description = ON включва плъгина.\nOFF го изключва напълно при следващото стартиране на играта.
needs.demand = Добавяне на потребности
needs.demand.description = ON дава на гражданите новата потребност.\nOFF не разпределя потребността, но все пак може да добавя стоката в магазините.
needs.storage = Зареждане на магазините със стоки
needs.storage.description = ON добавя стоката в избраните магазини.\nOFF не добавя складови позиции; тогава гражданите могат да намерят стоката само в сгради, които я предоставят сами.
needs.max_demands = Потребности на гражданин
needs.max_demands.description = Максимален брой допълнителни потребности, които гражданин може да има едновременно.\n1 = най-много една допълнителна потребност\n7 = най-високият допустим брой
needs.when_full = При достигнат лимит на потребностите
needs.when_full.description = Какво става, когато гражданин вече има максималния брой допълнителни потребности.\nskip = изчакване, докато се освободи място\nreplace = замяна на потребността за образец този път
needs.probe = Подробен дневник
needs.probe.description = ON записва списъците с потребности на гражданите и информация за всеки магазин в подробния дневник на плъгина.\nOFF записва само предупреждения. Включвайте временно при проверка на нови магазини.
needs.log_seconds = Интервал на съобщенията за напредъка (секунди)
needs.log_seconds.description = Секунди между съобщенията за броя на разпределените потребности.\n0 = изключване на тези съобщения\nПо-висока стойност = по-рядко записване
tab.needs.general = Общи
plugin.deposits = Deposits
plugin.deposits.description = Управление на типовете находища, които липсват в основната игра, и превключвателите на плъгина без редактиране на оригиналния файл.
tab.deposits.general = Общи
tab.deposits.editor = Находища
group.deposits = Находища
group.deposits.description = Оригиналните находища са защитени и могат да бъдат скрити; собствените находища се съхраняват отделно и се обединяват в действащия deposits.ini. Всяка секция освен [deposits] представлява едно находище.
group.deposits.plugin = Настройки на плъгина
group.deposits.plugin.description = Трите подсистеми в секцията [deposits]. Всяка от тях е изключена за всички находища, когато съответният превключвател тук е изключен.
deposits.notice = Номерът на типа на находището, каналът му в картата и токенът в building.ini стават част от запазената игра, щом мина започне да ги използва. Премахването или преномерирането на използвано находище може да направи запазената игра неизползваема; първо тествайте върху копие.
deposits.list = Списък с находища
deposits.add = Добавяне на находище
deposits.select_help = Изберете находище отляво или използвайте +, за да добавите находище за ресурс, регистриран от Resources.
deposits.name = Находище
deposits.name.help = Името на секцията в deposits.ini. То обозначава находището в дневника и в четката на редактора; не може да се преименува по-късно.
deposits.new_name = Име на находището
deposits.new_hint = Тук се задават само стандартните настройки. Всичко останало (компонент, тип сграда, изчерпване) се намира вдясно в настройките след добавяне.
deposits.code_patch = Поправка на кода
deposits.code_patch.description = ON въвежда настроените типове находища $TYPE_MINE_ в играта, за да могат мините да ги намират чрез building.ini. Ако очакваните данни на играта вече не съвпадат след обновяване, плъгинът не променя нищо.
deposits.minimap_all = Слоеве на миникартата
deposits.minimap_all.description = ON показва бутон под петте игрови бутона на миникартата за всяко индивидуално включено находище на плъгина.\nOFF скрива всички бутони за находища на плъгина.
deposits.editor_all = Четки в редактора на терена
deposits.editor_all.description = ON показва четка за рисуване и четка за изтриване в раздела Ресурси на редактора на терена за всяко находище с име на четка.\nOFF скрива всички четки за находища на плъгина.
deposits.token = Токен на сградата
deposits.token.description = Токен, използван от мина в building.ini за това находище, например $TYPE_MINE_COPPER. Въведете го като $TYPE_MINE_GRAVEL. Никога не използвайте два токена за находища в един и същ building.ini.
deposits.type = Номер на типа
deposits.type.description = Уникален номер на типа на находището. Две находища не трябва да използват един и същ номер.\n10 до 127 = допустим диапазон\n0 до 9 = запазени за основната игра\nДиалогът автоматично предлага следващия свободен номер.
deposits.map = Карта
deposits.map.description = Карта, на която се съхранява находището.\nauto = автоматичен избор на свободна позиция в карта на плъгина; препоръчително\nresourcemap или resourcemap2 = използване на картите на основната игра\nresourcemap3 до resourcemap10 = използване на допълнителните карти на плъгина\nterrain = директно използване на нарисувания терен, например за чакъл; четката му се появява под ROCKS
deposits.component = Компонент
deposits.component.description = Всяка карта има четири позиции от 0 до 3. Всяка позиция може да съдържа едно находище.\nПри auto = оставете полето празно; плъгинът избира свободна позиция\nПри terrain: 2 = слой чакъл\nПри terrain: 3 = слой оазис
deposits.building_type = Тип сграда
deposits.building_type.description = Тип сграда, която може да добива това находище.\n7 = мина; правилният избор за почти всяко находище\n92 = кладенец\nПразно поле = 7
deposits.radius = Радиус на търсене
deposits.radius.description = Колко далеч мина търси своето находище.\noil, ore, bauxite, gravel, wood, water, watersurface = използване на съответната константа на играта\nЧисло = директно използване на това разстояние\nПразно поле = използване на ore\nБез радиус мината не намира находище.
deposits.icon = Икона на миникартата
deposits.icon.description = Ресурсът, чиято икона се появява на бутона на миникартата. Плъгинът използва вече заредената от играта икона; не е нужно отделно изображение.\nРесурсите от плъгина Resources трябва да бъдат регистрирани в него.\nПразно поле = без икона
deposits.minimap = Бутон на миникартата
deposits.minimap.description = ON добавя бутон на миникартата и слой за наслагване за това находище.
deposits.editor = Име на четката в редактора
deposits.editor.description = Име на четките за рисуване и изтриване в редактора на терена. Същото име се използва за tool_paint_<name>.png и tool_erase_<name>.png във vfs\media_soviet\editor.\nПразно поле = без създаване на четка\nДопустими: до 31 букви, цифри, _ и -
deposits.deplete = Изчерпване на тексел
deposits.deplete.description = Тази настройка се чете от плъгина Depletion. Тя задава тоновете, които мина може да добие от напълно запълнена точка на картата с ресурси. По-бедните точки дават пропорционално по-малко.\nСтойността има предимство пред tonnes_per_texel в plugins\depletion.ini.\n0 = това находище остава неизчерпаемо\nПразно поле = използване на общата стойност
deposits.save_warning = Промените се записват в действащия deposits.ini едва при запазване. Номерата на типовете, каналите на картите и токените на находища, които вече се използват в запазена игра, не трябва да се променят; първо тествайте върху копие.
depletion.tab.general = Общи
depletion.tab.mining = Добив
needs.save_warning = Промените се записват в действащия needs.ini едва при запазване. Всяка потребност добавя складова позиция към съответните магазини, а тя е част от запазената игра. Първо тествайте върху копие.
bp.name = Buildings Plus
bp.description = Нови сгради по дефиниция: сграда за образец от играта плюс различаващите се редове в building.ini. При всяко стартиране на играта се записват като пълни елементи на Workshop.
bp.notice = Всяка сграда се превръща в папка в media_soviet\workshop_wip със собствен Workshop ID. Оставете ID празно и при стартиране на играта плъгинът ще зададе следващия свободен номер от 9300000000 и ще го съхрани в plugins\buildings_plus.ids.ini. Играта чете папката като непубликуван елемент на Workshop. Промените изискват пълно рестартиране. Запазена игра с такава сграда се нуждае от папката при зареждане.
bp.tab.general = Общи
bp.tab.buildings = Сгради
bp.tab.generated = Генерирани сгради
bp.wip = Генерирани сгради в папката на играта
bp.wip.description = Показва сградите, генерирани от Buildings Plus или оригиналния плъгин buildings в media_soviet\workshop_wip. Показаното тук се чете от папките.
bp.wip.empty = Тук все още няма генерирана сграда. Сградите се генерират при стартиране на играта, когато някоя е включена.
bp.group = Сгради
bp.group.notice = Сграда тук е копие на сграда от играта с други редове: същият модел, същите връзки, ваша рецепта. Изберете образец от същия вид (мина за мина, фабрика за фабрика).
bp.list = Сгради
bp.add = Добавяне
bp.select_help = Изберете сграда отляво или използвайте +, за да добавите нова. Първо се избира образецът, Workshop ID може да остане празно; името и редовете следват вдясно.
bp.id = Име на обекта
bp.id.help = Задава името на папката и обекта на генерираната сграда и се появява в дневника. Само букви, цифри, _ и -, най-много 64 знака; не може да се променя по-късно.
bp.save_warning = Промените се записват в действащия buildings_plus.ini едва при запазване и влизат в сила след пълно рестартиране на играта. Тогава плъгинът записва папката в media_soviet\workshop_wip; секция с грешка се пропуска и името ѝ се посочва в дневника.
bp.list.note = Най-много 256 сгради.
bp.new_name = Име на обекта
bp.new_hint = Интервалите стават долни черти, а главните букви стават малки.
bp.card.folders = Генерирани папки
bp.card.log = Отстраняване на проблеми
bp.card.new = Нова сграда
bp.links = Ръководства
bp.link.readme = README (ръководство)
bp.prune = Почистване на папките
bp.prune.description = ON при следващото стартиране на играта премахва генерираната папка на сграда, която сте изтрили или изключили (само папки, създадени от този плъгин).\nOFF оставя тези папки; играта продължава да зарежда сградите.
bp.always = Винаги презаписвай
bp.always.description = ON записва всяка папка на сграда при всяко стартиране на играта.\nOFF записва папка само когато секцията ѝ, плъгинът или файл на образеца са променени. Оставете OFF.
bp.verbose = Подробен дневник
bp.verbose.description = ON записва всеки копиран файл и всеки премахнат ред от образеца в logs\tesmioloader.buildings_plus.log.\nOFF записва само резултати, предупреждения и грешки.
bp.repair_owner_ids = Попълване на ID на собственика
bp.repair_owner_ids.description = ON попълва вашето Steam ID в генерирани сгради, които нямат такова, включително от друг генератор. Без него играта пита за липсващи елементи на Workshop при всяко зареждане на запазена игра с такава сграда.\nOFF оставя папките на други генератори непроменени.
bp.card.saves = Запазени игри
bp.card.saves.description = Запазената игра помни складовете на всяка построена сграда. Така нов ред за склад на някоя от вашите сгради може да се приложи и към вече построените сгради.
bp.retrofit = Актуализиране на складовете на вече построените сгради
bp.retrofit.description = ON: при зареждане на запазена игра всяка завършена генерирана сграда получава празните складове за отделни ресурси, които сте добавили в секцията ѝ. Ако промените размера в ред за склад, складът също се променя; намаляването изчаква, докато наличностите се поберат. Склад, чийто ред сте премахнали, изчезва от сградите веднага щом се изпразни.\nOFF: складовете на вече построените сгради остават както са; новите и променените редове засягат само сгради, построени след това.
bp.enabled = Сградата е включена
bp.enabled.description = ON генерира тази сграда при следващото стартиране на играта.\nOFF не я генерира. Ако „Почистване на папките“ е включено, съществуващата ѝ папка се премахва при следващото стартиране.
bp.item_id = Workshop ID
bp.item_id.description = Може да зададете собствен номер: 9000000000 до 9999999999, освен 9100000000 до 9199999999 (оставени свободни за други генератори)\nТой задава името на папката в workshop_wip в папката на играта и не бива да се променя след това.
bp.donor = Сграда за образец
bp.donor.description = Сградата, от която започва копието; за сграда от Workshop трябва да сте абонирани.\nИзползвайте „Избор на образец...“, за да разгледате наличното. Спазвайте вида: мина за мина, фабрика за фабрика, магазин за магазин.
bp.item_name = Име в играта
bp.item_name.description = Името, показвано в играта.\nСтойност с точки се счита за ключ за превод и се обработва от плъгина Localization, например: localization.lang.salt_mine
bp.desc = Описание
bp.desc.description = Описание на елемента в Workshop, по един ред на ред от полето. Без кавички.
bp.line = Редове в building.ini
bp.line.description = По един ред от building.ini на ред от полето, например $PRODUCTION raw_salt 1.0. Използвайте „Избор на ред…“, за да вземете ред от сградата за образец и да го коригирате. Вашите редове се поставят пред тези на образеца и заменят: същия токен; всички $TYPE_*; всички $STORAGE* заедно с $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION и $CONSUMPTION_PER_SECOND като една рецепта. Всичко останало от образеца се запазва.\nЗа собствените си ресурси винаги използвайте $STORAGE_IMPORT_SPECIAL или $STORAGE_EXPORT_SPECIAL с посочен ресурс, иначе складът изброява всеки ресурс от транспортния клас.
bp.strip = Премахване на редове от образеца
bp.cmd_add = Добавяне в края
bp.cmd_add.description = По една команда на ред: нов ред, поставен преди заключителния край на файла на образеца. Блок от няколко реда се записва с | между редовете.
bp.cmd_replace = Замяна
bp.cmd_replace.description = По една команда на ред: стар ред | нов ред. Старият ред трябва да се среща точно веднъж във файла на образеца.
bp.cmd_remove = Премахване
bp.cmd_remove.description = По една команда на ред: редът от файла на образеца, който да се премахне. Свързаните с него редове (точки, позиция) също се премахват.
bp.cmd_insert = Вмъкване
bp.cmd_insert.description = По една команда на ред: 0 или 1 | опорен ред | нов ред. 0 поставя новия ред пред опорния, 1 след него.
bp.strip.description = По един $TOKEN на ред, например $WORKERS_NEEDED. Всеки ред на образеца с този токен се премахва без замяна.
bp.life = Издръжливост
bp.life.description = Празно = 3000\nLIFE в renderconfig.ini: колко може да понесе сградата, преди да се срути. Както при повечето сгради в играта.
bp.card.lines = Редове
bp.item_id.empty = плъгинът задава следващия свободен номер от 9300000000 при стартиране на играта.
bp.item_name.empty = името на обекта; не се препоръчва.
needs_plus.card.log = Отстраняване на проблеми
resources_plus.card.log = Отстраняване на проблеми
resources_plus.card.plugin = Плъгин
resources_plus.custom_report = Записване на клонираните записи
resources_plus.custom_report.description = ON за всеки ресурс с образец записва какво действително е наследил клонингът (транспортен клас, множители, флагове). Ресурсите без образец винаги се изброяват.\nOFF изброява само тези без образец.
resources_plus.customs_hook = Обновяване на митниците
resources_plus.customs_hook.description = ON добавя новите ресурси в търговския списък на вече съществуващи митници.\nOFF е поведението на основната игра: митницата търгува само с това, което е познавала при построяването си; тогава помага само разрушаване и повторно построяване.
resources_plus.customs_probe = Записване на позициите на митниците
resources_plus.customs_probe.description = ON записва по един ред за всеки ресурс, добавен към митница, в tesmioloader.log. Изключете с OFF, след като митниците ви показват очакваното.
resources_plus.price_hook = Прилагане на цените от INI файла
resources_plus.price_hook.description = ON активира [base_price] и [price]: базовите цени се задават преди изчисляването на цените от играта, а фиксираните цени след него.\nOFF оставя цените на играта.
resources_plus.price_report = Записване на ценовата таблица
resources_plus.price_report.description = ON след всяко изчисляване на цените от играта записва цената, базовата цена и ценовата категория на всеки ресурс от списъка ви в tesmioloader.log. Цена 0.00 означава, че никоя сграда не го произвежда.\nOFF не записва нищо.
tab.resources_plus.general = Общи
resources.heading.basics = Транспортен клас и ценова категория
resources.heading.cargo = Товар и материал
resources.heading.fixed = Фиксирани цени
resources.heading.market = Пазарни стойности
resources.heading.prices = Цени в записа

resources_plus.heading.names = Имена според езика на играта
detail.name_language.description = Името на този ресурс, когато играта е на този език. Празно: показва се зададеното по-горе име за показване. Английският не се нуждае от поле; името за показване е английското име.
