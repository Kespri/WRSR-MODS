[language]
name = Polski

[strings]
plugin.resources = Resources
plugin.resources.description = Zarządzaj zasobami, ich właściwościami i opcjonalnymi własnymi cenami.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Własne zasoby z Resources Plus: ta sama lista co w oryginale, w plugins\resources_plus.ini, bez awarii przy zamykaniu.
resources_plus.save_warning = Zmiany trafiają do plugins\resources_plus.ini podczas zapisywania. Usunięcie zasobu używanego już przez zapis gry może uszkodzić ten zapis.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Własne potrzeby obywateli z Needs Plus: ta sama lista co w oryginale, w pliku needs_plus.ini w folderze plugins, przejęta z needs.ini przy pierwszym uruchomieniu.
needs_plus.save_warning = Zmiany trafiają do needs_plus.ini w folderze plugins dopiero podczas zapisywania. Każda potrzeba dodaje miejsce magazynowe do odpowiednich sklepów, a miejsce to jest częścią zapisu gry. Najpierw przetestuj na kopii.
tab.resources.editor = Zasoby
group.resource_definitions = Definicje zasobów
detail.transport = Klasa transportu
detail.transport.description = Określa, które pojazdy i magazyny mogą przewozić i przechowywać zasób. Wystarczy wybrać nazwę; wtyczka dodaje wartości z podstawowej gry dla tej klasy.
detail.kind = Kategoria cenowa
detail.kind.description = 0 surowce, 1 wyroby przemysłowe, 2 żywność/odzież, 3 zaawansowane materiały, 4 elektronika.
detail.record_price = Początkowa cena w rekordzie
detail.record_price.description = Opcjonalne wartości początkowe w RUB i USD w rekordzie zasobu.
detail.record_base_price = Początkowa cena bazowa w rekordzie
detail.record_base_price.description = Opcjonalne wartości bazowe w RUB i USD w rekordzie zasobu.
detail.trade_mult = Mnożniki handlowe
detail.trade_mult.description = Mnożniki sprzedaży i zakupu, zwykle 0.95 i 1.05.
detail.market_rub = Blok rynku RUB
detail.market_usd = Blok rynku USD
detail.market.description = Dwie wartości rynkowe i opcjonalny współczynnik.\n(Zobacz opis w pliku INI)
detail.packed = Ładunek pakowany
detail.packed.description = Automatyczna prezentacja ładunku, ładunek niepakowany lub pakowany.
detail.family = Grupa materiału
detail.family.description = Określa wygląd materiału usypanego na placu budowy i najprawdopodobniej rodzaj powstającego odpadu. Każda grupa zawiera jeden zasób odpadowy. Numery od 10 do 19 z pliku INI są wyświetlane jako nazwy.
detail.cargo = Geometria ładunku
detail.cargo.description = Wybór geometrii używanej do wizualizacji ładunku.
detail.pinned_base_price = Stała cena bazowa
detail.pinned_base_price.description = Opcjonalna wartość w RUB i USD w [base_price]. Puste pole oznacza brak własnego wpisu.
detail.forced_price = Wymuszona cena końcowa
detail.forced_price.description = Opcjonalna wartość w RUB i USD w [price]. Puste pole oznacza, że cenę oblicza gra.

; --- Lokalne schematy zainstalowanych oryginalnych wtyczek (od 0.13.0) ---
daynight.description = Jeden wschód i jeden zachód słońca na dzień kalendarzowy. W podstawowej grze przejście od dnia do nocy i z powrotem zajmuje 13 dni kalendarzowych, czyli niemal dwa tygodnie. Z tą wtyczką mieści się w jednym dniu.
daynight.group.cycle = Dzień i noc
daynight.group.cycle.description = Długość cyklu dnia i nocy oraz pora nadejścia nocy.
daynight.group.pace = Tempo
daynight.group.pace.description = Dwa niezależne ustawienia: jedno dla pojazdów, drugie dla całej reszty. Działają zawsze, niezależnie od ustawień powyżej.
daynight.group.diagnostics = Rozwiązywanie problemów
daynight.enabled.label = Wtyczka włączona
daynight.enabled.description = ON włącza skonfigurowany cykl dnia i nocy.
daynight.cycle_days.label = Dni kalendarzowe na cykl dnia i nocy
daynight.cycle_days.description = Liczba dni kalendarzowych od jednego wschodu słońca do następnego.\n1 = jeden wschód i jeden zachód słońca każdego dnia\nOd 2 do 12 = odpowiednio dłuższy cykl\n13 = cykl podstawowej gry
daynight.day_scale.label = Długość dnia (ile razy wolniej biegnie kalendarz)
daynight.day_scale.description = Ile razy dłużej trwa dzień kalendarzowy niż w podstawowej grze.\nauto = automatycznie zwolnij kalendarz, dopasowując go do cyklu oświetlenia; zalecane\n1 = nie zwalniaj kalendarza; dzień i noc zmieniają się wtedy 13 razy szybciej\nOd 2 do 100 = zwolnij kalendarz o ten mnożnik\nW ustawieniu „Co spowolnić” wybierz części gry, które mają zwolnić.
daynight.slow.label = Co spowolnić
daynight.slow.description = Określa, które części gry zwalniają.\ncalendar = zwolnij tylko kalendarz; zalecane\nworld = zwolnij wszystko, w tym obywateli i pojazdy; wysokie wartości dają efekt zwolnionego tempa\nnone = niczego nie spowalniaj\nPrzy calendar obywatele, pojazdy, budowa i produkcja zachowują normalną prędkość. Procesy dzienne, takie jak zanieczyszczenie, pożyczki i wiadomości, zachowują zwykłe odstępy.
daynight.offset.label = Kiedy nadchodzi noc
daynight.offset.description = Przesuwa noc w obrębie dnia kalendarzowego.\n0 = ciemność zaczyna się krótko po połowie dnia\n0.5 = ciemność zaczyna się przy zmianie daty\nPrzy wartości innej niż 0 cykl 13-dniowy nie odpowiada już dokładnie podstawowej grze.
daynight.fade.label = Dopasuj przejścia oświetlenia
daynight.fade.description = ON skraca przejścia między rankiem, dniem, wieczorem i nocą, dopasowując je do ustawionego cyklu.\nOFF używa powolnych przejść z podstawowej gry. Przy krótkich cyklach mogą się nakładać i sprawiać, że oświetlenie wygląda blado.
daynight.vehicle_scale.label = Prędkość pojazdów
daynight.vehicle_scale.description = Prędkość ciężarówek, pociągów, statków i samolotów. Działa niezależnie od pozostałych ustawień.\n1 = prędkość podstawowej gry\n2 = połowa prędkości\n0.5 = podwójna prędkość\nWyższa wartość = wolniejsze pojazdy
daynight.sim_scale.label = Prędkość całej reszty
daynight.sim_scale.description = Prędkość obywateli, budowy, produkcji, zużycia i animacji.\n1 = prędkość podstawowej gry\n2 = połowa prędkości\n0.5 = podwójna prędkość\nWyższa wartość = wolniejsza symulacja
daynight.probe.label = Zapisuj długość dni w dzienniku
daynight.probe.description = ON zapisuje rzeczywisty czas trwania każdego dnia kalendarzowego i przejścia oświetlenia w tesmioloader.log. Używaj tylko do rozwiązywania problemów i kontroli po aktualizacji gry.
walking.description = Jak daleko obywatele chodzą pieszo i jak daleko właściciele samochodów jeżdżą między domem, pracą i parkingiem.
walking.group.distances = Odległości
walking.group.distances.description = Mierzone wzdłuż dróg i ścieżek, a nie w linii prostej. Budynek oddalony o 400 m po drugiej stronie rzeki może wymagać 1200 m marszu.
walking.group.diagnostics = Rozwiązywanie problemów
walking.enabled.label = Wtyczka włączona
walking.enabled.description = ON włącza skonfigurowane odległości chodzenia i jazdy.
walking.distance.label = Zasięg pieszy (m)
walking.distance.description = Najdłuższa trasa, którą obywatel przejdzie pieszo. Podstawowa gra używa 480 m.\nWyższa wartość = więcej budynków w zasięgu pieszym i więcej połączeń tworzonych podczas budowy\n0 = bez limitu; budowa w dużym mieście może wtedy trwać kilka sekund\n20000 = najwyższa dozwolona wartość
walking.car_distance.label = Zasięg jazdy właścicieli samochodów (m)
walking.car_distance.description = Najdłuższy dozwolony przejazd między domem, pracą i parkingiem. Podstawowa gra używa 2500 m.\nWyższa wartość = właściciele samochodów jeżdżą dalej\nUstaw wartość wyższą niż zasięg pieszy. Przy równych wartościach samochód nie daje przewagi zasięgu.
walking.regen_on_load.label = Odbuduj połączenia przy wczytywaniu zapisu gry
walking.regen_on_load.description = Połączenia piesze i parkingowe są przechowywane w zapisie gry.\nON odbudowuje wszystkie połączenia przy wczytywaniu, dzięki czemu ustawione odległości obejmują też istniejące miasta.\nOFF stosuje ustawione odległości tylko do nowo zbudowanych budynków.
walking.probe.label = Zapisuj wartości kontrolne w dzienniku
walking.probe.description = ON zapisuje w tesmioloader.log wartości znalezione w grze, zanim wtyczka je zmieni. Używaj tylko do rozwiązywania problemów i kontroli po aktualizacji gry.
accumulator.description = Akumulatory dla twojej sieci elektrycznej. Budynek z dużym magazynem energii ładuje się przy nadwyżce prądu i oddaje energię, gdy go brakuje.
accumulator.group.battery = Akumulator
accumulator.group.battery.description = Które budynki liczą się jako akumulatory i jak szybko się ładują oraz rozładowują.
accumulator.group.window = Okno budynku
accumulator.group.grid = Sieć elektryczna
accumulator.group.diagnostics = Rozwiązywanie problemów
accumulator.enabled.label = Wtyczka włączona
accumulator.enabled.description = ON włącza ładowanie i rozładowywanie budynków akumulatorowych.\nOFF zatrzymuje rozładowywanie. Budynki pozostają i nadal mogą się ładować.
accumulator.building_types.label = Typy budynków
accumulator.building_types.description = Typy budynków, które mogą działać jako akumulatory. Wiele numerów oddzielaj przecinkami.\n19 = transformator\n18 = podstacja\nNie używaj 17: elektrownia nie może przyjmować prądu i nigdy by się nie naładowała.
accumulator.min_capacity.label = Minimalna pojemność uznawana za akumulator
accumulator.min_capacity.description = Minimalna pojemność magazynu, przy której budynek uznaje się za akumulator. Wyklucza to małe magazyny zwykłych podstacji.\nWyższa wartość = mniej budynków uznawanych za akumulatory\nNiższa wartość = więcej budynków uznawanych za akumulatory\nDołączony „Stationary Accumulator” ma pojemność 5000.
accumulator.charge_rate.label = Szybkość ładowania (moc na sekundę)
accumulator.charge_rate.description = Maksymalna ilość prądu pobierana przez akumulator na sekundę. Limit zapobiega odebraniu prądu całemu miastu przez pusty akumulator.\nWyższa wartość = szybsze ładowanie i większe obciążenie sieci\nNiższa wartość = wolniejsze ładowanie i mniejsze obciążenie\nDla porównania elektrownia węglowa dostarcza 70, a turbina wiatrowa 15.
accumulator.discharge_rate.label = Szybkość rozładowywania (moc na sekundę)
accumulator.discharge_rate.description = Maksymalna ilość prądu dostarczana przez akumulator na sekundę. Dostarcza go tylko przy niedoborze w sieci.\nWyższa wartość = pokrywanie większych niedoborów mocy\nNiższa wartość = zmagazynowana energia wystarcza na dłużej\nPrzykład: przy 60 pełny akumulator o pojemności 5000 zastępuje elektrownię przez nieco ponad 80 sekund.
accumulator.panel.label = Wiersz naładowania w oknie akumulatora
accumulator.panel.description = ON dodaje poziom naładowania do okna akumulatora, na przykład „Ladunek: 4210.5 / 5000 (84.2 %)”.
accumulator.panel_caption.label = Etykieta tego wiersza
accumulator.panel_caption.description = Słowo przed poziomem naładowania. Tylko litery bez znaków diakrytycznych i specjalnych, inaczej gra wyświetla nieczytelne znaki.
accumulator.gauges.label = Obliczaj wskaźniki okna na podstawie akumulatora
accumulator.gauges.description = ON zastępuje błędne wskazania gry rzeczywistym przepływem do akumulatora i z niego.\nOFF używa normalnych wskazań gry. Mogą pokazywać moc 0 i „brak zasilania”, gdy akumulator się ładuje.
accumulator.spread_voltage.label = Eksperyment: przekazuj napięcie sąsiadom (pozostaw wyłączone)
accumulator.spread_voltage.description = ON nie daje żadnego efektu. Ta stara funkcja została zastąpiona technicznie. Pozostaw OFF.
accumulator.trace.label = Zapisuj sąsiadów pierwszego akumulatora
accumulator.trace.description = ON zapisuje w dzienniku, ile prądu otrzymują budynki obok pierwszego akumulatora. Tylko do rozwiązywania problemów; może obniżać wydajność.
accumulator.log_seconds.label = Sekundy między wpisami o akumulatorze
accumulator.log_seconds.description = Odstęp między komunikatami o stanie akumulatora w tesmioloader.log. Każdy zawiera naładowanie, dopływ i odpływ.\n0 = brak komunikatów o stanie\nWyższa wartość = rzadsze zapisywanie
accumulator.probe.label = Sekundy między listami budynków w dzienniku
accumulator.probe.description = Odstęp między listami wszystkich budynków z magazynem energii w tesmioloader.log. Używaj tylko, gdy akumulator nie jest rozpoznawany, lub po aktualizacji gry.\n0 = nie zapisuj tych list\nWyższa wartość = rzadsze zapisywanie
cities.description = Rozmiar i kształt każdego miasta. W podstawowej grze każde miasto jest kołem o promieniu 1000 m. Ta wtyczka pozwala ustawić promień każdego miasta osobno, opcjonalnie także kształt kwadratu, bezpośrednio w oknie miasta. Wartości są przechowywane w zapisie gry.
cities.group.cities = Miasta
cities.group.slider = Suwak promienia
cities.group.slider.description = Zakres suwaka w oknie miasta i wielkość zmiany po jednym kliknięciu + lub -.
cities.group.layout = Układ w oknie miasta
cities.group.layout.description = Położenie dwóch nowych wierszy w oknie miasta. Liczby oznaczają pozycje we własnych jednostkach okna gry; okno ma około 500 szerokości.
cities.group.overlay = Siatka punktów na ziemi
cities.group.diagnostics = Rozwiązywanie problemów
cities.enabled.label = Wtyczka włączona
cities.enabled.description = ON włącza własne rozmiary i kształty miast.
cities.window.label = Suwak promienia i pole kształtu w oknie miasta
cities.window.description = ON pokazuje suwak promienia i pole wyboru kwadratu w oknie miasta.\nOFF ukrywa oba elementy; ustawione wartości pozostają, ale nie można ich już zmieniać.
cities.adopt.label = Utwórz osobne miasto dla osieroconych budynków
cities.adopt.description = Przy zmniejszaniu miasta budynki mogą znaleźć się poza jego granicami i przestać należeć do jakiegokolwiek miasta.\nON zakłada dla nich nowe miasto z losową nazwą i dzisiejszą datą, tak jak robi to sama gra.\nOFF pozostawia je bez miasta; zachowanie gry w takim przypadku nie zostało sprawdzone.
cities.radius.label = Domyślny promień (m)
cities.radius.description = Domyślny promień miast, których nie skonfigurowano indywidualnie. Wartość obowiązuje na każdej mapie.\n1000 = promień podstawowej gry\nWyższa wartość = większe miasta\nNiższa wartość = mniejsze miasta
cities.square.label = Domyślny kształt kwadratu
cities.square.description = ON nadaje kształt kwadratu miastom bez indywidualnej konfiguracji.\nOFF używa koła jak w podstawowej grze.
cities.radius_min.label = Najmniejszy promień na suwaku (m)
cities.radius_min.description = Wartość na lewym końcu suwaka.
cities.radius_max.label = Największy promień na suwaku (m)
cities.radius_max.description = Wartość na prawym końcu suwaka. Suwak ma 100 kroków; przy zakresie od 200 do 5000 jeden krok to 48 m.
cities.step.label = Procent na kliknięcie przycisku
cities.step.description = Procent zakresu suwaka zmieniany jednym kliknięciem + lub -. Nie dotyczy przeciągania suwaka.\nWyższa wartość = większa zmiana na kliknięcie\nNiższa wartość = dokładniejsza zmiana na kliknięcie
cities.label_x.label = Pozycja etykiety
cities.label_x.description = Odległość etykiety od lewej krawędzi okna.
cities.widget_x.label = Pozycja elementów sterujących
cities.widget_x.description = Odległość suwaka i pola wyboru od lewej krawędzi okna. Suwak potrzebuje około 225.
cities.checkbox_dy.label = Przesuń wiersz pola wyboru w górę lub w dół
cities.checkbox_dy.description = Przesuwa pole wyboru w górę lub w dół, aby nie nakładało się na suwak.\nWyższa wartość = pole niżej\nNiższa wartość = pole wyżej
cities.overlay.label = Dopasuj nakładkę do promienia i kształtu
cities.overlay.description = Gdy okno miasta jest otwarte, gra pokazuje na ziemi niebieską siatkę punktów, ale zawsze tylko dla koła o promieniu 1000 m.\nON dopasowuje siatkę do twojego promienia i kształtu.\nOFF pozostawia ją jak w podstawowej grze.
cities.overlay_step.label = Odstęp punktów siatki nakładki (m)
cities.overlay_step.description = Odległość między punktami wyświetlającymi granice miasta.\n0 = automatycznie jedna dwudziesta promienia, co najmniej 50 m\nNiższa wartość = gęstsze wyświetlanie i większe obciążenie
cities.probe.label = Zapisuj miasta w dzienniku
cities.probe.description = ON zapisuje promień, kształt i liczbę budynków każdego miasta w tesmioloader.log po wczytaniu. Dodatkowe komunikaty powstają, gdy okno miasta jest otwarte. Tylko do rozwiązywania problemów; dziennik może szybko rosnąć.
depletion.description = Złoża się wyczerpują. Działająca kopalnia widocznie usuwa złoże z mapy, a im mniej pozostaje, tym mniej produkuje. Wydobycie jest przechowywane w zapisie gry; po późniejszym wyłączeniu wtyczki wydobyte zasoby nie wrócą. Najpierw przetestuj na kopii zapisu gry.
depletion.group.depletion = Wydobycie
depletion.group.window = Okno kopalni
depletion.group.diagnostics = Rozwiązywanie problemów
depletion.enabled.label = Wtyczka włączona
depletion.enabled.description = ON pozwala wyczerpywać wybrane złoża podczas wydobycia.\nOFF zatrzymuje dalsze wyczerpywanie. Już usunięte zasoby nie są przywracane.
depletion.tonnes_per_texel.label = Tony na punkt mapy
depletion.tonnes_per_texel.description = Tony, które kopalnia może wydobyć z całkowicie pełnego punktu mapy zasobów. Uboższe punkty dają proporcjonalnie mniej.\nWyższa wartość = złoża wystarczają na dłużej\nNiższa wartość = złoża wyczerpują się szybciej\nDla porównania kopalnia o promieniu poszukiwań 210 m obejmuje kilka tysięcy punktów mapy.
depletion.vanilla.label = Wyczerpywalne złoża podstawowej gry
depletion.vanilla.description = Złoża podstawowej gry, które mogą się wyczerpywać. Wiele wartości oddzielaj przecinkami.\noil, iron, coal, uranium, bauxite, gravel = tylko wymienione złoża\nall = wszystkie złoża\nnone = żadne złoże podstawowej gry\nname:value = własne tony na punkt mapy, na przykład iron:3000\nZłoża z deposits.ini są zawsze uwzględniane.\ngravel trwale usuwa widoczną teksturę podłoża i wymaga znacznie wyższej wartości ze względu na mały obszar poszukiwań. Pomiń gravel, aby zachować działanie podstawowej gry.
depletion.flush_seconds.label = Sekundy między zapisami wydobycia
depletion.flush_seconds.description = Sekundy między aktualizacjami mapy zasobów. Produkcja i jakość zmieniają się natychmiast; tylko minimapa i zapis gry są aktualizowane w tym odstępie.\nNiższa wartość = częstsze aktualizacje i większe obciążenie\nNie aktualizuj częściej niż cztery razy na sekundę.
depletion.panel.label = Wiersz pozostałego złoża w oknie kopalni
depletion.panel.description = ON pokazuje pozostałe zasoby w oknie kopalni i nieco je podwyższa, na przykład „Pozostalo: 251.4 kt / 259.3 kt (96.9 %)”.
depletion.panel_caption.label = Etykieta tego wiersza
depletion.panel_caption.description = Słowo przed pozostałą ilością. Tylko litery bez znaków diakrytycznych i specjalnych, inaczej gra wyświetla nieczytelne znaki.
depletion.log_seconds.label = Odstęp wpisów o postępie (sekundy)
depletion.log_seconds.description = Sekundy między komunikatami o stanie kopalni w tesmioloader.log. Każdy zawiera pozostałą ilość, ilość całkowitą i jakość.\n0 = brak komunikatów o stanie\nWyższa wartość = rzadsze zapisywanie\nObserwuj przez kilka dni gry, aby dobrać odpowiednią liczbę ton na punkt mapy.
easystart.description = Potrzeby obywateli pojawiają się stopniowo z upływem lat. Nieodblokowana potrzeba nie wpływa na szczęście ani zdrowie; obywatele nadal odwiedzają odpowiednie miejsca i robią zakupy, ale skutki pojawiają się dopiero od wyznaczonego roku.
easystart.group.general = Co opóźnić
easystart.group.unlock = Lata odblokowania
easystart.group.unlock.description = Rok, w którym wymaganie zaczyna obowiązywać od 1 stycznia. Harmonogram przewidziano dla republiki założonej w 1920 roku. Przy starcie w 1960 roku ustawione lata już minęły.\noff = nie opóźniaj; działanie podstawowej gry\nalways = stosuj od pierwszego dnia gry\nRok = odblokuj w tym roku
easystart.group.diagnostics = Rozwiązywanie problemów
easystart.enabled.label = Wtyczka włączona
easystart.enabled.description = ON odblokowuje potrzeby i wymagania dotyczące mediów zgodnie z ustawionym harmonogramem.
easystart.demands.label = Opóźnij dziewięć potrzeb obywateli
easystart.demands.description = ON opóźnia wymagania dotyczące żywności, mięsa, odzieży, elektroniki, alkoholu, religii, kultury, sportu i zdrowia do ustawionych lat odblokowania.
easystart.utilities.label = Opóźnij trzy wymagania budynków dotyczące mediów
easystart.utilities.description = ON opóźnia wymagania dotyczące prądu, wody i ogrzewania do ustawionych lat odblokowania.
easystart.warnings.label = Opóźnij ostrzeżenia w oknie budynku
easystart.warnings.description = ON ukrywa powiązane ostrzeżenia do roku odblokowania, na przykład „budynek bez zasilania”.
easystart.pin_status.label = Utrzymuj zaspokojenie zablokowanych potrzeb
easystart.pin_status.description = ON utrzymuje zaspokojenie zablokowanej potrzeby na poniższej wartości.\nOFF pozwala mu dalej spadać; w chwili odblokowania potrzeby może być już bardzo niskie.
easystart.locked_status.label = Zaspokojenie podczas blokady
easystart.locked_status.description = Zaspokojenie potrzeby, gdy jest zablokowana. Dla żywności wartość oznacza sytość.\n1.0 = pełne zaspokojenie lub nasycenie\n0.5 = średnia wartość z zauważalną poprawą po odblokowaniu
easystart.clear_unsatisfied.label = Usuń zablokowane potrzeby z listy niezaspokojonych
easystart.clear_unsatisfied.description = ON zapobiega wywoływaniu przez zablokowane potrzeby komunikatu „N obywateli nie mogło zdobyć X”.
easystart.probe.label = Zapisuj odblokowania w dzienniku
easystart.probe.description = ON przy każdej zmianie roku zapisuje w tesmioloader.log potrzeby, które pozostają zablokowane. Jednorazowo zapisuje też pierwszego objętego działaniem obywatela. Tylko do rozwiązywania problemów.
easystart.food.label = Żywność
easystart.religion.label = Religia
easystart.meat.label = Mięso
easystart.clothes.label = Odzież
easystart.alcohol.label = Alkohol
easystart.sport.label = Sport
easystart.culture.label = Kultura
easystart.health.label = Zdrowie
easystart.electricity.label = Prąd
easystart.water.label = Woda (obejmuje ścieki)
easystart.heating.label = Ogrzewanie
easystart.electronics.label = Elektronika
easystart.school.label = Szkoła
easystart.school.description = Przed tym rokiem dzieci uczą się bez szkoły, jak przy ustawieniu edukacji „Proste”, a komunikat „N dzieci nie może chodzić do szkoły” nie pojawia się.
easystart.kindergarten.label = Przedszkole
easystart.kindergarten.description = Przed tym rokiem żaden rodzic nie musi zostawać w domu z dzieckiem poniżej sześciu lat, a komunikat „N pracowników nie może pracować, ponieważ wszystkie przedszkola …” nie pojawia się.
plugin.needs = Needs
plugin.needs.description = Zarządzaj dodatkowymi potrzebami obywateli i ustawieniami wtyczki bez edytowania oryginalnego pliku.
tab.needs.editor = Potrzeby
group.needs = Potrzeby obywateli
group.needs.plugin = Ustawienia wtyczki
group.needs.plugin.description = Przełączniki dotyczące wszystkich potrzeb.
needs.list = Lista potrzeb
needs.add = Dodaj potrzebę
needs.select_help = Wybierz potrzebę po lewej lub użyj +, aby dodać zasób zarejestrowany przez Resources.
needs.resource = Zasób
needs.resource.help = Zasób, którego mają potrzebować obywatele. Musi być zarejestrowany na liście wtyczki Resources.
needs.donor = Potrzeba wzorcowa
needs.donor.description = Istniejąca potrzeba używana jako wzorzec.\nfood lub meat = dla sklepów spożywczych\nclothes lub eletronics = dla domów towarowych\nalcohol = dla sklepów z alkoholem\neletronics to pisownia używana przez grę.
needs.factor = Mnożnik ilości
needs.factor.description = Ilość towaru względem potrzeby wzorcowej.\n1.0 = taka sama ilość jak we wzorcu\nWyższa wartość = obywatele potrzebują więcej\nNiższa wartość = obywatele potrzebują mniej
needs.category = Kategoria sklepów
needs.category.description = Sklepy przechowujące towar.\nauto = te same sklepy co dla potrzeby wzorcowej\nnone = bez automatycznego miejsca magazynowego; budynek musi sam zapewniać towar\nbasic = tylko podstawowe sklepy\nmedium = tylko średnie sklepy\nadvanced = tylko duże sklepy\nmediumadvanced = tylko średnie i duże sklepy\nhotel = tylko hotele\nLiczba = zapisz tę wartość sklepu bezpośrednio; tylko dla użytkowników znających pliki gry
needs.chance = Prawdopodobieństwo
needs.chance.description = Prawdopodobieństwo od 0 do 1, że obywatel otrzyma tę potrzebę. Poniżej 1 jest przydzielana niezależnie od potrzeby wzorcowej.\n0 = nie otrzyma jej żaden obywatel\n1 = otrzyma ją każdy odpowiedni obywatel
needs.unhappy = Niezadowolenie
needs.unhappy.description = Spadek zadowolenia, gdy obywatel nie może zdobyć towaru.\n0 = brak spadku; potrzeba jest tylko wyświetlana\nOd 0.005 do 0.02 = typowy zakres dla dobra zwiększającego komfort\nDozwolony zakres: od 0 do 1
needs.enabled = Wtyczka włączona
needs.enabled.description = ON włącza wtyczkę.\nOFF całkowicie ją wyłącza przy następnym uruchomieniu gry.
needs.demand = Przydzielaj potrzeby
needs.demand.description = ON przydziela obywatelom nową potrzebę.\nOFF nie przydziela potrzeby, ale nadal może dodawać towar do sklepów.
needs.storage = Zaopatruj sklepy
needs.storage.description = ON dodaje towar do wybranych sklepów.\nOFF nie dodaje miejsc magazynowych; obywatele mogą wtedy znaleźć towar tylko w budynkach, które zapewniają go samodzielnie.
needs.max_demands = Potrzeby na obywatela
needs.max_demands.description = Maksymalna liczba dodatkowych potrzeb, które obywatel może mieć jednocześnie.\n1 = najwyżej jedna dodatkowa potrzeba\n7 = najwyższa dozwolona liczba
needs.when_full = Po osiągnięciu limitu potrzeb
needs.when_full.description = Co zrobić, gdy obywatel ma już maksymalną liczbę dodatkowych potrzeb.\nskip = poczekaj na wolne miejsce\nreplace = tym razem zastąp potrzebę wzorcową
needs.probe = Szczegółowy dziennik
needs.probe.description = ON zapisuje listy potrzeb obywateli i informacje o każdym sklepie w szczegółowym dzienniku wtyczki.\nOFF zapisuje tylko ostrzeżenia. Włączaj tymczasowo podczas sprawdzania nowych sklepów.
needs.log_seconds = Odstęp komunikatów o postępie (sekundy)
needs.log_seconds.description = Sekundy między komunikatami o liczbie przydzielonych potrzeb.\n0 = wyłącz te komunikaty\nWyższa wartość = rzadsze zapisywanie
tab.needs.general = Ogólne
plugin.deposits = Deposits
plugin.deposits.description = Zarządzaj typami złóż nieobecnymi w podstawowej grze i ustawieniami wtyczki bez edytowania oryginalnego pliku.
tab.deposits.general = Ogólne
tab.deposits.editor = Złoża
group.deposits = Złoża
group.deposits.description = Oryginalne złoża są chronione i można je ukryć; własne złoża są przechowywane oddzielnie i scalane w wynikowym deposits.ini. Każda sekcja poza [deposits] jest jednym złożem.
group.deposits.plugin = Ustawienia wtyczki
group.deposits.plugin.description = Trzy podsystemy sekcji [deposits]. Każdy jest wyłączony dla wszystkich złóż, jeśli jego przełącznik tutaj jest wyłączony.
deposits.notice = Numer typu złoża, jego kanał mapy i token w building.ini stają się częścią zapisu gry, gdy zacznie ich używać kopalnia. Usunięcie lub zmiana numeru używanego złoża może uniemożliwić korzystanie z zapisu gry; najpierw przetestuj na kopii.
deposits.list = Lista złóż
deposits.add = Dodaj złoże
deposits.select_help = Wybierz złoże po lewej lub użyj +, aby dodać złoże dla zasobu zarejestrowanego przez Resources.
deposits.name = Złoże
deposits.name.help = Nazwa sekcji w deposits.ini. Określa nazwę złoża w dzienniku i przy pędzlu edytora; nie można jej później zmienić.
deposits.new_name = Nazwa złoża
deposits.new_hint = Tutaj podaje się tylko standardowe ustawienia. Wszystko inne (składowa, typ budynku, wyczerpywanie) znajduje się po prawej w ustawieniach po dodaniu.
deposits.code_patch = Modyfikacja kodu
deposits.code_patch.description = ON wprowadza do gry skonfigurowane typy złóż $TYPE_MINE_, aby kopalnie mogły je znajdować przez building.ini. Jeśli po aktualizacji oczekiwane dane gry już nie pasują, wtyczka niczego nie zmienia.
deposits.minimap_all = Warstwy minimapy
deposits.minimap_all.description = ON pokazuje przycisk pod pięcioma przyciskami minimapy gry dla każdego indywidualnie włączonego złoża wtyczki.\nOFF ukrywa wszystkie przyciski złóż wtyczki.
deposits.editor_all = Pędzle edytora terenu
deposits.editor_all.description = ON pokazuje pędzel malowania i wymazywania na karcie Zasoby edytora terenu dla każdego złoża z nazwą pędzla.\nOFF ukrywa wszystkie pędzle złóż wtyczki.
deposits.token = Token budynku
deposits.token.description = Token używany przez kopalnię w building.ini dla tego złoża, na przykład $TYPE_MINE_COPPER. Wpisz go tak jak $TYPE_MINE_GRAVEL. Nigdy nie używaj dwóch tokenów złóż w tym samym building.ini.
deposits.type = Numer typu
deposits.type.description = Unikalny numer typu złoża. Dwa złoża nie mogą używać tego samego numeru.\nOd 10 do 127 = dozwolony zakres\nOd 0 do 9 = zarezerwowane dla podstawowej gry\nOkno dialogowe automatycznie proponuje następny wolny numer.
deposits.map = Mapa
deposits.map.description = Mapa, na której przechowywane jest złoże.\nauto = automatycznie wybierz wolne miejsce na mapie wtyczki; zalecane\nresourcemap lub resourcemap2 = użyj map podstawowej gry\nOd resourcemap3 do resourcemap10 = użyj dodatkowych map wtyczki\nterrain = użyj bezpośrednio pomalowanego podłoża, na przykład dla żwiru; jego pędzel pojawia się pod ROCKS
deposits.component = Składowa
deposits.component.description = Każda mapa ma cztery miejsca od 0 do 3. Każde może zawierać jedno złoże.\nPrzy auto = pozostaw pole puste; wtyczka wybierze wolne miejsce\nPrzy terrain: 2 = warstwa żwiru\nPrzy terrain: 3 = warstwa oazy
deposits.building_type = Typ budynku
deposits.building_type.description = Typ budynku mogący wydobywać to złoże.\n7 = kopalnia; właściwe dla niemal każdego złoża\n92 = studnia\nPuste pole = 7
deposits.radius = Promień poszukiwań
deposits.radius.description = Jak daleko kopalnia szuka swojego złoża.\noil, ore, bauxite, gravel, wood, water, watersurface = użyj odpowiedniej stałej gry\nLiczba = użyj tej odległości bezpośrednio\nPuste pole = użyj ore\nBez promienia kopalnia nie znajdzie złoża.
deposits.icon = Ikona minimapy
deposits.icon.description = Zasób, którego ikona pojawia się na przycisku minimapy. Wtyczka używa ikony już wczytanej przez grę; osobny obraz nie jest potrzebny.\nZasoby z wtyczki Resources muszą być w niej zarejestrowane.\nPuste pole = brak ikony
deposits.minimap = Przycisk minimapy
deposits.minimap.description = ON dodaje przycisk minimapy i warstwę nakładki dla tego złoża.
deposits.editor = Nazwa pędzla edytora
deposits.editor.description = Nazwa pędzli malowania i wymazywania w edytorze terenu. Ta sama nazwa jest używana w tool_paint_<name>.png i tool_erase_<name>.png w vfs\media_soviet\editor.\nPuste pole = nie twórz pędzla\nDozwolone: do 31 liter, cyfr, _ i -
deposits.deplete = Wyczerpywanie na teksel
deposits.deplete.description = To ustawienie odczytuje wtyczka Depletion. Określa tony możliwe do wydobycia z całkowicie pełnego punktu mapy zasobów. Uboższe punkty dają proporcjonalnie mniej.\nWartość zastępuje tonnes_per_texel w plugins\depletion.ini.\n0 = to złoże pozostaje nieskończone\nPuste pole = użyj wartości globalnej
deposits.save_warning = Zmiany trafiają do wynikowego deposits.ini dopiero podczas zapisywania. Numery typów, kanały map i tokeny złóż używanych już przez zapis gry nie mogą się zmieniać; najpierw przetestuj na kopii.
depletion.tab.general = Ogólne
depletion.tab.mining = Wydobycie
needs.save_warning = Zmiany trafiają do wynikowego needs.ini dopiero podczas zapisywania. Każda potrzeba dodaje miejsce magazynowe do odpowiednich sklepów, a miejsce to jest częścią zapisu gry. Najpierw przetestuj na kopii.
bp.name = Buildings Plus
bp.description = Nowe budynki z definicji: budynek wzorcowy z gry i różniące się linie building.ini. Przy każdym uruchomieniu gry zapisywane jako kompletne elementy Workshopu.
bp.notice = Każdy budynek staje się folderem w media_soviet\workshop_wip z własnym identyfikatorem Workshopu. Pozostaw identyfikator pusty, a wtyczka przy uruchomieniu gry przydzieli następny wolny numer od 9300000000 i zachowa go w plugins\buildings_plus.ids.ini. Gra odczytuje folder jak nieopublikowany element Workshopu. Zmiany wymagają pełnego restartu. Zapis gry zawierający taki budynek potrzebuje tego folderu przy wczytywaniu.
bp.tab.general = Ogólne
bp.tab.buildings = Budynki
bp.tab.generated = Wygenerowane budynki
bp.wip = Wygenerowane budynki w folderze gry
bp.wip.description = Pokazuje budynki wygenerowane przez Buildings Plus lub oryginalną wtyczkę buildings do media_soviet\workshop_wip. Wyświetlane dane są odczytywane z folderów.
bp.wip.empty = Nie ma tu jeszcze wygenerowanych budynków. Budynki są generowane przy uruchamianiu gry, jeśli któryś jest włączony.
bp.group = Budynki
bp.group.notice = Budynek tutaj jest kopią budynku z gry z innymi liniami: ten sam model, te same połączenia, twoja receptura. Wybierz wzorzec tego samego rodzaju (kopalnię dla kopalni, fabrykę dla fabryki).
bp.list = Budynki
bp.add = Dodaj
bp.select_help = Wybierz budynek po lewej lub użyj +, aby go dodać. Najpierw wybierany jest wzorzec, identyfikator Workshopu może pozostać pusty; nazwę i linie ustawisz potem po prawej.
bp.id = Nazwa obiektu
bp.id.help = Nadaje nazwę folderowi i obiektowi wygenerowanego budynku oraz pojawia się w dzienniku. Tylko litery, cyfry, _ i -, najwyżej 64 znaki; później nie można jej zmienić.
bp.save_warning = Zmiany trafiają do wynikowego buildings_plus.ini dopiero podczas zapisywania i działają po pełnym restarcie gry. Wtyczka zapisuje wtedy folder w media_soviet\workshop_wip; sekcja z błędem jest pomijana i wymieniana w dzienniku.
bp.list.note = Najwyżej 256 budynków.
bp.new_name = Nazwa obiektu
bp.new_hint = Spacje zmieniają się w podkreślenia, a wielkie litery w małe.
bp.card.folders = Wygenerowane foldery
bp.card.log = Rozwiązywanie problemów
bp.card.new = Nowy budynek
bp.links = Poradniki
bp.link.readme = README (poradnik)
bp.prune = Porządkuj foldery
bp.prune.description = ON usuwa przy następnym uruchomieniu gry wygenerowany folder budynku, który usunięto lub wyłączono (tylko foldery utworzone przez tę wtyczkę).\nOFF pozostawia te foldery; gra nadal wczytuje budynki.
bp.always = Zawsze zapisuj ponownie
bp.always.description = ON zapisuje każdy folder budynku przy każdym uruchomieniu gry.\nOFF zapisuje folder tylko po zmianie jego sekcji, wtyczki lub pliku wzorca. Pozostaw OFF.
bp.verbose = Szczegółowy dziennik
bp.verbose.description = ON zapisuje każdy skopiowany plik i każdą usuniętą linię wzorca w logs\tesmioloader.buildings_plus.log.\nOFF zapisuje tylko wyniki, ostrzeżenia i błędy.
bp.repair_owner_ids = Uzupełniaj identyfikator właściciela
bp.repair_owner_ids.description = ON wpisuje twój identyfikator Steam do wygenerowanych budynków, które go nie mają, także z innych generatorów. Bez niego gra pyta o brakujące elementy Workshopu przy każdym wczytaniu zapisu z takim budynkiem.\nOFF pozostawia foldery innych generatorów bez zmian.
bp.card.saves = Zapisy gry
bp.card.saves.description = Zapis gry pamięta magazyny każdego stojącego budynku. To ustawienie pozwala zastosować nową linię magazynu jednego z twoich budynków także do istniejących egzemplarzy.
bp.retrofit = Aktualizuj magazyny już stojących budynków
bp.retrofit.description = ON: po wczytaniu zapisu każdy ukończony wygenerowany budynek otrzymuje puste magazyny pojedynczych zasobów dodane do jego sekcji. Zmiana pojemności w linii magazynu zmienia też magazyn; zmniejszenie czeka, aż zapasy się zmieszczą. Magazyn, którego linię usunięto, znika z budynków, gdy tylko się opróżni.\nOFF: magazyny już stojących budynków pozostają bez zmian; nowe i zmienione linie dotyczą tylko budynków zbudowanych później.
bp.enabled = Budynek włączony
bp.enabled.description = ON generuje ten budynek przy następnym uruchomieniu gry.\nOFF go nie generuje. Jeśli włączono „Porządkuj foldery”, istniejący folder zostanie usunięty przy następnym uruchomieniu.
bp.item_id = Identyfikator Workshopu
bp.item_id.description = Możliwy własny numer: od 9000000000 do 9999999999, z wyjątkiem od 9100000000 do 9199999999 (zarezerwowane dla innych generatorów)\nNadaje nazwę folderowi w workshop_wip w folderze gry i nie powinien być później zmieniany.
bp.donor = Budynek wzorcowy
bp.donor.description = Budynek stanowiący podstawę kopii; budynek z Workshopu musi być zasubskrybowany.\nUżyj „Wybierz wzorzec...”, aby przejrzeć dostępne budynki. Dopasuj rodzaj: kopalnię do kopalni, fabrykę do fabryki, sklep do sklepu.
bp.item_name = Nazwa w grze
bp.item_name.description = Nazwa wyświetlana w grze.\nWartość z kropkami jest traktowana jako klucz tłumaczenia i odczytywana przez wtyczkę Localization, na przykład: localization.lang.salt_mine
bp.desc = Opis
bp.desc.description = Opis elementu Workshopu, po jednej linii na wiersz pola. Bez cudzysłowów.
bp.line = Linie building.ini
bp.line.description = Jedna linia building.ini na wiersz pola, na przykład $PRODUCTION raw_salt 1.0. Użyj „Wybierz linię…”, aby pobrać linię z budynku wzorcowego i ją dostosować. Twoje linie trafiają przed linie wzorca i zastępują: ten sam token; wszystkie $TYPE_*; wszystkie $STORAGE* wraz z $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION i $CONSUMPTION_PER_SECOND jako jedną recepturę. Cała reszta wzorca pozostaje.\nDla własnych zasobów zawsze używaj $STORAGE_IMPORT_SPECIAL lub $STORAGE_EXPORT_SPECIAL z nazwą zasobu, inaczej magazyn wyświetli każdy zasób danej klasy transportu.
bp.strip = Usuń linie wzorca
bp.cmd_add = Dopisz
bp.cmd_add.description = Jedno polecenie na wiersz: nowa linia wstawiana przed końcowym zamknięciem pliku wzorca. Blok wielu linii zapisuje się z | między liniami.
bp.cmd_replace = Zamień
bp.cmd_replace.description = Jedno polecenie na wiersz: stara linia | nowa linia. Stara linia musi występować w pliku wzorca dokładnie raz.
bp.cmd_remove = Usuń
bp.cmd_remove.description = Jedno polecenie na wiersz: linia pliku wzorca do usunięcia. Powiązane linie (punkty, pozycja) są usuwane razem z nią.
bp.cmd_insert = Wstaw
bp.cmd_insert.description = Jedno polecenie na wiersz: 0 lub 1 | linia odniesienia | nowa linia. 0 wstawia nową linię przed linią odniesienia, 1 za nią.
bp.strip.description = Jeden $TOKEN na wiersz, na przykład $WORKERS_NEEDED. Każda linia wzorca z tym tokenem jest usuwana bez zastąpienia.
bp.life = Wytrzymałość
bp.life.description = Puste = 3000\nLIFE w renderconfig.ini: ile budynek może wytrzymać, zanim się zawali. Jak większość budynków gry.
bp.card.lines = Linie
bp.item_id.empty = wtyczka przydziela następny wolny numer od 9300000000 przy uruchomieniu gry.
bp.item_name.empty = nazwa obiektu; niezalecane.
needs_plus.card.log = Rozwiązywanie problemów
resources_plus.card.log = Rozwiązywanie problemów
resources_plus.card.plugin = Wtyczka
resources_plus.custom_report = Zapisuj sklonowane rekordy
resources_plus.custom_report.description = ON zapisuje dla każdego zasobu ze wzorcem, co klon rzeczywiście odziedziczył (klasę transportu, mnożniki, flagi). Zasoby bez wzorca są zawsze wymieniane.\nOFF wymienia tylko zasoby bez wzorca.
resources_plus.customs_hook = Aktualizuj urzędy celne
resources_plus.customs_hook.description = ON dodaje nowe zasoby do listy handlowej już istniejących urzędów celnych.\nOFF to działanie podstawowej gry: urząd handluje tylko tym, co znał w chwili budowy; wtedy pomaga jedynie rozbiórka i ponowna budowa.
resources_plus.customs_probe = Zapisuj wpisy urzędów celnych
resources_plus.customs_probe.description = ON zapisuje w tesmioloader.log po jednej linii dla każdego zasobu dodanego do urzędu celnego. Ustaw OFF, gdy urzędy pokazują oczekiwane zasoby.
resources_plus.price_hook = Stosuj ceny z pliku INI
resources_plus.price_hook.description = ON uaktywnia [base_price] i [price]: ceny bazowe są ustawiane przed obliczaniem cen przez grę, a stałe ceny po nim.\nOFF pozostawia ceny grze.
resources_plus.price_report = Zapisuj tabelę cen
resources_plus.price_report.description = ON po każdym obliczaniu cen przez grę zapisuje w tesmioloader.log cenę, cenę bazową i kategorię cenową każdego zasobu z twojej listy. Cena 0.00 oznacza, że nie produkuje go żaden budynek.\nOFF niczego nie zapisuje.
