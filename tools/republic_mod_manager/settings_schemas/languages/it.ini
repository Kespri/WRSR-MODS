[language]
name = Italiano

[strings]
plugin.resources = Resources
plugin.resources.description = Gestisci risorse, proprietà ed eventuali prezzi personalizzati.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Risorse personalizzate con Resources Plus: lo stesso elenco dell'originale, in plugins\resources_plus.ini, senza l'arresto anomalo all'uscita.
resources_plus.save_warning = Le modifiche vengono scritte in plugins\resources_plus.ini quando salvi. Rimuovere una risorsa già utilizzata da un salvataggio può danneggiarlo.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Bisogni personalizzati dei cittadini con Needs Plus: lo stesso elenco dell'originale, nel file needs_plus.ini della cartella plugins, importato da needs.ini al primo avvio.
needs_plus.save_warning = Le modifiche vengono scritte in needs_plus.ini, nella cartella plugins, solo quando salvi. Ogni bisogno aggiunge uno spazio di stoccaggio ai negozi interessati, e questo spazio fa parte del salvataggio. Prova prima su una copia.
tab.resources.editor = Risorse
group.resource_definitions = Definizioni delle risorse
detail.transport = Classe di trasporto
detail.transport.description = Determina quali veicoli e depositi possono trasportare e stoccare la risorsa. Basta scegliere un nome; il plugin aggiunge i valori del gioco base per quella classe.
detail.kind = Categoria di prezzo
detail.kind.description = 0 materie prime, 1 prodotti lavorati, 2 cibo/vestiti, 3 materiali avanzati, 4 elettronica.
detail.record_price = Prezzo iniziale nel record
detail.record_price.description = Valori iniziali facoltativi in RUB e USD nel record della risorsa.
detail.record_base_price = Prezzo base iniziale nel record
detail.record_base_price.description = Valori base facoltativi in RUB e USD nel record della risorsa.
detail.trade_mult = Moltiplicatori commerciali
detail.trade_mult.description = Moltiplicatori di vendita e acquisto, normalmente 0.95 e 1.05.
detail.market_rub = Blocco di mercato RUB
detail.market_usd = Blocco di mercato USD
detail.market.description = Due valori di mercato e un coefficiente facoltativo.\n(Vedi la descrizione nel file INI)
detail.packed = Carico imballato
detail.packed.description = Rappresentazione del carico automatica, non imballata o imballata.
detail.family = Famiglia di materiali
detail.family.description = Determina l'aspetto del materiale accatastato in un cantiere e, molto probabilmente, il rifiuto in cui si trasforma. Ogni famiglia contiene una risorsa di rifiuto. I numeri da 10 a 19 nel file INI vengono mostrati per nome.
detail.cargo = Geometria del carico
detail.cargo.description = Selezione della geometria usata per visualizzare il carico.
detail.pinned_base_price = Prezzo base fisso
detail.pinned_base_price.description = Valore facoltativo in RUB e USD in [base_price]. Vuoto significa nessuna voce personalizzata.
detail.forced_price = Prezzo finale imposto
detail.forced_price.description = Valore facoltativo in RUB e USD in [price]. Se vuoto, il gioco calcola il prezzo.

; --- Schemi locali per i plugin originali installati (dalla versione 0.13.0) ---
daynight.description = Un'alba e un tramonto per giorno di calendario. Nel gioco base, il passaggio dal giorno alla notte e ritorno richiede 13 giorni di calendario, quasi due settimane. Con questo plugin avviene in un solo giorno.
daynight.group.cycle = Giorno e notte
daynight.group.cycle.description = Durata del ciclo giorno-notte e momento in cui arriva la notte.
daynight.group.pace = Velocità
daynight.group.pace.description = Due controlli separati: uno per i veicoli, uno per tutto il resto. Si applicano sempre, indipendentemente dalle impostazioni precedenti.
daynight.group.diagnostics = Risoluzione dei problemi
daynight.enabled.label = Plugin abilitato
daynight.enabled.description = ON abilita il ciclo giorno-notte configurato.
daynight.cycle_days.label = Giorni di calendario per ciclo giorno-notte
daynight.cycle_days.description = Giorni di calendario da un'alba alla successiva.\n1 = un'alba e un tramonto ogni giorno\nDa 2 a 12 = un ciclo proporzionalmente più lungo\n13 = il ciclo del gioco base
daynight.day_scale.label = Durata del giorno (fattore di rallentamento del calendario)
daynight.day_scale.description = Quanto dura in più un giorno di calendario rispetto al gioco base.\nauto = rallenta automaticamente il calendario per adattarlo al ciclo di luce; consigliato\n1 = non rallenta il calendario; giorno e notte si alternano quindi 13 volte più velocemente\nDa 2 a 100 = rallenta il calendario di questo fattore\nScegli quali parti del gioco rallentare in «Cosa rallentare».
daynight.slow.label = Cosa rallentare
daynight.slow.description = Quali parti del gioco rallentare.\ncalendar = rallenta solo il calendario; consigliato\nworld = rallenta tutto, inclusi cittadini e veicoli; i valori elevati producono un effetto al rallentatore\nnone = non rallenta nulla\nCon calendar, cittadini, veicoli, costruzioni e produzione mantengono la velocità normale. I processi quotidiani, come inquinamento, prestiti e messaggi, mantengono l'intervallo abituale.
daynight.offset.label = Quando arriva la notte
daynight.offset.description = Sposta la notte all'interno del giorno di calendario.\n0 = il buio inizia poco dopo la metà della giornata\n0.5 = il buio inizia al cambio di data\nCon un valore diverso da 0, un ciclo di 13 giorni non corrisponde più esattamente al gioco base.
daynight.fade.label = Adatta le transizioni di luce
daynight.fade.description = ON accorcia le transizioni tra mattina, giorno, sera e notte per adattarle al ciclo configurato.\nOFF usa le transizioni lente del gioco base. Con cicli brevi possono sovrapporsi e rendere l'illuminazione sbiadita.
daynight.vehicle_scale.label = Velocità dei veicoli
daynight.vehicle_scale.description = Velocità di camion, treni, navi e aerei. Funziona indipendentemente dalle altre impostazioni.\n1 = velocità del gioco base\n2 = metà velocità\n0.5 = velocità doppia\nValore più alto = veicoli più lenti
daynight.sim_scale.label = Velocità di tutto il resto
daynight.sim_scale.description = Velocità di cittadini, costruzioni, produzione, usura e animazioni.\n1 = velocità del gioco base\n2 = metà velocità\n0.5 = velocità doppia\nValore più alto = simulazione più lenta
daynight.probe.label = Registra la durata dei giorni nel log
daynight.probe.description = ON scrive la durata reale di ogni giorno di calendario e transizione di luce in tesmioloader.log. Usa solo per la risoluzione dei problemi e le verifiche dopo un aggiornamento del gioco.
walking.description = Quanto lontano camminano i cittadini e quanto lontano guidano i proprietari di auto tra casa, lavoro e parcheggio.
walking.group.distances = Distanze
walking.group.distances.description = Misurate lungo strade e percorsi pedonali, non in linea d'aria. Un edificio a 400 m dall'altra parte del fiume può richiedere 1200 m a piedi.
walking.group.diagnostics = Risoluzione dei problemi
walking.enabled.label = Plugin abilitato
walking.enabled.description = ON abilita le distanze a piedi e in auto configurate.
walking.distance.label = Distanza a piedi (m)
walking.distance.description = Il percorso più lungo che un cittadino percorrerà a piedi. Il gioco base usa 480 m.\nValore più alto = più edifici raggiungibili a piedi e più collegamenti creati durante la costruzione\n0 = nessun limite; la costruzione in una grande città può quindi richiedere diversi secondi\n20000 = valore massimo accettato
walking.car_distance.label = Distanza in auto per i proprietari di auto (m)
walking.car_distance.description = Il tragitto più lungo consentito tra casa, lavoro e parcheggio. Il gioco base usa 2500 m.\nValore più alto = i proprietari di auto viaggiano più lontano\nImposta un valore superiore alla distanza a piedi. Con valori uguali, l'auto non offre alcun vantaggio di portata.
walking.regen_on_load.label = Ricostruisci i collegamenti al caricamento di un salvataggio
walking.regen_on_load.description = I collegamenti pedonali e dei parcheggi sono memorizzati nel salvataggio.\nON ricostruisce ogni collegamento al caricamento, così le distanze configurate si applicano anche alle città esistenti.\nOFF applica le distanze configurate solo agli edifici di nuova costruzione.
walking.probe.label = Registra i valori di controllo nel log
walking.probe.description = ON scrive in tesmioloader.log i valori trovati nel gioco prima che il plugin li modifichi. Usa solo per la risoluzione dei problemi e le verifiche dopo un aggiornamento del gioco.
accumulator.description = Batterie per la tua rete elettrica. Un edificio con una grande riserva di energia si carica quando c'è elettricità in eccesso e la restituisce quando manca.
accumulator.group.battery = Batteria
accumulator.group.battery.description = Quali edifici contano come batterie e quanto velocemente si caricano e si scaricano.
accumulator.group.window = Finestra dell'edificio
accumulator.group.grid = Rete elettrica
accumulator.group.diagnostics = Risoluzione dei problemi
accumulator.enabled.label = Plugin abilitato
accumulator.enabled.description = ON abilita la carica e la scarica degli edifici batteria.\nOFF interrompe la scarica. Gli edifici restano e possono continuare a caricarsi.
accumulator.building_types.label = Tipi di edificio
accumulator.building_types.description = Tipi di edificio che possono funzionare come batterie. Separa più numeri con virgole.\n19 = trasformatore\n18 = sottostazione\nNon usare 17: una centrale non può ricevere elettricità e non si caricherebbe mai.
accumulator.min_capacity.label = Capacità minima per essere considerato una batteria
accumulator.min_capacity.description = Capacità di accumulo minima affinché un edificio conti come batteria. Esclude i piccoli accumuli delle normali sottostazioni.\nValore più alto = meno edifici contano come batterie\nValore più basso = più edifici contano come batterie\nLo «Stationary Accumulator» incluso ha una capacità di 5000.
accumulator.charge_rate.label = Velocità di carica (potenza al secondo)
accumulator.charge_rate.description = Quantità massima di elettricità assorbita da una batteria al secondo. Il limite impedisce a una batteria vuota di sottrarre elettricità a un'intera città.\nValore più alto = carica più rapida e maggiore carico sulla rete\nValore più basso = carica più lenta e minore carico\nPer confronto, una centrale a carbone fornisce 70 e una turbina eolica 15.
accumulator.discharge_rate.label = Velocità di scarica (potenza al secondo)
accumulator.discharge_rate.description = Quantità massima di elettricità fornita da una batteria al secondo. La fornisce solo quando la rete ne è carente.\nValore più alto = copre carenze di potenza maggiori\nValore più basso = l'energia accumulata dura più a lungo\nEsempio: a 60, una batteria piena con capacità 5000 sostituisce una centrale per poco più di 80 secondi.
accumulator.panel.label = Riga della carica nella finestra della batteria
accumulator.panel.description = ON aggiunge il livello di carica alla finestra della batteria, ad esempio «Carica: 4210.5 / 5000 (84.2 %)».
accumulator.panel_caption.label = Etichetta di questa riga
accumulator.panel_caption.description = La parola davanti al livello di carica. Solo lettere, senza accenti né caratteri speciali, altrimenti il gioco mostra caratteri illeggibili.
accumulator.gauges.label = Calcola gli indicatori della finestra in base alla batteria
accumulator.gauges.description = ON sostituisce la visualizzazione errata del gioco con il flusso effettivo in entrata e in uscita dalla batteria.\nOFF usa la normale visualizzazione del gioco. Può mostrare potenza 0 e «senza alimentazione elettrica» mentre la batteria si carica.
accumulator.spread_voltage.label = Esperimento: trasmetti la tensione ai vicini (lascia disattivato)
accumulator.spread_voltage.description = ON non ha effetto. Questa vecchia funzione è stata sostituita a livello tecnico. Lascia su OFF.
accumulator.trace.label = Registra i vicini della prima batteria
accumulator.trace.description = ON scrive nel log quanta elettricità ricevono gli edifici accanto alla prima batteria. Solo per la risoluzione dei problemi; può ridurre le prestazioni.
accumulator.log_seconds.label = Secondi tra le righe del log della batteria
accumulator.log_seconds.description = Intervallo tra i messaggi di stato della batteria in tesmioloader.log. Ogni messaggio include carica, flusso in entrata e flusso in uscita.\n0 = nessun messaggio di stato\nValore più alto = registrazione meno frequente
accumulator.probe.label = Secondi tra gli elenchi di edifici nel log
accumulator.probe.description = Intervallo tra gli elenchi di tutti gli edifici con accumulo elettrico in tesmioloader.log. Usa solo quando una batteria non viene riconosciuta o dopo un aggiornamento del gioco.\n0 = non scrivere questi elenchi\nValore più alto = registrazione meno frequente
cities.description = Dimensioni e forma di ogni città. Nel gioco base ogni città è un cerchio con raggio di 1000 m. Con questo plugin imposti il raggio di ogni città separatamente, eventualmente con forma quadrata, direttamente nella sua finestra. I valori sono memorizzati nel salvataggio.
cities.group.cities = Città
cities.group.slider = Cursore del raggio
cities.group.slider.description = L'intervallo del cursore nella finestra della città e la variazione prodotta da un clic su + o -.
cities.group.layout = Disposizione nella finestra della città
cities.group.layout.description = Posizione delle due nuove righe nella finestra della città. I numeri sono posizioni nell'unità propria della finestra del gioco; la finestra è larga circa 500.
cities.group.overlay = Griglia di punti sul terreno
cities.group.diagnostics = Risoluzione dei problemi
cities.enabled.label = Plugin abilitato
cities.enabled.description = ON abilita dimensioni e forme personalizzate delle città.
cities.window.label = Cursore del raggio e casella della forma nella finestra della città
cities.window.description = ON mostra il cursore del raggio e la casella per la forma quadrata nella finestra della città.\nOFF nasconde entrambi; i valori impostati restano, ma non puoi più modificarli.
cities.adopt.label = Crea una città per gli edifici rimasti senza città
cities.adopt.description = Quando riduci una città, alcuni edifici possono restare fuori e non appartenere più ad alcuna città.\nON fonda per loro una nuova città con nome casuale e data odierna, come fa il gioco stesso.\nOFF li lascia senza città; il comportamento del gioco in questo caso non è stato testato.
cities.radius.label = Raggio predefinito (m)
cities.radius.description = Raggio predefinito per le città non configurate individualmente. Il valore si applica a ogni mappa.\n1000 = raggio del gioco base\nValore più alto = città più grandi\nValore più basso = città più piccole
cities.square.label = Forma quadrata predefinita
cities.square.description = ON rende quadrate le città non configurate individualmente.\nOFF usa un cerchio come nel gioco base.
cities.radius_min.label = Raggio minimo del cursore (m)
cities.radius_min.description = Il valore all'estremità sinistra del cursore.
cities.radius_max.label = Raggio massimo del cursore (m)
cities.radius_max.description = Il valore all'estremità destra del cursore. Il cursore ha 100 passi; da 200 a 5000 un passo corrisponde a 48 m.
cities.step.label = Percentuale per clic sul pulsante
cities.step.description = Percentuale dell'intervallo del cursore modificata da un clic su + o -. Non si applica mentre trascini il cursore.\nValore più alto = variazione maggiore per clic\nValore più basso = variazione più fine per clic
cities.label_x.label = Posizione dell'etichetta
cities.label_x.description = Distanza dell'etichetta dal bordo sinistro della finestra.
cities.widget_x.label = Posizione dei controlli
cities.widget_x.description = Distanza del cursore e della casella dal bordo sinistro della finestra. Il cursore richiede circa 225.
cities.checkbox_dy.label = Sposta la riga della casella in alto o in basso
cities.checkbox_dy.description = Sposta la casella in alto o in basso per evitare che si sovrapponga al cursore.\nValore più alto = casella più in basso\nValore più basso = casella più in alto
cities.overlay.label = Adatta la sovrapposizione al raggio e alla forma
cities.overlay.description = Quando una finestra della città è aperta, il gioco mostra una griglia di punti blu sul terreno, ma sempre per un cerchio con raggio di 1000 m.\nON adatta la griglia al raggio e alla forma impostati.\nOFF la lascia come nel gioco base.
cities.overlay_step.label = Distanza tra i punti della griglia sovrapposta (m)
cities.overlay_step.description = Distanza tra i punti che mostrano il confine della città.\n0 = usa automaticamente un ventesimo del raggio, almeno 50 m\nValore più basso = visualizzazione più fitta e maggiore impatto sulle prestazioni
cities.probe.label = Registra le città nel log
cities.probe.description = ON scrive raggio, forma e numero di edifici di ogni città in tesmioloader.log dopo il caricamento. Altri messaggi vengono scritti mentre una finestra della città è aperta. Solo per la risoluzione dei problemi; il log può crescere rapidamente.
depletion.description = I giacimenti si esauriscono. Una miniera attiva rimuove visibilmente il giacimento dalla mappa e, meno ne resta, meno produce. L'estrazione è memorizzata nel salvataggio; se disattivi il plugin in seguito, ciò che è stato estratto non ritorna. Prova prima su una copia del salvataggio.
depletion.group.depletion = Estrazione
depletion.group.window = Finestra della miniera
depletion.group.diagnostics = Risoluzione dei problemi
depletion.enabled.label = Plugin abilitato
depletion.enabled.description = ON permette ai giacimenti selezionati di esaurirsi durante l'estrazione.\nOFF interrompe l'ulteriore esaurimento. Le risorse già rimosse non vengono ripristinate.
depletion.tonnes_per_texel.label = Tonnellate per punto della mappa
depletion.tonnes_per_texel.description = Tonnellate che una miniera può estrarre da un punto completamente pieno della mappa delle risorse. I punti meno ricchi rendono proporzionalmente meno.\nValore più alto = i giacimenti durano più a lungo\nValore più basso = i giacimenti si esauriscono prima\nPer confronto, una miniera con raggio di ricerca di 210 m copre diverse migliaia di punti della mappa.
depletion.vanilla.label = Giacimenti esauribili del gioco base
depletion.vanilla.description = Giacimenti del gioco base che possono esaurirsi. Separa più valori con virgole.\noil, iron, coal, uranium, bauxite, gravel = solo i giacimenti indicati\nall = tutti i giacimenti\nnone = nessun giacimento del gioco base\nname:value = tonnellate personalizzate per punto della mappa, ad esempio iron:3000\nI giacimenti di deposits.ini sono sempre inclusi.\ngravel rimuove permanentemente la texture visibile del terreno e richiede un valore molto più alto a causa della piccola area di ricerca. Ometti gravel per mantenerlo come nel gioco base.
depletion.flush_seconds.label = Secondi tra i salvataggi dell'estrazione
depletion.flush_seconds.description = Secondi tra gli aggiornamenti della mappa delle risorse. Produzione e qualità cambiano subito; solo la minimappa e il salvataggio seguono questo intervallo.\nValore più basso = aggiornamenti più frequenti e maggiore impatto sulle prestazioni\nNon aggiornare più di quattro volte al secondo.
depletion.panel.label = Riga del giacimento residuo nella finestra della miniera
depletion.panel.description = ON mostra la riserva residua nella finestra della miniera e ne aumenta leggermente l'altezza, ad esempio «Residuo: 251.4 kt / 259.3 kt (96.9 %)».
depletion.panel_caption.label = Etichetta di questa riga
depletion.panel_caption.description = La parola davanti alla quantità residua. Solo lettere, senza accenti né caratteri speciali, altrimenti il gioco mostra caratteri illeggibili.
depletion.log_seconds.label = Intervallo delle righe di avanzamento (secondi)
depletion.log_seconds.description = Secondi tra i messaggi di stato delle miniere in tesmioloader.log. Ogni messaggio include quantità residua, quantità totale e qualità.\n0 = nessun messaggio di stato\nValore più alto = registrazione meno frequente\nOsserva diversi giorni di gioco per trovare un valore adatto di tonnellate per punto della mappa.
easystart.description = I bisogni dei cittadini compaiono gradualmente nel corso degli anni. Un bisogno non ancora sbloccato non influisce su felicità e salute; i cittadini continuano a frequentare i luoghi interessati e a fare acquisti, ma le conseguenze compaiono solo dall'anno previsto.
easystart.group.general = Cosa rimandare
easystart.group.unlock = Anni di sblocco
easystart.group.unlock.description = Anno in cui il requisito inizia ad applicarsi dal 1° gennaio. Il calendario è pensato per una repubblica fondata nel 1920. Con un inizio nel 1960, gli anni preimpostati sono già passati.\noff = non rimandare; comportamento del gioco base\nalways = applica dal primo giorno di gioco\nUn anno = sblocca in quell'anno
easystart.group.diagnostics = Risoluzione dei problemi
easystart.enabled.label = Plugin abilitato
easystart.enabled.description = ON sblocca bisogni e requisiti dei servizi secondo il calendario configurato.
easystart.demands.label = Rimanda i nove bisogni dei cittadini
easystart.demands.description = ON rimanda cibo, carne, vestiti, elettronica, alcol, religione, cultura, sport e salute fino agli anni di sblocco configurati.
easystart.utilities.label = Rimanda i tre servizi richiesti dagli edifici
easystart.utilities.description = ON rimanda i requisiti di elettricità, acqua e riscaldamento fino agli anni di sblocco configurati.
easystart.warnings.label = Rimanda gli avvisi nella finestra dell'edificio
easystart.warnings.description = ON nasconde gli avvisi relativi fino all'anno di sblocco, ad esempio «edificio senza alimentazione elettrica».
easystart.pin_status.label = Mantieni la soddisfazione dei bisogni bloccati
easystart.pin_status.description = ON mantiene la soddisfazione di un bisogno bloccato al valore indicato sotto.\nOFF lascia che continui a diminuire; potrebbe essere già molto bassa allo sblocco del bisogno.
easystart.locked_status.label = Soddisfazione durante il blocco
easystart.locked_status.description = Soddisfazione mentre un bisogno è bloccato. Per il cibo, il valore indica la sazietà.\n1.0 = completamente soddisfatto o sazio\n0.5 = valore medio con un miglioramento evidente dopo lo sblocco
easystart.clear_unsatisfied.label = Escludi i bisogni bloccati dall'elenco degli insoddisfatti
easystart.clear_unsatisfied.description = ON impedisce ai bisogni bloccati di generare il messaggio «N cittadini non hanno potuto ottenere X».
easystart.probe.label = Registra gli sblocchi nel log
easystart.probe.description = ON scrive i bisogni che restano bloccati a ogni cambio d'anno in tesmioloader.log. Registra anche una volta il primo cittadino interessato. Solo per la risoluzione dei problemi.
easystart.food.label = Cibo
easystart.religion.label = Religione
easystart.meat.label = Carne
easystart.clothes.label = Vestiti
easystart.alcohol.label = Alcol
easystart.sport.label = Sport
easystart.culture.label = Cultura
easystart.health.label = Salute
easystart.electricity.label = Elettricità
easystart.water.label = Acqua (include le acque reflue)
easystart.heating.label = Riscaldamento
easystart.electronics.label = Elettronica
easystart.school.label = Scuola
easystart.school.description = Prima di quest'anno i bambini imparano senza scuola, come nell'impostazione «Semplice» dell'istruzione del gioco, e il messaggio «N bambini non possono andare a scuola» non compare.
easystart.kindergarten.label = Asilo
easystart.kindergarten.description = Prima di quest'anno nessun genitore deve restare a casa per un bambino sotto i sei anni e il messaggio «N lavoratori non possono lavorare perché tutti gli asili …» non compare.
plugin.needs = Needs
plugin.needs.description = Gestisci i bisogni aggiuntivi dei cittadini e le opzioni del plugin senza modificare il file originale.
tab.needs.editor = Bisogni
group.needs = Bisogni dei cittadini
group.needs.plugin = Impostazioni del plugin
group.needs.plugin.description = Opzioni che si applicano a tutti i bisogni.
needs.list = Elenco dei bisogni
needs.add = Aggiungi bisogno
needs.select_help = Seleziona un bisogno a sinistra oppure usa + per aggiungere una risorsa registrata da Resources.
needs.resource = Risorsa
needs.resource.help = La risorsa che i cittadini dovranno desiderare. Deve essere registrata nell'elenco del plugin Resources.
needs.donor = Bisogno modello
needs.donor.description = Bisogno esistente usato come modello.\nfood o meat = per i negozi di alimentari\nclothes o eletronics = per i grandi magazzini\nalcohol = per i negozi di alcolici\neletronics è la grafia usata dal gioco.
needs.factor = Fattore di quantità
needs.factor.description = Quantità di merce rispetto al bisogno modello.\n1.0 = stessa quantità del modello\nValore più alto = i cittadini hanno bisogno di più merce\nValore più basso = i cittadini hanno bisogno di meno merce
needs.category = Categoria di negozi
needs.category.description = Negozi che tengono la merce in magazzino.\nauto = gli stessi negozi del bisogno modello\nnone = nessuno spazio automatico; l'edificio deve fornire la merce autonomamente\nbasic = solo negozi di base\nmedium = solo negozi medi\nadvanced = solo negozi grandi\nmediumadvanced = solo negozi medi e grandi\nhotel = solo hotel\nUn numero = scrivi direttamente questo valore di negozio; solo per utenti che conoscono i file del gioco
needs.chance = Probabilità
needs.chance.description = Probabilità da 0 a 1 che un cittadino riceva questo bisogno. Sotto 1 viene assegnato indipendentemente dal bisogno modello.\n0 = nessun cittadino lo riceve\n1 = ogni cittadino idoneo lo riceve
needs.unhappy = Insoddisfazione
needs.unhappy.description = Soddisfazione persa quando un cittadino non può ottenere la merce.\n0 = nessuna perdita; il bisogno viene solo mostrato\nDa 0.005 a 0.02 = intervallo tipico per un bene di comfort\nIntervallo consentito: da 0 a 1
needs.enabled = Plugin abilitato
needs.enabled.description = ON abilita il plugin.\nOFF lo disabilita completamente al prossimo avvio del gioco.
needs.demand = Assegna bisogni
needs.demand.description = ON assegna ai cittadini il nuovo bisogno.\nOFF non assegna il bisogno, ma può comunque aggiungere la merce ai negozi.
needs.storage = Rifornisci i negozi
needs.storage.description = ON aggiunge la merce ai negozi selezionati.\nOFF non aggiunge spazi di stoccaggio; i cittadini possono quindi trovare la merce solo negli edifici che la forniscono autonomamente.
needs.max_demands = Bisogni per cittadino
needs.max_demands.description = Numero massimo di bisogni aggiuntivi che un cittadino può avere contemporaneamente.\n1 = al massimo un bisogno aggiuntivo\n7 = numero massimo consentito
needs.when_full = Quando viene raggiunto il limite di bisogni
needs.when_full.description = Cosa succede quando un cittadino ha già il numero massimo di bisogni aggiuntivi.\nskip = attendi che si liberi uno spazio\nreplace = sostituisci il bisogno modello questa volta
needs.probe = Log dettagliato
needs.probe.description = ON scrive gli elenchi dei bisogni dei cittadini e le informazioni su ogni negozio nel log dettagliato del plugin.\nOFF scrive solo gli avvisi. Attiva temporaneamente durante la verifica di nuovi negozi.
needs.log_seconds = Intervallo dei messaggi di avanzamento (secondi)
needs.log_seconds.description = Secondi tra i messaggi che indicano quanti bisogni sono stati assegnati.\n0 = disabilita questi messaggi\nValore più alto = registrazione meno frequente
tab.needs.general = Generale
plugin.deposits = Deposits
plugin.deposits.description = Gestisci i tipi di giacimenti assenti dal gioco base e le opzioni del plugin senza modificare il file originale.
tab.deposits.general = Generale
tab.deposits.editor = Giacimenti
group.deposits = Giacimenti
group.deposits.description = I giacimenti originali sono protetti e possono essere nascosti; quelli personalizzati sono memorizzati separatamente e uniti nel file deposits.ini effettivamente usato. Ogni sezione tranne [deposits] rappresenta un giacimento.
group.deposits.plugin = Impostazioni del plugin
group.deposits.plugin.description = I tre sottosistemi della sezione [deposits]. Ciascuno è disattivato per tutti i giacimenti quando la relativa opzione qui è disattivata.
deposits.notice = Il numero di tipo di un giacimento, il suo canale della mappa e il token in building.ini diventano parte del salvataggio non appena una miniera li usa. Rimuovere o rinumerare un giacimento usato da un salvataggio può renderlo inutilizzabile; prova prima su una copia.
deposits.list = Elenco dei giacimenti
deposits.add = Aggiungi giacimento
deposits.select_help = Seleziona un giacimento a sinistra oppure usa + per aggiungerne uno per una risorsa registrata da Resources.
deposits.name = Giacimento
deposits.name.help = Il nome della sezione in deposits.ini. Identifica il giacimento nel log e nel pennello dell'editor; non può essere rinominato in seguito.
deposits.new_name = Nome del giacimento
deposits.new_hint = Qui vengono richieste solo le impostazioni standard. Tutto il resto (componente, tipo di edificio, esaurimento) si trova nelle impostazioni a destra dopo l'aggiunta.
deposits.code_patch = Modifica del codice
deposits.code_patch.description = ON inserisce nel gioco i tipi di giacimenti $TYPE_MINE_ configurati, così le miniere possono trovarli tramite building.ini. Se dopo un aggiornamento i dati previsti del gioco non corrispondono più, il plugin non modifica nulla.
deposits.minimap_all = Livelli della minimappa
deposits.minimap_all.description = ON mostra un pulsante sotto i cinque pulsanti della minimappa del gioco per ogni giacimento del plugin abilitato individualmente.\nOFF nasconde tutti i pulsanti dei giacimenti del plugin.
deposits.editor_all = Pennelli dell'editor del terreno
deposits.editor_all.description = ON mostra un pennello per dipingere e uno per cancellare nella scheda Risorse dell'editor del terreno per ogni giacimento con un nome di pennello.\nOFF nasconde tutti i pennelli dei giacimenti del plugin.
deposits.token = Token dell'edificio
deposits.token.description = Token usato da una miniera in building.ini per questo giacimento, ad esempio $TYPE_MINE_COPPER. Inseriscilo come $TYPE_MINE_GRAVEL. Non usare mai due token di giacimento nello stesso building.ini.
deposits.type = Numero di tipo
deposits.type.description = Numero di tipo univoco del giacimento. Due giacimenti non devono usare lo stesso numero.\nDa 10 a 127 = intervallo consentito\nDa 0 a 9 = riservati al gioco base\nLa finestra di dialogo propone automaticamente il prossimo numero libero.
deposits.map = Mappa
deposits.map.description = Mappa su cui è memorizzato il giacimento.\nauto = scegli automaticamente uno spazio libero su una mappa del plugin; consigliato\nresourcemap o resourcemap2 = usa le mappe del gioco base\nDa resourcemap3 a resourcemap10 = usa le mappe aggiuntive del plugin\nterrain = usa direttamente il terreno dipinto, ad esempio per la ghiaia; il suo pennello appare sotto ROCKS
deposits.component = Componente
deposits.component.description = Ogni mappa ha quattro spazi da 0 a 3. Ogni spazio può contenere un giacimento.\nCon auto = lascia il campo vuoto; il plugin sceglie uno spazio libero\nCon terrain: 2 = livello della ghiaia\nCon terrain: 3 = livello dell'oasi
deposits.building_type = Tipo di edificio
deposits.building_type.description = Tipo di edificio che può estrarre questo giacimento.\n7 = miniera; corretto per quasi tutti i giacimenti\n92 = pozzo d'acqua\nCampo vuoto = 7
deposits.radius = Raggio di ricerca
deposits.radius.description = Quanto lontano una miniera cerca il proprio giacimento.\noil, ore, bauxite, gravel, wood, water, watersurface = usa la costante corrispondente del gioco\nUn numero = usa direttamente questa distanza\nCampo vuoto = usa ore\nSenza raggio, la miniera non trova alcun giacimento.
deposits.icon = Icona della minimappa
deposits.icon.description = Risorsa la cui icona compare sul pulsante della minimappa. Il plugin usa l'icona già caricata dal gioco; non serve un'immagine separata.\nLe risorse del plugin Resources devono essere registrate al suo interno.\nCampo vuoto = nessuna icona
deposits.minimap = Pulsante della minimappa
deposits.minimap.description = ON aggiunge un pulsante della minimappa e un livello di sovrapposizione per questo giacimento.
deposits.editor = Nome del pennello dell'editor
deposits.editor.description = Nome dei pennelli per dipingere e cancellare nell'editor del terreno. Lo stesso nome viene usato per tool_paint_<name>.png e tool_erase_<name>.png in vfs\media_soviet\editor.\nCampo vuoto = non creare alcun pennello\nConsentiti: fino a 31 lettere, cifre, _ e -
deposits.deplete = Esaurimento per texel
deposits.deplete.description = Questa impostazione viene letta dal plugin Depletion. Definisce le tonnellate che una miniera può estrarre da un punto completamente pieno della mappa delle risorse. I punti meno ricchi rendono proporzionalmente meno.\nIl valore sostituisce tonnes_per_texel in plugins\depletion.ini.\n0 = questo giacimento rimane infinito\nCampo vuoto = usa il valore globale
deposits.save_warning = Le modifiche vengono scritte nel file deposits.ini effettivamente usato solo al salvataggio. Numeri di tipo, canali della mappa e token dei giacimenti già usati da un salvataggio non devono cambiare; prova prima su una copia.
depletion.tab.general = Generale
depletion.tab.mining = Estrazione
needs.save_warning = Le modifiche vengono scritte nel file needs.ini effettivamente usato solo quando salvi. Ogni bisogno aggiunge uno spazio di stoccaggio ai negozi interessati, e questo spazio fa parte del salvataggio. Prova prima su una copia.
bp.name = Buildings Plus
bp.description = Nuovi edifici a partire da una definizione: un edificio modello del gioco più le righe di building.ini che differiscono. Vengono scritti come elementi completi del Workshop a ogni avvio del gioco.
bp.notice = Ogni edificio diventa una cartella in media_soviet\workshop_wip con un proprio ID Workshop. Lascia l'ID vuoto: all'avvio del gioco il plugin assegna il prossimo numero libero a partire da 9300000000 e lo conserva in plugins\buildings_plus.ids.ini. Il gioco legge la cartella come un elemento del Workshop non pubblicato. Le modifiche richiedono un riavvio completo. Un salvataggio che contiene un edificio di questo tipo ha bisogno della cartella al caricamento.
bp.tab.general = Generale
bp.tab.buildings = Edifici
bp.tab.generated = Edifici generati
bp.wip = Edifici generati nella cartella del gioco
bp.wip.description = Mostra gli edifici generati da Buildings Plus o dal plugin buildings originale in media_soviet\workshop_wip. Ciò che vedi qui viene letto dalle cartelle.
bp.wip.empty = Qui non c'è ancora alcun edificio generato. Gli edifici vengono generati all'avvio del gioco quando almeno uno è abilitato.
bp.group = Edifici
bp.group.notice = Un edificio qui è una copia di un edificio del gioco con righe diverse: stesso modello, stessi collegamenti, la tua ricetta. Scegli un edificio modello dello stesso tipo (miniera per miniera, fabbrica per fabbrica).
bp.list = Edifici
bp.add = Aggiungi
bp.select_help = Seleziona un edificio a sinistra oppure usa + per aggiungerne uno. Prima viene richiesto l'edificio modello, l'ID Workshop può restare vuoto; nome e righe seguono a destra.
bp.id = Nome dell'oggetto
bp.id.help = Definisce il nome della cartella e dell'oggetto dell'edificio generato e compare nel log. Solo lettere, cifre, _ e -, al massimo 64 caratteri; non può essere modificato in seguito.
bp.save_warning = Le modifiche vengono scritte nel file buildings_plus.ini effettivamente usato solo al salvataggio e hanno effetto dopo un riavvio completo del gioco. Il plugin scrive quindi la cartella in media_soviet\workshop_wip; una sezione con un errore viene ignorata e indicata nel log.
bp.list.note = Al massimo 256 edifici.
bp.new_name = Nome dell'oggetto
bp.new_hint = Gli spazi diventano trattini bassi e le maiuscole diventano minuscole.
bp.card.folders = Cartelle generate
bp.card.log = Risoluzione dei problemi
bp.card.new = Nuovo edificio
bp.links = Guide
bp.link.readme = README (guida)
bp.prune = Pulisci le cartelle
bp.prune.description = ON rimuove al prossimo avvio del gioco la cartella generata di un edificio eliminato o disattivato (solo cartelle scritte da questo plugin).\nOFF lascia queste cartelle al loro posto; il gioco continua a caricare gli edifici.
bp.always = Riscrivi sempre
bp.always.description = ON scrive ogni cartella di edificio a ogni avvio del gioco.\nOFF scrive una cartella solo se la sua sezione, il plugin o un file dell'edificio modello sono cambiati. Lascia su OFF.
bp.verbose = Log dettagliato
bp.verbose.description = ON scrive ogni file copiato e ogni riga rimossa dall'edificio modello in logs\tesmioloader.buildings_plus.log.\nOFF scrive solo risultati, avvisi ed errori.
bp.repair_owner_ids = Completa l'ID del proprietario
bp.repair_owner_ids.description = ON inserisce il tuo ID Steam negli edifici generati che ne sono privi, inclusi quelli di un altro generatore. Senza di esso il gioco chiede informazioni sugli elementi del Workshop mancanti ogni volta che carichi un salvataggio che usa un edificio di questo tipo.\nOFF lascia intatte le cartelle degli altri generatori.
bp.card.saves = Salvataggi
bp.card.saves.description = Un salvataggio ricorda gli stoccaggi di ogni edificio già costruito. Questa opzione permette di applicare una nuova riga di stoccaggio di un tuo edificio anche agli esemplari già costruiti.
bp.retrofit = Mantieni aggiornati gli stoccaggi degli edifici già costruiti
bp.retrofit.description = ON: quando carichi un salvataggio, ogni edificio generato completato riceve, vuoti, gli stoccaggi per singola risorsa aggiunti alla sua sezione. Se modifichi la capacità in una riga di stoccaggio, cambia anche lo stoccaggio; una riduzione attende che la merce possa rientrare nella nuova capacità. Uno stoccaggio di cui hai rimosso la riga scompare dagli edifici non appena è vuoto.\nOFF: gli stoccaggi degli edifici già costruiti rimangono invariati; le righe nuove e modificate si applicano solo agli edifici costruiti in seguito.
bp.enabled = Edificio abilitato
bp.enabled.description = ON genera questo edificio al prossimo avvio del gioco.\nOFF non lo genera. Con «Pulisci le cartelle» abilitato, la cartella esistente viene rimossa al prossimo avvio.
bp.item_id = ID Workshop
bp.item_id.description = È possibile usare un numero personalizzato: da 9000000000 a 9999999999, esclusi da 9100000000 a 9199999999 (riservati ad altri generatori)\nDefinisce il nome della cartella in workshop_wip nella cartella del gioco e non dovrebbe essere modificato in seguito.
bp.donor = Edificio modello
bp.donor.description = L'edificio da cui parte la copia; per un edificio del Workshop devi essere iscritto.\nUsa «Scegli modello...» per sfogliare gli edifici disponibili. Rispetta il tipo: miniera per miniera, fabbrica per fabbrica, negozio per negozio.
bp.item_name = Nome nel gioco
bp.item_name.description = Il nome mostrato nel gioco.\nUn valore con punti viene considerato una chiave di traduzione e risolto tramite il plugin Localization, ad esempio: localization.lang.salt_mine
bp.desc = Descrizione
bp.desc.description = La descrizione dell'elemento del Workshop, una riga per riga del campo. Senza virgolette.
bp.line = Righe di building.ini
bp.line.description = Una riga di building.ini per riga del campo, ad esempio $PRODUCTION raw_salt 1.0. Usa «Scegli riga…» per prendere una riga dall'edificio modello e modificarla. Le tue righe precedono quelle del modello e sostituiscono: lo stesso token; tutti i $TYPE_*; tutti i $STORAGE* insieme a $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION e $CONSUMPTION_PER_SECOND come un'unica ricetta. Tutto il resto del modello rimane.\nPer le tue risorse usa sempre $STORAGE_IMPORT_SPECIAL o $STORAGE_EXPORT_SPECIAL indicando la risorsa, altrimenti lo stoccaggio elenca tutte le risorse della classe di trasporto.
bp.strip = Rimuovi righe del modello
bp.cmd_add = Aggiungi in coda
bp.cmd_add.description = Un comando per riga: una nuova riga inserita prima della chiusura finale del file del modello. Un blocco di più righe si scrive con | tra le righe.
bp.cmd_replace = Sostituisci
bp.cmd_replace.description = Un comando per riga: vecchia riga | nuova riga. La vecchia riga deve comparire esattamente una volta nel file del modello.
bp.cmd_remove = Rimuovi
bp.cmd_remove.description = Un comando per riga: la riga del file del modello da rimuovere. Vengono rimosse anche le righe associate (punti, posizione).
bp.cmd_insert = Inserisci
bp.cmd_insert.description = Un comando per riga: 0 o 1 | riga di riferimento | nuova riga. 0 inserisce la nuova riga prima del riferimento, 1 dopo.
bp.strip.description = Un $TOKEN per riga, ad esempio $WORKERS_NEEDED. Ogni riga del modello con quel token viene eliminata senza sostituzione.
bp.life = Resistenza
bp.life.description = Vuoto = 3000\nLIFE in renderconfig.ini: quanto può sopportare l'edificio prima di crollare. Come la maggior parte degli edifici del gioco.
bp.card.lines = Righe
bp.item_id.empty = il plugin assegna il prossimo numero libero a partire da 9300000000 all'avvio del gioco.
bp.item_name.empty = il nome dell'oggetto; sconsigliato.
needs_plus.card.log = Risoluzione dei problemi
resources_plus.card.log = Risoluzione dei problemi
resources_plus.card.plugin = Plugin
resources_plus.custom_report = Registra i record clonati
resources_plus.custom_report.description = ON scrive per ogni risorsa con un modello ciò che il clone ha effettivamente ereditato (classe di trasporto, fattori, flag). Le risorse senza modello vengono sempre elencate.\nOFF elenca solo quelle senza modello.
resources_plus.customs_hook = Aggiorna le dogane
resources_plus.customs_hook.description = ON aggiunge le nuove risorse all'elenco commerciale delle dogane già esistenti.\nOFF corrisponde al gioco base: una dogana commercia solo ciò che conosceva al momento della costruzione; in quel caso aiutano solo la demolizione e la ricostruzione.
resources_plus.customs_probe = Registra le voci delle dogane
resources_plus.customs_probe.description = ON scrive una riga per ogni risorsa aggiunta a una dogana in tesmioloader.log. Imposta su OFF quando le dogane mostrano ciò che ti aspetti.
resources_plus.price_hook = Applica i prezzi del file INI
resources_plus.price_hook.description = ON rende operativi [base_price] e [price]: i prezzi base vengono impostati prima del calcolo dei prezzi del gioco, quelli fissi dopo.\nOFF lascia i prezzi al gioco.
resources_plus.price_report = Registra la tabella dei prezzi
resources_plus.price_report.description = ON scrive prezzo, prezzo base e categoria di prezzo di ogni risorsa dell'elenco in tesmioloader.log dopo ogni calcolo dei prezzi del gioco. Un prezzo di 0.00 significa che nessun edificio la produce.\nOFF non scrive nulla.
tab.resources_plus.general = Generale
resources.heading.basics = Trasporto e categoria di prezzo
resources.heading.cargo = Carico e materiale
resources.heading.fixed = Prezzi fissi
resources.heading.market = Valori di mercato
resources.heading.prices = Prezzi nel record

resources_plus.heading.names = Nomi per lingua del gioco
detail.name_language.description = Nome di questa risorsa quando il gioco usa questa lingua. Vuoto: viene mostrato il nome visualizzato indicato sopra. L'inglese non richiede un campo: il nome visualizzato è il nome inglese.
detail.name_german = Tedesco
detail.name_bulgarian = Bulgaro
detail.name_chinese = Cinese (semplificato)
detail.name_chinesetraditional = Cinese (tradizionale)
detail.name_czech = Ceco
detail.name_french = Francese
detail.name_hungarian = Ungherese
detail.name_italian = Italiano
detail.name_japanese = Giapponese
detail.name_korean = Coreano
detail.name_polish = Polacco
detail.name_portuguesebrazil = Portoghese (Brasile)
detail.name_romanian = Rumeno
detail.name_russian = Russo
detail.name_serbian = Serbo
detail.name_slovak = Slovacco
detail.name_spanish = Spagnolo
detail.name_turkish = Turco
detail.name_ukrainian = Ucraino
