resources_plus.custom_report = Klónozott adatrekordok naplózása
resources_plus.custom_report.description = ON minden mintával rendelkező erőforrásnál kiírja, mit örökölt ténylegesen a klón (szállítási osztály, szorzók, jelzők). A minta nélküli erőforrásokat mindig felsorolja.\nOFF csak a minta nélkülieket sorolja fel.
resources_plus.customs_hook = Vámhivatalok frissítése
resources_plus.customs_hook.description = ON hozzáadja az új erőforrásokat a már meglévő vámhivatalok kereskedelmi listájához.\nOFF az alapjáték működése: egy vámhivatal csak az építésekor ismert erőforrásokkal kereskedik; ilyenkor csak a lebontás és az újraépítés segít.
resources_plus.customs_probe = Vámhivatali bejegyzések naplózása
resources_plus.customs_probe.description = ON minden vámhivatalhoz hozzáadott erőforrásról egy sort ír a tesmioloader.log fájlba. Kapcsolja OFF állásba, amint a vámhivatalok a várt erőforrásokat mutatják.
resources_plus.price_hook = Az INI fájl árainak alkalmazása
resources_plus.price_hook.description = ON működésbe hozza a [base_price] és [price] szakaszt: az alapárakat a játék árszámítása előtt, a rögzített árakat utána állítja be.\nOFF a játékra bízza az árakat.
resources_plus.price_report = Ártáblázat naplózása
resources_plus.price_report.description = ON a játék minden árszámítása után a tesmioloader.log fájlba írja a listán lévő összes erőforrás árát, alapárát és árkategóriáját. A 0.00 ár azt jelenti, hogy egyetlen épület sem termeli.\nOFF nem ír semmit.
