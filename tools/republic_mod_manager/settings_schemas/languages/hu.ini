[language]
name = Magyar

[strings]
plugin.resources = Resources
plugin.resources.description = Erőforrások, tulajdonságok és választható egyéni árak kezelése.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Saját erőforrások a Resources Plus segítségével: ugyanaz a lista, mint az eredetiben, a plugins\resources_plus.ini fájlban, kilépéskori összeomlás nélkül.
resources_plus.save_warning = A módosítások mentéskor kerülnek a plugins\resources_plus.ini fájlba. Egy mentett játék által már használt erőforrás eltávolítása károsíthatja a mentést.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Saját lakossági szükségletek a Needs Plus segítségével: ugyanaz a lista, mint az eredetiben, a plugins mappában lévő needs_plus.ini fájlban, az első indításkor átvéve a needs.ini fájlból.
needs_plus.save_warning = A módosítások csak mentéskor kerülnek a plugins mappában lévő needs_plus.ini fájlba. Minden szükséglet egy tárolóhelyet ad az érintett üzletekhez, amely a mentett játék részévé válik. Először egy másolaton tesztelje.
tab.resources.editor = Erőforrások
group.resource_definitions = Erőforrás-definíciók
detail.transport = Szállítási osztály
detail.transport.description = Meghatározza, mely járművek és tárolók szállíthatják, illetve tárolhatják az erőforrást. Elég kiválasztani egy nevet; a bővítmény hozzáadja az alapjáték adott osztályhoz tartozó értékeit.
detail.kind = Árkategória
detail.kind.description = 0 nyersanyag, 1 feldolgozott termék, 2 élelmiszer/ruházat, 3 fejlett anyag, 4 elektronika.
detail.record_price = Kezdeti ár az adatrekordban
detail.record_price.description = Választható kezdeti RUB- és USD-értékek az erőforrás adatrekordjában.
detail.record_base_price = Kezdeti alapár az adatrekordban
detail.record_base_price.description = Választható RUB- és USD-alapértékek az erőforrás adatrekordjában.
detail.trade_mult = Kereskedelmi szorzók
detail.trade_mult.description = Eladási és vételi szorzók, általában 0.95 és 1.05.
detail.market_rub = RUB-piaci blokk
detail.market_usd = USD-piaci blokk
detail.market.description = Két piaci érték és egy választható együttható.\n(Lásd az INI fájl leírását)
detail.packed = Csomagolt rakomány
detail.packed.description = A rakomány automatikus, csomagolatlan vagy csomagolt megjelenítése.
detail.family = Anyagcsoport
detail.family.description = Meghatározza, hogyan néz ki az anyag az építkezésen felhalmozva, és valószínűleg azt is, milyen hulladékká válik. Minden csoport egy hulladék-erőforrást tartalmaz. Az INI fájl 10 és 19 közötti számai név szerint jelennek meg.
detail.cargo = Rakománygeometria
detail.cargo.description = A rakomány megjelenítéséhez használt geometria kiválasztása.
detail.pinned_base_price = Rögzített alapár
detail.pinned_base_price.description = Választható RUB- és USD-érték a [base_price] szakaszban. Üresen hagyva nincs egyéni bejegyzés.
detail.forced_price = Kényszerített végső ár
detail.forced_price.description = Választható RUB- és USD-érték a [price] szakaszban. Üresen hagyva a játék számítja ki az árat.

; --- Helyi sémák a telepített eredeti bővítményekhez (0.13.0 óta) ---
daynight.description = Naptári naponként egy napkelte és egy napnyugta. Az alapjátékban a nappalból éjszakába, majd vissza történő váltás 13 naptári napig, majdnem két hétig tart. Ezzel a bővítménnyel egy napba belefér.
daynight.group.cycle = Nappal és éjszaka
daynight.group.cycle.description = A nappal-éjszaka ciklus hossza és az éjszaka kezdetének időpontja.
daynight.group.pace = Sebesség
daynight.group.pace.description = Két külön beállítás: egy a járművekhez, egy minden máshoz. Mindig érvényesülnek, a fenti beállításoktól függetlenül.
daynight.group.diagnostics = Hibaelhárítás
daynight.enabled.label = Bővítmény engedélyezve
daynight.enabled.description = ON engedélyezi a beállított nappal-éjszaka ciklust.
daynight.cycle_days.label = Naptári napok száma nappal-éjszaka ciklusonként
daynight.cycle_days.description = Az egyik napkeltétől a következőig eltelt naptári napok száma.\n1 = minden nap egy napkelte és egy napnyugta\n2 és 12 között = arányosan hosszabb ciklus\n13 = az alapjáték ciklusa
daynight.day_scale.label = Naphossz (a naptár lassításának szorzója)
daynight.day_scale.description = Hányszor tart tovább egy naptári nap az alapjátékhoz képest.\nauto = a naptár automatikus lassítása a fényciklushoz igazítva; ajánlott\n1 = a naptár nem lassul; a nappal és az éjszaka így 13-szor gyorsabban váltakozik\n2 és 100 között = a naptár lassítása ezzel a szorzóval\nA „Lassítandó elemek” alatt válassza ki, a játék mely részei lassuljanak.
daynight.slow.label = Lassítandó elemek
daynight.slow.description = Meghatározza, a játék mely részei lassulnak.\ncalendar = csak a naptár lassítása; ajánlott\nworld = minden lassítása, a lakosokat és a járműveket is beleértve; nagy értékeknél lassított felvételhez hasonlít\nnone = semmi sem lassul\nA calendar beállítással a lakosok, a járművek, az építkezés és a termelés megtartják normál sebességüket. A napi folyamatok, például a szennyezés, a kölcsönök és az üzenetek a megszokott időközöket követik.
daynight.offset.label = Az éjszaka kezdete
daynight.offset.description = Eltolja az éjszakát a naptári napon belül.\n0 = a sötétedés valamivel a nap közepe után kezdődik\n0.5 = a sötétedés a dátumváltáskor kezdődik\nA 0 értéktől eltérő beállításnál a 13 napos ciklus már nem egyezik pontosan az alapjátékéval.
daynight.fade.label = Fényátmenetek igazítása
daynight.fade.description = ON lerövidíti a reggel, nappal, este és éjszaka közötti átmeneteket a beállított ciklushoz igazítva.\nOFF az alapjáték lassú átmeneteit használja. Rövid ciklusoknál ezek átfedhetik egymást, és fakóvá tehetik a megvilágítást.
daynight.vehicle_scale.label = Járművek sebessége
daynight.vehicle_scale.description = Teherautók, vonatok, hajók és repülőgépek sebessége. A többi beállítástól függetlenül működik.\n1 = az alapjáték sebessége\n2 = fele sebesség\n0.5 = kétszeres sebesség\nNagyobb érték = lassabb járművek
daynight.sim_scale.label = Minden más sebessége
daynight.sim_scale.description = A lakosok, az építkezés, a termelés, az elhasználódás és az animációk sebessége.\n1 = az alapjáték sebessége\n2 = fele sebesség\n0.5 = kétszeres sebesség\nNagyobb érték = lassabb szimuláció
daynight.probe.label = Naphosszak naplózása
daynight.probe.description = ON minden naptári nap és fényátmenet tényleges időtartamát beírja a tesmioloader.log fájlba. Csak hibaelhárításhoz és játékfrissítés utáni ellenőrzéshez használja.
walking.description = Milyen messzire gyalogolnak a lakosok, illetve milyen messzire autóznak az autótulajdonosok az otthonuk, munkahelyük és a parkoló között.
walking.group.distances = Távolságok
walking.group.distances.description = Az utak és gyalogutak mentén mérve, nem légvonalban. Egy, a folyó túlpartján 400 m-re lévő épülethez akár 1200 m-t is kell gyalogolni.
walking.group.diagnostics = Hibaelhárítás
walking.enabled.label = Bővítmény engedélyezve
walking.enabled.description = ON engedélyezi a beállított gyaloglási és autózási távolságokat.
walking.distance.label = Gyaloglási távolság (m)
walking.distance.description = A leghosszabb útvonal, amelyet egy lakos gyalog megtesz. Az alapjáték 480 m-t használ.\nNagyobb érték = több épület érhető el gyalog, és építéskor több kapcsolat jön létre\n0 = nincs korlát; nagyvárosban az építés ilyenkor több másodpercig is tarthat\n20000 = a legnagyobb elfogadott érték
walking.car_distance.label = Autótulajdonosok autózási távolsága (m)
walking.car_distance.description = A leghosszabb megengedett autóút az otthon, a munkahely és a parkoló között. Az alapjáték 2500 m-t használ.\nNagyobb érték = az autótulajdonosok messzebbre utaznak\nÁllítsa a gyaloglási távolságnál nagyobbra. Azonos értékeknél az autó nem biztosít nagyobb elérési távolságot.
walking.regen_on_load.label = Kapcsolatok újraépítése mentett játék betöltésekor
walking.regen_on_load.description = A gyalogos- és parkolási kapcsolatok a mentett játékban tárolódnak.\nON betöltéskor minden kapcsolatot újraépít, így a beállított távolságok a meglévő városokra is hatnak.\nOFF csak az újonnan épített épületekre alkalmazza a beállított távolságokat.
walking.probe.label = Ellenőrző értékek naplózása
walking.probe.description = ON a tesmioloader.log fájlba írja a játékban talált értékeket, mielőtt a bővítmény módosítaná őket. Csak hibaelhárításhoz és játékfrissítés utáni ellenőrzéshez használja.
accumulator.description = Akkumulátorok az elektromos hálózathoz. A nagy energiatárolóval rendelkező épület áramfelesleg esetén töltődik, áramhiány esetén pedig visszatáplál.
accumulator.group.battery = Akkumulátor
accumulator.group.battery.description = Mely épületek számítanak akkumulátornak, és milyen gyorsan töltődnek és merülnek.
accumulator.group.window = Épületablak
accumulator.group.grid = Elektromos hálózat
accumulator.group.diagnostics = Hibaelhárítás
accumulator.enabled.label = Bővítmény engedélyezve
accumulator.enabled.description = ON engedélyezi az akkumulátorként működő épületek töltését és kisütését.\nOFF leállítja a kisütést. Az épületek megmaradnak, és továbbra is töltődhetnek.
accumulator.building_types.label = Épülettípusok
accumulator.building_types.description = Akkumulátorként használható épülettípusok. Több számot vesszővel válasszon el.\n19 = transzformátor\n18 = alállomás\nNe használja a 17 értéket: egy erőmű nem tud áramot felvenni, ezért soha nem töltődne fel.
accumulator.min_capacity.label = Az akkumulátornak minősülés minimális kapacitása
accumulator.min_capacity.description = A minimális tárolókapacitás, amelytől egy épület akkumulátornak számít. Ez kizárja a normál alállomások kis tárolóit.\nNagyobb érték = kevesebb épület számít akkumulátornak\nKisebb érték = több épület számít akkumulátornak\nA mellékelt „Stationary Accumulator” kapacitása 5000.
accumulator.charge_rate.label = Töltési sebesség (teljesítmény másodpercenként)
accumulator.charge_rate.description = Az akkumulátor által másodpercenként felvett áram maximális mennyisége. A korlát megakadályozza, hogy egy üres akkumulátor egy egész várostól elvegye az áramot.\nNagyobb érték = gyorsabb töltés és nagyobb hálózati terhelés\nKisebb érték = lassabb töltés és kisebb terhelés\nÖsszehasonlításként: egy szénerőmű 70, egy szélturbina 15 egységet szolgáltat.
accumulator.discharge_rate.label = Kisütési sebesség (teljesítmény másodpercenként)
accumulator.discharge_rate.description = Az akkumulátor által másodpercenként leadott áram maximális mennyisége. Csak akkor táplál a hálózatba, ha abban hiány van.\nNagyobb érték = nagyobb teljesítményhiány áthidalása\nKisebb érték = a tárolt energia tovább tart\nPélda: 60 értéknél egy teljesen feltöltött, 5000 kapacitású akkumulátor valamivel több mint 80 másodpercig helyettesít egy erőművet.
accumulator.panel.label = Töltöttségi sor az akkumulátor ablakában
accumulator.panel.description = ON megjeleníti a töltöttségi szintet az akkumulátor ablakában, például: „Toltottseg: 4210.5 / 5000 (84.2 %)”.
accumulator.panel_caption.label = A sor felirata
accumulator.panel_caption.description = A töltöttségi szint előtti szó. Csak betűket használjon, ékezetek és különleges karakterek nélkül, különben a játék értelmetlen karaktereket jelenít meg.
accumulator.gauges.label = Az ablak kijelzőinek számítása az akkumulátor alapján
accumulator.gauges.description = ON a játék hibás kijelzését az akkumulátor tényleges be- és kimenő áramával helyettesíti.\nOFF a játék normál kijelzését használja. Ez töltés közben 0 teljesítményt és „nincs áramellátás” üzenetet is mutathat.
accumulator.spread_voltage.label = Kísérlet: feszültség továbbadása a szomszédoknak (maradjon kikapcsolva)
accumulator.spread_voltage.description = ON nincs hatással. Ezt a régi funkciót műszakilag felváltotta egy másik megoldás. Hagyja OFF állásban.
accumulator.trace.label = Az első akkumulátor szomszédainak naplózása
accumulator.trace.description = ON naplózza, mennyi áramot kapnak az első akkumulátor melletti épületek. Csak hibaelhárításhoz; ronthatja a teljesítményt.
accumulator.log_seconds.label = Másodpercek az akkumulátor naplósorai között
accumulator.log_seconds.description = Az akkumulátor állapotüzenetei közötti időköz a tesmioloader.log fájlban. Minden üzenet tartalmazza a töltöttséget, a be- és kimenő áramot.\n0 = nincsenek állapotüzenetek\nNagyobb érték = ritkább naplózás
accumulator.probe.label = Másodpercek az épületlisták naplózása között
accumulator.probe.description = Az áramtárolóval rendelkező összes épületet felsoroló listák közötti időköz a tesmioloader.log fájlban. Csak fel nem ismert akkumulátor esetén vagy játékfrissítés után használja.\n0 = ne írja ki ezeket a listákat\nNagyobb érték = ritkább naplózás
cities.description = Minden város mérete és alakja. Az alapjátékban minden város egy 1000 m sugarú kör. Ezzel a bővítménnyel minden város sugarát külön állíthatja be, akár négyzetes alakot is választhat, közvetlenül a város ablakában. Az értékek a mentett játékban tárolódnak.
cities.group.cities = Városok
cities.group.slider = Sugárcsúszka
cities.group.slider.description = A városablak csúszkájának tartománya és a + vagy - gomb egy kattintására történő változás mértéke.
cities.group.layout = Elrendezés a városablakban
cities.group.layout.description = A két új sor helye a városablakban. A számok a játékablak saját mértékegységében megadott pozíciók; az ablak körülbelül 500 egység széles.
cities.group.overlay = Pontrács a talajon
cities.group.diagnostics = Hibaelhárítás
cities.enabled.label = Bővítmény engedélyezve
cities.enabled.description = ON engedélyezi az egyéni városméreteket és -alakokat.
cities.window.label = Sugárcsúszka és alakválasztó jelölőnégyzet a városablakban
cities.window.description = ON megjeleníti a sugárcsúszkát és a négyzetes alak jelölőnégyzetét a városablakban.\nOFF mindkettőt elrejti; a beállított értékek megmaradnak, de többé nem módosíthatók.
cities.adopt.label = Saját város alapítása a város nélkül maradt épületeknek
cities.adopt.description = Egy város zsugorításakor épületek kerülhetnek a határán kívülre, így többé egyik városhoz sem tartoznak.\nON új várost alapít számukra véletlenszerű névvel és a mai dátummal, ahogyan maga a játék is teszi.\nOFF város nélkül hagyja őket; a játék viselkedése ebben az esetben nincs tesztelve.
cities.radius.label = Alapértelmezett sugár (m)
cities.radius.description = Az egyedileg nem beállított városok alapértelmezett sugara. Az érték minden térképre érvényes.\n1000 = az alapjáték sugara\nNagyobb érték = nagyobb városok\nKisebb érték = kisebb városok
cities.square.label = Alapértelmezett négyzetes alak
cities.square.description = ON négyzetessé teszi az egyedileg nem beállított városokat.\nOFF kört használ, mint az alapjáték.
cities.radius_min.label = A csúszka legkisebb sugara (m)
cities.radius_min.description = A csúszka bal szélén lévő érték.
cities.radius_max.label = A csúszka legnagyobb sugara (m)
cities.radius_max.description = A csúszka jobb szélén lévő érték. A csúszka 100 lépésből áll; 200 és 5000 között egy lépés 48 m.
cities.step.label = Százalék gombnyomásonként
cities.step.description = A csúszka tartományának azon százaléka, amennyivel a + vagy - gomb egy kattintása módosítja az értéket. A csúszka húzásakor nem érvényes.\nNagyobb érték = nagyobb változás kattintásonként\nKisebb érték = finomabb változás kattintásonként
cities.label_x.label = Felirat helye
cities.label_x.description = A felirat távolsága az ablak bal szélétől.
cities.widget_x.label = Vezérlőelemek helye
cities.widget_x.description = A csúszka és a jelölőnégyzet távolsága az ablak bal szélétől. A csúszkának körülbelül 225 egységnyi hely kell.
cities.checkbox_dy.label = A jelölőnégyzet sorának mozgatása fel vagy le
cities.checkbox_dy.description = Feljebb vagy lejjebb mozgatja a jelölőnégyzetet, hogy ne fedje a csúszkát.\nNagyobb érték = a jelölőnégyzet lejjebb kerül\nKisebb érték = a jelölőnégyzet feljebb kerül
cities.overlay.label = A fedvény kövesse a sugarat és az alakot
cities.overlay.description = Amíg egy városablak nyitva van, a játék kék pontrácsot jelenít meg a talajon, de mindig csak egy 1000 m sugarú körhöz.\nON a rácsot az Ön által beállított sugárhoz és alakhoz igazítja.\nOFF meghagyja az alapjáték megjelenítését.
cities.overlay_step.label = A fedvényrács pontjainak távolsága (m)
cities.overlay_step.description = A városhatárt jelző pontok közötti távolság.\n0 = automatikusan a sugár egy huszada, de legalább 50 m\nKisebb érték = sűrűbb megjelenítés és nagyobb teljesítményigény
cities.probe.label = Városok naplózása
cities.probe.description = ON betöltés után minden város sugarát, alakját és épületszámát beírja a tesmioloader.log fájlba. Nyitott városablaknál további üzenetek keletkeznek. Csak hibaelhárításhoz; a napló gyorsan megnőhet.
depletion.description = A lelőhelyek kimerülnek. A működő bánya láthatóan kitermeli a lelőhelyet a térképről, és minél kevesebb marad, annál kevesebbet termel. A kitermelés a mentett játékban tárolódik; ha később kikapcsolja a bővítményt, a kitermelt erőforrás nem tér vissza. Először a mentett játék egy másolatán tesztelje.
depletion.group.depletion = Bányászat
depletion.group.window = Bányaablak
depletion.group.diagnostics = Hibaelhárítás
depletion.enabled.label = Bővítmény engedélyezve
depletion.enabled.description = ON lehetővé teszi a kiválasztott lelőhelyek kimerülését a kitermelés során.\nOFF leállítja a további kimerülést. A már eltávolított erőforrások nem állnak helyre.
depletion.tonnes_per_texel.label = Tonna térképpontonként
depletion.tonnes_per_texel.description = Az erőforrástérkép teljesen feltöltött pontjából kitermelhető tonnák száma. A gyengébb pontok arányosan kevesebbet adnak.\nNagyobb érték = a lelőhelyek tovább tartanak\nKisebb érték = a lelőhelyek hamarabb kimerülnek\nÖsszehasonlításként: egy 210 m keresési sugarú bánya több ezer térképpontot fed le.
depletion.vanilla.label = Az alapjáték kimerülő lelőhelyei
depletion.vanilla.description = Az alapjáték azon lelőhelyei, amelyek kimerülhetnek. Több értéket vesszővel válasszon el.\noil, iron, coal, uranium, bauxite, gravel = csak a felsorolt lelőhelyek\nall = minden lelőhely\nnone = az alapjáték egyetlen lelőhelye sem\nname:value = egyéni tonnamennyiség térképpontonként, például iron:3000\nA deposits.ini lelőhelyei mindig érintettek.\ngravel véglegesen eltávolítja a látható talajtextúrát, és a kis keresési terület miatt sokkal nagyobb értéket igényel. Hagyja ki a gravel értéket az alapjáték működésének megtartásához.
depletion.flush_seconds.label = Másodpercek a kitermelés mentései között
depletion.flush_seconds.description = Az erőforrástérkép frissítései közötti másodpercek száma. A termelés és a minőség azonnal változik; csak a minitérkép és a mentett játék követi ezt az időközt.\nKisebb érték = gyakoribb frissítés és nagyobb teljesítményigény\nNe frissítsen másodpercenként négynél többször.
depletion.panel.label = Megmaradt lelőhely sora a bányaablakban
depletion.panel.description = ON megjeleníti a megmaradt készletet a bányaablakban, és kissé megnöveli az ablak magasságát, például: „Maradek: 251.4 kt / 259.3 kt (96.9 %)”.
depletion.panel_caption.label = A sor felirata
depletion.panel_caption.description = A megmaradt mennyiség előtti szó. Csak betűket használjon, ékezetek és különleges karakterek nélkül, különben a játék értelmetlen karaktereket jelenít meg.
depletion.log_seconds.label = Állapotsorok időköze (másodperc)
depletion.log_seconds.description = A bánya állapotüzenetei közötti másodpercek száma a tesmioloader.log fájlban. Minden üzenet tartalmazza a megmaradt mennyiséget, a teljes mennyiséget és a minőséget.\n0 = nincsenek állapotüzenetek\nNagyobb érték = ritkább naplózás\nTöbb játéknapon át figyelje a működést a megfelelő térképpontonkénti tonnamennyiség meghatározásához.
easystart.description = A lakosok szükségletei az évek során fokozatosan jelennek meg. A még fel nem oldott szükséglet nem befolyásolja a boldogságot és az egészséget; a lakosok továbbra is felkeresik az adott helyeket és vásárolnak, de a következmények csak a megadott évtől jelentkeznek.
easystart.group.general = Késleltetett követelmények
easystart.group.unlock = Feloldási évek
easystart.group.unlock.description = Az az év, amelynek január 1. napjától a követelmény érvénybe lép. Az ütemezés egy 1920-ban alapított köztársasághoz készült. 1960-as kezdésnél az előre beállított évek már elmúltak.\noff = nincs késleltetés; az alapjáték működése\nalways = az első játéknaptól érvényes\nÉvszám = feloldás az adott évben
easystart.group.diagnostics = Hibaelhárítás
easystart.enabled.label = Bővítmény engedélyezve
easystart.enabled.description = ON a beállított ütemezés szerint oldja fel a szükségleteket és a közműigényeket.
easystart.demands.label = A kilenc lakossági szükséglet késleltetése
easystart.demands.description = ON az élelmiszer, hús, ruházat, elektronika, alkohol, vallás, kultúra, sport és egészség iránti igényt a beállított feloldási évig késlelteti.
easystart.utilities.label = Az épületek három közműigényének késleltetése
easystart.utilities.description = ON az áram-, víz- és fűtésigényt a beállított feloldási évig késlelteti.
easystart.warnings.label = Az épületablak figyelmeztetéseinek késleltetése
easystart.warnings.description = ON a feloldási évig elrejti a kapcsolódó figyelmeztetéseket, például: „az épületnek nincs áramellátása”.
easystart.pin_status.label = A zárolt szükségletek kielégítettségének rögzítése
easystart.pin_status.description = ON az alábbi értéken tartja a zárolt szükséglet kielégítettségét.\nOFF hagyja tovább csökkenni a kielégítettséget; a szükséglet feloldásakor már nagyon alacsony lehet.
easystart.locked_status.label = Kielégítettség a zárolás alatt
easystart.locked_status.description = A szükséglet kielégítettsége a zárolás alatt. Élelmiszernél az érték a jóllakottságot jelenti.\n1.0 = teljesen elégedett vagy jóllakott\n0.5 = közepes érték, amely feloldás után észrevehetően javulhat
easystart.clear_unsatisfied.label = Zárolt szükségletek kivétele a kielégítetlenek listájából
easystart.clear_unsatisfied.description = ON megakadályozza, hogy a zárolt szükségletek „N lakos nem jutott hozzá ehhez: X” üzenetet váltsanak ki.
easystart.probe.label = Feloldások naplózása
easystart.probe.description = ON minden évváltáskor beírja a zárolva maradt szükségleteket a tesmioloader.log fájlba. Az első érintett lakost is rögzíti egyszer. Csak hibaelhárításhoz.
easystart.food.label = Élelmiszer
easystart.religion.label = Vallás
easystart.meat.label = Hús
easystart.clothes.label = Ruházat
easystart.alcohol.label = Alkohol
easystart.sport.label = Sport
easystart.culture.label = Kultúra
easystart.health.label = Egészség
easystart.electricity.label = Áram
easystart.water.label = Víz (a szennyvizet is magában foglalja)
easystart.heating.label = Fűtés
easystart.electronics.label = Elektronika
easystart.school.label = Iskola
easystart.school.description = Ezt az évet megelőzően a gyermekek iskola nélkül tanulnak, mint a játék „Egyszerű” oktatási beállításánál, és az „N gyermek nem tud iskolába járni” üzenet nem jelenik meg.
easystart.kindergarten.label = Óvoda
easystart.kindergarten.description = Ezt az évet megelőzően egyetlen szülőnek sem kell otthon maradnia hat év alatti gyermek miatt, és az „N dolgozó nem tud dolgozni, mert minden óvoda …” üzenet nem jelenik meg.
plugin.needs = Needs
plugin.needs.description = További lakossági szükségletek és a bővítmény kapcsolóinak kezelése az eredeti fájl szerkesztése nélkül.
tab.needs.editor = Szükségletek
group.needs = Lakossági szükségletek
group.needs.plugin = Bővítménybeállítások
group.needs.plugin.description = Minden szükségletre érvényes kapcsolók.
needs.list = Szükségletek listája
needs.add = Szükséglet hozzáadása
needs.select_help = Válasszon egy szükségletet a bal oldalon, vagy a + gombbal adjon hozzá egy, a Resources által regisztrált erőforrást.
needs.resource = Erőforrás
needs.resource.help = Az erőforrás, amelyre a lakosoknak szükségük lesz. Szerepelnie kell a Resources bővítmény erőforráslistájában.
needs.donor = Mintaként használt szükséglet
needs.donor.description = Mintaként használt meglévő szükséglet.\nfood vagy meat = élelmiszerüzletekhez\nclothes vagy eletronics = áruházakhoz\nalcohol = italboltokhoz\nAz eletronics a játék által használt írásmód.
needs.factor = Mennyiségi szorzó
needs.factor.description = Az áru mennyisége a mintaként használt szükséglethez képest.\n1.0 = ugyanannyi, mint a mintánál\nNagyobb érték = a lakosoknak többre van szükségük\nKisebb érték = a lakosoknak kevesebbre van szükségük
needs.category = Üzletkategória
needs.category.description = Az árut készleten tartó üzletek.\nauto = ugyanazok az üzletek, mint a mintaként használt szükségletnél\nnone = nincs automatikus tárolóhely; az épületnek magának kell biztosítania az árut\nbasic = csak alapüzletek\nmedium = csak közepes üzletek\nadvanced = csak nagy üzletek\nmediumadvanced = csak közepes és nagy üzletek\nhotel = csak szállodák\nSzám = az üzletérték közvetlen megadása; csak a játékfájlokat ismerő felhasználóknak
needs.chance = Valószínűség
needs.chance.description = Annak valószínűsége 0 és 1 között, hogy egy lakos megkapja ezt a szükségletet. 1 alatt a szükséglet kiosztása a mintától függetlenül történik.\n0 = egyetlen lakos sem kapja meg\n1 = minden megfelelő lakos megkapja
needs.unhappy = Elégedetlenség
needs.unhappy.description = Az elveszített elégedettség, ha egy lakos nem jut hozzá az áruhoz.\n0 = nincs veszteség; a szükséglet csak megjelenik\n0.005 és 0.02 között = egy kényelmi áru szokásos tartománya\nMegengedett tartomány: 0 és 1 között
needs.enabled = Bővítmény engedélyezve
needs.enabled.description = ON engedélyezi a bővítményt.\nOFF a játék következő indításakor teljesen letiltja.
needs.demand = Szükségletek kiosztása
needs.demand.description = ON kiosztja az új szükségletet a lakosoknak.\nOFF nem osztja ki a szükségletet, de az árut ettől még hozzáadhatja az üzletekhez.
needs.storage = Üzletek ellátása
needs.storage.description = ON hozzáadja az árut a kiválasztott üzletekhez.\nOFF nem ad hozzá tárolóhelyeket; a lakosok ekkor csak olyan épületekben találhatják meg az árut, amelyek maguk biztosítják azt.
needs.max_demands = Szükségletek lakosonként
needs.max_demands.description = Egy lakos egyidejű további szükségleteinek maximális száma.\n1 = legfeljebb egy további szükséglet\n7 = a legnagyobb megengedett szám
needs.when_full = A szükséglethatár elérésekor
needs.when_full.description = Mi történjen, ha egy lakosnak már a lehető legtöbb további szükséglete van.\nskip = várakozás, amíg felszabadul egy hely\nreplace = ez alkalommal a mintaként használt szükséglet helyettesítése
needs.probe = Részletes napló
needs.probe.description = ON a lakosok szükségletlistáit és minden üzlet adatait a bővítmény részletes naplójába írja.\nOFF csak figyelmeztetéseket ír. Új üzletek ellenőrzésekor ideiglenesen kapcsolja be.
needs.log_seconds = Állapotüzenetek időköze (másodperc)
needs.log_seconds.description = A kiosztott szükségletek számát jelző üzenetek közötti másodpercek száma.\n0 = ezen üzenetek letiltása\nNagyobb érték = ritkább naplózás
tab.needs.general = Általános
plugin.deposits = Deposits
plugin.deposits.description = Az alapjátékból hiányzó lelőhelytípusok és a bővítmény kapcsolóinak kezelése az eredeti fájl szerkesztése nélkül.
tab.deposits.general = Általános
tab.deposits.editor = Lelőhelyek
group.deposits = Lelőhelyek
group.deposits.description = Az eredeti lelőhelyek védettek és elrejthetők; az egyéni lelőhelyek külön tárolódnak, majd a használatba kerülő deposits.ini fájlba egyesülnek. A [deposits] kivételével minden szakasz egy lelőhelyet jelent.
group.deposits.plugin = Bővítménybeállítások
group.deposits.plugin.description = A [deposits] szakasz három alrendszere. Amelyiknek az itteni kapcsolója ki van kapcsolva, az minden lelőhelynél inaktív.
deposits.notice = A lelőhely típusszáma, térképcsatornája és a building.ini fájlban lévő tokenje a mentett játék részévé válik, amint egy bánya használja őket. Egy mentett játékban használt lelőhely eltávolítása vagy átszámozása használhatatlanná teheti a mentést; először egy másolaton tesztelje.
deposits.list = Lelőhelyek listája
deposits.add = Lelőhely hozzáadása
deposits.select_help = Válasszon egy lelőhelyet a bal oldalon, vagy a + gombbal adjon hozzá egyet a Resources által regisztrált erőforráshoz.
deposits.name = Lelőhely
deposits.name.help = A szakasz neve a deposits.ini fájlban. Ez jelöli a lelőhelyet a naplóban és a szerkesztő ecseténél; később nem nevezhető át.
deposits.new_name = Lelőhely neve
deposits.new_hint = Itt csak az alapbeállításokat kell megadni. Minden más (komponens, épülettípus, kimerülés) hozzáadás után a jobb oldali beállításokban található.
deposits.code_patch = Kódmódosítás
deposits.code_patch.description = ON beilleszti a beállított $TYPE_MINE_ lelőhelytípusokat a játékba, hogy a bányák a building.ini fájlon keresztül megtalálják őket. Ha frissítés után a várt játékadatok már nem egyeznek, a bővítmény semmit sem módosít.
deposits.minimap_all = Minitérképrétegek
deposits.minimap_all.description = ON a játék öt minitérképgombja alatt minden egyedileg engedélyezett bővítmény-lelőhelyhez megjelenít egy gombot.\nOFF elrejti a bővítmény összes lelőhelygombját.
deposits.editor_all = Terepszerkesztő ecsetjei
deposits.editor_all.description = ON minden ecsetnévvel rendelkező lelőhelyhez megjelenít egy festő- és egy törlőecsetet a terepszerkesztő Erőforrások lapján.\nOFF elrejti a bővítmény összes lelőhelyecsetjét.
deposits.token = Épülettoken
deposits.token.description = A bánya által a building.ini fájlban ehhez a lelőhelyhez használt token, például $TYPE_MINE_COPPER. A $TYPE_MINE_GRAVEL mintájára adja meg. Soha ne használjon két lelőhelytokent ugyanabban a building.ini fájlban.
deposits.type = Típusszám
deposits.type.description = A lelőhely egyedi típusszáma. Két lelőhely nem használhatja ugyanazt a számot.\n10 és 127 között = megengedett tartomány\n0 és 9 között = az alapjáték számára fenntartva\nA párbeszédablak automatikusan a következő szabad számot ajánlja fel.
deposits.map = Térkép
deposits.map.description = A lelőhelyet tároló térkép.\nauto = szabad hely automatikus kiválasztása egy bővítménytérképen; ajánlott\nresourcemap vagy resourcemap2 = az alapjáték térképeinek használata\nresourcemap3 és resourcemap10 között = a bővítmény további térképeinek használata\nterrain = a festett talaj közvetlen használata, például kavicshoz; az ecsete a ROCKS alatt jelenik meg
deposits.component = Komponens
deposits.component.description = Minden térképnek négy helye van, 0 és 3 között. Minden hely egy lelőhelyet tartalmazhat.\nauto esetén = hagyja üresen a mezőt; a bővítmény szabad helyet választ\nterrain esetén: 2 = kavicsréteg\nterrain esetén: 3 = oázisréteg
deposits.building_type = Épülettípus
deposits.building_type.description = A lelőhely kitermelésére alkalmas épülettípus.\n7 = bánya; szinte minden lelőhelyhez megfelelő\n92 = vízkút\nÜres mező = 7
deposits.radius = Keresési sugár
deposits.radius.description = Milyen távolságban keresi a bánya a lelőhelyét.\noil, ore, bauxite, gravel, wood, water, watersurface = a megfelelő játékállandó használata\nSzám = a megadott távolság közvetlen használata\nÜres mező = az ore használata\nSugár nélkül a bánya nem talál lelőhelyet.
deposits.icon = Minitérképikon
deposits.icon.description = Az erőforrás, amelynek ikonja megjelenik a minitérkép gombján. A bővítmény a játék által már betöltött ikont használja; külön képre nincs szükség.\nA Resources bővítmény erőforrásait ott regisztrálni kell.\nÜres mező = nincs ikon
deposits.minimap = Minitérképgomb
deposits.minimap.description = ON minitérképgombot és fedvényréteget ad ehhez a lelőhelyhez.
deposits.editor = Szerkesztőecset neve
deposits.editor.description = A terepszerkesztő festő- és törlőecsetének neve. Ugyanez a név szerepel a tool_paint_<name>.png és tool_erase_<name>.png fájlokban a vfs\media_soviet\editor alatt.\nÜres mező = ne hozzon létre ecsetet\nMegengedett: legfeljebb 31 betű, számjegy, _ és -
deposits.deplete = Kimerülés texelenként
deposits.deplete.description = Ezt a beállítást a Depletion bővítmény olvassa. Az erőforrástérkép teljesen feltöltött pontjából kitermelhető tonnamennyiséget határozza meg. A gyengébb pontok arányosan kevesebbet adnak.\nAz érték felülírja a plugins\depletion.ini fájl tonnes_per_texel beállítását.\n0 = ez a lelőhely kimeríthetetlen marad\nÜres mező = a globális érték használata
deposits.save_warning = A módosítások csak mentéskor kerülnek a használatba kerülő deposits.ini fájlba. A mentett játék által már használt lelőhelyek típusszámai, térképcsatornái és tokenjei nem változhatnak; először egy másolaton tesztelje.
depletion.tab.general = Általános
depletion.tab.mining = Bányászat
needs.save_warning = A módosítások csak mentéskor kerülnek a használatba kerülő needs.ini fájlba. Minden szükséglet egy tárolóhelyet ad az érintett üzletekhez, amely a mentett játék részévé válik. Először egy másolaton tesztelje.
bp.name = Buildings Plus
bp.description = Új épületek egy definícióból: a játék egy mintaépülete és a building.ini eltérő sorai. Minden játékindításkor teljes Workshop-elemként készülnek el.
bp.notice = Minden épület külön mappát kap a media_soviet\workshop_wip alatt, saját Workshop-azonosítóval. Hagyja üresen az azonosítót: a bővítmény játékindításkor a következő szabad számot rendeli hozzá 9300000000-tól kezdve, és megőrzi a plugins\buildings_plus.ids.ini fájlban. A játék közzé nem tett Workshop-elemként olvassa a mappát. A módosításokhoz teljes újraindítás szükséges. Az ilyen épületet tartalmazó mentett játék betöltéséhez szükség van a mappára.
bp.tab.general = Általános
bp.tab.buildings = Épületek
bp.tab.generated = Létrehozott épületek
bp.wip = Létrehozott épületek a játék mappájában
bp.wip.description = A Buildings Plus vagy az eredeti buildings bővítmény által a media_soviet\workshop_wip mappába létrehozott épületeket mutatja. Az itt látható adatok a mappákból származnak.
bp.wip.empty = Itt még nincs létrehozott épület. Az épületek a játék indításakor készülnek el, ha valamelyik engedélyezve van.
bp.group = Épületek
bp.group.notice = Az itteni épület egy játékbeli épület másolata eltérő sorokkal: ugyanaz a modell, ugyanazok a kapcsolatok, az Ön receptje. Azonos fajtájú mintaépületet válasszon (bányához bányát, gyárhoz gyárat).
bp.list = Épületek
bp.add = Hozzáadás
bp.select_help = Válasszon egy épületet a bal oldalon, vagy a + gombbal adjon hozzá egyet. Először a mintaépületet kell kiválasztani, a Workshop-azonosító üresen maradhat; a név és a sorok ezután a jobb oldalon adhatók meg.
bp.id = Objektumnév
bp.id.help = A létrehozott épület mappáját és objektumát nevezi el, és megjelenik a naplóban. Csak betűk, számjegyek, _ és -, legfeljebb 64 karakter; később nem módosítható.
bp.save_warning = A módosítások csak mentéskor kerülnek a használatba kerülő buildings_plus.ini fájlba, és a játék teljes újraindítása után lépnek életbe. A bővítmény ekkor írja ki a mappát a media_soviet\workshop_wip alá; a hibás szakaszt kihagyja, és megnevezi a naplóban.
bp.list.note = Legfeljebb 256 épület.
bp.new_name = Objektumnév
bp.new_hint = A szóközök aláhúzásjelekké, a nagybetűk kisbetűkké válnak.
bp.card.folders = Létrehozott mappák
bp.card.log = Hibaelhárítás
bp.card.new = Új épület
bp.links = Útmutatók
bp.link.readme = README (útmutató)
bp.prune = Mappák tisztítása
bp.prune.description = ON a következő játékindításkor eltávolítja a törölt vagy kikapcsolt épület létrehozott mappáját (csak az e bővítmény által létrehozott mappákat).\nOFF megtartja ezeket a mappákat; a játék továbbra is betölti az épületeket.
bp.always = Mindig újraírás
bp.always.description = ON minden játékindításkor újraírja az összes épületmappát.\nOFF csak akkor ír újra egy mappát, ha annak szakasza, a bővítmény vagy a mintaépület egyik fájlja megváltozott. Hagyja OFF állásban.
bp.verbose = Részletes napló
bp.verbose.description = ON minden másolt fájlt és a mintaépület minden eltávolított sorát a logs\tesmioloader.buildings_plus.log fájlba írja.\nOFF csak eredményeket, figyelmeztetéseket és hibákat ír.
bp.repair_owner_ids = Tulajdonosazonosító kitöltése
bp.repair_owner_ids.description = ON beírja az Ön Steam-azonosítóját az azonosító nélküli létrehozott épületekbe, más generátorok épületeit is beleértve. Enélkül a játék minden olyan mentés betöltésekor hiányzó Workshop-elemekre kérdez rá, amely ilyen épületet használ.\nOFF érintetlenül hagyja más generátorok mappáit.
bp.card.saves = Mentett játékok
bp.card.saves.description = A mentett játék minden álló épület tárolóit megjegyzi. Ezzel egy saját épülethez hozzáadott új tárolósor a már álló épületekre is alkalmazható.
bp.retrofit = A már álló épületek tárolóinak naprakészen tartása
bp.retrofit.description = ON: mentett játék betöltésekor minden elkészült, generált épület üresen megkapja a szakaszához hozzáadott, egyetlen erőforrást tároló tárolókat. Ha egy tárolósorban módosítja a méretet, a tároló is változik; a csökkentés megvárja, amíg a készlet belefér. Az a tároló, amelynek sorát eltávolította, kiürülés után eltűnik az épületekből.\nOFF: a már álló épületek tárolói változatlanok maradnak; az új és módosított sorok csak a később épített épületekre érvényesek.
bp.enabled = Épület engedélyezve
bp.enabled.description = ON a következő játékindításkor létrehozza ezt az épületet.\nOFF nem hozza létre. Ha a „Mappák tisztítása” engedélyezve van, a meglévő mappája a következő indításkor törlődik.
bp.item_id = Workshop-azonosító
bp.item_id.description = Egyéni szám is megadható: 9000000000 és 9999999999 között, kivéve 9100000000 és 9199999999 között (más generátoroknak fenntartva)\nEz nevezi el a játék mappájában, a workshop_wip alatt lévő mappát, és később nem szabad módosítani.
bp.donor = Mintaépület
bp.donor.description = Az épület, amelyből a másolat kiindul; Workshop-épületre fel kell iratkozni.\nA „Mintaépület kiválasztása...” segítségével böngészhet az elérhető épületek között. A fajta egyezzen: bányához bánya, gyárhoz gyár, üzlethez üzlet.
bp.item_name = Játékbeli név
bp.item_name.description = A játékban megjelenő név.\nA pontokat tartalmazó érték fordítási kulcsnak számít, amelyet a Localization bővítmény old fel, például: localization.lang.salt_mine
bp.desc = Leírás
bp.desc.description = A Workshop-elem leírása, mezősoronként egy sor. Idézőjelek nélkül.
bp.line = building.ini sorok
bp.line.description = Mezősoronként egy building.ini sor, például $PRODUCTION raw_salt 1.0. A „Sor kiválasztása…” segítségével átvehet és módosíthat egy sort a mintaépületből. Saját sorai a minta sorai elé kerülnek, és helyettesítik: az azonos tokent; az összes $TYPE_* tokent; az összes $STORAGE* tokent a $RESOURCE_VISUALIZATION tokennel együtt; a $PRODUCTION, $CONSUMPTION és $CONSUMPTION_PER_SECOND tokeneket egyetlen receptként. A minta minden más része megmarad.\nSaját erőforrásokhoz mindig $STORAGE_IMPORT_SPECIAL vagy $STORAGE_EXPORT_SPECIAL tokent használjon az erőforrás megnevezésével, különben a tároló a szállítási osztály minden erőforrását felsorolja.
bp.strip = Mintaépület sorainak eltávolítása
bp.cmd_add = Hozzáfűzés
bp.cmd_add.description = Soronként egy parancs: egy új sor, amely a minta fájljának lezáró vége elé kerül. Többsoros blokkot a sorok közé tett | jellel írjon.
bp.cmd_replace = Csere
bp.cmd_replace.description = Soronként egy parancs: régi sor | új sor. A régi sornak pontosan egyszer kell szerepelnie a minta fájljában.
bp.cmd_remove = Eltávolítás
bp.cmd_remove.description = Soronként egy parancs: a minta fájljából eltávolítandó sor. A hozzá tartozó sorok (pontok, pozíció) is eltávolításra kerülnek.
bp.cmd_insert = Beszúrás
bp.cmd_insert.description = Soronként egy parancs: 0 vagy 1 | horgonysor | új sor. A 0 a horgonysor elé, az 1 mögé helyezi az új sort.
bp.strip.description = Soronként egy $TOKEN, például $WORKERS_NEEDED. A minta minden ilyen tokent tartalmazó sora pótlás nélkül törlődik.
bp.life = Épület tartóssága
bp.life.description = Üres = 3000\nLIFE a renderconfig.ini fájlban: mennyit visel el az épület, mielőtt összeomlik. Mint a legtöbb játékbeli épület.
bp.card.lines = Sorok
bp.item_id.empty = a bővítmény játékindításkor a következő szabad számot rendeli hozzá 9300000000-tól kezdve.
bp.item_name.empty = az objektumnév; nem ajánlott.
