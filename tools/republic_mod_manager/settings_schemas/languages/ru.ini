[language]
name = Русский

[strings]
plugin.resources = Resources
plugin.resources.description = Управление ресурсами, их свойствами и необязательными пользовательскими ценами.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Собственные ресурсы с Resources Plus: тот же список, что и в оригинале, в plugins\resources_plus.ini, без сбоя при выходе.
resources_plus.save_warning = Изменения записываются в plugins\resources_plus.ini при сохранении. Удаление ресурса, который уже используется в сохранённой игре, может повредить её.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Собственные потребности граждан с Needs Plus: тот же список, что и в оригинале, в файле needs_plus.ini в папке plugins, перенесённый из needs.ini при первом запуске.
needs_plus.save_warning = Изменения записываются в needs_plus.ini в папке plugins только при сохранении. Каждая потребность добавляет ячейку хранения в соответствующие магазины, и эта ячейка становится частью сохранённой игры. Сначала проверьте на копии.
tab.resources.editor = Ресурсы
group.resource_definitions = Определения ресурсов
detail.transport = Класс перевозки
detail.transport.description = Определяет, какие транспортные средства и хранилища могут перевозить и хранить ресурс. Достаточно выбрать название; плагин добавит параметры этого класса из базовой игры.
detail.kind = Ценовая категория
detail.kind.description = 0 сырьё, 1 промышленные товары, 2 продукты/одежда, 3 продвинутые материалы, 4 электроника.
detail.record_price = Начальная цена в записи
detail.record_price.description = Необязательные начальные значения в RUB и USD в записи ресурса.
detail.record_base_price = Начальная базовая цена в записи
detail.record_base_price.description = Необязательные базовые значения в RUB и USD в записи ресурса.
detail.trade_mult = Торговые множители
detail.trade_mult.description = Множители продажи и покупки, обычно 0.95 и 1.05.
detail.market_rub = Рыночный блок RUB
detail.market_usd = Рыночный блок USD
detail.market.description = Два рыночных значения и необязательный коэффициент.\n(См. описание в INI)
detail.packed = Упакованный груз
detail.packed.description = Автоматическое отображение груза, неупакованный или упакованный груз.
detail.family = Группа материала
detail.family.description = Определяет вид материала в кучах на стройплощадке и, скорее всего, тип отходов, в которые он превращается. Каждая группа содержит один ресурс отходов. Числа от 10 до 19 в INI отображаются по названиям.
detail.cargo = Геометрия груза
detail.cargo.description = Выбор геометрии для визуализации груза.
detail.pinned_base_price = Фиксированная базовая цена
detail.pinned_base_price.description = Необязательное значение в RUB и USD в [base_price]. Пустое поле означает отсутствие пользовательской записи.
detail.forced_price = Принудительная итоговая цена
detail.forced_price.description = Необязательное значение в RUB и USD в [price]. Если поле пустое, цену рассчитывает игра.

; --- Локальные схемы установленных исходных плагинов (с 0.13.0) ---
daynight.description = Один восход и один закат за календарный день. В базовой игре переход от дня к ночи и обратно занимает 13 календарных дней, почти две недели. С этим плагином он укладывается в один день.
daynight.group.cycle = День и ночь
daynight.group.cycle.description = Продолжительность цикла дня и ночи и время наступления ночи.
daynight.group.pace = Темп
daynight.group.pace.description = Две независимые настройки: одна для транспорта, другая для всего остального. Они действуют всегда, независимо от настроек выше.
daynight.group.diagnostics = Устранение неполадок
daynight.enabled.label = Плагин включён
daynight.enabled.description = ON включает настроенный цикл дня и ночи.
daynight.cycle_days.label = Календарных дней на цикл дня и ночи
daynight.cycle_days.description = Число календарных дней от одного восхода до следующего.\n1 = один восход и один закат каждый день\nОт 2 до 12 = соответственно более длинный цикл\n13 = цикл базовой игры
daynight.day_scale.label = Длина дня (во сколько раз замедляется календарь)
daynight.day_scale.description = Во сколько раз календарный день длится дольше, чем в базовой игре.\nauto = автоматически замедлять календарь в соответствии со световым циклом; рекомендуется\n1 = не замедлять календарь; день и ночь тогда меняются в 13 раз быстрее\nОт 2 до 100 = замедлить календарь в указанное число раз\nВыберите замедляемые части игры в настройке «Что замедлять».
daynight.slow.label = Что замедлять
daynight.slow.description = Какие части игры замедляются.\ncalendar = замедлить только календарь; рекомендуется\nworld = замедлить всё, включая граждан и транспорт; высокие значения выглядят как замедленная съёмка\nnone = ничего не замедлять\nПри calendar граждане, транспорт, строительство и производство сохраняют обычную скорость. Ежедневные процессы, например загрязнение, займы и сообщения, сохраняют привычный интервал.
daynight.offset.label = Когда наступает ночь
daynight.offset.description = Сдвигает ночь в пределах календарного дня.\n0 = темнота наступает вскоре после середины дня\n0.5 = темнота наступает при смене даты\nПри любом значении, кроме 0, цикл в 13 дней уже не полностью совпадает с базовой игрой.
daynight.fade.label = Подстраивать переходы освещения
daynight.fade.description = ON сокращает переходы между утром, днём, вечером и ночью в соответствии с настроенным циклом.\nOFF использует медленные переходы базовой игры. При коротких циклах они могут накладываться и делать освещение блеклым.
daynight.vehicle_scale.label = Скорость транспорта
daynight.vehicle_scale.description = Скорость грузовиков, поездов, судов и самолётов. Работает независимо от остальных настроек.\n1 = скорость базовой игры\n2 = половинная скорость\n0.5 = двойная скорость\nБольше значение = медленнее транспорт
daynight.sim_scale.label = Скорость всего остального
daynight.sim_scale.description = Скорость граждан, строительства, производства, износа и анимаций.\n1 = скорость базовой игры\n2 = половинная скорость\n0.5 = двойная скорость\nБольше значение = медленнее симуляция
daynight.probe.label = Записывать длительность дней в журнал
daynight.probe.description = ON записывает реальную длительность каждого календарного дня и перехода освещения в tesmioloader.log. Используйте только для устранения неполадок и проверок после обновления игры.
walking.description = Как далеко граждане ходят пешком и как далеко владельцы автомобилей ездят между домом, работой и парковкой.
walking.group.distances = Расстояния
walking.group.distances.description = Измеряются по дорогам и пешеходным дорожкам, а не по прямой. Здание в 400 m на другом берегу реки может потребовать пешего пути длиной 1200 m.
walking.group.diagnostics = Устранение неполадок
walking.enabled.label = Плагин включён
walking.enabled.description = ON включает настроенные расстояния ходьбы и поездок.
walking.distance.label = Дальность ходьбы (m)
walking.distance.description = Самый длинный маршрут, который гражданин пройдёт пешком. В базовой игре — 480 m.\nБольше значение = больше зданий в пешей доступности и больше связей создаётся при строительстве\n0 = без ограничения; строительство в большом городе может тогда занимать несколько секунд\n20000 = наибольшее допустимое значение
walking.car_distance.label = Дальность поездок владельцев автомобилей (m)
walking.car_distance.description = Самая длинная разрешённая поездка между домом, работой и парковкой. В базовой игре — 2500 m.\nБольше значение = владельцы автомобилей ездят дальше\nЗадайте значение выше дальности ходьбы. При равных значениях автомобиль не даёт преимущества в дальности.
walking.regen_on_load.label = Перестраивать связи при загрузке сохранения
walking.regen_on_load.description = Пешеходные связи и связи с парковками хранятся в сохранённой игре.\nON перестраивает все связи при загрузке, поэтому настроенные расстояния действуют и в существующих городах.\nOFF применяет настроенные расстояния только к новым зданиям.
walking.probe.label = Записывать контрольные значения в журнал
walking.probe.description = ON записывает в tesmioloader.log значения, найденные в игре до их изменения плагином. Используйте только для устранения неполадок и проверок после обновления игры.
accumulator.description = Аккумуляторы для электросети. Здание с большим запасом энергии заряжается, когда электричества достаточно, и отдаёт его при нехватке.
accumulator.group.battery = Аккумулятор
accumulator.group.battery.description = Какие здания считаются аккумуляторами и как быстро они заряжаются и разряжаются.
accumulator.group.window = Окно здания
accumulator.group.grid = Электросеть
accumulator.group.diagnostics = Устранение неполадок
accumulator.enabled.label = Плагин включён
accumulator.enabled.description = ON включает зарядку и разрядку зданий-аккумуляторов.\nOFF останавливает разрядку. Здания остаются и по-прежнему могут заряжаться.
accumulator.building_types.label = Типы зданий
accumulator.building_types.description = Типы зданий, способных работать аккумуляторами. Несколько чисел разделяйте запятыми.\n19 = трансформатор\n18 = подстанция\nНе используйте 17: электростанция не может принимать электричество и никогда не зарядится.
accumulator.min_capacity.label = Минимальная ёмкость для работы аккумулятором
accumulator.min_capacity.description = Минимальная ёмкость хранилища, при которой здание считается аккумулятором. Исключает небольшие запасы обычных подстанций.\nБольше значение = меньше зданий считаются аккумуляторами\nМеньше значение = больше зданий считаются аккумуляторами\nУ входящего в комплект «Stationary Accumulator» ёмкость 5000.
accumulator.charge_rate.label = Скорость зарядки (мощность в секунду)
accumulator.charge_rate.description = Максимальное количество электричества, принимаемое аккумулятором за секунду. Ограничение не даёт пустому аккумулятору отнять электричество у целого города.\nБольше значение = быстрее зарядка и выше нагрузка на сеть\nМеньше значение = медленнее зарядка и ниже нагрузка\nДля сравнения: угольная электростанция выдаёт 70, а ветрогенератор — 15.
accumulator.discharge_rate.label = Скорость разрядки (мощность в секунду)
accumulator.discharge_rate.description = Максимальное количество электричества, выдаваемое аккумулятором за секунду. Он выдаёт его только при нехватке в сети.\nБольше значение = покрытие более крупных дефицитов мощности\nМеньше значение = запасённой энергии хватает дольше\nПример: при 60 полный аккумулятор ёмкостью 5000 заменяет электростанцию чуть более чем на 80 секунд.
accumulator.panel.label = Строка заряда в окне аккумулятора
accumulator.panel.description = ON добавляет уровень заряда в окно аккумулятора, например «Zaryad: 4210.5 / 5000 (84.2 %)».
accumulator.panel_caption.label = Подпись этой строки
accumulator.panel_caption.description = Слово перед уровнем заряда. Только латинские буквы без диакритики и специальных символов, иначе игра покажет нечитаемые знаки.
accumulator.gauges.label = Рассчитывать показатели окна по аккумулятору
accumulator.gauges.description = ON заменяет неверные показания игры фактическим входящим и исходящим потоком аккумулятора.\nOFF использует обычные показания игры. Во время зарядки они могут показывать мощность 0 и «без электроснабжения».
accumulator.spread_voltage.label = Эксперимент: передавать напряжение соседям (оставьте выключенным)
accumulator.spread_voltage.description = ON не даёт эффекта. Эта старая функция была технически заменена. Оставьте OFF.
accumulator.trace.label = Записывать соседей первого аккумулятора
accumulator.trace.description = ON записывает в журнал, сколько электричества получают здания рядом с первым аккумулятором. Только для устранения неполадок; может снижать производительность.
accumulator.log_seconds.label = Секунд между записями об аккумуляторе
accumulator.log_seconds.description = Интервал между сообщениями о состоянии аккумулятора в tesmioloader.log. Каждое сообщение содержит заряд, приток и отток.\n0 = без сообщений о состоянии\nБольше значение = реже запись
accumulator.probe.label = Секунд между списками зданий в журнале
accumulator.probe.description = Интервал между списками всех зданий с хранилищем электричества в tesmioloader.log. Используйте только при нераспознанном аккумуляторе или после обновления игры.\n0 = не записывать эти списки\nБольше значение = реже запись
cities.description = Размер и форма каждого города. В базовой игре каждый город — круг радиусом 1000 m. Этот плагин позволяет задать радиус каждого города отдельно, при желании выбрав квадратную форму, прямо в окне города. Значения хранятся в сохранённой игре.
cities.group.cities = Города
cities.group.slider = Ползунок радиуса
cities.group.slider.description = Диапазон ползунка в окне города и величина изменения при одном нажатии + или -.
cities.group.layout = Расположение в окне города
cities.group.layout.description = Положение двух новых строк в окне города. Числа — координаты в собственных единицах окна игры; его ширина составляет примерно 500.
cities.group.overlay = Сетка точек на земле
cities.group.diagnostics = Устранение неполадок
cities.enabled.label = Плагин включён
cities.enabled.description = ON включает собственные размеры и формы городов.
cities.window.label = Ползунок радиуса и флажок формы в окне города
cities.window.description = ON показывает ползунок радиуса и флажок квадратной формы в окне города.\nOFF скрывает оба элемента; заданные значения сохраняются, но изменить их больше нельзя.
cities.adopt.label = Создавать отдельный город для зданий без города
cities.adopt.description = При уменьшении города здания могут оказаться снаружи и перестать принадлежать какому-либо городу.\nON создаёт для них новый город со случайным названием и сегодняшней датой, как делает сама игра.\nOFF оставляет их без города; поведение игры в этом случае не проверялось.
cities.radius.label = Радиус по умолчанию (m)
cities.radius.description = Радиус по умолчанию для городов без индивидуальных настроек. Значение действует на всех картах.\n1000 = радиус базовой игры\nБольше значение = крупнее города\nМеньше значение = меньше города
cities.square.label = Квадратная форма по умолчанию
cities.square.description = ON делает квадратными города без индивидуальных настроек.\nOFF использует круг, как в базовой игре.
cities.radius_min.label = Минимальный радиус ползунка (m)
cities.radius_min.description = Значение в крайнем левом положении ползунка.
cities.radius_max.label = Максимальный радиус ползунка (m)
cities.radius_max.description = Значение в крайнем правом положении ползунка. У ползунка 100 шагов; при диапазоне от 200 до 5000 один шаг равен 48 m.
cities.step.label = Процентов на нажатие кнопки
cities.step.description = Процент диапазона ползунка, на который меняется значение при одном нажатии + или -. Не относится к перетаскиванию ползунка.\nБольше значение = больше изменение за нажатие\nМеньше значение = точнее изменение за нажатие
cities.label_x.label = Положение подписи
cities.label_x.description = Расстояние от левого края окна до подписи.
cities.widget_x.label = Положение элементов управления
cities.widget_x.description = Расстояние от левого края окна до ползунка и флажка. Ползунку требуется примерно 225.
cities.checkbox_dy.label = Сдвигать строку флажка вверх или вниз
cities.checkbox_dy.description = Перемещает флажок вверх или вниз, чтобы он не перекрывал ползунок.\nБольше значение = флажок ниже\nМеньше значение = флажок выше
cities.overlay.label = Подстраивать наложение под радиус и форму
cities.overlay.description = При открытом окне города игра показывает на земле синюю сетку точек, но только для круга радиусом 1000 m.\nON подстраивает сетку под выбранные радиус и форму.\nOFF оставляет её как в базовой игре.
cities.overlay_step.label = Шаг сетки наложения (m)
cities.overlay_step.description = Расстояние между точками, обозначающими границу города.\n0 = автоматически одна двадцатая радиуса, но не меньше 50 m\nМеньше значение = плотнее отображение и выше нагрузка
cities.probe.label = Записывать города в журнал
cities.probe.description = ON записывает радиус, форму и число зданий каждого города в tesmioloader.log после загрузки. Дополнительные сообщения записываются при открытом окне города. Только для устранения неполадок; журнал может быстро разрастаться.
depletion.description = Месторождения истощаются. Работающая шахта заметно вырабатывает месторождение на карте, и чем меньше остаётся, тем меньше она производит. Добыча хранится в сохранённой игре; если позже выключить плагин, добытое не вернётся. Сначала проверьте на копии сохранения.
depletion.group.depletion = Добыча
depletion.group.window = Окно шахты
depletion.group.diagnostics = Устранение неполадок
depletion.enabled.label = Плагин включён
depletion.enabled.description = ON позволяет выбранным месторождениям истощаться при добыче.\nOFF останавливает дальнейшее истощение. Уже удалённые ресурсы не восстанавливаются.
depletion.tonnes_per_texel.label = Тонн на точку карты
depletion.tonnes_per_texel.description = Тонны, которые шахта может добыть из полностью заполненной точки карты ресурсов. Более бедные точки дают пропорционально меньше.\nБольше значение = месторождения служат дольше\nМеньше значение = месторождения истощаются быстрее\nДля сравнения: шахта с радиусом поиска 210 m охватывает несколько тысяч точек карты.
depletion.vanilla.label = Истощаемые месторождения базовой игры
depletion.vanilla.description = Месторождения базовой игры, которые могут истощаться. Несколько значений разделяйте запятыми.\noil, iron, coal, uranium, bauxite, gravel = только перечисленные месторождения\nall = все месторождения\nnone = ни одного месторождения базовой игры\nname:value = собственное число тонн на точку карты, например iron:3000\nМесторождения из deposits.ini всегда включены.\ngravel навсегда стирает видимую текстуру земли и требует гораздо большего значения из-за малого радиуса поиска. Не указывайте gravel, чтобы сохранить поведение базовой игры.
depletion.flush_seconds.label = Секунд между сохранениями добычи
depletion.flush_seconds.description = Секунды между обновлениями карты ресурсов. Производительность и качество меняются сразу; только мини-карта и сохранение игры обновляются с этим интервалом.\nМеньше значение = чаще обновления и выше нагрузка\nНе обновляйте чаще четырёх раз в секунду.
depletion.panel.label = Строка остатка месторождения в окне шахты
depletion.panel.description = ON показывает оставшийся запас в окне шахты и немного увеличивает высоту окна, например «Ostatok: 251.4 kt / 259.3 kt (96.9 %)».
depletion.panel_caption.label = Подпись этой строки
depletion.panel_caption.description = Слово перед остатком. Только латинские буквы без диакритики и специальных символов, иначе игра покажет нечитаемые знаки.
depletion.log_seconds.label = Интервал строк о ходе добычи (секунды)
depletion.log_seconds.description = Секунды между сообщениями о состоянии шахт в tesmioloader.log. Каждое содержит остаток, общий объём и качество.\n0 = без сообщений о состоянии\nБольше значение = реже запись\nНаблюдайте несколько игровых дней, чтобы подобрать подходящее число тонн на точку карты.
easystart.description = Потребности граждан появляются постепенно с годами. Пока потребность не разблокирована, она не влияет на счастье и здоровье; граждане по-прежнему посещают соответствующие места и делают покупки, но последствия возникают только с заданного года.
easystart.group.general = Что отложить
easystart.group.unlock = Годы разблокировки
easystart.group.unlock.description = Год, в котором требование начинает действовать с 1 января. Расписание рассчитано на республику, основанную в 1920 году. При старте в 1960 году заданные годы уже прошли.\noff = не откладывать; поведение базовой игры\nalways = применять с первого игрового дня\nГод = разблокировать в этом году
easystart.group.diagnostics = Устранение неполадок
easystart.enabled.label = Плагин включён
easystart.enabled.description = ON разблокирует потребности и требования к коммунальным услугам по заданному расписанию.
easystart.demands.label = Отложить девять потребностей граждан
easystart.demands.description = ON откладывает требования к продуктам, мясу, одежде, электронике, алкоголю, религии, культуре, спорту и здоровью до заданных лет разблокировки.
easystart.utilities.label = Отложить три коммунальных требования зданий
easystart.utilities.description = ON откладывает требования к электричеству, воде и отоплению до заданных лет разблокировки.
easystart.warnings.label = Отложить предупреждения в окне здания
easystart.warnings.description = ON скрывает связанные предупреждения до года разблокировки, например «здание без электроснабжения».
easystart.pin_status.label = Удерживать удовлетворённость заблокированных потребностей
easystart.pin_status.description = ON удерживает удовлетворённость заблокированной потребности на указанном ниже уровне.\nOFF позволяет ей продолжать снижаться; при разблокировке она уже может быть очень низкой.
easystart.locked_status.label = Удовлетворённость во время блокировки
easystart.locked_status.description = Удовлетворённость, пока потребность заблокирована. Для продуктов значение означает сытость.\n1.0 = полное удовлетворение или насыщение\n0.5 = среднее значение с заметным улучшением после разблокировки
easystart.clear_unsatisfied.label = Исключать заблокированные потребности из списка неудовлетворённых
easystart.clear_unsatisfied.description = ON не даёт заблокированным потребностям вызывать сообщение «N граждан не смогли получить X».
easystart.probe.label = Записывать разблокировки в журнал
easystart.probe.description = ON при каждой смене года записывает оставшиеся заблокированными потребности в tesmioloader.log. Также один раз записывает первого затронутого гражданина. Только для устранения неполадок.
easystart.food.label = Продукты
easystart.religion.label = Религия
easystart.meat.label = Мясо
easystart.clothes.label = Одежда
easystart.alcohol.label = Алкоголь
easystart.sport.label = Спорт
easystart.culture.label = Культура
easystart.health.label = Здоровье
easystart.electricity.label = Электричество
easystart.water.label = Вода (включает канализацию)
easystart.heating.label = Отопление
easystart.electronics.label = Электроника
easystart.school.label = Школа
easystart.school.description = До этого года дети учатся без школы, как при настройке образования «Простое», и сообщение «N детей не могут ходить в школу» не появляется.
easystart.kindergarten.label = Детский сад
easystart.kindergarten.description = До этого года родителям не нужно оставаться дома из-за ребёнка младше шести лет, и сообщение «N работников не могут работать, потому что все детские сады …» не появляется.
plugin.needs = Needs
plugin.needs.description = Управление дополнительными потребностями граждан и настройками плагина без изменения исходного файла.
tab.needs.editor = Потребности
group.needs = Потребности граждан
group.needs.plugin = Настройки плагина
group.needs.plugin.description = Переключатели, действующие на все потребности.
needs.list = Список потребностей
needs.add = Добавить потребность
needs.select_help = Выберите потребность слева или используйте + для добавления ресурса, зарегистрированного в Resources.
needs.resource = Ресурс
needs.resource.help = Ресурс, который должны требовать граждане. Он должен быть зарегистрирован в списке плагина Resources.
needs.donor = Потребность-образец
needs.donor.description = Существующая потребность, используемая как образец.\nfood или meat = для продуктовых магазинов\nclothes или eletronics = для универмагов\nalcohol = для алкогольных магазинов\neletronics — написание, используемое игрой.
needs.factor = Множитель количества
needs.factor.description = Количество товара относительно потребности-образца.\n1.0 = столько же, сколько у образца\nБольше значение = гражданам нужно больше\nМеньше значение = гражданам нужно меньше
needs.category = Категория магазинов
needs.category.description = Магазины, в которых хранится товар.\nauto = те же магазины, что у потребности-образца\nnone = без автоматической ячейки; здание должно само предоставлять товар\nbasic = только базовые магазины\nmedium = только средние магазины\nadvanced = только крупные магазины\nmediumadvanced = только средние и крупные магазины\nhotel = только гостиницы\nЧисло = записать это значение магазина напрямую; только для пользователей, знакомых с файлами игры
needs.chance = Вероятность
needs.chance.description = Вероятность от 0 до 1, что гражданин получит эту потребность. При значении ниже 1 она назначается независимо от образца.\n0 = ни один гражданин её не получает\n1 = каждый подходящий гражданин её получает
needs.unhappy = Недовольство
needs.unhappy.description = Потеря удовлетворённости, если гражданин не может получить товар.\n0 = без потери; потребность только отображается\nОт 0.005 до 0.02 = обычный диапазон для товара, повышающего комфорт\nДопустимый диапазон: от 0 до 1
needs.enabled = Плагин включён
needs.enabled.description = ON включает плагин.\nOFF полностью отключает его при следующем запуске игры.
needs.demand = Назначать потребности
needs.demand.description = ON назначает гражданам новую потребность.\nOFF не назначает потребность, но всё ещё может добавлять товар в магазины.
needs.storage = Снабжать магазины
needs.storage.description = ON добавляет товар в выбранные магазины.\nOFF не добавляет ячейки хранения; граждане тогда могут найти товар только в зданиях, которые предоставляют его сами.
needs.max_demands = Потребностей на гражданина
needs.max_demands.description = Максимальное число дополнительных потребностей у гражданина одновременно.\n1 = не более одной дополнительной потребности\n7 = наибольшее разрешённое число
needs.when_full = При достижении лимита потребностей
needs.when_full.description = Что происходит, если у гражданина уже максимальное число дополнительных потребностей.\nskip = ждать освобождения ячейки\nreplace = в этот раз заменить потребность-образец
needs.probe = Подробный журнал
needs.probe.description = ON записывает списки потребностей граждан и сведения о каждом магазине в подробный журнал плагина.\nOFF записывает только предупреждения. Включайте временно при проверке новых магазинов.
needs.log_seconds = Интервал сообщений о ходе работы (секунды)
needs.log_seconds.description = Секунды между сообщениями о числе назначенных потребностей.\n0 = отключить эти сообщения\nБольше значение = реже запись
tab.needs.general = Общие
plugin.deposits = Deposits
plugin.deposits.description = Управление типами месторождений, которых нет в базовой игре, и настройками плагина без изменения исходного файла.
tab.deposits.general = Общие
tab.deposits.editor = Месторождения
group.deposits = Месторождения
group.deposits.description = Исходные месторождения защищены и могут быть скрыты; собственные хранятся отдельно и объединяются в итоговый deposits.ini. Каждая секция, кроме [deposits], представляет одно месторождение.
group.deposits.plugin = Настройки плагина
group.deposits.plugin.description = Три подсистемы в секции [deposits]. Каждая отключена для всех месторождений, если её переключатель здесь выключен.
deposits.notice = Номер типа месторождения, его канал карты и токен в building.ini становятся частью сохранённой игры, как только шахта начинает их использовать. Удаление или перенумерация используемого месторождения может сделать сохранение непригодным; сначала проверьте на копии.
deposits.list = Список месторождений
deposits.add = Добавить месторождение
deposits.select_help = Выберите месторождение слева или используйте +, чтобы добавить его для ресурса, зарегистрированного в Resources.
deposits.name = Месторождение
deposits.name.help = Имя секции в deposits.ini. Обозначает месторождение в журнале и у кисти редактора; позже переименовать нельзя.
deposits.new_name = Название месторождения
deposits.new_hint = Здесь задаются только стандартные настройки. Всё остальное (компонент, тип здания, истощение) находится в настройках справа после добавления.
deposits.code_patch = Патч кода
deposits.code_patch.description = ON добавляет настроенные типы месторождений $TYPE_MINE_ в игру, чтобы шахты могли находить их через building.ini. Если после обновления ожидаемые данные игры больше не совпадают, плагин ничего не меняет.
deposits.minimap_all = Слои мини-карты
deposits.minimap_all.description = ON показывает под пятью кнопками мини-карты игры кнопку для каждого отдельно включённого месторождения плагина.\nOFF скрывает все кнопки месторождений плагина.
deposits.editor_all = Кисти редактора рельефа
deposits.editor_all.description = ON показывает кисти рисования и стирания на вкладке ресурсов редактора рельефа для каждого месторождения с именем кисти.\nOFF скрывает все кисти месторождений плагина.
deposits.token = Токен здания
deposits.token.description = Токен, используемый шахтой в building.ini для этого месторождения, например $TYPE_MINE_COPPER. Вводите по образцу $TYPE_MINE_GRAVEL. Никогда не используйте два токена месторождений в одном building.ini.
deposits.type = Номер типа
deposits.type.description = Уникальный номер типа месторождения. Два месторождения не могут использовать один номер.\nОт 10 до 127 = допустимый диапазон\nОт 0 до 9 = зарезервированы для базовой игры\nДиалог автоматически предлагает следующий свободный номер.
deposits.map = Карта
deposits.map.description = Карта, на которой хранится месторождение.\nauto = автоматически выбрать свободную ячейку на карте плагина; рекомендуется\nresourcemap или resourcemap2 = использовать карты базовой игры\nОт resourcemap3 до resourcemap10 = использовать дополнительные карты плагина\nterrain = использовать нарисованный грунт напрямую, например для гравия; его кисть появляется в ROCKS
deposits.component = Компонент
deposits.component.description = У каждой карты четыре ячейки от 0 до 3. Каждая может содержать одно месторождение.\nПри auto = оставьте поле пустым; плагин выберет свободную ячейку\nПри terrain: 2 = слой гравия\nПри terrain: 3 = слой оазиса
deposits.building_type = Тип здания
deposits.building_type.description = Тип здания, способного разрабатывать это месторождение.\n7 = шахта; подходит почти для любого месторождения\n92 = водозаборная скважина\nПустое поле = 7
deposits.radius = Радиус поиска
deposits.radius.description = Как далеко шахта ищет своё месторождение.\noil, ore, bauxite, gravel, wood, water, watersurface = использовать соответствующую константу игры\nЧисло = использовать эту дистанцию напрямую\nПустое поле = использовать ore\nБез радиуса шахта не найдёт месторождение.
deposits.icon = Значок мини-карты
deposits.icon.description = Ресурс, чей значок появится на кнопке мини-карты. Плагин использует значок, уже загруженный игрой; отдельное изображение не нужно.\nРесурсы из плагина Resources должны быть зарегистрированы в нём.\nПустое поле = без значка
deposits.minimap = Кнопка мини-карты
deposits.minimap.description = ON добавляет кнопку мини-карты и слой наложения для этого месторождения.
deposits.editor = Имя кисти редактора
deposits.editor.description = Имя кистей рисования и стирания в редакторе рельефа. То же имя используется в tool_paint_<name>.png и tool_erase_<name>.png в vfs\media_soviet\editor.\nПустое поле = не создавать кисть\nДопустимо до 31 символа: буквы, цифры, _ и -
deposits.deplete = Истощение на тексель
deposits.deplete.description = Эту настройку читает плагин Depletion. Она задаёт тонны, которые шахта может добыть из полностью заполненной точки карты ресурсов. Более бедные точки дают пропорционально меньше.\nЗначение заменяет tonnes_per_texel в plugins\depletion.ini.\n0 = это месторождение остаётся бесконечным\nПустое поле = использовать глобальное значение
deposits.save_warning = Изменения записываются в итоговый deposits.ini только при сохранении. Номера типов, каналы карт и токены месторождений, уже используемых сохранённой игрой, менять нельзя; сначала проверьте на копии.
depletion.tab.general = Общие
depletion.tab.mining = Добыча
needs.save_warning = Изменения записываются в итоговый needs.ini только при сохранении. Каждая потребность добавляет ячейку хранения в соответствующие магазины, и эта ячейка становится частью сохранённой игры. Сначала проверьте на копии.
bp.name = Buildings Plus
bp.description = Новые здания по описанию: здание-образец из игры и отличающиеся строки building.ini. При каждом запуске игры записываются как полноценные предметы Мастерской.
bp.notice = Каждое здание становится папкой в media_soviet\workshop_wip со своим ID Мастерской. Оставьте ID пустым, и при запуске игры плагин назначит следующий свободный номер начиная с 9300000000 и сохранит его в plugins\buildings_plus.ids.ini. Игра читает папку как неопубликованный предмет Мастерской. Изменения требуют полного перезапуска. Для загрузки сохранённой игры с таким зданием нужна его папка.
bp.tab.general = Общие
bp.tab.buildings = Здания
bp.tab.generated = Созданные здания
bp.wip = Созданные здания в папке игры
bp.wip.description = Показывает здания, созданные Buildings Plus или исходным плагином buildings в media_soviet\workshop_wip. Отображаемые сведения читаются из папок.
bp.wip.empty = Здесь пока нет созданных зданий. Здания создаются при запуске игры, если хотя бы одно включено.
bp.group = Здания
bp.group.notice = Здание здесь — копия игрового здания с другими строками: та же модель, те же соединения, ваш рецепт. Выбирайте образец того же вида (шахту для шахты, завод для завода).
bp.list = Здания
bp.add = Добавить
bp.select_help = Выберите здание слева или используйте + для добавления. Сначала выбирается образец, ID Мастерской можно оставить пустым; имя и строки затем задаются справа.
bp.id = Имя объекта
bp.id.help = Задаёт имя папки и объекта созданного здания и отображается в журнале. Только буквы, цифры, _ и -, не более 64 символов; позже изменить нельзя.
bp.save_warning = Изменения записываются в итоговый buildings_plus.ini только при сохранении и вступают в силу после полного перезапуска игры. Тогда плагин записывает папку в media_soviet\workshop_wip; секция с ошибкой пропускается и указывается в журнале.
bp.list.note = Не более 256 зданий.
bp.new_name = Имя объекта
bp.new_hint = Пробелы заменяются подчёркиваниями, прописные буквы — строчными.
bp.card.folders = Созданные папки
bp.card.log = Устранение неполадок
bp.card.new = Новое здание
bp.links = Руководства
bp.link.readme = README (руководство)
bp.prune = Очищать папки
bp.prune.description = ON при следующем запуске игры удаляет созданную папку здания, которое вы удалили или выключили (только папки, записанные этим плагином).\nOFF оставляет такие папки; игра продолжает загружать эти здания.
bp.always = Всегда перезаписывать
bp.always.description = ON записывает все папки зданий при каждом запуске игры.\nOFF записывает папку только при изменении её секции, плагина или файла образца. Оставьте OFF.
bp.verbose = Подробный журнал
bp.verbose.description = ON записывает каждый скопированный файл и каждую удалённую строку образца в logs\tesmioloader.buildings_plus.log.\nOFF записывает только результаты, предупреждения и ошибки.
bp.repair_owner_ids = Заполнять ID владельца
bp.repair_owner_ids.description = ON заполняет ваш Steam ID в созданных зданиях без него, включая здания других генераторов. Без ID игра спрашивает об отсутствующих предметах Мастерской при каждой загрузке сохранения с таким зданием.\nOFF не затрагивает папки других генераторов.
bp.card.saves = Сохранённые игры
bp.card.saves.description = Сохранение запоминает хранилища каждого построенного здания. Эта настройка позволяет применить новую строку хранилища одного из ваших зданий и к уже построенным экземплярам.
bp.retrofit = Обновлять хранилища уже построенных зданий
bp.retrofit.description = ON: при загрузке сохранения каждое завершённое созданное здание получает пустые хранилища для отдельных ресурсов, добавленные в его секцию. При изменении ёмкости в строке хранилища меняется и само хранилище; уменьшение ждёт, пока запасы поместятся. Хранилище, строку которого вы удалили, исчезает из зданий после опустошения.\nOFF: хранилища уже построенных зданий остаются прежними; новые и изменённые строки действуют только на здания, построенные позже.
bp.enabled = Здание включено
bp.enabled.description = ON создаёт это здание при следующем запуске игры.\nOFF не создаёт его. Если включена настройка «Очищать папки», существующая папка удаляется при следующем запуске.
bp.item_id = ID Мастерской
bp.item_id.description = Можно задать свой номер: от 9000000000 до 9999999999, кроме диапазона от 9100000000 до 9199999999 (зарезервирован для других генераторов)\nОн задаёт имя папки в workshop_wip внутри папки игры и не должен меняться впоследствии.
bp.donor = Здание-образец
bp.donor.description = Здание, с которого начинается копия; на здание из Мастерской нужно подписаться.\nИспользуйте «Выбрать образец...», чтобы просмотреть доступные здания. Соблюдайте вид: шахта для шахты, завод для завода, магазин для магазина.
bp.item_name = Название в игре
bp.item_name.description = Название, отображаемое в игре.\nЗначение с точками считается ключом перевода и обрабатывается плагином Localization, например: localization.lang.salt_mine
bp.desc = Описание
bp.desc.description = Описание предмета Мастерской, по одной строке на строку поля. Без кавычек.
bp.line = Строки building.ini
bp.line.description = Одна строка building.ini на строку поля, например $PRODUCTION raw_salt 1.0. Используйте «Выбрать строку…», чтобы взять строку здания-образца и изменить её. Ваши строки помещаются перед строками образца и заменяют: тот же токен; все $TYPE_*; все $STORAGE* вместе с $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION и $CONSUMPTION_PER_SECOND как единый рецепт. Всё остальное от образца сохраняется.\nДля собственных ресурсов всегда используйте $STORAGE_IMPORT_SPECIAL или $STORAGE_EXPORT_SPECIAL с именем ресурса, иначе хранилище перечислит все ресурсы класса перевозки.
bp.strip = Удалить строки образца
bp.cmd_add = Дописать в конец
bp.cmd_add.description = Одна команда на строку: новая строка перед завершающим концом файла образца. Блок из нескольких строк записывается с | между строками.
bp.cmd_replace = Заменить
bp.cmd_replace.description = Одна команда на строку: старая строка | новая строка. Старая строка должна встречаться в файле образца ровно один раз.
bp.cmd_remove = Удалить
bp.cmd_remove.description = Одна команда на строку: строка файла образца для удаления. Связанные с ней строки (точки, положение) тоже удаляются.
bp.cmd_insert = Вставить
bp.cmd_insert.description = Одна команда на строку: 0 или 1 | опорная строка | новая строка. 0 помещает новую строку перед опорной, 1 — после.
bp.strip.description = Один $TOKEN на строку, например $WORKERS_NEEDED. Каждая строка образца с этим токеном удаляется без замены.
bp.life = Прочность
bp.life.description = Пусто = 3000\nLIFE в renderconfig.ini: сколько здание может выдержать до обрушения. Как у большинства зданий игры.
bp.card.lines = Строки
bp.item_id.empty = при запуске игры плагин назначает следующий свободный номер начиная с 9300000000.
bp.item_name.empty = имя объекта; не рекомендуется.
needs_plus.card.log = Устранение неполадок
resources_plus.card.log = Устранение неполадок
resources_plus.card.plugin = Плагин
resources_plus.custom_report = Записывать клонированные записи
resources_plus.custom_report.description = ON записывает для каждого ресурса с образцом, что клон действительно унаследовал (класс перевозки, множители, флаги). Ресурсы без образца перечисляются всегда.\nOFF перечисляет только ресурсы без образца.
resources_plus.customs_hook = Обновлять таможни
resources_plus.customs_hook.description = ON добавляет новые ресурсы в торговые списки уже существующих таможен.\nOFF соответствует базовой игре: таможня торгует только тем, что знала при строительстве; тогда помогает лишь снос и повторная постройка.
resources_plus.customs_probe = Записывать строки таможен
resources_plus.customs_probe.description = ON записывает в tesmioloader.log по одной строке для каждого ресурса, добавленного в таможню. Выключите через OFF, когда таможни показывают ожидаемые ресурсы.
resources_plus.price_hook = Применять цены из INI
resources_plus.price_hook.description = ON включает действие [base_price] и [price]: базовые цены задаются до расчёта цен игрой, фиксированные — после.\nOFF оставляет цены игре.
resources_plus.price_report = Записывать таблицу цен
resources_plus.price_report.description = ON записывает цену, базовую цену и ценовую категорию каждого ресурса вашего списка в tesmioloader.log после каждого расчёта цен игрой. Цена 0.00 означает, что ни одно здание его не производит.\nOFF ничего не записывает.
tab.resources_plus.general = Общие
resources.heading.basics = Перевозка и ценовая категория
resources.heading.cargo = Груз и материал
resources.heading.fixed = Фиксированные цены
resources.heading.market = Рыночные значения
resources.heading.prices = Цены в записи

