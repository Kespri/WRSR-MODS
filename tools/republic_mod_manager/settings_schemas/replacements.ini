; Replacement plugins that are found without a package manifest.
; Format: <plugin> = <plugin it replaces>, both named like their DLL without ".dll".
; Republic Mod Manager never lets the two of a pair run together: switching one
; on switches the other one off. A package says the same in its own manifest
; with [mod] replaces = <plugin>; that entry wins over this table.
[replaces]
resources_plus = resources
needs_plus = needs
deposits_plus = deposits
