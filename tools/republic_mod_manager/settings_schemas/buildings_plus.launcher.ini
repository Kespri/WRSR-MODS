; Local launcher schema for the installed plugin "buildings_plus" (shipped with the
; Republic Mod Manager Workshop item). Describes buildings_plus.ini in the
; loader's plugins folder: [buildings_plus] holds the switches, every other
; section is one generated building. German texts in languages\de.ini (bp.*),
; the texts here are the English fallback. UTF-8 without BOM.

[launcher]
layout_version = 1
editor_type = keyed_sections
id = tesmio.buildings_plus.editor
name = Buildings Plus
name_key = bp.name
version = 0.2.10
description = New buildings from a declaration: a donor building of the game plus the building.ini lines that differ. Written as complete Workshop items at every game start.
description_key = bp.description
notice = Every building becomes a folder under media_soviet\workshop_wip with its own Workshop id. Leave the id empty and the plugin assigns the next free number from 9300000000 at game start and keeps it in plugins\buildings_plus.ids.ini. The game reads the folder like an unpublished Workshop item. Changes need a full restart. A saved game that contains such a building needs the folder when loading.
notice_key = bp.notice
notice_style = warning
icon = builtin:gear
language_directory = languages
default_tab = buildings

[editor]
plugin = buildings_plus
config = buildings_plus.ini
list_section = list
reserved_sections = buildings_plus|buildings
maximum_items = 256

[activity]
section = buildings_plus
key = enabled
values = 1

[tab:general]
label = General
label_key = bp.tab.general
order = 10

[tab:buildings]
label = Buildings
label_key = bp.tab.buildings
order = 20

[tab:generated]
label = Generated buildings
label_key = bp.tab.generated
order = 30

[wip_buildings]
tab = generated
range = generated
label = Generated buildings in the game folder
label_key = bp.wip
description = Shows the buildings that Buildings Plus or the original buildings plugin generated into media_soviet\workshop_wip. What you see here is read from the folders.
description_key = bp.wip.description
empty = No generated building here yet. Buildings are generated at game start when one is switched on.
empty_key = bp.wip.empty

[group:buildings]
tab = buildings
label = Buildings
label_key = bp.group
notice = A building here is a copy of a game building with other lines: same model, same connections, your recipe. Pick a donor of the same kind (mine for mine, factory for factory).
notice_key = bp.group.notice
notice_style = info

[list]
label = Buildings
label_key = bp.list
add_label = Add
add_label_key = bp.add
select_help = Select a building on the left or use + to add one. The donor is asked first, the Workshop id may stay empty; name and lines follow on the right.
select_help_key = bp.select_help
id_label = Object name
id_label_key = bp.id
id_help = Names the folder and the object of the generated building, and shows up in the log. Letters, digits, _ and - only, at most 64 characters; it cannot be changed later.
id_help_key = bp.id.help
save_warning = Changes are written to the effective buildings_plus.ini only when saved and take effect after a complete game restart. The plugin then writes the folder under media_soviet\workshop_wip; a section with an error is skipped and named in the log.
save_warning_key = bp.save_warning
summary = donor|id
note = At most 256 buildings.
note_key = bp.list.note
; 0.5.8: one row per building instead of a list beside a detail panel - switch, name, the
; values below, the state and the buttons. The fields live in the dialog behind "Change...".
style = cards
new_title = New building
new_title_key = bp.card.new
title = bp_name
subtitle = bp_id|bp_donor
toggle = bp_enabled
state = buildings_plus
actions = edit|open|delete

[new]
name_label = Object name
name_label_key = bp.new_name
hint = Spaces turn into underscores, capitals into lower case.
hint_key = bp.new_hint

[global]
tab = general
order = 10
label = Generated folders
label_key = bp.card.folders

[detail:prune]
scope = global
section = buildings_plus
key = prune
type = boolean
label = Clean up folders
label_key = bp.prune
description = ON removes the generated folder of a building you deleted or switched off at the next game start (only folders this plugin wrote).\nOFF leaves such folders in place; the game keeps loading those buildings.
description_key = bp.prune.description
order = 10

[detail:always]
scope = global
section = buildings_plus
key = always
type = boolean
card = log
label = Always rewrite
label_key = bp.always
description = ON writes every building folder at every game start.\nOFF writes a folder only when its section, the plugin or a donor file changed. Keep it OFF.
description_key = bp.always.description
order = 20

[detail:verbose]
scope = global
section = buildings_plus
key = verbose
type = boolean
card = log
label = Detailed log
label_key = bp.verbose
description = ON writes every copied file and every removed donor line to logs\tesmioloader.buildings_plus.log.\nOFF writes results, warnings and errors only.
description_key = bp.verbose.description
order = 30

[detail:repair_owner_ids]
scope = global
section = buildings_plus
key = repair_owner_ids
type = boolean
default = 1
label = Fill in the owner id
label_key = bp.repair_owner_ids
description = ON fills your Steam id into generated buildings that carry none, the ones of another generator included. Without it the game asks about missing Workshop items every time you load a saved game that uses such a building.\nOFF leaves folders of other generators alone.
description_key = bp.repair_owner_ids.description
order = 5

[detail:retrofit_storages]
scope = global
section = buildings_plus
key = retrofit_storages
type = boolean
default = 1
card = saves
label = Keep storages of buildings that already stand in step
label_key = bp.retrofit
description = ON: when you load a saved game, every finished generated building gets the single-resource storages you added to its section, empty. When you change the size in a storage line, the storage changes too; a smaller size waits until the stock fits. A storage whose line you removed leaves the buildings again as soon as it is empty.\nOFF: storages of buildings that already stand stay as they are; new and changed lines only reach buildings you build afterwards.
description_key = bp.retrofit.description
order = 10

[detail:bp_enabled]
scope = item
key = enabled
type = boolean
position = above_id
default = 1
label = Building enabled
label_key = bp.enabled
description = ON generates this building at the next game start.\nOFF does not generate it. With “Clean up folders” enabled, its existing folder is removed at the next start.
description_key = bp.enabled.description
order = 10

[detail:bp_id]
scope = item
key = id
type = text
maximum_length = 10
unique = 1
assigned_from = build:plugins\buildings_plus.ids.ini|ids
dialog = 1
label = Workshop id
label_key = bp.item_id
description = Own number possible: 9000000000 to 9999999999, except 9100000000 to 9199999999 (left free for other generators)\nIt names the folder under workshop_wip in the game folder and should not be changed afterwards.
description_key = bp.item_id.description
empty_hint = the plugin assigns the next free number from 9300000000 at game start.
empty_hint_key = bp.item_id.empty
order = 20

[detail:bp_donor]
scope = item
key = donor
type = text
maximum_length = 193
picker = game_donor
reference = game_donor
dialog = 1
label = Donor building
label_key = bp.donor
description = The building the copy starts from - a Workshop building has to be subscribed.\nUse "Choose donor..." to browse what you have. Match the kind: a mine for a mine, a factory for a factory, a shop for a shop.
description_key = bp.donor.description
order = 30

[detail:bp_name]
scope = item
key = name
type = text
maximum_length = 128
label = Name in the game
label_key = bp.item_name
description = The name shown in the game.\nA value with dots counts as a translation key and is resolved through the Localization plugin, for example: localization.lang.salt_mine
description_key = bp.item_name.description
empty_hint = the object name - not recommended.
empty_hint_key = bp.item_name.empty
order = 50

[detail:bp_desc]
scope = item
key = desc
type = lines
maximum_length = 4096
label = Description
label_key = bp.desc
description = The description of the Workshop entry, one line per row. No quotes.
description_key = bp.desc.description
order = 60

[detail:bp_line]
scope = item
key = line
type = lines
card = lines
picker = donor_lines
label = building.ini lines
label_key = bp.line
description = One building.ini line per row, for example $PRODUCTION raw_salt 1.0. Use "Choose line…" to take a line out of the donor building and adjust it. Your lines go in front of the donor's and replace: the same token; every $TYPE_*; every $STORAGE* together with $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION and $CONSUMPTION_PER_SECOND as one recipe. Everything else of the donor stays.\nFor your own resources always use $STORAGE_IMPORT_SPECIAL or $STORAGE_EXPORT_SPECIAL with the resource named, otherwise the storage lists every resource of the transport class.
description_key = bp.line.description
order = 70

[detail:bp_strip]
scope = item
key = strip
type = lines
card = lines
label = Remove donor lines
label_key = bp.strip
description = One $TOKEN per row, for example $WORKERS_NEEDED. Every donor line with that token is dropped without replacement.
description_key = bp.strip.description
order = 80

; The commands against the donor's building.ini - what the lines tab writes. A section that
; carries line or strip rows (the older way) keeps those and opens the older editor.
[detail:bp_add]
scope = item
key = add
type = lines
card = lines
label = Append
label_key = bp.cmd_add
description = One command per row: a new line, put in front of the closing end of the donor's file. A block of several lines is written with | between its lines.
description_key = bp.cmd_add.description
order = 72

[detail:bp_replace]
scope = item
key = replace
type = lines
card = lines
label = Replace
label_key = bp.cmd_replace
description = One command per row: old line | new line. The old line must stand exactly once in the donor's file.
description_key = bp.cmd_replace.description
order = 74

[detail:bp_remove]
scope = item
key = remove
type = lines
card = lines
label = Remove
label_key = bp.cmd_remove
description = One command per row: the line of the donor's file to take out. Lines that belong to it (points, position) go with it.
description_key = bp.cmd_remove.description
order = 76

[detail:bp_insert]
scope = item
key = insert
type = lines
card = lines
label = Insert
label_key = bp.cmd_insert
description = One command per row: 0 or 1 | anchor | new line. 0 puts the new line in front of the anchor, 1 behind it.
description_key = bp.cmd_insert.description
order = 78

[detail:bp_life]
scope = item
key = life
type = integer
minimum = 1
maximum = 1000000
step = 500
label = Life
label_key = bp.life
description = Empty = 3000\nLIFE in renderconfig.ini: how much the building can take before it collapses. Like most game buildings.
description_key = bp.life.description
order = 90

; The second tab of the change dialog: the building.ini lines of the declaration.
[card:lines]
tab = buildings
label = Lines
label_key = bp.card.lines
order = 90
editor = donor_lines
lines = bp_line
strip = bp_strip
add = bp_add
replace = bp_replace
remove = bp_remove
insert = bp_insert

; The switch for buildings of a saved game has its own card between the two.
[card:saves]
tab = general
label = Saved games
label_key = bp.card.saves
description = A saved game remembers the storages of every building that stands. This is how a new storage line of one of your buildings still reaches those buildings.
description_key = bp.card.saves.description
order = 15

; The log switches sit in their own card next to the folder switches on the General tab.
[card:log]
tab = general
label = Troubleshooting
label_key = bp.card.log
order = 20
