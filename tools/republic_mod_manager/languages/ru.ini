target_class_note = Внимание: {0} не подходит для {1} — такой склад в игре вмещает 0 тонн. Используй {2}.
target_hint_command = Выбрана команда. Измени её строку внизу и нажми «Изменить» — команда останется на месте. «Удалить команду» уберёт её полностью.
target_hint_change = «Изменить» запишет строку внизу в выбранную команду. Другие кнопки вместо этого создают новую команду.
target_remove = Удалить
target_picked_caption = Выбранная строка
target_picked_none = (пока нет — нажми строку в списке выше)
target_new_caption = Новая строка / строки
target_new_note = Разделяй строки клавишей Enter — каждая станет отдельной командой.
target_remove_picked = Удалить строку
target_drop = Удалить команду
target_hint_start = Нажми строку в списке выше, чтобы изменить, удалить её или вставить что-то до либо после неё. Или напиши новую строку и добавь в конец файла кнопкой «Дописать».
target_hint_picked = Выбрана строка. Напиши новую внизу или двойным нажатием скопируй выбранную и измени только значение. «Удалить строку» уберёт выбранную строку.
target_hint_ready = «Заменить» поменяет выбранную строку на новую. «Перед» и «После» поместят новую строку выше или ниже выбранной. «Дописать» добавит её в конец файла.
target_hint_typed = «Дописать» добавит новую строку в конец файла. Для «Заменить», «Перед» и «После» сначала нажми строку в списке выше.
target_hint_typed_link = «Дописать» добавит новое соединение после последнего соединения файла.
target_hint_link_picked = Выбрано соединение — токен и точки связаны. Напиши новое соединение внизу (двойное нажатие копирует выбранное) и нажми «Заменить» либо убери его кнопкой «Удалить строку».
target_hint_link_ready = «Заменить» поменяет выбранное соединение на новое. «Дописать» добавит новое соединение отдельно.
target_hint_many_typed = «Дописать» добавит каждую из этих строк в конец файла отдельной командой в указанном порядке. Для «Заменить», «Перед» и «После» сначала нажми строку в списке выше.
target_hint_many_ready = Несколько строк: «Заменить» поменяет выбранную строку на первую и поместит остальные ниже неё. «Перед» и «После» поместят все строки выше или ниже выбранной. «Дописать» добавит их в конец файла.
target_chain_exists = Строка "{0}" уже есть в файле. Таким способом нельзя вставить за ней ещё одну — нажми её в списке выше и используй «После».
target_chain_exists_other = Строка "{0}" уже есть в целевом файле {1}. Следующая строка оказалась бы там не на том месте — создавай строки по одной и проверяй их расположение в виде «Результат».
clone_problem_empty_field = Между двумя | чего-то не хватает — у каждой | должна быть строка с обеих сторон.
clone_problem_insert_form = Вставка записывается так: 0 или 1 | опорная строка | новая строка.
clone_problem_remove_second = Удаление принимает один блок — второе поле, начинающееся с $, стало бы вторым блоком.
clone_problem_replace_form = Замена записывается так: старая строка | новая строка. Новая должна начинаться с $TOKEN.
clone_problem_new_missing = Отсутствует новая строка. Она должна начинаться с $TOKEN.
clone_problem_many = Эта строка встречается в образце {0} раз. Добавь её строки данных как дополнительные поля, чтобы указать нужную.
clone_problem_taken = Предыдущая команда уже заменяет или удаляет эту строку. На одно место допускается только одна команда — удали одну из двух.
clone_problem_made_many = Предыдущие команды записывают эту строку {0} раз. Добавь её строки данных как дополнительные поля, чтобы указать нужную.
clone_donor_missing = Образца {0} нет на этом компьютере. Без его файла здесь нельзя создавать команды.
clone_result_blocked = Результат: пока команда красная, плагин вообще не записывает это здание — поэтому здесь неизменённый образец.
clone_pick = Выбери строку образца слева или команду справа. Здесь показано, что она делает с файлом.
clone_new_note = Разделяй строки клавишей Enter — каждая строка, начинающаяся с $, станет отдельной командой; строки без $ относятся к строке выше.
clone_problem_where = Пока эта команда не подходит, здание не записывается.
clone_hint_need_token = Новая строка должна начинаться с $TOKEN. Следующие строки под ней (точки, положение) относятся к ней.
clone_hint_no_anchor = Эта строка не может быть опорной. Нажми строку, начинающуюся с $, или "end", чтобы вставить перед ней.
clone_hint_end = Это конец файла. «Перед» поместит новую строку прямо перед ним; «Дописать» делает то же самое.
target_pick = Выбери строку целевого файла слева или команду справа. Здесь показано, что она делает с этим файлом.
target_need_line = Слева выбери строку целевого файла, которую хочешь изменить.
target_need_new = Напиши новую строку внизу. Она должна отличаться от выбранной.
target_effect_add = Дописывается в конец файла.
target_effect_own = Привязано к строке, которую создаёт предыдущая команда этого набора правил.
target_effect_at = Соответствует строке {0}:
target_problem_where = Команда отклоняется для этой цели; остальные цели обрабатываются дальше.
target_problem_no_token = Строка должна начинаться с $TOKEN.
target_problem_block = Многострочные записи вроде $CONNECTION или $PARTICLE работают только через команды соединений.
target_problem_cost = Строки $COST_ нельзя дописывать — используй «Вставить» со строкой $COST_WORK в качестве опорной.
target_problem_cost_work_geometry = Строки $COST_WORK_* нельзя задавать отдельно.
target_problem_cost_work = Фазу $COST_WORK нельзя удалить отдельно.
target_problem_cost_anchor = Для $COST_RESOURCE_AUTO нужна строка $COST_WORK в качестве опорной.
target_problem_exists = Эта строка уже есть в файле.
target_problem_missing = Этой строки нет в файле.
target_problem_many = Эта строка встречается в файле {0} раз — опорная строка должна быть уникальной.
target_problem_same = Старая и новая строки совпадают.
target_problem_replace_form = Замена требует ровно две части: старая строка | новая строка.
target_problem_insert_form = Вставка требует ровно три части: 0 или 1 | опорная строка | новая строка.
target_problem_position = Позиция должна быть 0 (перед) или 1 (после).
target_problem_end_after = После конца ничего быть не может — используй позицию 0.
target_spread_rule = Работает только для {0} из {1} целевых файлов. Команда не подходит файлам, отмеченным красным (x) в списке выше, — набор правил ничего в них не меняет.
target_spread_all = Подходит для всех {1} целевых файлов.
target_spread_some = Подходит только для {0} из {1} целевых файлов — остальные из-за этого теряют ВЕСЬ набор правил.
target_spread_first = Первый неподходящий: {0}
target_kind_add_connection = Дописать соединение
target_kind_replace_connection = Заменить соединение
target_kind_remove_connection = Удалить соединение
target_link_pick = Соединение обрабатывается как блок — нажми одну из его строк слева.
target_link_need_new = Напиши новое соединение внизу: строку токена и точки под ней.
target_link_no_insert = Соединение нельзя вставить между другими — оно всегда дописывается после последнего.
target_problem_link_form = Команде соединения нужны токен и точка, для двухточечного соединения — две точки.
target_problem_link_token = Это должен быть токен $CONNECTION_....
target_problem_link_new_token = Новый токен должен быть токеном $CONNECTION_....
target_problem_link_point = Точке соединения нужны ровно три числа.
target_problem_link_equal = Две точки соединения не должны совпадать.
target_problem_link_exists = Это соединение уже есть в файле.
target_problem_link_missing = Этого соединения нет в файле.
target_problem_link_allowpass = *_ALLOWPASS не принимается по соображениям безопасности.
target_view_original = Оригинал
target_view_result = Результат
target_view_read_only = Результат: здесь нельзя ничего менять, это предварительный просмотр.
target_result_blocked = Результат: пока команда красная, плагин ничего не записывает для этого файла, поэтому здесь неизменённый оригинал.
target_problem_no_end = У этого целевого файла нет завершающей строки "end" — плагин отклоняет его целиком.
status_files_workshop = Workshop
status_files_workshop_tip = DLL находится в папке Steam Workshop: {0} — Steam поддерживает её актуальной. Твои значения хранятся отдельно в user_config.
startcheck_dependency_off = {0} требует {1}, который выключен.
startcheck_dependency_version = {0} требует {1} в другой версии.
startcheck_from_workshop = из Workshop
startcheck_replacement = {0} заменяет {1}, но оба включены. RMM выключает {1} при запуске.
startcheck_same_key = {0} существует несколько раз. Загружается: {1}
startcheck_rule_spread = {0}, набор правил {1}: работает только для {2} из {3} зданий. Команда не подходит остальным, поэтому набор ничего в них не меняет (первое: {4}). Игра всё равно запускается.
catalog_duplicate_id = ID пакета встречается несколько раз: {0}. Сначала реши, какой пакет оставить.
catalog_path_too_long = Путь слишком длинный, загрузчик пропускает этот плагин: {0}
err_manifest_plugin_fehlt = Манифест указывает плагин "{0}", но в пакете нет такой DLL.
err_mehrere_plugin_dlls = В пакете {0} DLL плагинов. Манифест должен указать нужную через [mod] plugin.
err_ordner_ohne_plugin = В этой папке нет DLL плагина.
hint_content_extra = Пакет также содержит содержимое ({0}). RMM не предоставляет его для пакета с DLL.
hint_content_package = Пакет содержимого без DLL: {0}.
hint_replaces = Заменяет плагин {0}. Если включить этот, RMM выключит {0} при сохранении.
hint_same_key = Эта DLL существует несколько раз. Загрузчик выбирает {0} и пропускает: {1}
loader_no_overlay = Этот tesmioloader.dll не знает о твоих значениях в user_config. Поэтому для плагинов других авторов изменения не действуют. Используй tesmioloader.dll из пакета RMM.
note_local_ini_removed = {0} записан старой версией RMM и будет удалён при сохранении. Его значения останутся как твои собственные.
note_local_ini_shadows = В папке загрузчика есть {0}. Некоторые плагины читают этот файл вместо INI в папке Workshop, и обновления автора до них не доходят. Удали его, если ты не создавал его сам.
replaced_by_on = {0} заменяет {1} и включён. Вместе они не работают: при следующем запуске через RMM {1} будет выключен.
replacement_open = {0} заменяет {1}, но оба включены. При следующем запуске через RMM {1} будет выключен.
replacement_settled = {1} выключен, поскольку его заменяет {0}.
unmet_intro = Этим плагинам не хватает необходимых компонентов:
unmet_question = Выключить эти плагины перед запуском через RMM: {0}? Позже их можно снова включить.
unmet_switch_off = Выключить и запустить
unmet_start_anyway = Всё равно запустить
unmet_switched_off = {0} выключен перед запуском, поскольку отсутствует нужный компонент.
workshop_root_mismatch = Загрузчик ищет плагины в {0}, но RMM показывает {1}. Показанное здесь может отличаться от того, что загружает игра. Укажи в RMM ту же папку Workshop.
