content_card_vehicles = Производство транспорта
content_vehicles_line = Производство транспорта → плагин vehicle_materials: {0}
content_vehicles_help = Этот пакет может сделать {0} материалом для производства транспорта. Тогда каждому транспортному заводу понадобится и {0}, иначе он ничего не построит. Для этого нужен плагин Vehicle Materials. Выбери сам и сохрани:
content_vehicles_on = ON: для производства транспорта нужен {0}
content_vehicles_off = OFF: транспорт производится как раньше
content_vehicles_own = Ты уже сам добавил {0} в Vehicle Materials. Там действуют твои значения. Даже если выбрать здесь OFF, производство транспорта продолжит требовать {0}, пока ты не удалишь запись на странице Vehicle Materials.
content_vehicles_list = ON добавляет {0} со значениями пакета в список Vehicle Materials. Там можно менять значения, как у любой своей записи. OFF снова удаляет запись, как и кнопка корзины. Если удалить запись там вручную, эта карточка затем покажет OFF.
vehicle_packages_note = Добавлено пакетами содержимого: {0}. Числа относятся к дороге / железной дороге / судам / самолётам. Этих материалов нет в здешнем списке. Они включаются ON или OFF на странице пакета (карточка «Производство транспорта»). Материал, добавленный здесь самостоятельно, сохраняет твои значения.
vehicle_list_off = В твоём списке есть {0}, но «Плагин включён» ещё не стоит на ON. Тогда производство транспорта ничего из этого не расходует; плагин только убирает старые склады. Поставь «Плагин включён» на ON на вкладке «Общие» и сохрани.
content_vehicles_active = Включено: транспортные заводы расходуют {0}.
content_vehicles_trouble_undecided = Пока не выбрано. Пока ты не выберешь здесь ON или OFF и не сохранишь, производство транспорта не использует {0}, а RMM спрашивает перед каждым запуском игры.
content_vehicles_trouble_missing = Выбрано ON, но плагина Vehicle Materials нет. Поэтому транспорт не использует {0}. Подпишись на Vehicle Materials в Workshop.
content_vehicles_trouble_off = Выбрано ON, но плагин Vehicle Materials выключен. Поэтому транспорт не использует {0}. Включи его в списке слева.
content_vehicles_trouble_disabled = Выбрано ON, но в настройках Vehicle Materials «Плагин активен» установлен на OFF. Поэтому транспорт не использует {0}. Установи там ON.
content_vehicles_storage = При ON транспортные заводы игры также получают склад для {0}. Это делает плагин Vanilla Buildings: там появляется набор правил этого пакета, а при OFF снова исчезает. Внимание: склад получат только заводы, построенные позже. Уже существующие заводы его не получат и с ON перестанут производить транспорт.
content_vehicles_trouble_nostorage = Выбрано ON, но плагин Vanilla Buildings отсутствует или выключен. Поэтому у транспортных заводов нет склада для {0}, и они ничего не производят. Подпишись на Vanilla Buildings и включи его либо выбери здесь OFF.
startcheck_vehicles_nostorage = {0}: производство транспорта — ON, но Vanilla Buildings отсутствует или выключен. У заводов нет склада для {1}, и они ничего не производят.
startcheck_vehicles_undecided = {0}: настройка производства транспорта ещё не выбрана. Транспорт не использует {1}. Выбери ON или OFF на странице пакета.
startcheck_vehicles_missing = {0}: производство транспорта — ON, но Vehicle Materials отсутствует. Транспорт не использует {1}.
startcheck_vehicles_off = {0}: производство транспорта — ON, но Vehicle Materials выключен. Транспорт не использует {1}.
startcheck_vehicles_disabled = {0}: производство транспорта — ON, но твои настройки Vehicle Materials указывают OFF. Транспорт не использует {1}.
startcheck_content_gone = {0} больше не в подписках, но всё ещё подключён. Его ресурсы и здания остаются в игре, чтобы твои сохранения продолжали загружаться. Чтобы избавиться от него: подпишись снова и выключи его на его странице.
startcheck_content_gone_vehicles = {0} больше не в подписках, но всё ещё подключён. Его ресурсы и здания остаются в игре, чтобы твои сохранения продолжали загружаться, а транспорту по-прежнему нужно: {1}. Чтобы избавиться от него: подпишись снова и выключи его на его странице. Только материал: удали его из списка Vehicle Materials.
