content_vehicles_line = Výroba vozidiel → plugin vehicle_materials: {0}
content_vehicles_help = Tento balíček môže urobiť z {0} materiál na výrobu vozidiel. Každá továreň na vozidlá potom potrebuje aj {0}, inak nič nevyrobí. Vyžaduje to plugin Vehicle Materials. Vyber si a ulož:
content_vehicles_on = ON: výroba vozidiel potrebuje {0}
content_vehicles_off = OFF: vozidlá sa vyrábajú ako predtým
content_vehicles_own = {0} už máš vo Vehicle Materials zadané sám. Tam platia tvoje vlastné hodnoty. Aj pri tunajšom OFF bude výroba vozidiel naďalej potrebovať {0}, kým položku nevymažeš na stránke Vehicle Materials.
content_vehicles_list = ON zapíše {0} s hodnotami balíčka do zoznamu Vehicle Materials. Hodnoty tam môžeš meniť ako pri vlastnej položke. OFF položku opäť odoberie, rovnako ako tamojší kôš. Ak ju tam vymažeš sám, táto karta potom ukáže OFF.
vehicle_packages_note = Pridané balíčkami obsahu: {0}. Čísla sú pre cestu / železnicu / loď / lietadlo. Tieto materiály nie sú v tomto zozname. Zapínajú sa ON alebo OFF na stránke balíčka (karta „Výroba vozidiel“). Materiál, ktorý sem zadáš sám, si ponechá tvoje hodnoty.
vehicle_list_off = Tvoj zoznam obsahuje {0}, ale „Plugin zapnutý“ ešte nie je na ON. Výroba vozidiel z toho potom nič nespotrebuje; plugin len upratuje staré sklady. Na karte Všeobecné prepni „Plugin zapnutý“ na ON a ulož.
content_vehicles_active = Zapnuté: továrne na vozidlá spotrebúvajú {0}.
content_vehicles_trouble_undecided = Zatiaľ nerozhodnuté. Kým tu nevyberieš ON alebo OFF a neuložíš, výroba vozidiel nepoužíva {0} a RMM sa pýta pred každým spustením hry.
content_vehicles_trouble_missing = Je vybrané ON, ale plugin Vehicle Materials chýba. Vozidlá preto nepoužívajú {0}. Prihlás sa na odber Vehicle Materials vo Workshop.
content_vehicles_trouble_off = Je vybrané ON, ale plugin Vehicle Materials je vypnutý. Vozidlá preto nepoužívajú {0}. Zapni ho v zozname vľavo.
content_vehicles_trouble_disabled = Je vybrané ON, ale nastavenia Vehicle Materials majú „Plugin aktívny“ na OFF. Vozidlá preto nepoužívajú {0}. Nastav tam ON.
content_vehicles_storage = S ON dostanú továrne na vozidlá v hre aj sklad pre {0}. Zabezpečuje to plugin Vanilla Buildings: objaví sa tam súprava pravidiel tohto balíčka a s OFF opäť zmizne. Pozor: sklad dostanú iba továrne postavené neskôr. Už stojace továrne ho nedostanú a s ON prestanú vyrábať.
content_vehicles_trouble_nostorage = Je vybrané ON, ale plugin Vanilla Buildings chýba alebo je vypnutý. Továrne na vozidlá preto nemajú sklad pre {0} a nič nevyrábajú. Prihlás sa na odber Vanilla Buildings a zapni ho, alebo tu vyber OFF.
startcheck_vehicles_nostorage = {0}: výroba vozidiel je ON, ale Vanilla Buildings chýba alebo je vypnutý. Továrne nemajú sklad pre {1} a nič nevyrábajú.
startcheck_vehicles_undecided = {0}: o výrobe vozidiel sa zatiaľ nerozhodlo. Vozidlá nepoužívajú {1}. Vyber ON alebo OFF na stránke balíčka.
startcheck_vehicles_missing = {0}: výroba vozidiel je ON, ale Vehicle Materials chýba. Vozidlá nepoužívajú {1}.
startcheck_vehicles_off = {0}: výroba vozidiel je ON, ale Vehicle Materials je vypnutý. Vozidlá nepoužívajú {1}.
