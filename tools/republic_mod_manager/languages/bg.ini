target_hint_command = Избрана е команда. Промени реда ѝ долу и натисни „Промени“ — командата остава на мястото си. „Изтрий команда“ я премахва изцяло.
target_hint_change = „Промени“ записва долния ред в избраната команда. Другите бутони вместо това създават нова команда.
