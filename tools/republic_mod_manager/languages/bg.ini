target_problem_no_token = Редът трябва да започва с $TOKEN.
target_problem_block = Многоредови записи като $CONNECTION или $PARTICLE работят само чрез командите за връзки.
target_problem_cost = Редове $COST_ не могат да се добавят накрая — използвай вмъкване с опорен ред $COST_WORK.
target_problem_cost_work_geometry = Редовете $COST_WORK_* не могат да се задават самостоятелно.
