target_drop = Изтрий команда
target_hint_start = Избери ред горе, за да го промениш, премахнеш или поставиш нещо преди или след него. Или напиши нов ред и го добави в края на файла с „Добави накрая“.
target_hint_picked = Избран е ред. Напиши новия ред долу — или копирай избрания с двойно натискане и промени само стойността. „Премахни ред“ премахва избрания ред.
target_hint_ready = „Замени“ сменя избрания ред с новия. „Преди“ и „След“ поставят новия ред над или под избрания. „Добави накрая“ го добавя в края на файла.
target_hint_typed = „Добави накрая“ добавя новия ред в края на файла. За „Замени“, „Преди“ и „След“ първо избери ред от списъка горе.
target_hint_typed_link = „Добави накрая“ добавя новата връзка след последната връзка във файла.
target_hint_link_picked = Избрана е връзка — токенът и точките са едно цяло. Напиши новата връзка долу (двойно натискане копира избраната) и натисни „Замени“, или я премахни с „Премахни ред“.
target_hint_link_ready = „Замени“ сменя избраната връзка с новата. „Добави накрая“ добавя и новата.
target_hint_many_typed = „Добави накрая“ добавя всеки от тези редове в края на файла като отделна команда, в този ред. За „Замени“, „Преди“ и „След“ първо избери ред от списъка горе.
target_hint_many_ready = Няколко реда: „Замени“ сменя избрания ред с първия и поставя останалите под него. „Преди“ и „След“ поставят всичките над или под избрания ред. „Добави накрая“ ги добавя в края на файла.
target_chain_exists = Редът "{0}" вече е във файла. Не може да се вмъкне следващ ред зад него по този начин — избери го горе и използвай „След“.
target_chain_exists_other = Редът "{0}" вече е в целевия файл {1}. Следващият ред би попаднал на грешно място там — създавай редовете един по един и проверявай позицията им в изгледа „Резултат“.
clone_problem_empty_field = Липсва нещо между две | — всяка | изисква ред от двете страни.
clone_problem_insert_form = Вмъкването се записва: 0 или 1 | опорен ред | нов ред.
clone_problem_remove_second = Премахването приема един блок — второ поле, започващо с $, би било втори блок.
clone_problem_replace_form = Замяната се записва: стар ред | нов ред. Новият трябва да започва с $TOKEN.
clone_problem_new_missing = Липсва новият ред. Трябва да започва с $TOKEN.
clone_problem_many = Този ред се среща {0} пъти в образеца. Добави редовете с данните му като допълнителни полета, за да уточниш кой се има предвид.
clone_problem_taken = По-ранна команда вече заменя или премахва този ред. Само една команда на място — изтрий едната от двете.
clone_problem_made_many = По-ранните команди записват този ред {0} пъти. Добави редовете с данните му като допълнителни полета, за да уточниш кой се има предвид.
clone_donor_missing = Образецът {0} не е на този компютър. Без файла му тук не могат да се създават команди.
clone_result_blocked = Резултат: докато команда е червена, плъгинът изобщо не записва тази сграда — затова това е непромененият образец.
clone_pick = Избери ред на образеца отляво или команда отдясно. Тук се описва какво прави тя с файла.
clone_new_note = Раздели няколко реда с Enter — всеки ред, започващ с $, става отделна команда; редовете без $ принадлежат на горния ред.
clone_problem_where = Докато тази команда не съответства, сградата не се записва.
clone_hint_need_token = Новият ред трябва да започва с $TOKEN. Следващите редове под него (точки, позиция) му принадлежат.
clone_hint_no_anchor = Този ред не може да е опорен. Избери ред, започващ с $, или "end", за да вмъкнеш преди него.
clone_hint_end = Това е краят на файла. „Преди“ поставя новия ред точно пред него; „Добави накрая“ прави същото.
target_pick = Избери ред на целевия файл отляво или команда отдясно. Тук се описва какво прави тя с този файл.
target_need_line = Избери отляво реда на целевия файл, който искаш да промениш.
target_need_new = Напиши новия ред долу. Не трябва да е същият като избрания.
