unmet_start_anyway = Все пак стартирай
unmet_switched_off = {0} е изключен за стартирането, защото му липсва нещо необходимо.
workshop_root_mismatch = Зареждащата програма търси плъгини в {0}, а RMM показва {1}. Показаното тук може да не съвпада със зареденото от играта. Задай същата папка Workshop в RMM.
