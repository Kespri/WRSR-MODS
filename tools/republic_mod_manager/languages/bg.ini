content_card_vehicles = Производство на превозни средства
content_vehicles_line = Производство на превозни средства → плъгин vehicle_materials: {0}
content_vehicles_help = Този пакет може да направи {0} материал за производство на превозни средства. Тогава всяка фабрика за превозни средства изисква и {0}, иначе не произвежда нищо. Нужен е плъгинът Vehicle Materials. Избери сам и запази:
content_vehicles_on = ON: за производството на превозни средства е нужен {0}
content_vehicles_off = OFF: превозните средства се произвеждат както преди
content_vehicles_own = Вече си добавил {0} в Vehicle Materials. Там важат твоите стойности. Дори тук да избереш OFF, производството продължава да изисква {0}, докато не изтриеш записа от страницата на Vehicle Materials.
content_vehicles_list = ON добавя {0} със стойностите от пакета в списъка на Vehicle Materials. Там можеш да ги променяш като всеки свой запис. OFF премахва записа, както кошчето там. Ако сам изтриеш записа там, тази карта после показва OFF.
vehicle_packages_note = Добавено от пакети със съдържание: {0}. Числата са за автомобилен / железопътен / корабен / въздушен транспорт. Тези материали не са в този списък. Включваш ги с ON или изключваш с OFF на страницата на пакета (карта „Производство на превозни средства“). Материал, който въведеш сам тук, запазва твоите стойности.
vehicle_list_off = Списъкът ти съдържа {0}, но „Плъгинът е включен“ още не е на ON. Тогава производството на превозни средства не използва нищо от тях; плъгинът само почиства старите складове. Включи „Плъгинът е включен“ на ON в раздела Общи и запази.
content_vehicles_active = Включено: фабриките за превозни средства изразходват {0}.
content_vehicles_trouble_undecided = Още няма решение. Докато не избереш ON или OFF тук и не запазиш, производството не използва {0}, а RMM пита преди всяко стартиране на играта.
content_vehicles_trouble_missing = Избрано е ON, но плъгинът Vehicle Materials липсва. Затова превозните средства не използват {0}. Абонирай се за Vehicle Materials в Workshop.
content_vehicles_trouble_off = Избрано е ON, но плъгинът Vehicle Materials е изключен. Затова превозните средства не използват {0}. Включи го в списъка отляво.
content_vehicles_trouble_disabled = Избрано е ON, но в настройките на Vehicle Materials „Плъгинът е активен“ е на OFF. Затова превозните средства не използват {0}. Задай ON там.
content_vehicles_storage = С ON фабриките за превозни средства на играта получават и склад за {0}. Това прави Vanilla Buildings: там се появява набор правила от пакета, а с OFF отново изчезва. Внимание: само фабрики, построени след това, имат склада. Съществуващите не го получават и с ON спират да произвеждат.
content_vehicles_trouble_nostorage = Избрано е ON, но Vanilla Buildings липсва или е изключен. Затова фабриките за превозни средства нямат склад за {0} и вече не произвеждат нищо. Абонирай се за Vanilla Buildings и го включи — или избери OFF тук.
startcheck_vehicles_nostorage = {0}: производството на превозни средства е ON, но Vanilla Buildings липсва или е изключен. Фабриките нямат склад за {1} и вече не произвеждат нищо.
startcheck_vehicles_undecided = {0}: още няма решение за производството на превозни средства. Не се използва {1}. Избери ON или OFF на страницата на пакета.
startcheck_vehicles_missing = {0}: производството на превозни средства е ON, но Vehicle Materials липсва. Превозните средства не използват {1}.
startcheck_vehicles_off = {0}: производството на превозни средства е ON, но Vehicle Materials е изключен. Превозните средства не използват {1}.
startcheck_vehicles_disabled = {0}: производството на превозни средства е ON, но настройките на Vehicle Materials са на OFF. Превозните средства не използват {1}.
startcheck_content_gone = {0} вече не е абониран, но все още е предоставен. Ресурсите и сградите му остават в играта, за да се зареждат запазените ти игри. За да се отървеш от него: абонирай се отново и го изключи на страницата му.
startcheck_content_gone_vehicles = {0} вече не е абониран, но все още е предоставен. Ресурсите и сградите му остават в играта, за да се зареждат запазените ти игри, а превозните средства все още се нуждаят от {1}. За да се отървеш от него: абонирай се отново и го изключи на страницата му. Само материала: изтрий го от списъка на Vehicle Materials.
launch_vehicles = При тези пакети производството на превозни средства още не използва ресурса:
launch_vehicles_hint = Отвори пакета в списъка, избери ON или OFF под „Производство на превозни средства“ и запази. След това RMM спира да пита.\n\n„Да“ все пак стартира играта, „Не“ отменя.
