loader_no_overlay = Този tesmioloader.dll не познава личните ти стойности в user_config. При плъгини от други автори промените ти тогава нямат ефект. Използвай tesmioloader.dll от пакета на RMM.
note_local_ini_removed = {0} е записан от по-стара версия на RMM и се премахва при запазване. Стойностите ти от него се запазват като лични.
note_local_ini_shadows = В папката на зареждащата програма има {0}. Някои плъгини четат този файл вместо INI в папката Workshop и обновяванията на автора не достигат до тях. Изтрий го, освен ако сам не си го създал.
replaced_by_on = {0} заменя {1} и е включен. Двата не работят заедно: при следващото стартиране чрез RMM {1} се изключва.
replacement_open = {0} заменя {1}, но и двата са включени. При следващото стартиране чрез RMM {1} се изключва.
replacement_settled = {1} е изключен, защото {0} го заменя.
unmet_intro = На тези плъгини им липсва нещо необходимо:
