content_vehicles_line = 车辆生产 → 插件 vehicle_materials：{0}
content_vehicles_help = 此安装包可将 {0} 设为生产车辆所需材料。此后，每座车辆工厂也需要 {0}，否则无法生产。这需要 Vehicle Materials 插件。请自行选择并保存：
content_vehicles_on = ON：生产车辆需要 {0}
content_vehicles_off = OFF：车辆照常生产
content_vehicles_own = 你已在 Vehicle Materials 中自行添加 {0}，其中的自定义值优先生效。即使这里选择 OFF，车辆生产仍需要 {0}，直到你在 Vehicle Materials 页面删除该条目。
content_vehicles_list = ON 使用安装包数值将 {0} 加入 Vehicle Materials 列表。你可像修改其他自定义条目一样修改数值。OFF 会移除条目，等同于点击那里的垃圾桶按钮。如果你自行在那里删除条目，此卡片之后会显示 OFF。
vehicle_packages_note = 内容包添加了：{0}。数字依次对应道路 / 铁路 / 船舶 / 飞机。这些材料不列在此列表中。请在安装包页面的“车辆生产”卡片中切换 ON 或 OFF。自行在此添加的材料会保留你的数值。
vehicle_list_off = 你的列表包含 {0}，但“启用插件”还没有设为 ON。这样车辆生产不会消耗其中任何一种；插件只会清理旧仓库。请在“常规”选项卡把“启用插件”设为 ON 并保存。
content_vehicles_active = 已开启：车辆工厂消耗 {0}。
content_vehicles_trouble_undecided = 尚未决定。在这里选择 ON 或 OFF 并保存之前，车辆生产不会使用 {0}，RMM 会在每次启动游戏前询问。
content_vehicles_trouble_missing = 已选择 ON，但缺少 Vehicle Materials 插件。因此车辆不使用 {0}。请在 Workshop 中订阅 Vehicle Materials。
content_vehicles_trouble_off = 已选择 ON，但 Vehicle Materials 插件已关闭。因此车辆不使用 {0}。请在左侧列表中开启它。
content_vehicles_trouble_disabled = 已选择 ON，但 Vehicle Materials 设置中的“启用插件”为 OFF。因此车辆不使用 {0}。请在那里设为 ON。
content_vehicles_storage = 选择 ON 后，游戏的车辆工厂还会获得 {0} 的存储空间。由 Vanilla Buildings 插件完成：此安装包的规则集会出现在那里，选择 OFF 后则移除。注意：只有之后建造的工厂才有该存储空间。现有工厂不会获得它，选择 ON 后将无法继续生产。
content_vehicles_trouble_nostorage = 已选择 ON，但 Vanilla Buildings 插件缺失或关闭。因此游戏的车辆工厂没有 {0} 的存储空间，无法继续生产。请订阅并开启 Vanilla Buildings，或在这里选择 OFF。
startcheck_vehicles_nostorage = {0}：车辆生产为 ON，但 Vanilla Buildings 缺失或关闭。车辆工厂没有 {1} 的存储空间，无法继续生产。
startcheck_vehicles_undecided = {0}：尚未决定车辆生产设置。车辆不使用 {1}。请在安装包页面选择 ON 或 OFF。
startcheck_vehicles_missing = {0}：车辆生产为 ON，但缺少 Vehicle Materials。车辆不使用 {1}。
startcheck_vehicles_off = {0}：车辆生产为 ON，但 Vehicle Materials 已关闭。车辆不使用 {1}。
startcheck_vehicles_disabled = {0}：车辆生产为 ON，但 Vehicle Materials 设置为 OFF。车辆不使用 {1}。
startcheck_content_gone = {0} 已不再订阅，但仍处于提供状态。它的资源和建筑会留在游戏中，以便你的存档继续能够加载。要移除它：重新订阅，然后在它的页面上将其关闭。
startcheck_content_gone_vehicles = {0} 已不再订阅，但仍处于提供状态。它的资源和建筑会留在游戏中，以便你的存档继续能够加载，车辆也仍需要 {1}。要移除它：重新订阅，然后在它的页面上将其关闭。只移除材料：在 Vehicle Materials 的列表中删除它。
