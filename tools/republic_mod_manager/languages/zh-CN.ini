replaced_by_on = {0} 已开启，并会替代 {1}。两者不会同时运行：下次通过 RMM 启动时将关闭 {1}。
replacement_open = {0} 替代 {1}，但两者都已开启。下次通过 RMM 启动时将关闭 {1}。
replacement_settled = 已关闭 {1}，因为 {0} 替代它。
unmet_intro = 以下插件缺少所需内容：
unmet_question = 启动前，是否让 RMM 关闭以下插件：{0}？以后可以重新开启。
unmet_switch_off = 关闭并启动
unmet_start_anyway = 仍然启动
unmet_switched_off = 已在启动前关闭 {0}，因为缺少所需内容。
workshop_root_mismatch = 加载器在 {0} 中查找插件，但 RMM 显示的是 {1}。这里显示的内容可能与游戏实际加载的不同。请在 RMM 中设置相同的 Workshop 文件夹。
