content_vehicles_off = OFF : les véhicules sont construits comme avant
content_vehicles_own = Tu as déjà saisi {0} dans Vehicle Materials. Tes valeurs personnelles y font foi. Même avec OFF choisi ici, la production de véhicules continue de nécessiter {0}, jusqu'à la suppression de l'entrée sur la page de Vehicle Materials.
content_vehicles_list = ON ajoute {0} avec les valeurs du paquet à la liste de Vehicle Materials. Tu peux y modifier les valeurs comme pour tes propres entrées. OFF retire l'entrée, comme la corbeille à cet endroit. Si tu supprimes l'entrée toi-même là-bas, cette carte affiche ensuite OFF.
vehicle_packages_note = Ajouté par des paquets de contenu : {0}. Les nombres correspondent à route / rail / navire / avion. Ces matériaux ne figurent pas dans cette liste. Tu les passes sur ON ou OFF sur la page du paquet (carte « Production de véhicules »). Un matériau que tu saisis ici toi-même conserve tes valeurs.
vehicle_list_off = Ta liste contient {0}, mais « Extension activée » n'est pas encore sur ON. La production de véhicules n'en utilise donc rien ; l'extension ne fait que ranger les anciens stockages. Mets « Extension activée » sur ON dans l'onglet Général et enregistre.
content_vehicles_active = Activé : les usines de véhicules consomment {0}.
content_vehicles_trouble_undecided = Pas encore décidé. Tant que tu n'as pas choisi ON ou OFF ici puis enregistré, la production de véhicules n'utilise pas {0}, et RMM demande avant chaque démarrage du jeu.
content_vehicles_trouble_missing = ON est choisi, mais le plugin Vehicle Materials est absent. Les véhicules n'utilisent donc pas {0}. Abonne-toi à Vehicle Materials dans le Workshop.
content_vehicles_trouble_off = ON est choisi, mais le plugin Vehicle Materials est désactivé. Les véhicules n'utilisent donc pas {0}. Active-le dans la liste à gauche.
content_vehicles_trouble_disabled = ON est choisi, mais « Plugin actif » est sur OFF dans tes réglages de Vehicle Materials. Les véhicules n'utilisent donc pas {0}. Mets-le sur ON là-bas.
content_vehicles_storage = Avec ON, les usines de véhicules du jeu reçoivent aussi un stockage pour {0}. Le plugin Vanilla Buildings s'en charge : un jeu de règles de ce paquet y apparaît, puis disparaît avec OFF. Attention : seules les usines construites ensuite auront ce stockage. Les usines existantes ne le reçoivent pas et ne produisent plus rien avec ON.
content_vehicles_trouble_nostorage = ON est choisi, mais le plugin Vanilla Buildings est absent ou désactivé. Les usines de véhicules du jeu n'ont donc aucun stockage pour {0} et ne produisent plus rien. Abonne-toi à Vanilla Buildings et active-le, ou choisis OFF ici.
startcheck_vehicles_nostorage = {0} : la production de véhicules est sur ON, mais Vanilla Buildings est absent ou désactivé. Les usines de véhicules n'ont aucun stockage pour {1} et ne produisent plus rien.
startcheck_vehicles_undecided = {0} : la production de véhicules n'est pas encore décidée. Les véhicules n'utilisent pas {1}. Choisis ON ou OFF sur la page du paquet.
startcheck_vehicles_missing = {0} : la production de véhicules est sur ON, mais Vehicle Materials est absent. Les véhicules n'utilisent pas {1}.
startcheck_vehicles_off = {0} : la production de véhicules est sur ON, mais Vehicle Materials est désactivé. Les véhicules n'utilisent pas {1}.
startcheck_vehicles_disabled = {0} : la production de véhicules est sur ON, mais tes réglages de Vehicle Materials indiquent OFF. Les véhicules n'utilisent pas {1}.
startcheck_content_gone = {0} n'est plus abonné, mais reste fourni. Ses ressources et bâtiments restent dans le jeu pour que tes sauvegardes continuent de se charger. Pour t'en débarrasser : abonne-toi de nouveau et désactive-le sur sa page.
startcheck_content_gone_vehicles = {0} n'est plus abonné, mais reste fourni. Ses ressources et bâtiments restent dans le jeu pour que tes sauvegardes continuent de se charger, et les véhicules ont toujours besoin de {1}. Pour t'en débarrasser : abonne-toi de nouveau et désactive-le sur sa page. Seulement le matériau : supprime-le dans la liste de Vehicle Materials.
