content_vehicles_line = Production de véhicules → plugin vehicle_materials : {0}
content_vehicles_help = Ce paquet peut faire de {0} un matériau de production des véhicules. Chaque usine de véhicules aura alors aussi besoin de {0}, sinon elle ne produira rien. Cela nécessite le plugin Vehicle Materials. Fais ton choix et enregistre :
