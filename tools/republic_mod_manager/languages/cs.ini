content_vehicles_line = Výroba vozidel → plugin vehicle_materials: {0}
content_vehicles_help = Tento balíček může udělat z {0} materiál pro výrobu vozidel. Každá továrna na vozidla pak potřebuje i {0}, jinak nic nevyrobí. Je k tomu potřeba plugin Vehicle Materials. Vyber si a ulož:
content_vehicles_on = ON: výroba vozidel potřebuje {0}
content_vehicles_off = OFF: vozidla se vyrábějí jako dřív
content_vehicles_own = {0} už máš ve Vehicle Materials zadané sám. Tam platí tvoje hodnoty. I při zdejším OFF bude výroba vozidel dál potřebovat {0}, dokud položku nesmažeš na stránce Vehicle Materials.
content_vehicles_list = ON zapíše {0} s hodnotami balíčku do seznamu Vehicle Materials. Hodnoty tam můžeš měnit jako u vlastní položky. OFF položku zase odebere, stejně jako tamní koš. Pokud ji tam smažeš sám, tato karta potom ukáže OFF.
vehicle_packages_note = Přidáno balíčky obsahu: {0}. Čísla jsou pro silnici / železnici / loď / letadlo. Tyto materiály nejsou v tomto seznamu. Zapínají se ON nebo OFF na stránce balíčku (karta „Výroba vozidel“). Materiál, který sem zadáš sám, si ponechá tvoje hodnoty.
vehicle_list_off = Tvůj seznam obsahuje {0}, ale „Plugin zapnutý“ ještě není na ON. Výroba vozidel z toho pak nic nespotřebuje; plugin jen uklízí staré sklady. Na kartě Obecné přepni „Plugin zapnutý“ na ON a ulož.
content_vehicles_active = Zapnuto: továrny na vozidla spotřebovávají {0}.
content_vehicles_trouble_undecided = Zatím nerozhodnuto. Dokud zde nevybereš ON nebo OFF a neuložíš, výroba vozidel nepoužívá {0} a RMM se ptá před každým spuštěním hry.
content_vehicles_trouble_missing = Je vybráno ON, ale plugin Vehicle Materials chybí. Vozidla proto nepoužívají {0}. Přihlas se k odběru Vehicle Materials ve Workshop.
content_vehicles_trouble_off = Je vybráno ON, ale plugin Vehicle Materials je vypnutý. Vozidla proto nepoužívají {0}. Zapni ho v seznamu vlevo.
content_vehicles_trouble_disabled = Je vybráno ON, ale nastavení Vehicle Materials má „Plugin aktivní“ na OFF. Vozidla proto nepoužívají {0}. Nastav tam ON.
content_vehicles_storage = S ON dostanou továrny na vozidla ve hře také sklad pro {0}. Zajišťuje to plugin Vanilla Buildings: objeví se tam sada pravidel tohoto balíčku a s OFF zase zmizí. Pozor: sklad dostanou jen továrny postavené později. Už stojící továrny ho nedostanou a s ON přestanou vyrábět.
content_vehicles_trouble_nostorage = Je vybráno ON, ale plugin Vanilla Buildings chybí nebo je vypnutý. Továrny na vozidla proto nemají sklad pro {0} a nic nevyrábějí. Přihlas se k odběru Vanilla Buildings a zapni ho, nebo zde vyber OFF.
startcheck_vehicles_nostorage = {0}: výroba vozidel je ON, ale Vanilla Buildings chybí nebo je vypnutý. Továrny nemají sklad pro {1} a nic nevyrábějí.
startcheck_vehicles_undecided = {0}: o výrobě vozidel zatím nebylo rozhodnuto. Vozidla nepoužívají {1}. Vyber ON nebo OFF na stránce balíčku.
startcheck_vehicles_missing = {0}: výroba vozidel je ON, ale Vehicle Materials chybí. Vozidla nepoužívají {1}.
