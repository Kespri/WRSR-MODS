content_vehicles_off = OFF: vehiculele sunt construite ca înainte
content_vehicles_own = Ai introdus deja {0} în Vehicle Materials. Acolo se aplică valorile tale. Chiar cu OFF ales aici, producția de vehicule continuă să necesite {0} până ștergi intrarea de pe pagina Vehicle Materials.
