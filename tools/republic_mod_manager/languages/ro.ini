content_vehicles_help = Acest pachet poate face din {0} un material pentru producția de vehicule. Fiecare fabrică de vehicule va avea nevoie și de {0}, altfel nu va produce nimic. Este necesar pluginul Vehicle Materials. Alege și salvează:
