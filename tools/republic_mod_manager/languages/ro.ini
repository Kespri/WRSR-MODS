content_vehicles_storage = Cu ON, fabricile de vehicule din joc primesc și un depozit pentru {0}. Pluginul Vanilla Buildings face asta: un set de reguli al acestui pachet apare acolo, iar cu OFF dispare. Atenție: numai fabricile construite ulterior vor avea depozitul. Fabricile existente nu îl primesc și nu mai produc nimic cu ON.
content_vehicles_trouble_nostorage = ON este ales, dar pluginul Vanilla Buildings lipsește sau este dezactivat. Fabricile de vehicule din joc nu au deci depozit pentru {0} și nu mai produc nimic. Abonează-te la Vanilla Buildings și activează-l, sau alege OFF aici.
