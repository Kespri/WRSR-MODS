vehicle_packages_note = Adăugate de pachete de conținut: {0}. Numerele corespund cu rutier / feroviar / navă / avion. Aceste materiale nu sunt în lista de aici. Le setezi pe ON sau OFF pe pagina pachetului (cardul „Producția de vehicule”). Un material introdus de tine aici îți păstrează valorile.
vehicle_list_off = Lista ta conține {0}, dar „Plugin activat” nu este încă pe ON. Astfel, producția de vehicule nu folosește nimic din ele; pluginul doar curăță depozitele vechi. Pune „Plugin activat” pe ON în fila General și salvează.
content_vehicles_active = Activat: fabricile de vehicule consumă {0}.
content_vehicles_trouble_undecided = Încă nehotărât. Până alegi ON sau OFF aici și salvezi, producția de vehicule nu folosește {0}, iar RMM întreabă înainte de fiecare pornire a jocului.
