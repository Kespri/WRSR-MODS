content_conflict = Nie można tak udostępnić "{0}": masz już {1} w grze ({3}, wtyczka {2}). Twój wpis ma pierwszeństwo, więc nic nie zostanie zapisane ani skopiowane do vfs. Najpierw usuń {1} – własny wpis w RMM na stronie wtyczki {2}, oryginalny bezpośrednio w plugins\{2}.ini – potem ponownie włącz „Udostępniaj w grze”.
