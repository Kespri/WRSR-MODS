loader_no_overlay = Ten tesmioloader.dll nie zna twoich wartości w user_config. Dla wtyczek innych autorów twoje zmiany nie mają wtedy efektu. Użyj tesmioloader.dll z pakietu RMM.
note_local_ini_removed = {0} został zapisany przez starszą wersję RMM i zostanie usunięty przy zapisie. Jego wartości pozostaną jako twoje własne.
note_local_ini_shadows = Folder programu ładującego zawiera {0}. Niektóre wtyczki czytają ten plik zamiast INI w folderze Workshop, przez co aktualizacje autora nie docierają. Usuń go, chyba że utworzyłeś go samodzielnie.
replaced_by_on = {0} zastępuje {1} i jest włączone. Nie działają razem: przy następnym uruchomieniu przez RMM {1} zostanie wyłączone.
replacement_open = {0} zastępuje {1}, ale oba są włączone. Przy następnym uruchomieniu przez RMM {1} zostanie wyłączone.
replacement_settled = Wyłączono {1}, ponieważ zastępuje je {0}.
unmet_intro = Tym wtyczkom brakuje wymaganych składników:
unmet_question = Czy RMM ma wyłączyć te wtyczki na czas uruchomienia: {0}? Możesz je później włączyć ponownie.
unmet_switch_off = Wyłącz i uruchom
unmet_start_anyway = Uruchom mimo to
unmet_switched_off = Wyłączono {0} na czas uruchomienia, ponieważ brakuje wymaganego składnika.
workshop_root_mismatch = Program ładujący szuka wtyczek w {0}, ale RMM pokazuje {1}. To, co tu widzisz, może nie odpowiadać temu, co ładuje gra. Ustaw w RMM ten sam folder Workshop.
