startcheck_rule_spread = {0}, zestaw reguł {1}: działa tylko dla {2} z {3} budynków. Polecenie nie pasuje do pozostałych, więc zestaw nic w nich nie zmieni (pierwszy: {4}). Gra mimo to się uruchomi.
catalog_duplicate_id = ID pakietu występuje więcej niż raz: {0}. Najpierw zdecyduj, który pakiet zostaje.
