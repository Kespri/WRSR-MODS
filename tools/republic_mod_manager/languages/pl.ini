content_vehicles_line = Produkcja pojazdów → wtyczka vehicle_materials: {0}
content_vehicles_help = Ten pakiet może uczynić {0} materiałem do produkcji pojazdów. Każda fabryka pojazdów będzie wtedy potrzebować również {0}, inaczej nic nie zbuduje. Wymaga to wtyczki Vehicle Materials. Wybierz i zapisz:
content_vehicles_on = ON: budowa pojazdów wymaga {0}
content_vehicles_off = OFF: pojazdy powstają jak wcześniej
content_vehicles_own = Masz już własny wpis {0} w Vehicle Materials. Obowiązują tam twoje wartości. Nawet po wybraniu tutaj OFF produkcja pojazdów nadal wymaga {0}, dopóki nie usuniesz wpisu na stronie Vehicle Materials.
content_vehicles_list = ON wpisuje {0} z wartościami pakietu na listę Vehicle Materials. Możesz tam zmieniać wartości jak we własnych wpisach. OFF usuwa wpis tak samo jak tamtejszy kosz. Jeśli sam usuniesz tam wpis, ten kafelek pokaże później OFF.
vehicle_packages_note = Dodane przez pakiety zawartości: {0}. Liczby dotyczą dróg / kolei / statków / samolotów. Tych materiałów nie ma na tutejszej liście. Przełączasz je na ON lub OFF na stronie pakietu (kafelek „Produkcja pojazdów”). Materiał wpisany tu samodzielnie zachowuje twoje wartości.
vehicle_list_off = Twoja lista zawiera {0}, ale „Wtyczka włączona” nie jest jeszcze na ON. Produkcja pojazdów nie zużywa wtedy nic z tego; wtyczka tylko porządkuje stare magazyny. Na karcie Ogólne ustaw „Wtyczka włączona” na ON i zapisz.
content_vehicles_active = Włączone: fabryki pojazdów zużywają {0}.
content_vehicles_trouble_undecided = Jeszcze nie wybrano. Dopóki nie wybierzesz tutaj ON lub OFF i nie zapiszesz, produkcja pojazdów nie używa {0}, a RMM pyta przed każdym uruchomieniem gry.
content_vehicles_trouble_missing = Wybrano ON, ale brakuje wtyczki Vehicle Materials. Pojazdy nie zużywają więc {0}. Zasubskrybuj Vehicle Materials w Workshop.
content_vehicles_trouble_off = Wybrano ON, ale wtyczka Vehicle Materials jest wyłączona. Pojazdy nie zużywają więc {0}. Włącz ją na liście po lewej.
content_vehicles_trouble_disabled = Wybrano ON, ale w ustawieniach Vehicle Materials „Wtyczka aktywna” jest na OFF. Pojazdy nie zużywają więc {0}. Ustaw tam ON.
content_vehicles_storage = Przy ON fabryki pojazdów w grze otrzymują też magazyn na {0}. Zapewnia to wtyczka Vanilla Buildings: pojawia się tam zestaw reguł tego pakietu, a przy OFF znika. Uwaga: magazyn otrzymują tylko fabryki zbudowane później. Istniejące fabryki go nie dostają i przy ON przestają cokolwiek produkować.
