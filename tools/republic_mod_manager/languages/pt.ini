content_vehicles_storage = Com ON, as fábricas de veículos do jogo também recebem um depósito para {0}. O plugin Vanilla Buildings faz isso: um conjunto de regras deste pacote aparece lá e desaparece com OFF. Atenção: só fábricas construídas depois recebem o depósito. As fábricas existentes não o recebem e deixam de produzir com ON.
