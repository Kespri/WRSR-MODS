vehicle_packages_note = Adicionados por pacotes de conteúdo: {0}. Os números correspondem a rodoviário / ferroviário / navio / avião. Estes materiais não estão nesta lista. Você escolhe ON ou OFF na página do pacote (cartão “Produção de veículos”). Um material que você inserir aqui mantém seus valores.
