content_card_vehicles = Производња возила
content_vehicles_line = Производња возила → додатак vehicle_materials: {0}
content_vehicles_help = Овај пакет може да учини {0} материјалом за производњу возила. Свака фабрика возила тада захтева и {0}, иначе ништа не производи. За ово је потребан додатак Vehicle Materials. Сам изабери и сачувај:
content_vehicles_on = ON: возилима је за производњу потребно {0}
content_vehicles_off = OFF: возила се производе као раније
content_vehicles_own = Већ сам наводиш {0} у Vehicle Materials. Тамо важе твоје вредности. Чак и ако овде изабереш OFF, производњи возила и даље треба {0}, док не обришеш унос на страници Vehicle Materials.
content_vehicles_list = ON додаје {0} са вредностима пакета на списак Vehicle Materials. Тамо их можеш мењати као сваки свој унос. OFF поново уклања унос, као дугме корпе тамо. Ако га тамо сам обришеш, ова картица после показује OFF.
vehicle_packages_note = Додато пакетима садржаја: {0}. Бројеви су за друмски / железнички / бродски / авионски превоз. Ови материјали нису на овдашњем списку. Укључујеш их са ON или искључујеш са OFF на страници пакета (картица „Производња возила“). Материјал који овде сам унесеш задржава твоје вредности.
vehicle_list_off = Твоја листа садржи {0}, али „Додатак укључен“ још није на ON. Тада производња возила ништа од тога не троши; додатак само рашчишћава старе магацине. На картици Опште стави „Додатак укључен“ на ON и сачувај.
content_vehicles_active = Укључено: фабрике возила троше {0}.
content_vehicles_trouble_undecided = Још није одлучено. Док овде не изабереш ON или OFF и сачуваш, производња возила не користи {0}, а RMM пита пре сваког покретања игре.
content_vehicles_trouble_missing = Изабрано је ON, али нема додатка Vehicle Materials. Зато возила не користе {0}. Претплати се на Vehicle Materials у Workshop.
content_vehicles_trouble_off = Изабрано је ON, али је додатак Vehicle Materials искључен. Зато возила не користе {0}. Укључи га на списку лево.
content_vehicles_trouble_disabled = Изабрано је ON, али у подешавањима Vehicle Materials „Додатак активан“ стоји на OFF. Зато возила не користе {0}. Постави га на ON тамо.
content_vehicles_storage = Уз ON фабрике возила у игри добијају и складиште за {0}. То ради додатак Vanilla Buildings: скуп правила овог пакета појављује се тамо, а уз OFF поново нестаје. Пази: само фабрике које изградиш касније добијају складиште. Већ изграђене га не добијају и уз ON више ништа не производе.
content_vehicles_trouble_nostorage = Изабрано је ON, али Vanilla Buildings недостаје или је искључен. Фабрике возила зато немају складиште за {0} и више ништа не производе. Претплати се на Vanilla Buildings и укључи га, или овде изабери OFF.
startcheck_vehicles_nostorage = {0}: производња возила је ON, али Vanilla Buildings недостаје или је искључен. Фабрике возила немају складиште за {1} и више ништа не производе.
startcheck_vehicles_undecided = {0}: још није одлучено о производњи возила. Возила не користе {1}. Изабери ON или OFF на страници пакета.
startcheck_vehicles_missing = {0}: производња возила је ON, али Vehicle Materials недостаје. Возила не користе {1}.
startcheck_vehicles_off = {0}: производња возила је ON, али Vehicle Materials је искључен. Возила не користе {1}.
startcheck_vehicles_disabled = {0}: производња возила је ON, али подешавања Vehicle Materials су OFF. Возила не користе {1}.
startcheck_content_gone = {0} више није претплаћен, али је и даље обезбеђен. Његови ресурси и зграде остају у игри да би се твоје сачуване игре и даље учитавале. Да га се ослободиш: поново се претплати и искључи га на његовој страници.
startcheck_content_gone_vehicles = {0} више није претплаћен, али је и даље обезбеђен. Његови ресурси и зграде остају у игри да би се твоје сачуване игре и даље учитавале, а возилима и даље треба {1}. Да га се ослободиш: поново се претплати и искључи га на његовој страници. Само материјал: обриши га са листе Vehicle Materials.
launch_vehicles = За ове пакете производња возила још не користи ресурс:
launch_vehicles_hint = Отвори пакет на списку и изабери ON или OFF под „Производња возила“, затим сачувај. RMM после тога престаје да пита.\n\n„Да“ ипак покреће игру, „Не“ отказује.
