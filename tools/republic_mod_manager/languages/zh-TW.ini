clone_pick = 選擇左側的範本行或右側的命令，這裡會說明它對檔案的作用。
clone_new_note = 用 Enter 分隔多行。每個以 $ 開頭的行會成為獨立命令；不含 $ 的行屬於上一行。
clone_problem_where = 只要此命令仍不適用，就不會寫入該建築。
clone_hint_need_token = 新行必須以 $TOKEN 開頭。下方的其他行（點、位置）屬於它。
clone_hint_no_anchor = 此行不能用作錨點。請點選以 $ 開頭的行，或點選 "end" 在其前面插入。
clone_hint_end = 這是檔案末尾。“之前”將新行放在它的正前方，“追加”作用相同。
target_pick = 選擇左側目標檔案中的行，或右側的命令，這裡會說明它對該檔案的作用。
target_need_line = 在左側選擇要修改的目標檔案行。
target_need_new = 在下方填寫新行，不能與所選行相同。
target_effect_add = 追加到檔案末尾。
target_effect_own = 接在此規則集前一條命令生成的行之後。
target_effect_at = 符合第 {0} 行：
target_problem_where = 此目標拒絕該命令，其他目標繼續處理。
target_problem_no_token = 此行必須以 $TOKEN 開頭。
target_problem_block = $CONNECTION 或 $PARTICLE 等多行條目只能通過連接命令處理。
target_problem_cost = 無法追加 $COST_ 行。請使用插入，並以 $COST_WORK 行作為錨點。
target_problem_cost_work_geometry = $COST_WORK_* 行不能單獨設定。
target_problem_cost_work = 無法單獨移除 $COST_WORK 階段。
target_problem_cost_anchor = $COST_RESOURCE_AUTO 需要以 $COST_WORK 行作為錨點。
target_problem_exists = 檔案中已存在此行。
target_problem_missing = 檔案中不存在此行。
target_problem_many = 此行在檔案中出現 {0} 次；錨點必須唯一。
target_problem_same = 舊行與新行相同。
target_problem_replace_form = 替換恰好需要兩部分：舊行 | 新行。
target_problem_insert_form = 插入恰好需要三部分：0 或 1 | 錨點 | 新行。
target_problem_position = 位置必須為 0（之前）或 1（之後）。
target_problem_end_after = 檔案結束標記後不能新增內容，請使用位置 0。
target_spread_rule = 僅適用於 {0} / {1} 個目標檔案。某條命令不適用於上方清單中標紅 (x) 的目標，因此規則集不會修改這些檔案。
target_spread_all = 適用於全部 {1} 個目標檔案。
target_spread_some = 僅適用於 {0} / {1} 個目標檔案，其餘目標會因此完全失去整個規則集的修改。
target_spread_first = 首個不符合的目標：{0}
target_kind_add_connection = 追加連接
target_kind_replace_connection = 替換連接
target_kind_remove_connection = 移除連接
target_link_pick = 連接按整個區塊處理，請點選左側其中的一行。
target_link_need_new = 在下方填寫新連接：標記行及其下方的點。
target_link_no_insert = 無法插入連接；連接始終追加在最後一個連接之後。
target_problem_link_form = 連接命令需要一個標記和一個點；雙點連接則需要兩個點。
target_problem_link_token = 此處必須使用 $CONNECTION_... 標記。
target_problem_link_new_token = 新標記必須為 $CONNECTION_... 標記。
target_problem_link_point = 一個連接點必須恰好包含三個數值。
target_problem_link_equal = 同一連接的兩個點不能相同。
target_problem_link_exists = 檔案中已存在此連接。
target_problem_link_missing = 檔案中不存在此連接。
target_problem_link_allowpass = 出於安全原因，不接受 *_ALLOWPASS。
target_view_original = 原始內容
target_view_result = 結果
target_view_read_only = 結果：此處僅供預覽，無法修改。
target_result_blocked = 結果：只要仍有一條命令標紅，外掛就不會向此檔案寫入任何內容，因此這裡顯示未變更的原始檔案。
target_problem_no_end = 目標檔案缺少結束行 "end"，外掛會拒絕整個檔案。
status_files_workshop = Workshop
status_files_workshop_tip = DLL 位於 Steam Workshop 資料夾：{0}，Steam 會負責更新。自訂值與它分開，儲存在 user_config 中。
startcheck_dependency_off = {0} 需要 {1}，但它已關閉。
startcheck_dependency_version = {0} 需要其他版本的 {1}。
startcheck_from_workshop = 來自 Workshop
startcheck_replacement = {0} 替代 {1}，但兩者都已開啟。RMM 會在啟動時關閉 {1}。
startcheck_same_key = {0} 存在多次。載入：{1}
startcheck_rule_spread = {0}，規則集 {1}：僅適用於 {2} / {3} 座建築。某條命令不適用於其他建築，因此規則集不會修改它們（首個：{4}）。遊戲仍會啟動。
catalog_duplicate_id = 套件 ID 出現多次：{0}。請先決定保留哪個套件。
catalog_path_too_long = 路徑過長，載入器將跳過此外掛：{0}
err_manifest_plugin_fehlt = 清單指定了外掛“{0}”，但套件中沒有對應 DLL。
err_mehrere_plugin_dlls = 套件中有 {0} 個外掛 DLL。清單必須通過 [mod] plugin 指定使用哪一個。
err_ordner_ohne_plugin = 此資料夾中沒有外掛 DLL。
hint_content_extra = 套件還包含內容（{0}）。對於帶 DLL 的套件，RMM 不會提供其中的內容。
hint_content_package = 不含 DLL 的內容套件：{0}。
hint_replaces = 替代外掛 {0}。開啟此外掛後，RMM 會在儲存時關閉 {0}。
hint_same_key = 此 DLL 存在多份。載入器使用 {0}，並跳過：{1}
loader_no_overlay = 此 tesmioloader.dll 無法辨識 user_config 中的自訂值。因此，對其他作者外掛所作的變更不會生效。請使用 RMM 套件中的 tesmioloader.dll。
note_local_ini_removed = {0} 由舊版 RMM 寫入，儲存時會移除。其中的值會保留為自訂值。
note_local_ini_shadows = 載入器資料夾中有 {0}。部分外掛會讀取此檔案，而非 Workshop 資料夾中的 INI，導致作者的更新無法生效。除非此檔案是你自行建立的，否則請刪除它。
replaced_by_on = {0} 已開啟，並會替代 {1}。兩者不會同時執行：下次通過 RMM 啟動時將關閉 {1}。
replacement_open = {0} 替代 {1}，但兩者都已開啟。下次通過 RMM 啟動時將關閉 {1}。
replacement_settled = 已關閉 {1}，因為 {0} 替代它。
unmet_intro = 以下外掛缺少所需內容：
unmet_question = 啟動前，是否讓 RMM 關閉以下外掛：{0}？以後可以重新開啟。
unmet_switch_off = 關閉並啟動
unmet_start_anyway = 仍然啟動
unmet_switched_off = 已在啟動前關閉 {0}，因為缺少所需內容。
workshop_root_mismatch = 載入器在 {0} 中查找外掛，但 RMM 顯示的是 {1}。這裡顯示的內容可能與遊戲實際載入的不同。請在 RMM 中設定相同的 Workshop 資料夾。
