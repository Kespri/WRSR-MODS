content_vehicles_line = Produzione di veicoli → plugin vehicle_materials: {0}
content_vehicles_help = Questo pacchetto può rendere {0} un materiale per la produzione di veicoli. Ogni fabbrica di veicoli richiederà anche {0}, altrimenti non produrrà nulla. Serve il plugin Vehicle Materials. Scegli tu e salva:
