startcheck_content_gone = {0} non è più sottoscritto, ma è ancora fornito. Le sue risorse e i suoi edifici restano nel gioco, così i tuoi salvataggi continuano a caricarsi. Per toglierlo: iscriviti di nuovo e disattivalo nella sua pagina.
