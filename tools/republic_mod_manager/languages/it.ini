content_vehicles_off = OFF: i veicoli vengono costruiti come prima
content_vehicles_own = Hai già inserito {0} personalmente in Vehicle Materials. Lì valgono i tuoi valori. Anche scegliendo OFF qui, la produzione di veicoli continuerà a richiedere {0} finché non elimini la voce nella pagina di Vehicle Materials.
content_vehicles_list = ON inserisce {0} con i valori del pacchetto nell'elenco di Vehicle Materials. Puoi modificarli lì come per ogni tua voce. OFF rimuove la voce, come il cestino in quella pagina. Se la elimini tu direttamente lì, questa scheda mostrerà OFF.
vehicle_packages_note = Aggiunti dai pacchetti di contenuti: {0}. I numeri corrispondono a strada / ferrovia / nave / aereo. Questi materiali non sono nell'elenco qui. Puoi attivarli con ON o disattivarli con OFF nella pagina del pacchetto (scheda “Produzione di veicoli”). Un materiale inserito personalmente qui mantiene i tuoi valori.
vehicle_list_off = La tua lista contiene {0}, ma «Plugin abilitato» non è ancora su ON. Così la produzione di veicoli non ne usa nulla; il plugin si limita a ripulire i vecchi magazzini. Imposta «Plugin abilitato» su ON nella scheda Generale e salva.
content_vehicles_active = Attivato: le fabbriche di veicoli consumano {0}.
content_vehicles_trouble_undecided = Non ancora deciso. Finché non scegli ON o OFF qui e salvi, la produzione di veicoli non usa {0} e RMM chiede prima di ogni avvio del gioco.
content_vehicles_trouble_missing = È selezionato ON, ma manca il plugin Vehicle Materials. I veicoli non usano quindi {0}. Iscriviti a Vehicle Materials nel Workshop.
content_vehicles_trouble_off = È selezionato ON, ma il plugin Vehicle Materials è disattivato. I veicoli non usano quindi {0}. Attivalo nell'elenco a sinistra.
content_vehicles_trouble_disabled = È selezionato ON, ma nelle impostazioni di Vehicle Materials “Plugin attivo” è su OFF. I veicoli non usano quindi {0}. Impostalo su ON lì.
content_vehicles_storage = Con ON, le fabbriche di veicoli del gioco ricevono anche un deposito per {0}. Se ne occupa Vanilla Buildings: vi compare un gruppo di regole di questo pacchetto, che scompare con OFF. Attenzione: solo le fabbriche costruite in seguito avranno il deposito. Quelle esistenti non lo ricevono e con ON non producono più nulla.
content_vehicles_trouble_nostorage = È selezionato ON, ma il plugin Vanilla Buildings manca o è disattivato. Le fabbriche di veicoli del gioco non hanno quindi un deposito per {0} e non producono più nulla. Iscriviti a Vanilla Buildings e attivalo, oppure scegli OFF qui.
