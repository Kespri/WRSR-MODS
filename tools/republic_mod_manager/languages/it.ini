resource_start_blocked = Il gioco non si avvierà finché questi conflitti tra risorse non saranno risolti:
content_package = Pacchetto di contenuti: risorse, giacimenti, bisogni o edifici come sezioni INI più file, senza una DLL propria. Con l'interruttore sopra, RMM unisce le voci nei plugin Resources, Deposits Plus, Needs e Buildings Plus e copia i file in tesmioloader\vfs. Le voci già esistenti non vengono toccate; disattivandolo, tutto viene rimosso di nuovo.
