content_vehicles_storage = ON이면 게임의 차량 공장에 {0}용 창고도 생깁니다. Vanilla Buildings가 담당하며 그곳에 패키지 규칙 모음이 나타나고 OFF면 사라집니다. 주의: 이후 건설하는 공장에만 창고가 생깁니다. 이미 있는 공장에는 생기지 않으므로 ON이면 더는 생산하지 못합니다.
