content_vehicles_help = 이 패키지는 {0}을 차량 생산 재료로 만들 수 있습니다. 그러면 모든 차량 공장에 {0}이 추가로 필요하며, 없으면 생산하지 못합니다. Vehicle Materials 플러그인이 필요합니다. 직접 선택하고 저장하세요:
content_vehicles_on = ON: 차량 생산에 {0}이 필요함
content_vehicles_off = OFF: 기존처럼 차량 생산
content_vehicles_own = Vehicle Materials에 이미 직접 {0}을 등록했습니다. 그곳의 사용자 값이 우선합니다. 여기서 OFF를 골라도 Vehicle Materials 페이지에서 항목을 삭제할 때까지 차량 생산에는 {0}이 필요합니다.
content_vehicles_list = ON은 패키지의 값으로 {0}을 Vehicle Materials 목록에 넣습니다. 다른 사용자 항목처럼 그곳에서 값을 바꿀 수 있습니다. OFF는 그곳의 휴지통 버튼처럼 항목을 제거합니다. 직접 그곳에서 삭제하면 이 카드도 OFF로 표시됩니다.
vehicle_packages_note = 콘텐츠 패키지가 추가한 재료: {0}. 수치는 도로 / 철도 / 선박 / 항공기 순서입니다. 이 재료는 여기 목록에 없습니다. 패키지 페이지의 '차량 생산' 카드에서 ON 또는 OFF로 설정하세요. 여기에 직접 등록한 재료는 사용자 값을 유지합니다.
vehicle_list_off = 목록에 {0}이(가) 있지만 '플러그인 활성화'가 아직 ON이 아닙니다. 이 상태에서는 차량 생산에 아무것도 사용되지 않으며, 플러그인은 오래된 창고만 정리합니다. '일반' 탭에서 '플러그인 활성화'를 ON으로 바꾸고 저장하세요.
content_vehicles_active = 켜짐: 차량 공장이 {0}을 소비합니다.
