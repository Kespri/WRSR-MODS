content_vehicles_help = Bu paket {0} kaynağını araç üretimi için malzeme yapabilir. Böylece her araç fabrikası ayrıca {0} gerektirir; yoksa hiçbir şey üretemez. Bunun için Vehicle Materials eklentisi gerekir. Kendin seç ve kaydet:
content_vehicles_on = ON: araç üretmek için {0} gerekir
content_vehicles_off = OFF: araçlar eskisi gibi üretilir
content_vehicles_own = {0} kaynağını Vehicle Materials içine zaten kendin eklemişsin. Orada kendi değerlerin geçerlidir. Burada OFF seçsen bile araç üretimi {0} gerektirmeye devam eder; Vehicle Materials sayfasındaki girdiyi silene kadar.
content_vehicles_list = ON, {0} kaynağını paketin değerleriyle Vehicle Materials listesine ekler. Değerleri orada kendi girdilerin gibi değiştirebilirsin. OFF, oradaki çöp kutusu gibi girdiyi kaldırır. Orada girdiyi kendin silersen bu kart daha sonra OFF gösterir.
vehicle_packages_note = İçerik paketleri tarafından eklendi: {0}. Sayılar karayolu / demiryolu / gemi / uçak içindir. Bu malzemeler burada listelenmez. Paketin sayfasında (“Araç üretimi” kartı) ON veya OFF seçersin. Buraya kendin girdiğin malzeme, kendi değerlerini korur.
vehicle_list_off = Listende {0} var, ancak "Eklenti etkin" henüz ON değil. Bu durumda araç üretimi bunlardan hiçbirini kullanmaz; eklenti yalnızca eski depoları toplar. Genel sekmesinde "Eklenti etkin" ayarını ON yap ve kaydet.
content_vehicles_active = Açık: araç fabrikaları {0} tüketir.
content_vehicles_trouble_undecided = Henüz karar verilmedi. Burada ON veya OFF seçip kaydetmediğin sürece araç üretimi {0} kullanmaz ve RMM her oyun başlangıcından önce sorar.
content_vehicles_trouble_missing = ON seçili ama Vehicle Materials eklentisi yok. Bu nedenle araçlar {0} kullanmaz. Workshop üzerinden Vehicle Materials eklentisine abone ol.
content_vehicles_trouble_off = ON seçili ama Vehicle Materials eklentisi kapalı. Bu nedenle araçlar {0} kullanmaz. Soldaki listeden aç.
content_vehicles_trouble_disabled = ON seçili ama Vehicle Materials ayarlarında “Eklenti etkin” OFF konumunda. Bu nedenle araçlar {0} kullanmaz. Orada ON yap.
content_vehicles_storage = ON ile oyunun araç fabrikaları {0} için depo da alır. Bunu Vanilla Buildings eklentisi yapar: paketin kural kümesi orada görünür, OFF ile yeniden kaldırılır. Dikkat: depoyu yalnızca bundan sonra inşa ettiğin fabrikalar alır. Mevcut fabrikalar almaz ve ON ile artık hiçbir şey üretemez.
content_vehicles_trouble_nostorage = ON seçili ama Vanilla Buildings eksik veya kapalı. Bu nedenle araç fabrikalarının {0} deposu yok ve artık hiçbir şey üretemezler. Vanilla Buildings eklentisine abone olup aç veya burada OFF seç.
