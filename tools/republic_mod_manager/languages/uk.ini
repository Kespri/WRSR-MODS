content_shared_from = Зараз будівлю {0} надає «{1}». Якщо вимкнеш «{1}», цей пакет продовжить надавати її з тим самим номером, тож збережені ігри й далі завантажуватимуться.
content_shared_differs = Увага: «{1}» надає будівлю {0} в іншій версії. Гра використовує версію з «{1}», доки його ввімкнено.
