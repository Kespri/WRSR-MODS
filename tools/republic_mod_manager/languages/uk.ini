target_kind_replace_connection = Замінити з'єднання
target_kind_remove_connection = Вилучити з'єднання
target_link_pick = З'єднання обробляється блоком — натисни один із його рядків ліворуч.
target_link_need_new = Напиши нове з'єднання нижче: рядок токена й точки під ним.
target_link_no_insert = З'єднання не можна вставити — воно завжди додається після останнього.
target_problem_link_form = Команда з'єднання потребує токена й точки; двоточкове потребує двох точок.
target_problem_link_token = Тут потрібен токен виду $CONNECTION_...
