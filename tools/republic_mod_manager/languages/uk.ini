status_files_workshop_tip = DLL у папці Steam Workshop: {0}. Steam підтримує її актуальною. Власні значення зберігаються окремо в user_config.
startcheck_dependency_off = {0} потребує {1}, який вимкнено.
startcheck_dependency_version = {0} потребує іншої версії {1}.
startcheck_from_workshop = із Workshop
startcheck_replacement = {0} замінює {1}, але обидва ввімкнено. RMM вимкне {1} під час запуску.
startcheck_same_key = {0} трапляється кілька разів. Завантажено: {1}
startcheck_rule_spread = {0}, набір правил {1}: діє лише для {2} із {3} будівель. Команда не підходить решті, тому набір нічого там не змінить (перша: {4}). Гра все одно запуститься.
catalog_duplicate_id = ID пакета трапляється кілька разів: {0}. Спершу виріши, який пакет залишити.
catalog_path_too_long = Шлях задовгий, завантажувач пропускає плагін: {0}
err_manifest_plugin_fehlt = Маніфест називає плагін «{0}», але в пакеті немає такої DLL.
err_mehrere_plugin_dlls = Пакет містить {0} DLL плагінів. Маніфест має вказати потрібну через [mod] plugin.
err_ordner_ohne_plugin = У цій папці немає DLL плагіна.
hint_content_extra = Пакет також містить вміст ({0}). RMM не надає його для пакета з DLL.
hint_content_package = Пакет вмісту без DLL: {0}.
hint_replaces = Замінює плагін {0}. Якщо ввімкнеш цей, RMM вимкне {0} під час збереження.
hint_same_key = Ця DLL трапляється кілька разів. Завантажувач бере {0} й пропускає: {1}
loader_no_overlay = Цей tesmioloader.dll не знає власних значень у user_config. Для плагінів інших авторів твої зміни не діятимуть. Використай tesmioloader.dll із пакета RMM.
note_local_ini_removed = {0} записано старою версією RMM, його буде вилучено під час збереження. Його значення залишаться як власні.
note_local_ini_shadows = У папці завантажувача є {0}. Деякі плагіни читають цей файл замість INI в папці Workshop, тому оновлення автора не доходять. Видали його, якщо не створював сам.
replaced_by_on = {0} замінює {1} і ввімкнений. Вони не працюють разом: під час наступного запуску через RMM {1} буде вимкнено.
replacement_open = {0} замінює {1}, але обидва ввімкнено. Під час наступного запуску через RMM {1} буде вимкнено.
replacement_settled = {1} вимкнено, бо його замінює {0}.
unmet_intro = Цим плагінам бракує потрібних складників:
unmet_question = Чи має RMM вимкнути ці плагіни перед запуском: {0}? Пізніше їх можна ввімкнути знову.
unmet_switch_off = Вимкнути й запустити
unmet_start_anyway = Усе одно запустити
unmet_switched_off = {0} вимкнено перед запуском, бо бракує потрібних складників.
workshop_root_mismatch = Завантажувач шукає плагіни в {0}, але RMM показує {1}. Показане тут може відрізнятися від того, що завантажує гра. Задай у RMM ту саму папку Workshop.
