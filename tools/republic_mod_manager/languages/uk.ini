content_conflict = «{0}» не можна надати так: у грі вже є {1} ({3}, плагін {2}). Власний запис має перевагу, тому нічого не записується й не копіюється у vfs. Спочатку прибери {1}: власний запис у RMM на сторінці {2} або оригінальний запис безпосередньо в plugins\{2}.ini. Потім знову ввімкни «Надавати у грі».
