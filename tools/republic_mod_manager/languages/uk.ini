donor_hint_start = Натисни рядок зразка ліворуч і зміни його нижче або введи власний. «Додати» помістить його до твоїх рядків.
donor_hint_typed = «Додати» помістить новий рядок до твоїх. Поле внизу праворуч покаже, що він прибирає зі зразка.
donor_hint_donor = Вибрано рядок зразка. Зміни значення нижче й натисни «Додати» — поле внизу праворуч покаже, що твій рядок прибирає зі зразка. «Прибрати рядок» повністю вилучає це налаштування зі зразка.
donor_hint_mine = Вибрано твій рядок. Зміни текст нижче й натисни «Замінити». «Вилучити» праворуч прибере його знову.
donor_hint_mine_changed = «Замінити» замінює вибраний рядок новим. «Додати» додає новий окремо.
donor_hint_strip = Цей запис прибирає зі зразка рядки з цим $TOKEN; які саме, показано внизу праворуч. «Вилучити» праворуч прибере запис знову.
