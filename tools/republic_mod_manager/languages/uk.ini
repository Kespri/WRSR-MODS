target_hint_command = Вибрано команду. Зміни її рядок нижче й натисни «Змінити» — команда залишиться на місці. «Видалити команду» прибирає її повністю.
target_hint_change = «Змінити» записує рядок нижче у вибрану команду. Інші кнопки натомість створюють нову команду.
target_remove = Вилучити
