donor_effect_help = Вибери рядок зразка ліворуч або свій праворуч. Тут показано, що він вилучає зі зразка.
donor_effect_drops = Вилучає зі зразка:
donor_effect_none = Нічого не вилучає — зразок не має цього токена. Твій рядок додається до його рядків.
donor_needs_token = Перший рядок блоку потребує $TOKEN. Рядки без нього належать до рядка вище.
donor_warn_no_storage = $RESOURCE_VISUALIZATION {0} не вказує на сховище — їх лише {1}.
donor_warn_water_first = Показується сховище {0}, але вода чи стоки йдуть раніше. Гра створює їх лише за потреби — постав їх у кінець списку сховищ.
