target_picked_none = (ще немає — натисни рядок у списку вище)
target_new_caption = Новий рядок / рядки
target_new_note = Розділяй кілька рядків клавішею Enter — кожен стане окремою командою.
target_remove_picked = Вилучити рядок
target_drop = Видалити команду
target_hint_start = Натисни рядок у списку вище, щоб змінити, вилучити його чи вставити щось перед або після. Або введи новий рядок і додай у кінець файлу через «Додати в кінець».
target_hint_picked = Рядок вибрано. Введи новий нижче або подвійним натисканням скопіюй вибраний униз і зміни лише значення. «Вилучити рядок» прибере вибраний рядок.
target_hint_ready = «Замінити» замінює вибраний рядок новим. «Перед» і «Після» ставлять новий над або під вибраним. «Додати в кінець» додає його в кінець файлу.
target_hint_typed = «Додати в кінець» додає новий рядок у кінець файлу. Для «Замінити», «Перед» і «Після» спочатку натисни рядок у списку вище.
target_hint_typed_link = «Додати в кінець» додає нове з'єднання після останнього з'єднання файлу.
target_hint_link_picked = Вибрано з'єднання — токен і точки утворюють єдиний блок. Введи нове з'єднання нижче (подвійне натискання копіює вибране вниз) і натисни «Замінити» або прибери його через «Вилучити рядок».
target_hint_link_ready = «Замінити» замінює вибране з'єднання новим. «Додати в кінець» додає нове окремо.
target_hint_many_typed = «Додати в кінець» додає кожен із цих рядків у кінець файлу як окрему команду в цьому порядку. Для «Замінити», «Перед» і «Після» спочатку натисни рядок у списку вище.
target_hint_many_ready = Кілька рядків: «Замінити» замінює вибраний першим і ставить інші під ним. «Перед» і «Після» ставлять усі над або під вибраним. «Додати в кінець» додає їх у кінець файлу.
target_chain_exists = Рядок «{0}» уже є у файлі. Так не можна вставити ще один після нього — натисни його у списку вище й скористайся «Після».
target_chain_exists_other = Рядок «{0}» уже є в цільовому файлі {1}. Наступний рядок потрапить не туди — створюй рядки по одному й перевіряй розташування у вигляді «Результат».
clone_problem_empty_field = Між двома | чогось бракує — кожна | потребує рядка з обох боків.
clone_problem_insert_form = Формат вставлення: 0 або 1 | опора | новий рядок.
clone_problem_remove_second = Вилучення приймає один блок — друге поле з $ на початку стало б другим блоком.
clone_problem_replace_form = Формат заміни: старий рядок | новий рядок. Новий має починатися з $TOKEN.
clone_problem_new_missing = Бракує нового рядка. Він має починатися з $TOKEN.
clone_problem_many = Цей рядок трапляється у зразку {0} разів. Додай його рядки даних як додаткові поля, щоб уточнити, який саме потрібен.
clone_problem_taken = Попередня команда вже замінює або вилучає цей рядок. Лише одна команда на місце — видали одну з двох.
clone_problem_made_many = Попередні команди записують цей рядок {0} разів. Додай його рядки даних як додаткові поля, щоб уточнити, який саме потрібен.
clone_donor_missing = Зразка {0} немає на цьому комп'ютері. Без його файлу тут не можна створити команди.
clone_result_blocked = Результат: доки команда червона, плагін узагалі не записує цю будівлю — тому це незмінений зразок.
clone_pick = Вибери рядок зразка ліворуч або команду праворуч. Тут пояснюється її вплив на файл.
clone_new_note = Розділяй кілька рядків через Enter — кожен рядок із $ на початку стає окремою командою, рядки без $ належать до рядка вище.
clone_problem_where = Доки ця команда не підходить, будівля не записується.
clone_hint_need_token = Новий рядок має починатися з $TOKEN. Наступні рядки нижче (точки, позиція) належать до нього.
clone_hint_no_anchor = Цей рядок не може бути опорою. Натисни рядок, що починається з $, або "end", щоб вставити перед ним.
clone_hint_end = Це кінець файлу. «Перед» ставить новий рядок прямо перед ним; «Додати в кінець» робить те саме.
target_pick = Вибери рядок цільового файлу ліворуч або команду праворуч. Тут пояснюється її вплив на цей файл.
target_need_line = Вибери ліворуч рядок цільового файлу, який хочеш змінити.
target_need_new = Напиши новий рядок нижче. Він має відрізнятися від вибраного.
target_effect_add = Додається в кінець файлу.
target_effect_own = Прив'язано до рядка, створеного попередньою командою цього набору правил.
target_effect_at = Відповідає рядку {0}:
target_problem_where = Для цієї цілі команду відхилено; інші цілі обробляються далі.
target_problem_no_token = Рядок має починатися з $TOKEN.
target_problem_block = Багаторядкові записи на кшталт $CONNECTION або $PARTICLE працюють лише через команди з'єднань.
target_problem_cost = Рядки $COST_ не можна додавати в кінець — використай вставлення з рядком $COST_WORK як опорою.
target_problem_cost_work_geometry = Рядки $COST_WORK_* не можна задавати окремо.
target_problem_cost_work = Етап $COST_WORK не можна вилучити окремо.
target_problem_cost_anchor = $COST_RESOURCE_AUTO потребує рядка $COST_WORK як опори.
target_problem_exists = Цей рядок уже є у файлі.
target_problem_missing = Цього рядка немає у файлі.
target_problem_many = Цей рядок трапляється у файлі {0} разів — опора має бути унікальною.
target_problem_same = Старий і новий рядки однакові.
target_problem_replace_form = Заміна потребує рівно двох частин: старий рядок | новий рядок.
target_problem_insert_form = Вставлення потребує рівно трьох частин: 0 або 1 | опора | новий рядок.
target_problem_position = Позиція має бути 0 (перед) або 1 (після).
target_problem_end_after = Після кінця нічого бути не може — використай позицію 0.
target_spread_rule = Діє лише для {0} із {1} цільових файлів. Команда не підходить позначеним червоним (x) у списку вище — набір правил нічого в них не змінить.
target_spread_all = Підходить усім {1} цільовим файлам.
target_spread_some = Підходить лише {0} із {1} цільових файлів — решта через це втрачає ВЕСЬ набір правил.
target_spread_first = Перший невідповідний: {0}
