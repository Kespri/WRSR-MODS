target_problem_link_point = Точка з'єднання потребує рівно трьох чисел.
target_problem_link_equal = Дві точки з'єднання мають відрізнятися.
target_problem_link_exists = Це з'єднання вже є у файлі.
target_problem_link_missing = Цього з'єднання немає у файлі.
