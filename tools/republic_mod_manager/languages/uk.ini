content_vehicles_line = Виробництво транспорту → плагін vehicle_materials: {0}
content_vehicles_help = Цей пакет може зробити {0} матеріалом для виробництва транспорту. Тоді кожному заводу також потрібен {0}, інакше він нічого не виробляє. Для цього потрібен Vehicle Materials. Вибери сам і збережи:
content_vehicles_on = ON: для виробництва транспорту потрібен {0}
content_vehicles_off = OFF: транспорт виробляється як раніше
content_vehicles_own = Ти вже сам додав {0} у Vehicle Materials. Там діють твої значення. Навіть якщо тут вибрано OFF, виробництву транспорту потрібен {0}, доки не видалиш запис на сторінці Vehicle Materials.
content_vehicles_list = ON додає {0} зі значеннями пакета до списку Vehicle Materials. Їх можна змінювати, як у будь-якому власному записі. OFF знову вилучає запис, як кнопка кошика там. Якщо видалиш запис там сам, ця картка згодом покаже OFF.
vehicle_packages_note = Додано пакетами вмісту: {0}. Числа відповідають автотранспорту / залізниці / суднам / літакам. Цих матеріалів тут немає у списку. Перемикай їх ON або OFF на сторінці пакета, картка «Виробництво транспорту». Матеріал, який ти додаси тут сам, збереже твої значення.
vehicle_list_off = У твоєму списку є {0}, але «Плагін увімкнено» ще не стоїть на ON. Тоді виробництво транспорту нічого з цього не витрачає; плагін лише прибирає старі склади. Постав «Плагін увімкнено» на ON на вкладці «Загальні» і збережи.
content_vehicles_active = Увімкнено: заводи транспорту споживають {0}.
content_vehicles_trouble_undecided = Ще не вирішено. Доки не вибереш тут ON або OFF і не збережеш, виробництво транспорту не використовує {0}, а RMM запитує перед кожним запуском гри.
content_vehicles_trouble_missing = Вибрано ON, але плагіна Vehicle Materials немає. Транспорт не використовує {0}. Підпишись на Vehicle Materials у Workshop.
content_vehicles_trouble_off = Вибрано ON, але Vehicle Materials вимкнено. Транспорт не використовує {0}. Увімкни його в списку ліворуч.
content_vehicles_trouble_disabled = Вибрано ON, але в налаштуваннях Vehicle Materials «Плагін активний» має значення OFF. Транспорт не використовує {0}. Задай там ON.
content_vehicles_storage = З ON заводи транспорту гри також отримують сховище для {0}. Це робить Vanilla Buildings: там з'являється набір правил цього пакета, а з OFF він зникає. Увага: сховище матимуть лише заводи, які ти збудуєш пізніше. Наявні заводи його не отримають і з ON більше нічого не вироблятимуть.
content_vehicles_trouble_nostorage = Вибрано ON, але Vanilla Buildings відсутній або вимкнений. Заводи транспорту не мають сховища для {0} й більше нічого не виробляють. Підпишись на Vanilla Buildings та ввімкни його або вибери тут OFF.
startcheck_vehicles_nostorage = {0}: виробництво транспорту ON, але Vanilla Buildings відсутній або вимкнений. Заводи не мають сховища для {1} й нічого не виробляють.
startcheck_vehicles_undecided = {0}: виробництво транспорту ще не вирішено. Транспорт не використовує {1}. Вибери ON або OFF на сторінці пакета.
startcheck_vehicles_missing = {0}: виробництво транспорту ON, але Vehicle Materials відсутній. Транспорт не використовує {1}.
startcheck_vehicles_off = {0}: виробництво транспорту ON, але Vehicle Materials вимкнений. Транспорт не використовує {1}.
startcheck_vehicles_disabled = {0}: виробництво транспорту ON, але налаштування Vehicle Materials мають OFF. Транспорт не використовує {1}.
startcheck_content_gone = {0} більше не в підписках, але досі підключений. Його ресурси й будівлі залишаються в грі, щоб твої збереження й надалі завантажувалися. Щоб позбутися його: підпишися знову й вимкни його на його сторінці.
startcheck_content_gone_vehicles = {0} більше не в підписках, але досі підключений. Його ресурси й будівлі залишаються в грі, щоб твої збереження й надалі завантажувалися, а транспорту й надалі потрібно: {1}. Щоб позбутися його: підпишися знову й вимкни його на його сторінці. Лише матеріал: видали його зі списку Vehicle Materials.
launch_vehicles = У цих пакетах виробництво транспорту ще не використовує ресурс:
launch_vehicles_hint = Відкрий пакет у списку й вибери ON або OFF у «Виробництво транспорту», потім збережи. Після цього RMM більше не запитуватиме.\n\n«Так» усе одно запускає гру, «Ні» скасовує.
