; ============================================================================
;  Buildings Plus 0.2.8 - Configuration
; ============================================================================
;  New buildings declared instead of hand-built. UTF-8, no BOM.
;
;  Every section that is not [buildings_plus] is one building: it names a
;  base-game building to clone (the donor), the building.ini lines that are to
;  be different, and nothing else. At startup - before the game has read its
;  first file - the plugin writes the whole Workshop item out to
;  media_soviet\workshop_wip\<id>\, assets included.
;
;  This plugin patches nothing. It reads no game structure and installs no
;  hook, so no game update can invalidate it. What it can break is a
;  building.ini, and the game says so in its own log.
;
;  Every generated folder carries tesmioloader.stamp; a folder without one is
;  never touched, so an id that collides with a real Workshop subscription is
;  refused rather than overwritten. Delete a folder to have it written again.
;
;  The commands (add, replace, remove, insert) are this plugin's own. The older
;  line and strip rows are also read by Soviet Mod Loader from a mod's
;  tesmio\buildings.ini.
;
;  File format:
;    - Use ';' for full-line comments; no inline comments
;    - Section and key names are case-insensitive
;    - line = ... and desc = ... may repeat; every line is one entry
;    - Never write a $TOKEN inside a ';' comment in a building section
; ============================================================================


; ----------------------------------------------------------------------------
; [buildings_plus]  Plugin switches
; ----------------------------------------------------------------------------
[buildings_plus]

; 1 generates the declared buildings at every game start; 0 unloads the plugin.
; The folders written last time stay where they are and the game keeps loading
; them - set prune = 1 and keep enabled = 1 with no sections to remove them.
enabled = 1

; 1 removes generated folders in workshop_wip whose section is gone or switched
; off. Only folders that carry this plugin's stamp are removed, never a real
; Workshop item and never a folder written by another generator. Default 0.
prune = 0

; 1 rewrites every folder at every launch. 0 - the default - rewrites only when
; the section, the plugin or a donor file changed, which keeps a 300 KB mesh
; from being copied at every start.
always = 0

; 1 writes one line per copied file and per dropped donor line to
; logs\tesmioloader.buildings_plus.log. Default 0.
verbose = 0

; 1 - the default - also puts the Steam owner id into generated folders under
; media_soviet\workshop_wip that another generator wrote, Soviet Mod Loader's
; among them: it leaves $OWNER_ID 0 behind, and the game then reports every one
; of those buildings as a missing Workshop item each time a saved game that uses
; it is loaded. Only that single number is written, every other byte of the file
; stays as it was. All of these have to hold: the folder name is a generated id
; (9000000000..9999999999), the folder carries a tesmioloader.stamp, the file
; names no owner at all, and your own Steam id could be found. A folder that
; already names somebody is never touched, and neither is the stamp. Set it to 0
; to have this plugin keep to its own folders.
repair_owner_ids = 1

; 1 - the default - keeps buildings that already stand in step with the storage
; lines of your generated buildings. When a saved game is loaded, a generated
; building gets the single-resource import and export storages its section has and it
; lacks, empty, behind the storages it has; a storage whose line names another
; size takes it (a smaller one as soon as its stock fits), one whose line names
; another class the resource has is exchanged as soon as it is empty (a class in
; which the resource takes nothing changes no building), and one whose line is gone
; leaves the building again as soon as it is empty. 0 = the storages of
; buildings that already stand stay as they are.
; Needs the TesmioLoader that comes with Republic Mod Manager.
retrofit_storages = 1


; ----------------------------------------------------------------------------
; Building sections
; ----------------------------------------------------------------------------
;   id      optional. The Workshop item id and the folder name, a number
;           between 9000000000 and 9999999999 (never a real Steam item). Leave
;           it out and the plugin assigns one at game start: the highest number
;           seen in 9300000000..9399999999 (catalog, declared ids, folders under
;           workshop_wip) plus one, kept in plugins\buildings_plus.ids.ini under
;           the section name for good - a saved game refers to the folder by
;           that number. Two sections may not share an id.
;   donor   the building the copy starts from - its mesh, textures, collision
;           box, fire points, icon and building.ini. Two spellings:
;             donor = bauxite_mine          a name under
;                                           media_soviet\buildings_types\
;                                           without .ini
;             donor = 1872558150\gravelmine one building of a Workshop item,
;                                           <item>\<object>; searched in the
;                                           game's Workshop folder and in
;                                           media_soviet\workshop_wip
;           A Workshop donor has to be subscribed - nothing of it is shipped
;           with this plugin, the copy is made here on your own machine. Of a
;           multi-building item exactly the named building is taken; its
;           asset folders and loose files travel along, the other buildings
;           stay behind, and the item's own workshopconfig.ini is replaced by
;           one that lists your building alone.
;           Match the shape, not the looks: a mine wants a mine, a factory
;           wants a factory.
;   object  the object subfolder and what $OBJECT_BUILDING names. Letters,
;           digits, _ and - only; defaults to the section name.
;   name    The name in the build menu, and the Workshop item name. Plain text
;           without quotes, written as $NAME_STR.
;           A value that looks like a localisation key - at least one dot and
;           nothing but letters, digits, dot, underscore and hyphen - is looked
;           up in the Localization plugin instead and written as $NAME with the
;           resolved id, exactly like a base-game building. The text then comes
;           from the Localization pack: the game language if the pack carries it,
;           its fallback language otherwise. Without the Localization plugin, or
;           with a key it does not know, the part after the last dot is used as
;           the caption and one warning goes into the log.
;             name = Large Medicine Factory        -> $NAME_STR "Large Medicine Factory"
;             name = localization.lang.medicine    -> $NAME 2000123
;   desc    the Workshop description. Repeatable - each line is one line.
;   life    renderconfig LIFE. Default 3000.
;   enabled 0 skips this section (and lets prune remove its folder).
;
; What is different from the donor is said with COMMANDS against the donor's
; building.ini. Each one touches one place and leaves everything else alone:
;
;   add     = <line>                    a new line, in front of the closing end
;   replace = <old line> | <new line>   the old line goes, the new one takes its place
;   remove  = <old line>                the old line goes
;   insert  = 0 | <anchor> | <line>     the new line in front of the anchor
;   insert  = 1 | <anchor> | <line>     the new line behind the anchor
;
;   All four are repeatable. <old line> and <anchor> are lines of the donor,
;   written exactly as they stand there (spaces at both ends do not count);
;   each must stand in the donor exactly once. The anchor end is the closing
;   line of the file.
;   Lines that belong together are one block: a connection with its points,
;   a pile with its position. Write a block with | between its lines:
;     add = <token line> | <data line> | <data line>
;   Removing or replacing the token line takes its data lines with it. When
;   the same token line stands twice, add its first data line as a second
;   field - that tells the two apart:
;     remove = <token line> | <first data line>
;   An insert may also hang on a line that an earlier command of the section
;   writes. The commands are taken in the order add, replace, remove, insert.
;   A section is all or nothing: one command that does not fit the donor and
;   the building is not written; the log names every command that failed.
;
; Storages count from 0 in the order they stand in the finished file, and a
; pile names the number of its storage - so put a new storage where it belongs
; with insert. Water and sewage storages go last.
;
; The older way - it still works, and a section may use it instead:
;   line    a building.ini line, verbatim. Repeatable, emitted in order, in
;           front of the donor's lines.
;   strip   a $TOKEN to take out of the donor without putting anything back.
;           Repeatable.
;
; With line and strip the donor's file is copied line for line and a line is
; dropped only when a declared line replaces it. Most tokens replace only
; themselves. Four families replace each other:
;   $NAME and $NAME_STR
;   every $TYPE_*                               only one may be in effect
;   every $STORAGE* and $RESOURCE_VISUALIZATION  the visualisation counts
;                                                storages from zero, so
;                                                re-declaring them moves piles
;   $PRODUCTION, $CONSUMPTION, $CONSUMPTION_PER_SECOND - a recipe goes whole
; $PRODUCTION_SEWAGE_POLLUTION and $CONSUMPTION_WATER_REQUIRED_QUALITY are
; settings, not recipe lines, and survive a new recipe.
; The first $TOKEN anywhere in a line is what counts, because that is what the
; game's own parser matches - a building.ini has no comment syntax.


; Example, DISABLED by default: a chemist's shop cloned from the clothes shop.
; `medicine` has to exist as a resource (for example through the Resources
; plugin) before this makes sense.
[example_pharmacy]
enabled = 0
donor   = shop_clothes
name    = Pharmacy
desc    = A chemist's shop. Sells medicine, and nothing else.
replace = $WORKERS_NEEDED 15 | $WORKERS_NEEDED 8
replace = $CITIZEN_ABLE_SERVE 7 | $CITIZEN_ABLE_SERVE 6
replace = $STORAGE_DEMAND_MEDIUMADVANCED RESOURCE_TRANSPORT_COVERED 15 | $STORAGE_SPECIAL RESOURCE_TRANSPORT_COVERED 8 medicine
