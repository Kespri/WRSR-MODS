; ============================================================================
;  Vehicle Materials Plugin 0.4.16 - Configuration
;  Keep this INI beside vehicle_materials.dll (in the plugins folder of the loader or of the Workshop package).
;  tesmioloader\plugins\vehicle_materials.ini wins over the INI beside
;  the DLL; user_config\vehicle_materials.ini (Republic Mod Manager) is laid
;  over either, key by key.
; ============================================================================
;  This file selects mod resources used when the game produces vehicles.
;  The resource list of Resources Plus or Resources remains the authoritative
;  list of resources available to the game; this file only assigns
;  vehicle-category coefficients to those names.
;
;  File format:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments
;    - Do not append inline comments to settings
;    - Section and key names are case-insensitive
;    - Every active setting requires a non-empty value
;    - Unknown or repeated sections and keys are rejected
;    - A line containing only '-' characters is accepted as a separator
;
;  Safety and fallback behavior:
;    - Original game files and native vehicle materials are NEVER modified.
;    - What the factories need for a material is added in memory only.
;    - The complete configuration is validated before the hook is installed.
;    - Any validation, dependency or game-build error rejects the whole plugin.
;    - A protected runtime fault disables only custom material additions for
;      the rest of the session; native vehicle production remains active.
;    - Configuration changes require a game restart, but no DLL rebuild.
;
;  Requirements:
;    - TesmioLoader API 4
;    - Resources Plus or Resources with its resource list (mandatory)
;    - For WRSR 1.2.0.9
;
;  Limits:
;    - Maximum configuration size: 1 MiB
;    - Maximum resources: 32
;    - Maximum key or value length: 63 characters
;    - Coefficients: finite numbers from 0 to 1,000,000
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; Enable plugin. Only the exact values 0 and 1 are accepted.
; Republic Mod Manager sets this to 1 in your personal values when you switch
; the vehicle part of a content package on. With 0, or with no material in the
; list, the plugin does one thing only: it takes the storages it gave to
; factories out again (see factory_storages).
enabled = 0

; Diagnostic logging. Only the exact values 0 and 1 are accepted.
;   0 = normal logging
;   1 = configured materials and vehicle-build details
; Detail log: logs\tesmioloader.vehicle_materials.log
debug = 0

; Shared maximum for repeated runtime warnings and diagnostic messages.
; Allowed range: 0 .. 10000. A value of 0 suppresses those repeated messages.
debug_limit = 80

; Storages in the vehicle factories. Only the exact values 0 and 1 are accepted.
;   1 = every production line that takes materials gets a storage for each
;       material of this configuration: the factories of the game, of its
;       DLCs and of the Workshop - new ones and, when a saved game is loaded,
;       the ones that already stand. A factory whose own building file has a
;       storage for a material keeps that one. The storage of a material
;       that is no longer in the list is taken out of the factories again
;       when a saved game is loaded, as soon as it is empty.
;       The storage type is open, covered or gravel, whichever the material
;       fits best; a material of another class (liquids, cement ...) gets no
;       storage and needs a line of its own. Factories that already stand
;       need the TesmioLoader from Republic Mod Manager (b0.4.5-rmm.3 or newer).
;   0 = the plugin makes no storage. Every factory then needs a line
;       $STORAGE_IMPORT_SPECIAL <class> <tons> <resource> for each material.
; In both cases the plugin enters each material as consumption of the
; factories, which the game requires before a factory accepts a resource.
; Optional: without the key the value is 1.
factory_storages = 1

; Size of each of these storages in tons. Allowed range: 1 .. 10000.
; Factories that already stand take a new size when a saved game is loaded; a
; smaller size waits until the stock fits.
; Optional: without the key the value is 50.
factory_storage_capacity = 50


; ----------------------------------------------------------------------------
; [resources]  Resources used for vehicle production
; ----------------------------------------------------------------------------
[resources]

; Number of consecutive resource0, resource1, ... entries below.
; Allowed range: 0 .. 32. Entries at or above count are rejected.
count = 0

; Each name must be unique and must exist in the resource list of
; Resources Plus or Resources.
; Unsafe characters, whitespace and path separators are rejected.

; Example extension: number new entries on from the last one, without gaps.
; With an empty list (count = 0):
; resource0 = copper
; resource1 = composites
; Then set count = 2 and add their category coefficients below.


; ----------------------------------------------------------------------------
; Vehicle categories - consumption coefficients
; ----------------------------------------------------------------------------
; Only names listed in [resources] are accepted as keys.
; A missing coefficient or the exact value 0 disables that resource for the
; respective category. Negative, non-finite and malformed values are rejected.
; Sections must remain present even when they contain no active coefficients;
; only [rocket] may be left out.
; ----------------------------------------------------------------------------

[road]
; Road vehicles

[rail]
; Rail vehicles and trains

[ship]
; Ships

[airplane]
; Airplanes

[rocket]
; Rocket parts (rocket DLC). Optional: a material without a value here asks
; nothing of rocket parts.


; ----------------------------------------------------------------------------
; [mapping]  Optional vehicle-type overrides
; ----------------------------------------------------------------------------
; Automatic detection:
;   Types 1, 2 (road, road service)      -> road
;   Types 3, 4, 5 (wagon, locomotive, rail service) -> rail
;   Type 6 (ship)                        -> ship
;   Types 8, 10 (airplane, helicopter)   -> airplane
;   Types 9, 7 (rocket part, cabin)      -> rocket
;   Other types                          -> rail
; Vehicles pulled by horses ($HORSE lines) take no custom material at all, and
; the works that build them (horse wagon works, stud farm) get no storage.
;
; Values:
;   -1 = automatic
;    0 = road
;    1 = rail
;    2 = ship
;    3 = airplane
;    4 = rocket
;
; Unknown type keys and values outside -1 .. 4 are rejected.
; Omitted type keys default to -1. Normally leave this section unchanged.
; ----------------------------------------------------------------------------
[mapping]
type0 = -1
type1 = -1
type2 = -1
type3 = -1
type4 = -1
type5 = -1
type6 = -1
type7 = -1
type8 = -1
type9 = -1
type10 = -1
type11 = -1
type12 = -1
type13 = -1
type14 = -1
type15 = -1
